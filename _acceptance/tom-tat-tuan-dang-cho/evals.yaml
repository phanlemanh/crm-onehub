schema_version: 1
slug: tom-tat-tuan-dang-cho

evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.ttdc_khoi_cho
    paths:
      - "apps/app/app/(app)/[slug]/okr/khoi-tom-tat.tsx"
      - "apps/app/lib/messages/okr-toan-canh.ts"
      - "packages/validation/src/okr-tom-tat.ts"
      - "apps/app/test/tom-tat-tuan-dang-cho.dom.tsx"
    expected: |
      Ca "ttdc-khoi-cho" dung KhoiTomTat that voi tRPC gia tra troLyTomTatOutput.parse({ban:null, dangSoan:false,
      chuaCapNhat:false, choBan:{kieu:"toi-luc", luc:"2026-10-26T23:00:00.000Z"}}) (06:00 thu Ba 27/10 gio VN).
      [data-khoi="tom-tat"] co mat, tieu de "Tóm tắt tuần của Kara", [data-trang-thai="ST-tomtat-cho-ban-dau"] co
      dung mot dong, textContent bang dung chuoi viet truoc "Kara gửi bản tóm tắt đầu tiên vào khoảng 06:00 thứ Ba,
      27/10 — sáng hôm sau ngày cập nhật thứ Hai." Doi chung duong: cung fixture khong co choBan -> khoi() la null
      (hanh vi cu). Hoi lai mot lan: dong ho gia dat now = luc - 60 giay, tRPC gia dem luot goi; tien dong ho 61 giay
      -> dung them 1 luot goi okr.troLyTomTat; tien them 10 phut -> khong them luot nao.
      CHIEU DO: ban sao bo nhanh choBan khoi KhoiTomTat -> do "ttdc-khoi-cho: khong co dong cho ban dau"; ban sao bo
      hen gio o toi-luc -> do "ttdc-khoi-cho: khong hoi lai khi toi luc".

  - id: E2
    criterion: AC-1
    executor: test
    layer: backend-effect
    cmd: config:executors.test.ttdc_api_cho
    paths:
      - "apps/api/src/okr/tro-ly.service.ts"
      - "packages/db/src/okr-tom-tat.ts"
      - "packages/validation/src/okr-tom-tat.ts"
      - "apps/api/test/tom-tat-tuan-dang-cho.spec.ts"
    expected: |
      Ca "ttdc-api-cho" tren CSDL thu voi bo OKR mau (MOC_MAU 12/11/2026 15:00 gio VN, thu Nam; chu ky quy 4 pha
      dang-chay, updateWeekday=1; bo mau co Cap nhat tuan thu Hai 09/11). Mot phong co cap nhat duoc bat bang
      okr.setProgram that, khong OkrTomTat va khong viec okr-tom-tat-tuan nao. Goi okr.troLyTomTat that (tRPC) cua
      truong phong, ket qua parse bang troLyTomTatOutput: now = 2026-11-12T09:00:00Z (16:00 thu Nam, luot xep thu Ba
      10/11 da qua) -> ban null, dangSoan false, chuaCapNhat false, choBan {kieu:"toi-luc",
      luc:"2026-11-16T23:00:00.000Z"} (06:00 thu Ba 17/11); now = 2026-11-09T22:00:00Z (05:00 thu Ba 10/11, truoc gio
      xep) -> luc "2026-11-09T23:00:00.000Z".
      CHIEU DO: ban sao bo loi goi choBanDauTomTat trong troLyTomTat -> do "ttdc-api-cho: thieu choBan o phong bat
      chua co ban".

  - id: E3
    criterion: AC-2
    executor: test
    cmd: config:executors.test.ttdc_luat_gio
    paths:
      - "packages/db/src/okr-tom-tat.ts"
      - "apps/agent/agent/lib/okr/lich-tom-tat.ts"
      - "apps/api/test/tom-tat-tuan-dang-cho.spec.ts"
    expected: |
      Ca "ttdc-luat-gio" goi ham thuan lanXepTomTatKe(now, updateWeekday) tren ma tran viet truoc day du 7 ngay cap
      nhat x 4 vi tri cua now (05:59 cua ngay xep, 06:00 dung gio xep, 06:01 cua ngay xep, 12:00 cua ngay cap nhat) =
      28 o; moi o so voi gia tri ISO viet tay trong bang (khong tinh bang chinh ham). So assert = 28 (dem va in).
      Lenh chay hai lan voi TZ=UTC va TZ=America/Los_Angeles, ca hai cung ket qua; moi lan ca tu assert
      Intl.DateTimeFormat().resolvedOptions().timeZone bang dung TZ da dat (khong thi do "ttdc-luat-gio: TZ khong ap").
      Ca con kiem thuCapNhatCuaNgayXep(D) = thu cua D-1 cho du 7 ngay, lanXepTomTatHomNay chi tra gio xep khi hom nay
      la ngay xep cua chu ky va da qua gio, va lich-tom-tat.ts cua tac tu import gioXepCua tu @crm/db/okr-tom-tat
      (khong tu khai gioXepCua rieng).
      CHIEU DO: ban sao doi thuCapNhatCuaNgayXep thanh thu cua chinh ngay xep -> do "ttdc-luat-gio: lech o
      1/05:59-ngay-xep"; ban sao dung gio may (Date#setHours) thay gioXepCua -> do o lan chay TZ=America/Los_Angeles.

  - id: E4
    criterion: AC-3
    executor: test
    layer: backend-effect
    cmd: config:executors.test.ttdc_mot_luat
    paths:
      - "packages/db/src/okr-tom-tat.ts"
      - "apps/agent/agent/lib/okr/lich-tom-tat.ts"
      - "apps/api/test/tom-tat-tuan-dang-cho.spec.ts"
    expected: |
      Ca "ttdc-mot-luat" tren CSDL thu voi bo OKR mau, voi tung updateWeekday trong {1, 4, 7} (doc luc tai 12:00 gio VN
      cua ngay cap nhat: thu Hai 09/11, thu Nam 12/11, Chu nhat 15/11): phong bat co cap nhat trong cua so, luc =
      choBanDauTomTat(...).luc. Chay chayXepTomTat that cua tac tu voi task {dueAt: luc} va now = luc -> dung 1
      agentTask kind okr-tom-tat-tuan co payload.departmentId = phong, nac "bat". Sau khi don viec, chay voi dueAt =
      now = luc - 1 ngay -> 0 viec cho phong. Nhanh tuan sau (updateWeekday=1): doc tai 10:00 thu Tu 18/11 gio VN ->
      luc = 2026-11-23T23:00:00Z; (ii) khong cap nhat moi roi chay chayXepTomTat o luc -> 0 viec; (i) them mot cap nhat
      thu Hai 23/11 qua okr.moCapNhat + okr.guiCapNhat that cua chu KR roi chay o luc -> dung 1 viec. So o = 3 thu x 2 +
      2 = 8, dem va in.
      CHIEU DO: ban sao doi lanXepTomTatKe so thu cua chinh ngay xep (khong lui mot ngay) -> do "ttdc-mot-luat: luot
      xep tai luc da bao khong xep viec (thu 1)".

  - id: E5
    criterion: AC-4
    executor: test
    cmd: config:executors.test.ttdc_dang_xep
    paths:
      - "packages/db/src/okr-tom-tat.ts"
      - "apps/api/src/okr/tro-ly.service.ts"
      - "apps/app/app/(app)/[slug]/okr/khoi-tom-tat.tsx"
      - "apps/app/lib/messages/okr-toan-canh.ts"
      - "apps/api/test/tom-tat-tuan-dang-cho.spec.ts"
      - "apps/app/test/tom-tat-tuan-dang-cho.dom.tsx"
    expected: |
      Ca API "ttdc-dang-xep": phong bat chua co ban, updateWeekday=1, bo OKR mau. (a) now = 2026-11-09T23:05:00Z
      (06:05 thu Ba 10/11 gio VN), co agentTask okr-tom-tat-xep dueAt = 2026-11-09T23:00:00Z, finishedAt null ->
      choBan {kieu:"dang-xep"}; (b) cung task da dong -> choBan {kieu:"toi-luc", luc:"2026-11-16T23:00:00.000Z"}; (c)
      khong co task nao -> cung toi-luc do; (d) ngay khong khop: now = 2026-11-10T23:05:00Z (06:05 thu Tu 11/11), viec
      okr-tom-tat-xep dueAt 2026-11-10T23:00:00Z chua dong -> {kieu:"toi-luc", luc:"2026-11-16T23:00:00.000Z"}. Ca DOM
      "ttdc-dang-xep": choBan dang-xep -> [data-trang-thai="ST-tomtat-dang-xep"] voi dung chuoi "Kara đang xếp bản tóm
      tắt đầu tiên — thường có trong vài phút."; tRPC gia duoc goi lai sau hoiLaiMs va dung sau tranChoMs (dong ho gia).
      CHIEU DO: ban sao bo kiem viec xep chua dong -> do "ttdc-dang-xep: (a) ra toi-luc, can dang-xep"; ban sao bo kiem
      thu cua ngay -> do "ttdc-dang-xep: (d) ra dang-xep o ngay khong khop".

  - id: E6
    criterion: AC-5
    executor: test
    cmd: config:executors.test.ttdc_tam_dung
    paths:
      - "packages/db/src/okr-tom-tat.ts"
      - "apps/api/src/okr/tro-ly.service.ts"
      - "apps/app/app/(app)/[slug]/okr/khoi-tom-tat.tsx"
      - "apps/app/lib/messages/okr-toan-canh.ts"
      - "apps/api/test/tom-tat-tuan-dang-cho.spec.ts"
      - "apps/app/test/tom-tat-tuan-dang-cho.dom.tsx"
    expected: |
      Ca API "ttdc-tam-dung" (het tran dua vao bang okr.setProgram that voi aiTranThangUsd = 0; "chua-co-khoa-mo-hinh"
      ghi bang completeTask that cua tac tu tren mot viec okr-kiem-san-sang): (a) het tran, now 12/11 voi
      updateWeekday=1, luc 17/11 cung thang -> {kieu:"tam-dung", lyDo:"het-tran-thang", moLai:"2026-12-01"}; (b) het
      tran, choBanDauTomTat tai now = 2026-11-30T05:00:00Z (12:00 thu Hai 30/11) -> luc "2026-11-30T23:00:00.000Z"
      (06:00 thu Ba 01/12 gio VN, thang sau) -> toi-luc; (c) chua co khoa -> {kieu:"tam-dung",
      lyDo:"chua-co-khoa-mo-hinh", moLai:null}. Ca DOM "ttdc-tam-dung": [data-trang-thai="ST-tomtat-tam-dung"] chua
      [data-kara-state="off"], chuoi dung "Kara tạm nghỉ tóm tắt tuần tới 01/12." va "Kara chưa tóm tắt được: quản
      trị chưa nối mô hình AI."; khong chuoi nao khop mau gio /\d\d:\d\d/ hay mau so tien
      /\d[\d.,]*\s*(₫|đ(?![\p{L}\p{N}])|USD)/u va /\$\s*\d/. Doi chung duong cua mau: "1.200.000 đ", "5 USD", "$5" bi bat; hai chuoi
      dung cua AC-5 lot.
      CHIEU DO: ban sao bo nhanh tam-dung -> do "ttdc-tam-dung: (a) ra toi-luc khi het tran".

  - id: E7
    criterion: AC-6
    executor: test
    cmd: config:executors.test.ttdc_khong_doi
    paths:
      - "packages/db/src/okr-tom-tat.ts"
      - "apps/api/src/okr/tro-ly.service.ts"
      - "apps/app/app/(app)/[slug]/okr/khoi-tom-tat.tsx"
      - "apps/api/test/tom-tat-tuan-dang-cho.spec.ts"
      - "apps/app/test/tom-tat-tuan-dang-cho.dom.tsx"
    expected: |
      Ca API "ttdc-khong-doi" ma tran viet truoc 9 o tren CSDL thu, cung mot phong doi cau hinh qua okr.setProgram that
      giua cac o: nac tat (aiOn false), viec tat, don vi chua bat, che do an, ban nac bat dang hien, ban nac bat bi giu
      (can-xem), ban nac bat qua 8 ngay, chu ky pha khac dang-chay (quy 3, da-dong), phong chua cap nhat (doc tai
      28/12). Moi o: Object.keys(ket qua) khong chua "choBan"; bon o dau ket qua dung {ban:null, dangSoan:false,
      chuaCapNhat:false}. So o = 9 (dem va in). Doi chung duong: phong bat chua co ban cung CSDL co choBan toi-luc;
      phong tung co ban nac an roi bat van co choBan toi-luc. Ca DOM "ttdc-khong-doi": fixture khong choBan -> khoi null; fixture
      dangSoan va chuaCapNhat -> dung data-trang-thai cu ST-tomtat-dang-soan, ST-tomtat-chua-cap-nhat.
      CHIEU DO: ban sao bo dieu kien "chua tung co ban nac bat" -> do "ttdc-khong-doi: o ban-bi-giu co choBan"; ban sao
      bo dieu kien pha chu ky -> do "ttdc-khong-doi: o chu-ky-khac-pha co choBan".

  - id: E8
    criterion: AC-7
    executor: test
    cmd: config:executors.test.ttdc_mui_gio
    paths:
      - "apps/app/app/(app)/[slug]/okr/khoi-tom-tat.tsx"
      - "apps/app/lib/messages/okr-toan-canh.ts"
      - "apps/app/test/tom-tat-tuan-dang-cho.dom.tsx"
    expected: |
      Ca "ttdc-mui-gio" chay hai lan voi TZ=UTC va TZ=America/Los_Angeles: luc "2026-10-26T23:00:00.000Z" -> locale vi
      dung chuoi "Kara gửi bản tóm tắt đầu tiên vào khoảng 06:00 thứ Ba, 27/10 — sáng hôm sau ngày cập nhật thứ Hai."; locale
      en dung chuoi viet truoc chua "06:00", "Tuesday", "27/10" va khac chuoi vi. Moi chuoi cua dong cho (bon trang
      thai, vi va en) lay tu okrToanCanhMessages(locale).tomTat, khong rong. Moi lan chay ca tu assert
      Intl.DateTimeFormat().resolvedOptions().timeZone bang dung TZ da dat.
      CHIEU DO: ban sao bo timeZone khoi dinh dang gio -> do o lan TZ=America/Los_Angeles "ttdc-mui-gio: gio lech
      (16:00)".

  - id: E9
    criterion: AC-7
    executor: ui-check
    layer: ui-observed
    cmd: config:executors.script.ttdc_man
    steps:
      - "Chay O TIEN CANH tu goc kho, Bash timeout 600000, nguyen van: TTDC_CHEP_ANH=1 EVAL= bun scripts/lan-do/tien-de.mjs --chay \"bun _acceptance/tom-tat-tuan-dang-cho/rang/do-man.mjs\" (ban do chi chep anh sang _acceptance/tom-tat-tuan-dang-cho/evidence/ khi co TTDC_CHEP_ANH=1)"
      - "Doc dong KET LUAN cuoi: ma 0 = khong dong SAI; ma 1 = co dong SAI; ma 2 = khong do duoc"
      - "Mo cac anh trong _acceptance/tom-tat-tuan-dang-cho/evidence/ va doi chieu bang mat voi Expected"
    inputs:
      - _acceptance/tom-tat-tuan-dang-cho/evidence/
    paths:
      - "apps/app/app/(app)/[slug]/okr/khoi-tom-tat.tsx"
      - "apps/app/lib/messages/okr-toan-canh.ts"
      - "_acceptance/tom-tat-tuan-dang-cho/rang/do-man.mjs"
    expected: |
      Ban do dung bo OKR mau tren phien do rieng, bat Tom tat tuan cho mot phong co cap nhat bang okr.setProgram that,
      dang nhap truong phong, mo Hop tuan cua phong o 1440 va 375. Anh tom-tat-cho-1440, tom-tat-cho-375: the "Tóm tắt
      tuần của Kara" o dau Hop tuan, dong "Kara gửi bản tóm tắt đầu tiên vào khoảng 06:00 <thứ>, <dd/mm> — sáng hôm
      sau ngày cập nhật <thứ>." nhin thay tron, khong bi cat, khong tran ngang trang o 375. Ban do in "SAI" khi
      [data-trang-thai="ST-tomtat-cho-ban-dau"] vang, cao 0 hay nam ngoai khung nhin sau khi cuon toi; thieu anh -> khong
      dat.
      CHIEU DO: EVAL=chieu-do chay tren phong chua bat (nac tat) -> ban do in "SAI KHONG CO DONG CHO 1440" va thoat 1.
