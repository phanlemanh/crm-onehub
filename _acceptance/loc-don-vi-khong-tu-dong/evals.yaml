schema_version: 1
slug: loc-don-vi-khong-tu-dong

# Đo trên trình duyệt thật: _acceptance/loc-don-vi-khong-tu-dong/rang/man-loc.mjs qua scripts/lan-do/tien-de.mjs (phiên
# đo riêng của cây đang xét, bộ OKR mẫu). Bàn đo giữ thủ tục tRPC okr.danhSach bằng page.route tới khi rang thả, nên
# «còn đang nạp» là một khoảng có chủ đích, không phải may rủi mạng. Trong khoảng giữ, rang lấy mẫu DOM mỗi 50 ms.
# Một lượt in một dòng cho mỗi AC; mỗi eval đọc dòng của mình. Hai chiều của mỗi thước: đối chứng dương trên vật lành,
# phá thử trên bản sao (LDV_PHA=<tên>) cùng fixture, ghim thông điệp SAI AC-n.
evals:
  - id: E1
    criterion: AC-1
    executor: script
    layer: ui-observed
    cmd: config:executors.script.ldv_man
    paths:
      - "apps/app/app/(app)/[slug]/okr/theo-don-vi/**"
      - packages/ui/src/components/data-table.tsx
      - _acceptance/loc-don-vi-khong-tu-dong/rang/man-loc.mjs
    expected: |
      1440: mở «Lọc», vào mặt Trạng thái, tích giá trị đầu, giữ okr.danhSach; lấy mẫu tới khi thả và dòng mới hiện; rồi
      tích giá trị thứ hai không mở lại menu. In "AC-1 1440: <k> mau · menu dong <a> · menu con dong <b> · da tich <t> ·
      tich lan hai <h>". DUNG khi k >= 3, a = 0, b = 0, t = co, h = co; k < 3 là "KHONG DO DUOC: khong bat duoc luc cho" mã 2.
      CHIEU DO (LDV_PHA=go-bang: trả lại nhánh isPlaceholderData về khung chờ) -> "SAI AC-1: menu Loc dong khi doi loc", mã 1.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: script
    layer: ui-observed
    cmd: config:executors.script.ldv_man
    paths:
      - "apps/app/app/(app)/[slug]/okr/theo-don-vi/**"
      - packages/ui/src/components/data-table.tsx
      - _acceptance/loc-don-vi-khong-tu-dong/rang/man-loc.mjs
    expected: |
      390: bấm nút mở khung Lọc, mở «Lọc», tích một giá trị, giữ okr.danhSach, lấy mẫu tới khi dòng mới hiện. In
      "AC-2 390: <k> mau · khung thu <a> · aria-expanded sai <b>". DUNG khi k >= 3, a = 0, b = 0.
      CHIEU DO (LDV_PHA=go-bang) -> "SAI AC-2: khung Loc thu lai khi doi loc", mã 1.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: script
    layer: ui-observed
    cmd: config:executors.script.ldv_man
    paths:
      - "apps/app/app/(app)/[slug]/okr/theo-don-vi/**"
      - packages/ui/src/components/data-table.tsx
      - packages/ui/src/components/vung-dang-tai.tsx
      - _acceptance/loc-don-vi-khong-tu-dong/rang/man-loc.mjs
    expected: |
      Cùng lượt với E1 ở 1440. Mỗi mẫu trong lúc giữ đọc: số [data-hang-muc-tieu], có [data-khung-xuong] không, phần tử
      [aria-busy=true] nào bọc [data-slot=table-container], hàng công cụ và nút Lọc có nằm trong [data-dang-tai] không,
      opacity tính được của vùng bảng. In "AC-3 1440: <k> mau · bang go <g> · khung cho <c> · ban sai <s> · cong cu mo
      <m> · sau khi ve ban <v>". DUNG khi g = 0, c = 0, s = 0, m = 0, v = 0 và mọi mẫu lúc giữ có opacity vùng bảng < 1.
      CHIEU DO (LDV_PHA=khong-mo: DataTable bỏ VungDangTai) -> "SAI AC-3: vung bang khong ban khi doi loc", mã 1;
      (LDV_PHA=go-bang) -> "SAI AC-3: bang bi go khi doi loc", mã 1.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: script
    layer: ui-observed
    cmd: config:executors.script.ldv_man
    paths:
      - "apps/app/app/(app)/[slug]/okr/theo-don-vi/**"
      - packages/ui/src/components/data-table.tsx
      - _acceptance/loc-don-vi-khong-tu-dong/rang/man-loc.mjs
    expected: |
      1440: chọn tổ hợp lọc không khớp mục tiêu nào trong bộ OKR mẫu; sau khi danh sách về đọc khung không khớp và menu;
      rồi bấm nút bỏ lọc trong khung, giữ okr.danhSach và lấy mẫu tới khi thả và dòng hiện lại. In "AC-4 1440: khong khop
      <a> · menu mo <b> · <k> mau · khung cho khi bo loc <c>". DUNG khi a = co, b = co, k >= 3, c = 0; k < 3 là
      "KHONG DO DUOC: khong bat duoc luc cho khi bo loc" mã 2.
      CHIEU DO (LDV_PHA=go-bang) -> "SAI AC-4: bo loc qua khung cho", mã 1.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: script
    layer: ui-observed
    cmd: config:executors.script.ldv_man
    paths:
      - "apps/app/app/(app)/[slug]/okr/theo-don-vi/**"
      - _acceptance/loc-don-vi-khong-tu-dong/rang/man-loc.mjs
    expected: |
      1440: đổi lọc, giữ okr.danhSach rồi trả 500; lấy mẫu từ lúc thả tới khi khung lỗi hiện và thêm 500 ms; bấm «Thử lại»
      và đếm lượt gọi okr.danhSach. In "AC-5 1440: <k> mau · khung loi <a> · dong cu treo <b> · ban con <c> · goi lai <n>".
      DUNG khi k >= 3, a = co, b = 0, c = 0, n >= 1; k < 3 là "KHONG DO DUOC: khong bat duoc sau loi" mã 2.
      CHIEU DO (LDV_PHA=loi-treo: nhánh isError đứng sau nhánh giữ bảng) -> "SAI AC-5: loi doi loc treo bang cu", mã 1.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.ldv_giu
    paths:
      - "apps/app/app/(app)/[slug]/okr/theo-don-vi/**"
      - apps/app/test/loc-don-vi-giu-bang.spec.ts
    expected: |
      Bài kiểm của hàm giữ dữ liệu (giuKhiChiDoiLoc), ma trận viết trước bốn ca: cùng chu kỳ, cùng đơn vị, khác lọc →
      trả dữ liệu cũ; khác đơn vị → undefined; khác chu kỳ → undefined; chưa có truy vấn trước → undefined. Bốn assert.
      CHIEU DO (hàm luôn trả dữ liệu cũ) -> ca "khac don vi" đỏ với thông điệp ldv-giu: doi don vi giu bang cu.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6m
    criterion: AC-6
    executor: script
    layer: ui-observed
    cmd: config:executors.script.kcd_man
    paths:
      - "apps/app/app/(app)/[slug]/okr/theo-don-vi/**"
      - packages/ui/src/components/khung-xuong.tsx
      - _acceptance/khung-cho-don-vi-mot-hinh/rang/man-khung-cho.mjs
    expected: |
      Rang của hồ sơ đã ký khung-cho-don-vi-mot-hinh chạy nguyên: dòng "AC-3" đổi đơn vị vẫn có thân bảng là khung
      bang-hai-dong và hàng công cụ thật; exit 0. Đối chứng hồi quy, không phải thước mới.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6s
    criterion: AC-6
    executor: script
    layer: ui-observed
    cmd: config:executors.script.ldv_man
    paths:
      - "apps/app/app/(app)/[slug]/okr/theo-don-vi/**"
      - _acceptance/loc-don-vi-khong-tu-dong/rang/man-loc.mjs
    expected: |
      1440: có bảng của một chu kỳ; đổi sang chu kỳ khác của bộ OKR mẫu bằng ô chọn chu kỳ, giữ okr.danhSach, lấy mẫu tới
      khi thả. In "AC-6 chu ky: <k> mau · dong cu <d> · khung bang-hai-dong <b>". DUNG khi k >= 3, d = 0 và mọi mẫu có
      [data-khung-xuong=bang-hai-dong]; k < 3 là "KHONG DO DUOC: khong bat duoc luc doi chu ky" mã 2.
      CHIEU DO (LDV_PHA=giu-moi-khoa: placeholderData luôn trả dữ liệu cũ) -> "SAI AC-6: doi chu ky giu bang cu", mã 1.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E7
    criterion: AC-7
    executor: test
    cmd: config:executors.test.ldv_bang
    paths:
      - packages/ui/src/components/data-table.tsx
      - packages/ui/src/components/vung-dang-tai.tsx
      - packages/ui/test/data-table-tai-lai.dom.tsx
    expected: |
      Bài DOM dựng DataTable ba lần (refreshing true, false, không truyền) cùng cột, dòng, mặt lọc. true: đúng một
      [data-slot=vung-dang-tai] mang aria-busy="true" và data-dang-tai, chứa [data-slot=table-container], không chứa nút
      Lọc, ô tìm hay phân trang; false: có vùng, không aria-busy, không data-dang-tai; không truyền: không vùng nào.
      CHIEU DO (vùng bọc cả gốc DataTable) -> "ldv-bang: nut Loc nam trong vung mo"; (luôn bọc) -> "ldv-bang: khong truyen
      van co vung".
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E8
    criterion: AC-1, AC-2, AC-3
    executor: ui-check
    layer: ui-observed
    cmd: config:executors.script.ldv_man
    paths:
      - "apps/app/app/(app)/[slug]/okr/theo-don-vi/**"
      - packages/ui/src/components/data-table.tsx
      - _acceptance/loc-don-vi-khong-tu-dong/rang/man-loc.mjs
    steps:
      - "Cùng lượt đo với E1–E5"
      - "1440: lúc giữ okr.danhSach sau khi tích một giá trị → E8-cho-1440.png (menu mở, bảng mờ)"
      - "1440: sau khi thả → E8-xong-1440.png (menu mở, dòng mới)"
      - "390: lúc giữ, khung Lọc mở → E8-cho-390.png"
    expected: |
      Ba ảnh trong evidence/. Người chấm thấy menu Lọc và menu con đang mở trên bảng mờ ở ảnh chờ, cùng menu đó trên bảng
      rõ ở ảnh xong; ở 390 khung Lọc còn mở trên bảng mờ; hàng công cụ không mờ ở cả ba ảnh.
    evidence_required: [run_id, exit_code, verifier, verified_at, output, screenshot]
