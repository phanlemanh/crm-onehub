schema_version: 1
feature_slug: dat-okr-trong-crm
evals:
  - id: E1
    criterion: AC-1
    executor: test
    layer: backend-effect
    cmd: config:executors.test.dok_chu_ky
    paths: [apps/api/src/okr/**, packages/validation/src/okr-chu-ky.ts, packages/db/src/onboarding-nhac.ts, apps/api/test/okr.spec.ts, apps/api/test/okr-san.ts]
    expected: "exit 0; sàn okr-san dựng AppModule thật, gieo bốn người (admin, member, okr, owner) qua gieoThanhVien và cookie mintPhien. Quản trị tạo năm 2026 (01/01–31/12) rồi quý 4 (01/10–31/12, cha = năm, nghỉ Tết 15/02–21/02/2027 để ở năm sau bị từ chối — dùng nghỉ 01/11–03/11 hợp lệ, ngày cập nhật 1), chuyển pha quý sang dang-chay. Đọc lại bằng db.okrCycle.findMany: MA TRẬN 2 dòng × [kind, parentId, startsOn, endsOn, breakStartsOn, breakEndsOn, updateWeekday, phase] = 16 khẳng định viết trước, ngày so theo chuỗi yyyy-mm-dd (ngày lịch Việt Nam, không lệch múi giờ). Ma trận từ chối viết trước: quý ngoài năm cha · quý chồng quý khác · pha lùi (dang-chay → lap-ke-hoach) · member tạo · okr tạo = 5 ca, mỗi ca mã và câu lỗi ghim, số dòng không đổi. okr.cycles trả current = quý dang-chay chứa ngày hôm nay (đóng băng Date qua tham số của hàm thuần chonChuKyHienTai với ngày 15/11/2026 và 15/01/2027 → hai kết quả khác nhau). CHIỀU ĐỎ: bản sao service bỏ kiểm quý-trong-năm → ca 1 không bị từ chối, bài đỏ in số dòng thừa; bản sao lưu startsOn bằng new Date(chuoi) không qua ngày lịch → khẳng định chuỗi ngày đỏ ở múi giờ UTC-8 (bài chạy với TZ=America/Los_Angeles một lượt)."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: test
    layer: backend-effect
    cmd: config:executors.test.dok_chuong_trinh
    paths: [apps/api/src/okr/**, packages/validation/src/okr-chuong-trinh.ts, apps/api/test/okr.spec.ts]
    expected: "exit 0; quản trị ghi cấu hình (objectiveCap 2, krCap 2, capMode canh-bao, scoreScale 0-1, weightsOn true, personalOn false); đọc lại db.okrProgramConfig orderBy version desc: dòng mới version = cũ + 1 (khi chưa có dòng: 1), 6 ô đúng, dòng cũ không đổi (so toàn bộ bản ghi trước/sau); okr.program trả dòng mới. Trần: tạo mục tiêu thứ 3 cho cùng đơn vị ở canh-bao → 200 và đầu ra canhBao là chuỗi ghim; ghi cấu hình capMode chan rồi tạo mục tiêu thứ 4 → 400 câu ghim, đếm mục tiêu không đổi. personalOn false → tạo cấp ca-nhan bị 400 câu ghim; bật lên → 200. member ghi cấu hình → 403. CHIỀU ĐỎ: bản sao service ghi đè dòng cũ thay vì thêm dòng → khẳng định version và dòng-cũ-không-đổi đỏ, in hai bản ghi."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: test
    layer: backend-effect
    cmd: config:executors.test.dok_muc_tieu
    paths: [apps/api/src/okr/**, packages/validation/src/okr-muc-tieu.ts, apps/api/test/okr.spec.ts]
    expected: "exit 0; gieo cây qua org.*: bộ phận B có phòng ban P với trưởng P (member), trưởng B (member); quản trị gieo chu kỳ dang-chay và bật OKR cá nhân. Bốn lượt tạo: trưởng P tạo cấp phong-ban (title, kind tham-vong, ownerUserId = trưởng P, participants [1 người], whyNow); trưởng B tạo cấp bo-phan; admin tạo cấp onehub; member tạo cấp ca-nhan cho chính mình. Đọc lại db.okrObjective + okrParticipant: MA TRẬN 4 × [level, divisionId, departmentId, personUserId, ownerUserId, kind, status = nhap, whyNow, số participant] = 36 khẳng định viết trước. Từ chối viết trước: cấp phong-ban thiếu departmentId · mang cả divisionId lẫn departmentId · ownerUserId không phải thành viên = 3 ca, 400 câu ghim. Sửa: updateObjective đổi title, kind, participants → đọc lại đúng 3 ô, ô khác không đổi. CHIỀU ĐỎ: bản sao khuôn okr-muc-tieu cho phép cả hai ô đơn vị → ca 2 không bị từ chối, bài đỏ in bản ghi."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: test
    layer: backend-effect
    cmd: config:executors.test.dok_kr
    paths: [apps/api/src/okr/**, packages/validation/src/okr-kr.ts, apps/api/test/okr.spec.ts, packages/validation/test/okr-kr.spec.ts]
    expected: "exit 0; hai bài. (a) hàm thuần tienDoKr trong packages/validation: bảng viết trước 6 kiểu × 3 giá trị (dưới, giữa, trên) = 18 khẳng định phần trăm; giu-tren đích 50 hiện 49 → 0, 50 → 100; moc 0/1; phan-tram 37 → 37. (b) API: trên mục tiêu nháp tạo 6 KR đủ 6 kiểu với owner khác nhau, unit, dueOn, weight; đọc lại db.okrKeyResult: MA TRẬN 6 × [kind, startValue, targetValue, currentValue, unit, dueOn, weight, ownerUserId, source = tay] = 54 khẳng định. Từ chối viết trước: kiểu la · tang-toi đích ≤ khởi điểm · giam-xuong đích ≥ khởi điểm · phan-tram 101 = 4 ca 400 câu ghim. removeKeyResult → còn 5 dòng và bảng vết có dòng action xoa-kr cho id đó. CHIỀU ĐỎ: bản sao okr-kr đảo công thức giam-xuong → 3 khẳng định của kiểu đó đỏ, in kiểu và giá trị."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-5
    executor: test
    layer: backend-effect
    cmd: config:executors.test.dok_cong_bo
    paths: [apps/api/src/okr/**, apps/api/test/okr.spec.ts]
    expected: "exit 0; publishObjective mục tiêu có 2 KR → đọc lại status cong-bo, publishedAt không null, 2 KR startLockedAt không null. Sau đó updateKeyResult đổi startValue → 400 với đúng câu OKR.thongDiep.khoiDiemDaKhoa, startValue đọc lại không đổi; đổi targetValue và currentValue → 200, đọc lại đúng. publishObjective mục tiêu 0 KR → 400 câu ghim, status vẫn nhap. dropObjective → status da-bo, droppedAt, số KR và số alignment không đổi. Khoá pha: danh sách MƯỜI MỘT thủ tục ghi nội dung chép nguyên từ bảng mục 3 design doc là hằng trong bài (createObjective, updateObjective, publishObjective, dropObjective, createKeyResult, updateKeyResult, removeKeyResult, addAlignment, removeAlignment, previewImport, applyImport); đối chứng dương ở pha dang-chay: 11 thủ tục với đầu vào hợp lệ đều 200; rồi quản trị chuyển sang cham-diem và sau đó da-dong: MA TRẬN 11 × 2 pha = 22 ô, mỗi ô 400 với câu ghim pha khoá và bản ghi đích đọc lại không đổi (so toàn bộ bản ghi trước/sau). CHIỀU ĐỎ: bản sao service bỏ kiểm startLockedAt → khẳng định startValue-không-đổi đỏ, in giá trị trước/sau; bản sao bỏ kiểm pha ở updateKeyResult → ô [updateKeyResult, da-dong] lệch, bài đỏ in ô."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-6
    executor: test
    layer: backend-effect
    cmd: config:executors.test.dok_quyen
    paths: [apps/api/src/okr/okr-access.service.ts, apps/api/src/okr/**, apps/api/src/to-chuc/cay.ts, apps/api/test/okr.spec.ts]
    expected: "exit 0; cây: bộ phận B1 (trưởng b1) có P1 (trưởng p1), P2 (trưởng p2); bộ phận B2 (trưởng b2) có P3. Mục tiêu: onehub (admin), B1, P1, P2, B2; KR trên P1 có owner k (member không giữ vai trò). MA TRẬN 7 người × 8 việc [sửa P1, công bố P1, sửa P2, sửa B1, sửa B2, sửa onehub, sửa KR của k, tạo chu kỳ] = 56 ô viết trước bằng bảng hằng trong bài (đúng/từ chối), chạy hết rồi so mảng kết quả với bảng — quan hệ tập, không chuỗi. Người: p1, p2, b1, b2, k, admin, member-không-vai-trò. Kỳ vọng chính: p1 sửa/công bố P1 đúng, P2 từ chối, B1 từ chối; b1 sửa B1, P1, P2 đúng, B2 từ chối; k sửa KR của k đúng, sửa mục tiêu P1 từ chối; admin sửa onehub đúng, tạo chu kỳ đúng, sửa P1 từ chối; member trần từ chối 8/8 việc. Đối chứng đọc: cả 7 người gọi okr.objective và okr.byUnit đều 200. CHIỀU ĐỎ: bản sao okr-access coi mọi admin sửa được mọi cấp → ô [admin, sửa P1] lệch, bài đỏ in ô lệch."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-7
    executor: test
    layer: backend-effect
    cmd: config:executors.test.dok_can_chinh
    paths: [apps/api/src/okr/can-chinh.ts, apps/api/src/okr/**, apps/api/test/okr.spec.ts, apps/api/test/okr-can-chinh.spec.ts]
    expected: "exit 0; hai bài. (a) dungCayCanChinh hàm thuần: đầu vào 5 mục tiêu + 3 alignment viết tay đúng khuôn của okr.contracts, đầu ra cây kỳ vọng viết trước: mục tiêu góp 2 chỗ xuất hiện 2 lần với lapLai true ở lần hai, mục tiêu không góp ở chuaCanChinh; so toEqual toàn cây. (b) API: onehub công bố với 2 KR, B công bố, năm 2026 có mục tiêu B-năm công bố. Trưởng P gắn P → KR1 của onehub, P → B, P(quý) → B-năm: db.okrAlignment đếm 3; okr.alignmentTree hiện P ở 2 chỗ + lapLai sau hai lần gắn trong quý, và ở 3 chỗ sau lần gắn thứ ba (cây quý có cả mục tiêu năm cha); alignmentTargets(P) chỉ chứa onehub, KR1, KR2, B, KR của B, B-năm, KR của B-năm (so bằng tập, 7 phần tử — B và B-năm cần ≥ 1 KR mới công bố được). Từ chối viết trước: P → P2 cùng cấp · B → P cấp thấp hơn · P → P · P → mục tiêu nháp · P → mục tiêu ở quý khác · gắn lại P → B = 6 ca 400 câu ghim, đếm vẫn 3. removeAlignment → 2. CHIỀU ĐỎ: bản sao bỏ kiểm thứ hạng cấp → ca 1 lọt, bài đỏ in đếm 4."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E8
    criterion: AC-8
    executor: test
    layer: backend-effect
    cmd: config:executors.test.dok_vet
    paths: [apps/api/src/okr/**, packages/validation/src/okr-vet.ts, apps/api/test/okr.spec.ts]
    expected: "exit 0; đếm db.activity trước; chạy chuỗi 11 thủ tục ghi (tạo chu kỳ, đổi pha, ghi cấu hình, tạo mục tiêu, sửa mục tiêu, tạo KR, sửa KR, gắn căn chỉnh, gỡ căn chỉnh, công bố, bỏ) với người làm khác nhau; đọc db.okrTrail (theo objectiveId/cycleId thuộc fixture, cộng dòng action cau-hinh mới nhất): đúng 11 dòng, MA TRẬN 11 × [actorUserId, action, id đích] = 33 khẳng định; dòng cau-hinh có after.version bằng version vừa ghi; dòng tạo có before null; dòng sửa mục tiêu có before.title ≠ after.title và before.kind == after.kind (chỉ ô sửa đổi); dòng công bố before.status nhap → after.status cong-bo; parse mỗi before/after bằng parseOkrVet không ném. db.activity đếm sau == trước. Đối chứng dương: gọi thêm 1 thủ tục ghi → 12 dòng. CHIỀU ĐỎ: bản sao service bỏ ghi vết ở removeAlignment → đếm 10, bài đỏ in hành động thiếu."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E9
    criterion: AC-9
    executor: test
    layer: backend-effect
    cmd: config:executors.test.dok_nhap
    paths: [apps/api/src/okr/nhap.ts, apps/api/src/okr/**, apps/api/test/okr-nhap.spec.ts, apps/api/test/okr.spec.ts]
    expected: "exit 0; hai bài. (a) phanTichLoOkr hàm thuần với snapshot viết tay đúng khuôn SnapNhapOkr: lô 13 dòng, mỗi loại lỗi một dòng (thiếu mục tiêu, thiếu KR, tên hoặc đơn vị sai độ dài, kiểu lạ, email lạ, thiếu đích, tăng-tới đích ≤ khởi điểm, giảm-xuống đích ≥ khởi điểm, phần trăm 120, mục tiêu đã có) + 3 dòng hợp lệ gom 2 mục tiêu; MA TRẬN 13 × câu lỗi ghim viết trước; summary {valid 3, invalid 10, objectives 2}. (b) API: trưởng P previewImport → rows đúng, db.okrObjective đếm không đổi; applyImport → đếm +2 mục tiêu, +3 KR, mục tiêu status nhap, ownerUserId = trưởng P, vết action nhap-bang-tinh có after {unit, cycleId, objectives 2, keyResults 3}; applyImport lại cùng chữ → written 0, đếm mục tiêu không đổi VÀ đếm okrTrail action nhap-bang-tinh không đổi; applyImport với congBo true trên lô mới → status cong-bo; lô 1001 dòng → 400 câu ghim; cấu hình capMode chan với objectiveCap 2 rồi lô 3 mục tiêu mới → 400 câu ghim, đếm mục tiêu và vết không đổi; member không vai trò → 403 cả preview lẫn apply; admin previewImport và applyImport cho phòng ban mình không làm trưởng → 200 (đối chứng dương cho quyền quản trị nhập). CHIỀU ĐỎ: bản sao nhap.ts bỏ kiểm «mục tiêu đã có» → lần ghi thứ hai ghi lại 2 mục tiêu, 3 KR (written đếm dòng KR = 3), bài đỏ in đếm."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E10
    criterion: AC-10
    executor: test
    cmd: config:executors.test.dok_dieu_huong
    paths: [apps/app/lib/khung-dieu-huong.ts, apps/app/lib/pham-vi-man.ts, apps/app/lib/messages/khung-ung-dung.ts, apps/app/proxy.ts, packages/db/src/workspace.ts, apps/app/test/khung-dieu-huong.spec.ts, apps/app/test/pham-vi-man.spec.ts, packages/db/test/workspace-slug.spec.ts]
    expected: "exit 0; khung-dieu-huong.spec: MUC_RAIL 9 mục, mục okr href /okr match prefix, nằm ngay sau onboarding và ngay trước settings, nhãn vi có dấu và khác nhãn en (Mục tiêu / Objectives); pham-vi-man.spec: mucRailChoVai('okr') = [overview, okr, settings] đúng thứ tự, dieuHuongTheoVai('okr', '/okr/theo-don-vi') = ok; workspace.spec: workspaceSlug('okr') = 'okr-crm'. CHIỀU ĐỎ: bỏ okr khỏi RAIL_CHI_OKR → mảng 2 phần tử, bài đỏ in mảng."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E11
    criterion: AC-10
    executor: ui-check
    layer: ui-observed
    cmd: config:executors.script.dok_man_chrome
    steps:
      - "Cảnh cây (rang/canh-cay.mjs của man-cai-dat-noi-tieng-viet) trước màn đầu tiên; lệch cây → mã 2"
      - "Gieo qua API thật: bộ phận, hai phòng ban có trưởng, chu kỳ quý dang-chay, mục tiêu onehub/bộ phận/phòng ban với KR; đăng nhập dev:session cho trưởng phòng ban và một thành viên thường"
      - "Trưởng: mở {APP_URL}/<slug>/okr/theo-don-vi ở 1440/vi → chụp evidence/E11-step1.png: nav cây có nút đơn vị (data-nut-cay) đọc từ org.tree, số mục tiêu cạnh phòng ban; bấm phòng ban → URL có donOkr=, thẻ mục tiêu có bảng KR (thead có 4 cột) → E11-step2.png; bấm «Cây căn chỉnh» → bảng cây có dòng mục tiêu OneHub và dòng thụt lề → E11-step3.png; đổi chu kỳ ở Select → danh sách đổi → E11-step4.png"
      - "Trưởng: có nút «Thêm mục tiêu» và «Nhập từ bảng tính»; thành viên thường mở cùng URL → không có hai nút → E11-step5.png"
      - "Chọn phòng ban không có mục tiêu → Empty rỗng → E11-step6.png; chọn phòng ban gieo không trưởng → câu «gán trưởng ở Cài đặt › Tổ chức» → E11-step7.png; chặn request okr.byUnit (setRequestInterception trả 500) → Empty + nút Thử lại; bỏ chặn, bấm Thử lại → thẻ mục tiêu hiện lại → E11-step8.png"
      - "Bản sao cơ sở dữ liệu không có chu kỳ nào (script xoá chu kỳ fixture rồi gieo lại sau): quản trị mở → câu «chưa mở chu kỳ» kèm liên kết Cài đặt; thành viên thường → cùng câu, không liên kết → E11-step9.png"
      - "Trưởng (đang phụ trách một KR của phòng ban khác và tham gia một mục tiêu): mở /<slug>/okr → tab Của tôi có thẻ mục tiêu, KR của mình đánh dấu → E11-step10.png; thành viên không giữ gì mở /<slug>/okr → Empty «Bạn chưa phụ trách…» có liên kết Theo đơn vị → E11-step11.png"
      - "Tab Toàn cảnh → Empty nói lượt 5 → E11-step12.png; mở ở 390 → cây thành Select, không tràn ngang → E11-step13.png"
      - "Mọi ảnh: scrollWidth <= innerWidth; không lỗi console hydrat; ghi request thất bại vào evidence/E11-network.txt"
    paths: ["apps/app/app/(app)/[slug]/okr/**", apps/app/lib/messages/okr.ts, _acceptance/dat-okr-trong-crm/rang/man-okr.mjs]
    expected: "exit 0 và ảnh ở _acceptance/dat-okr-trong-crm/evidence/; script khẳng định bằng DOM (đếm data-nut-cay, đọc textContent số đếm, đọc URL, đếm cột thead, đếm nút theo aria-label). CHIỀU ĐỎ trên cùng dựng cảnh: bỏ điều kiện canEdit khỏi hai nút → thành viên thường thấy nút, bài đỏ in nhãn nút; bỏ cây khỏi màn → đếm data-nut-cay 0, bài đỏ."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E12
    criterion: AC-11
    executor: ui-check
    layer: ui-observed
    cmd: config:executors.script.dok_man_chrome
    steps:
      - "Cùng lần chạy với E11"
