    criterion: AC-2
    executor: script
    cmd: config:executors.script.build_khong_cache
    expected: |
      Xanh: turbo chay build tuoi, ma 0. Day la lenh duy nhat dung ung dung that; bon
      lenh kia khong dung nen mot hoi quy lam next build do se lot neu thieu no.
      Chieu do: bo mot export con duoc trang dung -> ma khac 0.

  - id: E4
    criterion: AC-2
    executor: script
    cmd: config:executors.script.lint_khong_cache
    expected: |
      Xanh: turbo chay lint tuoi, ma 0.
      Chieu do: them mot bien khong dung -> ma khac 0, neu ten file va dong.

  - id: E5
    criterion: AC-2
    executor: script
    cmd: config:executors.script.lint_slop
    expected: |
      Xanh: oxlint voi bo luat anti-slop, ma 0. Lop chuyen kieu la cho de sinh
