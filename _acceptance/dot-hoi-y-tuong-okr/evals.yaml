  - id: E4
    criterion: AC-3
    executor: test
    layer: backend-effect
    cmd: config:executors.test.hy_ten_va_so
    paths: [apps/api/src/okr/**, apps/api/test/okr-hoi-y.spec.ts, apps/api/test/vai-chi-okr.spec.ts, apps/api/test/okr-hoi-y-san.ts]
    expected: "exit 0; H đang mở, ý Y1 của A (tên «Ngô Minh Châu»), Y2 của B; T và O bấm «tôi cũng nghĩ vậy» Y1; P đã niêm phong. MA TRẬN VIẾT TRƯỚC 4 vai (T member, O okr, Q quản trị, P người chọn) × 3 đường (tRPC, cầu REST GET tương ứng, khoá API của chính người đó gọi cầu REST) × 3 thủ tục đọc (okr.hoiY, okr.hoiYDoPhu, okr.hoiYNhan) × 3 trạng thái (dang-mo sau niêm phong, dang-gom sau gom và kết luận, da-cong-bo) = 108 ô, mỗi ô khai trước có/không có tên và số, bài in số ô đã chạy và phải bằng 108; tập thủ tục đọc của lần hỏi ý rút từ generated/server.ts so toEqual [hoiY, hoiYDoPhu, hoiYNhan] để thủ tục đọc mới không lọt ma trận: với T và O, JSON.stringify phản hồi không chứa chuỗi «Ngô Minh Châu», mã user của A, B, khoá soDongY của ý người khác — đếm = 0 in bảng đếm; mỗi ý có daDongY đúng (T: Y1 true, Y2 false); với Q và P: có tên A và soDongY của Y1 = 2. Thứ tự xáo: H có 12 ý của 6 người khác; T và O mỗi người gọi okr.hoiY hai lần → mảng id ý người khác của T lần 1 toEqual lần 2, của O lần 1 toEqual lần 2, của T khác của O, và của T khác thứ tự createdAt; bấm đồng ý vào ý cuối của T không đổi thứ tự của T (so toEqual trước/sau). dongY(Y1, bat) lần hai bởi T → okrYDongY vẫn 2 hàng; dongY(Y1, tat) → 1 hàng; A dongY(Y1) → 400 yCuaMinh; sau hạn → 400. hoiYNhan: T chưa góp khi H đang mở → {canGop true, soChuDeChuaKetLuan null}; sau khi T góp một ý → canGop false; P khi H đang gom có 6 chủ đề, 2 đã kết luận → soChuDeChuaKetLuan 4, Q (quản trị, không phải P) → null; dời hạn về now → canGop false cho mọi người. Tập thủ tục vai okr với tới được so toEqual danh sách viết trước có thêm đúng 17 thủ tục mới (ALIAS và tập ghim của vai-chi-okr.spec); ma-tran vẫn xanh. CHIỀU ĐỎ: bản sao trả ý theo createdAt → ca «T khác O» đỏ in hai mảng id; bản sao hàm chiếu ý trả tacGia cho mọi vai → ô (O, tRPC, hoiY, dang-mo, tên A) đỏ, bài in đường và chuỗi lộ; bản sao chiếu chủ đề ở da-cong-bo dùng phép chiếu của màn gom (kèm tên) → ô (O, tRPC, hoiY, da-cong-bo) đỏ."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-4
    executor: test
    layer: backend-effect
    cmd: config:executors.test.hy_ban_truoc
    paths: [apps/api/src/okr/**, packages/validation/src/okr-hoi-y.ts, apps/api/test/okr-hoi-y.spec.ts, apps/api/test/okr-hoi-y-san.ts]
    expected: "exit 0; H đang mở có 3 ý của người khác, người chọn P. Trước niêm phong: okr.hoiY bởi P → mảng y chứa 0 ý của người khác (so id), cờ khoaY = true và lyDoKhoa ghim. niemPhong(bốn câu viết trước, câu 1 «Đưa giao lạnh thành dịch vụ có lãi») → DB một okrHoiYBanTruoc {cau toEqual bốn câu, boQua false}; P đọc → thấy 3 ý kèm tên; niemPhong lần hai → 400 daNiemPhong; mọi thủ tục ghi bản viết trước sau đó → 400; okrTrail niem-phong có after toEqual {soCau: 4, boQua: false} và JSON.stringify của hàng vết không chứa chuỗi nào trong bốn câu. Quét lộ trước công bố: MA TRẬN VIẾT TRƯỚC 3 vai (Q quản trị không phải người chọn, T, O) × 3 đường (tRPC, REST, khoá API) × 3 thủ tục đọc (okr.hoiY, okr.hoiYDoPhu, okr.hoiYNhan) × 2 trạng thái (dang-mo sau niêm phong; dang-gom sau khi P kết luận và khai nối cau-1, cau-3) = 54 ô — đếm phản hồi chứa bất kỳ câu nào trong bốn câu = 0 ở mọi ô, bài in số ô (= 54). Sau công bố (qua fixture công bố): cả 3 vai đọc được bốn câu. Ca khai không viết trước trên H2: niemPhong({boQua}) → P đọc được ý, kết quả sau công bố có boQua true. CHIỀU ĐỎ: bản sao okr.hoiY trả banTruoc cho quản trị → ô (Q, tRPC, hoiY, dang-mo) đỏ in câu lộ; bản sao chủ đề ở dang-gom kèm chữ câu đã nối → ô (Q, tRPC, hoiY, dang-gom) đỏ; bản sao bỏ khoá đọc ý trước niêm phong → ca «0 ý trước niêm phong» đỏ in số ý."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

