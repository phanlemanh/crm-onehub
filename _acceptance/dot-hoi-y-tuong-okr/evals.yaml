    expected: "exit 0; khuôn soLieuHoiY: BẢNG CA VIẾT TRƯỚC ≥ 10 so toEqual nhận/từ chối (nhận 1 dòng, 5 dòng, ghiChu trống; từ chối 0 dòng, 6 dòng, nhan 1 ký tự, nhan 61, giaTri trống, giaTri 41, ghiChu 121) với đường dẫn lỗi. Dịch vụ, chu kỳ năm C ở lap-ke-hoach: quản trị Q moHoiY(C, câu hỏi, lời mở, 3 con số, hạn now+48h, người chọn P admin) → đọc DB, parse soLieu toEqual đầu vào, trangThaiHoiY = dang-mo; suaHoiY(lời mở mới, 4 con số) → đúng; suaHoiY(hanLuc = now) → dang-gom; okrTrail cycle C mảng hành động toEqual [mo-hoi-y, sua-hoi-y, sua-hoi-y]. Lối ra người chọn trên H2: P niêm phong, hạ P về member qua thủ tục thật → suaHoiY(nguoiChon Q2) được, okrHoiYBanTruoc giữ nguyên vietBoiUserId P, một vết doi-nguoi-chon {tu: P, sang: Q2}. CHIỀU ĐỎ: bản sao suaHoiY không ghi vết → ca mảng vết đỏ, bài in mảng nhận."
