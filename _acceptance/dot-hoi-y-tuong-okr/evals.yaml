    expected: "exit 0; BẢNG CA THIẾU VIẾT TRƯỚC 9 ca, mỗi ca dựng từ một lần hỏi ý đủ điều kiện rồi phá đúng một điều (chưa niêm phong, còn ý chưa gom, còn chủ đề rỗng, chủ đề thiếu kết luận, thiếu lý do, chon thiếu câu mục tiêu, chon chưa khai noiBanTruoc, 0 chủ đề chon, vượt objectiveCap chế độ chặn): okr.hoiY.quyen.lyDoChuaCongBo toEqual [mã của đúng điều bị phá]; congBo → 400 với câu ghim riêng; đếm okrObjective, okrChuDe.objectiveId, congBoLuc không đổi. Ca đủ: ba chủ đề chon → đúng 3 okrObjective {level onehub, status nhap, ownerUserId P, title = cauMucTieu, whyNow = lyDo, kind cam-ket} (so toEqual tập), mỗi chủ đề chon có objectiveId trỏ đúng, congBoLuc khác null, okrTrail có 3 dòng tao với after.tuHoiY = H và 1 dòng cong-bo-hoi-y; congBo lần hai → 400 daCongBo. Chế độ cảnh báo vượt trần → công bố được, trả canhBao. setCyclePhase(C, dang-chay) khi H chưa công bố → 400 conHoiYChuaCongBo, pha không đổi; sau công bố → được. Ca lối ra trên H3: P niêm phong, hạ P về member → P congBo 403; Q đổi người chọn sang Q2 → Q2 kết luận đủ, congBo được, mục tiêu nháp có owner Q2; setCyclePhase(C3, dang-chay) được. CHIỀU ĐỎ phụ: bản sao giữ luật «không đổi người chọn sau niêm phong» → ca lối ra đỏ in mã 400 daNiemPhong. CHIỀU ĐỎ: bản sao congBo tạo mục tiêu ngoài giao dịch rồi lỗi ở chủ đề thứ ba → ca «đếm không đổi» đỏ in số mục tiêu mồ côi."
