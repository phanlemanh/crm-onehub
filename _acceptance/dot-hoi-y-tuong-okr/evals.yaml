    paths: [apps/api/src/okr/**, packages/validation/src/okr-hoi-y.ts, apps/api/test/okr-hoi-y.spec.ts, apps/api/test/okr-hoi-y-san.ts]
    expected: "exit 0; lần hỏi ý H đang mở: thành viên T gopY(«Mở tuyến giao lạnh cho khách dược» 36 ký tự, vì sao, đo bằng gì) → DB {tacGiaUserId T, noiDung, viSao, doBangGi, chuDeId null}; suaY → đúng; goY → 0 hàng của ý đó; vai okr O góp một ý → tacGiaUserId O. Từ chối viết trước, mỗi ca câu ghim, đếm okrY không đổi: T góp ý thứ tư (400 quaBaY); O sửa ý của T (403); O gỡ ý của T (403); P (người chọn) góp (400 nguoiChonKhongGop); nội dung 9 ký tự và 301 ký tự (400); góp sau khi dời hạn về now (400 hetHan); góp sau công bố (400). Ca đua: hai lời gopY song song của T khi T đã có 2 ý → đúng một thành công, DB đúng 3 ý (khoá hàng hỏi ý). CHIỀU ĐỎ: bản sao đếm trần ngoài giao dịch → ca đua đỏ, bài in số ý 4."
