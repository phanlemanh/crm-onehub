      O (c): sau "xong 1" qua duong luat cu, doc lai buoc trong DB -> completedAt not null (va la buoc cua tin nhac hom nay).
      Chieu do: xongTheoTinNhac khong ghi completedAt nhung tra cung cau -> do ghim "buoc da xong trong DB".
  - id: E11
    criterion: AC-11
    executor: test
    layer: backend-effect
    cmd: config:executors.test.hcz_tu_choi_vai
    paths:
      - "apps/agent/test/hoi-crm-qua-zalo.integration.spec.ts"
      - "apps/agent/agent/channels/eve.ts"
      - "apps/agent/agent/lib/thanh-vien-principal.ts"
      - "apps/agent/agent/lib/zalo-hoi.ts"
    expected: |
      Ba nguoi: kinh doanh, okr, mat member. repFromCrm(secret)(Request voi JWT HS256 ky dung) -> principal / null / null;
      hoiTacTu -> loai "hoi" / tu-choi-vai / tu-choi-vai. Ma tran 3 x 2 viet truoc, so assert === 6.
      Ca grep channels/eve.ts bi go (readFileSync eve.ts khong con trong tep).
      Chieu do: repFromCrm bo kiem thanhVienPrincipal -> do ghim "okr bi tu choi o web".
