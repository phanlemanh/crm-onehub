    cmd: config:executors.script.emtdl_ghi_ban_ghi
    paths: [_acceptance/tro-ly-doc-kho/rang/quyet-do.ts, _acceptance/tro-ly-doc-kho/rang/cham-bo-do.ts, _acceptance/eval-model-that-dung-luc/rang/doi-dau-vao.mjs]
    expected: "exit 0; trên bản sao cây (git worktree ngoài kho), cần khoá Gateway cho lời dò: tạo tệp bằng chứng của một lượt đạt bằng hàm ghi bản ghi của quyet-do.ts với băm thật do --chi-quyet tính; chạy `cham-bo-do.ts --ghi-ban-ghi <tệp>` → _acceptance/tro-ly-doc-kho/evidence/cham-bo-do.md của bản sao mang khối bản ghi đó; commit trong bản sao; --chi-quyet → «DUNG LAI» (băm không đổi vì tệp bản ghi ngoài phạm vi băm). Thêm: một lượt đo mới đạt in đúng một dòng «GHI BAN GHI: bun _acceptance/tro-ly-doc-kho/rang/cham-bo-do.ts --ghi-ban-ghi …» — đo bằng hàm in kết thúc lượt của quyet-do.ts trên kết luận đạt (có dòng) và không đạt (không dòng)."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E12
    criterion: AC-11
    executor: test
    cmd: config:executors.test.emtdl_do_model
    paths: [_acceptance/tro-ly-doc-kho/rang/quyet-do.ts, _acceptance/tro-ly-doc-kho/rang/quyet-do.spec.ts]
    expected: "exit 0; hàm dò id model của quyet-do.ts nhận hàm gọi model tiêm vào: (1) hai lời gọi trả response.modelId «a/x» và «b/y» → bản ghi model_ids toEqual {kho: «a/x», goc: «b/y»} (đúng hai khoá); (2) lời gọi của model gốc ném «402 budget exceeded» → kết luận {ma: 2, dong: «KHONG DO DUOC: do model goc loi: 402 budget exceeded»} và hàm quyết dùng lại không được gọi (đếm lần gọi = 0); (3) lời gọi trả modelId rỗng → ma 2 «KHONG DO DUOC: do model kho khong co modelId». CHIỀU ĐỎ (cặp g): bản sao chỉ dò model kho → ca (1) đỏ «thieu model_id cua goc»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E13
    criterion: AC-12
    executor: script
    cmd: config:executors.script.emtdl_cham_lai
    paths: [_acceptance/tro-ly-doc-kho/rang/quyet-do.ts, _acceptance/tro-ly-doc-kho/rang/cham-bo-do.ts, _acceptance/eval-model-that-dung-luc/rang/cham-lai.mjs]
    expected: "exit 0; không gọi model, không cần kho đo. Nguồn: thư mục lượt mới nhất mà một lượt E15 THẬT đã ghi (tệp cham-tung-cau.jsonl do cham-bo-do.ts viết lúc đo, có trạng thái hàng của từng câu); không có lượt thật nào → exit 2 «chua co luot that de cham lai». Trên bản sao của thư mục đó: (1) `cham-bo-do.ts --cham-lai <thư mục>` nguyên vẹn → mã thoát và dòng tổng bằng mã và dòng tổng lượt thật đã in (round-trip); (2) đổi trạng thái một câu thành LOI → exit 2, dòng «KHONG DO DUOC: 1 cau loi (<id>)»; (3) đổi nhãn đủ câu để dung trang rơi vào vùng xám → in «CAN HOI LAI: dungTrang (<n> cau)». CHIỀU ĐỎ (cặp h): bản sao cham-bo-do.ts dán nhãn theo nhánh cũ (không gọi hàm nhãn của quyet-do.ts) → ca (2) đỏ «cham-bo-do khong dung ham nhan»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E9
    criterion: AC-9
