schema_version: 1
feature_slug: eval-model-that-dung-luc
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.emtdl_nhan_loi
    paths: [_acceptance/tro-ly-doc-kho/rang/quyet-do.ts, _acceptance/tro-ly-doc-kho/rang/quyet-do.spec.ts, _acceptance/tro-ly-doc-kho/rang/cham-bo-do.ts]
    expected: "exit 0; BẢNG VIẾT TRƯỚC cho hàm nhãn của quyet-do.ts (cham-bo-do.ts gọi đúng hàm này, không tự dán nhãn): nhóm câu (co-trang, khong-co, quy-dinh, khong-phai-quy-dinh) × kết cục (không có kết quả eval, hàng trạng thái LOI, TRA_LOI đủ trang, TRA_LOI sai trang, TU_CHOI) — mỗi dòng gõ tay nhãn mong đợi; mọi dòng «không có kết quả» và «LOI» ra `loi`, «TRA_LOI sai trang» ra `sai`, «khong-co × TRA_LOI» ra `sai`. Hàm kết luận: tập kết quả có 2 câu `loi` → {ma: 2, dong: «KHONG DO DUOC: 2 cau loi (<id1>, <id2>)»} và tử/mẫu số của mọi chỉ số không đếm hai câu đó. CHIỀU ĐỎ (rang/dot-bien.mjs cặp a): bản sao trả `sai` cho hàng LOI → bài đỏ với thông điệp ghim «loi bi tinh la sai»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.emtdl_nhat_ky
    paths: [_acceptance/tro-ly-doc-kho/rang/quyet-do.ts, _acceptance/tro-ly-doc-kho/rang/quyet-do.spec.ts]
    expected: "exit 0; trên thư mục tạm: hàm mở thư mục lượt trả hai đường khác nhau cho hai lượt liên tiếp (giờ hoặc pid khác), tệp của lượt 1 còn nguyên sau khi lượt 2 ghi; dựng sẵn 12 thư mục lượt có tên giờ tăng dần, gọi hàm dọn → tập tên còn lại toEqual đúng 10 tên mới nhất viết tay. CHIỀU ĐỎ (cặp b): bản sao bỏ bước dọn → bài đỏ «con 12 thu muc luot, can 10»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.emtdl_bam
    paths: [_acceptance/tro-ly-doc-kho/rang/quyet-do.ts, _acceptance/tro-ly-doc-kho/rang/quyet-do.spec.ts]
    expected: "exit 0; MA TRẬN VIẾT TRƯỚC 6 dòng: 5 lớp đầu vào (một tệp dưới apps/agent/agent, một tệp của paths E15, bun.lock, tệp bộ câu, id model Gateway trả) — đổi riêng lớp đó trên bộ đầu vào gốc → băm khác băm gốc; dòng thứ 6: đổi riêng tệp bản ghi _acceptance/tro-ly-doc-kho/evidence/cham-bo-do.md → băm KHÔNG đổi; bài khẳng định đã chạy đúng 6 dòng; cùng bộ đầu vào gọi hai lần → cùng băm; danh sách tệp của phạm vi băm do chính hàm liệt kê tệp của quyet-do.ts sinh ra trên kho thật (git ls-files), và khẳng định nó chứa apps/agent/agent/agent.ts, bun.lock, _acceptance/tro-ly-doc-kho/bo-do/mam-tam.json. CHIỀU ĐỎ (cặp c): bản sao bỏ bun.lock khỏi phạm vi → dòng bun.lock đỏ «doi bun.lock ma bam khong doi»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.emtdl_dung_lai
    paths: [_acceptance/tro-ly-doc-kho/rang/quyet-do.ts, _acceptance/tro-ly-doc-kho/rang/quyet-do.spec.ts]
    expected: "exit 0; BẢNG VIẾT TRƯỚC 6 ca cho hàm quyết dùng lại, bản ghi do CHÍNH hàm ghi bản ghi của quyet-do.ts viết (round-trip, không viết tay): (1) cùng băm, dat true, đo 1 ngày trước → dung-lai, dòng «DUNG LAI <băm>, do ngay <ngày>»; (2) băm khác → «DO MOI: bam doi»; (3) đo 8 ngày trước → «DO MOI: qua han 7 ngay»; (4) dat false → «DO MOI: lan truoc khong dat»; (5) không có bản ghi → «DO MOI: chua co ban ghi»; (6) có --do-lai → «DO MOI: --do-lai»; bài khẳng định 6 dòng đã chạy. Hàm đọc nguồn trên một kho git tạm: bản ghi đã commit được đọc; sửa tệp trên cây mà không commit thì hàm vẫn đọc bản ở HEAD. CHIỀU ĐỎ (cặp d): bản sao bỏ điều kiện hạn 7 ngày → ca (3) đỏ «dung lai ban ghi qua han»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-5
    executor: script
    cmd: config:executors.script.emtdl_doi_dau_vao
    paths: [_acceptance/tro-ly-doc-kho/rang/quyet-do.ts, _acceptance/tro-ly-doc-kho/rang/cham-bo-do.ts, _acceptance/eval-model-that-dung-luc/rang/doi-dau-vao.mjs]
    expected: "exit 0; cần khoá Gateway (vắng → exit 2 «can khoa Gateway»). Trên bản sao cây (git worktree ngoài kho): tính băm thật bằng cham-bo-do.ts --chi-quyet (chỉ dò id model, không chạy eve eval), ghi bản ghi đạt với băm đó bằng hàm ghi bản ghi của quyet-do.ts rồi commit trong bản sao, chạy --chi-quyet → in «DUNG LAI»; sửa một dòng trong apps/agent/agent/agent.ts của bản sao, chạy --chi-quyet → in «DO MOI: bam doi». Thiếu một trong hai dòng → exit 1."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-6
