    cmd: config:executors.test.emtdl_vung_xam
    paths: [_acceptance/tro-ly-doc-kho/rang/quyet-do.ts, _acceptance/tro-ly-doc-kho/rang/quyet-do.spec.ts]
    expected: "exit 0; MA TRẬN VIẾT TRƯỚC cho hàm vùng xám, mỗi dòng (k, n, ngưỡng, chiều) và nhãn gõ tay: (16,20,0.8,≥) dat; (15,20,0.8,≥) xam [0,75 ≥ 0,8−0,0894]; (14,20,0.8,≥) khong-dat [0,70 < 0,7106]; (19,24,0.8,≥) xam; (5,6,0.8,≥) dat; (4,6,0.8,≥) xam; (3,6,0.8,≥) khong-dat; (18,20,0.9,≥) dat; (17,20,0.9,≥) xam; (16,20,0.9,≥) khong-dat; (2,20,0.1,≤) dat; (3,20,0.1,≤) xam; (4,20,0.1,≤) khong-dat; bài khẳng định 13 dòng đã chạy. Hàm kế hoạch hỏi lại: lượt 1 có một câu loi → không hỏi lại, kết luận ma 2; lượt 1 không loi và một chỉ số xam → hỏi lại đúng bộ câu của chỉ số đó (so tập id với tập viết tay), đúng một lần. CHIỀU ĐỎ (cặp e): bản sao bỏ điều kiện «không có câu loi» → ca loi đỏ «hoi lai khi luot 1 co loi»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-7
    executor: test
    cmd: config:executors.test.emtdl_gop
    paths: [_acceptance/tro-ly-doc-kho/rang/quyet-do.ts, _acceptance/tro-ly-doc-kho/rang/quyet-do.spec.ts]
    expected: "exit 0; hàm kết luận gộp: (15/20 lượt 1, 17/20 lượt 2, ngưỡng 0,8) → gộp 32/40 = 0,8 đạt, dòng bằng chứng chứa đủ «luot 1 75.0%», «luot 2 85.0%», «gop 80.0%»; (15/20, 15/20) → gộp 0,75 không đạt, ma 1, và hàm không trả yêu cầu hỏi lần ba; lượt 2 có câu loi → ma 2. CHIỀU ĐỎ (cặp f): bản sao kết luận theo lượt 2 thay vì gộp → ca (15/20, 17/20) vẫn đạt nhưng ca (17/20, 15/20) đổi kết luận, bài đỏ «ket luan khong tren ti le gop»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E8
    criterion: AC-8
    executor: script
    cmd: config:executors.script.emtdl_luot_kep
    paths: [_acceptance/tro-ly-doc-kho/rang/cham-bo-do.ts, _acceptance/tro-ly-doc-kho/rang/quyet-do.ts, _acceptance/eval-model-that-dung-luc/rang/luot-kep.mjs]
    expected: "exit 0; cần khoá Gateway (vắng → exit 2). Lượt 1: cham-bo-do.ts không cờ — dùng lại từ HEAD nếu được, không thì đo đầy đủ trong phiên đo riêng; lượt 1 không đạt → exit 2 «KHONG DO DUOC: luot 1 khong dat». Lượt 2: cham-bo-do.ts --nguon-thu <bản ghi lượt 1> (cờ chỉ dành cho phép đo; bằng chứng in «nguon thu: <tệp>») → stdout có «DUNG LAI», KHÔNG có dòng «eve eval tro-ly-kho/cham-bo-do», và dòng «SO LOI GOI MODEL: 2» (hai lời dò; bộ đếm nằm trong lớp gọi model của cham-bo-do, đếm cả lời gọi qua eve eval); lượt 1 đo đầy đủ thì «SO LOI GOI MODEL» của nó > 2 (đối chứng dương). In «LUOT 1: <do moi|dung lai>, ma 0», «LUOT 2: DUNG LAI, ma 0, goi 2». E8 khai trong feature_loop.model_evals."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E11
    criterion: AC-10
