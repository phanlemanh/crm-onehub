    cmd: config:executors.script.emtdl_giu_nguong
    paths: [_acceptance/tro-ly-doc-kho/rang/cham-bo-do.ts, _acceptance/eval-model-that-dung-luc/rang/giu-nguong.mjs]
    expected: "exit 0; giu-nguong.mjs đọc khối NGUONG của cham-bo-do.ts ở merge-base với origin/onehub và ở HEAD (parse số, không so chuỗi), khẳng định năm giá trị bằng nhau và bằng bộ viết tay (0.8, 0.8, 0.9, 0.1, 0); khẳng định git diff --name-only từ merge-base không có tệp nào ngoài _acceptance/** và hai tệp máy vẽ PRODUCT-MAP.md, LO-TRINH.html (liệt từng tên). In «NGUONG giu nguyen» và «PHAM VI: <n> tep, 0 ngoai pham vi». Đối chứng dương: danh sách tay chỉ có PRODUCT-MAP.md → xanh; đối chứng âm: danh sách tay có apps/agent/agent/agent.ts → đỏ «ngoai pham vi: apps/agent/agent/agent.ts». Đối chứng âm tự chạy trước: hàm so với bộ (0.75, …) → báo «nguong doi: dungTrang 0.8 -> 0.75»; đối chứng không đỏ → exit 2."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E10
    criterion: AC-1
    executor: script
    cmd: config:executors.script.emtdl_dot_bien
    paths: [_acceptance/tro-ly-doc-kho/rang/quyet-do.ts, _acceptance/tro-ly-doc-kho/rang/quyet-do.spec.ts, _acceptance/eval-model-that-dung-luc/rang/dot-bien.mjs]
    expected: "exit 0; rang/dot-bien.mjs trên bản sao cây (git worktree ngoài kho), SO_CAP_KHAI = 8: mỗi cặp (a)–(h) như ghi ở E1, E2, E3, E4, E6, E7, E12, E13 — xanh trước khi phá, đỏ sau khi phá với đúng thông điệp ghim; in một dòng mỗi cặp; số cặp đã chạy ≠ SO_CAP_KHAI → exit 1."
