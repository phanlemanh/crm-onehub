<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lưu trữ và lượt kéo về</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&subset=vietnamese&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Geist', system-ui, sans-serif; background: #fafafa; color: #171717; padding: 3rem 2rem; display: flex; justify-content: center; }
    .frame { max-width: 1240px; width: 100%; }
    .eyebrow { font-family: 'Geist Mono', monospace; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #575757; margin-bottom: 1rem; }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Hình quyết định · Gỡ tín hiệu rác</p>

    <svg viewBox="0 0 1200 680" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#575757"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#006B4F"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#fafafa"/>

      <text x="40" y="40" fill="#171717" font-size="24" font-family="'Lora', serif">Lưu trữ và lượt kéo về: bên nào chạy trước thì thắng</text>
      <text x="40" y="64" fill="#575757" font-size="12" font-family="'Geist', sans-serif">Chỉ lưu trữ được tín hiệu đội sản phẩm chưa lấy về. Hai việc chạy cùng lúc trên một tín hiệu thì đúng một nhánh xảy ra.</text>

      <line x1="600" y1="136" x2="600" y2="164" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M488 212 H258 Q250 212 250 220 V312" fill="none" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M712 212 H942 Q950 212 950 220 V312" fill="none" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="250" y1="368" x2="250" y2="412" stroke="#006B4F" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="250" y1="472" x2="250" y2="516" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="950" y1="368" x2="950" y2="412" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="260" y="248" width="172" height="18" rx="2" fill="#fafafa"/>
      <text x="264" y="261" fill="#575757" font-size="11" font-weight="500" font-family="'Geist', sans-serif">Quản trị bấm Lưu trữ trước</text>
      <rect x="960" y="248" width="148" height="18" rx="2" fill="#fafafa"/>
      <text x="964" y="261" fill="#575757" font-size="11" font-weight="500" font-family="'Geist', sans-serif">Lượt kéo về chạy trước</text>
      <rect x="260" y="380" width="112" height="18" rx="2" fill="#fafafa"/>
      <text x="264" y="393" fill="#575757" font-size="11" font-family="'Geist', sans-serif">lượt kéo về tới</text>
      <rect x="260" y="484" width="132" height="18" rx="2" fill="#fafafa"/>
      <text x="264" y="497" fill="#575757" font-size="11" font-family="'Geist', sans-serif">nếu lưu trữ nhầm</text>
      <rect x="960" y="380" width="132" height="18" rx="2" fill="#fafafa"/>
      <text x="964" y="393" fill="#575757" font-size="11" font-family="'Geist', sans-serif">quản trị bấm Lưu trữ</text>

      <rect x="464" y="88" width="272" height="48" rx="24" fill="#fafafa"/>
      <rect x="464" y="88" width="272" height="48" rx="24" fill="rgba(23,23,23,0.03)" stroke="rgba(23,23,23,0.30)" stroke-width="1"/>
      <text x="600" y="116" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tín hiệu chưa lấy về</text>

      <polygon points="600,164 712,212 600,260 488,212" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="600" y="216" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bên nào chạy trước?</text>

      <rect x="100" y="312" width="300" height="56" rx="6" fill="#fafafa"/>
      <rect x="100" y="312" width="300" height="56" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="250" y="336" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đang lưu trữ</text>
      <text x="250" y="354" fill="#575757" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">ghi lúc lưu trữ và người lưu trữ</text>

      <rect x="100" y="416" width="300" height="56" rx="6" fill="#fafafa"/>
      <rect x="100" y="416" width="300" height="56" rx="6" fill="rgba(0,107,79,0.06)" stroke="#006B4F" stroke-width="1.4"/>
      <text x="250" y="440" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lượt kéo về bỏ qua</text>
      <text x="250" y="458" fill="#006B4F" font-size="10" font-weight="500" font-family="'Geist', sans-serif" text-anchor="middle">không tệp, không dấu đã lấy về</text>

      <rect x="100" y="520" width="300" height="56" rx="28" fill="#fafafa"/>
      <rect x="100" y="520" width="300" height="56" rx="28" fill="rgba(23,23,23,0.03)" stroke="rgba(23,23,23,0.30)" stroke-width="1"/>
      <text x="250" y="552" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Khôi phục → lượt sau lấy về</text>

      <rect x="800" y="312" width="300" height="56" rx="6" fill="#fafafa"/>
      <rect x="800" y="312" width="300" height="56" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="950" y="336" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đã lấy về</text>
      <text x="950" y="354" fill="#575757" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">tệp đã nằm ở kho sản phẩm</text>

      <rect x="800" y="416" width="300" height="64" rx="32" fill="#fafafa"/>
      <rect x="800" y="416" width="300" height="64" rx="32" fill="rgba(23,23,23,0.03)" stroke="rgba(23,23,23,0.30)" stroke-width="1"/>
      <text x="950" y="442" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lưu trữ bị từ chối</text>
      <text x="950" y="462" fill="#575757" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">«Đội sản phẩm đã lấy tín hiệu này về»</text>

      <text x="600" y="420" fill="#575757" font-size="14" font-style="italic" font-family="'Lora', serif" text-anchor="middle">Chạy cùng lúc trên một tín hiệu:</text>
      <text x="600" y="442" fill="#575757" font-size="14" font-style="italic" font-family="'Lora', serif" text-anchor="middle">đúng một nhánh xảy ra,</text>
      <text x="600" y="464" fill="#575757" font-size="14" font-style="italic" font-family="'Lora', serif" text-anchor="middle">không bao giờ cả hai.</text>

      <line x1="40" y1="612" x2="1160" y2="612" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>
      <text x="40" y="632" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>
      <rect x="40" y="644" width="24" height="16" rx="8" fill="rgba(23,23,23,0.03)" stroke="rgba(23,23,23,0.30)" stroke-width="1"/>
      <text x="72" y="656" fill="#575757" font-size="10" font-family="'Geist', sans-serif">Bắt đầu / kết cục</text>
      <rect x="208" y="644" width="24" height="16" rx="2" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="240" y="656" fill="#575757" font-size="10" font-family="'Geist', sans-serif">Trạng thái tín hiệu</text>
      <polygon points="372,652 384,644 396,652 384,660" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="404" y="656" fill="#575757" font-size="10" font-family="'Geist', sans-serif">Rẽ theo thứ tự</text>
      <rect x="520" y="644" width="24" height="16" rx="2" fill="rgba(0,107,79,0.06)" stroke="#006B4F" stroke-width="1.4"/>
      <text x="552" y="656" fill="#575757" font-size="10" font-family="'Geist', sans-serif">Điều tính năng này bảo đảm</text>
      <text x="1160" y="656" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.08em">TIÊU CHÍ AC-2 · AC-3</text>
    </svg>
  </div>
</body>
</html>
