<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Người gửi thấy gì</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&subset=vietnamese&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Geist', system-ui, sans-serif; background: #fafafa; color: #171717; padding: 3rem 2rem; display: flex; justify-content: center; }
    .frame { max-width: 1240px; width: 100%; }
    .eyebrow { font-family: 'Geist Mono', monospace; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #575757; margin-bottom: 1rem; }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Hình quyết định · Gỡ tín hiệu rác · Hỏi-1</p>

    <svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
      <rect width="100%" height="100%" fill="#fafafa"/>

      <text x="40" y="40" fill="#171717" font-size="24" font-family="'Lora', serif">Người gửi thấy gì khi tín hiệu của mình bị lưu trữ?</text>
      <text x="40" y="64" fill="#575757" font-size="12" font-family="'Geist', sans-serif">Hai cách cho trang «Tín hiệu đã gửi». Máy khuyên A — chủ sản phẩm chọn một.</text>

      <rect x="40" y="96" width="544" height="424" rx="8" fill="rgba(0,107,79,0.06)" stroke="#006B4F" stroke-width="1.4"/>
      <text x="64" y="124" fill="#006B4F" font-size="12" font-weight="600" font-family="'Geist', sans-serif">A · Máy khuyên · hiện kèm nhãn</text>

      <rect x="64" y="140" width="496" height="264" rx="6" fill="#ffffff" stroke="rgba(23,23,23,0.30)" stroke-width="1"/>
      <text x="88" y="176" fill="#171717" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Tín hiệu đã gửi</text>
      <line x1="64" y1="196" x2="560" y2="196" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>

      <text x="88" y="228" fill="#171717" font-size="12" font-family="'Geist', sans-serif">Thêm cột ngày ký hợp đồng</text>
      <rect x="448" y="214" width="88" height="20" rx="4" fill="#ffffff" stroke="rgba(23,23,23,0.12)" stroke-width="1"/>
      <circle cx="460" cy="224" r="3" fill="#1f4f7a"/>
      <text x="470" y="228" fill="#171717" font-size="10" font-weight="500" font-family="'Geist', sans-serif">Đang làm</text>
      <line x1="64" y1="248" x2="560" y2="248" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>

      <text x="88" y="280" fill="#171717" font-size="12" font-family="'Geist', sans-serif">test test</text>
      <rect x="448" y="266" width="88" height="20" rx="4" fill="#f2f2f2" stroke="rgba(23,23,23,0.12)" stroke-width="1"/>
      <circle cx="460" cy="276" r="3" fill="#575757"/>
      <text x="470" y="280" fill="#575757" font-size="10" font-weight="500" font-family="'Geist', sans-serif">Đã lưu trữ</text>
      <text x="88" y="304" fill="#575757" font-size="11" font-family="'Geist', sans-serif">Quản trị đã lưu trữ tín hiệu này — đội sản phẩm sẽ không lấy về.</text>
      <line x1="64" y1="324" x2="560" y2="324" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>

      <text x="88" y="356" fill="#171717" font-size="12" font-family="'Geist', sans-serif">Lọc liên hệ theo tỉnh</text>
      <rect x="448" y="342" width="88" height="20" rx="4" fill="#ffffff" stroke="rgba(23,23,23,0.12)" stroke-width="1"/>
      <circle cx="460" cy="352" r="3" fill="#171717"/>
      <text x="470" y="356" fill="#171717" font-size="10" font-weight="500" font-family="'Geist', sans-serif">Đã nhận</text>

      <text x="64" y="448" fill="#171717" font-size="13" font-weight="600" font-family="'Geist', sans-serif">Người gửi biết vì sao, không gửi lại</text>
      <text x="64" y="472" fill="#575757" font-size="11" font-family="'Geist', sans-serif">Nhãn xám, không lộ tên người lưu trữ; nút xoá của người gửi vẫn còn.</text>

      <rect x="616" y="96" width="544" height="424" rx="8" fill="none" stroke="rgba(23,23,23,0.30)" stroke-width="1"/>
      <text x="640" y="124" fill="#575757" font-size="12" font-weight="600" font-family="'Geist', sans-serif">B · Ẩn hẳn khỏi trang người gửi</text>

      <rect x="640" y="140" width="496" height="264" rx="6" fill="#ffffff" stroke="rgba(23,23,23,0.30)" stroke-width="1"/>
      <text x="664" y="176" fill="#171717" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Tín hiệu đã gửi</text>
      <line x1="640" y1="196" x2="1136" y2="196" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>

      <text x="664" y="228" fill="#171717" font-size="12" font-family="'Geist', sans-serif">Thêm cột ngày ký hợp đồng</text>
      <rect x="1024" y="214" width="88" height="20" rx="4" fill="#ffffff" stroke="rgba(23,23,23,0.12)" stroke-width="1"/>
      <circle cx="1036" cy="224" r="3" fill="#1f4f7a"/>
      <text x="1046" y="228" fill="#171717" font-size="10" font-weight="500" font-family="'Geist', sans-serif">Đang làm</text>
      <line x1="640" y1="248" x2="1136" y2="248" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>

      <rect x="656" y="260" width="464" height="52" rx="4" fill="none" stroke="rgba(23,23,23,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="888" y="290" fill="#575757" font-size="13" font-style="italic" font-family="'Lora', serif" text-anchor="middle">dòng «test test» biến mất</text>
      <line x1="640" y1="324" x2="1136" y2="324" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>

      <text x="664" y="356" fill="#171717" font-size="12" font-family="'Geist', sans-serif">Lọc liên hệ theo tỉnh</text>
      <rect x="1024" y="342" width="88" height="20" rx="4" fill="#ffffff" stroke="rgba(23,23,23,0.12)" stroke-width="1"/>
      <circle cx="1036" cy="352" r="3" fill="#171717"/>
      <text x="1046" y="356" fill="#171717" font-size="10" font-weight="500" font-family="'Geist', sans-serif">Đã nhận</text>

      <text x="640" y="448" fill="#171717" font-size="13" font-weight="600" font-family="'Geist', sans-serif">Gọn hơn — người gửi tưởng mất, có thể gửi lại</text>
      <text x="640" y="472" fill="#575757" font-size="11" font-family="'Geist', sans-serif">Danh sách chỉ còn những gì đội sản phẩm sẽ xem.</text>

      <line x1="40" y1="536" x2="1160" y2="536" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>
      <text x="40" y="556" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>
      <rect x="40" y="568" width="24" height="16" rx="2" fill="rgba(0,107,79,0.06)" stroke="#006B4F" stroke-width="1.4"/>
      <text x="72" y="580" fill="#575757" font-size="10" font-family="'Geist', sans-serif">Lối máy khuyên</text>
      <rect x="192" y="568" width="24" height="16" rx="2" fill="none" stroke="rgba(23,23,23,0.30)" stroke-width="1"/>
      <text x="224" y="580" fill="#575757" font-size="10" font-family="'Geist', sans-serif">Lối khác</text>
      <rect x="312" y="568" width="24" height="16" rx="2" fill="none" stroke="rgba(23,23,23,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="344" y="580" fill="#575757" font-size="10" font-family="'Geist', sans-serif">Chỗ dòng không còn</text>
      <text x="1160" y="580" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.08em">TIÊU CHÍ AC-8</text>
    </svg>
  </div>
</body>
</html>
