  - id: E9
    criterion: AC-9
    executor: test
    cmd: config:executors.test.gtr_ca_man
    paths:
      - "apps/app/components/tin-hieu/**"
      - "apps/app/app/(app)/[slug]/tin-hieu/tat-ca/**"
      - "apps/app/lib/messages/tin-hieu.ts"
      - "apps/app/test/tin-hieu-luu-tru.dom.tsx"
    expected: |
      tin-hieu-luu-tru.dom.tsx describe "ca-man": ma tran viet truoc ba ket cuc cua luuTru gia (dang cho, loi mang, loi
      CONFLICT voi message TIN_HIEU.loi.luuTruDaLayVe) va hai cua khoiPhuc (dang cho, loi mang) = 5 o:
        dang cho: muc menu mang data-disabled, bam lan hai khong goi them;
