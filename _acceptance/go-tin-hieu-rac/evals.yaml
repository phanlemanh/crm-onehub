    paths:
      - "apps/app/app/(app)/[slug]/tin-hieu/**"
      - "apps/app/components/tin-hieu/**"
      - "_acceptance/go-tin-hieu-rac/rang/**"
    expected: |
      do-man.mjs ca "da-lay-ve": dong mau Y da keo ve (sinh-mau chay mot luot keo ve that truoc khi gieo X) -> mo menu bang
      chuot that: muc «Lưu trữ» khoa (aria-disabled) va dong «Đội sản phẩm đã lấy về — không lưu trữ được nữa.» hien; anh
      evidence/E6b-da-lay-ve-1280.png. Ca "tai-lai": bat «Đã lưu trữ», tai lai trang -> nut van dang bat va bang van la
      dang luu tru.
      CHIEU DO: nhu E6.

  - id: E7
    criterion: AC-7
    executor: test
    layer: backend-effect
    cmd: config:executors.test.gtr_ba_so
    paths:
      - "apps/api/src/tin-hieu/**"
      - "packages/validation/src/tin-hieu.ts"
      - "apps/app/lib/tin-hieu/**"
      - "apps/api/test/tin-hieu-luu-tru.spec.ts"
    expected: |
      tin-hieu-luu-tru.spec.ts describe "gtr-ba-so": gieo nam tin hieu cua hai phong ban, luu tru hai (mot moi phong ban);
      xet tap id da gieo:
        1 demNguongSong(dongDemTuTatCa(tatCa() loc theo id gieo)) va demNguongSong(dongDemTuKeoVe(keoVe().tep loc theo ma
          gieo)) cung now, cung coCho rong -> trongKy, soPhong, chuaCoCho bang nhau va trongKy == 3 (khong dem hai ban luu tru);
        2 ghepTatCa (apps/app/lib/tin-hieu/tat-ca.ts) tren tatCa() mac dinh cho baSo.trongKy khong gom ban luu tru.
      Doi chung duong: truoc khi luu tru, cung phep tinh cho trongKy == 5.
      CHIEU DO: ban sao tatCa mac dinh bo loc archivedAt -> o 1 do voi thong diep ghim "ba o so dem tin hieu da luu tru".

  - id: E7b
    criterion: AC-7
    executor: test
    cmd: config:executors.test.gtr_ba_so_giu
    paths:
      - "apps/app/components/tin-hieu/**"
      - "apps/app/app/(app)/[slug]/tin-hieu/tat-ca/**"
      - "apps/app/test/tin-hieu-luu-tru.dom.tsx"
    expected: |
      tin-hieu-luu-tru.dom.tsx describe "ba-so-giu": render trang Tat ca (TatCaTrang) voi query tatCa gia tra dong khac nhau
      cho archived false/true (5 dong dang dung trong 30 ngay, 2 dong da luu tru):
        1 ba o so doc chu: «5» o o thu nhat; bat «Đã lưu trữ» -> van «5» (khong doi theo dang xem), so dem bo loc la so cua
          dang da luu tru;
        2 tat «Đã lưu trữ», luuTru gia thanh cong tren mot dong va query mac dinh tra lai 4 dong -> o thu nhat «4» khong
          tai lai trang; Hoan tac -> «5».
      CHIEU DO: ban sao tinh lai baSo tu dong dang xem -> o 1 do voi thong diep ghim "ba o so doi theo dang Da luu tru";
      ban sao giu baSo co dinh tu may chu -> o 2 do voi thong diep ghim "ba o so con dem tin hieu vua luu tru".

  - id: E8
    criterion: AC-8
    executor: test
    cmd: config:executors.test.gtr_nguoi_gui
    paths:
      - "apps/api/src/tin-hieu/**"
      - "apps/app/lib/tin-hieu/**"
      - "apps/app/components/tin-hieu/**"
      - "apps/app/lib/messages/tin-hieu.ts"
      - "apps/app/test/tin-hieu-luu-tru.dom.tsx"
    expected: |
      tin-hieu-luu-tru.dom.tsx describe "nguoi-gui": docTrangThaiTinHieu voi dong cuaToi {daKeoVe:false, daLuuTru:true} va ban
      ve doc duoc lan vang -> ca hai cho nhan m.nhan.daLuuTru, cau m.trangThai.daLuuTru, nghia ma toneTheoNghia ra "neutral";
      render DanhSachTinHieu voi dong do -> StatusIndicator data-nghia dung, cau hien, nut thao tac co «Xoá» bat duoc; HTML
      render khong chua chuoi «Người lưu trữ» va khong chua ten nguoi luu tru mau.
      CHIEU DO: ban sao bo nhanh daLuuTru -> do voi thong diep ghim "nguoi gui khong biet tin hieu da bi luu tru".

  - id: E8a
    criterion: AC-8
    executor: test
    layer: backend-effect
    cmd: config:executors.test.gtr_cua_toi
    paths:
      - "apps/api/src/tin-hieu/**"
      - "apps/api/test/tin-hieu-luu-tru.spec.ts"
    expected: |
      tin-hieu-luu-tru.spec.ts describe "gtr-cua-toi": member gui hai tin hieu, owner luu tru mot -> cuaToi cua member tra
