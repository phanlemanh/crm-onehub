  - id: E9
    criterion: AC-9
    executor: judgment
    question: "Đọc CONTEXT.md và docs/api.md. (1) CONTEXT.md mục «Việc» có định nghĩa việc riêng là việc không gắn bản ghi VÀ không thuộc dự án nào, và không còn câu nói việc không gắn gì là việc riêng (không kèm điều kiện dự án)? (2) CONTEXT.md mục «Dự án» vẫn nói ai đọc được phạm vi đối tác thì thấy mọi dự án và mọi việc trong đó? (3) Hai mục đó có còn chỗ nào mâu thuẫn nhau về ai thấy một việc trong dự án không gắn bản ghi? (4) docs/api.md mục «Việc» có nêu trường aiThay của viec.get với đúng ba giá trị rieng, du-an, ban-ghi và nghĩa của từng giá trị? (5) docs/api.md có nêu luật che trong viec.lichSu: vết nhắc một việc mà người xem không đọc được, hoặc việc đã xoá, thì không mang tiêu đề hay mã của việc đó? PASS khi (1), (2), (4), (5) có và (3) không."
    inputs: [CONTEXT.md, docs/api.md]
    evidence_required: [verdict, rationale, verified_at]

