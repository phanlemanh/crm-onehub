    expected: "exit 0; bài tích hợp apps/agent/test/tro-ly-okr-lich-tom-tat.integration.spec.ts trên kho _test có bộ OKR mẫu nạp bằng napBoOkrMau, thêm một chu kỳ năm đang chạy có updateWeekday khác chu kỳ quý; cấu hình lưu qua okr.setProgram-tương-đương (hàm ghi thật của API hoặc ghi OkrProgramConfig đúng khuôn okrProgram parse). MA TRẬN viết trước: bảy ngày × hai chu kỳ × phòng {tat, an, bat} × {có, không có cập nhật 7 ngày}; mỗi ngày chạy chayXepTomTat với đồng hồ giả 06:00 giờ VN; kỳ vọng là TẬP (cycleId, departmentId, nac) của hàng okr-tom-tat-tuan mới — so tập, không đếm. Thêm: hai lượt chayXepTomTat chạy đồng thời → đúng một việc xếp ngày kế và không trùng việc tóm tắt; chạy lại cùng ngày → không thêm; sổ gieo bằng ghiChiPhi tới trần → 0 việc tóm tắt, việc xếp đóng mã chứa 'het-tran-thang'; damBaoLichTomTat khi không còn việc xếp mở → đúng 1 (gọi hai lần vẫn 1), khi mọi nấc tóm tắt tắt → 0. Chiều đỏ: bản sao bỏ điều kiện ngày cập nhật là hôm qua → ô ngày khác ra việc, thông điệp ghim 'o lich lech: <ngay> x <chu ky> x <phong>'; bản sao ghi việc kế SAU vòng phòng ban và ném giữa vòng → 'chuoi dut'."
