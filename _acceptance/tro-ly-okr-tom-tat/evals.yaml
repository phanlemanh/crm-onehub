evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.tts_dang_ban
    expected: "exit 0; bài thuần packages/db/test/okr-hop-tuan.spec.ts nhập lyDoCua từ @crm/db/okr-hop-tuan. MA TRẬN viết trước trong bài, mỗi ca một mảng lý do kỳ vọng đủ loại và thứ tự: tụt 1 bậc, tụt 2 bậc, tụt so với tuần trước khi tuần này có hai lần, im đúng 13 và 14 ngày tính từ lần cuối, im 14 ngày tính từ khoaLuc khi chưa có lần nào, ghi chú trước và sau đầu tuần trước, KR chưa có lần nào lẫn khoaLuc; số khẳng định bằng số ca (in ra). Bài đọc cây apps/api/src/okr và đòi không có tệp hop-tuan.ts (đường suy từ vị trí bài). Chiều đỏ trên cùng bảng: bản sao đổi so sánh im từ >= sang > → ca 14 ngày đỏ với thông điệp ghim 'ly do lech: <ca>'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [packages/db/src/okr-hop-tuan.ts, packages/db/package.json, packages/db/test/okr-hop-tuan.spec.ts, "apps/api/src/okr/**"]

