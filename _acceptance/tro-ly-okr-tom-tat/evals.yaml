    expected: "exit 0; bài API apps/api/test/tro-ly-okr-tom-tat-doc.spec.ts trên bộ OKR mẫu, bản OkrTomTat ghi bằng hàm ghi thật của nop-tom-tat (không gieo tay khuôn cau). MA TRẬN viết trước: người {thành viên phòng, trưởng phòng, thành viên phòng khác, vai okr, quản trị} × bản {bat-hien, bat-can-xem, an-hien, phòng nấc tắt} → kỳ vọng {có bản | không có bản}; gọi okr.troLyTomTat qua tRPC VÀ qua REST (restMeta); số khẳng định = số ô × 2 (in ra). Ô có bản: tập câu so tập; mỗi nguồn trả về bằng từng trường của hàng OkrCheckIn đọc thẳng từ kho (keyResultId, ngày, value, confidence, note). Lọc: đổi Mục tiêu nguồn của câu 2 sang hienThi giới hạn không gồm người xem → câu 2 vắng, câu còn lại có (đối chứng dương: người được xem vẫn thấy câu 2); xoá KR nguồn của câu 3 → câu 3 vắng; sửa thẳng value của hàng OkrCheckIn nguồn câu 1 sau khi ghi → câu 1 vắng, câu khác còn; xoá thẳng riêng hàng OkrCheckIn nguồn câu 4 mà giữ KR → câu 4 vắng. Chiều đỏ: bản sao bỏ lọc theo người xem → 'cau lot quyen: <nguoi> x <cau>'; bản sao trả cả can-xem → 'o lech: <nguoi> x <ban>'; bản sao bỏ kiemCauTomTat lúc hiện → 'so cu lot: cau 1'."
