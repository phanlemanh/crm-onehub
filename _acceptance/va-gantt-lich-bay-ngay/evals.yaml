    question: "Đọc docs/api.md và CONTEXT.md. (1) docs/api.md mục «Lịch làm việc» (phần «Dự án» của mục «Việc») nói: lịch chưa từng đặt thì nghỉ Thứ Bảy, Chủ nhật; quản trị bỏ chọn hết là không nghỉ ngày nào; và KHÔNG còn câu nói ngayNghiTuan rỗng nghĩa là mặc định. (2) docs/api.md mục «Vòng đời» hoặc phần dự án nói trần 300 việc chỉ chặn thêm việc vào dự án (tạo, việc con, chuyển vào), còn mốc, phụ thuộc, đổi ngày chỉ bị chặn khi dự án đã đóng. (3) CONTEXT.md mục «Lịch làm việc» nói quản trị bỏ chọn hết thì không nghỉ ngày nào trong tuần. Thiếu hay sai điều nào thì FAIL và nêu điều đó."
