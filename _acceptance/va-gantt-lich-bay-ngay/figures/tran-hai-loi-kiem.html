<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trần ở lời kiểm thêm việc</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #fafafa;
      --color-ink:    #171717;
      --color-muted:  #575757;
      --color-accent: #006B4F;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Lora', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.01em;
      line-height: 1.3;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .sub { color: var(--color-muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
    code { font-family: var(--font-mono); font-size: 0.9em; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Hình quyết định · va-gantt-lich-bay-ngay · AC-5, AC-6, AC-7</p>
    <h1>Khoá và trần chỉ ở lời kiểm thêm việc</h1>
    <p class="sub">Hai lời kiểm tách nhau: thao tác mốc và phụ thuộc chỉ chặn khi dự án đóng; trần 300 việc chỉ chặn đường thêm việc vào dự án.</p>

    <svg viewBox="0 0 1040 584" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#575757"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#006B4F"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#fafafa"/>

      <text x="40" y="44" fill="#575757" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LÀN TRÁI</text>
      <text x="270" y="60" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lời kiểm dự án mở</text>
      <text x="270" y="76" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">docDuAnMo</text>

      <text x="540" y="44" fill="#575757" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LÀN PHẢI</text>
      <text x="772" y="60" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lời kiểm thêm việc</text>
      <text x="772" y="76" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">docDuAnNhanViec</text>

      <line x1="520" y1="32" x2="520" y2="448" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>

      <line x1="148" y1="152" x2="148" y2="294" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="392" y1="152" x2="392" y2="294" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="620" y1="152" x2="620" y2="198" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="772" y1="152" x2="772" y2="198" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="924" y1="152" x2="924" y2="198" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="772" y1="248" x2="772" y2="294" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="772" y1="344" x2="772" y2="390" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="780" y="360" width="56" height="16" rx="2" fill="#fafafa"/>
      <text x="784" y="372" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.06em">CÒN MỞ</text>

      <rect x="48" y="104" width="200" height="48" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="148" y="132" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Thêm, sửa, xoá mốc</text>

      <rect x="292" y="104" width="200" height="48" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="392" y="132" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Thêm, gỡ phụ thuộc</text>

      <rect x="108" y="296" width="324" height="48" rx="6" fill="rgba(0,107,79,0.08)" stroke="#006B4F" stroke-width="1.4"/>
      <text x="270" y="318" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chặn chỉ khi dự án đóng</text>
      <text x="270" y="334" fill="#575757" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">«Dự án đã đóng.»</text>

      <rect x="556" y="104" width="128" height="48" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="620" y="126" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tạo việc</text>
      <text x="620" y="142" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">taoViec</text>

      <rect x="708" y="104" width="128" height="48" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="772" y="126" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Việc con</text>
      <text x="772" y="142" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">taoViecCon</text>

      <rect x="860" y="104" width="128" height="48" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="924" y="126" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chuyển vào</text>
      <text x="924" y="142" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">doiDuAn</text>

      <rect x="572" y="200" width="400" height="48" rx="6" fill="rgba(23,23,23,0.05)" stroke="#575757" stroke-width="1"/>
      <text x="772" y="222" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Khoá hàng dự án</text>
      <text x="772" y="238" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SELECT … FOR UPDATE</text>

      <rect x="572" y="296" width="400" height="48" rx="6" fill="rgba(23,23,23,0.05)" stroke="#575757" stroke-width="1"/>
      <text x="772" y="318" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dự án đóng thì chặn</text>
      <text x="772" y="334" fill="#575757" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">«Dự án đã đóng.»</text>

      <rect x="572" y="392" width="400" height="48" rx="6" fill="rgba(0,107,79,0.08)" stroke="#006B4F" stroke-width="1.4"/>
      <text x="772" y="414" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đủ 300 việc thì chặn</text>
      <text x="772" y="430" fill="#575757" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">«Một dự án chứa tối đa 300 việc.»</text>

      <text x="40" y="480" fill="#575757" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">TRƯỚC VÒNG NÀY</text>
      <text x="40" y="500" fill="#171717" font-size="14" font-style="italic" font-family="'Lora', serif">Cả năm thao tác bên trái đi qua lời kiểm bên phải, nên dự án đủ 300 việc khoá luôn mốc và phụ thuộc.</text>

      <line x1="40" y1="524" x2="1000" y2="524" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>
      <text x="40" y="544" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CHÚ GIẢI</text>

      <rect x="40" y="556" width="24" height="16" rx="2" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="72" y="568" fill="#575757" font-size="9" font-family="'Geist', sans-serif">Thao tác</text>

      <rect x="172" y="556" width="24" height="16" rx="2" fill="rgba(23,23,23,0.05)" stroke="#575757" stroke-width="1"/>
      <text x="204" y="568" fill="#575757" font-size="9" font-family="'Geist', sans-serif">Bước kiểm</text>

      <rect x="316" y="556" width="24" height="16" rx="2" fill="rgba(0,107,79,0.08)" stroke="#006B4F" stroke-width="1.4"/>
      <text x="348" y="568" fill="#575757" font-size="9" font-family="'Geist', sans-serif">Chỗ chặn sau vòng này</text>

      <line x1="508" y1="564" x2="536" y2="564" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="544" y="568" fill="#575757" font-size="9" font-family="'Geist', sans-serif">Thứ tự kiểm</text>
    </svg>
  </div>
</body>
</html>
