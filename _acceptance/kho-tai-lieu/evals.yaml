  - id: E2b
    criterion: AC-2
    executor: test
    layer: ui
    cmd: config:executors.test.ktl_man_tao_loi
    paths:
      - "apps/app/app/(app)/[slug]/tai-lieu/**"
      - "apps/app/test/tai-lieu-soan.dom.tsx"
    expected: |
      Man tao, ten trong, bam "Gửi duyệt": co loi "Nhập tên trang." ngay duoi o ten, document.activeElement
      la o ten, khong goi mutation (dem goi = 0); ten 161 ky tu -> loi do dai, khong goi. Doi chung:
      ten hop le -> goi mutation 1 lan. CHIEU DO: ban sao bo focus -> "o loi khong nhan focus".

  - id: E7b
    criterion: AC-7
    executor: test
