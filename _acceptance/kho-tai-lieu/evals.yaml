      hoan tac): bam moi nut tren doan chon -> markdown lien quan xuat hien (9 khang dinh); go "1. " va
      "- " dau dong -> danh sach (2); moi nut co aria-label khong rong (9); khong nut nao co ten anh,
      mau, co chu (tap nut dung bang danh sach viet truoc). CHIEU DO: ban sao bo aria-label nut bang
      -> "nut thieu nhan: bang".

  - id: E9b
    criterion: AC-9
    executor: test
    layer: ui
    cmd: config:executors.test.ktl_soan_giu_thay_doi
    paths:
