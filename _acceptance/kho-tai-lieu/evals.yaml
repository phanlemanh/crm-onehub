      CHIEU DO: ban sao cau hinh tuan tu hoa doi dau danh sach "-" <-> "*" giua hai lan -> do voi ten
      mau va dong dau tien khac.

  - id: E10b
    criterion: AC-10
    executor: test
    layer: backend-effect
