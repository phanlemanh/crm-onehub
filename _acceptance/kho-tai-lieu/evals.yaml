      get boi nguoi thu ba tra noi dung phien ban 1, coBanCho=false; get boi nguoi tao va chu trang
      tra coBanCho=true. CHIEU DO: ban sao get tra coBanCho cho moi nguoi -> "lo co ban cho".

  - id: E9
