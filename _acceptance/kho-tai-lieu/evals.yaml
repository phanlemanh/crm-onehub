schema_version: 1
slug: kho-tai-lieu

evals:
  - id: E1
    criterion: AC-1
    executor: script
    layer: backend-effect
    cmd: config:executors.script.ktl_migration_chi_them
    paths:
      - "packages/db/prisma/migrations/**"
      - "_acceptance/kho-tai-lieu/rang/migration-chi-them.mjs"
    expected: |
      Script suy goc kho tu vi tri cua chinh no; doc moi thu muc migration co tren nhanh ma chua co o
      merge-base voi origin/onehub. Moi cau lenh thuoc tap viet truoc: CREATE TABLE, CREATE INDEX va
      CREATE UNIQUE INDEX tren bang moi, ALTER TABLE <bang moi> ADD CONSTRAINT ... FOREIGN KEY,
      CREATE TYPE, CREATE EXTENSION IF NOT EXISTS (chi unaccent, pg_trgm). Cam UPDATE, DELETE, DROP,
      ALTER COLUMN, RENAME, va moi ALTER TABLE tren bang da co. In so cau lenh doc duoc (> 0).
      CHIEU DO: ba tep gia trong tmpdir ("DROP TABLE contact", "ALTER TABLE department ADD COLUMN x
      TEXT NOT NULL", "CREATE EXTENSION vector") -> ca ba exit 1 voi thong diep ghim
      "migration khong chi them: <loai>".

  - id: E1b
    criterion: AC-1
    executor: script
    layer: backend-effect
    cmd: config:executors.script.ktl_migration_tren_ban_sao
    paths:
      - "packages/db/prisma/**"
      - "_acceptance/kho-tai-lieu/rang/migration-tren-ban-sao.mjs"
    expected: |
      Tao co so du lieu tam rieng, ap migration tai merge-base, gieo 3 cong ty, 2 phong ban, 2
      thanh vien bang SQL cua luoc do cu, doc anh chup [so dong tung bang]; ap migration cua nhanh;
      so lai: moi bang cu giu dung so dong (ma tran viet truoc 5 bang x so dong); extension unaccent
      va pg_trgm co trong pg_extension; SELECT unaccent('Quy định') = 'Quy dinh'. Xoa co so du lieu
      tam o finally. CHIEU DO: migration gia them "DELETE FROM department" -> exit 1, thong diep
      ghim "bang cu mat dong: department 2 -> 0".

  - id: E2
    criterion: AC-2
    executor: test
    layer: backend-effect
    cmd: config:executors.test.ktl_tao_trang
    paths:
      - "apps/api/src/tai-lieu/**"
      - "packages/validation/src/tai-lieu*.ts"
      - "apps/api/test/tai-lieu.spec.ts"
    expected: |
      Goi taiLieu.create that qua tRPC bang phien cua mot member va mot nguoi vai okr. Ma tran slug
      viet truoc (6 ca): "Quy định hoa hồng" -> quy-dinh-hoa-hong; "Đối tác Đà Nẵng" -> doi-tac-da-nang;
      trung ten lan hai -> -2; lan ba -> -3; ten chi co dau cach va ky tu dac biet -> tu choi;
      ten 161 ky tu -> BAD_REQUEST voi thong diep ghim, khong dong nao duoc ghi (dem truoc = sau).
      Noi dung gui o dang NFD -> ban de xuat luu dang NFC (so sanh byte). Trang moi co
      banDangDungId null va dung mot de xuat CHO_DUYET. Doi chung duong: ten hop le 160 ky tu -> tao
      duoc. CHIEU DO: ban sao service bo buoc NFC -> "noi dung khong NFC".

  - id: E3
    criterion: AC-3
    executor: test
    layer: backend-effect
    cmd: config:executors.test.ktl_khong_ro
    paths:
      - "apps/api/src/tai-lieu/**"
      - "apps/api/test/tai-lieu-khong-ro.spec.ts"
    expected: |
      Ma tran viet truoc toan phan: 6 nguoi (T nguoi tao de xuat, C chu trang, O owner, A admin, K thanh
      vien khac, R vai okr) x 5 trang thai (S1 chua tung duyet co ban cho; S2 chua tung duyet co ban bi
      tra lai; S3 dang dung; S4 dang dung co ban cho; S5 dang dung co ban bi tra lai) x 4 thu tuc
      (list, get, proposals, proposal) = 120 khang dinh, moi khang dinh in mot dong.
      Bang thay trang (list co dong + get tra du lieu), viet truoc:
        S1: T C O A thay; K R khong.   S2: T C O A thay; K R khong.
        S3, S4, S5: ca 6 nguoi thay ban dang dung.
      Bang thay de xuat (proposals co dong va dem + proposal tra noi dung, coBanCho cua get):
        S1, S4 (ban cho): T C O A thay; K R khong.
        S2, S5 (ban tra lai): T C O A thay ly do va noi dung; K R khong; khong vao so dem cho duyet.
        S3: khong co de xuat -> proposals rong voi ca 6.
      "Khong thay" = list khong dong, total va facetCounts khong dem, get/proposal tra NOT_FOUND. Voi nguoi
      khong duoc thay: get va proposal tra NOT_FOUND voi DUNG ma va thong diep nhu slug/id khong ton
      tai (so sanh hai loi); list khong co dong do va total, facetCounts khong dem no. Doi chung
      duong: nguoi duoc thay nhan du lieu; ban dang dung doc duoc voi ca 5 nguoi. CHIEU DO: ban sao
      quyen.ts cho moi nguoi thay de xuat -> do voi thong diep ghim "ro de xuat: <nguoi> x <trang thai>".

  - id: E4
    criterion: AC-4
    executor: test
    layer: backend-effect
    cmd: config:executors.test.ktl_duyet
    paths:
      - "apps/api/src/tai-lieu/**"
      - "apps/api/test/tai-lieu.spec.ts"
    expected: |
      Chu trang duyet de xuat dau (diffHash dung): TaiLieuPhienBan so 1 ton tai voi noi dung dung
      byte cua de xuat; banDangDungId tro toi no; de xuat DA_DUYET; mot TaiLieuSuKien loai DUYET voi
      chiTiet parse duoc bang schema. Sua va duyet lan hai -> so 2, phien ban 1 van con nguyen byte.
      Get bang phien thanh vien khac tra noi dung moi va so phien ban 2. Doc generated/server.ts:
      khong thu tuc nao trong taiLieu.* ghi vao TaiLieuPhienBan hay TaiLieuSuKien ngoai create,
      propose, approve, reject (danh sach viet truoc). CHIEU DO: ban sao service ghi phien ban ngoai
      giao dich roi nem loi o buoc dat con tro -> do "phien ban mo coi sau loi".

  - id: E5
    criterion: AC-5
    executor: test
    layer: backend-effect
    cmd: config:executors.test.ktl_quyen_duyet
    paths:
      - "apps/api/src/tai-lieu/**"
      - "apps/api/test/tai-lieu-quyen.spec.ts"
      - "apps/api/test/vai-chi-okr.spec.ts"
    expected: |
      Ma tran viet truoc 7 ca approve: chu trang voi ban nguoi khac tao (duoc), chu trang voi ban
      chinh minh tao (duoc), owner (duoc), admin (duoc), nguoi tao khong phai chu trang (FORBIDDEN),
      thanh vien khac (FORBIDDEN), vai okr (FORBIDDEN); moi ca FORBIDDEN dem so phien ban truoc = sau.
      reject cung ma tran. vai-chi-okr.spec van xanh voi danh sach thu tuc da them taiLieu doc.
      CHIEU DO: ban sao quyenDuyet tra true cho nguoi tao -> "nguoi tao tu duyet duoc".

  - id: E5b
    criterion: AC-5
    executor: test
    layer: ui
    cmd: config:executors.test.ktl_man_duyet_quyen
    paths:
      - "apps/app/app/(app)/[slug]/tai-lieu/**"
      - "apps/app/test/tai-lieu-man-duyet.dom.tsx"
    expected: |
      Dung thanh phan man duyet voi du lieu cua nguoi co quyen va khong quyen: co quyen -> nut
      "Duyet" va "Tra lai" hien; khong quyen -> khong co nut nao trong hai nut. CHIEU DO: truyen
      coQuyen=false ma ban sao van ve nut -> do "nut duyet hien cho nguoi khong quyen".

  - id: E6
    criterion: AC-6
    executor: test
    layer: backend-effect
    cmd: config:executors.test.ktl_so_va_dat
    paths:
      - "apps/api/src/tai-lieu/**"
      - "packages/validation/src/tai-lieu-diff.ts"
      - "apps/api/test/tai-lieu.spec.ts"
    expected: |
      Bon ca viet truoc: (a) hai de xuat A, B cung ban goc; duyet A -> B chuyen CU trong cung giao
      dich, approve B tra CONFLICT, so phien ban khong doi; (b) diffHash gui len sai mot ky tu ->
      CONFLICT, khong ghi gi; (c) de xuat co banGocId khac banDangDungId -> proposal tra cu=true;
      (d) doi chung duong: hash dung, ban goc dung -> duyet duoc. CHIEU DO: ban sao bo kiem banGoc
      -> "de xuat cu van duyet duoc".

  - id: E6b
    criterion: AC-6
    executor: test
    layer: ui
    cmd: config:executors.test.ktl_man_de_xuat_cu
    paths:
      - "apps/app/app/(app)/[slug]/tai-lieu/**"
      - "apps/app/test/tai-lieu-man-duyet.dom.tsx"
    expected: |
      Man duyet voi de xuat cu hien Alert co chu "Ban de xuat nay da cu" va nut "Duyet" disabled;
      de xuat thuong: khong Alert, nut bat. CHIEU DO: ban sao bo co cu -> "nut duyet bat voi de xuat cu".

  - id: E7
    criterion: AC-7
    executor: test
    layer: backend-effect
    cmd: config:executors.test.ktl_tra_lai
    paths:
      - "apps/api/src/tai-lieu/**"
      - "apps/api/test/tai-lieu.spec.ts"
    expected: |
      reject voi ly do rong va 501 ky tu -> BAD_REQUEST, de xuat van CHO_DUYET; ly do 500 ky tu ->
      TRA_LAI, lyDo luu dung; nguoi tao doc proposal thay lyDo; banDangDungId va so phien ban khong
      doi. CHIEU DO: ban sao zod bo min(1) -> "tra lai khong ly do duoc chap nhan".

  - id: E8
    criterion: AC-8
    executor: test
    layer: backend-effect
    cmd: config:executors.test.ktl_sua_trang
    paths:
      - "apps/api/src/tai-lieu/**"
      - "apps/api/test/tai-lieu.spec.ts"
    expected: |
