      - "apps/api/src/tai-lieu/**"
      - "apps/api/test/tai-lieu-bat-dong.spec.ts"
      - "packages/ui/test/fixtures/tai-lieu/**"
    expected: |
      Voi tung mau trong 12 mau cua E10: propose qua tRPC that, doc noiDung da luu tu DB, nap vao ham
