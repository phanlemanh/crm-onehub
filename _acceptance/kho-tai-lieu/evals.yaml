      byte (2 khang dinh). Am tinh kem doi chung: markdown khong chua "Mso", "o:p", "style=", "color",
      "font" (5 x 2), trong khi HTML nguon CO chua cac chuoi do (doi chung duong: fixture that su
      ban). CHIEU DO: (a) ban sao bo bo loc dan -> "con Mso trong markdown: clipboard-word"; (b) ban
      sao giu the b boc ngoai cua Google Docs -> "dam tran: clipboard-gdocs".

  - id: E12
    criterion: AC-12
    executor: ui-check
    layer: ui-observed
    cmd: config:executors.script.ktl_bo_go_viet
    steps:
      - "Canh cay truoc man dau tien; phien do rieng (tien-de.mjs); dang nhap dev:session mot member"
      - "Buoc 1 (1440): mo /tai-lieu/moi, go ten, focus o soan; phat chuoi su kien composition cua Telex cho 'Quy định về hoa hồng đối tác' (compositionstart, compositionupdate tung buoc 'Quy dinh' -> 'Quy định', compositionend) -> anh ktl-bo-go-1.png"
      - "Buoc 2: dang composition do 'hoa' -> 'hoà' thi nhan Enter -> dong moi, khong mat khong nhan doi chu"
      - "Buoc 3: go '- ' roi 'mục một', Enter, 'mục hai' bang composition -> danh sach hai muc -> anh ktl-bo-go-2.png"
      - "Doc noi dung trinh soan va markdown tuan tu hoa; so voi chuoi mong doi dang NFC; khong loi console"
    paths:
