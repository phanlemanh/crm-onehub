      - "apps/app/app/(app)/[slug]/tai-lieu/**"
      - "_acceptance/kho-tai-lieu/rang/bo-go-viet.mjs"
    expected: "exit 0; bo-go-viet.mjs chay trong phien do rieng, Chrome that qua puppeteer-core (CDP Input.imeSetComposition va Input.insertText), in 'buoc N: dat' cho 3 buoc; markdown cuoi dung byte chuoi mong doi NFC. Anh ghi vao .acceptance-runs/kho-tai-lieu/evidence/. CHIEU DO: --chieu-do chay tren ban sao trinh soan tat xu ly composition (chen tung ky tu tho) -> in 'buoc 1: sai chu' ma 1."
    evidence_required: [run_id, exit_code, verifier, verified_at, output, screenshots]

