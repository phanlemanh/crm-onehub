  - id: E8b
    criterion: AC-8
    executor: test
    layer: backend-effect
    cmd: config:executors.test.ktl_man_sua_va_nhan
    paths:
      - "apps/app/app/(app)/[slug]/tai-lieu/**"
      - "apps/api/src/tai-lieu/**"
      - "apps/api/test/tai-lieu-man-sua.spec.ts"
    expected: |
