      - "packages/validation/src/tai-lieu-markdown.ts"
      - "packages/ui/test/trinh-soan-khu-hoi.dom.tsx"
      - "packages/ui/test/fixtures/tai-lieu/**"
    expected: |
      Ma tran viet truoc 12 tai lieu mau trong fixtures/tai-lieu (moi loai nut, danh sach long, bang
