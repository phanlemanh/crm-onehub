<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hỏi-1 — đóng việc cha</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #fafafa;
      --color-ink:     #171717;
      --color-muted:   #575757;
      --color-accent:  #006B4F;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.3;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Hỏi-1 · Cổng Phạm vi · AC-3 · AC-4</p>
    <h1>Đóng việc cha khi còn con mà người đóng không thấy</h1>

    <svg viewBox="0 0 1000 548" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#575757"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#006B4F"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#fafafa"/>

      <!-- ===== Connectors (drawn first) ===== -->
      <!-- Tình huống → lối máy khuyên (trái) -->
      <path d="M440 88 V112 Q440 120 432 120 H248 Q240 120 240 128 V160" fill="none" stroke="#006B4F" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- Tình huống → lối khác (phải) -->
      <path d="M560 88 V112 Q560 120 568 120 H752 Q760 120 760 128 V160" fill="none" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Cột trái -->
      <line x1="240" y1="232" x2="240" y2="272" stroke="#006B4F" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="240" y1="344" x2="240" y2="384" stroke="#006B4F" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- Cột phải -->
      <line x1="760" y1="232" x2="760" y2="272" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="760" y1="344" x2="760" y2="384" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels (mask 16px tall, 6px gap above the line at y=120) -->
      <rect x="296" y="98" width="88" height="16" rx="2" fill="#fafafa"/>
      <text x="340" y="110" fill="#006B4F" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">MÁY KHUYÊN</text>

      <rect x="624" y="98" width="72" height="16" rx="2" fill="#fafafa"/>
      <text x="660" y="110" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">LỐI KHÁC</text>

      <!-- ===== Tình huống đầu ===== -->
      <rect x="248" y="24" width="504" height="64" rx="32" fill="#fafafa"/>
      <rect x="248" y="24" width="504" height="64" rx="32" fill="rgba(23,23,23,0.03)" stroke="rgba(23,23,23,0.30)" stroke-width="1"/>
      <text x="500" y="52" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">A (người giao) kéo việc cha P3 sang Xong</text>
      <text x="500" y="70" fill="#575757" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">P3 có con K4 đang mở — việc riêng của C, A đã bỏ theo dõi nên A không thấy K4</text>

      <!-- ===== Cột trái: Không đếm, không nhắc ===== -->
      <rect x="80" y="160" width="320" height="72" rx="6" fill="#fafafa"/>
      <rect x="80" y="160" width="320" height="72" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="240" y="188" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Không đếm, không nhắc</text>
      <text x="240" y="206" fill="#575757" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">thẻ P3 không có dòng x/y</text>
      <text x="240" y="220" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">con: null · conMo = 0</text>

      <rect x="80" y="272" width="320" height="72" rx="6" fill="#fafafa"/>
      <rect x="80" y="272" width="320" height="72" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="240" y="304" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Không có hộp hỏi lại</text>
      <text x="240" y="322" fill="#575757" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">P3 sang Xong · K4 vẫn mở như cũ</text>

      <rect x="80" y="384" width="320" height="72" rx="36" fill="#fafafa"/>
      <rect x="80" y="384" width="320" height="72" rx="36" fill="rgba(0,107,79,0.08)" stroke="#006B4F" stroke-width="1.4"/>
      <text x="240" y="414" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Không lộ gì về K4</text>
      <text x="240" y="432" fill="#575757" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">giống khung việc từ DA2 · luật 404 · AC-4 giữ nguyên</text>

      <!-- ===== Cột phải: Nhắc không tên ===== -->
      <rect x="600" y="160" width="320" height="72" rx="6" fill="#fafafa"/>
      <rect x="600" y="160" width="320" height="72" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="760" y="188" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Nhắc không tên</text>
      <text x="760" y="206" fill="#575757" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">hộp hỏi lại: «còn việc con bạn không xem được»</text>

      <rect x="600" y="272" width="320" height="72" rx="6" fill="#fafafa"/>
      <rect x="600" y="272" width="320" height="72" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="760" y="304" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">A biết có việc riêng tồn tại</text>
      <text x="760" y="322" fill="#575757" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">không thấy tiêu đề, nhưng biết K4 có mặt</text>

      <rect x="600" y="384" width="320" height="72" rx="36" fill="#fafafa"/>
      <rect x="600" y="384" width="320" height="72" rx="36" fill="rgba(23,23,23,0.03)" stroke="rgba(23,23,23,0.30)" stroke-width="1"/>
      <text x="760" y="414" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Thêm một chữ giao diện</text>
      <text x="760" y="432" fill="#575757" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">đổi AC-4 và E4</text>

      <!-- ===== Legend ===== -->
      <line x1="40" y1="484" x2="960" y2="484" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>
      <text x="40" y="504" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI · HÌNH MANG LOẠI</text>

      <rect x="40" y="516" width="24" height="12" rx="6" fill="rgba(23,23,23,0.03)" stroke="rgba(23,23,23,0.30)" stroke-width="1"/>
      <text x="72" y="526" fill="#575757" font-size="9" font-family="'Geist', sans-serif">Tình huống / kết cục (bầu dục)</text>

      <rect x="264" y="516" width="24" height="12" rx="2" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="296" y="526" fill="#575757" font-size="9" font-family="'Geist', sans-serif">Điều xảy ra (chữ nhật)</text>

      <line x1="460" y1="524" x2="488" y2="524" stroke="#006B4F" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="496" y="526" fill="#575757" font-size="9" font-family="'Geist', sans-serif">Lối máy khuyên</text>

      <line x1="624" y1="524" x2="652" y2="524" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="660" y="526" fill="#575757" font-size="9" font-family="'Geist', sans-serif">Lối khác</text>
    </svg>
  </div>
</body>
</html>
