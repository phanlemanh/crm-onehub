  - id: E11
    criterion: AC-6
    executor: test
    cmd: config:executors.test.mnt_bang_tinh
    paths:
      - "apps/app/app/(app)/[slug]/okr/hop-chon-duong*.tsx"
      - "apps/app/app/(app)/[slug]/okr/hop-thoai-nhap.tsx"
      - "apps/app/app/(app)/[slug]/okr/theo-don-vi/theo-don-vi.tsx"
      - "apps/app/test/mot-nut-tao-muc-tieu.dom.tsx"
    expected: |
      Ca "mnt-bang-tinh": (a) bo-okr?donOkr=pb:x: chon [data-duong=bang-tinh] -> hop chon dong, hop nhap OKR mo,
      chu ky va don vi dien san pb:x; dan lo 2 dong, xem truoc -> 1 lan goi okr.previewImport voi unitId pb:x
      (dau vao parse bang schema input that); ghi -> 1 lan goi okr.applyImport. (b) cua-toi, truong bp:y:
      chon bang-tinh -> dieu huong toi /okr/bo-okr co donOkr=bp:y va tham so mo hop nhap.
      CHIEU DO: ban sao de dong bang-tinh mo hop tao muc tieu -> do "mnt-bang-tinh: khong mo hop nhap".

  - id: E12
    criterion: AC-6
    executor: test
    layer: backend-effect
    cmd: config:executors.test.mnt_api_nhap
    paths:
