  - id: E16
    criterion: AC-9
    executor: ui-check
    layer: ui-observed
    cmd: config:executors.script.mnt_man
    steps:
      - "Chay O TIEN CANH tu goc kho, Bash timeout 600000, nguyen van: MNT_CHEP_ANH=1 EVAL= bun scripts/lan-do/tien-de.mjs --chay \"bun _acceptance/mot-nut-tao-muc-tieu/rang/do-man.mjs\" (no tu dung phien do, chup anh va chi chep anh sang _acceptance/mot-nut-tao-muc-tieu/evidence/ khi co MNT_CHEP_ANH=1)"
      - "Doc dong KET LUAN cuoi: ma 0 = khong dong SAI; ma 2 = khong do duoc; ma 1 = co dong SAI"
      - "Mo cac anh trong _acceptance/mot-nut-tao-muc-tieu/evidence/ va doi chieu bang mat voi Expected"
    inputs:
      - _acceptance/mot-nut-tao-muc-tieu/evidence/
    paths:
      - "apps/app/app/(app)/[slug]/okr/**"
      - "packages/ui/src/components/item.tsx"
      - "packages/ui/src/components/dialog.tsx"
      - "_acceptance/mot-nut-tao-muc-tieu/rang/do-man.mjs"
    expected: |
      Anh cua-toi-dau-trang-1280, bo-okr-hop-1280, suc-khoe-dau-trang-1280, cua-toi-hop-375, bo-okr-hop-375.
      O 1280: dau trang Cua toi co Hoi Kara va Them muc tieu, khong nut "…", khong nhom Soan; hop Them muc tieu
      giua man, tieu de va cau goi ten don vi, bon dong Tu viet · Tu mau · Tu bang tinh · Soan cung Kara, dong
      Soan co dau tia sang; dau trang Suc khoe khong co nut to mau. O 375: hop vua be ngang man, bon dong doc
      tron khong cat chu, trang khong tran ngang. Ban do in "DUNG AC-9 <anh>: tran ngang 0, dong bi cat 0, vung
      bam tron 4/4" cho moi anh hop (vung bam tron = elementFromPoint o goc trai va goc phai moi dong tra ve
      chinh nut dong do). Thieu anh -> khong dat.
