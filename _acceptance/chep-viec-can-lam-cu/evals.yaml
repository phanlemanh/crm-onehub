  - id: E12
    criterion: AC-12
    executor: judgment
    question: >-
      Đọc CONTEXT.md (mục «Việc» và mọi mục nhắc «việc cần làm»), docs/api.md (mục «Việc» và chỗ nói về
      activities), docs/agent.md (mục «Team-agent builder and runner» và chỗ nói về việc onboarding-identify) và
      docs/production.md như một người mới vào kho. Tài liệu có nói rõ sáu điều không: (1) việc cần làm cũ trên dòng
      thời gian đã được chép thành Việc, bản gốc còn trong bảng activity để đảo, và việc chưa chép hiện chỉ đọc;
      (2) cách chạy lệnh viec:chep-cu trên production — đếm, chạy, đếm lại, cờ ALLOW_REMOTE_DB, người chạy phải là
      quản trị — và cách đảo, kể cả bản chép đã đổi; (3) cách đọc hai vế ngưỡng (lệch 0 khi chép; 0 việc cần làm
      mới trong 14 ngày bằng --tu); (4) activities.create không nhận TASK, activities.complete và activities.myTasks
      đã bỏ; (5) Tác nhân tự dựng có quyền crm.activity.create loại TASK nay giao một Việc cho người khởi chạy, và
      việc mã môi giới lệch giao Việc cho người cầm trịch kế hoạch; (6) thứ tự lên — đợi deployment của api chạy xong migration rồi mới chép — và thứ tự lùi — chạy đảo TRƯỚC khi lùi mã, vì lùi mã khi bản chép còn làm một việc hiện hai lần và ma-lech cũ giao trùng. Tài liệu không tự đúc từ ghép tiếng Việt cho
      thuật ngữ kỹ thuật mà CONTEXT.md không có. Trả PASS khi đủ sáu điều, FAIL nêu điều thiếu.
    inputs: [CONTEXT.md, docs/api.md, docs/agent.md, docs/production.md]
    evidence_required: [verdict, rationale, verified_at]

