slug: chep-viec-can-lam-cu
evals:
  - id: E1
    criterion: AC-1
    executor: test
    layer: backend-effect
    cmd: config:executors.test.cvc_chep
    expected: "exit 0; -t cvc-chep-du của packages/db/test/viec-chep.spec.ts trên kho thử. Bảy việc cần làm cũ dựng bằng tx.activity.create theo đúng khuôn mà ba đường ghi cũ để lại (khuôn rút từ activities.service.ts, run-runtime.ts, ma-lech.ts ở sha trước vòng, ghi trong spec): (1) mở có hạn gắn thoả thuận D và công ty C, (2) đã xong gắn cá nhân K, (3) mở gắn kế hoạch P, (4) subject null body 'Gọi lại\\nchi tiết', (5) subject và body null, (6) meta {source:'agent', runId}, (7) meta {platformBrokerId:'MB-1'} gắn P. Chạy chepTatCa qua đúng hàm mà lệnh --chay gọi, với người chạy là quản trị Q. Mỗi việc: số Việc có activityGocId = id khác 1 thì ném 'cvc: chep khong ra dung mot viec <ca>'; sai tieuDe ((4) 'Gọi lại', (5) 'Việc cần làm'), moTa, hanNgay, trangThai ((2) XONG, khepLuc = completedAt; còn lại CHUA_LAM, khepLuc null), nguoiGiaoId = nguoiThucHienId = taoBoiId = createdById, taoLuc = createdAt thì ném 'cvc: chep sai truong <truong> <ca>'; tập hàng ViecGan khác tập cột khác null của activity ((1) đúng hai hàng D và C) thì ném 'cvc: chep sai gan <ca>'; khoaNguon khác 'ma-lech:MB-1' ở (7) hay khác null ở việc khác thì ném 'cvc: chep sai khoa nguon <ca>'; ViecVet không phải đúng một dòng loai 'tao', nguon 'chep-cu', luc = createdAt, sau.activityGocId = id thì ném 'cvc: chep sai vet <ca>'. Bản gốc: JSON của từng hàng activity trước và sau bằng nhau, không thì ném 'cvc: ban goc bi doi <ca>'. Đối chứng âm cùng fixture: một ghi chú NOTE và một hàng CALL không sinh Việc, tổng Việc tăng đúng 7, không thì ném 'cvc: chep ca hoat dong khong phai viec can lam'. Chiều đỏ ở E13 (a)."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [packages/db/prisma/schema.prisma, packages/db/src/viec.ts, packages/db/src/viec-ghi.ts, packages/db/src/viec-chep.ts, packages/db/test/viec-chep.spec.ts]

  - id: E2
    criterion: AC-2
    executor: test
    layer: backend-effect
    cmd: config:executors.test.cvc_chep_lai
    expected: "exit 0; -t cvc-chep-lai của packages/db/test/viec-chep.spec.ts trên fixture của E1 sau một lần chép. Chạy chepTatCa lần hai: số Việc không đổi và kết quả báo chep = 0, không thì ném 'cvc: chep lai nhan ban <n>'. Ca hỏng giữa chừng: thêm ba việc cần làm mới; chepTatCa nhận hàm chép một việc bọc chepViecCanLam thật và ném Error('cvc-loi-cay') đúng ở id việc giữa (chỗ cấy của design doc); chạy chepTatCa: hai việc kia có Việc, việc giữa không có Việc nào, kết quả có mục lỗi mang id việc giữa và lý do, không thì ném 'cvc: hong giua chung lam mat viec khac' hay 'cvc: viec hong khong duoc bao'; gọi lại chepTatCa với hàm chép mặc định: việc giữa được chép, tổng bằng số việc cần làm, không thì ném 'cvc: chay lai khong chep viec da hong'. Ca chạy song song: hai lời chepTatCa cùng lúc (Promise.all) trên một việc cần làm mới — đúng một Việc, không thì ném 'cvc: chay song song nhan ban'. Ca chạy thử: chepTatCa({thu: true}) với hàm cấy lỗi của ca trên trên ba việc mới — kết quả liệt đúng id việc giữa ở loi, vân tay (đếm viec, viecVet, viecGan) trước và sau bằng nhau, không thì ném 'cvc: chay thu ghi vao kho' hay 'cvc: chay thu khong bao loi'. Chiều đỏ ở E13 (b)."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [packages/db/prisma/schema.prisma, packages/db/src/viec-ghi.ts, packages/db/src/viec-chep.ts, packages/db/test/viec-chep.spec.ts]

  - id: E3
    criterion: AC-3
    executor: test
    layer: backend-effect
    cmd: config:executors.test.cvc_nguoi_tao
    expected: "exit 0; -t cvc-nguoi-tao của packages/db/test/viec-chep.spec.ts. Thành viên dựng qua gieoThanhVien: 'cvc-okr' vai okr, 'cvc-roi' đã gỡ khỏi tổ chức (đường gỡ thật của workspace), quản trị 'cvc-q', thành viên thường 'cvc-m'. Ma trận viết trước trong spec: {mở, xong} × {gắn thoả thuận, chỉ gắn kế hoạch, không gắn gì} × {cvc-m, cvc-okr, cvc-roi} = 18 việc cần làm, khuôn E1; số ô đã chạy khác 18 thì ném 'cvc: ma tran nguoi tao thieu o <n>'. chepTatCa với nguoi cvc-q: ô nào không có đúng một Việc thì ném 'cvc: o khong chep duoc <ca>'; 4 ô (mở × {okr, rời} × {thoả thuận, kế hoạch}) cộng 2 ô (mở × {okr, rời} × không gắn) có nguoiGiaoId = nguoiThucHienId = cvc-q, taoBoiId = người tạo cũ và vết 'tao' có sau.nguoiTaoGoc.id bằng người tạo cũ, không thì ném 'cvc: nguoi tao khong nhan van giu <ca>'; 12 ô còn lại giữ người tạo cũ ở cả ba cột, không thì ném 'cvc: viec doi nguoi sai <ca>'. Lệnh từ chối: chepTatCa không có người chạy, hay người chạy là cvc-m, ném lời có 'quản trị' trước khi đọc việc nào và số hàng viec trước và sau bằng nhau, không thì ném 'cvc: chay khong co quan tri van ghi'. Chiều đỏ ở E13 (c)."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [packages/db/src/viec-ghi.ts, packages/db/src/viec-chep.ts, packages/db/src/vai-doi-tac.ts, packages/db/test/viec-chep.spec.ts]

