schema_version: 1
feature_slug: zalo-gui-hong-ghi-ly-do
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.zghl_mo_ta
    paths: [apps/agent/agent/lib/zalo-api.ts, packages/validation/src/zalo-update.ts, apps/agent/agent/lib/zalo-config.ts, apps/agent/test/zalo-gui-hong-ly-do.spec.ts]
    expected: "exit 0; ma trận viết trước mười hai dòng (đếm số dòng đã chạy = 12): mỗi dòng dựng một fetcher giả trả đúng phản hồi của dòng đó (Response thật với status và thân), gọi guiZalo THẬT (zalo-api.ts → zaloGoi → parseZaloSend), bắt lỗi rồi gọi moTaLoiZalo(loi). Khẳng định chuỗi mô tả bằng đúng giá trị viết trước của dòng: HTTP 200 ok:false → zalo-tu-choi 403 «<ghim>»; HTTP 200 {ok:false} → zalo-tu-choi - «-»; HTTP 200 thân lạ → hinh-dang-la khoa=<khoá>; HTTP 400, 401, 403, 404, 408, 429 kèm thân {ok:false,error_code,description:'<ghim>'} → http-<mã> zalo-tu-choi <mã> «<ghim>»; HTTP 500 thân chữ không phải JSON → http-500; lỗi mạng → mang (ECONNRESET); sai thì ném «<dòng>: mo ta <thực> khac <mong>», riêng sáu dòng HTTP có thân mà thiếu ghim thì ném «<dòng>: mat description». Thêm một dòng description dài hơn ZALO.nhatKy.tranMoTa: mô tả có đúng tranMoTa ký tự của description. CHIỀU ĐỎ (rang/dot-bien.mjs): cặp (a) bản sao cho moTaLoiZalo trả loi.name như cũ → dòng 1 đỏ «mo ta Error khac»; cặp (b) bản sao bỏ cắt trần → dòng dài đỏ «khong cat o tran»; cặp (l) bản sao cho zaloGoi ném LoiHttpZalo mà không đọc thân → dòng HTTP 403 đỏ «http-403: mat description»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.zghl_408
    paths: [apps/agent/agent/lib/zalo-api.ts, apps/agent/test/zalo-gui-hong-ly-do.spec.ts]
    expected: "exit 0; hai dòng: (1) fetcher giả trả HTTP 408 {ok:false,error_code:408} cho getUpdates → parseZaloGetUpdates(await zaloGoi(..., 'getUpdates', ...)) trả { loai: 'het' }; (2) cùng phản hồi cho sendMessage → guiZalo ném LoiHttpZalo status 408 và moTaLoiZalo trả «http-408» — sai thì ném «408 sendMessage bi cho lot». CHIỀU ĐỎ: cặp (c) bản sao trả ngoại lệ 408 về cho mọi lệnh → dòng (2) đỏ «408 sendMessage bi cho lot»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

