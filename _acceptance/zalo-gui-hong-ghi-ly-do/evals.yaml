    cmd: config:executors.test.zghl_rieng_tu
    paths: [apps/agent/agent/lib/zalo-api.ts, apps/agent/agent/lib/zalo-nhan.ts, apps/agent/agent/lib/zalo-tra-loi.ts, apps/agent/test/zalo-gui-hong-ly-do.spec.ts]
    expected: "exit 0; chạy lại đầu vào của E1 dòng 1, E3 và E4 với token «tok-rieng-tu-h4», chat id «chat-rieng-tu-h4» và chữ tin «chu-rieng-tu-h4»; gom mọi dòng console đã thu; đối chứng dương: ít nhất một dòng «[zalo]» đã được thu; khẳng định không dòng nào chứa ba chuỗi đó — có thì ném «lo <chuỗi> trong nhat ky». CHIỀU ĐỎ: cặp (g) bản sao cho moTaLoiZalo nối thêm loi.message gốc của zaloGoi (có đường dẫn mang token) → đỏ «lo tok-rieng-tu-h4 trong nhat ky»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
