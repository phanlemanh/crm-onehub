  - id: E9
    criterion: AC-7
    executor: test
    cmd: config:executors.test.zghl_doi_bot
    paths: [apps/agent/agent/lib/zalo-bot-xuong.ts, packages/validation/src/zalo-cau-noi.ts, apps/agent/test/zalo-gui-hong-ly-do.spec.ts]
    expected: "exit 0; kho thử có AppSetting với token cũ «111:cu» (bot «Bot Cũ»), khoá cũ và ba zaloLink gieo bằng hàm nối thật (noiBangMa của @crm/db/zalo-lien-ket qua mã do taoMaLienKet sinh — không ghi hàng tay). Fetcher giả: getMe(token cũ) → id «111», getMe(token mới «222:moi») → id «222», tên «Bot Mới». Gọi datBot THẬT với token mới, không xacNhanDoiBot → kết quả { outcome: 'can-xac-nhan-doi-bot', soLienKet: 3, tenBotMoi: 'Bot Mới' }; AppSetting (token, khoá, tên) và ba zaloLink giữ nguyên; fetcher KHÔNG nhận setWebhook. Ca phụ: getMe(token cũ) trả 401 → so phần <số> của hai token, vẫn ra can-xac-nhan-doi-bot. CHIỀU ĐỎ (cặp h): bản sao bỏ bước hỏi → đỏ «doi bot khong hoi, da go 3 lien ket»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E10
    criterion: AC-8
    executor: test
    cmd: config:executors.test.zghl_doi_bot_dong_y
    paths: [apps/agent/agent/lib/zalo-bot-xuong.ts, apps/agent/test/zalo-gui-hong-ly-do.spec.ts]
    expected: "exit 0; cùng bàn thử E9, gọi datBot với xacNhanDoiBot: true. Hai ca: (1) setWebhook giả trả {ok:true,result:{url,…}} → AppSetting mang token và tên bot mới, count(zaloLink) = 0, đúng một dòng console «[zalo] doi bot: go 3 lien ket», dòng đó không chứa «moi» hay «cu» (phần bí mật của token); (2) setWebhook giả trả {ok:false} → AppSetting còn token cũ và count(zaloLink) = 3. CHIỀU ĐỎ (cặp i): bản sao gỡ liên kết TRƯỚC setWebhook → ca (2) đỏ «zalo tu choi ma lien ket da bi go»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E11
