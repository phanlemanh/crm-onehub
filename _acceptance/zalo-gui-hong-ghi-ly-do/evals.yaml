    expected: "exit 0; ma trận tám chỗ viết trước (đếm = 8). Mỗi chỗ chạy hàm THẬT xuất từ tệp của nó (guiThu, getMe của datBot, traLoiVe, loiVe, đường sendChatAction và đường không mở được phiên của zalo-tra-loi, batDauLai qua xuLyTinDen, dongHoiQuaHan) với fetcher giả trả HTTP 200 {ok:false,error_code:403,description:'ghim-ly-do-h4'} và DB của kho thử khi hàm cần; spyOn(console, 'error') thu dòng; khẳng định có đúng một dòng bắt đầu «[zalo]» chứa «zalo-tu-choi 403 «ghim-ly-do-h4»» — sai thì ném «<chỗ>: khong co ly do». CHIỀU ĐỎ: cặp (d) bản sao trả một chỗ (zalo-tra-loi.ts trả lời phiên) về loi.name → dòng đó đỏ «tra-loi-phien: khong co ly do»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

