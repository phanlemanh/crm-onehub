schema_version: 1
slug: ma-tran-phai-co-chieu-song
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.mt_bat_bien
    paths:
      - apps/agent/test/quyen-luot.spec.ts
      - apps/agent/agent/lib/custom-agent-dispatch.ts
    expected: >-
      Khoi describe("bat-bien") cua apps/agent/test/quyen-luot.spec.ts.
      Dung HAI hang submission chi khac nhau o `message.inputResponse`: mot hang
      mang { requestId, text }, hang kia mang { requestId, optionId }. Moi truong
      con lai — id, commandType, attachments, conversation.userId,
      conversation.title — GIONG HET.
      Moi hang di qua builderSessionAuthFromRow(hang, conversationId), lay
      .attributes cua ket qua.
      Then: hai khoi attributes BANG NHAU SAU — toHaveEqual/toEqual tren ca
      object, KHONG so tung truong bang tay. Mot thuoc tinh MOI moc them se lot
      qua phep so tung truong da viet truoc, ma do chinh la hinh dang dot bien
      cua AC-3.
      VA: tap khoa cua khoi attributes bang dung tap da ghim trong bai do
      (commandType, conversationId, userId, submissionId, hasTitle, purpose,
      authenticator... — ghim nguyen van tap that, lay tai luot dau).
      CAM dung khoi tham so cua builderSessionAttributes lam fixture: fixture la
      HANG, vi cho ma rut truong tu hang chinh la cho mot suy dien moi se moc.
      CHIEU DO cua AC-1 KHONG do o day: no do o E3 (rang dot bien hai tep) —
      cung khuon ma ho so truoc dung cho AC-1 va AC-4 cua no.
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.mt_cong_hai_bien_the
    paths:
      - apps/agent/test/quyen-luot.spec.ts
      - apps/agent/agent/lib/session-purpose.ts
      - apps/agent/agent/subagents/agent_builder/lib/authorization.ts
    expected: >-
      Khoi describe("suy-dien") — GIU NGUYEN TEN (lenh ql_khong_suy_dien cua ho
      so cu loc theo ten nay; AC-4 doi khoi con ton tai).
      Tren CUNG hai hang cua E1: hang khai commandType "CHAT" thi
      builderTurnApproval tra { type: "denied" } voi reason BANG NGUYEN VAN
      BUILDER_DENIED_REASON (so nguyen van, khong so "co chua"), va
      requireBuilderAttribute(ctx, "conversationId") NEM loi — o CA HAI bien the.
      Doi chung duong tren cung hang: doi DUNG MOT truong commandType sang
      "CREATE_AGENT", moi truong khac giu nguyen -> "not-applicable" VA
      requireBuilderAttribute tra ve gia tri — cung o ca hai bien the.
      Chi mot chieu chay -> ma 1: mot cong luon-dong va mot cong luon-mo deu cho
      mot mau xanh neu chi do mot chieu.
      CHIEU DO cua AC-2 KHONG do o day: no do o E3.
  - id: E3
    criterion: AC-3
    executor: script
    cmd: config:executors.script.mt_dot_bien_hai_tep
    paths:
      - apps/agent/test/quyen-luot.spec.ts
      - apps/agent/agent/lib/custom-agent-dispatch.ts
      - apps/agent/agent/lib/session-purpose.ts
      - _acceptance/ma-tran-phai-co-chieu-song/rang/**
    expected: >-
      Rang dung cay sao roi cam MOT dot bien HAI TEP, va doi BA dieu tren cung
      ban sao ay.
      Dot bien:
      (1) custom-agent-dispatch.ts — them vao khoi thuoc tinh phien mot khoa MOI
      suy tu CO MAT `optionId` trong message.inputResponse (khoa moi KHONG mang
      ten commandType);
      (2) session-purpose.ts — cho builderTurnAuthorized doc khoa moi ay, mo cong
      khi no bat.
      Ba dieu phai dung het:
      1. Bai do cua E1 (describe "bat-bien") phai DO: hai khoi attributes thoi
      bang nhau vi khoa moi mang gia tri khac o hai bien the.
      2. Bai do cua E2 (describe "suy-dien") phai DO: bien the mang optionId mo
      duoc cong du hang khai CHAT.
      3. Tren CHINH ban sao da dot bien ay, HAI san AST cua ho so truoc van
      THOAT 0, chay bang co --goc tro toi GOC BAN SAO:
      node <goc rang>/khong-cam-tin-nhan.mjs --goc <ban sao> va
      node <goc rang>/nguon-ghi.mjs --goc <ban sao>. Duong toi hai san suy tu
      VI TRI SCRIPT, khong ghim cung goc kho; rang PHAI in ra duong tuyet doi
      da chay va duong goc ban sao, de nguoi doc thay no doc dung cay nao.
      Dieu 3 la thu chung minh vong nay mua mot thu khong ai ban — bo mot trong
      hai dieu dau thi rang chi lap lai mot san da co.
      4. DOI CHUNG DUONG cho dieu 3 — bat buoc, vi dieu 3 la mot assert AM TINH
      va mot assert am tinh mot minh khong phan biet duoc "san doc cay dung va
      khong thay gi" voi "san doc nham cay chua dot bien". Tren CHINH ban sao
      ay, cam THEM hinh dang cu — ternary doc inputResponse ngay tai cho goi
      builderSessionAttributes — roi chay lai hai san: ca hai phai thoat KHAC 0.
      Ca hai van thoat 0 -> ma 3 (gian do hong): rang dang doc nham cay, va moi
      ket luan cua dieu 3 la rong.
      Thieu bat ky dieu nao -> ma 2, in ro dieu nao truot.
      Doi chung duong: truoc khi cam dot bien, ca hai bai do tren ban sao phai
      XANH — khong xanh -> ma 3 (gian do hong).
      vecto "khoa-moi-o-cong": chinh dot bien hai tep mo ta o tren.
      Khong tim thay moc de cam o mot trong hai tep -> ma 3, in ten tep.
  - id: E4
    criterion: AC-4
    executor: script
    cmd: config:executors.script.mt_khong_moc_lai
    paths:
      - apps/agent/test/quyen-luot.spec.ts
      - _acceptance/ma-tran-phai-co-chieu-song/rang/**
    expected: >-
      Doc apps/agent/test/quyen-luot.spec.ts bang AST, KHONG tim chuoi.
      HAI dieu:
      1. Trong khoi describe("suy-dien") khong con hinh dang "ghim so luong ma
      khong ghim khac biet": mot loi goi expect(X).toHaveLength(n) dung ngay
      truoc mot vong for...of duyet CHINH X, ma than vong KHONG chua mot phep so
      sanh giua hai luot (toEqual/toStrictEqual tren hai gia tri lay tu hai lan
      lap khac nhau). Vi pham -> ma 2, in file:dong.
      2. Khoi describe("suy-dien") CON TON TAI voi dung ten do va co it nhat mot
      bai ben trong. Mat khoi ay -> ma 2: lenh ql_khong_suy_dien cua ho so cu loc
      theo dung ten nay.
      Dieu 1 KHONG duoc khop mot cach viet duy nhat: loi hua la QUAN HE (chieu
      bien thien phai song), nen san phai bat moi phep duyet tren mot mang
      da ghim so luong ma than khong chua so sanh cheo luot — for...of, .forEach,
      va it.each/describe.each.
      Doi chung duong, BON vecto tren ban sao, tat ca deu ma 2:
      vecto "cay-lai-for-of": cay lai dung khoi cu — mot toHaveLength(2) dung
      truoc mot for...of tren cung mang, than vong chi assert tung luot.
      vecto "cay-lai-foreach": cung hinh dang do viet bang BIEN_THE.forEach.
      vecto "cay-lai-it-each": cung hinh dang do viet bang it.each(BIEN_THE).
      vecto "cay-vao-bai-co-san": cay hinh dang cu vao BEN TRONG mot bai DA CO
      san phep so cheo hai luot. Ba vecto tren deu cay mot bai MOI hoac mot cau
      o than describe — ba diem-case cung MOT vi tri; vecto nay la thu duy nhat
      chung minh pham vi do la THAN VONG chu khong phai ca bai. Vong cham 2 da
      do: truoc khi va, dung vecto nay chay qua san voi ma 0.
      Bon cach viet nay la bon duong ma chieu chet moc lai duoi ten khac; bat
      mot duong roi tuyen da chan ca lop chinh la lop loi vong nay ton tai de va.
      Khong do o vecto nao -> ma 2 (THUOC DO THUNG, khong phai gian do hong):
      mot dot bien song sot la vi pham cua chinh phep do, dung nghia ma 2.
      LENH TRAN (khong co --vecto) chay CA san tinh LAN bon vecto roi moi thoat 0
      — chieu do duoc noi vao chinh lenh cong, khong nam ngoai no.
  - id: E5
    criterion: AC-5
    executor: test
    layer: backend-effect
    cmd: config:executors.test.mt_ho_so_cu_con_chay
    paths:
      - apps/agent/test/quyen-luot.spec.ts
      - apps/agent/agent/**
      - _acceptance/ma-tran-phai-co-chieu-song/rang/**
    expected: >-
      Chay lai CHIN lenh may cua HAI ho so da ky ma paths cua no cham
      apps/agent/test/quyen-luot.spec.ts: dq_cong_quyen · dq_khong_cam_tin_nhan ·
      dq_nguon_ghi · dq_bo_do_grep · dq_khai_sinh · dq_ho_so_cu_con_chay ·
      ql_quyen_ke_thua · ql_khong_suy_dien · ql_api_doc_ban_ghi.
      ql_khong_suy_dien phai co mat va phai goi dich danh: hop dong nay HAI LAN
      vien chinh no lam ly do khoi describe("suy-dien") giu nguyen ten.
      Moi lenh phai thoat 0. Mot lenh khac 0 -> ma cua lenh ay, IN ten lenh.
      Vi sao AC nay ton tai: `recheck: strict`. Sua quyen-luot.spec.ts la cham
      dung tep ma ho so vua ky do — dq_bo_do_grep soi hinh dang cua chinh tep ay,
      va dq_khai_sinh chay 23 vecto trong do hai vecto dung bai cua khoi
      describe("suy-dien"). Khong co AC nay thi vong do o Cong 2 vi mot phep do
      cua vong khac.
      KHONG duoc lam xanh bang cach xoa hay doi ten khoi describe: AC-4 diem 2
      doi khoi ay con ton tai voi dung ten.
  - id: E6
    criterion: AC-6
    executor: script
    cmd: config:executors.script.mt_neo_bien_the
    paths:
      - apps/api/src/conversations/conversations.service.ts
      - apps/agent/test/quyen-luot.spec.ts
      - _acceptance/ma-tran-phai-co-chieu-song/rang/**
    expected: >-
      San dan so cho TAP BIEN THE, doc bang AST — khong tim chuoi.
      Di tu NOI MAY CHU SINH RA gia tri: trong
      apps/api/src/conversations/conversations.service.ts, tim bieu thuc dieu
      kien gan cho bien `inputResponse` va dem so NHANH cua no (hom nay: hai
      nhanh — nhanh optionId va nhanh text). Khong tim thay bieu thuc ay -> ma 3
      (gian do hong), in ten tep: dan so rong khong duoc doc thanh "dat".
      Doc tiep apps/agent/test/quyen-luot.spec.ts, dem so hang ma bai do cua
      AC-1 dung (so phan tu cua mang bien the da ghim).
      Hai con so phai BANG NHAU, va bang so da ghim trong chinh chan do. Lech ->
      ma 2, in CA HAI con so kem file:dong cua bieu thuc.
      Vi sao di tu writer chu khong tu bai do: mot tap viet tay khong biet minh
      thieu. Day la bai hoc [do-quyen-luot-bang-hanh-vi#F1] — fixture dung khuon
      ben doc ma khong round-trip tu noi gia tri sinh ra.
      Doi chung duong, vecto "them-nhanh-thu-ba": cay them mot nhanh thu ba vao
      bieu thuc ay trong ban sao (vi du nhanh fileId) -> so nhanh thanh 3 trong
      khi bai do van dung 2 hang -> ma 2, in "3" va "2". Khong do -> ma 2 (thuoc do thung).
      LENH TRAN (khong co --vecto) chay CA san dan so LAN vecto roi moi thoat 0
      — chieu do duoc noi vao chinh lenh cong, khong nam ngoai no.
