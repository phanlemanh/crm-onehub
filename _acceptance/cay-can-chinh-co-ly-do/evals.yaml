slug: cay-can-chinh-co-ly-do
evals:
  - id: E1
    criterion: AC-1
    executor: test
    layer: backend-effect
    cmd: config:executors.test.l3_canh
    expected: "exit 0; apps/api/test/okr-cay-ly-do.spec.ts -t l3-canh (CSDL kiểm thật, bộ mẫu nạp bằng batDauMau): quản trị gọi okr.cayCanChinh qua tRPC (goi của tro-ly-okr-san) cho chu kỳ quý 4; đầu ra parse bằng cayCanChinhOutput thật. Tập cạnh mong đợi rút từ writer thật — okr.objective của từng mục tiêu có mặt trong cây, mỗi alignment có đích có mặt trong cây thành một cặp (tu, den) — rồi so: số phần tử canh === số cặp mong đợi; với từng cặp, lyDo/canCu/lyDoTuKara/mucTin bằng đúng giá trị okr.objective trả; ba ca L2 (q4-kd-bac-1 co-so-lieu, q4-kd-bac-2 dat-cuoc, q4-kd-nam-2 chua-co-ly-do) có mặt; đối chứng dương: số cạnh có den là KR ≥ 1 và số cạnh có den là mục tiêu ≥ 1 (không thì exit 1 'thieu loai dich'). roots và chuaCanChinh bằng đúng (toEqual) đầu ra của bản trước vòng: dựng lại bằng dungCayCanChinh + gan như service (không đổi). Chiều đỏ ghim ở E11 (a): service chỉ dựng cạnh có đích là KR → 'canh thieu: <tu>-><den>'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [apps/api/src/okr/okr-xem.service.ts, apps/api/src/okr/okr-xem.contracts.ts, apps/api/test/okr-cay-ly-do.spec.ts]

  - id: E2
    criterion: AC-2
    executor: test
    layer: backend-effect
    cmd: config:executors.test.l3_quyen
    expected: "exit 0; cùng tệp, -t l3-quyen: (1) bài thuần canhCuaCay (xuất từ okr-xem.service.ts) với tập viết trước — Y góp vào X (X không có trong tập), Z góp vào KR W1 của W (có trong tập), V góp vào W (có trong tập) — đòi đúng tập cạnh {Z->W1, V->W}, in 'canh lo ra ngoai cay: Y->X' nếu Y->X có mặt; đối chứng dương: thêm X vào tập thì Y->X có mặt. (2) Trên bộ mẫu, với từng người dùng của cong-ty.json (đếm số người chạy === số người trong bộ mẫu), mọi canh.tu và canh.den ∈ tập id nút cây của chính họ (đếm vi phạm === 0). Chiều đỏ ghim ở E11 (b): bỏ lọc đích có mặt → 'canh lo ra ngoai cay'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [apps/api/src/okr/okr-xem.service.ts, apps/api/test/okr-cay-ly-do.spec.ts]

  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.l3_nut
    expected: "exit 0; apps/app/test/cay-can-chinh-ly-do.dom.tsx -t l3-nut: dựng CayCanChinh thật với roots/chuaCanChinh/canh parse bằng cayCanChinhOutput thật: gốc O → KR K → mục tiêu P, cạnh (P, K) co-so-lieu, lyDoTuKara true. Trong [data-nut-can-chinh=P]: textContent nhãn [data-muc-tin] === mo.sheet.mucTin['co-so-lieu'] (bảng chung của L2), data-tone của chấm === toneTheoNghia(NGHIA_MUC_TIN['co-so-lieu']), textContent [data-ly-do-cau] === lyDo, số [data-slot=kara-trace] === 1. Nút O và nút K: số [data-ly-do-canh] === 0. Chiều đỏ ghim ở E11 (c): đọc cạnh theo (P, O) thay vì (P, cha thật) → 'ly do sai cha'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: ["apps/app/app/(app)/[slug]/okr/cay-can-chinh.tsx", apps/app/test/cay-can-chinh-ly-do.dom.tsx]

