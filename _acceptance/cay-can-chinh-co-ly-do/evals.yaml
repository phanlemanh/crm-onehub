    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: ["apps/app/app/(app)/[slug]/okr/cay-can-chinh.tsx", apps/app/components/crm/record-sheet/ly-do-noi-gop.tsx, apps/app/test/cay-can-chinh-ly-do.dom.tsx]

