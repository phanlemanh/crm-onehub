    cmd: config:executors.test.l3_loc
    expected: "exit 0; cùng tệp, -t l3-loc: cây viết trước có gốc O, KR K1, K2; con P1 (chua-co-ly-do) dưới K1, P2 (dat-cuoc) dưới K1, P3 (co-so-lieu) dưới K2, P4 (chua-co-ly-do) dưới P3; nhóm chưa căn chỉnh có Q. Ma trận ba giá trị lọc × tập id nút hiện, viết trước: chua-co-ly-do → {O, K1, P1, K2, P3, P4} (P3 hiện vì là tổ tiên của P4), không có P2, Q; dat-cuoc → {O, K1, P2}; tat-ca → mọi nút kể cả Q. Đòi số ca === 3; với mỗi ca so tập id [data-nut-can-chinh] hiện ra bằng đúng tập viết trước (in thừa/thiếu). Bấm chip qua ToggleGroup thật; giá trị đường dẫn (NuqsTestingAdapter onUrlUpdate) === khoá SEARCH_PARAM mới với giá trị mức. Chiều đỏ ghim ở E11 (e): bỏ giữ tổ tiên → ca chua-co-ly-do in 'thieu: O, K1'."
