      - "Cảnh trước màn đầu: phiên đo riêng (do:man / tien-de.mjs, luật 8), bộ mẫu nạp bằng okr:mau kèm ca sơ đồ của DH4; tâm và KR công ty kỳ vọng rút từ hằng mtSoDo của ca-so-do.ts, không rút từ đầu ra API"
      - "Vùng nội dung = hộp của main[data-slot=page-shell-scroll] do KhungTrangOkr dựng (phần vỏ khu phải thanh bên, dưới đầu ứng dụng), đo bằng getBoundingClientRect, không đo chính [data-slot=page-shell] chứa khung vẽ. Ở 1440×1000: mở Báo cáo › Sơ đồ bằng mục thanh bên thật; bề rộng [data-flow-map] ≥ bề rộng vùng nội dung − 48 px, đáy [data-flow-map] ≥ innerHeight − 24 px, scrollingElement.scrollHeight === innerHeight và scrollWidth === innerWidth (đối chứng đỏ: bản sao đặt khung vẽ cao 600 px → in 'khung ve khong chiem tron'); chụp ảnh. Bấm «Toàn màn hình»: bề rộng khung vẽ tăng ≥ bề rộng thanh bên khu đã đo − 2 px, thanh bên vắng, và bề rộng khung vẽ ≥ bề rộng vùng nội dung − 48 px (ở trạng thái này vùng nội dung > 1280 nên max-w-7xl lộ ra; đối chứng đỏ: bản sao bọc trang bằng PageShell mặc định → in 'khung con be rong toi da'); chụp. Nhấn Esc: thanh bên trở lại; chụp. Lặp phép đo bề rộng ở 1920×1080 khung thường (cùng đối chứng đỏ)"
      - "Điều hướng thật giữ toàn màn hình: đặt window.__vk6Dau = 1, bật «Toàn màn hình», bấm một thẻ mục tiêu trên khung vẽ để mở ngăn (không page.goto), bấm «Xem trên sơ đồ» trong ngăn → URL thành /okr/so-do/muc-tieu/<id>, [data-slot=area-sidebar] vắng, nút toàn màn hình aria-pressed=true, window.__vk6Dau === 1 (không tải lại); bấm «Về sơ đồ cả công ty» → URL /okr/so-do, kiểm lại ba điều ấy. Mỗi kiểm in 'DUNG <ca>' hoặc 'SAI <ca>'. Đối chứng đỏ: bản sao đổi nút trong ngăn thành <a> thường không qua Link → in 'SAI dieu-huong-giu-toan-man: tai-lai'"
      - "Mở ngăn chi tiết của sd-a1-1 (?record=objective:<id>), bấm «Xem trên sơ đồ» thật: Sơ đồ lấy tâm, dòng góp lên công ty có tập KR === tập rút từ hằng bộ gieo ({n1-k1}); chụp"
      - "Ở 390×844: mở Sơ đồ cả công ty và Sơ đồ lấy tâm: danh sách hiện, không khung vẽ, không cuộn ngang ở cấp trang (đối chứng đỏ: chèn khối rộng vào body bản sao); chụp hai ảnh"
    expected: "exit 0; 6 ảnh trong .acceptance-runs/so-do-toan-vung/ (bàn đo không ghi vào hồ sơ đã ký nào); mỗi kiểm in 'DUNG', kể cả hai ca điều hướng thật; console không lỗi."
