slug: test-nghe-127
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.t127_quet
    expected: "exit 0; _acceptance/test-nghe-127/rang/quet.mjs trên cây làm việc, quét mọi tệp git theo dõi khớp apps/*/test/**, packages/*/test/**, scripts/**/test/** (.ts .tsx .mjs .js). Ma trận viết sẵn trong tệp: đúng 13 tệp có Bun.serve (tập KHAI.bunServe) và 17 lời gọi Bun.serve; lệch tập thì ném 'quet: ma tran Bun.serve lech — thieu <…> thua <…>', lệch số thì 'quet: so Bun.serve <n> khac khai 17'. Mỗi khối Bun.serve({…}) thiếu hostname: \"127.0.0.1\" thì ném 'quet: bunServe con <n> cho khong nghe 127.0.0.1' và in từng tệp:dòng; mỗi URL dạng http://localhost:${…} trong vùng quét thì ném 'quet: localhost con <n> cho …'. Chiều đỏ ở E1b."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [apps/*/test/**, packages/*/test/**, scripts/**/test/**, _acceptance/test-nghe-127/rang/quet.mjs]

  - id: E1b
    criterion: AC-1
    executor: script
    cmd: config:executors.script.t127_quet_goc
    expected: "exit 0; cùng máy quét đọc mốc gốc 33ddf1b02 (git show) ở chế độ --mong-do, đòi bắt đúng số vi phạm đã khai trước: bunServe 15, dangLa 0, listen 2, taoApp 49, localhost 6; số nào khác thì ném 'quet goc: <loại> bat <n> vi pham, ky vong <m>'. Đây là chiều đỏ của E1 và E2 trên cùng máy quét: mã chưa sửa thì máy quét liệt đủ từng chỗ."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [_acceptance/test-nghe-127/rang/quet.mjs]

  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.t127_quet
    expected: "exit 0; cùng lượt E1. Ở apps/api/test: đúng 49 chỗ dựng app (createApp() · .createNestApplication(), khai KHAI.soTaoApp), lệch thì ném 'quet: so cho dung app api <n> khac khai 49'; ma trận viết sẵn số chỗ dựng app theo từng tệp (KHAI_DUNG_APP, 46 tệp), lệch thì ném 'quet: ma tran dung app lech <tệp> khai <n> thuc <m>'. Mỗi chỗ phải gán vào một biến và gọi <biến>.listen(0, \"127.0.0.1\") trước chỗ dựng app kế tiếp và trong 600 ký tự, không thì ném 'quet: taoApp con <n> cho khong nghe 127.0.0.1' và in tệp:dòng biến. Mọi lời gọi .listen(...) trong vùng quét — kể cả listen() không đối số — thiếu \"127.0.0.1\" thì ném 'quet: listen con <n> cho khong nghe 127.0.0.1'. Đối chứng ngay trong lượt: năm ca tự thử (lành; hai app sát nhau chỉ một nghe; listen() trống; Bun.serve(bien); localhost:${…}) phải bắt đúng số, lệch thì ném 'quet: tu thu <ca> <loai> bat <n> ky vong <m>'. Chiều đỏ ở E1b (taoApp 49, listen 2 trên mốc gốc)."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [apps/api/test/**, _acceptance/test-nghe-127/rang/quet.mjs]

  - id: E3
    criterion: AC-3
    executor: script
    cmd: config:executors.script.t127_co_che
    expected: "exit 0; _acceptance/test-nghe-127/rang/co-che.ts giữ 127.0.0.1:P bằng một socket trả 'SSH-2.0-limactl'. Bun.serve và http.createServer của Node nghe cổng P không hostname phải nghe được và fetch http://127.0.0.1:P phải ra Malformed_HTTP_Response, không thì ném 'co che: <ten> khong tai tao duoc loi <json>' (chiều đỏ của cơ chế). Cả hai nghe cổng P với hostname 127.0.0.1 phải bị từ chối, không thì ném 'co che: <ten> van nghe duoc cong bi giu <json>'. Đối chứng dương: máy chủ 127.0.0.1 cổng 0 trả '200 ok', không thì ném 'co che: doi chung 127 cong 0 hong <…>'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [_acceptance/test-nghe-127/rang/co-che.ts]

  - id: E4
    criterion: AC-4
    executor: script
    cmd: config:executors.script.t127_khang_dinh
    expected: "exit 0; _acceptance/test-nghe-127/rang/khong-doi-khang-dinh.mjs đọc mọi commit không phải merge có 'test-nghe-127' trong message, lấy diff -U0 của các tệp test chúng đổi. Nguồn diff: git diff -U0 <merge-base với origin/onehub>...HEAD trên tệp test; nhánh đã gộp (diff rỗng) thì đọc các commit không phải merge mang 'test-nghe-127'. Mỗi dòng bỏ phải ghép được với một dòng thêm theo sáu dạng của AC-4 (listen(0) → listen(0, \"127.0.0.1\"); http://localhost:${ → http://127.0.0.1:${ chỉ ở dòng không có expect/toBe/toEqual/toContain/toMatch; chèn hostname giữa dòng Bun.serve({ port: …,; <x>.init() → <x>.listen(0, \"127.0.0.1\"); await app.listen(0, \"127.0.0.1\") → app.getHttpServer()) hoặc là dòng 'await <x>.listen(0);' bỏ thuần; mỗi dòng thêm còn lại phải là 'hostname: \"127.0.0.1\",' hoặc 'await <x>.listen(0, \"127.0.0.1\");'. Lệch thì ném 'khang dinh: <tệp>:<dòng> bo|them dong ngoai nam dang «…»'. Không commit nào đổi tệp test thì ném 'khang dinh: khong commit nao cua test-nghe-127 doi tep test'. Đối chứng ngay trong lượt: năm ca tự thử (lành đạt; hostname giữa dòng đạt; đổi expect, expect đổi localhost và thêm dòng lạ bị bắt), lệch thì ném 'khang dinh: tu thu <ca> ra <kq> ky vong <kq>'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [apps/*/test/**, packages/*/test/**, scripts/**/test/**, _acceptance/test-nghe-127/rang/khong-doi-khang-dinh.mjs]

  - id: E4b
    criterion: AC-4
    executor: test
    cmd: config:executors.test.t127_scripts
    expected: "exit 0; bun test scripts/tin-hieu/test scripts/ban-chup-lo-trinh/test chạy xanh sau khi máy chủ tạm nghe 127.0.0.1 và URL đổi sang 127.0.0.1 — hai bộ này nằm ngoài suite của turbo nên phải chạy riêng; mọi lời ném giữ nguyên chuỗi đã có. Các tệp đã đổi ở apps/api, apps/agent, packages/db chạy trong suite của S4."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [scripts/tin-hieu/**, scripts/ban-chup-lo-trinh/**]

  - id: E5
    criterion: AC-5
    executor: judgment
    inputs: [docs/setup.md]
    question: "docs/setup.md có một đoạn nói (1) máy chủ tạm mà bài test tự mở (Bun.serve, app.listen của Nest, app trao cho supertest) phải nghe hostname 127.0.0.1, và (2) vì sao — Colima (limactl) giữ một cổng ở 127.0.0.1 trong dải cổng tạm, máy chủ nghe mọi địa chỉ vẫn được cấp đúng cổng ấy và fetch tới 127.0.0.1 nhận Malformed_HTTP_Response — không? Trả PASS chỉ khi cả hai vế có mặt, đúng nghĩa, viết theo giọng các mục khác của tệp."
    evidence_required: [run_id, verdict, judges]
    paths: [docs/setup.md]
