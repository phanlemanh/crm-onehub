- id: E1
  criterion: AC-1
  executor: script
  cmd: config:executors.script.k2d_lanh
  expected: 'exit 0; _acceptance/thuoc-mot-cho-khai-quet-man/rang/do.mjs lanh chạy lệnh của khoá k2b_mot_nguon trên cây kho và đọc dòng đếm «quet: agent <a> · khu-soan <k> · validation <v>»; với từng gốc so số đó với số tệp .ts/.tsx mà `git ls-files -- :(literal)<gốc>/` liệt (QUAN HỆ bằng nhau, và > 0); dòng «mot-nguon: KET_QUA_NOP 1 cho, agent + app dung chung» có mặt; thoát 0. In «lanh: agent <a>=<a> · khu-soan <k>=<k> · validation <v>=<v>». Chiều đỏ: `do.mjs lanh --tu-thu` dựng cây tạm (như E2) bỏ đúng một tệp .tsx của khu soạn, chạy bản thước mới trên cây đó và so với `git ls-files` của kho → exit 1, in «lanh: khu-soan khong khop (<k-1> / <k>)».'
  evidence_required:
  - run_id
  - exit_code
  - verifier
  - verified_at
  - output
  paths: &id001
  - _acceptance/soan-okr-khong-lac/rang/mot-nguon.mjs
  - _acceptance/soan-okr-khong-lac/rang/chung.mjs
  - _acceptance/thuoc-mot-cho-khai-quet-man/rang/**
- id: E2
  criterion: AC-2
  executor: script
  cmd: config:executors.script.k2d_khai_trung
  expected: 'exit 0; do.mjs khai-trung dựng cây tạm dưới .acceptance-runs/thuoc-mot-cho-khai-quet-man/ (ba cấp dưới gốc kho): chép ba gốc quét và hai tệp thước, nối node_modules thật của apps/agent-okr và packages/validation. Ma trận viết trước ba ca [agent, khu-soan, validation]: mỗi ca thêm `them.ts` khai `["da-ghi", "tu-choi"] as const` dưới gốc của ca, chạy bản thước MỚI → đòi exit 1 + «tap ket qua khai 2 cho:» chứa `<gốc>/them.ts`; số ca = 3. Đối chiếu lỗi gốc: chép mot-nguon.mjs + chung.mjs của `d089cb8d` vào cây; trên cây lành bản cũ phải thoát 0 (đối chứng dương, khác 0 thì exit 2 «KHONG DO DUOC»), trên cây ca khu-soan bản cũ thoát 0 (lỗi tái hiện) còn bản mới thoát 1. sha256 mọi tệp .ts/.tsx thật dưới ba gốc và `git status --porcelain` trước/sau giống hệt; cây tạm xoá trong finally. In «khai-trung: 3/3 lop bi bat; ban cu bo lot khu-soan, ban moi bat; tep that nguyen». Chiều đỏ: `do.mjs khai-trung --tu-thu` chạy ma trận bằng bản thước CŨ thay bản mới → ca khu-soan thoát 0 → exit
    1, in «khai-trung: khu-soan khong bi bat».'
  evidence_required:
  - run_id
  - exit_code
  - verifier
  - verified_at
  - output
  paths: *id001
- id: E3
  criterion: AC-3
  executor: script
  cmd: config:executors.script.k2d_goc_rong
  expected: 'exit 0; do.mjs goc-rong dựng cây tạm như E2, ma trận viết trước ba ca [agent, khu-soan, validation], mỗi ca làm rỗng đúng gốc đó (thư mục còn, không tệp), chạy bản thước mới → đòi exit 1, dòng «goc quet rong: <tên>» đúng tên ca, KHÔNG có dòng «mot-nguon: KET_QUA_NOP 1 cho» và KHÔNG có «Cannot find module» (gốc kiểm trước khi nạp mô-đun); số ca = 3; sha256 tệp thật và `git status --porcelain` trước/sau giống hệt. In «goc-rong: 3/3 goc rong bi bat; tep that nguyen». Chiều đỏ: `do.mjs goc-rong --tu-thu` chạy ca khu-soan bằng bản thước của `d089cb8d` (đã thoát 0 trên cây lành) → bản cũ không có bước kiểm gốc nên không in «goc quet rong: khu-soan» (đo 09/10: nó thoát 1 vì đọc moc-nop.ts trong gốc rỗng — ENOENT, không phải vì quét) → exit 1, in «goc-rong: khu-soan khong bi bat».'
  evidence_required:
  - run_id
  - exit_code
  - verifier
  - verified_at
  - output
  paths: *id001
- id: E4
  criterion: AC-4
  executor: script
  cmd: config:executors.script.k2d_mot_cho
  expected: 'exit 0; do.mjs mot-cho đọc mọi tệp .mjs dưới _acceptance/soan-okr-khong-lac/rang/ bằng đọc thư mục: chuỗi `apps/app/app/(app)/[slug]/okr/soan` xuất hiện đúng 1 lần tổng cộng và lần đó ở chung.mjs; mot-nguon.mjs không chứa chuỗi `apps/agent-okr/agent`, `packages/validation/src` hay đường khu soạn; không tệp nào khớp `\bglob\s*\(` hay nhập tên `glob` từ `node:fs`/`node:fs/promises` (mọi dạng `import { ... glob ... }`). In «mot-cho: duong khu soan 1 cho (chung.mjs), mot-nguon khong khai goc, khong glob». Chiều đỏ: `do.mjs mot-cho --tu-thu` thêm vào bản đọc trong bộ nhớ (a) tệp giả `gia.mjs` chứa đường khu soạn và `fs.glob(` và (b) dòng `"packages/validation/src/**/*.ts"` vào bản mot-nguon.mjs → exit 1, in «duong khu soan khai 2 cho», «glob o gia.mjs» và «mot-nguon khai goc validation».'
  evidence_required:
  - run_id
  - exit_code
  - verifier
  - verified_at
  - output
