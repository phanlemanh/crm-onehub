    expected: "exit 0; -t ntl-api-bat-buoc của apps/api/test/nhap-truong-luc-tao.spec.ts trên kho thử riêng, ứng dụng dựng bằng createApp (như vai-chi-okr.spec.ts) để gọi cả tRPC lẫn REST. Fixture qua đường ghi thật: mỗi loại DEAL, COMPANY, CONTACT một trường tự tạo TEXT 'ma_ho_so' required true agentFilled true. Ma trận viết sẵn 3 loại × 2 đường (caller tRPC phiên quản trị · POST /rest/<deals|companies|contacts> với x-api-key) × 2 cách thiếu (không có khoá ma_ho_so · ma_ho_so là null) = 12 ca. Mỗi ca: đếm bản ghi của loại trước; gọi create; lượt không bị từ chối BAD_REQUEST (tRPC) hay 400 (REST) thì ném 'ntl api bat buoc: lot <loai> <duong> <cach>'; số bản ghi sau khác trước thì ném 'ntl api bat buoc: con ban ghi <loai> <duong> <cach>'. Số ca đã chạy khác 12 thì ném 'ntl api bat buoc: thieu ca <n>'. Cùng fixture, mỗi loại thêm trường cu_bat_buoc TEXT required true rồi lưu trữ bằng thủ tục thật (archivedAt khác null): mỗi loại × đường, tạo với ma_ho_so 'HS-1' mà không có khoá cu_bat_buoc phải thành công; bị từ chối thì ném 'ntl api bat buoc: chan truong luu tru <loai> <duong>'. Ca Ô tích (Hỏi-4): trường DEAL CHECKBOX nda required true; deals.create không có khoá nda bị từ chối, có nda:true tạo được; lệch thì ném 'ntl api bat buoc: o tich <ca>'. Lượt bị từ chối vì thiếu trường ghi lỗi (đọc qua bộ định dạng lỗi thật) ra apps/app/test/fixtures/loi-tao-thieu-bat-buoc.json khi GHI_FIXTURE_LOI_TAO=1; không có cờ thì so lỗi vừa sinh với tệp đã commit, khác thì ném 'ntl api bat buoc: fixture loi cu'. Đối chứng cùng fixture, mỗi loại × đường: gửi ma_ho_so 'HS-1' thì tạo được; không thì ném 'ntl api bat buoc: doi chung <loai> <duong>'. Ca agentFilled: ma_ho_so có agentFilled true nên ma trận trên đã chứng Hỏi-1; test tự kiểm fixture có agentFilled true, không thì ném 'ntl api bat buoc: fixture khong kara dien'. Chiều đỏ trong lịch sử: trên onehub create không kiểm trường bắt buộc, ném 'ntl api bat buoc: lot DEAL trpc khong-khoa'."
