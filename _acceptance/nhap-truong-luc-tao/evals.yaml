  - id: E9
    criterion: AC-9
    executor: ui-check
    layer: ui-observed
    cmd: config:executors.script.ntl_man
    steps:
      - "Chạy ở thư mục gốc kho: BANG_CHUNG=_acceptance/nhap-truong-luc-tao/evidence bun scripts/lan-do/tien-de.mjs --chay \"bun _acceptance/nhap-truong-luc-tao/rang/do-man.mjs\" — phiên đo tự dựng kho riêng, API và app của cây này (luật 8)."
      - "Đọc dòng cuối: mã 0 kèm 'ntl man: dat' = đạt; mã 2 = không đo được (nêu lý do); mã 1 = lỗi bước có lời 'ntl man: …'."
      - "Mở hai mươi ảnh ntl-{tao-thoa-thuan,tao-cong-ty,tao-lien-he,them-lien-he,them-thoa-thuan}-{moi,thieu}-{1280,375}.png, đối chiếu bằng mắt với Expected."
    inputs: [_acceptance/nhap-truong-luc-tao/evidence/]
    expected: |
      Dữ liệu dựng qua API thật trong phiên đo (fields.create): mỗi loại một trường tự tạo mỗi kiểu Chữ, Ngày, Người, Liên kết, Số, đều bật «Hiện trên phiếu»; mỗi loại thêm một trường Chữ bắt buộc; một công ty mẫu để mở hai ô thêm nhanh. Mỗi form chụp hai trạng thái: mới mở (ST-formtao-sansang) và sau khi bấm Tạo với trường bắt buộc trống (ST-formtao-thieubatbuoc), ở 1280×800 và 375×812 — 20 ảnh.
      0. *-moi-1280: ô trường tự tạo xếp trong cùng cột với ô trường chuẩn, cùng nhãn trên ô, cùng chiều cao ô, cùng cỡ chữ; không tiêu đề nhóm, nhãn phụ hay đường phân cách tách chúng. do-man.mjs đọc DOM: với mỗi cặp (ô chuẩn, ô tự tạo) cùng kiểu viết sẵn, left của hộp ô khác nhau hay computed font-size khác nhau thì thoát 1 'ntl man: lech <form> <khoa chuan> <khoa tu tao>'; có phần tử tiêu đề (h1–h6, role heading) hay phân cách (hr, role separator) nằm giữa ô đầu và ô cuối của form thì thoát 1 'ntl man: nhom rieng <form>'.
      1. *-thieu-*: câu «<nhãn> không được để trống.» ngay dưới ô bắt buộc; do-man.mjs đo top của câu lỗi nhỏ hơn bottom của ô hay lớn hơn bottom + 24px thì thoát 1 'ntl man: loi xa o <form>'.
      2. *-375: mỗi ô một hàng đầy chiều rộng; do-man.mjs đo document.documentElement.scrollWidth > clientWidth thì thoát 1 'ntl man: 375 cuon ngang <form>'.
      Số ảnh khác 20 thì thoát 1 'ntl man: thieu anh <n>'. Đối chứng của thước, cùng phiên: do-man.mjs bơm một thẻ h3 giữa hai ô của form đầu tiên trong một bản sao DOM tách rời; hàm kiểm không trả 'nhom rieng' thì thoát 1 'ntl man: thuoc mu'.
      Đối chứng bằng mắt: che chữ nhãn đi thì không chỉ ra được ô nào là trường tự tạo. Ngoại trừ có tên: ô Công ty, ô Giai đoạn giữ cách vẽ riêng.
