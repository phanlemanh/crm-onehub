ure: gõ 'abc' vào ô NUMBER rồi bấm Tạo: deals.create được gọi thì ném 'ntl gui gia tri: doi chung sai kieu van gui'. Chiều đỏ trong lịch sử: trên onehub sau khi DA15 gộp, form không có ô trường tự tạo, ném khi tìm ô TEXT."
