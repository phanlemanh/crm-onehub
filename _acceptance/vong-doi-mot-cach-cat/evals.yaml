  - id: E6
    criterion: AC-4
    executor: test
    layer: logic
    cmd: config:executors.test.vdc_chi_doc
    paths:
      - "apps/app/components/crm/record-sheet/**"
      - "apps/app/test/vong-doi-mot-cach-cat.dom.tsx"
      - "apps/app/test/khung-gop-y.tsx"
    expected: |
      exit 0; 3 ngan that voi archivedAt khac null. Bo chon cho sua: button, input, textarea, select, [role=combobox],
      [role=button], [contenteditable="true"], [tabindex]:not([tabindex="-1"]). Trong noi dung tab chi tiet
      ([role=tabpanel] dang mo), moi phan tu khop bo chon NGOAI [data-dai-luu-tru] phai tat — xet bang
      el.matches(":disabled") (tinh ca fieldset cha) voi phan tu la form control, va phan tu khong phai form control thi
      khong duoc co (dem rieng, mong 0). Dem so cho bat = 0 va dem tong > 0 de chung bai do dung cho. Ma tran viet truoc
      cac o sua da biet: ContactSheet (ten, email, cong ty, chu so huu, truong tuy chinh), CompanySheet (ten, ten mien,
      chu so huu, truong tuy chinh), DealSheet (ten, gia tri, cong ty, mo ta, truong tuy chinh, menu giai doan tren dau
      ngan) — moi o bam bang userEvent: khong co input, textarea, [role=listbox], [role=dialog] moi nao mo, mutation
      update cua loai goi 0 lan; expect(o.length).toBe(15). Nut menu «…» cua ngan KHONG tat, mo ra co «Khôi phục …» va
      «Xoá vĩnh viễn …». Doi chung: cung ngan voi archivedAt null -> so cho bat > 0. expect(ngan.length).toBe(3).
      CHIEU DO ghim: ban sao bo khoa o CompanySheet -> do "vdc: ngan da cat van sua duoc"; ban sao de o mo ta DealSheet ra
      ngoai vung khoa -> do "vdc: mo ta ban da cat van sua duoc"; ban sao khoa ca menu «…» -> do "vdc: khoa ca khoi phuc".

