    expected: |
      exit 0 va "vong-doi-mot-cach-cat duong-luu-tru: dat"; script suy goc kho tu vi tri cua no, quet moi tep .tsx duoi
      apps/app (bo test) tim loi goi archive/bulkArchive mutationOptions cua contacts, companies, deals (ca dang chung
      trpc[RECORD_PROCEDURES[...]].archive). Ma tran viet truoc 4 cho: record-sheet/record-actions.tsx,
