evals:
  - id: E1
    criterion: AC-1
    executor: test
    layer: logic
    cmd: config:executors.test.vdc_hoan_tac_loat
    paths:
      - "apps/app/components/crm/bulk-actions.tsx"
      - "apps/app/app/(app)/[slug]/*/*-bulk-actions.tsx"
      - "apps/app/lib/messages/crm.ts"
      - "apps/app/test/vong-doi-mot-cach-cat.dom.tsx"
    expected: |
      exit 0; ma tran viet truoc 3 loai (ContactsBulkActions, CompaniesBulkActions, DealsBulkActions that, tRPC gia,
      Toaster that) x 2 ket qua (du: requested 3 succeeded 3 failed 0; mot phan: requested 3 succeeded 2 failed 1):
      mo menu, chon «Lưu trữ» (crmMessages("vi").bulk.archive) -> bulkArchive nhan dung {ids:[a,b,c]}; toast co chu
      bulk.archived cua loai (o mot phan: chu bulkMenu.leftAlone voi so 1) va nut «Hoàn tác» (sheet.hoanTac); bam nut
      -> bulkRestore goi dung 1 lan voi {ids:[a,b,c]}; bam lan hai -> van 1 lan; sau do co toast bulk.restored va so lan
      goi truy van danh sach cua loai (list) tren tRPC gia tang sau khoi phuc (danh sach duoc lam moi). Bam bang
      userEvent. Chi so sanh gia tri nguyen thuy. expect(o.length).toBe(6).
      CHIEU DO ghim: ban sao bo action Hoan tac (goi reportBulk nhu cu) -> do "vdc: luu tru loat khong co hoan tac";
      ban sao Hoan tac goi bulkRestore voi mang rong -> do "vdc: hoan tac sai id"; ban sao bo chot mot lan -> do
      "vdc: hoan tac goi hai lan"; ban sao bo lam moi danh sach sau khoi phuc -> do "vdc: hoan tac khong lam moi danh sach".

