  - id: E13
    criterion: AC-7
    executor: judgment
    inputs:
      - "_acceptance/vong-doi-mot-cach-cat/evidence/vdc-ngan-da-cat-1440.png"
      - "_acceptance/vong-doi-mot-cach-cat/evidence/vdc-ngan-da-cat-390.png"
      - "_acceptance/vong-doi-mot-cach-cat/evidence/vdc-kanban-1440.png"
      - "_acceptance/vong-doi-mot-cach-cat/evidence/vdc-kanban-390.png"
      - "docs/vong-doi.md"
      - "CONTEXT.md"
    question: |
      Ghi chú cho người chấm: hai ảnh đầu chụp ngăn một thoả thuận đã lưu trữ ở khổ 1440 và 390; hai ảnh sau chụp Kanban
      thoả thuận ở khổ 1440 và 390.
      Ngoài phạm vi AC-7 (chủ kho xác nhận 2026-10-09, có từ trước lượt này, mở hàng riêng): chữ bị cắt bằng «…» ở hàng
      số liệu đầu ngăn và ở thanh giai đoạn khi khổ hẹp, và nhãn giai đoạn tràn khỏi viền thẻ trên Kanban. Đừng chấm
      trượt vì hai điều này; mọi chỗ cắt hay tràn khác vẫn chấm như câu (5).
      Nhìn bốn ảnh: (1) người đọc có hiểu ngay thoả thuận này đã được cất (không bị xoá, không phải lỗi) và lấy lại bằng
      nút nào không? (2) các ô của thoả thuận đã cất có trông là không sửa được không, hay trông như sửa được mà bấm
      không ăn? (3) trên Kanban, nút «Đã lưu trữ» có dễ thấy và đọc như chỗ xem (không như một hành động cất) không?
      (4) chữ có đúng bộ chữ của `docs/vong-doi.md` — «Đã lưu trữ», «Khôi phục» — không có «Lưu trữ» trần cho nút xem,
      không có «ẩn»? (5) ở 390 có chữ hay nút nào bị cắt hoặc tràn ngang không? Nêu từng điểm kèm ảnh.

