      luu tru loat dung chung cua components/crm/bulk-actions.tsx. In bang cho -> co Hoan tac. expect 4/4.
      CHIEU DO ghim: --chieu-do them mot tep gia goi contacts.bulkArchive voi reportBulk tran -> do "duong-luu-tru: cho
      khong co hoan tac".
