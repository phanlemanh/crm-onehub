schema_version: 1
slug: neo-thuoc-het-han
evals:
  - id: E1
    criterion: AC-3
    executor: script
    cmd: config:executors.script.nth_chay_o_dinh
    paths: [_acceptance/lam-moi-chuyen-viec-qua-loi-chung/rang/khong-hoi-quy.mjs, _acceptance/neo-thuoc-het-han/rang/**]
    expected: |
      rang/chay-o-dinh.mjs chay lenh lmcv_khong_hoi_quy giai tu _acceptance/config.yaml o goc kho: ma 0,
      khong thi in "HONG <lenh> ma <n>" kem 20 dong cuoi va thoat 1. Dau ra chua cap
      100847e8a^1..100847e8a sha day du (thieu -> "HONG NEO E5"). Doc tinh khong-hoi-quy.mjs: khong con
      chuoi "origin/onehub" hay goi "merge-base" (con -> "HONG TROI <tep>"), khong con "Bun.YAML" (con ->
      "HONG BO DOC"). Tu kiem truoc: ham kiem dong neo bat mot dau ra gia mang origin/onehub ("OK tu kiem
      neo"); bo soi tinh bat chuoi gia ("OK tu kiem troi").
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-4
    executor: test
    cmd: config:executors.test.lmcv_loi_khong_lam_moi
    paths: ["apps/app/app/(app)/[slug]/settings/members/chuyen-viec-dialog.tsx", "apps/app/test/lam-moi-chuyen-viec.dom.tsx"]
    expected: |
      Ca "loi-khong-lam-moi" cua lam-moi-chuyen-viec.dom.tsx xanh tren dialog hien tai voi bo ghi
      invalidateQueries ghi moi loi goi (loi goi khong queryKey ghi thanh "(khong khoa)"), so loi goi
      = 0, thong diep ghim "khong lam moi khi loi". Doi chung duong cua ca do (link doi sang thanh
      cong) van thay du khoa can lam moi.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-5
    executor: script
    cmd: config:executors.script.nth_chieu_do
    paths: [_acceptance/lam-moi-chuyen-viec-qua-loi-chung/rang/**, apps/app/test/lam-moi-chuyen-viec.dom.tsx, "apps/app/app/(app)/[slug]/settings/members/chuyen-viec-dialog.tsx", _acceptance/neo-thuoc-het-han/rang/**]
    expected: |
      rang/chieu-do.mjs, bang dot bien khai truoc trong script (moi dong: ten, tep, phep thay, lenh,
      thong diep ghim): (1) bun-yaml: khong-hoi-quy.mjs doc bang Bun.YAML -> E5 ma khac 0 voi "khong doc
      duoc"; (2) lam-moi-khong-khoa: chuyen-viec-dialog.tsx chen invalidateQueries() khong doi so vao
      nhanh loi -> test lmcv_loi_khong_lam_moi ma khac 0 voi "khong lam moi khi loi"; (3) ref-thieu:
      khong-hoi-quy.mjs doi sha cap gop thanh 0000000000000000000000000000000000000001 -> ma dung 2,
      stdout co "KHONG DO DUOC", stderr khong co dong bat dau bang "    at ". Moi dot bien chay trong cay
      tam duoi .acceptance-runs/neo-thuoc-het-han/ (git worktree --detach HEAD), khong cham cay goc. Dot
      bien khong bi bat dung thong diep -> "HONG LOT <ten>" ma 1; bang thieu truong -> "HONG THIEU <ten>"
      ma 1; phep thay khong khop -> "HONG KHONG AP <ten>" ma 1. In "chieu-do: 3/3 bi bat".
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-6
    executor: script
    cmd: config:executors.script.nth_pham_vi
    paths: [_acceptance/neo-thuoc-het-han/rang/**]
    expected: |
      rang/pham-vi.mjs: commit cua vong = git log --no-merges -F --grep="(neo-thuoc-het-han)" tren lich su
      HEAD. Moi phep so lay TUNG commit cua vong voi cha cua no (git diff C^ C). Hop tep so voi danh sach
      dong trong script (tep P7-24, _acceptance/neo-thuoc-het-han/**, docs/superpowers/**/*neo-thuoc-het-han*,
      _acceptance/config.yaml, PRODUCT-MAP.md, LO-TRINH.html): tep ngoai -> "NGOAI DANH SACH <tep>" ma 1.
      evals.yaml cua lam-moi-chuyen-viec-qua-loi-chung so TOAN KHOI van ban tung eval tru truong expected o
      C^ va C: eval doi ngoai {E5,E3} hoac doi ngoai expected -> "DOI NGOAI <ho so>:<eval>:<truong>" ma 1;
      them/xoa eval -> ma 1. config.yaml: dong bi xoa cua mot khoa co san o moc nen aba7f6418 ->
      "CONFIG DOI GIA TRI <khoa>" ma 1 (khoa vong tu them roi go khong tinh). Commit cham
      _acceptance/cap-nhat-tuan-okr/ -> ma 1. Tep duoi _acceptance/so-okr-tu-chay/ o HEAD khac ban o moc nen
      -> "HOAN LAI CON DOI <tep>" ma 1 («F8: b1»). Tu kiem: tep gia ngoai danh sach bi bat; them expected_exit
      bi bat. Doi chung bat bien: cay tam = HEAD + mot commit khong mang slug sua tep cap-nhat-tuan-okr va doi
      gia tri mot khoa config -> dau ra giong het (khac -> "HONG LECH pham-vi").
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-7
    executor: script
    cmd: config:executors.script.nth_ghim_xanh
    paths: [_acceptance/lam-moi-chuyen-viec-qua-loi-chung/**, _acceptance/neo-thuoc-het-han/rang/**]
    expected: |
      rang/ghim-xanh.mjs, voi ho so lam-moi-chuyen-viec-qua-loi-chung (so-okr-tu-chay sang F28, «F8: b», «F8: b1»): dong cuoi
      kind repin|repin-do cua run-log.jsonl phai la repin (repin-do -> "GHIM DO <ho so>" ma 1); suites_exit
      toan 0 va moi evals_exit dat ky vong (0 hoac expected_exit da khai); sha == verified_commit cua
      evidence-report.md (lech -> "GHIM LECH"); commit cuoi sua tep ngoai run-log/evidence-report cua ho so
      la to tien cua sha (khong -> "GHIM CU <ho so>"); recheck-evidence.cjs cua kit ma 0. Truoc khi co
      luot ghim cua vong (khong dong repin nao co reason chua "neo-thuoc-het-han") -> "CHUA GHIM" ma 1.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
