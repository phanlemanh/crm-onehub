  - id: E14
    criterion: AC-9
    executor: judgment
    question: >-
      Đọc CONTEXT.md (mục bước 30 ngày, mục Việc, và mục mới «Gợi ý mở kế hoạch»), docs/api.md (mục router
      onboarding) và docs/plan/lo-trinh-viec-du-an.json (hàng DA3 và DA4) như một người mới vào kho. Tài liệu có
      nói rõ năm điều không: (1) bước của kế hoạch tạo sau lượt DA3 là bản chiếu của đúng một Việc — Việc là nguồn
      sự thật cho người làm, hạn, tên, xong; kế hoạch tạo trước vẫn có bước không Việc; (2) ba thao tác bị chặn
      trên Việc của một bước (Huỷ, xoá, gỡ gắn kế hoạch) và đường đúng là gỡ bước ở kế hoạch; (3) tạo kế hoạch từ khuôn chọn người làm cho từng phòng ban, mặc định trưởng phòng, không có thì người cầm trịch, người vai «chỉ OKR» bị từ chối; (4) trường chọn người theo phòng ban của createFromTemplate và việc đóng kế hoạch hỏi huỷ việc còn mở; (5) hàng DA3 không còn «chưa mở», có hàng DA3b cho gợi ý mở kế hoạch khi deal thắng, và chay_khi của DA4 ghi điều kiện ngày bắt đầu đã thoả
      do chủ kho mở 14/10. Tài liệu không dùng chữ «dự án» cho kế hoạch 30 ngày. Trả PASS khi đủ năm điều, FAIL nêu
      điều thiếu.
    inputs: [CONTEXT.md, docs/api.md, docs/plan/lo-trinh-viec-du-an.json]
    evidence_required: [verdict, rationale, verified_at]

