      - "Buoc 2: chon tep mau docx, dien ten, loai, chu trang, bam 'Tải lên' -> tab 'Nguồn' co hang ten tep voi trang thai 'Máy đang soạn'"
      - "Buoc 3 (390): hop tai va tab Nguon -> anh msd-tai-390.png, msd-nguon-390.png, khong cuon ngang trang"
    paths:
      - "apps/app/app/(app)/[slug]/tai-lieu/**"
      - "packages/ui/src/components/nguon-keo-tha.tsx"
      - "packages/ui/src/hooks/use-file-upload.ts"
    expected: "exit 0; man-tai-nguon.mjs (phep do cua may-soan-de-xuat, chay nguyen van) in 'buoc N: dat' cho 3 buoc; anh o .acceptance-runs/may-soan-de-xuat/evidence/; vong S4 chep anh msd-tai-1440.png va msd-tai-390.png sang _acceptance/nguon-keo-tha-reui/evidence/ de nguoi ky nhin vung moi. CHIEU DO (cua chinh phep do): --chieu-do tren ban sao an tab Nguon -> 'buoc 2: khong thay hang nguon', ma 1."
    evidence_required: [run_id, exit_code, verifier, verified_at, output, screenshots]

  - id: E12
    criterion: AC-12
    executor: script
    cmd: config:executors.script.msd_san_thiet_ke
    paths:
