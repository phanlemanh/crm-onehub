schema_version: 1
feature_slug: toan-canh-okr
evals:
  - id: E1
    criterion: AC-1
    executor: test
    layer: backend-effect
    cmd: config:executors.test.tco_danh_sach
    paths: [apps/api/src/okr/**, apps/api/test/okr-toan-canh.spec.ts, apps/api/test/okr-san.ts]
    expected: "exit 0; sàn okr-san gieo bộ phận B (P1, P2) và bộ phận C (P3), kỳ quý dang-chay; mục tiêu: B1 (bo-phan, cam-ket, cong-bo, chủ b), P1a (tham-vong, cong-bo, chủ p1, KR chủ k), P1b (cam-ket, nhap, chủ p1), P2a (cam-ket, da-bo, chủ p2), P3a (cam-ket, cong-bo, chủ p3, KR chủ k). BẢNG VIẾT TRƯỚC 7 lời gọi × tập id so bằng tập: {bp:B} → {B1,P1a,P1b,P2a} và P3a KHÔNG có mặt (ca biên: phòng ban của bộ phận khác không lọt vào); {bp:B, phuTrach:[k]} → {P1a} với krKhop = [KR của k]; {bp:B, loai:[tham-vong]} → {P1a}; {bp:B, trangThai:[cong-bo]} → {B1,P1a}; {pb:P3} → {P3a}; {nguoi:k} → {P1a,P3a}; {bp:B, phuTrach:[k], loai:[cam-ket]} → {} và total 0. facetCounts của lời gọi {bp:B}: MA TRẬN viết trước {loai: {cam-ket:3, tham-vong:1}, trangThai: {cong-bo:2, nhap:1, da-bo:1}, phuTrach: {b:1, p1:2, p2:1, k:1}} so toEqual; và của lời gọi {bp:B, phuTrach:[k]} (luật trừ mặt của chính nó): MA TRẬN viết trước {phuTrach: {b:1, p1:2, p2:1, k:1}, loai: {tham-vong:1}, trangThai: {cong-bo:1}} so toEqual. Nhịp 2 thêm ca: lần cập nhật mới nhất của KR k ở P1a mức thap, lần trước cao → {bp:B, tuTin:[thap]} → {P1a}, {bp:B, tuTin:[cao]} → {}. CHIỀU ĐỎ: bản sao service bỏ mở rộng bộ phận sang phòng ban con → lời gọi 1 trả {B1}, bài đỏ in tập thiếu {P1a,P1b,P2a} kèm tên ca «bp gồm con»; bản sao đếm facet trên tập lọc đủ mọi mặt → phuTrach của lời gọi đã lọc ra {p1:1, k:1}, bài in «facet phuTrach phải trừ mặt của chính nó» và hai đối tượng."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: ui-check
    layer: ui-observed
    cmd: config:executors.script.tco_man_chrome
    steps:
      - "Cảnh cây (canh-cay.mjs) trước màn đầu tiên; lệch cây → mã 2"
      - "Gieo qua API thật dữ liệu của E1 với tiền tố riêng; đăng nhập dev:session trưởng bộ phận B (vai member) và một người vai okr; dọn theo id ở cuối, kể cả khi đỏ"
      - "Mở {APP_URL}/<slug>/okr/theo-don-vi?donOkr=bp:<B> ở 1440/vi → ảnh buoc-loc-1: bốn mục tiêu (đếm data-muc-tieu = 4)"
      - "Mở menu lọc, chọn người phụ trách k → URL có phuTrachOkr=<k>, còn 1 mục tiêu → ảnh buoc-loc-2; tải lại trang → vẫn 1 mục tiêu"
      - "Thêm loại Cam kết → «Không mục tiêu nào khớp bộ lọc» + nút «Bỏ lọc» → ảnh buoc-loc-3; bấm «Bỏ lọc» → 4 mục tiêu, URL không còn tham số lọc"
      - "Mở ?donOkr=nguoi:<k> → đầu trang có tên k, phòng ban chính, quản lý trực tiếp; danh sách đúng 2 mục tiêu → ảnh buoc-nguoi-1; ở 390 → ảnh buoc-nguoi-2"
      - "Mọi ảnh: scrollWidth <= innerWidth; không lỗi console; request thất bại ghi vào E2-network.txt"
    paths: ["apps/app/app/(app)/[slug]/okr/**", apps/app/lib/messages/okr-toan-canh.ts, apps/app/lib/search-param-keys.ts, _acceptance/toan-canh-okr/rang/man-toan-canh.mjs]
    expected: "exit 0 và ảnh ở .acceptance-runs/toan-canh-okr/evidence/; script khẳng định bằng DOM (đếm data-muc-tieu, đọc URL, đọc textContent câu rỗng) chứ không chỉ chụp. CHIỀU ĐỎ: bản sao màn bỏ ghi tham số lọc vào URL → khẳng định «tải lại vẫn 1 mục tiêu» đỏ, script in bước và số đếm 4."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-2
    executor: script
    layer: backend-effect
    cmd: config:executors.script.tco_man_chrome
    paths: [apps/api/src/okr/**, _acceptance/toan-canh-okr/rang/man-toan-canh.mjs]
    expected: "Cùng lần chạy với E2: ghi mọi request tRPC của trang; sau mỗi đổi lọc có đúng một lời gọi okr.danhSach mang loc khớp lựa chọn (đọc input từ URL request), và tập data-muc-tieu trên màn bằng tập id API trả — màn không lọc thêm trong trình duyệt. CHIỀU ĐỎ: bản sao màn gọi danhSach không kèm loc rồi lọc ở client → khẳng định «input.loc.phuTrach chứa k» đỏ, script in input thật."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-3
    executor: test
    cmd: config:executors.test.tco_ui_cay
    paths: [packages/ui/src/components/reui/tree.tsx, packages/ui/src/components/tree-nav.tsx, packages/ui/test/tree-nav.dom.tsx]
    expected: "exit 0; dựng TreeNav với cây 3 cấp viết trước (gốc → 2 nhánh → mỗi nhánh 2 lá), đang gập hết trừ gốc. Kịch bản phím viết trước 10 bước, mỗi bước khẳng định document.activeElement là đúng nút (theo data-id) và aria-expanded đúng: Tab vào cây → gốc; ↓ → nhánh 1; → mở nhánh 1 (aria-expanded true); → vào lá 1.1; ← về nhánh 1; ← gập nhánh 1; End → nhánh cuối nhìn thấy; Home → gốc; Enter → onSelect gọi đúng id gốc một lần. Khẳng định: role tree/treeitem, aria-level 1/2/3, đúng một phần tử tabindex=0 trong cây ở mọi bước. CHIỀU ĐỎ: bản sao TreeNav bỏ hotkeysCoreFeature → bước ↓ đỏ, bài in activeElement và tên bước «mũi tên xuống»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-3
    executor: ui-check
    layer: ui-observed
    cmd: config:executors.script.tco_man_chrome
    steps:
      - "Cùng lần chạy với E2; gieo thêm OneHub có KR K1, B1 góp vào K1 và vào mục tiêu OneHub (hai chỗ)"
      - "Mở theo-don-vi?xemOkr=cay ở 1440/vi → ảnh buoc-cay-1: phần tử role=tree, có treeitem aria-level 1"
      - "Chỉ dùng bàn phím (page.keyboard): Tab tới cây, ↓ ×2, → , ↓ → tiêu điểm đi đúng thứ tự viết trước (đọc textContent document.activeElement mỗi bước) → ảnh buoc-cay-2 có vòng tiêu điểm"
      - "B1 xuất hiện hai lần; lần hai có chữ «cũng hiện ở chỗ góp kia» → ảnh buoc-cay-3; Enter trên B1 mở sheet (URL record=objective:<B1>)"
      - "Cây đơn vị cột trái: Tab vào, ↓, Enter → URL donOkr đổi sang đơn vị được chọn"
    paths: ["apps/app/app/(app)/[slug]/okr/**", packages/ui/src/components/tree-nav.tsx, _acceptance/toan-canh-okr/rang/man-toan-canh.mjs]
    expected: "exit 0; khẳng định DOM ở mọi bước; đếm phần tử có tabindex=0 trong role=tree bằng 1. CHIỀU ĐỎ: bản sao cay-can-chinh dùng lại SimpleTable → không có role=tree, script in «không thấy cây» mã 1."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-4
    executor: test
    cmd: config:executors.test.tco_ui_thanh_phan
    paths: [packages/ui/src/components/progress.tsx, packages/ui/src/components/okr-status.tsx, packages/ui/src/lib/messages.ts, packages/ui/test/okr-thanh-phan.dom.tsx]
    expected: "exit 0; MA TRẬN Progress neutral viết trước 4 ca [value, expected] = [30, 47], [60, 47], [100, null], [0, 0]: vạch data-expected có style left đúng phần trăm (3 ca) và vắng ở ca null; thanh không có lớp bg-primary; aria-label bằng chuỗi ghim «Tiến độ: 30%, lẽ ra đã tới 47%» (vi) và bản en khác. Progress không variant vẫn bg-primary (không đổi hành vi cũ). ConfidenceIndicator 3 mức × 2 ngôn ngữ = 6 nhãn ghim; PaceIndicator 6 giá trị × 2 = 12 nhãn ghim; mỗi mức mang data-tone đúng bảng (cao success, vua warning, thap error, truot error, cham-nhip warning, dung-nhip success, chua-co-ky-vong neutral, moc-xong success, moc-chua neutral). CHIỀU ĐỎ: bản sao Progress neutral giữ bg-primary → khẳng định lớp đỏ, bài in className."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-4
    executor: script
    cmd: config:executors.script.tco_soi_ma
    paths: ["apps/app/app/(app)/[slug]/okr/**", apps/app/components/crm/record-sheet/**, packages/ui/src/components/**, _acceptance/toan-canh-okr/rang/soi-ma.mjs]
    expected: "exit 0; soi AST (typescript) mọi .tsx dưới apps/app/app/(app)/[slug]/okr/, objective-sheet.tsx, objective-dien-bien.tsx và khối Tổng quan: mọi phần tử <Progress> mang variant=\"neutral\" — danh sách tệp và số phần tử in ra; không phần tử StatusIndicator nào tự map mức tự tin hay tình trạng (tìm literal \"Đúng nhịp\"/\"Tự tin\" ngoài messages). CHIỀU ĐỎ: --chieu-do chép một tệp vào tmpdir, xoá variant ở một <Progress> → script đỏ in «Progress thiếu variant neutral: <tệp>:<dòng>»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E8
    criterion: AC-5
    executor: test
    layer: backend-effect
    cmd: config:executors.test.tco_toan_canh
    paths: [apps/api/src/okr/**, apps/api/test/okr-toan-canh.spec.ts, apps/api/test/okr-toan-canh-thuan.spec.ts]
    expected: "exit 0; hai bài. (a) hàm thuần gopToanCanh: đầu vào cây (OneHub, B có P1 P2, C có P3, chưa xếp P4) + mục tiêu có progress/expected viết tay + một nháp và một đã bỏ; đầu ra hàng viết trước so toEqual: thứ tự [goc, bp:B, pb:P1, pb:P2, bp:C, pb:P3, pb:P4], hàng B gộp B + P1 + P2 (tiến độ trung bình 3 mục tiêu), P2 không mục tiêu → tienDo null, soMucTieu 0; nháp và đã bỏ không vào. (b) API: gieo như (a), gọi okr.toanCanh bằng phiên quan, thuong, okr → cả ba 200 và cùng kết quả; MA TRẬN 7 hàng × [key, cap, tienDo, kyVong, soMucTieu, soKr] = 42 khẳng định viết trước; tongQuan.donViCongBo/tongDonVi và donViChuaDat (tập tên) đúng. CHIỀU ĐỎ: bản sao gopToanCanh không gộp phòng ban con vào bộ phận → hàng B đỏ, bài in hàng B thật."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E9
    criterion: AC-5
    executor: test
    layer: backend-effect
    cmd: config:executors.test.tco_hieu_nang
    paths: [apps/api/src/okr/**, apps/api/test/okr-toan-canh.spec.ts]
    expected: "exit 0; gieo bằng createMany 50 phòng ban trong 10 bộ phận, 400 mục tiêu đã công bố, 2.000 KR (và nhịp 2: 8.000 lần cập nhật qua createMany của bảng lượt 4); đo thời gian máy chủ của okr.toanCanh, okr.danhSach({bp, loc: {phuTrach, loai, trangThai}}), okr.sucKhoe và (nhịp 2) okr.hopTuan: mỗi lời gọi < 1.000 ms trên máy dev (ngưỡng giả định 3 của opportunity); đếm câu truy vấn bằng PRISMA_LOG_QUERIES bắt qua logger trong lời gọi với 5 đơn vị và với 50 đơn vị — hai số bằng nhau (số câu không tăng theo số đơn vị). Dọn theo tiền tố. CHIỀU ĐỎ: bản sao service đọc KR từng mục tiêu trong vòng lặp → số câu ở 50 đơn vị lớn hơn ở 5, bài in hai số."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E10
    criterion: AC-5
    executor: ui-check
    layer: ui-observed
    cmd: config:executors.script.tco_man_chrome
    steps:
