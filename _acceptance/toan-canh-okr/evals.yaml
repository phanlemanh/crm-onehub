    paths: [apps/api/src/okr/**, apps/api/test/okr-toan-canh.spec.ts, apps/api/test/okr-toan-canh-thuan.spec.ts]
    expected: "exit 0; (nhịp 2) (a) hàm thuần xepHopTuan với 6 KR viết tay: Ka vua→thap tuần này, Kb cao→thap (tụt hai bậc), Kc cao→vua + ghi chú mới, Kd im 15 ngày, Ke ghi chú mới 3 ngày trước, Kf không gì mới; thứ tự dangBan viết trước [Kb, Ka, Kc, Kd, Ke] và conLai [Kf], lý do mỗi dòng so toEqual. (b) API: gieo đúng 6 KR đó qua guiCapNhat của lượt 4 với ngày đóng băng (tham số homNay), trưởng phòng ban gọi okr.hopTuan → cùng thứ tự; đầu ra không có khoá nào liệt kê người chưa cập nhật (duyệt khoá đệ quy, không có 'chuaCapNhat'/'nguoi' ở mức danh sách). CHIỀU ĐỎ: bản sao xếp im trước tự tin tụt → Kd lên đầu, bài in thứ tự thật."
