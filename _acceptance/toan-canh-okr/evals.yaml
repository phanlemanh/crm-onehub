    cmd: config:executors.test.tco_toan_canh_tu_tin
    paths: [apps/api/src/okr/**, apps/api/test/okr-toan-canh.spec.ts, apps/api/test/okr-toan-canh-thuan.spec.ts]
    expected: "exit 0; (nhịp 2) gieo lần cập nhật qua thủ tục guiCapNhat thật của lượt 4 (không ghi thẳng bảng) cho 6 KR trong 4 tuần; okr.toanCanh: MA TRẬN hàng × [tuTin.cao, tuTin.vua, tuTin.thap, daCapNhat, dangBan.loai] và dãy theoTuan (10 tuần, số hoặc null) viết trước so toEqual — gồm tuần không ai cập nhật → null, tuần có 2 KR cập nhật 1 cao → 50. CHIỀU ĐỎ: bản sao tính heatmap trên tổng KR thay vì KR có cập nhật tuần đó → ô tuần 3 lệch, bài in dãy thật."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E12
    criterion: AC-6
    executor: test
    cmd: config:executors.test.tco_ui_heatmap
    paths: [packages/ui/src/components/heatmap.tsx, packages/ui/test/heatmap.dom.tsx]
    expected: "exit 0; (nhịp 1 dựng thành phần, nhịp 2 gắn màn) dựng Heatmap 3 hàng × 5 cột với giá trị viết trước [0, 20, 40, 60, 90, null…]: mỗi ô mang data-bac đúng bảng năm bậc (≤0→0, ≤25→1, ≤50→2, ≤75→3, >75→4) và lớp nền/chữ đúng bảng «Thang heatmap» của design doc (foreground/5, /15, /30 chữ foreground; /65, /85 chữ background); ô null có lớp border-dashed và chữ sr-only «chưa có»; caption có mặt; cột hiện tại có data-current và scrollLeft của khung > 0 khi khung hẹp hơn nội dung. Tương phản: đọc --ds-background-200 và --ds-gray-1000 của :root và .dark từ packages/ui/src/styles/geist.css (không chép số tay), pha theo độ trong từng bậc, tính tỷ lệ WCAG — MA TRẬN 5 bậc × 2 nền = 10 số, mỗi số so với bảng viết trước (±0,1) và ≥ 4.5. CHIỀU ĐỎ: bản sao để bậc 4 giữ chữ foreground → nền sáng ra ≈ 1,6 < 4.5, bài in bậc 4, nền sáng và số."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

