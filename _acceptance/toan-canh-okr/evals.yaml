      - "Chặn okr.toanCanh trả 500 → Empty «Thử lại» → ảnh buoc-toan-canh-4; bấm Thử lại sau khi bỏ chặn → bảng hiện"
      - "Kỳ chưa có mục tiêu công bố → trạng thái tuần đầu có câu hẹn → ảnh buoc-toan-canh-5"
    paths: ["apps/app/app/(app)/[slug]/okr/toan-canh/**", apps/app/lib/messages/okr-toan-canh.ts, _acceptance/toan-canh-okr/rang/man-toan-canh.mjs]
    expected: "exit 0; ảnh đủ năm bước; khẳng định DOM ở mỗi bước. CHIỀU ĐỎ: bản sao màn để nút sức khoẻ hiện với mọi vai → khẳng định bước 2 (vai okr không thấy nút) đỏ."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

