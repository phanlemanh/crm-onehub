      - "_acceptance/kara-trang-thai-toan-crm/evidence/kts-toast-luu-tru-1440.png"
      - "_acceptance/kara-trang-thai-toan-crm/evidence/kts-sau-hoan-tac-1440.png"
      - "_acceptance/kara-trang-thai-toan-crm/evidence/kts-web-loi-390.png"
      - "_acceptance/kara-trang-thai-toan-crm/evidence/kts-toast-luu-tru-390.png"

  - id: E14
    criterion: AC-11
    executor: judgment
    layer: ui-observed
    inputs:
      - "_acceptance/kara-trang-thai-toan-crm/evidence/kts-web-loi-1440.png"
      - "_acceptance/kara-trang-thai-toan-crm/evidence/kts-toast-luu-tru-1440.png"
      - "_acceptance/kara-trang-thai-toan-crm/evidence/kts-sau-hoan-tac-1440.png"
      - "_acceptance/kara-trang-thai-toan-crm/evidence/kts-web-loi-390.png"
      - "_acceptance/kara-trang-thai-toan-crm/evidence/kts-toast-luu-tru-390.png"
      - "docs/ai-ux.md"
      - "docs/vong-doi.md"
    question: |
      Nhìn năm ảnh (1440 và 390) và đối chiếu docs/ai-ux.md mục 7 và docs/vong-doi.md mục «Ba cách dọn»: (1) mục
      «Hoạt động trên website» khi không tải được có nói rõ là không tải được và có «Thử lại» không, hay trông như
      một chỗ trống / chưa có gì? (2) toast lưu trữ có «Hoàn tác» và đúng tên bản ghi không? (3) ảnh sau hoàn tác có
      cho thấy bản ghi về trạng thái đang dùng không? (4) ở 390 có chữ hay nút nào bị cắt hoặc tràn ngang không? Nêu
      từng điểm kèm ảnh.
