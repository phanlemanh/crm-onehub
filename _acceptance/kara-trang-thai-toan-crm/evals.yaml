    layer: logic
    cmd: config:executors.script.kts_chu
    paths:
      - "apps/app/components/crm/website-activity.tsx"
      - "apps/app/components/crm/record-sheet/contact-plans.tsx"
      - "apps/app/components/crm/timeline/timeline.tsx"
      - "_acceptance/kara-trang-thai-toan-crm/rang/chu.mjs"
    expected: |
      exit 0; cung luot chu.mjs. Phan vung con: ma tran viet truoc theo tung tep (timeline.tsx, website-activity.tsx,
      contact-plans.tsx), moi dong la mot `return null` mong doi kem nhan: website-activity "chua-nhan-dien" (dieu kien
