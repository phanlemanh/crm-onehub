evals:
  - id: E1
    criterion: AC-1
    executor: test
    layer: logic
    cmd: config:executors.test.kts_dong_thoi_gian
    paths:
      - "apps/app/components/crm/timeline/**"
      - "packages/ui/src/components/vung-tai-loi.tsx"
      - "apps/app/test/kara-trang-thai-vung.dom.tsx"
    expected: |
      exit 0; Timeline that, tRPC gia (khung-gop-y.tsx). Ma tran viet truoc 2 o: (a) activities.timeline nem loi
      "boom-timeline" -> [data-vung-tai-loi] co chu "Không tải được hoạt động", co nut "Thử lại", textContent khong
      chua "boom-timeline" va khong chua chu rong cua tab (lay tu crmMessages("vi") — vd "Chưa có hoạt động");
      bam "Thử lại" -> goiCua("activities.timeline") tang dung 1; (b) timeline tra trang rong -> chu rong cu hien,
      khong [data-vung-tai-loi]; (c) nhu (a) voi LocaleProvider "en" -> chu cua crmMessages("en")/ui "en", khong ky tu
      tieng Viet co dau trong [data-vung-tai-loi]. expect(o.length).toBe(3).
      CHIEU DO ghim: ban sao timeline.tsx bo nhanh isError -> do "dong-thoi-gian: loi hien nhu rong".

