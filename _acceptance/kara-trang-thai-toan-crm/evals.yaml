      ton tai sau luot. CHIEU DO ghim: --chieu-do bo bam Hoan tac -> do "luu-tru: sau hoan tac van con ngay luu tru".
    steps:
      - "Chay nguyen van dong lenh khai trong cmd (tien-de.mjs --chay), KHONG goi thang man.mjs"
      - "Buoc 1 (1440): ngan ca nhan co hoat dong web; chan request tracking.contactActivity bang chan request cua puppeteer -> kts-web-loi-1440.png; innerText co 'Không tải được hoạt động trên website' va 'Thử lại'"
      - "Buoc 2 (1440): luu tru ca nhan qua menu -> kts-toast-luu-tru-1440.png co 'Đã lưu trữ <tên>.' va 'Hoàn tác'; bam -> kts-sau-hoan-tac-1440.png"
      - "Buoc 3 (390): lap buoc 1, 2 o kho 390 -> kts-web-loi-390.png, kts-toast-luu-tru-390.png; scrollWidth <= clientWidth cua trang va ngan; nut Hoan tac nam trong khung nhin"
