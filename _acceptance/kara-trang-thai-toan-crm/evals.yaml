  - id: E8
    criterion: AC-7
    executor: test
    layer: ui-flow
    cmd: config:executors.test.kts_buoc_chua_luu
    paths:
      - "apps/app/components/crm/agent-panel.tsx"
      - "packages/ui/src/components/kara/steps.tsx"
      - "packages/ui/src/lib/messages.ts"
      - "apps/app/test/kara-trang-thai-vung.dom.tsx"
    expected: |
      exit 0; AgentPanel that voi useEveAgent gia. Ma tran 4 buoc viet truoc trong mot luot Kara: record_fact
      {stored:false, reason:"Evidence rejected."}, write_brief {written:false, reason:"Nothing new."}, record_fact
      {stored:true}, mot cong cu output-error -> data-trang-thai lan luot "chua-luu","chua-luu","xong","loi";
      chu doc man cua hai buoc dau "chưa lưu được"; textContent khong chua "Evidence rejected." va khong chua
      "Nothing new." (giao dien vi); cham [data-slot=indicator-dot] cua hai buoc chua-luu co data-tone="warning", buoc
      xong co data-tone="success" (doi chung duong cung luot). O rieng khong co buoc loi: tieu de khoi buoc la
      "Kara chưa lưu được: <nhãn bước>". O tieng Anh: textContent chua "Evidence rejected." (tab en giu ly do).
      expect(o.length).toBe(7). CHIEU DO ghim: ban sao agent-panel bo nhanh tone warning -> do
      "buoc-chua-luu: buoc khong luu hien xong".

