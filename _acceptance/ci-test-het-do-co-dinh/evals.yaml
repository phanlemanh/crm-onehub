evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.ctd_phat_lai_ui
    paths: [packages/ui/test/**, _acceptance/ci-test-het-do-co-dinh/rang/phat-lai-thu-tu.mjs, _acceptance/ci-test-het-do-co-dinh/rang/thu-tu-ui-41191965481.txt]
    expected: "exit 0; in «DAT tat ca». Chạy 21 tệp spec của @crm/ui đúng thứ tự trong rang/thu-tu-ui-41191965481.txt (lấy từ log lượt CI đỏ 41191965481), lai-ra-man.spec.tsx đứng trước pre-push-da-chung.spec.ts; gỡ CLAUDECODE khỏi env để bun in tên tệp và dòng (pass). Ba ca DAT (đầu ra phải có tên tệp, nên răng gỡ CLAUDECODE): «app-ui: chay dung thu tu tep cua luot 41191965481» (dãy tên tệp trong đầu ra bằng đúng danh sách), «app-ui: lai-ra-man chay truoc pre-push-da-chung», «app-ui: 0 fail, dau-hook (e) xanh» (đầu ra có «(pass) dau-hook > dau-hook (e): chuoi ngay 13 roi 15»). CHIỀU ĐỎ: cùng thứ tự trên nền 6ca59691a, bản cũ cho «(fail) dau-hook > dau-hook (e)», «- Expected  - 1», «+ Received  + 5» (chieu-do-tren-nen.md)."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.ctd_dong_ho_tran
    paths: [packages/ui/test/pre-push-da-chung.spec.ts, packages/ui/test/mau/**, scripts/pre-push-t1.mjs, scripts/pre-push-da-chung.mjs, _acceptance/ci-test-het-do-co-dinh/rang/dong-ho-va-tran.mjs]
    expected: "exit 0; in «DAT tat ca». Chạy trên bản sao tạm của pre-push-da-chung.spec.ts (thư mục tạm, DA_CHUNG_NGUON trỏ gốc kho), không ghi vào cây. DAT «ban-lanh-co-dung-mot-cho-tinh-ngay-dau» (đúng một chỗ «bayGio() - ngay * NGAY_MS»). ĐỐI CHỨNG DƯƠNG: DAT «doi-chung-duong: (e) (i) (k) xanh tren ban lanh» (3 pass, 0 fail). CHIỀU ĐỎ: DAT «pha-dong-ho: tinh ngay bang Date.now toan cuc thi (k) do dung thong diep» — thay chỗ đó bằng «Date.now() - ngay * NGAY_MS» thì đầu ra có «(fail) dau-hook > dau-hook (k)» và «dau 13 ngay theo gio that cua hook phai con dung». Ca (k) tự ghim Date ở 2026-09-08T12:00:00+07:00 và khẳng định globalThis.Date trở lại đúng đối tượng cũ."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: script
    cmd: config:executors.script.ctd_dong_ho_tran
    paths: [packages/ui/test/pre-push-da-chung.spec.ts, _acceptance/ci-test-het-do-co-dinh/rang/dong-ho-va-tran.mjs]
    expected: "exit 0; in «DAT tat ca». DAT «moi-ca-co-tran: moi test cua describe dau-hook mang TRAN_DAU_HOOK_MS» (đếm test( bằng đếm TRAN_DAU_HOOK_MS trong khối, ≥ 10). DAT «khang-dinh-cu-giu-nguyen: moi expect cua ca dau-hook o nen con nguyen, chi them expect cua (k)» — so khối describe dau-hook với git show 6ca59691a (≥ 30 expect ở nền, bỏ khoảng trắng, dấu phẩy cuối và đối số thông điệp của expect): không thiếu câu nào, câu thừa chỉ thuộc tập cho phép của (k). CHIỀU ĐỎ của phép so: DAT «khang-dinh-pha: xoa mot expect cu thi phep so bao thieu dung expect do». CHIỀU ĐỎ của trần: DAT «ep-tran: DAU_HOOK_TRAN_MS=100 thi (i) do vi het gio» và DAT «ep-tran-moi-ca: DAU_HOOK_TRAN_MS=100 thi tung ca dau-hook het gio, ke ca (j)» (từng ca chạy riêng, mỗi lần gọi bun giới hạn 180s) — đầu ra có «timed out after 100ms» và «(fail) dau-hook > dau-hook (i)». ĐỐI CHỨNG: DAT «tra-tran: tran mac dinh thi (i) xanh lai» (1 pass). Trần mặc định 30 000ms; số đo (i)/(j): máy bận 3361/1871ms, CI 27/10 1610/707ms, Docker rảnh 943/392ms — trần gấp khoảng 9 lần lần chậm nhất đo được, nên một lần treo thật (hook chờ mãi) vẫn đỏ."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
