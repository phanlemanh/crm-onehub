    expected: "exit 0; in «DAT tat ca». Mỗi cảnh chạy qua packages/db/scripts/test-run.ts (kho dùng-một-lần, tự xoá). ĐỐI CHỨNG DƯƠNG: DAT «dev-lanh: dev-grant-needed xanh va khong de lai nguoi dung» (0 fail, đếm người dùng <TEST_RUN_ID>-grant-needed@localhost = 0). CHIỀU ĐỎ: DAT «dev-pha: bo afterAll thi con dung mot nguoi dung grant-needed» (bản sao thay afterAll bằng test.skip, đếm = 1)."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

