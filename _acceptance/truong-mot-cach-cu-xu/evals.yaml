    cmd: config:executors.script.tmc_quet
    expected: "exit 0; bun _acceptance/truong-mot-cach-cu-xu/rang/quet-vo-tay.mjs. Danh sách tệp viết sẵn trong rang (mười tệp): ba phiếu record-sheet/{deal,company,contact}-sheet.tsx, ba bảng app/(app)/[slug]/{deals,companies,contacts}/*-table.tsx, fields/record-fields.tsx, fields/field-columns.tsx, cùng kieu-truong.tsx và doc-nhap.ts. Tệp vắng thì ném 'tmc quet: thieu tep <tep>' (tệp cũ đã gỡ thì khai trong rang là 'da-go' và kiểm vắng thật). Với tám tệp màn, quét bằng TypeScript compiler API (ts.createSourceFile, không regex trên chữ): (a) so sánh nhị phân hay switch mà một vế là chuỗi thuộc FIELD_TYPES hay 'MONEY' thì ném 'tmc quet: re nhanh kieu <tep>:<dong>'; (b) JSX hay lời gọi tới InlineField, InlineDateField, InlineSelectField, InlineMoneyField, InlineTextArea, formatMoney, formatDay, LocalDay, OwnerCell, SoDienThoai thì ném 'tmc quet: o tu ve <ten> <tep>:<dong>' — ngoại trừ có tên khai sẵn trong rang (ô Giai đoạn, ô Công ty, vai trò liên hệ, cột createdAt và lastActivity không phải trường, mỗi ngoại trừ một cặp tep+ten+ly do; ngoại trừ không còn khớp chỗ nào thì ném 'tmc quet: ngoai tru chet <ten>'). Với kieu-truong.tsx: đọc khoá của bảng đăng ký, thiếu một trong mười một kiểu (FIELD_TYPES đọc từ packages/db/src/fields-shape.ts lúc chạy, cộng MONEY) hay một kiểu thiếu một trong ba mặt hienThi, suaTaiCho, oBang thì ném 'tmc quet: bang thieu <kieu> <mat>'. Vế dương cùng thước: ở mỗi phiếu, tập khoá trường chuẩn mà phiếu đưa vào OTruongPhieu hay HienThiTruong (đọc qua AST các phần tử JSX và các mảng bộ mô tả truyền vào chúng) phải bằng đúng tập khoá của phiếu đó trong 22 dòng đáp án của E6 (chép sẵn trong rang); thiếu hay thừa thì ném 'tmc quet: truong chuan khong qua bang <phieu> <khoa>'. Số tệp đã quét khác 10 thì ném 'tmc quet: thieu tep <n>'. Cặp hai chiều cùng fixture: rang tự chép deal-sheet.tsx của cây vào thư mục tạm, chèn một '<InlineField label=\"x\" value={null} onSave={() => {}} />' và một 'if (field.type === \"NUMBER\")', quét bản chép: không ném