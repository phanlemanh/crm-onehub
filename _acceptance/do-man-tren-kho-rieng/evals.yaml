schema_version: 1
slug: do-man-tren-kho-rieng

evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.dmk_ten_kho
    paths: [packages/db/src/measure-database.ts, packages/db/test/measure-database.spec.ts]
    expected: |
      exit 0; bai measure-database.spec.ts ca "ten-kho" goi ham that measureDatabaseName va
      templateDatabaseName. MA TRAN VIET TRUOC 5 ten cay x 2 ham toEqual: compassionate-hofstadter-928035
      -> crm_compassionate_hofstadter_928035_do / __mau_do; crm -> crm_crm_do / crm_crm__mau_do;
      x-mau -> crm_x_mau_do / crm_x_mau__mau_do; Toan-Canh.OKR -> crm_toan_canh_okr__5a49b2_do;
      a--b -> crm_a_b__90827a_do (bam 6 ky tu sha256 cua ten goc, viet san, khong tinh lai bang
      ham). Ten 80 ky tu -> dung 63 ky tu, ket thuc _do / __mau_do, hai ten dai chi khac ky tu
      cuoi -> khac nhau; "__" -> nem loi "has no letter or digit left". MA TRAN VA CHAM viet
      truoc 17 ten (a-b, a.b, A-B, a_b, a--b, -a-b, toan-canh-okr, Toan-Canh.OKR, toan_canh_okr,
      x, x-mau, x_mau, crm, ten worktree that, ba ten dai) x 2 ham = 34 ten: khong hai ten nao
      trung (thong diep ghim "trung ten kho: <a> va <b>"), moi ten khop /^[a-z0-9_]+$/, khong ten
      nao la crm/crm_test hay ket thuc _test, MOI ten <= 63 ky tu ("ten kho qua 63 ky tu: <nhan>")
      va dung duoi (_do cho kho do, __mau_do cho kho mau; "ten kho sai duoi: <nhan>");
      isTemplateDatabase(ten kho do) == false va isMeasureDatabase(ten kho mau) == false cho moi cay.
      CHIEU DO: S4 round 1 (26/09) do cua ban cu (ten = slug) — reviewer chay that: a-b, a.b,
      A_B, a--b cung ra crm_a_b_do va x-mau trung kho mau cua x; ma tran va cham tren ban cu do voi
      "trung ten kho". Pha thu o S3: bo cat 63 ky tu -> "ten kho qua 63 ky tu"; bo thay ky tu la
      -> "ten kho chi gom a-z0-9_".
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: test
    layer: backend-effect
    cmd: config:executors.test.dmk_tao
    paths: [packages/db/src/measure-database.ts, packages/db/scripts/measure-db.ts, packages/db/scripts/test-db-admin.ts, packages/db/prisma/seed.ts, packages/db/test/measure-database.spec.ts]
    expected: |
      exit 0; ca "tao": kho chung = kho cua luot test (TEST_DATABASE_URL), duoc gieo mot dong
      okrCycle truoc; chup dau van tay (moi bang public: count + md5 moi dong sap xep). Goi
      createMeasureDatabase that voi cay "thu<runid>" tren may chu do. Doc lai qua pg: kho
      crm_thu<runid>_do ton tai; tap migration_name hoan tat trong _prisma_migrations BANG DUNG
      tap thu muc trong packages/db/prisma/migrations (toEqual tren mang sap xep, khong chi dem);
      deal seed-deal-wise-1 ton tai; shobj_description
      bat dau "crm phien do" va mang gio ISO trong 10 phut. Dong cuoi stdout cua CLI
      `bun scripts/measure-db.ts --tao --ten thu<runid>` bang URL tra ve. Dau van tay kho chung
      sau == truoc (toEqual tren doi tuong bang -> {dem, md5}). Don kho trong afterAll.
      CHIEU DO (pha thu o S3, da chay 26/09): seed chay voi NODE_ENV=test -> seed ghi nham kho
      luot test, ca do "thieu deal seed-deal-wise-1"; bo buoc migrate deploy cua kho mau -> ca do
      "prisma/seed.ts exited 1" (P2021, bang chua co).
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: test
    layer: backend-effect
    cmd: config:executors.test.dmk_kho_mau
    paths: [packages/db/src/measure-database.ts, packages/db/scripts/measure-db.ts, packages/db/test/measure-database.spec.ts]
    expected: |
      exit 0; hai ca "kho-mau". (1) Dau nguon: dung ban sao nguon trong thu muc tam (thu muc
      migration cung ten, schema.prisma va seed.ts chep that); sourceFingerprint(ban sao) ==
      sourceFingerprint() that (doi chung duong, ghim "ban sao nguon khong ra cung dau"); MA TRAN 3
      thay doi viet truoc, moi thay doi tren mot ban sao moi: them thu muc migration, them mot dong
      vao schema.prisma, them mot dong vao seed.ts -> dau khac dau that, ghim "dau khong doi khi
      <thay doi>". (2) Kho mau: createMeasureDatabase hai lan voi fingerprint = sourceFingerprint(ban
      sao) -> gio tao kho mau lan hai == lan mot, gio tao kho do lan hai > lan mot; roi them mot
      dong vao seed.ts cua ban sao va goi lai voi sourceFingerprint(ban sao) -> gio tao kho mau
      moi hon (dau di qua ham tao dau that, khong tiem chuoi viet tay).
      CHIEU DO: S4 round 2 do ban cu (tiem `${fingerprint}x`, khong do ham tao dau). Pha thu o S3:
      sourceFingerprint bo bam seed.ts -> ca (1) do "dau khong doi khi seed.ts doi"; bo so khop dau
      -> ca (2) do "kho mau bi dung lai du dau khop".
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: test
    layer: backend-effect
    cmd: config:executors.test.dmk_xoa
    paths: [packages/db/src/measure-database.ts, packages/db/scripts/measure-db.ts, packages/db/test/measure-database.spec.ts]
    expected: |
      exit 0; ca "xoa": tao kho do cho cay thu, mo mot ket noi pg giu vao kho do, goi
      dropMeasureDatabase -> kho khong con trong pg_database. MA TRAN TU CHOI viet truoc 2 ca,
      moi ca goi CLI `bun scripts/measure-db.ts --xoa --kho <ten>` voi mot kho da dung san:
      (a) kho ten crm_thu<runid>_khac (khong _do, tao bang CREATE DATABASE trong bai) -> exit 2
      va stderr chua "is not a measure database"; (b) kho crm_thu<runid>b_do tao tay khong
      COMMENT -> exit 2 va stderr chua "does not carry the measure-session mark"; sau moi ca
      kho van ton tai. Don trong afterAll.
      CHIEU DO (pha thu o S3): bo kiem COMMENT truoc khi xoa -> ca (b) do "kho khong dau bi xoa".
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-5
    executor: test
    layer: backend-effect
    cmd: config:executors.test.dmk_quet_mo_coi
    paths: [packages/db/src/measure-database.ts, packages/db/scripts/measure-db.ts, packages/db/test/measure-database.spec.ts]
    expected: |
      exit 0; ca "quet-mo-coi": dung nam kho rong bang CREATE DATABASE, COMMENT viet bang CHINH
      ham ghi dau cua measure-db (markMeasureDatabase / markTemplate), khong viet chuoi tay. Moi
      moc thoi gian >= gio that T (de luot quet that cua eval khac chay song song khong dung toi
      vat do — S4 round 1 do vi dieu nay), bai quet voi now = T + 2*maxAgeMs + 1 phut: gia (kho
      do, tao T), non (kho do, tao now - 1 phut), khong-dau (ten _do, khong COMMENT),
      mau-con-dung (kho mau, tao T, dung now - 1 phut), mau-bo (kho mau, tao va dung T). Doi
      chung duong tren cung fixture: quet truoc voi T + maxAgeMs - 1 phut -> khong kho nao
      trong nam bi xoa, moi kho mot khang dinh ghim "kho <nhan> bi xoa khi quet truoc han". Roi
      quet voi now: tap con lai BANG DUNG [non, khong-dau, mau-con-dung], tap bi xoa trong nam
      BANG DUNG [gia, mau-bo]. Ca mang tran thoi gian rieng (SLOW_MS) nhu cac ca cham kho khac:
      S4 round 1 va round 2 do vi tran 5 s mac dinh cua bun test khi 13 eval chay song song.
      CHIEU DO (pha thu o S3, da chay 26/09): bo dieu kien tuoi -> ca do "kho non bi xoa khi quet
      truoc han"; bo loc COMMENT -> ca do "kho khong-dau bi xoa khi quet truoc han"; bo gio dung
      khoi moc tuoi -> ca do "kho mau con dung bi xoa".
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-6
    executor: script
    layer: backend-effect
    cmd: config:executors.script.dmk_dau_cuoi
    paths: [scripts/lan-do/phien-do.mjs, scripts/lan-do/cau-hinh.mjs, packages/db/scripts/measure-db.ts, packages/db/src/measure-database.ts, _acceptance/do-man-tren-kho-rieng/rang/phien.mjs, scripts/lan-do/tien-de.mjs]
    expected: |
      exit 0; rang phien.mjs che do dau-cuoi: dung kho chung gia crm_chung_gia_<id> (migrate
      deploy, gieo mot okrCycle la), DATABASE_URL tro vao no, PHIEN_DO_TEN_CAY=dmk-dau-cuoi-<id>;
      chup dau van tay kho chung gia truoc; chay `bun scripts/lan-do/phien-do.mjs --chay "<lenh do>"` voi lenh do la
      rang/do-trong-phien.mjs ghi JSON ra .acceptance-runs/do-man-tren-kho-rieng/do.json roi thoat
      theo DO_MA (0). MA TRAN VIET TRUOC 8 khang dinh tren JSON: ten kho trong DATABASE_URL ==
      measureDatabaseName(cay nay); cong APP_URL trong dai PHIEN_DO.cong; cong API_URL trong dai;
      canhCay().ket == "dung-cay"; GET API_URL/health == 200; user NGUOI ton tai trong kho do;
      isOnboarded(metadata cua organization WORKSPACE_ID) == true; ma phien == 0; PHIEN_DO ==
      ten kho. Sau phien 3 khang dinh: hai cong khong con tien trinh
      nghe (lsof rong), kho do khong con trong pg_database, dau van tay kho chung sau == truoc.
      CHIEU DO (pha thu o S3): bo buoc xoa kho trong finally -> do "kho do con sau phien"; lenh
      do ep APP_URL ve mot cong khong ai nghe -> canhCay khong-noi-duoc, do "may chu khong phuc
      vu cay nay"; phien chay dev:session khong kem DATABASE_URL cua kho do -> chinh phien chan
      som: thoat 2 "khong co hang workspace sau dev:session", rang thoat 2 KHONG DO DUOC.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-7
    executor: script
    layer: backend-effect
    cmd: config:executors.script.dmk_don_khi_do
    paths: [scripts/lan-do/phien-do.mjs, scripts/lan-do/cau-hinh.mjs, _acceptance/do-man-tren-kho-rieng/rang/phien.mjs, packages/db/src/measure-database.ts, packages/db/scripts/measure-db.ts, scripts/lan-do/tien-de.mjs]
    expected: |
      exit 0; rang phien.mjs che do don-khi-do (PHIEN_DO_TEN_CAY=dmk-don-<id>, kho chung gia nhu
      E6), MA TRAN 4 ca viet truoc, moi ca 4 khang dinh (ma
      phien, cong trong, kho do khong con, khong con pid may chu nao ghi trong phien.json):
      moi ca them ba doi chung duong truoc cac khang dinh am: lenh do da ghi JSON; hai cong cua
      phien trong dai; phien.json cua CHINH phien do (khop pid) co hai nhom may chu dang song luc
      doc. (1) DO_MA=1 -> ma 1; (2) SIGINT gui khi lenh do da ghi JSON -> ma 130; (3) SIGTERM -> 143;
      (4) SIGKILL phien khi lenh do dang ngu -> hai pid may chu con song ngay sau SIGKILL (doi
      chung: chung that la mo coi), roi chay phien ke voi lenh do -> truoc lenh do cua phien ke,
      hai pid cu da chet (lenh do ghi danh sach pid song vao JSON), va phien ke thoat 0 tren kho
      do moi (gio tao COMMENT moi hon luc SIGKILL); nhom may chu cua phien ke doc tu phien.json
      cua phien ke (khop pid), khac nhom cua phien bi giet, va sau phien ke khong con.
      CHIEU DO (pha thu o S3): bo bat SIGTERM -> ca (3) do "SIGTERM de lai kho do"; bo buoc giet
      nhom trong phien.json -> ca (4) do "may chu mo coi con song".
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E8
    criterion: AC-8
    executor: script
    layer: backend-effect
    cmd: config:executors.script.dmk_xep_hang
    paths: [scripts/lan-do/phien-do.mjs, _acceptance/do-man-tren-kho-rieng/rang/phien.mjs, packages/db/src/measure-database.ts, packages/db/scripts/measure-db.ts, scripts/lan-do/tien-de.mjs, scripts/lan-do/cau-hinh.mjs]
    expected: |
      exit 0; rang phien.mjs che do xep-hang (kho chung gia nhu E6): phien A
      (PHIEN_DO_TEN_CAY=dmk-hang-<id>) (lenh do ngu 15 s, ghi moc bat dau/ket thuc)
      va phien B cung ten cay khoi sau A 2 s. Khang dinh: stderr B co dong "cho phien khac cua cay
      nay"; moc bat dau lenh cua B >= moc ket thuc phien A (A da don); ca hai ma 0. Doi chung:
      phien C voi PHIEN_DO_TEN_CAY=dmk-hang-<id>-khac khoi sau A 2 s -> C khong in dong cho;
      khoang chay lenh cua C chong len khoang cua A; hai pid may chu cua A (doc tu phien.json cua
      A) con song suot luc C dung (kiem moi nhip 500 ms toi khi lenh A ket thuc); A thoat 0.
      CHIEU DO (pha thu o S3): bo khoa -> B chay chong A, do "hai phien cung cay chay chong".
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E9
    criterion: AC-9
    executor: script
    layer: backend-effect
    cmd: config:executors.script.dmk_tien_de
    paths: [scripts/lan-do/tien-de.mjs, scripts/lan-do/phien-do.mjs, scripts/lan-do/cau-hinh.mjs, _acceptance/do-man-tren-kho-rieng/rang/phien.mjs, packages/db/src/measure-database.ts, packages/db/scripts/measure-db.ts]
    expected: |
      exit 0; rang phien.mjs che do tien-de (PHIEN_DO_TEN_CAY=dmk-td-<id>), ba ca: (a) DATABASE_URL
      = kho chung gia nhu E6, APP_URL=
      http://localhost:1, chay `bun scripts/lan-do/tien-de.mjs --chay "<lenh do>"` -> JSON cua lenh
      do: ten kho _do cua cay nay, APP_URL khac :1 va trong dai, contextDevApiKey doc tu kho do ==
      "lan-do-khong-phai-khoa-that"; ma 0; dau van tay kho chung truoc == sau. (b) chay
      `bun scripts/lan-do/phien-do.mjs --chay "bun scripts/lan-do/tien-de.mjs --chay '<lenh do>'"`
      -> APP_URL trong lenh do == APP_URL cua phien ngoai (lenh do ghi ca hai), stderr khong co
      dong cho khoa, ma 0. (c) DATABASE_URL = kho mau crm_dmk_td_<id>__mau_do (da co sau ca a)
      -> lenh do thay ten kho _do (khong phai __mau_do), ma 0, dau van tay kho mau truoc == sau.
      CHIEU DO (pha thu o S3, da chay 26/09): bo re-exec trong tien-de -> tien-de chay thang tren
      kho chung gia, khong co NGUOI nen thoat 2 truoc khi ghi; ca (a) do "ca a: lenh do chay tren
      kho do cua cay"; bo nhan dien kho _do ca o tien-de lan o duong long cua phien-do (mot mat
      thi mat kia van do) -> phien long nhau cho khoa cua chinh minh, rang giet o tran 6 phut va
      in "tien-de long dung phien thu hai".
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E10
    criterion: AC-10
    executor: script
    layer: backend-effect
    cmd: config:executors.script.dmk_kho_chung_khong_doi
    paths: [scripts/lan-do/tien-de.mjs, scripts/lan-do/phien-do.mjs, packages/db/scripts/measure-db.ts, _acceptance/do-man-tren-kho-rieng/rang/kho-chung-khong-doi.mjs, packages/db/src/measure-database.ts, scripts/lan-do/cau-hinh.mjs]
    expected: |
      exit 0; rang kho-chung-khong-doi.mjs doc NGUYEN VAN chuoi lenh executors.test.dok_man_chrome
      tu _acceptance/config.yaml (khong chep tay), chay voi PHIEN_DO_TEN_CAY=dmk-okr-<id>. Hai kho
      chung, moi kho chay lenh mot lan:
      (i) kho gia crm_chung_gia_<id> (khong _do, khong _gieo) do rang dung bang migrate deploy
      va gieo mot okrCycle ten "chu ky la cua luot khac", DATABASE_URL tro vao no; (ii) kho crm
      that cua .env, CHI khi no dang co >= 1 okrCycle — khong co thi in mot dong "kho crm that
      khong co chu ky la, bo ca (ii)" va khong ghi gi vao no; pg_stat_activity co ket noi khac
      vao crm (may chu dev cua nguoi) -> ca (ii) van chay lenh nhung chi IN dau van tay
      truoc/sau, khong khang dinh. Moi ca: dau van tay truoc, chay
      lenh, dau van tay sau; khang dinh ma lenh == 0 va hai dau bang nhau (in ten bang lech neu
      co). Kho gia bi xoa trong finally.
      CHIEU DO (pha thu o S3): bo re-exec trong tien-de -> ca (i) ma 2 voi dong man-okr "kho da
      co 1 chu ky OKR ngoai fixture", rang do "dok_man_chrome khong xanh tren kho chung co du
      lieu la".
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E11
    criterion: AC-11
    executor: script
    cmd: config:executors.script.dmk_khong_noi_thuoc
    paths: ["**"]
    expected: |
      exit 0; rang khong-noi-thuoc.mjs lay git diff --name-only merge-base(HEAD, origin/onehub)..HEAD
      va git diff cua _acceptance/config.yaml. Khang dinh: khong tep nao duoi _acceptance/<slug>/
      voi slug khac do-man-tren-kho-rieng; moi dong bi xoa ('-') cua config.yaml trong diff la
      rong (chi them); canh-cay.mjs khong trong danh sach. Doi chung duong va do tren cung ham:
      danh sach tep gia chua _acceptance/dat-okr-trong-crm/rang/man-okr.mjs -> ham tra loi goi
      ten tep; diff gia co dong xoa "-    dok_man_chrome: ..." -> loi goi ten khoa.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E12
    criterion: AC-12
    executor: script
    cmd: config:executors.script.dmk_tai_lieu
    paths: [docs/setup.md, CLAUDE.md, .env.example, _acceptance/do-man-tren-kho-rieng/rang/tai-lieu.mjs]
    expected: |
      exit 0; rang tai-lieu.mjs (chay bang bun, nap hang so that MEASURE_DATABASE va PHIEN_DO) tach
      muc "### Screen measurements" cua docs/setup.md: chua bay moc "db:do --tao", "--xoa",
      "--quet", "do:man", "template", "maxAgeMs", "tien-de"; so gio ghi trong "(N hours)" nhan
      3 600 000 == MEASURE_DATABASE.maxAgeMs va dai "tu–den" == PHIEN_DO.cong (quan he gia tri,
      khong chi chuoi co mat). Muc "## Cách chứng minh nó chạy" cua CLAUDE.md chua "do:man" va cau
      "không bao giờ ghi vào kho chung". Khoi chu thich PHIEN_DO cua .env.example chua "never by
      hand". Doi chung do tren cung ham, bon ca: bo "--quet"; ghi 6 gio; ghi dai 3000–3999; bo
      "never by hand" -> moi ca bi goi ten.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E13
    criterion: AC-13
    executor: script
    cmd: config:executors.script.dmk_truoc_gop_toan_kho
    paths: [_acceptance/do-man-tren-kho-rieng/rang/truoc-gop.mjs, scripts/pre-merge-check.sh, scripts/lan-do/**]
    expected: |
      exit 0; rang truoc-gop.mjs chay `bash scripts/pre-merge-check.sh . --base origin/onehub`
      (khong --slug), tach tung dong vi pham theo ten ho so no goi, bo cac dong cua
      do-man-tren-kho-rieng, doi so dong con lai == 0 va in nguyen van tung dong neu co. Bo tach
      dong doc dung khuon dong pre-merge that: doi chung tren cung ham voi hai dong mau lay tu
      mot luot pre-merge that luu trong rang (mot dong cua ho so khac -> dem 1, mot dong cua ho
      so nay -> dem 0). Lenh pre-merge thoat ma khac 0/1 (khong chay duoc) -> rang thoat 2.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
