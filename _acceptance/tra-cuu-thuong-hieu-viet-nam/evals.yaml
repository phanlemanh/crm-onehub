  - id: E11
    criterion: AC-1
    executor: judgment
    inputs: [apps/app/lib/messages/companies.ts, apps/app/components/crm/record-sheet/company-sheet.tsx]
    question: "Trong tệp thông điệp này, câu báo khi rep dán trang mạng xã hội vào ô Tên miền (bản vi và bản en) có (1) gọi tên nền tảng, (2) nói rõ đó không phải trang web của công ty, (3) bảo rep làm gì tiếp — để trống hay dán trang web riêng — bằng chữ thường một môi giới hiểu, không thuật ngữ kỹ thuật? Gợi ý ô «Tên miền» bên dưới có còn nói «dán cả đường dẫn cũng được» mà không nhắc ngoại lệ trang mạng xã hội không? Trong tệp ngăn công ty, nhánh báo lỗi khi rep sửa ô Tên miền có dùng đúng hàm thông điệp đó của tệp thông điệp công ty (không tự viết câu khác) không?"
    expected: "Cả hai bản đạt ba ý; gợi ý ô không mâu thuẫn với câu báo."
    evidence_required: [run_id, verdict, rationale]
