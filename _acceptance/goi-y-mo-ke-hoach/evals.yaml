  - id: E9
    criterion: AC-9
    executor: judgment
    question: >-
      Đọc CONTEXT.md (mục «Gợi ý mở kế hoạch» và mục «Gợi ý»), docs/api.md (mục router onboarding) và
      docs/plan/lo-trinh-viec-du-an.json (hàng DA3b) như một người mới vào kho. Tài liệu có nói rõ sáu điều không:
      (1) Gợi ý mở kế hoạch là một bản ghi máy sinh khi deal chuyển sang giai đoạn thắng, khác «Gợi ý» là câu hướng
      xử lý đi kèm nhắc kế hoạch im; (2) máy sinh khi lần chuyển đi từ giai đoạn không phải thắng (hay tạo mới) sang
      thắng, công ty chưa có kế hoạch mở, và deal chưa có gợi ý đang chờ — mỗi lần chuyển một gợi ý; (3) ba kết cục
      chờ · đã mở kế hoạch · đã bỏ qua, và chỉ người nhận hoặc quản trị bỏ qua được; (4) tạo kế hoạch cho công ty
      bằng bất kỳ đường nào cũng đóng các gợi ý đang chờ của công ty đó; (5) hai thủ tục goiYCuaDeal và boQuaGoiY
      của router onboarding; (6) hàng DA3b không còn ghi «chưa mở». Tài liệu không dùng chữ «dự án» cho kế hoạch
      30 ngày. Trả PASS khi đủ sáu điều, FAIL nêu điều thiếu.
    inputs: [CONTEXT.md, docs/api.md, docs/plan/lo-trinh-viec-du-an.json]
    evidence_required: [verdict, rationale, verified_at]

