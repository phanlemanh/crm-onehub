    cmd: config:executors.test.gymk_sinh
    expected: "exit 0; -t gy-sinh của apps/api/test/goi-y-mo-ke-hoach.spec.ts. Dựng qua đường ghi thật: công ty không kế hoạch, người phụ trách 'gy-p', bốn giai đoạn (M1, M2 mở; W thắng; L thua) cộng W2 thắng cho ca lưu trữ. Ma trận 12 ô viết trước trong spec ({tu: tao|mo|thang|thua} × {den: mo|thang|thua}), mỗi ô một deal mới đưa tới giai đoạn đi rồi gọi deals.setStage qua caller tRPC thật (ô 'tao' gọi deals.create với stage đích; ô thắng→thắng đi W→W2; ô mở→mở đi M1→M2); số ô đã chạy khác 12 thì ném 'gy: ma tran thieu o <n>'. Ba ô đi từ thắng (thắng→mở, thắng→thắng, thắng→thua): gợi ý sinh lúc dựng deal tới W được bỏ qua bằng onboarding.boQuaGoiY thật TRƯỚC lần chuyển đo, để điều kiện «deal không có gợi ý chờ» không che ô; mỗi ô đếm delta gợi ý của riêng lần chuyển đo. Ba ô sinh (tao→thang, mo→thang, thua→thang): số GoiYKeHoach của deal khác 1 thì ném 'gy: o sinh sai <o> <n>'; trangThai khác CHO, nguoiNhanId khác gy-p, companyId khác công ty thì ném 'gy: goi y sai truong <o> <truong>'; chuyenLuc khác occurredAt của dòng STAGE_CHANGE của lần chuyển (ô tao: khác deal.createdAt) thì ném 'gy: chuyenLuc lech <o>'. Chín ô còn lại: delta gợi ý khác 0 thì ném 'gy: o khong sinh lai sinh <o>'. bulkSetStage mở→thắng cho hai deal: mỗi deal khác đúng một gợi ý thì ném 'gy: bulk khong sinh'. Lưu trữ giai đoạn W với moveTo W2 có một deal thắng mà gợi ý đã bỏ qua (không có gợi ý chờ): thêm gợi ý thì ném 'gy: luu tru giai doan sinh'. Chiều đỏ ở E11 (a), (b), (i)."
