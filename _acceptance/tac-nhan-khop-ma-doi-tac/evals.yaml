schema_version: 1
slug: tac-nhan-khop-ma-doi-tac

evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.tn_lo_mang_danh_tinh
    paths:
      - "apps/api/src/onboarding/**"
      - "packages/validation/src/onboarding-ingest.ts"
      - "apps/api/test/khop-ma-diem-nhan.spec.ts"
    expected: |
      Goi THAT diem nhan qua controller voi khoa dung.
      Khang dinh BA dieu:
        1 lo co ten, so dien thoai, email o moi muc -> 200
        2 lo KHONG co ba truong do -> 200 (lo cu van hop le)
        3 lo co mot muc email sai khuon -> 400, thong diep CO CHUA ten truong
          email, va dem hang cho ghep truoc/sau bang nhau
      CHIEU DO: doi khuon sang bat buoc ten -> dong 2 do voi thong diep ghim ma
      tra ve 400/200.

  - id: E2
    criterion: AC-2
    executor: test
    layer: backend-effect
    cmd: config:executors.test.tn_luu_hang_cho
    paths:
      - "apps/api/src/onboarding/**"
      - "packages/validation/src/onboarding-ingest.ts"
      - "apps/api/test/khop-ma-diem-nhan.spec.ts"
    expected: |
      Gui mot lo mot muc mang ma khong khop ai, kem danh tinh va bon moc.
      Khang dinh BON dieu doc lai tu DB:
        1 dung MOT hang onboardingPendingMatch cho cap planId + platformBrokerId
        2 hang mang dung ten, so dien thoai, email va bon moc cua muc
        3 dung MOT AgentTask onboarding-identify moi, payload tro vao id hang cho
        4 gui LAI cung lo voi moc accountAt khac -> van MOT hang, moc da cap nhat,
          va khong co AgentTask thu hai
      CHIEU DO: bo khoa duy nhat, tao hang moi moi lan -> dong 4 do voi thong diep
      ghim so hang mong doi 1.

  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.tn_khop_email
    paths:
      - "apps/agent/agent/lib/khop-ma-doi-tac.ts"
      - "apps/agent/agent/lib/dispatch.ts"
      - "packages/db/src/agent-tasks.ts"
      - "packages/validation/src/onboarding-identify.ts"
      - "apps/agent/test/khop-ma-doi-tac.integration.spec.ts"
    expected: |
      Goi THAT ham xu ly viec cua tac nhan tren mot hang cho co email
      ' An@Example.COM ' va mot Ca nhan email an@example.com.
      Khang dinh BON dieu doc lai tu DB:
        1 dung MOT ghi danh cho cap ke hoach + Ca nhan, bon moc bang moc hang cho
        2 truong ma_moi_gioi_nen_tang cua Ca nhan bang ma cua hang cho
        3 hang cho o trang thai da ghep, tro vao Ca nhan do
        4 viec ket thuc xong
      CHIEU DO: bo buoc ha chu thuong -> dong 1 do voi thong diep ghim email.

  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.tn_khop_so_dien_thoai
    paths:
      - "apps/agent/agent/lib/khop-ma-doi-tac.ts"
      - "apps/agent/agent/lib/dispatch.ts"
      - "packages/db/src/agent-tasks.ts"
      - "packages/validation/src/onboarding-identify.ts"
      - "apps/agent/test/khop-ma-doi-tac.integration.spec.ts"
    expected: |
      Ma tran chuan hoa so dien thoai, viet truoc, BON cap (hang cho / Ca nhan):
        '+84 912 345 678' / '0912345678'
        '84912345678' / '0912 345 678'
        '0912-345-678' / '+84912345678'
        '0912345678' / '0912345679' (khac mot so -> KHONG khop)
      Ba cap dau -> ghi danh tao dung nhu E3; cap cuoi -> khong ghi gi.
      So assert bang so cap. CHIEU DO: bo buoc doi tien to 84 -> cap mot do voi
      thong diep ghim hai so.

  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.tn_nhieu_ca_nhan
    paths:
      - "apps/agent/agent/lib/khop-ma-doi-tac.ts"
      - "apps/agent/agent/lib/dispatch.ts"
      - "packages/db/src/agent-tasks.ts"
      - "packages/validation/src/onboarding-identify.ts"
      - "apps/agent/test/khop-ma-doi-tac.integration.spec.ts"
    expected: |
      Hai Ca nhan cung email voi hang cho.
      Khang dinh BON dieu:
        1 KHONG ghi danh nao duoc tao — dem truoc/sau
        2 KHONG truong ma nen tang nao duoc ghi
        3 hang cho o trang thai de xuat, danh sach ung vien dung HAI id Ca nhan,
          ly do moi ung vien la khop email
        4 DOI CHUNG DUONG tren cung fixture: xoa mot trong hai Ca nhan roi chay lai
          -> ghep tu dong nhu E3
      CHIEU DO: doi sang lay Ca nhan dau tien khi co nhieu -> dong 1 do voi thong
      diep ghim so ghi danh mong doi 0.

  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.tn_chi_khop_ten
    paths:
      - "apps/agent/agent/lib/khop-ma-doi-tac.ts"
      - "apps/agent/agent/lib/dispatch.ts"
      - "packages/db/src/agent-tasks.ts"
      - "packages/validation/src/onboarding-identify.ts"
      - "apps/agent/test/khop-ma-doi-tac.integration.spec.ts"
    expected: |
      Hang cho khong co email va so, ten 'Nguyễn Văn An'.
      Hai Ca nhan: 'Nguyễn Văn An' va 'Nguyen Van An'.
      Khang dinh BA dieu:
        1 khong ghi danh nao, khong truong nao duoc ghi
        2 hang cho de xuat dung MOT ung vien — Ca nhan co dau, ly do khop ten
        3 Ca nhan khong dau KHONG nam trong ung vien
      CHIEU DO: so ten sau khi bo dau -> dong 3 do voi thong diep ghim ten bi
      khop sai.

  - id: E7
    criterion: AC-7
    executor: test
    cmd: config:executors.test.tn_ma_khac_khong_ghi_de
    paths:
      - "apps/agent/agent/lib/khop-ma-doi-tac.ts"
      - "apps/agent/agent/lib/dispatch.ts"
      - "packages/db/src/agent-tasks.ts"
      - "packages/validation/src/onboarding-identify.ts"
      - "apps/agent/test/khop-ma-doi-tac.integration.spec.ts"
    expected: |
      Ca nhan khop email da mang ma nen tang 'OH-1', hang cho mang 'OH-2'.
      Khang dinh BA dieu:
        1 truong cua Ca nhan van la 'OH-1' — doc lai tu DB
        2 khong ghi danh nao duoc tao
        3 hang cho de xuat Ca nhan do, ly do neu ma khac
      DOI CHUNG DUONG: Ca nhan chua co ma -> ghep tu dong nhu E3.
      CHIEU DO: bo buoc kiem ma cu -> dong 1 do voi thong diep ghim 'OH-1'.

  - id: E8
    criterion: AC-8
    executor: test
    cmd: config:executors.test.tn_khong_tim_thay
    paths:
      - "apps/agent/agent/lib/khop-ma-doi-tac.ts"
      - "apps/agent/agent/lib/dispatch.ts"
      - "packages/db/src/agent-tasks.ts"
      - "packages/validation/src/onboarding-identify.ts"
      - "apps/agent/test/khop-ma-doi-tac.integration.spec.ts"
    expected: |
      Hang cho khong khop email, so, ten cua Ca nhan nao.
      Khang dinh BA dieu:
        1 khong ghi gi — dem ghi danh va gia tri truong truoc/sau bang nhau
        2 hang cho o trang thai khong tim thay, danh sach ung vien rong
        3 viec ket thuc xong, khong lap lai
      CHIEU DO: doi sang tao Ca nhan moi khi khong thay -> dong 1 do.

  - id: E9
    criterion: AC-9
    executor: test
    cmd: config:executors.test.tn_payload_hong
    paths:
      - "apps/agent/agent/lib/khop-ma-doi-tac.ts"
      - "apps/agent/agent/lib/dispatch.ts"
      - "packages/db/src/agent-tasks.ts"
      - "packages/validation/src/onboarding-identify.ts"
      - "apps/agent/test/khop-ma-doi-tac.integration.spec.ts"
    expected: |
      Ba ca, viet truoc:
        1 onboarding-identify nam trong TASK_KINDS va DIRECT_KINDS — doc hang so
          that, khong doc tai lieu
        2 payload thieu pendingMatchId -> viec ket thuc voi loi co ten khuon
          'onboarding-identify', KHONG o trang thai xong
        3 payload tro toi hang cho da xoa -> viec ket thuc voi loi neu id do
      Dong 2 va 3 la cap hai chieu voi E3 tren cung ham xu ly. CHIEU DO: nuot loi
      parse va danh dau xong -> dong 2 do voi thong diep ghim trang thai viec.

  - id: E10
    criterion: AC-10
    executor: test
    layer: backend-effect
    cmd: config:executors.test.tn_khop_thang_lan_sau
    paths:
      - "apps/api/src/onboarding/**"
      - "packages/validation/src/onboarding-ingest.ts"
      - "apps/api/test/khop-ma-diem-nhan.spec.ts"
    expected: |
      Chay tren CSDL that: diem nhan ghi hang cho cho ma OH-9; roi ma OH-9 duoc
      ghi vao truong cua Ca nhan bang CHINH ham ghi truong dung chung
      (writeValues cua @crm/db/fields) — cung ham tac nhan goi khi ghep, khong
      chen hang tay; roi diem nhan nhan lo THU HAI cung ma voi moc moi.
      Khang dinh BA dieu:
        1 lo hai khop thang: phan hoi dem muc vao so khop, khong vao so chuyen
          tac nhan
        2 khong hang cho moi, khong AgentTask moi
        3 ghi danh mang moc cua lo hai
      CHIEU DO: ghi ma vao mot truong KHAC khoa ma_moi_gioi_nen_tang -> dong 1
      do voi thong diep ghim ma.

  - id: E11
    criterion: AC-11
    executor: test
    layer: backend-effect
    cmd: config:executors.test.tn_xac_nhan_ung_vien
    paths:
      - "apps/api/src/onboarding/**"
      - "packages/validation/src/onboarding-ingest.ts"
      - "apps/api/test/khop-ma-diem-nhan.spec.ts"
      - "apps/app/app/(app)/[slug]/onboarding/[planId]/**"
    expected: |
      Goi THAT thu tuc tRPC xac nhan ung vien, roi dung man ho so ke hoach trong
      jsdom va bam «Dung nguoi nay».
      Khang dinh BON dieu:
        1 thu tuc tao ghi danh voi bon moc cua hang cho — doc lai tu DB
        2 truong ma nen tang cua Ca nhan duoc ghi
        3 hang cho chuyen da ghep, khong con trong danh sach cho cua ke hoach
        4 man goi dung thu tuc xac nhan voi dung id hang cho va id ung vien —
          ban gia tRPC ghi lai TEN thu tuc va doi so
      5 ung vien mang ma OH-1, hang cho mang OH-2: xac nhan bi tu choi voi loi
        NEU 'OH-1', truong van la OH-1, khong ghi danh nao duoc tao
      CHIEU DO: xac nhan mot id Ca nhan KHONG nam trong ung vien -> bi tu choi voi
      loi co ten, khong ghi gi; bo buoc kiem ma cu -> dong 5 do voi thong diep
      ghim 'OH-1'.

  - id: E12
    criterion: AC-12
    executor: test
    cmd: config:executors.test.tn_bac_hang_cho
    paths:
      - "apps/api/src/onboarding/**"
      - "packages/validation/src/onboarding-ingest.ts"
      - "apps/api/test/khop-ma-diem-nhan.spec.ts"
      - "apps/app/app/(app)/[slug]/onboarding/[planId]/**"
    expected: |
      Bam Bac tren man ho so ke hoach trong jsdom, va goi that thu tuc bac.
      Khang dinh BON dieu:
        1 sau cu bam thu nhat hop xac nhan hien ra, thu tuc bac CHUA duoc goi
        2 xac nhan -> thu tuc bac duoc goi dung mot lan voi dung id
        3 thu tuc that: hang cho chuyen da bac, khong ghi danh nao duoc tao
        4 CHIEU AM: bam Bac roi Huy -> thu tuc khong bao gio duoc goi
      CHIEU DO: bo hop xac nhan -> dong 1 do voi thong diep ghim so lan goi.

  - id: E13
    criterion: AC-13
    executor: ui-check
    layer: ui-observed
    cmd: config:executors.design.ui_check
    steps:
      - "Dung api 3301 va app 3300 cua CAY DANG XET (api-cay-nay, app-cay-nay)"
      - "CHAN CAY: dat dau moc .svg vao apps/app/public roi xin lai qua http://localhost:3300; khong nhan lai -> thoat ma 2, khong doc anh nao"
      - "Gieo qua CHINH diem nhan cua API o 3301: mot ke hoach, hai muc khong khop — mot mang ten trung dung mot Ca nhan, mot khong khop ai; roi chay THAT ham xu ly viec cua tac nhan tren hai viec vua ghi (khong chen tay ung vien)"
      - "Tao phien bang `cd apps/api && bun run dev:session <email>`, dat cookie"
      - "Mo ho so ke hoach, chup evidence/E13-cho-ghep.png o kho 1440 va evidence/E13-cho-ghep-768.png o kho 768"
    inputs:
      - _acceptance/tac-nhan-khop-ma-doi-tac/evidence/
    paths:
      - "apps/app/app/(app)/[slug]/onboarding/[planId]/**"
      - "packages/ui/**"
    expected: |
      Nhin thay tren anh, khong suy tu ma:
        1 khoi Cho ghep co mat voi hai dong
        2 dong de xuat co ten ung vien, ly do khop va nut xac nhan
        3 dong khong tim thay noi ro khong tim thay ai
        4 o kho 768 khong co chu bi cat, khong tran ngang
      Anh thieu khoi hoac thieu dong -> khong dat.

  - id: E14
    criterion: AC-14
    executor: test
    cmd: config:executors.test.tn_tin_hieu_trai_nhau
    paths:
      - "apps/agent/agent/lib/khop-ma-doi-tac.ts"
      - "apps/agent/test/khop-ma-doi-tac.integration.spec.ts"
    expected: |
      Hang cho co email khop dung Ca nhan A, so dien thoai khop dung Ca nhan B.
      Khang dinh BON dieu doc lai tu DB:
        1 dem ghi danh truoc/sau bang nhau
        2 truong ma cua ca A va B khong doi
        3 hang cho de xuat dung HAI id A va B, ly do rieng: email cho A, so cho B
        4 DOI CHUNG DUONG tren cung fixture: doi so cua B thanh so cua A ->
          email va so cung chi A -> tu ghep vao A
      CHIEU DO: doi sang email thang -> dong 1 do voi thong diep ghim so ghi
      danh mong doi 0.

  - id: E15
    criterion: AC-15
    executor: test
    layer: backend-effect
    cmd: config:executors.test.tn_hang_cho_chua_xu_ly
    paths:
      - "apps/api/src/onboarding/**"
      - "apps/api/test/khop-ma-diem-nhan.spec.ts"
    expected: |
      Ghi hang cho QUA diem nhan, KHONG chay tac nhan. Goi dung thu tuc ma man ho
      so ke hoach dung de tai khoi Cho ghep.
      Khang dinh BA dieu:
        1 ket qua co dong cua hang cho do, trang thai «dang cho»
        2 danh dau viec cua hang cho la loi (nhu tac nhan tra loi AC-9) -> van
          co dong, trang thai «khong xu ly duoc»
        3 hang cho da bac hoac da ghep KHONG co trong ket qua
      Dong 1-2 va 3 la cap hai chieu tren cung thu tuc. CHIEU DO: loc chi hai
      trang thai de xuat va khong tim thay -> dong 1 do voi thong diep ghim ma.

  - id: E16
    criterion: AC-16
    executor: test
    layer: backend-effect
    cmd: config:executors.test.tn_mau_co_dap_an
    paths:
      - "apps/api/src/onboarding/**"
      - "apps/agent/agent/lib/khop-ma-doi-tac.ts"
      - "apps/agent/agent/lib/dispatch.ts"
      - "_acceptance/tac-nhan-khop-ma-doi-tac/rang/mau-co-dap-an.json"
    expected: |
      Bang mau co dap an o rang/mau-co-dap-an.json, doc bang duong dan suy tu vi
      tri cua tep kiem, khong ghim goc kho. Moi dong: Ca nhan co san, muc lo nen
      tang, dap an (ghep vao ai, hoac de trong). Bang PHAI co it nhat mot dong
      cho moi ca: khop email, khop so khac cach viet, nhieu Ca nhan, chi ten, khac
      dau, ma khac, khong tim thay, hai tin hieu trai nhau.
      Duong di tren CUNG mot CSDL trong mot lan chay: buoc mot la bai kiem API gui
      moi dong qua controller diem nhan that; buoc hai la bai kiem tac nhan lay
      DUNG cac AgentTask diem nhan vua ghi va chay qua lan thang that cua dispatch.
      Khang dinh BA dieu:
        1 so ca ghep nham bang 0 — so tung dong voi dap an
        2 so dong da cham bang so dong trong bang — khong dong nao bi bo qua
        3 moi viec o trang thai xong hoac loi co ten, khong viec nao treo
      CHIEU DO: bo kiem «dung mot» -> dong 1 do voi thong diep neu ten dong mau
      bi ghep nham.

