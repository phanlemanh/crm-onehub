      khong insert AgentTask tay; payload doc bang parseNhacPayload.
      Tin nhac hom nay bon muc, muc 2 la buoc chua xong. Nhan "xong 2 9".
      completedAt moi buoc trong daGui bang truoc (map toEqual); Activity moi dem = 0;
      guiToi dai 1, mot dong, chua "9" va "1–4".
      Doi chung duong cung fixture: "xong 2" -> buoc muc 2 xong (chung to muc 2 lam duoc,
      nen o do la do so 9).
      Chieu do (pha-thu, S3): danh dau so hop le truoc roi moi kiem so sai -> do voi
      thong diep ghim "duoc ca hoac khong".
  - id: E6
    criterion: AC-5
    executor: test
    layer: backend-effect
    cmd: config:executors.test.ttn_khong_phai_buoc
    paths:
