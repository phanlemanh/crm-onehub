        (c) Zalo chua noi -> cau tra loi bang ZALO.loi.huongDan; khong buoc doi.
        (d) Zalo dang bi chan (ghiSai du lan) -> res.status 200; ZaloUpdateSeen cua message_id
            dem 1; guiToi dai 0; khong buoc doi.
      So o thuc chay = 4.
      Doi chung duong cua (b): cung nguoi doi vai ve member -> "xong 1" danh dau duoc.
      Chieu do (pha-thu, S3): bo kiem vai -> (b) do voi thong diep ghim "vai okr khong ghi".
  - id: E10
    criterion: AC-9
