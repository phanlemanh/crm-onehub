  - id: E17
    criterion: AC-14
    executor: script
    layer: backend-effect
    cmd: config:executors.script.ttn_tai_lieu
    paths:
      - "CONTEXT.md"
      - "docs/agent.md"
      - "docs/plan/lo-trinh-zalo.md"
      - "_acceptance/tra-loi-tin-nhac/rang/tai-lieu.mjs"
    expected: |
      Script doc ban nhanh va ban merge-base(origin/onehub) cua CONTEXT.md, docs/agent.md,
      docs/plan/lo-trinh-zalo.md. Kiem: muc Bot Zalo cua CONTEXT.md ban nhanh chua "xong" va
      ban ngay truoc commit dau cua ho so khong (doi tu merge-base 05/10 o zalo-va); docs/agent.md co mot doan chua ca bon moc `xong`, "được cả hoặc
