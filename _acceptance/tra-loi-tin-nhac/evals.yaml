schema_version: 1
slug: tra-loi-tin-nhac

evals:
  - id: E1
    criterion: AC-1
    executor: test
    layer: backend-effect
    cmd: config:executors.test.ttn_danh_so
    paths:
      - "apps/agent/agent/lib/tin-nhac.ts"
      - "apps/agent/agent/lib/nhac-ke-hoach.ts"
      - "apps/agent/agent/lib/zalo-config.ts"
      - "apps/agent/test/tra-loi-tin-nhac.integration.spec.ts"
      - "apps/agent/test/support/nhac-gui-gieo.ts"
    expected: |
      chayNhac that (DB that, Zalo gia, Slack gia). Ba o viet truoc:
        o zalo-bon: A co bon viec, moi loai mot (qua-han, sap-han, im, moc).
          Lay daGui tu hang doc lai; tach dong bat dau /^\d+\. / theo thu tu xuat hien.
          Assert: so dong danh so = daGui.length; dong thu n bat dau "n. ";
          lienKetTron(dong n) ket thuc bang ?record=plan:<daGui[n-1].planId>;
          tieu de nhom gan nhat phia tren dong n = TIEU_DE[daGui[n-1].loai];
          dem dong chua "xong 2" = 1.
        o zalo-muoi-hai: muoi hai viec ten dai (guiMuoiHai(true)): text.length <= ZALO.tranKyTu;
          so dong danh so = daGui.length.
        o slack: cung du lieu, kenh Slack: khong dong nao khop /^\d+\. /; khong chuoi "xong 2".
      So o thuc chay = 3, dem trong test.
      Chieu do (pha-thu tren ban sao, S3): dungTin danh so theo thu tu nhom nguoc
      (LOAI_NHAC dao) -> o zalo-bon do voi thong diep ghim "dong n thuoc daGui[n-1]";
      bo dong goi y ra khoi phep tinh tran -> o zalo-muoi-hai do voi "khong vuot tran".
  - id: E2
    criterion: AC-2
    executor: test
    layer: backend-effect
    cmd: config:executors.test.ttn_xong_mot
    paths:
      - "apps/agent/agent/lib/zalo-nhan.ts"
      - "apps/agent/agent/lib/tra-loi-nhac.ts"
      - "apps/agent/agent/lib/zalo-lenh.ts"
      - "packages/db/src/onboarding-buoc.ts"
      - "packages/validation/src/onboarding-activity.ts"
      - "apps/agent/test/tra-loi-tin-nhac.integration.spec.ts"
    expected: |
      Tien de chung: hang nhac dung bang lenLichNhac + chayNhac that (Zalo/Slack gia),
      khong insert AgentTask tay; payload doc bang parseNhacPayload.
      Gieo A noi ZA, tin nhac hom nay gui xong qua Zalo, muc 2 = buoc S chua xong,
      cac muc con lai co buoc T1..Tk. ZA nhan "xong 2" qua nhanWebhook (than khuon that).
      Doc lai tu DB:
        S.completedAt != null;
        Activity PLAN_CHANGE moi (occurredAt >= luc gui) dem = 1, meta toEqual
        {kind:"buoc.xong", stepId:S.id, nhan:S.label, giaoLucXong:S.assigneeId, source:"zalo"},
        createdById = A.id, planId = S.planId;
        completedAt cua T1..Tk bang dung gia tri truoc khi nhan (map toEqual).
      guiToi("ZA") dai 1; text khong chua "\n"; chua cap "2 · " + S.label; chua ten cong ty
      cua ke hoach S.
      Cross-layer: doc dau vet qua thu tuc liet ke hoat dong theo planId cua API (goi service
      API truc tiep nhu support/nhac-gieo.ts goi OnboardingGhi): dung mot muc buoc.xong cua S;
      onboardingActivityMeta.safeParse(meta).success = true.
      Doi chung duong cung fixture: ZA nhan "xong 1" -> buoc muc 1 doi, S khong doi
      (chung to test doc dung so -> buoc, khong hang dung).
      Chieu do (pha-thu, S3): xongTheoTinNhac lay muc theo daGui[n] (lech mot) ->
      do voi thong diep ghim "muc 2 la S"; bo source khoi meta -> do voi "source zalo".
  - id: E3
    criterion: AC-3
    executor: test
    layer: backend-effect
    cmd: config:executors.test.ttn_nhieu_so
    paths:
      - "apps/agent/agent/lib/zalo-lenh.ts"
      - "apps/agent/agent/lib/tra-loi-nhac.ts"
      - "apps/agent/agent/lib/zalo-nhan.ts"
      - "apps/agent/test/tra-loi-tin-nhac.integration.spec.ts"
    expected: |
      Tien de chung: hang nhac dung bang lenLichNhac + chayNhac that (Zalo/Slack gia),
      khong insert AgentTask tay; payload doc bang parseNhacPayload.
      Ma tran viet truoc, nam o, moi o mot nguoi va mot tin nhac rieng (muc 1, muc 3 la buoc
      chua xong): ["Xong 1 3", "xong 1,3", "done 1 3", "  XONG  1 , 3 ", "xong 3 1 3"].
      Moi o: hai buoc co completedAt; Activity buoc.xong moi dem = 2, moi cai source "zalo";
      guiToi dai 1, mot dong, chua cap "1 · <nhan buoc muc 1>" va cap "3 · <nhan buoc muc 3>".
      So o thuc chay = 5, dem trong test.
      Chieu do (pha-thu, S3): docLenh bo nhan dau phay -> o "xong 1,3" do voi thong diep
      ghim "o xong 1,3"; bo gop trung -> o "xong 3 1 3" do voi "dem Activity = 2".
  - id: E4
    criterion: AC-3
    executor: test
    layer: backend-effect
    cmd: config:executors.test.ttn_doc_lenh
    paths:
      - "apps/agent/agent/lib/zalo-lenh.ts"
      - "apps/agent/test/zalo-lenh.spec.ts"
    expected: |
      Bang viet truoc 14 chuoi -> ket qua docLenh toEqual tung o:
        "Xong 1 3", "xong 1,3", "done 1 3", "  XONG  1 , 3 ", "xong 3 1 3" -> {lenh:"xong", so:[1,3]}
        "xong", "Xong  " -> {lenh:"xong-thieu-so"}
        "xong đi", "xong 0", "xong -1", "xong 1.5", "123456", "cảm ơn", "xonG2a" -> null
      So o = 14, dem trong test.
      Chieu do (pha-thu, S3): regex nhan so 0 -> o "xong 0" do voi thong diep ghim ten o;
      doc "123456" thanh lenh -> o "123456" do.
