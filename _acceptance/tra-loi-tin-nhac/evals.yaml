      tap gia tri muc 7 va khac "chờ điều kiện". In tung moc voi dat/khong dat; mot moc
      khong dat -> exit 1 va ghi ten moc.
      Chieu do: chay tren ban merge-base (bien TTN_REF) -> exit 1, ghim ten moc CONTEXT.
