      Moi o nhan "xong 1 k" (hay "xong 1 m"): khong buoc nao doi; Activity moi = 0;
      cau tra loi chua so k (m); o APP_URL co: chua "?record=plan:<P>";
      o APP_URL vang: khong chua "http".
      So o thuc chay = 4.
      Chieu do (pha-thu, S3): coi muc khong co stepId la bo qua va danh dau muc 1 ->
      do voi thong diep ghim "muc khong phai buoc chan ca lenh".
  - id: E7
    criterion: AC-6
    executor: test
    layer: backend-effect
    cmd: config:executors.test.ttn_trang_thai_buoc
    paths:
      - "apps/agent/agent/lib/tra-loi-nhac.ts"
      - "packages/db/src/onboarding-buoc.ts"
      - "apps/agent/test/tra-loi-tin-nhac.integration.spec.ts"
    expected: |
      Tien de chung: hang nhac dung bang lenLichNhac + chayNhac that (Zalo/Slack gia),
      khong insert AgentTask tay; payload doc bang parseNhacPayload.
      Ba o viet truoc, moi o tin nhac rieng voi muc 2, muc 3 la buoc:
        o da-xong: buoc muc 2 danh dau xong truoc bang OnboardingGhi.setStepDone that; nhan
          "xong 2 3" -> buoc muc 3 co completedAt; dem Activity buoc.xong cua buoc muc 2
          bang truoc; tach cau tra loi tai moc cua ZALO.loi cho phan "đã xong từ trước":
          tap so phan truoc toEqual [3], tap so phan sau toEqual [2].
        o da-xoa: xoa buoc muc 2; nhan "xong 2 3" -> buoc muc 3 completedAt null; Activity moi 0;
          cau tra loi chua "2"; ZaloUpdateSeen cua message_id dem = 1.
        o ke-hoach-dong: dong ke hoach cua buoc muc 2; nhu o da-xoa.
      So o thuc chay = 3.
      Chieu do (pha-thu, S3): dao hai danh sach trong cau -> o da-xong do voi thong diep ghim
      "3 vua xong, 2 da xong tu truoc"; o da-xoa bo qua buoc mat va danh dau muc 3 -> do voi thong
      diep ghim "buoc mat chan ca lenh"; lui ca giao dich ke ca ZaloUpdateSeen -> do voi
      "tin khong bi gui lai".
  - id: E8
    criterion: AC-7
    executor: test
    layer: backend-effect
    cmd: config:executors.test.ttn_tin_hom_nay
    paths:
      - "apps/agent/agent/lib/tra-loi-nhac.ts"
      - "packages/db/src/onboarding-nhac.ts"
      - "apps/agent/test/tra-loi-tin-nhac.integration.spec.ts"
    expected: |
      Tien de chung: hang nhac dung bang lenLichNhac + chayNhac that (Zalo/Slack gia),
      khong insert AgentTask tay; payload doc bang parseNhacPayload.
      Sau o viet truoc, dong ho gia bang setSystemTime va lucVN:
        (a) chi hom qua qua Zalo; (b) hom nay qua Slack; (c) hom nay khong-viec;
        (d) hom nay chua chay; (e) gui 08:30 ngay D, nhan 23:59 ngay D;
        (f) gui 08:30 ngay D, nhan 00:01 ngay D+1.
      (a)-(d), (f): khong buoc nao doi; Activity moi 0; cau tra loi chua
        "Hôm nay chưa có tin nhắc qua Zalo" va gio nhac gioNhac().
      (e): buoc muc 1 co completedAt.
      So o thuc chay = 6.
      Chieu do (pha-thu, S3): lay "hom nay" theo UTC -> (e) do voi thong diep ghim
      "23:59 gio VN van la ngay D"; nhan hang nhac moi nhat thay vi hom nay -> (a) do.
  - id: E9
    criterion: AC-8
    executor: test
    layer: backend-effect
    cmd: config:executors.test.ttn_nguoi_nhan
    paths:
      - "apps/agent/agent/lib/tra-loi-nhac.ts"
      - "apps/agent/agent/lib/zalo-nhan.ts"
      - "apps/agent/test/tra-loi-tin-nhac.integration.spec.ts"
    expected: |
      Tien de chung: hang nhac dung bang lenLichNhac + chayNhac that (Zalo/Slack gia),
      khong insert AgentTask tay; payload doc bang parseNhacPayload.
      Bon o viet truoc:
        (a) A noi, khong co tin nhac; B co tin nhac Zalo hom nay. A nhan "xong 1" ->
            buoc muc 1 cua B khong doi; A nhan cau chua "Hôm nay chưa có tin nhắc qua Zalo".
        (b) nguoi noi voi vai okr, co tin nhac Zalo hom nay -> khong buoc doi; Activity 0;
