  - id: E1
    criterion: AC-1
    executor: script
    layer: backend-effect
    cmd: config:executors.script.gdtt_migration
    paths:
      - "packages/db/prisma/migrations/20261006010000_giai_doan_thoa_thuan/**"
      - "packages/db/prisma/schema.prisma"
      - "_acceptance/giai-doan-thoa-thuan/rang/migration-du-lieu.mjs"
    expected: |
      exit 0. Rang tao kho dung-mot-lan crm_<id>_gdtt, chep thu muc migrations TRU migration cua vong
      nay vao thu muc tam, migrate deploy toi 20261004010000, gieo bang SQL: 7 thoa thuan (moi giai doan
      cu mot, trong do UNQUALIFIED_TO_BUY va CLOSED_WON da luu tru, CLOSED_LOST co closedReason va
      closedAt) + 3 dong Activity STAGE_CHANGE meta {from,to}. Roi ap RIENG migration cua vong nay tu tep
      that (khong chep noi dung). Ma tran viet truoc: 7 giai doan x [id, label, kind, position] = 28
      khang dinh, gia tri ky vong rut tu apps/app/lib/deal-stage.ts O MOC TRUOC VONG (git show
      <merge-base>:...), khong viet tay; + 7 thoa thuan x [stage (text) == stage cu, closedAt khong doi,
      closedReason khong doi] = 21; + 3 dong meta so tung byte = 3; + kieu enum "DealStage" khong con
      trong pg_type = 1. Tong 53 (hang KY_MONG trong tep; lech -> ma 2). Xoa kho o finally.
      CHIEU DO (da chay 2026-09-29, ban sao qua GDTT_MIG): (1) ban sao gan CLOSED_LOST vao OPEN -> do voi thong diep
      ghim "CLOSED_LOST: kind OPEN != LOST"; (2) ban sao bo buoc DROP TYPE -> do "enum DealStage con song".

