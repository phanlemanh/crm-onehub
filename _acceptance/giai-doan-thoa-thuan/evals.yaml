  - id: E7
    criterion: AC-6
    executor: test
    layer: backend-effect
    cmd: config:executors.test.gdtt_xoa_chuyen
    paths:
      - "apps/api/src/giai-doan/**"
      - "apps/api/src/deals/**"
      - "apps/api/test/giai-doan.spec.ts"
    expected: |
      Fixture: giai doan LOST nguon S co 3 thoa thuan (1 da luu tru), moi cai co closedAt va closedReason;
      giai doan LOST T chi co 1 thoa thuan da luu tru. So dem: giaiDoan.list tra count S = 3, T = 1.
      Ma tran do viet truoc 4 ca: khong moveTo, moveTo loai OPEN, moveTo = S, moveTo la giai doan da xoa
      -> BAD_REQUEST, va snapshot (stage, closedAt, closedReason, so Activity, archivedAt cua S) cua ca
      3 thoa thuan KHONG doi (so tung truong). Ca xanh: moveTo = LOST dich D -> ca 3 o D; moi thoa thuan
      dung MOT Activity STAGE_CHANGE moi {from S, to D}; stageChangedAt moi hon; closedAt, closedReason
      khong doi; S co archivedAt; su kien deal.stage.changed (doc qua duong phat su kien CRM cua deals) dem = 3, so
      tung cap {dealId, from S, to D}. Ca nguyen tu: tiem loi o thoa thuan thu 3 (qua tham so kiem cua
      service) -> khong thoa thuan nao doi, S chua xoa, su kien dem = 0.
      CHIEU DO (da chay 2026-09-29): (1) ban sao chuyen tung thoa thuan ngoai transaction -> do voi thong diep ghim "nguyen tu:
      2 thoa thuan da doi sau loi"; (2) ban sao dem bo thoa thuan da luu tru -> "S: count 2 != 3"; (3) ban sao chuyen
      bang updateMany -> "su kien 0 != 3".

