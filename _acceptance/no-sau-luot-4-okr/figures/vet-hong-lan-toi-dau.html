<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vết hỏng lan tới đâu</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Geist', system-ui, sans-serif;
      background: #fafafa;
      color: #171717;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1280px; width: 100%; }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <svg viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#575757"/>
        </marker>
      </defs>
      <rect width="100%" height="100%" fill="#fafafa"/>

      <text x="40" y="40" fill="#575757" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CỔNG PHẠM VI · ĐIỂM QUYẾT ĐỊNH 4 · AC-11</text>
      <text x="40" y="68" fill="#171717" font-size="20" font-family="'Lora', serif">Một dòng vết hỏng lan tới đâu: hai cách xử lý</text>

      <g fill="none" stroke="#575757" stroke-width="1">
        <path d="M240 392 H272 Q280 392 280 384 V248 Q280 240 288 240 H318" marker-end="url(#arrow)"/>
        <path d="M240 424 H272 Q280 424 280 432 V568 Q280 576 288 576 H318" marker-end="url(#arrow)"/>

        <path d="M560 224 H592 Q600 224 600 216 V152 Q600 144 608 144 H638" marker-end="url(#arrow)"/>
        <path d="M560 240 H638" marker-end="url(#arrow)"/>
        <path d="M560 256 H592 Q600 256 600 264 V328 Q600 336 608 336 H638" marker-end="url(#arrow)"/>

        <path d="M920 144 H952 Q960 144 960 152 V212 Q960 220 968 220 H998" marker-end="url(#arrow)"/>
        <path d="M920 240 H998" marker-end="url(#arrow)"/>
        <path d="M920 336 H952 Q960 336 960 328 V268 Q960 260 968 260 H998" marker-end="url(#arrow)"/>

        <path d="M560 560 H592 Q600 560 600 552 V488 Q600 480 608 480 H638" marker-end="url(#arrow)"/>
        <path d="M560 576 H638" marker-end="url(#arrow)"/>
        <path d="M560 592 H592 Q600 592 600 600 V664 Q600 672 608 672 H638" marker-end="url(#arrow)"/>
      </g>

      <rect x="40" y="360" width="200" height="96" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1.2"/>
      <text x="140" y="392" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Một dòng vết OKR</text>
      <text x="140" y="408" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">bị sửa tay sai khuôn</text>
      <text x="140" y="428" fill="#575757" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">bên ghi thật chỉ ghi đúng khuôn,</text>
      <text x="140" y="442" fill="#575757" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">nên dòng hỏng chỉ đến từ tay người</text>

      <text x="320" y="196" fill="#171717" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" letter-spacing="0.12em">NHÁNH A · MÁY KHUYÊN · TRONG AC-11</text>
      <rect x="320" y="208" width="240" height="64" rx="6" fill="#ffffff" stroke="#171717" stroke-width="2.4"/>
      <text x="440" y="236" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ném lỗi nêu mã dòng</text>
      <text x="440" y="254" fill="#575757" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">«Vết OKR &lt;mã&gt; không đọc được»</text>

      <rect x="640" y="112" width="280" height="64" rx="6" fill="#ffffff" stroke="#171717" stroke-width="2.4"/>
      <text x="780" y="140" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tin sáng của mọi người dừng</text>
      <text x="780" y="158" fill="#575757" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">lỗi vào nhật ký tác nhân, lặp lại mỗi phút</text>

      <rect x="640" y="208" width="280" height="64" rx="6" fill="#ffffff" stroke="#171717" stroke-width="2.4"/>
      <text x="780" y="236" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Thẻ «Việc của bạn» báo lỗi</text>
      <text x="780" y="254" fill="#575757" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">với mọi người, cho tới khi dòng được sửa</text>

      <rect x="640" y="304" width="280" height="64" rx="6" fill="#ffffff" stroke="#171717" stroke-width="2.4"/>
      <text x="780" y="332" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Phần kế hoạch trên Tổng quan báo lỗi</text>
      <text x="780" y="350" fill="#575757" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">với mọi người, không trả danh sách thiếu mục</text>

      <rect x="1000" y="200" width="240" height="80" rx="6" fill="#ffffff" stroke="#171717" stroke-width="2.4"/>
      <text x="1120" y="232" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ai đó thấy, sửa dòng</text>
      <text x="1120" y="250" fill="#575757" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">lỗi nêu mã nên biết sửa dòng nào;</text>
      <text x="1120" y="264" fill="#575757" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">sửa xong, mọi thứ chạy lại</text>

      <text x="320" y="532" fill="#575757" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.12em">NHÁNH B · PHƯƠNG ÁN HẸP HƠN</text>
      <rect x="320" y="544" width="240" height="64" rx="6" fill="#ffffff" stroke="rgba(23,23,23,0.55)" stroke-width="1"/>
      <text x="440" y="572" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bỏ dòng hỏng</text>
      <text x="440" y="590" fill="#575757" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">ghi lỗi có mã vào nhật ký, rồi đi tiếp</text>

      <rect x="640" y="448" width="280" height="64" rx="6" fill="#ffffff" stroke="rgba(23,23,23,0.55)" stroke-width="1"/>
      <text x="780" y="476" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mọi người khác vẫn nhận tin</text>
      <text x="780" y="494" fill="#575757" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">thẻ và Tổng quan của họ vẫn đủ mục</text>

      <rect x="640" y="544" width="280" height="64" rx="6" fill="#ffffff" stroke="rgba(23,23,23,0.55)" stroke-width="1"/>
      <text x="780" y="572" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Người được giao mất mục «Được giao»</text>
      <text x="780" y="590" fill="#575757" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">trên tin sáng lẫn thẻ «Việc của bạn»</text>

      <rect x="640" y="640" width="280" height="64" rx="6" fill="#ffffff" stroke="rgba(23,23,23,0.55)" stroke-width="1"/>
      <text x="780" y="668" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Không ai thấy trên màn</text>
      <text x="780" y="686" fill="#575757" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">lỗi chỉ nằm trong nhật ký</text>

      <line x1="40" y1="736" x2="1240" y2="736" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>
      <text x="40" y="756" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>
      <rect x="40" y="768" width="28" height="16" rx="4" fill="#ffffff" stroke="#171717" stroke-width="2.4"/>
      <text x="80" y="780" fill="#575757" font-size="9" font-family="'Geist', sans-serif">viền đậm: nhánh đang ghi trong hợp đồng (AC-11)</text>
      <rect x="360" y="768" width="28" height="16" rx="4" fill="#ffffff" stroke="rgba(23,23,23,0.55)" stroke-width="1"/>
      <text x="400" y="780" fill="#575757" font-size="9" font-family="'Geist', sans-serif">viền mảnh: phương án hẹp hơn, để Cổng Phạm vi chọn</text>
      <text x="720" y="780" fill="#575757" font-size="9" font-family="'Geist', sans-serif" font-style="italic">Hai nhánh cùng một màu; khác nhau chỉ ở độ đậm của viền.</text>
    </svg>
  </div>
</body>
</html>
