evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.n4_giua_ngay
    paths: [packages/db/src/okr-nhac.ts, packages/db/src/onboarding-nhac.ts, apps/agent/agent/lib/nhac-ke-hoach.ts, apps/agent/test/nhac-moc-sang.integration.spec.ts]
    expected: "exit 0; gieo một chu kỳ dang-chay, mục tiêu công bố của Y có KR K1 (Y phụ trách), X là thành viên không có việc nào lúc 08:30 ngày D (D = một thứ Ba cố định trong bài, giờ VN). MA TRẬN viết trước 3 sự kiện × 3 nhịp = 9 ô: sự kiện {Y bình luận nhắc tên X lúc 14:00 D (okrComment + okrCommentMention); vết giao K1 cho X lúc 14:00 D (okrTrail sua-kr, after khai kiểu OkrVetSnapshot {ownerUserId: X}, K1.ownerUserId = X); X theo dõi mục tiêu và Y cập nhật tuần K1 lúc 14:00 D} × nhịp lenLichNhac(now) {14:01 D, 17:00 D, 23:59 D} → mỗi ô: đếm agentTask kind nhac-ke-hoach subject user:X:<D> = 0 và viecCanNhac(db,{now, userId:X, cuaSo:'buoi-sang'}) không có mục okr-nhac-ten/okr-duoc-giao/okr-theo-doi. Đối chứng dương trên cùng dữ liệu: viecCanNhac(...cuaSo:'truc-tiep') lúc 14:01 D có đúng mục đó (bộ sinh thấy sự kiện, chỉ cửa sổ nhắc loại nó). CHIỀU ĐỎ: bản gương tmpdir của okr-nhac.ts dùng lại cửa sổ (now − 24h, now] → ô (nhắc tên, 14:01 D) tạo một hàng, bài đỏ với thông điệp ghim «tin-giua-ngay: <loai> luc <gio>»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

