    expected: "exit 0; cùng fixture E1, X có ZaloLink (hoặc Slack khớp), fetch giả ghi mọi tin. Với từng sự kiện trong 3 loại: lenLichNhac(08:31 D+1) → đúng 1 hàng user:X:<D+1>, payload.muc chứa đúng một mục của loại đó với đúng mã (commentId / objectiveId+keyResultId / objectiveId); setSystemTime(08:32 D+1) rồi chayNhac → fetch giả nhận đúng 1 tin, tin có đúng 1 dòng của mục nằm dưới đúng tiêu đề nhóm (Nhắc tên / Được giao / Đang theo dõi — so với TIEU_DE). Rồi lenLichNhac(08:31 D+2) + chayNhac → không tin nào của X chứa mục đó (hoặc không hàng). Bảng 3 loại × [hàng D+1, mục D+1, tin D+1, dòng dưới tiêu đề, vắng D+2] = 15 khẳng định viết trước. CHIỀU ĐỎ: bản gương dùng cửa sổ (now − 24h, now] với lịch chạy thật 14:01 D rồi 08:31 D+1 → X nhận 2 tin cùng mục, bài đỏ ghim «gui-lai-sang-sau: <loai>»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

