schema_version: 1
slug: okr-soat-anh-luot-3

evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.osa_do_man
    paths:
      - "apps/app/app/(app)/[slug]/okr/hop-thoai-nhap.tsx"
      - "packages/ui/src/components/dialog.tsx"
      - "packages/ui/src/components/simple-table.tsx"
      - "packages/ui/src/components/table.tsx"
      - "_acceptance/okr-soat-anh-luot-3/rang/do-man.mjs"
    expected: |
      Ban do tu chan cay (canhCay qua APP_URL), gieo nguoi quan tri thu + nam/quy hien tai + quy
      "Lượt đo <ma>", mo /okr/theo-don-vi?donOkr=goc o 1440x900, bam «Nhập từ bảng tính», dan lo
      5 dong, bam «Xem trước». MA TRAN VIET TRUOC (mang MA_TRAN trong do-man.mjs, moi dong mot ma):
      9 ma "nhap-1440-cot-<i>" (moi tieu de cot mot dong: "DUNG nhap-1440-cot-<i>: «<chu>» trai
      <l> >= <vl>, phai <r> <= <vr>, chu khong cat" — l/r la rect cua <th>, vl/vr la rect cua vo
      bang khi scrollLeft = 0, lech cho phep 1px; chu khong cat = scrollWidth <= clientWidth cua
      <th>), 1 ma "nhap-1440-vo-khong-tran" (scrollWidth <= clientWidth + 1 cua vo bang), 1 ma
      "nhap-1440-email-dong-5" (o email cua hang dong 5 nam tron trong vo, textContent bang dia
      chi da dan, scrollWidth <= clientWidth va text-overflow khac ellipsis), 1 ma
      "nhap-1440-cot-dai-xuong-dong" (dong 1 cua lo co ten muc tieu va ten KR moi thu >= 120 ky
      tu, khai trong LO cua do-man.mjs: chieu cao o Muc tieu > 1,5 lan line-height va vo van
      khong tran). O 390x844 cung lo: "nhap-390-hop-trong-man" (rect cua [data-slot=
      dialog-content] trong viewport, documentElement.scrollWidth <= innerWidth) va
      "nhap-390-vo-cuon" (vo bang scrollWidth > clientWidth — bang cuon trong vo; doi chung
      duong cho ca 1440: o 1440 thi scrollWidth <= clientWidth + 1). Chuoi 9 tieu de doc tu
      okrMessages("vi").nhap.cot, khong viet tay.
      CHIEU DO (giao dien chua sua, chay o S3 truoc khi sua): "SAI nhap-1440-cot-7..9" (Đơn vị
      đo / Địa chỉ email / Kết quả vuot mep phai vo), "SAI nhap-1440-vo-khong-tran", "SAI
      nhap-1440-cot-dai-xuong-dong" (o nowrap cao mot dong), ma 1.
      Dong KET LUAN cuoi "<n> DUNG, <m> SAI — ma thoat <c>"; ma trong MA_TRAN khong phat dong
      nao -> "SAI thieu <ma>", ma 1.

