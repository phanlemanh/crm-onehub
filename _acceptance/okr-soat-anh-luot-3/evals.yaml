      chu «Dòng»), khong viet tay; phai la {4,5} (dong "DUNG nhap-hong-danh-sach: [4,5]" — doi
      chung: lo co dung hai dong hong). Moi hang tbody mot dong "DUNG nhap-hong-hang-<n>":
      hang co n trong danh sach thi co [data-slot=status-indicator][data-tone=error] voi chu
      «Hỏng» nam tron trong vo bang, va ::before cua o dau co background-color bang mau
      --destructive (doc getComputedStyle, so voi mau cua mot phan tu mau .bg-destructive), do
      rong >= 2px va opacity 1 khi chuot KHONG nam tren hang (chuot dua ra goc 0,0 truoc khi doc); hang con lai co status-indicator data-tone=success chu «Hợp lệ», khong co
      tone=error, va ::before cua o dau khong mang mau --destructive. 5 hang = 5 ma. Them
      "nhap-hong-danh-sach-con" — danh sach cau loi phia tren van con 2 cau.
      CHIEU DO (giao dien chua sua): "SAI nhap-hong-hang-4/5" (khong co status-indicator, khong
      vach), ma 1.

