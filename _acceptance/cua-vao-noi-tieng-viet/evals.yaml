schema_version: 1
feature_slug: cua-vao-noi-tieng-viet
evals:

  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.cua_vao_dang_nhap
    expected: >-
      exit 0. Dung /sign-in hai lan tren may chu that — lang=vi va lang=en — roi doc
      chu NGUOI DOC THAY tren man, khong doc ma nguon.
      KHONG tru theo "giong het nhau". Voi TUNG o trong SAU o ghim — hai nhan
      thay-anh cua lien ket logo, nhan nhom, tieu de lon, tieu de man, mo ta man —
      khang dinh QUAN HE ba ve: chuoi luot vi KHAC chuoi luot en, VA chuoi luot vi
      mang dau tieng Viet, VA chuoi luot en dung ban tieng Anh da ghim. So o do
      duoc phai BANG sau.
      Mot chuoi trung nhau giua hai luot ma khong nam trong bang dong muoi ba gia
      tri cua AC-6 lam chan DO va in NGUYEN VAN chuoi do.
      Chieu do: go mot khoa trong kho chuoi ve tieng Anh tren mot ban sao thi chan
      do va GOI TEN dung khoa do. Cap hai chieu chay tren cung fixture.
    paths:
      - "apps/app/app/(landing)/sign-in/**"
      - "apps/app/components/auth-shell.tsx"
      - "apps/app/lib/messages/auth.ts"
    evidence_required: [run_id, exit_code, verifier, verified_at, output, screenshot]

  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.cua_vao_khai_bao
    expected: >-
      exit 0. Dung /onboarding va /onboarding/research hai lan, hai thu tieng.
      KHONG tru theo "giong het nhau". Voi TUNG o trong CHIN o ghim — ba nhan
      truong, hai dong mo ta truong, nhan o khoa, chu goi y trong o khoa, chu tren
      nut gui, chu cua lien ket dang ky — khang dinh QUAN HE ba ve nhu E1: vi KHAC
      en, VA vi mang dau tieng Viet, VA en dung ban da ghim. So o do duoc BANG chin.
      Trung nhau ngoai bang dong cua AC-6 la do, in nguyen van chuoi do.
      Chieu do: go mot khoa ve tieng Anh thi chan do va goi ten khoa do.
    paths:
      - "apps/app/app/(landing)/onboarding/**"
      - "apps/app/lib/messages/auth.ts"
    evidence_required: [run_id, exit_code, verifier, verified_at, output, screenshot]

  - id: E3
    criterion: AC-3
    executor: script
    cmd: config:executors.script.cua_vao_khong_co_duong
    expected: >-
      exit 0. Chan phai MO DUOC nhanh "chua co cach nao de vao" — dung man do that
      bang cach cho sso.signInOptions tra ve khong nha cung cap nao, khong suy tu
      ma. Trang thai nay chi hien khi chua cau hinh OAuth nao, va do la lop loi
      vong ③a tra gia: chan do chi thay be mat no tu mo.
      Kiem: tieu de, mo ta va doan huong dan hien tieng Viet o luot vi; VA bon ten
      bien moi truong GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, MICROSOFT_CLIENT_ID,
      MICROSOFT_CLIENT_SECRET giu nguyen chu hoa goc, xuat hien du bon.
      Khong dung duoc nhanh nay thi chan TU CHOI DO: thoat ma 2 va goi ten nhanh
      thieu. Tap quan sat rong khong bao gio la dat.
      Chieu do: dich mot ten bien thanh chu thuong thi chan do va goi ten bien do.
    paths:
      - "apps/app/app/(landing)/sign-in/page.tsx"
      - "apps/app/lib/messages/auth.ts"
    evidence_required: [run_id, exit_code, verifier, verified_at, output, screenshot]

  - id: E4
    criterion: AC-4
    executor: script
    cmd: config:executors.script.cua_vao_trang_thai_tam
    expected: >-
      exit 0. Chan phai MO DUOC Suspense fallback cua /sign-in — trang thai chi
      hien thoang qua trong luc doc cau hinh — bang cach lam cham luot doc cau
      hinh, roi doc tieu de va mo ta du phong o ca hai thu tieng.
      Khong bat duoc trang thai do thi thoat ma 2 va goi ten no, KHONG bao dat.
      Chieu do: go tieu de du phong ve tieng Anh thi chan do.
    paths:
      - "apps/app/app/(landing)/sign-in/page.tsx"
      - "apps/app/lib/messages/auth.ts"
    evidence_required: [run_id, exit_code, verifier, verified_at, output, screenshot]

  - id: E5
    criterion: AC-5
    executor: script
    cmd: config:executors.script.cua_vao_dang_gui
    expected: >-
      exit 0. Voi ca BA nut gui — dang nhap, khai bao cong ty, khoa nghien cuu —
      chan lam luot gui treo lai, roi doc chu tren nut o trang thai dang gui va
      kiem nut da bi khoa. So nut do duoc phai BANG 3; thieu mot cai la do va goi
      ten nut thieu.
      Chieu do: go chu trang thai dang gui ve tieng Anh thi chan do.
    paths:
      - "apps/app/app/(landing)/**"
      - "apps/app/lib/messages/auth.ts"
    evidence_required: [run_id, exit_code, verifier, verified_at, output, screenshot]

  - id: E6
    criterion: AC-6
    executor: script
    cmd: config:executors.script.cua_vao_khong_dich
    expected: >-
      exit 0. Bang dong MUOI BA gia tri cua AC-6 duoc viet truoc trong chinh chan do,
      moi dong ghi gia tri va noi no hien ra. Fixture GIEO SAN mot nha cung cap SSO
      ten khong phai ASCII va mot workspace co ten nguoi go, de hai nhom du lieu
      nguoi nhap co dai dien that.
      Doc xong phai khang dinh so phan tu quan sat duoc BANG muoi ba. Thieu mot dong
      thi thoat ma 2 va GOI TEN dong thieu — dan so THIEU bi chan y het dan so RONG,
      khong bao gio la dat.
      Voi tung gia tri: hien NGUYEN VAN o luot vi giong luot en, VA phan tu chua no
      tu khai translate="no".
      Chieu do: bo dau translate="no" o mot cho thi chan do va goi ten cho do; bo
      mot dong khoi fixture thi chan thoat ma 2 va goi ten dong do.
    paths:
      - "apps/app/app/(landing)/**"
      - "apps/app/components/auth-shell.tsx"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-7
    executor: script
    cmd: config:executors.script.cua_vao_ten_sso
    expected: >-
      exit 0. Gieo mot nha cung cap SSO co ten chua ky tu khong phai ASCII, roi
      dung /sign-in o ca hai thu tieng. Chu tren nut phai chua ten do NGUYEN VAN
      va phan dong tu doi theo tieng nguoi doc.
      Chieu do: doi cho goi thanh mot cau tieng Anh duc san trong kho chuoi thi
      chan do — dong tu khong con doi theo tieng.
    paths:
      - "apps/app/app/(landing)/sign-in/sso-sign-in.tsx"
      - "apps/app/lib/messages/auth.ts"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E8
    criterion: AC-8
    executor: script
    cmd: config:executors.script.cua_vao_tieu_de_tai_lieu
    expected: >-
      exit 0. Voi ba duong /sign-in, /onboarding, /onboarding/research: doc tieu de
      tai lieu tu luot may chu tra ve o ca hai thu tieng. Ba tieu de o luot vi phai
      KHAC ba tieu de o luot en, va deu mang dau tieng Viet.
      Day la lop nam NGOAI DOM cua trang — mot chan chi doc than trang se mu voi no.
      Chieu do: tra mot trang ve metadata tinh thi chan do va goi ten duong do.
    paths:
      - "apps/app/app/(landing)/**"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E9
    criterion: AC-9
    executor: test
    cmd: config:executors.test.cua_vao_chon_tieng
    expected: >-
      exit 0. Bai kiem cua resolveLocale dua ra dung NAM khang dinh, mot cho moi o cua
      truc C, va so khang dinh BANG nam: (1) cookie vi + Accept-Language en ra "vi";
      (2) cookie en + Accept-Language vi ra "en"; (3) khong cookie + Accept-Language
      vi ra "vi"; (4) khong cookie + Accept-Language en ra "en"; (5) khong cookie +
      khong Accept-Language ra "vi". Cong mot khang dinh DEFAULT_LOCALE bang "vi".
      Day la lop HAM THUAN. Ve may chu that do E18 — mot minh E9 khong du cho AC-9.
      Chieu do: doi DEFAULT_LOCALE ve "en" thi bai kiem do o dung khang dinh thu nam,
      voi thong diep ghim ten hang.
    paths:
      - "packages/ui/src/lib/locale.ts"
      - "apps/app/lib/locale/**"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E10
    criterion: AC-10
    executor: script
    cmd: config:executors.script.cua_vao_be_rong
    expected: >-
      exit 0. Voi ba man o tieng Viet, tren ba kho 768, 1024 va 1280: do BE RONG
      CHU THAT cua tung chuoi nguoi-doc-thay va so voi be rong o chua no. Khong o
      nao co chu vuot ra ngoai.
      Rieng tieu de lon trong o max-w-[14ch] phai do bang be rong dung that,
      KHONG suy tu so ky tu — chu bi cat bang CSS khong nam trong DOM.
      So o do duoc phai bang so o khai truoc; thieu o nao thi thoat ma 2 goi ten o do.
      Chieu do: thay mot tieu de bang mot chuoi dai gap doi thi chan do va goi ten
      o tran ra.
    paths:
      - "apps/app/app/(landing)/**"
      - "apps/app/components/auth-shell.tsx"
      - "apps/app/lib/messages/auth.ts"
    evidence_required: [run_id, exit_code, verifier, verified_at, output, screenshot]

  - id: E11
    criterion: AC-11
    executor: script
    cmd: config:executors.script.cua_vao_chu_cung_jsx
    expected: >-
      exit 0. DAN SO SINH TU DIA: moi file .tsx duoi app/(landing) cong khung dung
      chung, tru mot ban khai loai-tru co ly do tung dong. KHONG duoc viet tay danh
      sach — hai vong dau sot cung mot man vi ban khai tay thieu dung hai file.
      Chan khang dinh so file bo quet THUC SU doc BANG so file lat sinh ra.
      Ket qua = 0 chuoi nguoi-doc-thay khoa cung, ngoai ban khai mien tru.
      Mot dong mien tru khong con doi tuong that, hoac mot dong loai-tru tro toi
      file khong con ton tai, deu lam chan DO/TU CHOI DO.
      Chieu do da chung minh: them mot man .tsx moi duoi (landing) ma KHONG sua ban
      khai thi chan do va goi ten file do; tro loai-tru toi mot duong khong co tren
      dia thi chan thoat ma 2.
    paths:
      - "apps/app/app/(landing)/**"
      - "apps/app/components/auth-shell.tsx"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E12
    criterion: AC-12
    executor: test
    cmd: config:executors.test.cua_vao_kho_chuoi
    expected: >-
      exit 0. Bai kiem doc apps/app/lib/messages/auth.ts va khang dinh: no dung
      khuon satisfies giong nam kho chuoi anh em; moi khoa co o ca hai thu tieng;
      va moi gia tri tieng Viet mang it nhat mot ky tu co dau tieng Viet, tru cac
      khoa nam trong ban khai mien co ly do ghi tung dong.
      Mot dong mien tru khong con doi tuong that cung lam bai kiem do.
      Chieu do: xoa mot khoa khoi phia tieng Viet thi bien dich do; dich mot khoa
      thanh mot chuoi tieng Anh KHAC thi bai kiem dau tieng Viet do va goi ten khoa.
    paths:
      - "apps/app/lib/messages/auth.ts"
      - "apps/app/test/**"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E13
    criterion: AC-13
    executor: script
    cmd: config:executors.script.cua_vao_chan_trang
    expected: >-
      exit 0. Dung ca ba man o ca hai thu tieng va khang dinh chuoi "Comp AI" cung
      lien ket trycomp.ai KHONG con tren man o bat ky man nao. Cong them mot khang
      dinh rang file LICENSE o goc kho khong doi so voi ban da ghim.
      Chieu do: dat lai dong chan do vao khung chung thi chan do va goi ten man
      chua no.
    paths:
      - "apps/app/components/auth-shell.tsx"
      - "LICENSE"
    evidence_required: [run_id, exit_code, verifier, verified_at, output, screenshot]

  - id: E14
    criterion: AC-14
    executor: judgment
    question: >-
      Ba cau, cham CHU chu khong cham ma. (1) Mot nhan vien OneHub moi, mo CRM
      lan dau, co doc troi ven cua vao bang tieng me de khong — cho nao con lam
      ho khung lai? (2) Cau bao loi du phong cua client co noi ro NGUOI DUNG LAM
      GI TIEP khong, hay chi noi cai gi hong? (3) Ba nhan truong cua man khai bao
      — ten cong ty, dia chi workspace, website — co noi dung LOAI THU nam trong
      o duoi no khong?
      Gioi han da khai KHONG phai cho de truot cau (1): cau loi do may chu duc san
      van tieng Anh, va do la ranh gioi da chot o Cong 1, ghi trong Known limits.
      Hoi dong phai NHIN THAY gioi han do chu khong duoc coi nhu no khong ton tai.
    inputs:
      - evidence/E14-ba-man-vi.png
      - evidence/E14-ba-man-en.png
      - evidence/E14-chu-hien-ra.txt
      - evidence/E14-chu-loi.txt
      - contract.md
    paths:
      - "_acceptance/cua-vao-noi-tieng-viet/evidence/E14-ba-man-vi.png"
      - "_acceptance/cua-vao-noi-tieng-viet/evidence/E14-ba-man-en.png"
      - "_acceptance/cua-vao-noi-tieng-viet/evidence/E14-chu-hien-ra.txt"
      - "_acceptance/cua-vao-noi-tieng-viet/evidence/E14-chu-loi.txt"
      - "_acceptance/cua-vao-noi-tieng-viet/contract.md"
    expected: >-
      TRUOT CUNG khi thieu bat ky dau vao nao — thieu mot dau vao thi E14 la
      BLOCKED chu khong phai UNCERTAIN. `E14-chu-hien-ra.txt` do E1 va E2 xuat;
      hoi dong cham cau (3) tren CHU THAT HIEN RA trong file do, khong doan tu
      anh chup.
    evidence_required: [judged_by, verdict, rationale]

  - id: E16
    criterion: AC-10
    executor: ui-check
    cmd: config:executors.design.gate
    steps:
      - "Dung /sign-in o tieng Viet tren may chu dang chay, chup evidence/E16-sign-in-vi.png"
      - "Dung /sign-in o tieng Anh, chup evidence/E16-sign-in-en.png"
      - "Chay san thiet ke tren hai anh do va doc muc P0"
      - "Hai man khai bao KHONG dung duoc trong moi truong nay (xem Known limits) — ghi ro la chua do, khong bao dat"
    expected: >-
      exit 0. San thiet ke cua ba man o tieng Viet: khong vi pham muc P0 nao.
      Chan nay do SAN, khong thay E10 — E10 do be rong chu that, chan nay do cac
      luat con lai cua bo chuan giao dien.
      Kho chua wire `executors.design.static` nen KHONG co static eval per-surface;
      dieu do phai hien trong goi Cong 2.
    paths:
      - "apps/app/app/(landing)/**"
      - "apps/app/components/auth-shell.tsx"
    evidence_required: [run_id, exit_code, verifier, verified_at, output, screenshot]

  - id: E17
    criterion: AC-14
    executor: script
    cmd: config:executors.script.cua_vao_loi_mang
    expected: >-
      exit 0. EP DUT MANG THAT o luot bam nut dang nhap (chan luot goi ra nha cung
      cap), roi doc CHU TRONG THONG BAO NOI hien ra, o ca hai thu tieng.
      Khang dinh quan he: chuoi luot vi KHAC chuoi luot en, VA chuoi luot vi mang
      dau tieng Viet. Day la cau DU PHONG do client tu dung — khong phai cau may chu
      duc san, thu do nam o Known limits.
      Khong noi duoc thong bao, hoac khong bat duoc chu trong no, thi thoat ma 2 va
      goi ten trang thai thieu. Tap quan sat rong khong bao gio la dat.
      Chan nay xuat chu bat duoc ra evidence/E14-chu-loi.txt lam dau vao bat buoc
      cua E14 — thieu no thi E14 la BLOCKED.
      Chieu do: go cau du phong ve tieng Anh thi chan do va in nguyen van cau do.
    paths:
      - "apps/app/app/(landing)/sign-in/**"
      - "apps/app/lib/messages/auth.ts"
    evidence_required: [run_id, exit_code, verifier, verified_at, output, screenshot]

  - id: E18
    criterion: AC-9
    executor: script
    cmd: config:executors.script.cua_vao_chon_tieng_may_chu
    expected: >-
      exit 0. Ba luot yeu cau THAT toi /sign-in qua may chu dang chay, khong goi ham
      thuan: (1) khong cookie va khong Accept-Language; (2) khong cookie va
      Accept-Language vi; (3) cookie lang=vi va Accept-Language en.
      Moi luot khang dinh HAI ve tren chinh luot tra ve: thuoc tinh lang cua the html
      dung thu tieng mong doi, VA tieu de man hien ra dung thu tieng do. Mot ve dung
      mot ve sai van la do.
      Luot (3) la o ma E9 mot minh khong cham toi: no chung minh cookie THANG
      Accept-Language tren duong that.
      Chieu do: doi thu tu uu tien trong resolveLocale cho Accept-Language thang
      cookie thi luot (3) do va goi ten o do.
    paths:
      - "packages/ui/src/lib/locale.ts"
      - "apps/app/lib/locale/**"
      - "apps/app/app/layout.tsx"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E15
    criterion: AC-11
    executor: script
    cmd: config:executors.script.cua_vao_khai_sinh
    expected: >-
      exit 0. DANH SACH DONG cac muc khai sinh duoc viet truoc ngay trong file nay,
      N = 15: cua-vao.mjs voi muoi hai chan (dang-nhap, khai-bao, khong-co-duong,
      trang-thai-tam, dang-gui, khong-dich, ten-sso, tieu-de-tai-lieu, be-rong,
      chan-trang, loi-mang, chon-tieng-may-chu), cong chu-cung-jsx.mjs, cong hai bai
      kiem locale-resolve.spec.ts va auth-messages.spec.ts.
      So khai sinh chay CA HAI CHIEU cua TUNG muc trong danh sach do ngay trong luot
      chay: chieu lanh phai im, chieu bi pha phai do voi dung thong diep da ghim.
      Bang ket qua phai co dung N dong VA ten tung dong khop danh sach. KHONG duoc
      suy dan so tu viec quet thu muc rang/ — dan so suy tu chinh thu muc no sap doc
      la mot dang thuc tu thoa.
      Thieu mot muc, hoac ha tang lam mot muc khong chay duoc, thi thoat ma 2 va goi
      ten muc do; khong bao gio la mot luot dat.
    paths:
      - "_acceptance/cua-vao-noi-tieng-viet/rang/**"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
