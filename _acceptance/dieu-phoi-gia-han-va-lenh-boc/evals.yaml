    criterion: AC-1
    executor: script
    cmd: config:executors.script.dph_gh_dot_bien
    expected: "exit 0 khi bộ đột biến (gốc kho suy từ vị trí script) chép scripts/dieu-phoi/ ra thư mục tạm ngoài kho; với mỗi đột biến áp một lần thay chuỗi đích danh (mốc vắng → exit 2 'MOC VANG <mã>'), chạy gia-han-va-lenh-boc.test.mjs bằng node --test, in mọi ca đỏ thật '<mã> DO: <ca>', và đòi ca ghim nằm trong tập đỏ: G1 (đọc tra-loi bằng docJson trần) làm đỏ 'tra-loi hỏng không làm đứng nhịp: thu hồi, cấp, ghi bảng; dời tệp và báo một lần'; G2 (báo nhưng không dời tệp) làm đỏ 'sau khi dời tệp hỏng: không báo lại; trong trần máy duyệt lại và gia hạn một lần; vượt trần chờ giám sát không lặp'; G3 (bỏ kiểm object) làm đỏ 'tra-loi hợp lệ mà không phải object bị coi là hỏng'; G4 (coi mọi tra-loi là hỏng) làm đỏ 'tra-loi lành của giám sát vẫn gia hạn như cũ, không có tra-loi-hong'; G5 (giu-nhip bỏ tách biến) và G7 (tách nhưng không truyền biến) làm đỏ 'giu-nhip: tiền tố biến tới tiến trình con, giữ môi trường cũ, mã thoát đúng, vẫn chạm nhịp; không tiền tố như cũ; chỉ gán biến thoát 2' và 'dòng gợi ý của hook cho lệnh nền có tiền tố biến chạy được bằng sh -c và được hook cho qua'; G6 (tách mọi từ có dấu =) làm đỏ ca giu-nhip. Ca ghim không đỏ → 'SONG <mã>' và exit 1. Đối chứng dương: bản chép không đột biến chạy cùng tệp test thì xanh hết (đỏ → exit 2 'NEN DO')."
