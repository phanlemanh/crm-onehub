<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quyền tạo của quản trị · ba lối</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--paper:#fafafa;--ink:#171717;--muted:#575757;--soft:#666666;--rule:rgba(23,23,23,.12);--accent:#006B4F;--sans:'Geist',system-ui,sans-serif;--serif:'Lora',serif;--mono:'Geist Mono',ui-monospace,monospace}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem;background:var(--paper);color:var(--ink);font-family:var(--sans)}
    .frame{width:100%;max-width:1100px}
    .eyebrow{margin-bottom:.5rem;color:var(--muted);font:500 .66rem/1.4 var(--mono);letter-spacing:.18em;text-transform:uppercase}
    h1{margin-bottom:.35rem;font:400 clamp(1.5rem,2.4vw + .75rem,2rem)/1.3 var(--serif);letter-spacing:-.01em}
    .subtitle{margin-bottom:1.5rem;color:var(--muted);font-size:.9rem;line-height:1.6}
    .diagram{overflow-x:auto}
    svg{display:block;width:100%;min-width:900px}
    svg .grid{stroke:rgba(23,23,23,.12);stroke-width:.8}
    svg .col-head{font-family:'Geist Mono',monospace;font-size:9px;font-weight:500;fill:#575757;letter-spacing:.18em}
    svg .col-head.focal{fill:#006B4F;font-weight:600}
    svg .col-name{font-family:'Geist',sans-serif;font-size:12px;font-weight:600;fill:#171717}
    svg .corner-sub{font-family:'Geist',sans-serif;font-size:10px;fill:#575757}
    svg .row-label{font-family:'Geist',sans-serif;font-size:12px;font-weight:500;fill:#171717}
    svg .row-sub{font-family:'Geist Mono',monospace;font-size:9px;fill:#575757}
    svg .yes{fill:none;stroke:#171717;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
    svg .no{fill:none;stroke:#575757;stroke-width:1.4;stroke-linecap:round}
    svg .cell-sub{font-family:'Geist',sans-serif;font-size:10px;fill:#575757}
    svg .touch{font-family:'Geist',sans-serif;font-size:12px;font-weight:600;fill:#171717}
    svg .no-touch{font-family:'Geist',sans-serif;font-size:12px;font-weight:400;fill:#575757}
    svg .band{fill:rgba(0,107,79,.08);stroke:#006B4F;stroke-width:1.4}
    svg .note-focal{font-family:'Lora',serif;font-style:italic;font-size:14px;fill:#006B4F}
    svg .note{font-family:'Geist',sans-serif;font-size:12px;fill:#171717}
    svg .legend-head{font-family:'Geist Mono',monospace;font-size:9px;fill:#575757;letter-spacing:.14em}
    svg .legend-text{font-family:'Geist',sans-serif;font-size:10px;fill:#575757}
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Bảng so sánh · okr-to-chuc-va · R1m-7 · AC-7 · AC-8</p>
    <h1>Quản trị không là trưởng tạo được gì, theo từng lối</h1>
    <p class="subtitle">Mỗi ô: quản trị không là trưởng đơn vị làm được (✓) hay không (✗). Hàng cuối: lối đó có chạm ma trận quyền mà các hồ sơ đã ký đang đo không.</p>
    <div class="diagram">
      <svg viewBox="0 0 1000 544" role="img" aria-labelledby="qt-title qt-desc" xmlns="http://www.w3.org/2000/svg">
        <title id="qt-title">Ba lối A+, A, B cho quyền tạo mục tiêu của quản trị</title>
        <desc id="qt-desc">Lối A+ được khuyên: quản trị tạo lẻ được mục tiêu và KR như khi nhập cả bộ, không sửa xoá được, không chạm ma trận quyền đã ký. Lối A tạo được mục tiêu nhưng không thêm được KR. Lối B làm được mọi thứ nhưng mở quyền sửa mọi đơn vị và chạm ma trận quyền đã ký.</desc>
        <rect width="1000" height="544" fill="#fafafa"/>

        <rect class="band" x="352" y="36" width="208" height="432" rx="8"/>

        <line class="grid" x1="352" y1="40" x2="352" y2="464"/>
        <line class="grid" x1="560" y1="40" x2="560" y2="464"/>
        <line class="grid" x1="768" y1="40" x2="768" y2="464"/>

        <line class="grid" x1="32" y1="104" x2="976" y2="104"/>
        <line class="grid" x1="32" y1="160" x2="976" y2="160"/>
        <line class="grid" x1="32" y1="216" x2="976" y2="216"/>
        <line class="grid" x1="32" y1="272" x2="976" y2="272"/>
        <line class="grid" x1="32" y1="328" x2="976" y2="328"/>
        <line class="grid" x1="32" y1="384" x2="976" y2="384"/>
        <line class="grid" x1="32" y1="464" x2="976" y2="464"/>

        <text class="col-head" x="32" y="64">HÀNH ĐỘNG</text>
        <text class="corner-sub" x="32" y="88">ô = quản trị không là trưởng</text>

        <text class="col-head focal" x="456" y="64" text-anchor="middle">LỐI A+ · KHUYÊN</text>
        <text class="col-name" x="456" y="88" text-anchor="middle">tạo lẻ theo luật nhập</text>
        <text class="col-head" x="664" y="64" text-anchor="middle">LỐI A</text>
        <text class="col-name" x="664" y="88" text-anchor="middle">chỉ mục tiêu</text>
        <text class="col-head" x="872" y="64" text-anchor="middle">LỐI B</text>
        <text class="col-name" x="872" y="88" text-anchor="middle">quản trị sửa mọi đơn vị</text>

        <text class="row-label" x="32" y="128">Nhập cả bộ</text>
        <text class="row-sub" x="32" y="144">nhapDuoc</text>
        <path class="yes" d="M 450 132 L 454 136 L 462 128"/>
        <path class="yes" d="M 658 132 L 662 136 L 670 128"/>
        <path class="yes" d="M 866 132 L 870 136 L 878 128"/>

        <text class="row-label" x="32" y="184">Tạo một mục tiêu</text>
        <text class="row-sub" x="32" y="200">createObjective</text>
        <path class="yes" d="M 450 188 L 454 192 L 462 184"/>
        <path class="yes" d="M 658 188 L 662 192 L 670 184"/>
        <path class="yes" d="M 866 188 L 870 192 L 878 184"/>

        <text class="row-label" x="32" y="240">Thêm KR vào mục tiêu vừa tạo</text>
        <text class="row-sub" x="32" y="256">createKeyResult</text>
        <path class="yes" d="M 450 238 L 454 242 L 462 234"/>
        <path class="no" d="M 660 232 L 668 240 M 668 232 L 660 240"/>
        <text class="cell-sub" x="664" y="260" text-anchor="middle">mục tiêu rỗng</text>
        <path class="yes" d="M 866 238 L 870 242 L 878 234"/>

        <text class="row-label" x="32" y="296">Sửa / xoá mục tiêu, KR</text>
        <text class="row-sub" x="32" y="312">suaDuocDonVi</text>
        <path class="no" d="M 452 288 L 460 296 M 460 288 L 452 296"/>
        <text class="cell-sub" x="456" y="316" text-anchor="middle">giữ luật sửa cũ</text>
        <path class="no" d="M 660 288 L 668 296 M 668 288 L 660 296"/>
        <text class="cell-sub" x="664" y="316" text-anchor="middle">giữ luật sửa cũ</text>
        <path class="yes" d="M 866 294 L 870 298 L 878 290"/>
        <text class="cell-sub" x="872" y="316" text-anchor="middle">ở mọi đơn vị</text>

        <text class="row-label" x="32" y="352">Ma trận quyền mà hồ sơ đã ký đang đo</text>
        <text class="row-sub" x="32" y="368">vai-chi-okr · muc-tieu-va-kr</text>
        <text class="no-touch" x="456" y="360" text-anchor="middle">không chạm</text>
        <text class="no-touch" x="664" y="360" text-anchor="middle">không chạm</text>
        <text class="touch" x="872" y="352" text-anchor="middle">chạm</text>
        <text class="cell-sub" x="872" y="372" text-anchor="middle">nhiều thước đã ký</text>

        <text class="row-label" x="32" y="412">Hệ quả</text>
        <text class="note-focal" x="456" y="416" text-anchor="middle">«tạo lẻ được đúng thứ</text>
        <text class="note-focal" x="456" y="436" text-anchor="middle">nhập cả bộ tạo được»</text>
        <text class="note" x="664" y="412" text-anchor="middle">vấp ngưỡng SỐNG:</text>
        <text class="note" x="664" y="428" text-anchor="middle">mục tiêu mới không</text>
        <text class="note" x="664" y="444" text-anchor="middle">thêm được KR</text>
        <text class="note" x="872" y="412" text-anchor="middle">mở quyền sửa</text>
        <text class="note" x="872" y="428" text-anchor="middle">mọi đơn vị</text>

        <line class="grid" x1="32" y1="492" x2="976" y2="492"/>
        <text class="legend-head" x="32" y="520">CHÚ GIẢI</text>
        <path class="yes" d="M 128 516 L 132 520 L 140 512"/>
        <text class="legend-text" x="152" y="520">làm được</text>
        <path class="no" d="M 260 512 L 268 520 M 268 512 L 260 520"/>
        <text class="legend-text" x="280" y="520">không làm được</text>
        <rect class="band" x="408" y="508" width="32" height="16" rx="4"/>
        <text class="legend-text" x="452" y="520">lối máy khuyên</text>
        <text class="legend-text" x="580" y="520">chạm / không chạm: luật sửa mà các hồ sơ đã ký đang đo</text>
      </svg>
    </div>
  </main>
</body>
</html>
