    cmd: config:executors.script.k3c_ranh_gioi
    expected: "exit 0; _acceptance/quyet-gop-y-noi-dung-ly-do/rang/ranh-gioi.mjs theo khuôn K3/K3b (tự chọn neo nhánh mở hay merge đưa hồ sơ lên): mỗi tệp khớp ranh giới hàng K3c (đọc hang-viec.json của đợt, không thì hằng chép); config.yaml và okr-tro-ly.ts chỉ dòng '+'; okr.contracts.ts: mọi dòng đổi nằm trong khối troLyQuyetOutput; tro-ly.service.ts: mọi dòng đổi nằm trong thân troLyQuyet, hàm lyDoKhongQuyetCua, bảng ánh xạ, hoặc dòng import. In 'ranh-gioi: <n> tep, 0 ngoai (neo <kieu>)'. Chiều đỏ: --them apps/app/lib/x.ts → exit 1 'ngoai-ranh-gioi:apps/app/lib/x.ts'."
