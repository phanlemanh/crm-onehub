slug: quyet-gop-y-noi-dung-ly-do
evals:
  - id: E1
    criterion: AC-1
    executor: test
    layer: backend-effect
    cmd: config:executors.test.k3c_api
    expected: "exit 0; bun run test -- \"cd apps/api && bun test test/quyet-gop-y-noi-dung-ly-do.spec.ts -t k3c-ma-tran\" trên CSDL kiểm riêng: ma trận viết trước một ca cho mỗi phần tử của LY_DO_KHONG_QUYET (danh sách lấy từ chính tập trong packages/validation, đòi số ca === LY_DO_KHONG_QUYET.length === 13). Mỗi ca dựng trạng thái gây lỗi qua đường thật (Prisma trên bộ mẫu tro-ly-okr-san, hay thủ tục okr.* thật), gieo một góp ý chờ đúng loại (viet-lai hay can-chinh), gọi okr.troLyQuyet thật bằng cookie người phù hợp; đòi tra.status 200, data === { ok: false, lyDo: <mã> }; đọc lại okrDeXuat: trangThai vẫn 'cho'; và giá trị OKR đích (tên KR, tên Mục tiêu, liên kết căn chỉnh) không đổi. Ca lệch in '<mã>: <ok/lyDo/trangThai thật>'. Chiều đỏ ghim ở E8 (a) và (b)."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [apps/api/src/okr/tro-ly.service.ts, apps/api/src/okr/okr.contracts.ts, packages/validation/src/okr-tro-ly.ts, apps/api/src/okr/okr.service.ts, apps/api/src/okr/okr-config.ts, apps/api/test/quyet-gop-y-noi-dung-ly-do.spec.ts]

  - id: E2
    criterion: AC-2
    executor: test
    layer: backend-effect
    cmd: config:executors.test.k3c_api_ngoai
    expected: "exit 0; cùng tệp, -t k3c-ngoai: bốn ca viết trước — deXuatId không có → status 404 (NOT_FOUND); góp ý đã quyết → 409 (CONFLICT); cach 'sua' cho góp ý loại 'hoi' → 400 BAD_REQUEST với thông điệp T.troLy.cachKhongHop; và hàm thuần lyDoKhongQuyetCua(new BadRequestException('cau la')) → null. Đòi không ca nào trả { ok: false }. Đòi số ca === 4."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [apps/api/src/okr/tro-ly.service.ts, apps/api/test/quyet-gop-y-noi-dung-ly-do.spec.ts]

