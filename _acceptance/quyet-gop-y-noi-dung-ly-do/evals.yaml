    cmd: config:executors.test.k3c_vi
    expected: "exit 0; bài DOM apps/app/test/gop-y-dung-cho-k3c.dom.tsx -t k3c-vi trên khung chung khung-gop-y-dung-cho.tsx: mỗi mã của LY_DO_KHONG_QUYET (lấy từ tập, đòi === 13 ca) — okr.troLyQuyet giả trả { ok: false, lyDo: <mã> }, bấm quyết góp ý D_KR1 (hay D_CAN cho mã can-chinh-*); so chuỗi nguyên thuỷ textContent của [data-slot=field-error] dưới đúng góp ý === okrGopYMessages('vi').loiQuyet[<mã>]; câu đó khác loiDong['chua-san-sang']; có ít nhất một ký tự tiếng Việt có dấu; không chứa chuỗi mã. Chiều đỏ ghim ở E8 (c): 'cau sai cho <mã>'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: ["apps/app/app/(app)/[slug]/okr/gop-y-kara.ts", apps/app/lib/messages/okr-gop-y.ts, packages/validation/src/okr-tro-ly.ts, apps/app/test/gop-y-dung-cho-k3c.dom.tsx]

