      <text x="500" y="710" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">nhịp sau: không thêm tra-loi-hong</text>

      <g fill="#666666" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.06em">
