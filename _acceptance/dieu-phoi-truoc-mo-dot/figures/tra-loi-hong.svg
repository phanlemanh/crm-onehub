      <text x="500" y="600" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tra-loi/&lt;id&gt;.json · ket_qua: duyet</text>

      <rect x="340" y="664" width="320" height="64" rx="32" fill="#fafafa"/>
      <rect x="340" y="664" width="320" height="64" rx="32" fill="rgba(0,107,79,0.08)" stroke="#006B4F" stroke-width="1.4"/>
