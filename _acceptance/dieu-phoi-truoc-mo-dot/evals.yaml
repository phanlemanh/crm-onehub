schema_version: 1
feature_slug: dieu-phoi-truoc-mo-dot
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.dph_tra_loi
    expected: "exit 0; tra-loi.test.mjs xanh ở ca 'tệp trả lời hỏng cú pháp: nhịp không ném, cách ly, cấp và thu hồi vẫn chạy' — fixture qua motNhip thật: khoá s4 của P1 do capPhat cấp, yêu cầu gia-han của P1, tệp trả lời là chuỗi '{\"ket_qua\":\"duyet\",}', đơn duong-nen lành của P2, khoá merge do capPhat cấp rồi lùi hạn và nhịp; khẳng định: motNhip không ném, tra-loi/hong/<id>.json tồn tại và tra-loi/<id>.json vắng, đúng một sự kiện tra-loi-hong can_phan với tep '<id>.json', khoa/duong-nen/chu.json ghi P2, sự kiện thu-hoi merge, trang-thai.json và bang.html có mặt, han_thue_den của P1 không đổi. Chiều đỏ: đột biến T1 (apGiaHan đọc tệp trả lời bằng docJson thô) làm ca này đỏ."
    paths: [scripts/dieu-phoi/phat-lich.mjs, scripts/dieu-phoi/hinh-dang.mjs, scripts/dieu-phoi/test/tra-loi.test.mjs]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.dph_tra_loi
    expected: "exit 0; tra-loi.test.mjs xanh ở ca 'tệp trả lời sai hình dạng: ma trận năm ô cách ly nêu trường; đúng hình dạng thì áp' — ma trận viết trước năm phần tử (mảng · thiếu ket_qua · ket_qua là số · uoc_phut là chuỗi · khoá lạ ghi_chu), mỗi ô một nhịp thật, khẳng định tệp vào hong/ và ly_do sự kiện khớp '^tra-loi/P1-1\\.json: <trường>'; số ô đã đo bằng số phần tử. Đối chứng dương bằng vòng ghi thật → đọc: chạy motNhip thật để bộ phát lịch tự ghi ba tệp trả lời (gia-han máy duyệt mang tai_nguyen; viec-phu gộp mang voi; cham-tep duyệt), đọc lại cả ba qua kiemTraLoi đều qua, và tập khoá của chúng là tập con của KHOA_TRA_LOI xuất từ hinh-dang.mjs; tệp giám sát ghi có uoc_phut 45 áp gia hạn. Chiều đỏ: đột biến T2 (bỏ kiểm khoá lạ), T3 (bỏ kiểm ket_qua là chuỗi), T6 (bỏ voi khỏi tập khoá cho phép — vế đối chứng viec-phu đỏ)."
    paths: [scripts/dieu-phoi/phat-lich.mjs, scripts/dieu-phoi/hinh-dang.mjs, scripts/dieu-phoi/test/tra-loi.test.mjs]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.dph_tra_loi
    expected: "exit 0; tra-loi.test.mjs xanh ở ca 'tệp trả lời hỏng rồi giám sát ghi lại: áp đúng một lần, không báo lặp' — nhịp 1 cách ly; nhịp 2 (chưa ai sửa) khẳng định tra-loi/<id>.json vắng và sự kiện tra-loi-hong vẫn đúng một; rồi ghi tệp trả lời đúng ket_qua duyet uoc_phut 30; ba nhịp nữa: han_thue_den tăng đúng 30 phút một lần, sự kiện tra-loi-hong vẫn đúng một. Chiều đỏ: đột biến T4 (cách ly bằng chép thay vì chuyển) làm vế nhịp 2 đỏ."
    paths: [scripts/dieu-phoi/phat-lich.mjs, scripts/dieu-phoi/test/tra-loi.test.mjs]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.dph_hook_s4
    expected: "exit 0; hook-chan-s4.test.mjs xanh ở ca 'dòng lệnh bọc chạy ra cùng kết quả như lệnh gốc: ma trận bảy dạng' — ma trận viết trước bảy phần tử, mỗi ô: lấy dòng lệnh bọc từ thông điệp hook thật (khoá s4 đúng worktree, run_in_background true), chạy nó bằng spawnSync bash -c trong thư mục tạm có repin-lane.mjs giả in argv và biến TZ, X; chạy lệnh gốc bằng bash -c cùng thư mục, cùng env; khẳng định lệnh gốc thoát 0 và stdout chứa dấu mong đợi riêng của ô (argv, TZ, X do repin-lane.mjs giả in), rồi stdout và status của dòng bọc bằng đúng của lệnh gốc; rồi chayHook với chính dòng bọc chạy nền thoát 0. Số ô đo bằng số phần tử. Chiều đỏ: đột biến T5 (trả '=' vào tập ký tự an toàn) làm ô tiền tố biến đỏ với status 127 khác 0."
    paths: [scripts/dieu-phoi/hook-chan-s4.mjs, scripts/dieu-phoi/giu-nhip.mjs, scripts/dieu-phoi/test/hook-chan-s4.test.mjs]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: script
    cmd: config:executors.script.dptm_hook_cay
    expected: "exit 0; rang/hook-cay.mjs dựng kho nháp: checkout chính có .githooks/pre-push là tệp pre-push THẬT của cây (đọc từ đĩa), worktree liên kết có .githooks/pre-push riêng (khuôn giả ghi dấu 'cay-wt' và thoát với mã khai), core.hooksPath của worktree (config --worktree) trỏ .githooks của checkout chính, một kho trần làm remote, bun giả trên PATH ghi một dấu 'bun-<tên thư mục đang chạy>' mỗi lượt vòng lệnh (git chạy hook ở gốc cây đang đẩy). Bốn ca git push thật: (a) từ worktree mang hook giả → không có dấu bun nào (vòng lệnh của checkout chính không chạy), hook giả ghi lại argv và stdin khớp nguyên văn tên remote và dòng ref 'HEAD <sha> refs/heads/t1 <40 số 0>', mã thoát push theo mã khai của hook cây (0 rồi 1); (b) worktree mang bản sao pre-push THẬT → đúng một dấu bun-wt và không dấu nào khác, push xong trong trần (không lặp); (c) từ checkout chính → bun-chinh đúng một lượt, không lặp; (d) worktree không có .githooks/pre-push → vòng lệnh của hook đang chạy chạy tiếp đúng một lượt (một dấu bun-wt). In 'XANH <ca>' từng ca. Chiều đỏ trên bản sao cùng fixture: bỏ dòng exec của khối chuyển hook → ca (a) in 'BAT tu-worktree: hook cua checkout chinh da chay'; chèn đọc stdin trước exec → ca (a) in 'BAT stdin: hook cay nhan dong ref rong'; thiếu → 'SOT' và thoát 1. Dòng cuối 'KET LUAN: xanh'."
    paths: [.githooks/pre-push, _acceptance/dieu-phoi-truoc-mo-dot/rang/hook-cay.mjs]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.dph_tat_ca
    expected: "exit 0; bun run test:dieu-phoi xanh mọi ca, 'fail 0', gồm tệp mới tra-loi.test.mjs."
    paths: [scripts/dieu-phoi/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E7
