  - id: E9
    criterion: AC-6
    executor: script
    cmd: config:executors.script.dpvb_git_sach
    expected: "exit 0; răng git-sach của dieu-phoi-va-bien 'KET LUAN: xanh' — pre-push mới (có khối chuyển hook) vẫn không đổi kho nháp khi chạy trong hook, và bỏ bước gỡ biến vẫn bị bắt."
    paths: [.githooks/pre-push, scripts/gate-shape-node-test.mjs]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E10
    criterion: AC-6
    executor: script
    cmd: config:executors.script.dpvb_cong
