    cmd: config:executors.script.dptm_dot_bien
    expected: "exit 0; bộ đột biến của vòng này (cùng khuôn hai vòng trước) in 'KET LUAN: 6 dot bien, moi ca ghim deu do' cho T1–T6 nêu ở E1–E4; không MOC VANG, không SONG."
    paths: [scripts/dieu-phoi/**, _acceptance/dieu-phoi-truoc-mo-dot/rang/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E13
    criterion: AC-7
    executor: judgment
    inputs: [scripts/dieu-phoi/README.md]
    question: "Đọc mục «Trong đợt» của README như một phiên giám sát chưa thấy mã. (1) Phiên có biết rằng tệp trả lời tra-loi/<id>.json hỏng cú pháp hoặc sai hình dạng sẽ bị chuyển vào tra-loi/hong/ kèm sự kiện tra-loi-hong? (2) Có biết yêu cầu đó khi ấy coi như chưa trả lời? (3) Có biết cách sửa là ghi lại tệp trả lời đúng hình dạng? PASS chỉ khi cả ba có mặt và đúng nghĩa. (Danh sách khoá đúng hay sai không thuộc câu hỏi này — E14 đo bằng máy.)"
    paths: [scripts/dieu-phoi/README.md]
    expected: "PASS cả ba ý."
    evidence_required: [run_id, verdict, judges, verified_at]
  - id: E14
    criterion: AC-7
    executor: script
    cmd: config:executors.script.dptm_readme_khoa
    expected: "exit 0; rang/readme-khoa.mjs rút danh sách khoá của tệp trả lời trong mục «Trong đợt» của scripts/dieu-phoi/README.md (dòng mở đầu 'Khoá hợp lệ của tệp trả lời:') và so bằng TẬP với KHOA_TRA_LOI import từ scripts/dieu-phoi/hinh-dang.mjs; in 'XANH readme-khoa: <n> khoá khớp'. Chiều đỏ trên bản sao README: bỏ một khoá (uoc_phut) → 'BAT thieu uoc_phut'; thêm khoá lạ (ghi_chu) → 'BAT thua ghi_chu'; thiếu → 'SOT' và thoát 1."
    paths: [scripts/dieu-phoi/README.md, scripts/dieu-phoi/hinh-dang.mjs, _acceptance/dieu-phoi-truoc-mo-dot/rang/readme-khoa.mjs]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
