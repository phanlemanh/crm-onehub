    expected: "exit 0; bộ đột biến của dieu-phoi-hai-tang in 'KET LUAN: 27 dot bien, moi ca ghim deu do' trên cây mới."
    paths: [scripts/dieu-phoi/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E8
