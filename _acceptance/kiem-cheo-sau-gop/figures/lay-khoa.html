<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lượt đêm lấy khoá s4</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #fafafa;
      --color-ink:     #171717;
      --color-muted:   #575757;
      --color-accent:  #006B4F;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1280px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.01em;
      line-height: 1.3;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · kiem-cheo-sau-gop · AC-4 · AC-5 · AC-7 · AC-8</p>

      </defs>

      <rect width="100%" height="100%" fill="#fafafa"/>

      <g fill="none" stroke="#575757" stroke-width="1.2">

        <line x1="880" y1="368" x2="880" y2="432" marker-end="url(#arrow)"/>
        <path d="M1000,312 H1072 Q1080,312 1080,320 V528" marker-end="url(#arrow)"/>
      </g>
      <line x1="300" y1="744" x2="300" y2="784" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>

      <g font-family="'Geist Mono', monospace" font-size="9" letter-spacing="0.12em" text-anchor="middle" fill="#575757">

      <rect x="460" y="40" width="200" height="48" rx="24" fill="#fafafa"/>

      <text x="560" y="172" fill="#171717" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Có đợt,</text>
      <text x="560" y="188" fill="#171717" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">bộ phát lịch sống?</text>

      <polygon points="300,256 420,312 300,368 180,312" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="300" y="308" fill="#171717" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Quá 20 giờ từ</text>
      <text x="300" y="324" fill="#171717" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">kết quả trước?</text>

      <rect x="40" y="416" width="240" height="80" rx="6" fill="#fafafa"/>

      <text x="300" y="684" fill="#171717" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Được cấp trước</text>

      <rect x="180" y="784" width="240" height="56" rx="28" fill="rgba(0,107,79,0.08)" stroke="#006B4F" stroke-width="1.4"/>
      <text x="300" y="808" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chạy làn (trần 90 phút)</text>
      <text x="300" y="826" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">→ trả khoá</text>

      <rect x="480" y="660" width="240" height="56" rx="28" fill="#fafafa"/>
      <rect x="480" y="660" width="240" height="56" rx="28" fill="rgba(23,23,23,0.03)" stroke="rgba(23,23,23,0.30)" stroke-width="1"/>
      <text x="600" y="684" fill="#171717" font-size="11" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle">bo-luot-khoa-ban,</text>
      <text x="600" y="702" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">mốc không tiến</text>

      <polygon points="880,256 1000,312 880,368 760,312" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="880" y="308" fill="#171717" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Khoá tay</text>
      <text x="880" y="324" fill="#171717" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan font-family="'Geist Mono', monospace" font-weight="500">khoa/s4</tspan> trống?</text>

      <rect x="768" y="432" width="224" height="48" rx="24" fill="#fafafa"/>
      <rect x="768" y="432" width="224" height="48" rx="24" fill="rgba(23,23,23,0.03)" stroke="rgba(23,23,23,0.30)" stroke-width="1"/>
      <text x="880" y="460" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tạo khoá tay → chạy → xoá</text>

      <rect x="1000" y="528" width="160" height="48" rx="24" fill="#fafafa"/>
      <rect x="1000" y="528" width="160" height="48" rx="24" fill="rgba(23,23,23,0.03)" stroke="rgba(23,23,23,0.30)" stroke-width="1"/>
      <text x="1080" y="556" fill="#171717" font-size="11" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle">bo-luot-khoa-ban</text>

      <line x1="40" y1="864" x2="1160" y2="864" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>
      <text x="40" y="884" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI · HÌNH DẠNG MANG LOẠI</text>

      <text x="72" y="910" fill="#575757" font-size="9" font-family="'Geist', sans-serif">Bắt đầu / kết cục (bầu dục)</text>
      <rect x="252" y="900" width="24" height="12" rx="2" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="284" y="910" fill="#575757" font-size="9" font-family="'Geist', sans-serif">Bước (chữ nhật)</text>
      <polygon points="424,906 436,900 448,906 436,912" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="460" y="910" fill="#575757" font-size="9" font-family="'Geist', sans-serif">Rẽ nhánh (thoi)</text>
      <rect x="600" y="900" width="24" height="12" rx="2" fill="rgba(0,107,79,0.08)" stroke="#006B4F" stroke-width="1.4"/>
      <text x="632" y="910" fill="#575757" font-size="9" font-family="'Geist', sans-serif">Tiêu điểm: đơn mang moc và lối chạy làn</text>

  </div>
</body>
</html>
