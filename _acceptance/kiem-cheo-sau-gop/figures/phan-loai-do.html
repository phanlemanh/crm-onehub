<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phân loại một eval đỏ</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #fafafa;
      --color-ink:     #171717;
      --color-muted:   #575757;
      --color-accent:  #006B4F;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1040px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.01em;
      line-height: 1.3;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 800px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · kiem-cheo-sau-gop · AC-6</p>
    <h1>Phân loại một eval đỏ</h1>

      </defs>

      <rect width="100%" height="100%" fill="#fafafa"/>

      <g fill="none" stroke="#575757" stroke-width="1.2">
        <line x1="400" y1="88" x2="400" y2="120" marker-end="url(#arrow)"/>
        <line x1="400" y1="168" x2="400" y2="200" marker-end="url(#arrow)"/>
        <line x1="480" y1="248" x2="560" y2="248" marker-end="url(#arrow)"/>
        <line x1="400" y1="296" x2="400" y2="344" marker-end="url(#arrow)"/>
        <path d="M520,400 H792 Q800,400 800,408 V696" marker-end="url(#arrow)"/>
        <line x1="400" y1="456" x2="400" y2="488" marker-end="url(#arrow)"/>
        <line x1="400" y1="536" x2="400" y2="568" marker-end="url(#arrow)"/>

        <line x1="400" y1="664" x2="400" y2="704" marker-end="url(#arrow)"/>
      </g>
      <g fill="none" stroke="#575757" stroke-width="1.2">
        <line x1="400" y1="752" x2="400" y2="792" marker-end="url(#arrow)"/>
        <line x1="800" y1="760" x2="800" y2="792" marker-end="url(#arrow)"/>
      </g>

      <g font-family="'Geist Mono', monospace" font-size="9" letter-spacing="0.12em" text-anchor="middle" fill="#575757">
        <rect x="504" y="224" width="32" height="16" rx="2" fill="#fafafa"/>

        <rect x="408" y="312" width="56" height="16" rx="2" fill="#fafafa"/>

      <rect x="300" y="40" width="200" height="48" rx="24" fill="#fafafa"/>

      <text x="400" y="412" fill="#171717" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ở mốc T?</text>

      <rect x="260" y="792" width="280" height="56" rx="28" fill="rgba(0,107,79,0.08)" stroke="#006B4F" stroke-width="1.4"/>
      <text x="400" y="816" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan font-family="'Geist Mono', monospace" font-weight="500">do-moi</tspan> + sha lần gộp</text>
      <text x="400" y="834" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">đầu tiên làm đỏ</text>

      <rect x="680" y="792" width="240" height="56" rx="28" fill="#fafafa"/>
      <rect x="680" y="792" width="240" height="56" rx="28" fill="rgba(0,107,79,0.08)" stroke="#006B4F" stroke-width="1.4"/>
      <text x="800" y="824" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan font-family="'Geist Mono', monospace" font-weight="500">do-moi</tspan> + sha lần gộp</text>

      <path d="M400,856 V872 H800 V856" fill="none" stroke="rgba(0,107,79,0.50)" stroke-width="1" stroke-dasharray="4,3"/>
      <line x1="600" y1="872" x2="600" y2="884" stroke="rgba(0,107,79,0.50)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="600" cy="872" r="2" fill="#006B4F"/>
      <text x="600" y="904" fill="#006B4F" font-size="14" font-style="italic" font-family="'Lora', serif" text-anchor="middle">kết quả ngày là «do» khi có ít nhất một do-moi</text>

      <line x1="32" y1="928" x2="928" y2="928" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>
      <text x="32" y="948" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI · HÌNH DẠNG MANG LOẠI</text>

      <rect x="32" y="964" width="24" height="12" rx="6" fill="rgba(23,23,23,0.03)" stroke="rgba(23,23,23,0.30)" stroke-width="1"/>
      <text x="64" y="974" fill="#575757" font-size="9" font-family="'Geist', sans-serif">Bắt đầu / kết cục (bầu dục)</text>
      <rect x="244" y="964" width="24" height="12" rx="2" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="276" y="974" fill="#575757" font-size="9" font-family="'Geist', sans-serif">Bước (chữ nhật)</text>
      <polygon points="416,970 428,964 440,970 428,976" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="452" y="974" fill="#575757" font-size="9" font-family="'Geist', sans-serif">Rẽ nhánh (thoi)</text>
      <rect x="592" y="964" width="24" height="12" rx="6" fill="rgba(0,107,79,0.08)" stroke="#006B4F" stroke-width="1.4"/>
      <text x="624" y="974" fill="#575757" font-size="9" font-family="'Geist', sans-serif">Tiêu điểm: do-moi gọi tên lần gộp</text>

  </div>
</body>
</html>
