      mỗi bước của mục 4 design doc có mặt với đúng lệnh hay đúng tham số. Thiếu một bước là FAIL
      và phải nêu tên bước. Lệnh Monitor có chạy được thật hay không KHÔNG thuộc câu hỏi này — E39 đo.
