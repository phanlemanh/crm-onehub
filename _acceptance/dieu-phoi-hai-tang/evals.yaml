  - id: E22
    criterion: AC-14
    executor: judgment
    question: >-
      README này có đủ bốn phần mở đợt, trong đợt, đóng đợt, đường lùi, và mỗi phần có chở đúng
      các bước mà mục 4 của design doc liệt kê không — lệnh mo/chay/xem/dong, Monitor tail -n0 -F
      su-kien.jsonl lọc can_phan với timeout 30 phút giăng lại khi hết hạn, task lịch 30 phút có
      notifyOnCompletion, nhóm thanh bên và lời dặn chip (thư mục đợt, mã phiên, ranh giới, đọc
      LUAT.md trước S1), trả lời can_phan bằng tra-loi/<id>.json có boi giam-sat kèm một dòng Nhật
      ký, push gom tối đa một lần mỗi 30 phút, không dùng /loop, kiểm git status --porcelain trước
      khi dọn worktree? Bước nào thiếu hay sai thì nêu đích danh.
    inputs:
      - scripts/dieu-phoi/README.md
      - docs/superpowers/specs/2026-10-07-dieu-phoi-hai-tang-design.md
    paths: ["scripts/dieu-phoi/README.md", "docs/superpowers/specs/2026-10-07-dieu-phoi-hai-tang-design.md"]
    expected: >-
