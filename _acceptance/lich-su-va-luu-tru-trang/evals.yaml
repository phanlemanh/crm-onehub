  - id: E9
    criterion: AC-9
    executor: test
    layer: backend-effect
    cmd: config:executors.test.lslt_chi_ghi_them
    paths: [apps/api/src/**, packages/db/src/**, apps/agent/agent/**, apps/api/test/tai-lieu-chi-ghi-them.spec.ts]
    expected: "exit 0. Hai vế. (a) Quét tĩnh mọi tệp .ts dưới apps/api/src, packages/db/src, apps/agent/agent: không lời gọi Prisma nào dạng taiLieuPhienBan.(update|updateMany|delete|deleteMany|upsert) hay taiLieuSuKien.(update|updateMany|delete|deleteMany|upsert), cũng không SQL thô UPDATE/DELETE trên hai bảng (regex trên mã, đối chứng dương: chuỗi mẫu 'tx.taiLieuPhienBan.update(' trong bài bị regex bắt). (b) Chạy trọn các luồng E3, E5, E6 trên một trang: chụp mọi hàng TaiLieuPhienBan và TaiLieuSuKien trước mỗi luồng; sau luồng mọi hàng cũ toEqual bản chụp (chỉ có hàng thêm); số sự kiện thêm toEqual bảng VIẾT TRƯỚC {quayLai:1 DE_XUAT, duyệt quay lại:1 DUYET, deXuatLuuTru:1 DE_XUAT, duyệt lưu trữ:1 LUU_TRU (+CU cho đề xuất bị cũ), deXuatKhoiPhuc:1 DE_XUAT, duyệt khôi phục:1 KHOI_PHUC, trả lại:1 TRA_LAI}, mỗi sự kiện có aiId và luc."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

