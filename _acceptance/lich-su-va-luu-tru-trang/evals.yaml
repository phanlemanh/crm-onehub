schema_version: 1
feature_slug: lich-su-va-luu-tru-trang
evals:
  - id: E1
    criterion: AC-1
    executor: test
    layer: backend-effect
    cmd: config:executors.test.lslt_lich_su
    paths: [apps/api/src/tai-lieu/**, packages/db/src/tai-lieu-*.ts, packages/validation/src/tai-lieu.ts, apps/api/test/tai-lieu-lich-su.spec.ts, apps/api/test/tai-lieu-san.ts]
    expected: "exit 0; Postgres _test thật, gieo qua đường ghi thật (create, propose, approve qua tRPC): trang P ba phiên bản — v1 do người A đề xuất, v2 do B, v3 do A, chủ trang C duyệt cả ba; trang Q chưa từng duyệt. Bài 'lich-su': taiLieu.lichSu(P) bởi thành viên M toEqual bảng VIẾT TRƯỚC ba dòng [{so:3,…,nguoiDeXuat:A,nguoiDuyet:C,dangDung:true},{so:2,…,B,C,false},{so:1,…,A,C,false}] (tên lấy từ hàng User đã gieo, không chép tay chuỗi khác); lichSu(Q) bởi C toEqual []; lichSu(Q) bởi M (không thấy Q theo dieuKienThay) ném NOT_FOUND giống get(Q) — so mã lỗi của hai lời gọi. CHIỀU ĐỎ: bài khẳng định số dòng có dangDung:true đúng bằng 1 trên mọi trang gieo — bản sao trong bài đặt banDangDungId của P về v2 rồi gọi lại → dòng v2 mang dangDung:true, v3 false (thước đọc banDangDungId thật, không suy từ số lớn nhất)."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: test
    layer: backend-effect
    cmd: config:executors.test.lslt_phien_ban
    paths: [apps/api/src/tai-lieu/**, packages/db/src/tai-lieu-*.ts, apps/api/test/tai-lieu-lich-su.spec.ts]
    expected: "exit 0; cùng gieo E1. Bài 'phien-ban': phienBan(P,1) trả ten, noiDung, duyetLuc bằng đúng hàng TaiLieuPhienBan so 1 đọc từ DB và dangDung.noiDung bằng hàng của banDangDungId; phienBan(P,3) trả laBanDangDung:true; phienBan(P,9) và phienBan(Q,1) ném NOT_FOUND; M gọi trên trang không thấy ném NOT_FOUND. Đối chứng dương: so v1 với v3 bằng soSanh của @crm/validation/tai-lieu-diff trên chữ trả về cho ít nhất một khối thêm và một khối bớt (gieo v1, v3 khác nhau có chủ ý). CHIỀU ĐỎ: gọi với so âm và so không nguyên → khuôn nhập từ chối BAD_REQUEST trước khi chạm DB (đếm truy vấn bằng spy Prisma = 0)."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: test
    layer: backend-effect
    cmd: config:executors.test.lslt_quay_lai
    paths: [apps/api/src/tai-lieu/**, packages/db/src/tai-lieu-*.ts, packages/validation/src/tai-lieu.ts, apps/api/test/tai-lieu-lich-su.spec.ts]
    expected: "exit 0; cùng gieo E1. Bài 'quay-lai': chụp băm sha256 của (so, ten, noiDung, duyetLuc) mọi hàng TaiLieuPhienBan của P trước; quayLai(P,1) bởi A → đúng một hàng TaiLieuDeXuat mới: loai NOI_DUNG, ten và noiDung === bản 1 (NFC cả hai phía), banGocId === banDangDungId, tuPhienBanSo 1, trangThai CHO_DUYET; đúng một TaiLieuSuKien DE_XUAT mới. C duyệt (approve với diffHash tính bằng hàm thật) → phiên bản so 4 noiDung === bản 1; băm ba hàng cũ không đổi. Ma trận từ chối VIẾT TRƯỚC, mỗi ca đếm hàng TaiLieuDeXuat và TaiLieuSuKien trước/sau bằng nhau và ghim mã lỗi: quayLai(P,4) (bản đang dùng) → CONFLICT chuaDoi · trang R có v2 trùng chữ v1 thì quayLai(R,1) → chuaDoi · trang đã lưu trữ S → BAD_REQUEST daLuuTru · so không có → NOT_FOUND. Số ca = 4, đúng bằng số dòng bảng."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: test
    layer: backend-effect
    cmd: config:executors.test.lslt_de_xuat_luu_tru
    paths: [apps/api/src/tai-lieu/**, packages/db/src/tai-lieu-*.ts, packages/validation/src/tai-lieu.ts, apps/api/test/tai-lieu-luu-tru.spec.ts]
    expected: "exit 0; Postgres _test thật. Bài 'de-xuat-luu-tru': deXuatLuuTru(P,'không còn dùng') bởi M → đúng một đề xuất loai LUU_TRU, lyDoDeXuat nguyên văn, trangThai CHO_DUYET, một sự kiện DE_XUAT; hàng TaiLieuTrang của P không đổi (so toàn hàng trước/sau). Ma trận từ chối VIẾT TRƯỚC, mỗi ca 0 hàng ghi và ghim chuỗi lỗi: trang chưa từng duyệt · trang đã lưu trữ · đã có đề xuất LUU_TRU chờ · lyDo '   ' · lyDo 501 ký tự. Đối chứng dương ranh giới: lyDo đúng 500 ký tự và lyDo 1 ký tự được nhận."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-5
    executor: test
    layer: backend-effect
    cmd: config:executors.test.lslt_duyet_luu_tru
    paths: [apps/api/src/tai-lieu/**, packages/db/src/tai-lieu-*.ts, apps/api/test/tai-lieu-luu-tru.spec.ts]
    expected: "exit 0. Bài 'duyet-luu-tru': P có đề xuất LUU_TRU chờ và đề xuất NOI_DUNG chờ; ma trận người VIẾT TRƯỚC năm dòng {chủ trang, owner, admin, thành viên khác, vai okr} × duyệt — ba dòng đầu (mỗi dòng trên một bản gieo riêng) → archivedAt khác null, banDangDungId không đổi, số TaiLieuPhienBan không đổi, đề xuất NOI_DUNG thành CU, đúng một sự kiện LUU_TRU mang aiId người duyệt; hai dòng cuối → FORBIDDEN, hàng trang và hai đề xuất không đổi. Bài 'giu-ngay-dau': gọi hàm duyệt lưu trữ của service trực tiếp trên trang đã lưu trữ với đồng hồ giả lệch 3 ngày → archivedAt bằng ngày đầu. CHIỀU ĐỎ: bản sao hàm ghi archivedAt luôn = now (dựng trong bài bằng cùng đầu vào) cho ngày khác — khẳng định ghim 'giữ ngày lưu trữ đầu' phân biệt được hai cách."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-6
    executor: test
    layer: backend-effect
    cmd: config:executors.test.lslt_khoi_phuc
    paths: [apps/api/src/tai-lieu/**, packages/db/src/tai-lieu-*.ts, apps/api/test/tai-lieu-luu-tru.spec.ts]
    expected: "exit 0. Bài 'khoi-phuc': trang B đã lưu trữ; deXuatKhoiPhuc(B,'cần lại') → đề xuất loai KHOI_PHUC; C duyệt → archivedAt null, đúng một sự kiện KHOI_PHUC; sau đó tim theo từ khoá của B ra B và dangDung có B (quan hệ với AC-7, không chỉ cột). deXuatKhoiPhuc trên trang chưa lưu trữ → BAD_REQUEST, 0 hàng; propose(B, nội dung mới) khi B đã lưu trữ → BAD_REQUEST chuỗi daLuuTru, 0 hàng TaiLieuDeXuat mới."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-7
    executor: test
    layer: backend-effect
    cmd: config:executors.test.lslt_loc
    paths: [apps/api/src/tai-lieu/**, packages/db/src/tai-lieu-*.ts, apps/api/test/tai-lieu-luu-tru-loc.spec.ts]
    expected: "exit 0. Ma trận VIẾT TRƯỚC: A (đang dùng) và B (đã lưu trữ qua đường duyệt thật) cùng chứa từ 'tulaplưutrữ', cùng xacMinhDen hôm qua, cùng đơn vị D và chủ trang C, cùng được trang C2 nhắc tới bằng [[…]]. Bảng chỗ đọc mười dòng, mỗi dòng một khẳng định tập slug toEqual {A}: tim · dangDung · list mặc định · boLoc (đếm đơn vị D = 1, chủ trang C = 1 — trước khi lưu trữ B là 2, đo cả hai mốc) · sucKhoe.quaHan · nhacToi(C2) · timTrangDangDung (packages/db) · docBanDangDung(B) === null · docNhieuBanDangDung([A,B]) chỉ A · list({archived:true}) toEqual {B} kèm archivedAt. get(B) trả daLuuTru.luc. Số khẳng định = số dòng bảng. CHIỀU ĐỎ: khôi phục B (E6) rồi chạy lại cùng bảng → mọi dòng ra {A,B} — thước đọc cột thật, không hằng đúng."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7a
    criterion: AC-7
    executor: test
    layer: backend-effect
    cmd: config:executors.test.lslt_tro_ly
    paths: [apps/agent/agent/subagents/tro_ly_kho/**, packages/db/src/tai-lieu-tim.ts, apps/agent/test/tro-ly-kho-luu-tru.spec.ts]
    expected: "exit 0; Postgres _test thật. Gọi execute của hai tool search_pages và read_page của tro_ly_kho (đúng hàm tool đăng ký, trong ngữ cảnh phiên con hợp lệ như bài tool sẵn có) trên A và B ở E7: search_pages(từ khoá) chỉ trả A; read_page(B) trả đúng kết quả 'không có' như slug không tồn tại (so bằng nhau với read_page('khong-ton-tai')). CHIỀU ĐỎ: khôi phục B rồi gọi lại → search_pages trả cả B, read_page(B) trả chữ trang."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

