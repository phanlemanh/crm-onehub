schema_version: 1
feature_slug: cap-nhat-tuan-okr
evals:
  - id: E1
    criterion: AC-1
    executor: test
    layer: backend-effect
    cmd: config:executors.test.cnt_gui_lo
    paths: [apps/api/src/okr/**, packages/validation/src/okr-cap-nhat.ts, packages/validation/src/okr-vet.ts, packages/db/prisma/schema.prisma, apps/api/test/okr-cap-nhat.spec.ts, apps/api/test/okr-san.ts]
    expected: "exit 0; sàn okr-san dựng AppModule thật, gieo cây (bộ phận B, phòng ban P có trưởng), chu kỳ quý dang-chay, mục tiêu phòng ban đã công bố với ba KR của member M (tang-toi 0→10, moc, phan-tram 0→100). M gọi okr.moCapNhat({entry:'tab'}) rồi okr.guiCapNhat lô ba mục (7 cao «a», 1 vua «b», 40 thap «c»). Đọc db.okrCheckIn theo sessionId: MA TRẬN 3 dòng × [keyResultId, weekStart (chuỗi yyyy-mm-dd = thứ Hai giờ VN của ngày chạy, tính độc lập bằng Intl), value, confidence, note, authorUserId = M, ownerUserId = M, onBehalf = false, channel = web, sessionId] = 30 khẳng định viết trước; db.okrKeyResult.currentValue của ba KR = 7, 1, 40; db.okrTrail action cap-nhat-tuan đúng 3 dòng, mỗi dòng before.currentValue = giá trị cũ, after.currentValue = giá trị mới, after.confidence đúng. Lô thứ hai cùng tuần (phiên mới) cho KR 1 giá trị 8 → db.okrCheckIn của KR 1 có 2 dòng, dòng cũ (id, value 7) còn nguyên. Router: danh sách thủ tục okr.* trong src/generated/server.ts không chứa tên nào khớp /CheckIn|CapNhat/ ngoài capNhatTuan, moCapNhat, guiCapNhat (khẳng định tập đúng bằng). Ma trận từ chối viết trước, mỗi ca một lô hai mục trong đó một mục hỏng: thiếu confidence · confidence 'rat-cao' · value 'ba' · moc = 2 · phan-tram = 120 · note 201 ký tự · KR của người khác mà M không sửa được đơn vị · KR của mục tiêu nháp · KR của mục tiêu đã bỏ · chu kỳ pha cham-diem = 10 ca; mỗi ca mã lỗi và câu ghim (từ OKR.thongDiep.capNhat) khớp, đếm okrCheckIn và currentValue của MỌI KR trong lô trước/sau bằng nhau. CHIỀU ĐỎ: bản sao service ghi từng mục ngoài giao dịch → ca 'một mục hỏng' để lại một dòng, bài đỏ in đếm; bản sao bỏ kiểm pha → ca cham-diem ghi được, bài đỏ in tên ca."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-1
    executor: test
    cmd: config:executors.test.cnt_khuon
    paths: [packages/validation/src/okr-cap-nhat.ts, packages/validation/src/okr-trao-doi.ts, packages/validation/test/okr-cap-nhat.spec.ts]
    expected: "exit 0; khuôn Zod guiCapNhatInput, addCommentInput, followInput: MA TRẬN viết trước 12 đầu vào (6 hợp lệ, 6 hỏng: confidence lạ, note 201, body rỗng, body 2001, trường thừa 'seconds', trường thừa 'authorUserId') × kết quả parse; hàm kiemGiaTriTheoKieu(kind, value) với bảng 6 kiểu × 3 giá trị (−1, 0.5, 101) = 18 ô viết trước (moc chỉ nhận 0/1, phan-tram 0–100, bốn kiểu số nhận mọi số hữu hạn). CHIỀU ĐỎ: bản sao khuôn bỏ .strict() → ô 'trường thừa seconds' parse được, bài đỏ in ô."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-2
    executor: test
    layer: backend-effect
    cmd: config:executors.test.cnt_phien_giay
    paths: [apps/api/src/okr/**, packages/validation/src/okr-cap-nhat.ts, apps/api/test/okr-cap-nhat.spec.ts, apps/api/test/okr-san.ts]
    expected: "exit 0; M mở phiên, bài đặt đồng hồ máy chủ bằng tham số now của service (openedAt = T, gửi tại T + 47 s) → db.okrCheckInSession đọc lại openedAt = T, submittedAt = T+47s, seconds = 47; mọi dòng okrCheckIn của lô mang đúng sessionId. Từ chối viết trước: đầu vào tRPC có thêm seconds: 1 → 400 khuôn chặt · có thêm authorUserId → 400 · phiên của người khác → 403 · phiên đã gửi xong gửi lần hai → 400 câu ghim phienDaGui; đếm dòng không đổi mỗi ca. Đối chứng dương: lô bị từ chối (một mục confidence lạ) không đổi submittedAt (vẫn null), gửi lại lô đúng bằng cùng phiên → 200. CHIỀU ĐỎ: bản sao service lấy seconds từ đầu vào máy khách → khuôn chặt vẫn chặn, bài đỏ ở ca đối chứng không có; bản sao không đóng phiên → ca gửi-lần-hai được 200, bài đỏ in đếm."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-2
    executor: script
    layer: backend-effect
    cmd: config:executors.script.cnt_duong_do
    paths: [_acceptance/cap-nhat-tuan-okr/rang/duong-do.mjs, _acceptance/cap-nhat-tuan-okr/rang/ty-le-cap-nhat-tuan.sql, _acceptance/cap-nhat-tuan-okr/rang/trung-vi-giay.sql, _acceptance/cap-nhat-tuan-okr/rang/nguoi-noi-kenh-nhan-tin.sql, packages/db/prisma/schema.prisma, apps/api/src/okr/**, apps/agent/agent/lib/nhac-ke-hoach.ts]
    expected: "exit 0; script suy gốc kho từ vị trí của nó, dựng cơ sở dữ liệu tạm crm_cnt_<ngẫu nhiên> bằng migration của cây, gieo QUA ĐƯỜNG GHI THẬT (OkrService.guiCapNhat, không INSERT tay vào okrCheckIn/okrCheckInSession) hai phòng ban × 5 KR đang chạy trong ba tuần, người phụ trách có phòng ban chính P hoặc Q: P cập nhật 5/5, 4/5, 5/5; Q 2/5, 5/5, 3/5 — trong đó một KR của P gửi HAI phiên ở tuần 1, một KR của Q (không cập nhật tuần 1) thuộc mục tiêu cấp bộ phận, một KR của P thuộc mục tiêu cá nhân; thêm nhiễu không được đếm: một KR ở chu kỳ lap-ke-hoach không cập nhật, một KR của mục tiêu nháp không cập nhật. Phiên đã gửi với seconds 30, 45, 50, 70, 200 (đặt now qua tham số service) và một phiên chưa gửi. Người kênh: B1 có ZaloLink và agentTask nhac-ke-hoach outcome da-gui:1 với daGui loai okr-cap-nhat; B2 có ZaloLink, có KR đang chạy nhưng hàng nhắc outcome khong-khop; B3 không liên kết. Chạy ba câu SQL: tỷ lệ theo phòng ban × tuần = MA TRẬN 2 × 3 = 6 ô viết trước (1.0, 0.8, 1.0, 0.4, 1.0, 0.6); trung vị = 50 (phiên chưa gửi không tính); người đã nối kênh không nhận tin ngày cập nhật = {B2} (đúng 1, B3 không tính vì chưa nối). Drop cơ sở dữ liệu tạm. CHIỀU ĐỎ, mỗi đột biến là một tệp SQL giả trong tmpdir, exit 1 thông điệp ghim: đếm dòng thay KR khác nhau → «ty-le lech P tuan 1»; bỏ lọc pha chu kỳ → «ty-le lech»; bỏ lọc cong-bo → «ty-le lech»; trung vị tính cả phiên chưa gửi → «trung-vi lech»; đếm cả người chưa nối → «nguoi-noi-kenh lech»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-3
    executor: test
    layer: backend-effect
    cmd: config:executors.test.cnt_ghi_ho
    paths: [apps/api/src/okr/**, apps/api/test/okr-cap-nhat.spec.ts, apps/api/test/okr-san.ts]
    expected: "exit 0; cây: bộ phận B chứa P và P2 (trưởng P = TP, trưởng P2 = TP2), mục tiêu phòng ban P công bố với KR1 của M và KR2 của N; mục tiêu OneHub công bố có KR3 của N. MA TRẬN viết trước 5 người × KR1: TP → 200 dòng mới authorUserId TP, ownerUserId M, onBehalf true; TP2 → 403; N (phụ trách KR khác cùng mục tiêu) → 403; M → 200 onBehalf false; trưởng bộ phận B → 200 onBehalf true. Admin gửi cho KR3 → 200 onBehalf true; TP gửi cho KR3 → 403. Mỗi ca 403 đếm okrCheckIn không đổi. CHIỀU ĐỎ: bản sao service dùng assertThanhVien thay vì assertSuaKr → TP2 được 200, bài đỏ in ô [TP2, KR1]."
