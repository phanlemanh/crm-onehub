  - id: E6
    criterion: AC-4
    executor: ui-check
    layer: ui-observed
    cmd: config:executors.script.cnt_man_chrome
    steps:
      - "Cảnh cây (rang/canh-cay.mjs của man-cai-dat-noi-tieng-viet) trước màn đầu tiên; lệch cây → mã 2"
      - "Gieo qua API thật: phòng ban có trưởng, chu kỳ quý dang-chay, mục tiêu công bố với ba KR của M (tang-toi, moc, phan-tram), một lần cập nhật tuần trước cho KR tang-toi (mức vua); người R không phụ trách KR nào; đăng nhập dev:session"
      - "M mở {APP_URL}/<slug>/okr/cap-nhat-tuan ở 1440/vi → thanh tab có năm tab (tab thứ năm «Hỏi ý» do dot-hoi-y-tuong-okr thêm), tab «Cập nhật tuần» aria-current; mỗi KR một dòng (data-kr), ô giá trị điền sẵn đúng số, dòng «Tuần trước: vừa» ở KR có lần trước, KR mốc có hai nút → evidence E6-step1.png"
      - "Gõ «ba» vào ô KR phan-tram → câu lỗi dưới ô, nút gửi disabled → E6-step2.png; sửa thành 40; chọn mức tự tin cho hai KR → nút «Gửi 2 cập nhật» → E6-step3.png"
      - "Chặn request okr.guiCapNhat (trả 500) rồi bấm gửi → Alert «Chưa gửi được», ô còn nguyên giá trị đã gõ, nút «Gửi lại 2 cập nhật» → E6-step4.png; bỏ chặn, bấm gửi lại → «Đã gửi 2 cập nhật … giây» → E6-step5.png"
      - "R mở cùng URL → Empty rỗng → E6-step6.png; lỗi tải dựng phía máy chủ (danh sách tải ở trang máy chủ nên chặn trong trình duyệt không tới): app của phép đo trỏ API_URL qua cửa chặn rang/cua-chan.mjs (đứng giữa app và api, chuyển nguyên mọi yêu cầu, bật được trả 500 cho đúng thủ tục okr.capNhatTuan); bật chặn, M mở màn → Empty có «Thử lại»; tắt chặn, bấm «Thử lại» → danh sách hiện → E6-step7.png"
      - "Ở 390: scrollWidth <= innerWidth; ToggleGroup mức tự tin rộng bằng cột (sai số 2px) → E6-step8.png; nền tối 1440 → E6-step9.png"
      - "Khẳng định translate=no trên tên KR, tên mục tiêu, đơn vị đo; không lỗi hydrat trong console; request thất bại ngoài chỗ chặn ghi vào E6-network.txt"
    paths: ["apps/app/app/(app)/[slug]/okr/**", apps/app/lib/messages/okr.ts, _acceptance/cap-nhat-tuan-okr/rang/man-cap-nhat.mjs]
    expected: "exit 0 và ảnh ở .acceptance-runs/cap-nhat-tuan-okr/evidence/; script khẳng định bằng DOM (đếm data-kr, đọc value ô, textContent nút, aria-current, scrollWidth). CHIỀU ĐỎ trên cùng dựng cảnh: bỏ điền sẵn (ô rỗng) → khẳng định giá trị điền sẵn đỏ, in ô; xoá state ô khi lỗi gửi → bước 4 đỏ, in ô trống."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-4
    executor: script
    layer: backend-effect
    cmd: config:executors.script.cnt_man_chrome
    paths: ["apps/app/app/(app)/[slug]/okr/**", apps/api/src/okr/**, _acceptance/cap-nhat-tuan-okr/rang/man-cap-nhat.mjs]
    expected: "Cùng lần chạy với E6: trước mọi phép đếm, R mở màn Cập nhật tuần một lần để app (vừa khởi động trong phiên đo) biên dịch xong trang, tránh M đếm đôi phiên lúc app còn lạnh; script ghi mốc T0 (giờ máy chủ, đọc bằng SELECT now() qua DATABASE_URL của cây) ngay khi danh sách hiện, cố ý chờ 5 giây trước khi gửi. Trước bước 5 đếm okrCheckIn và okrCheckInSession của M bằng SQL thẳng (không qua màn); sau lần gửi bị chặn đếm okrCheckIn +0; sau «Đã gửi» đếm okrCheckIn +2, hai dòng có confidence đúng lựa chọn, value KR phan-tram = 40; okrCheckInSession của M +1 ĐÚNG MỘT phiên cho cả lần mở màn này (kể cả sau «Gửi lại»), entry = tab, openedAt ≤ T0 + 1s và seconds ≥ 5. CHIỀU ĐỎ: màn chỉ đổi state không gọi mutation → đếm +0, bài đỏ in đếm; màn gọi okr.moCapNhat trong nút gửi → seconds < 5, bài đỏ in «seconds <n> < 5»; màn gọi moCapNhat lại sau «Gửi lại» → hai phiên, bài đỏ in đếm phiên."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E8
    criterion: AC-5
    executor: test
    layer: backend-effect
    cmd: config:executors.test.cnt_nhac_cap_nhat
    paths: [packages/db/src/okr-nhac.ts, packages/db/src/onboarding-nhac.ts, apps/agent/test/okr-nhac.integration.spec.ts]
    expected: "exit 0; gieo chu kỳ dang-chay updateWeekday 1, KR của A (3 KR: K1 công bố tuần trước, K2 công bố tuần trước, K3 công bố đúng thứ Hai được xét), KR của mục tiêu nháp và KR ở chu kỳ lap-ke-hoach cùng người. MA TRẬN viết trước 6 thời điểm (thứ Hai 07:00 VN trước giờ nhắc vẫn tính; thứ Hai sau khi A gửi K1; thứ Tư; Chủ nhật 23:00; thứ Hai tuần sau 06:59 VN; thứ Hai tuần sau 09:00) × [có việc okr-cap-nhat, krIds] của A = 6 ô: [có, {K1,K2}] · [có, {K2}] · [có, {K2,K3}] · [có, {K2,K3}] · [có, {K1,K2,K3}] · [có, {K1,K2,K3}] — luật «công bố trước hôm nay» (AC-5, thiết kế mục 5): K3 công bố đúng thứ Hai được xét nên vắng ở ô thứ Hai, có mặt từ thứ Tư; KR nháp và KR chu kỳ khác pha không bao giờ có mặt; chu kỳ updateWeekday 3 (thứ Tư) → thứ Hai, thứ Ba không có việc, thứ Tư có. Gửi đủ: vào thứ Tư A gửi K2 và K3 → lần tính kế trả [không có việc okr-cap-nhat] (cột «có việc» là false, không phải krIds rỗng). CHIỀU ĐỎ: bản sao okr-nhac tính tuần theo UTC → ô «thứ Hai tuần sau 06:59 VN» (còn là Chủ nhật UTC) lệch, bài đỏ in ô; bản sao lọc «công bố trước đầu tuần» → ô thứ Tư thiếu K3, bài đỏ in ô."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

