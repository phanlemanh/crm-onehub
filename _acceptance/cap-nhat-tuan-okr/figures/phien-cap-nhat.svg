<text x="108" y="536" fill="#575757" font-size="10" font-family="'Geist', sans-serif" text-anchor="start">không dòng nào ghi, ô còn nguyên</text>
<text x="108" y="550" fill="#575757" font-size="10" font-family="'Geist', sans-serif" text-anchor="start">phiên còn mở — gửi lại dùng cùng phiên</text>
