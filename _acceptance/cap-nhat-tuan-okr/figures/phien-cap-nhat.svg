<text x="612" y="546" fill="#575757" font-size="10" font-family="'Geist', sans-serif" text-anchor="start">· mỗi KR một dòng lần cập nhật</text>
<text x="612" y="560" fill="#575757" font-size="10" font-family="'Geist', sans-serif" text-anchor="start">· đổi số hiện tại của KR</text>
