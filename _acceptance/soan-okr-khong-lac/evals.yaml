    expected: "exit 0; apps/app/test/soan-okr-khong-lac.spec.ts -t k2b-moc: transcript viết trước có 3 lời gọi nop_ban_nhap, output dựng bằng ketQuaNop thật của agent (parse round-trip, không viết tay) — da-ghi, tu-choi lyDo 'so moi: 2031' với bản nháp bằng lần 1 cộng 2 KR, da-ghi bằng lần 1 cộng 1 KR. Transcript dựng qua bộ chuyển thật của app (toTranscript/transcriptFrom ở apps/app/lib/agent-transcript.ts) từ các part eve dạng output-available, không dựng TranscriptItem bằng tay. mocTuTranscript trả đúng 2 mốc (itemId lần 1 và 3); mốc lần 3 có themKr === 1 và các đếm khác 0; danh sách lần không thành có đúng 1 phần tử (itemId lần 2, lyDo 'so moi: 2031'); gioNopCuoi trả giờ của lượt chứa lần 3. Kèm ca DOM -t k2b-moc-dom: hội thoại có đúng 2 [data-slot=kara-checkpoint] và 1 dòng hệ thống có textContent chứa m.moc.nopKhongThanh. Chiều đỏ ghim ở E8: vết (c) bỏ xét ketQua → ca đỏ in 'so moc 3, mong 2'; vết (e) gốc so sánh không lọc → ca đỏ in 'goc so sanh sai: themKr 1 mong, thay -1'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: ["apps/app/app/(app)/[slug]/okr/soan/moc-nop.ts", "apps/app/app/(app)/[slug]/okr/soan/hoi-thoai-soan.tsx", packages/validation/src/okr-cuoc-soan.ts, apps/app/test/soan-okr-khong-lac.spec.ts, apps/app/test/soan-okr-khong-lac.dom.tsx]

  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.k2b_moc_hong
    expected: "exit 0; spec -t k2b-moc-hong, ma trận viết trước 2 ca: (a) lời gọi failed (output vắng, errorText có) giữa hai lần da-ghi; (b) output không qua docKetQuaNop (ketQua: 'la') giữa hai lần da-ghi. Mỗi ca: đúng 2 mốc; mốc thứ hai so với lần da-ghi đầu (không với lần hỏng); lần hỏng có trong danh sách không thành với loai 'loi' cho (a) và 'khong-doc' cho (b). DOM: (a) hiện m.moc.nopKhongThanh, (b) hiện m.moc.nopKhongDoc. Chiều đỏ ghim ở E8: vết (c) → ca (b) đỏ in 'lan khong doc thanh moc'; vết (e) → ca (a) đỏ in 'goc so sanh sai'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: ["apps/app/app/(app)/[slug]/okr/soan/moc-nop.ts", packages/validation/src/okr-cuoc-soan.ts, apps/app/test/soan-okr-khong-lac.spec.ts]

