slug: soan-okr-khong-lac
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.k2b_tab
    expected: "exit 0; bài DOM apps/app/test/soan-okr-khong-lac.dom.tsx -t k2b-tab, ma trận viết trước 3 bước × 3 ô: (1) khổ hẹp, chọn tab Bản nháp, bật «chỉ dòng chờ»; (2) gọi useRecordStack().open({kind:'contact',id}) thật trong cùng NuqsTestingAdapter, rồi đặt tab ngăn 'activity' bằng useRecordSheetView; (3) gọi useRecordStack().close() thật. Mỗi bước so ba giá trị nguyên thuỷ: aria-selected của tab Bản nháp === 'true', trạng thái nút lọc === 'on', và (bước 2) giá trị tham số tab của ngăn === 'activity'. Chiều đỏ ghim ở E8 (đột biến khoá tab về 'tab') — ca đỏ in 'tab soan doi sang tro-chuyen o buoc 2'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: ["apps/app/app/(app)/[slug]/okr/soan/khung-soan.tsx", "apps/app/app/(app)/[slug]/okr/soan/bang-nhap.tsx", "apps/app/app/(app)/[slug]/okr/soan/cau-hinh.ts", apps/app/lib/search-param-keys.ts, apps/app/test/soan-okr-khong-lac.dom.tsx]

