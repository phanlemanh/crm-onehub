    cmd: config:executors.test.k2b_khoa
    expected: "exit 0; apps/app/lib/search-param-keys.test.ts: ca sẵn có «gives every feature its own url key» xanh với hai khoá mới; ca mới «trang soạn đọc khoá đã đăng ký» đòi SEARCH_PARAM.okr.tabSoan === 'tabSoan', SEARCH_PARAM.okr.locSoan === 'locSoan', cả hai có trong RESERVED_SEARCH_PARAM_KEYS, và mã nguồn soan/cau-hinh.ts không chứa chuỗi 'thamSo'. Chiều đỏ ghim ở E8: đột biến tabSoan về 'tab' làm ca «gives every feature its own url key» đỏ (số khoá đăng ký khác số khoá giữ chỗ)."
