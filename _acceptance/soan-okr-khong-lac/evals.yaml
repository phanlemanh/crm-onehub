    cmd: config:executors.test.k2b_nhom_loi
    expected: "exit 0; bài DOM -t k2b-nhom-loi, ma trận viết trước 3 ca lỗi: CONFLICT khi cuộc dang → câu m.loiQuyet.dongCu; CONFLICT khi cuộc da-dua-vao → m.loiQuyet.cuocKhongDang; lỗi mạng → m.loiQuyet.mang. Mỗi ca so giá trị nguyên thuỷ: textContent của [data-loi=nhom] trong [data-slot=kara-proposal-group] bằng đúng câu, biên nhận nhóm còn (querySelector !== null), nút Hoàn tác không disabled. Ca thứ tư: lần bấm sau mutation thành công → [data-loi=nhom] === null và nút nhóm «Thêm cả…» hiện lại. Chiều đỏ ghim ở E8 (đột biến bỏ truyền lỗi) — ca đỏ in 'khong thay loi duoi bien nhan nhom'."
