    cmd: config:executors.script.k2b_mot_nguon
    expected: "exit 0; _acceptance/soan-okr-khong-lac/rang/mot-nguon.mjs: (1) quan hệ: ketQuaNop.shape.ketQua.options của agent (import thật) bằng từng phần tử KET_QUA_NOP của packages/validation, cùng thứ tự; (2) khai tập: trong apps/agent-okr/agent/**/*.ts, apps/app/app/(app)/[slug]/okr/soan/** và packages/validation/src/** chỉ đúng một khai báo tập chứa \"da-ghi\" (z.enum([…]) hay mảng as const), ở packages/validation/src/okr-cuoc-soan.ts — chỗ DÙNG giá trị (return, ===) không tính; (3) moc-nop.ts nhập docKetQuaNop từ @crm/validation/okr-cuoc-soan; (4) round-trip: kết quả của tuChoi thật (ketQuaNop.parse) qua docKetQuaNop trả ketQua 'tu-choi' và đúng lyDo. In 'mot-nguon: KET_QUA_NOP 1 cho, agent + app dung chung'. Chiều đỏ: --ban-sao them-tap dựng bản sao nop-ban-nhap.ts khai lại z.enum([\"da-ghi\",\"tu-choi\"]) → exit 1, in 'tap ket qua khai 2 cho'."
