slug: okr-mau-xoa-cuoc-soan
evals:
  - id: E1
    criterion: AC-1
    executor: test
    layer: backend-effect
    cmd: config:executors.test.omx_xoa
    expected: "exit 0; bun run test -- \"cd apps/api && bun test test/okr-mau-cuoc-soan.spec.ts -t omx-xoa\" trên CSDL kiểm riêng. Dựng: batDauMau (nạp bộ mẫu), dungUngDung, cookie le-hai-dang ghi cấu hình thật { aiOn: true, aiSoanPhamVi: 'danh-sach', aiSoanDonVi: ['mau-okr-pb-kd-bac'] }, cookie nguyen-thi-lan gọi okr.soanMo thật trên mau-okr-chu-ky-nam-ke cho phòng kd-bac (đòi status 200); hai đề xuất qua gieoDongNhap (bộ ghi hangTuDongSoan của tác tử) — một 'cho', một 'bac'. Thêm ba cuộc bằng moCuoc thật, mỗi cuộc chỉ một vế mẫu, mỗi cuộc một đề xuất qua gieoDongNhap: vế-pb (departmentId 'mau-okr-pb-kd-nam', cycleId 'ngoai-mau-chu-ky-omx', người 'ngoai-mau-nguoi-omx'), vế-bp (level bo-phan, divisionId 'mau-okr-bp-kinh-doanh', chu kỳ và người như trên), vế-nguoi (departmentId 'ngoai-mau-pb-omx', chu kỳ như trên, nguoiMoUserId 'mau-okr-nguoi-nguyen-thi-lan'). ids = tapIdMau() của okr-mau-san.ts chụp trước khi xoá — chỉ mã người, bộ phận, phòng ban, chu kỳ, Mục tiêu, KR; KHÔNG gồm mã cuộc, nên aiChiPhi.taskId (E6) không vào phép quét. Đối chứng dương trước khi xoá: bốn cuộc tìm được theo mã; okrDeXuat có 5 hàng mang mã bốn cuộc; demThamChieu(ids) có khoá okrCuocSoan.cycleId, okrCuocSoan.departmentId, okrCuocSoan.divisionId, okrCuocSoan.nguoiMoUserId (thước thấy cả bốn cột). Rồi chayLenh(['--xoa']): mã 0; ném 'omx: con cuoc soan mau (<n>)' nếu cuộc chính còn hay còn hàng okrCuocSoan có cycleId/divisionId/departmentId bắt đầu mau-okr- hoặc nguoiMoUserId thuộc người mẫu chụp trước; ném 'omx: con cuoc ve-pb', 'omx: con cuoc ve-bp', 'omx: con cuoc ve-nguoi' nếu cuộc một-vế tương ứng còn (theo mã, xét trước phép tổng); ném 'omx: con de xuat soan (<n>)' nếu còn okrDeXuat mang mã một trong bốn cuộc; ném 'omx: con tham chieu mau <json>' nếu demThamChieu(ids) sau khi bỏ đúng khoá okrProgramConfig.createdById (giới hạn đã khai ở contract) khác {}; khoá được bỏ phải có mặt ở phép quét TRƯỚC khi xoá (đối chứng: thước thấy nó, việc bỏ là có chủ ý chứ không phải thước mù); chayLenh([]) sau đó mã 0. Chiều đỏ ở E9 (a), (b)."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [apps/api/scripts/okr-mau/nap.ts, apps/api/scripts/okr-mau/lenh.ts, apps/api/test/okr-mau-cuoc-soan.spec.ts, apps/api/test/okr-mau-san.ts]

  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.omx_xoa
    expected: "exit 0; cùng lượt -t omx-xoa: stdout của chayLenh(['--xoa']) bắt đầu 'Đã xoá bộ OKR mẫu:' và chứa nguyên chuỗi '4 cuộc soạn OKR với 5 đề xuất soạn'; thiếu thì ném 'omx: dong in thieu dem cuoc soan: <stdout>'. Chiều đỏ ở E9 (e)."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [apps/api/scripts/okr-mau/lenh.ts, apps/api/scripts/okr-mau/nap.ts, apps/api/test/okr-mau-cuoc-soan.spec.ts]

  - id: E3
    criterion: AC-3
    executor: test
    layer: backend-effect
    cmd: config:executors.test.omx_mo_coi
    expected: "exit 0; -t omx-mo-coi: xoaBoOkrMau rồi đòi tapIdMau() rỗng (bộ mẫu không còn); ghi một cuộc bằng moCuoc thật (@crm/db/okr-cuoc-soan) với cycleId 'mau-okr-chu-ky-nam-ke', departmentId 'mau-okr-pb-kd-bac', nguoiMoUserId 'mau-okr-nguoi-nguyen-thi-lan' và một đề xuất qua gieoDongNhap; chayLenh(['--xoa']): mã 0; ném 'omx: cuoc mo coi con' nếu hàng cuộc còn; 'omx: de xuat mo coi con' nếu đề xuất còn; 'omx: mo coi bao khong co bo mau' nếu stdout chứa 'không có bộ mẫu'; stdout phải chứa '1 cuộc soạn OKR với 1 đề xuất soạn'. Chiều đỏ ở E9 (c)."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [apps/api/scripts/okr-mau/nap.ts, apps/api/scripts/okr-mau/lenh.ts, apps/api/test/okr-mau-cuoc-soan.spec.ts]

  - id: E4
    criterion: AC-4
    executor: test
    layer: backend-effect
    cmd: config:executors.test.omx_xoa
    expected: "exit 0; cùng lượt -t omx-xoa: trước --xoa ghi thêm một cuộc bằng moCuoc thật với cycleId 'ngoai-mau-chu-ky', departmentId 'ngoai-mau-pb', nguoiMoUserId 'ngoai-mau-nguoi' và một đề xuất qua gieoDongNhap; chụp hai hàng bằng to_jsonb trước và sau --xoa; khác nhau hay thiếu thì ném 'omx: cuoc ngoai bi doi'. Đối chứng dương: cùng truy vấn chụp trả đúng 1 hàng cuộc và 1 hàng đề xuất trước khi xoá."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [apps/api/scripts/okr-mau/nap.ts, apps/api/test/okr-mau-cuoc-soan.spec.ts]

  - id: E5
    criterion: AC-5
    executor: test
    layer: backend-effect
    cmd: config:executors.test.omx_nap_lai
    expected: "exit 0; -t omx-nap-lai: nạp bộ mẫu, mở cuộc qua okr.soanMo thật như E1 với một đề xuất qua gieoDongNhap; đếm số hàng mang mã mẫu ở division, department, okrCycle, okrObjective, okrKeyResult (lần một); chayLenh([]) mã 0; ném 'omx: nap lai con cuoc cu' nếu hàng cuộc cũ (theo id) còn hay còn okrCuocSoan trỏ mã mẫu; 'omx: nap lai con de xuat cu' nếu đề xuất của cuộc cũ còn; số đếm năm bảng sau nạp lại phải bằng lần một ('omx: nap lai lech so hang')."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [apps/api/scripts/okr-mau/nap.ts, apps/api/test/okr-mau-cuoc-soan.spec.ts]

  - id: E6
    criterion: AC-6
    executor: test
    layer: backend-effect
    cmd: config:executors.test.omx_xoa
    expected: "exit 0; cùng lượt -t omx-xoa: trước --xoa ghi một hàng chi phí qua gieoChiPhi (bộ ghi ghiChiPhi thật) với tinhNang 'okr.soan', taskId = mã cuộc, sessionId = sessionId của cuộc, usd '0.25'; chụp hàng đó (to_jsonb) và chiTieuKhung(db, khung tháng UTC của at) trước và sau --xoa; hàng mất hay khác thì ném 'omx: chi phi soan bi doi'; tongUsd khác thì ném 'omx: tong chi thang doi <trước> -> <sau>'. Đối chứng dương: tongUsd trước khi xoá ≥ 0.25. Chiều đỏ ở E9 (d)."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [apps/api/scripts/okr-mau/nap.ts, apps/api/test/okr-mau-cuoc-soan.spec.ts]

  - id: E7
    criterion: AC-7
    executor: test
    layer: backend-effect
    cmd: config:executors.test.omx_dang_giu
    expected: "exit 0; -t omx-dang-giu: nạp bộ mẫu, mở cuộc qua okr.soanMo với một đề xuất; tạo công ty 'ngoai-mau-cty-omx' và thoả thuận 'ngoai-mau-deal-omx' có ownerId là người mẫu do-minh-khoa; chụp vanTayKho(); chayLenh(['--xoa']) phải trả mã 5 (OKR_MAU.ma.dangGiu), không thì ném 'omx: ma 5 khong ra (<mã>)'; vanTayKho() sau khác trước thì ném 'omx: ma 5 doi kho <bảng lệch>'; okrCuocSoan và okrDeXuat phải nằm trong danh sách bảng của vân tay (đối chứng: thước nhìn thấy hai bảng). Dọn: trả ownerId, xoá thoả thuận và công ty."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [apps/api/scripts/okr-mau/nap.ts, apps/api/test/okr-mau-cuoc-soan.spec.ts]

  - id: E8
    criterion: AC-8
    executor: judgment
    question: >-
      Đọc mục «Bộ OKR mẫu» của docs/setup.md như một người mới vào kho. Mục có nói rõ hai điều không:
      (1) `--xoa` và nạp lại gỡ cả cuộc soạn OKR trên chu kỳ, đơn vị hay người của bộ mẫu cùng các đề
      xuất của chúng, kể cả cuộc còn sót lại từ một lần xoá trước; (2) hàng chi phí AI của các cuộc đó
      được giữ lại, và lý do — đó là tiền đã tiêu thật và là số mà trần chi phí AI của tháng đọc. Chữ có
      tự đúc từ ghép tiếng Việt cho thuật ngữ kỹ thuật mà CONTEXT.md không có không?
    inputs: [docs/setup.md, CONTEXT.md, _acceptance/okr-mau-xoa-cuoc-soan/contract.md]
    expected: >-
      PASS khi mục nói đủ hai ý và lý do giữ chi phí; FAIL nêu ý còn thiếu hay chữ tự đúc.
    evidence_required: [run_id, verdict, rationale]
    paths: [docs/setup.md]

  - id: E9
    criterion: AC-9
    executor: script
    cmd: config:executors.script.omx_dot_bien
    expected: "exit 0; _acceptance/okr-mau-xoa-cuoc-soan/rang/dot-bien.mjs trên bản sao cây (ban-sao.mjs của ca-chap-chon-cach-ly), SO_CAP_KHAI = 7; mỗi lệnh chạy xanh một lần trên bản sao chưa phá (cặp chung lệnh dùng lại kết quả đó), mỗi cặp chạy lệnh của nó đỏ sau khi phá, và đầu ra đỏ có một dòng 'error:' chứa đúng chuỗi ghim: (a) bỏ lệnh xoá okrCuocSoan trong xoaTrong → omx_xoa đỏ 'omx: con cuoc soan mau'; (b) bỏ lệnh xoá okrDeXuat theo cuocSoanId → omx_xoa đỏ 'omx: con de xuat soan'; (c) tập cuộc chọn chỉ theo cycleId thuộc t.chuKy, bỏ mọi vế tiền tố → omx_mo_coi đỏ 'omx: cuoc mo coi con'; (d) thêm aiChiPhi.deleteMany theo taskId của cuộc → omx_xoa đỏ 'omx: chi phi soan bi doi'; (e) bỏ vế cuộc soạn khỏi tomTat → omx_xoa đỏ 'omx: dong in thieu dem cuoc soan'; (f) bỏ vế departmentId khỏi điều kiện chọn cuộc → omx_xoa đỏ 'omx: con cuoc ve-pb'; (g) bỏ vế nguoiMoUserId → omx_xoa đỏ 'omx: con cuoc ve-nguoi'. Chuỗi neo của mỗi cặp xuất hiện đúng một lần (không thì thoát 2 'KHONG DO DUOC'); tệp trả lại trong finally; số cặp đã chạy ≠ 7 → thoát 1. In 'DOT BIEN: 7/7 cap dat'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [apps/api/scripts/okr-mau/nap.ts, apps/api/scripts/okr-mau/lenh.ts, apps/api/test/okr-mau-cuoc-soan.spec.ts, _acceptance/okr-mau-xoa-cuoc-soan/rang/dot-bien.mjs]
