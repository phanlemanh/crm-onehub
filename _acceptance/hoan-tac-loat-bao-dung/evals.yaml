      - "apps/api/src/contacts/**"
      - "apps/api/src/companies/**"
      - "apps/api/src/deals/**"
      - "apps/api/test/hoan-tac-loat-bao-dung.spec.ts"
    expected: |
      exit 0; tren co so du lieu that cua luot test, goi QUA HTTP tRPC that (AppModule + supertest + phien that, nhu
      hoan-tac-loat-dung-id.spec.ts) <loai>.bulkArchive va <loai>.bulkRestore cho lo [dang dung a, da luu tru tu truoc p,
      khong ton tai x]; ma tran viet truoc 3 loai x {bulkArchive, bulkRestore} = 6 o, expect(o.length).toBe(6): moi o body co
      khoa errored === 0, bulkArchive succeeded 1 skipped 1 failed 1 changedIds [a]; bulkRestore failed 1 errored 0.
      CHIEU DO ghim: ban sao schema output bo errored -> do "hlb: may chu khong tra errored".

  - id: E3
    criterion: AC-3
