  - id: E16
    criterion: AC-8
    executor: judgment
    inputs:
      - "_acceptance/hoan-tac-loat-bao-dung/evidence/hlb-da-ve-1440.png"
    question: |
      Ghi chú cho người chấm: ảnh chụp bảng Cá nhân ngay sau khi người dùng bấm «Hoàn tác» cho một lần lưu trữ ba bản ghi,
      trong khi ba bản đó đã được người khác khôi phục từ trước. Bề rộng màn 1440.
      Nhìn ảnh: (1) người đọc có hiểu ngay ba bản ghi đang ở lại danh sách, không phải hệ thống gặp lỗi? (2) thông báo có
      dùng chữ «khôi phục» đúng bộ chữ của sản phẩm, không có «xoá», «lỗi» hay «chưa hoàn tác được»? (3) thông báo có nằm
      trong khung nhìn, không bị cắt? Nêu từng điểm kèm điều thấy trong ảnh.

