      - "apps/app/lib/messages/crm.ts"
      - "apps/app/test/hoan-tac-loat-bao-dung.dom.tsx"
    expected: |
      exit 0; baoLuuTruLoat that voi Toaster that, ma tran viet truoc 3 loai x 3 ca = 9, expect(o.length).toBe(9):
      (co loi le) {succeeded 2, skipped 1, failed 2, errored 1, message "loi-tho-may-chu", changedIds [a,b]} -> vung toast co
      bulk.boQua("2"), co bulk.chuaLuuTru("1"), co nut «Hoàn tác», KHONG chua "loi-tho-may-chu"; (loi het) {succeeded 0,
      skipped 0, failed 3, errored 3, message "loi-tho-may-chu", changedIds []} -> toast kieu error co bulk.chuaLuuTru("3"),
      KHONG chua chu «bị bỏ qua», khong co nut «Hoàn tác», khong chua "loi-tho-may-chu"; (tron, khong ban nao cat)
      {succeeded 0, skipped 1, failed 2, errored 1, changedIds []} -> toast kieu error co bulk.boQua("2") va
      bulk.chuaLuuTru("1"), khong co nut «Hoàn tác».
      CHIEU DO ghim: ban sao dem errored vao bo qua -> do "hlb: loi may chu hien thanh bi bo qua"; ban sao noi message vao
      toast -> do "hlb: toast in loi tho"; ban sao re nhanh theo errored === requested -> do "hlb: lo tron khong co
      loi bao canh bao".

