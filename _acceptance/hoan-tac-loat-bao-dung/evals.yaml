feature_slug: hoan-tac-loat-bao-dung
evals:
  - id: E1
    criterion: AC-1
    executor: test
    layer: logic
    cmd: config:executors.test.hlb_run_bulk
    paths:
      - "apps/api/src/crm/bulk.ts"
      - "apps/api/test/hoan-tac-loat-bao-dung.spec.ts"
    expected: |
      exit 0; runBulk that voi 4 id [ok, nul, mat, hong]: act tra {id} cho ok, null cho nul, nem NotFoundException cho mat,
      nem new Error("hong-that") cho hong -> ket qua === {requested 4, succeeded 1, skipped 1, failed 2, errored 1,
      changedIds ["ok"], message khac null}. spyOn(Logger.prototype, "error") goi dung 1 lan, doi so dau co recordId "hong",
      doi so hai === loi.stack cua dung doi tuong loi da nem (toBe, khong do chuoi co mat); spyOn(Logger.prototype, "warn") goi dung 1 lan voi recordId "mat".
      Doi chung: 4 id deu tra {id} -> errored 0, failed 0, error va warn goi 0 lan.
      CHIEU DO ghim: ban sao tinh NotFoundException vao errored -> do "hlb: khong con tinh la loi that"; ban sao bo
      logger.error -> do "hlb: loi that khong co dong log"; ban sao bo recordId khoi log -> do "hlb: log khong co id"; ban sao truyen err.message thay stack -> do
      "hlb: log khong co stack".

