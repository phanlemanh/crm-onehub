feature_slug: dai-luu-tru-dung-chung
evals:
  - id: E1
    criterion: AC-1
    executor: test
    layer: logic
    cmd: config:executors.test.dlt_dai
    paths:
      - "packages/ui/src/components/dai-luu-tru.tsx"
      - "packages/ui/test/dai-luu-tru.dom.tsx"
    expected: |
      exit 0; DaiLuuTru that cua packages/ui voi tieuDe "Đã lưu trữ ngày 15/09/2026", nhanKhoiPhuc "Khôi phục": dung 1
      phan tu [data-dai-luu-tru] nam trong khung [data-slot="dai-luu-tru"], textContent chua tieu de; bam nut ten
      «Khôi phục» (dispatchEvent pointerdown, mousedown, pointerup, click) -> onKhoiPhuc goi dung 1 lan. dangKhoiPhuc true -> nut :disabled, bam -> onKhoiPhuc goi 0 lan.
      Doi chung: dangKhoiPhuc false -> nut khong :disabled.
      CHIEU DO ghim: ban sao bo data-slot -> do "dlt: dai khong mang data-slot"; ban sao nut bo disabled khi dangKhoiPhuc ->
      do "dlt: dang khoi phuc van bam duoc".

  - id: E2
    criterion: AC-2
    executor: test
    layer: logic
    cmd: config:executors.test.dlt_khoa
    paths:
      - "packages/ui/src/components/dai-luu-tru.tsx"
      - "packages/ui/test/dai-luu-tru.dom.tsx"
    expected: |
      exit 0; KhoaLuuTru that boc 4 cho: input, button, div role=combobox tabIndex 0, div contenteditable=true tabIndex 0.
      Moi cho trong {combobox, contenteditable} co 4 bo dem rieng: onPointerDown, onMouseDown, onClick, onKeyDown.
      Ma tran viet truoc {combobox, contenteditable} x {pointerdown, mousedown, click, keydown Enter} x {khoa bat, khoa
      tat} = 16 phep, expect(o.length).toBe(16): moi su kien ban bang dispatchEvent (bubbles, cancelable)
      tren chinh phan tu, keydown la KeyboardEvent key Enter; khoa bat -> bo dem = 0, khoa tat -> bo dem = 1. Them:
      khoa bat -> input va button khop :disabled, [data-khoa-luu-tru] co; khoa tat -> khong :disabled, khong co
      [data-khoa-luu-tru].
      CHIEU DO ghim (moi bo chan mot ban sao): bo chan click -> do "dlt: khoa de lot click"; bo chan keydown -> do "dlt:
      khoa de lot phim"; bo chan pointerdown -> do "dlt: khoa de lot pointerdown"; bo chan mousedown -> do "dlt: khoa de lot
      mousedown"; fieldset bo disabled -> do "dlt: o nhap khong tat khi khoa".

  - id: E3
    criterion: AC-3
    executor: test
    layer: logic
    cmd: config:executors.test.vdc_dai_bao
    paths:
      - "apps/app/components/crm/record-sheet/**"
      - "packages/ui/src/components/dai-luu-tru.tsx"
      - "apps/app/test/vong-doi-mot-cach-cat.dom.tsx"
    expected: |
      exit 0; bai vdc-dai-bao cua ho so da ky vong-doi-mot-cach-cat chay lai KHONG SUA: ma tran 3 ngan x 2 trang thai,
      dai bao co chu, ngay, nut «Khôi phục» goi restore dung id, khoi phuc xong dai mat.

  - id: E4
    criterion: AC-3
    executor: test
    layer: logic
    cmd: config:executors.test.vdc_chi_doc
    paths:
      - "apps/app/components/crm/record-sheet/**"
      - "packages/ui/src/components/dai-luu-tru.tsx"
      - "apps/app/test/vong-doi-mot-cach-cat.dom.tsx"
    expected: |
      exit 0; bai vdc-chi-doc cua ho so da ky vong-doi-mot-cach-cat chay lai KHONG SUA: 3 ngan da cat, 15 o sua bam khong mo
      gi va khong goi update, menu «…» van mo duoc.

  - id: E5
    criterion: AC-3
    executor: test
    layer: logic
    cmd: config:executors.test.vdc_chu
    paths:
      - "apps/app/components/crm/record-sheet/**"
      - "apps/app/lib/messages/crm.ts"
      - "apps/app/test/vong-doi-mot-cach-cat.dom.tsx"
    expected: |
      exit 0; bai vdc-chu cua ho so da ky vong-doi-mot-cach-cat chay lai KHONG SUA: chu dai bao vi/en dung bo chu.

  - id: E6
    criterion: AC-4
    executor: script
    layer: logic
    cmd: config:executors.script.dlt_mot_noi
    paths:
      - "apps/app/**"
      - "_acceptance/dai-luu-tru-dung-chung/rang/mot-noi.mjs"
    expected: |
      exit 0 va "dai-luu-tru-dung-chung mot-noi: dat"; quet moi tep .ts/.tsx duoi apps/app tru apps/app/test/**: 0 tep chua
      "data-dai-luu-tru", "data-khoa-luu-tru", hay chua "<fieldset" cung voi bo chan capture (onPointerDownCapture,
      onMouseDownCapture, onClickCapture, onKeyDownCapture) — fieldset thuong cua man khac khong tinh; dung 3 tep company-sheet.tsx, contact-sheet.tsx,
      deal-sheet.tsx nhap KhoaLuuTru tu "@crm/ui/components/dai-luu-tru"; record-actions.tsx nhap DaiLuuTru tu cung cho
      va dung no trong JSX. Doi chung: so tep da quet > 100.
      CHIEU DO ghim: --chieu-do chep record-actions.tsx cua onehub truoc vong vao ban sao tam roi quet ban sao -> do
      "mot-noi: apps/app con tu dung dai luu tru" (goi ten tep).

  - id: E7
    criterion: AC-5
    executor: script
    layer: logic
    cmd: config:executors.script.dlt_bang_manh
    paths:
      - "docs/vong-doi.md"
      - "_acceptance/dai-luu-tru-dung-chung/rang/bang-manh.mjs"
    expected: |
      exit 0 va "dai-luu-tru-dung-chung bang-manh: dat"; trong muc «## Mảnh dùng chung» cua docs/vong-doi.md co dung 1 dong
      bang bat dau "| Dải báo bản ghi đã lưu trữ |"; o thu hai chua "có", "DaiLuuTru", "KhoaLuuTru", "packages/ui" va khong
      chua "chưa".
      CHIEU DO ghim: --chieu-do doc ban docs/vong-doi.md cua onehub truoc vong (git show) -> do "bang-manh: dai bao van ghi
      chua".

  - id: E8
    criterion: AC-6
    executor: script
    layer: backend-effect
    cmd: config:executors.script.dlt_man
    paths:
      - "apps/app/components/crm/record-sheet/**"
      - "packages/ui/src/components/dai-luu-tru.tsx"
      - "_acceptance/dai-luu-tru-dung-chung/rang/man.mjs"
      - "_acceptance/vong-doi-mot-cach-cat/rang/man.mjs"
    expected: |
      exit 0 va "dai-luu-tru-dung-chung man: dat"; rang goi lai phep do man da ky cua V2
      (_acceptance/vong-doi-mot-cach-cat/rang/man.mjs) tren may chu that cua phien do, anh ghi vao
      .acceptance-runs/dai-luu-tru-dung-chung/evidence (xoa anh cu truoc khi chay); V2 in "vong-doi-mot-cach-cat man: dat":
      buoc 1 va 3 updatedAt cua thoa thuan trong db khong doi khi bam o ten/mo ta; buoc 4 sau «Khôi phục» db archivedAt
      null.
      CHIEU DO ghim: --chieu-do chuyen tiep sang V2 (mo thoa thuan dang dung) -> do "man: khong thay dai luu tru".

  - id: E9
    criterion: AC-6
    executor: ui-check
    layer: ui-observed
    cmd: config:executors.script.dlt_man
    paths:
      - "apps/app/components/crm/record-sheet/**"
      - "packages/ui/src/components/dai-luu-tru.tsx"
      - "_acceptance/dai-luu-tru-dung-chung/rang/man.mjs"
    expected: |
      exit 0 va "dai-luu-tru-dung-chung man: dat"; buoc 1 (1440) va buoc 3 (390) cua V2: [data-dai-luu-tru] co chu dai bao
      va nut «Khôi phục», o ten :disabled, scrollWidth <= clientWidth o 390; rang chep vdc-ngan-da-cat-1440.png,
      vdc-ngan-da-cat-390.png thanh dlt-ngan-da-cat-1440.png, dlt-ngan-da-cat-390.png trong evidence cua ho so nay.
      Ho so da signed-off/machine-cleared, hoac --chieu-do, thi khong chep anh vao ho so.
    steps:
      - "Chay nguyen van dong lenh khai trong cmd (tien-de.mjs --chay), KHONG goi thang man.mjs"
      - "Buoc 1 (1440): thoa thuan da cat -> dlt-ngan-da-cat-1440.png"
      - "Buoc 3 (390): thoa thuan da cat -> dlt-ngan-da-cat-390.png"
    evidence_required:
      - "_acceptance/dai-luu-tru-dung-chung/evidence/dlt-ngan-da-cat-1440.png"
      - "_acceptance/dai-luu-tru-dung-chung/evidence/dlt-ngan-da-cat-390.png"

  - id: E10
    criterion: AC-7
    executor: judgment
    inputs:
      - "_acceptance/dai-luu-tru-dung-chung/evidence/dlt-ngan-da-cat-1440.png"
      - "_acceptance/dai-luu-tru-dung-chung/evidence/dlt-ngan-da-cat-390.png"
      - "_acceptance/vong-doi-mot-cach-cat/evidence/vdc-ngan-da-cat-1440.png"
      - "_acceptance/vong-doi-mot-cach-cat/evidence/vdc-ngan-da-cat-390.png"
    question: |
      Ghi chú cho người chấm: bốn ảnh chụp ngăn của một thoả thuận đã lưu trữ. Ảnh tên vdc-… là bản đã ký ngày 13/10
      trước khi dời mã; ảnh dlt-… là bản sau khi dải báo và vùng khoá dời sang thư viện giao diện chung. Đuôi -1440 và
      -390 là bề rộng màn. Tên thoả thuận và ngày có thể khác giữa hai lần chụp vì dữ liệu được gieo lại mỗi lần.
      So từng cặp cùng khổ: (1) dải báo «Đã lưu trữ ngày …» có cùng chữ, icon, màu, khung và vị trí không? (2) nút
      «Khôi phục» có cùng kiểu, cỡ và chỗ đặt không? (3) các ô của thẻ chi tiết có cùng vẻ chỉ đọc không? (4) ở 390 có gì
      bị cắt hay tràn mà bản cũ không có không? Nêu từng điểm kèm tên ảnh; khác do dữ liệu gieo (tên, ngày) thì bỏ qua.

  - id: E11
    criterion: AC-3
    executor: script
    layer: logic
    cmd: config:executors.script.dlt_v2_nguyen
    paths:
      - "apps/app/test/vong-doi-mot-cach-cat.dom.tsx"
      - "_acceptance/vong-doi-mot-cach-cat/rang/man.mjs"
      - "_acceptance/vong-doi-mot-cach-cat/evidence/vdc-ngan-da-cat-1440.png"
      - "_acceptance/vong-doi-mot-cach-cat/evidence/vdc-ngan-da-cat-390.png"
      - "_acceptance/dai-luu-tru-dung-chung/rang/v2-nguyen.mjs"
    expected: |
      exit 0 va "dai-luu-tru-dung-chung v2-nguyen: dat"; moc = git merge-base HEAD origin/onehub; 4 tep apps/app/test/vong-doi-mot-cach-cat.dom.tsx, _acceptance/vong-doi-mot-cach-cat/rang/
      man.mjs, _acceptance/vong-doi-mot-cach-cat/evidence/vdc-ngan-da-cat-1440.png, ...-390.png: git diff --quiet <moc>
      -- <tep> cho tung tep (ma tran 4 phep, dem = 4); va so lan xuat hien ".skip(", ".only(", ".todo(" trong tep kiem V2
      bang dung so do o <moc> (khong tang). Doi chung: ca 4 tep ton tai.
      CHIEU DO ghim: --chieu-do ghep them mot "test.skip(" vao ban sao tam cua tep kiem V2 roi dem -> do "v2-nguyen: bai V2
      bi sua" (goi ten tep).

  - id: E12
    criterion: AC-3
    executor: test
    layer: logic
    cmd: config:executors.test.dlt_ngan_cho
    paths:
      - "apps/app/components/crm/record-sheet/record-actions.tsx"
      - "packages/ui/src/components/dai-luu-tru.tsx"
      - "apps/app/test/dai-luu-tru-dung-chung.dom.tsx"
    expected: |
      exit 0; DaiLuuTruBanGhi that (record-actions.tsx) voi tRPC gia (Proxy thay useTRPC, nhu bai V2) cho ca 3 loai
      company, contact, deal; mutationFn cua <loai>.restore tra promise chua xong: bam «Khôi phục» hai lan bang userEvent ->
      <loai>.restore goi dung 1 lan voi {id}, nut khop :disabled. Doi chung: xong promise -> nut het :disabled. Ma tran
      viet truoc 3 loai, expect(o.length).toBe(3).
      CHIEU DO ghim: ban sao DaiLuuTruBanGhi bo dangKhoiPhuc -> do "dlt: ngan cho khoi phuc van bam duoc".
