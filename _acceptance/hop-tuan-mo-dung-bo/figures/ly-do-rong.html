<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Màn rỗng ba lý do</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #fafafa;
      --color-ink:    #171717;
      --color-muted:  #575757;
      --color-accent: #006B4F;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Lora', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1100px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.01em;
      line-height: 1.3;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Thiết kế mục 4 · AC-6 · AC-7 · cây quyết định</p>

      <rect width="100%" height="100%" fill="#fafafa"/>

      <line x1="320" y1="96" x2="320" y2="128" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>

      <text x="700" y="532" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">chua-ai-cap-nhat</text>
      <rect x="200" y="624" width="240" height="56" rx="28" fill="#fafafa"/>
      <rect x="200" y="624" width="240" height="56" rx="28" fill="rgba(23,23,23,0.03)" stroke="rgba(23,23,23,0.30)" stroke-width="1"/>
      <text x="320" y="648" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hàng số + bảng</text>
      <text x="320" y="664" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">lyDo null</text>

      <line x1="40" y1="708" x2="880" y2="708" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>
      <text x="40" y="728" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>

      <rect x="148" y="732" width="24" height="12" rx="6" fill="rgba(23,23,23,0.03)" stroke="rgba(23,23,23,0.30)" stroke-width="1"/>
      <text x="180" y="742" fill="#575757" font-size="9" font-family="'Geist', sans-serif">Màn hiện ra</text>

      <polygon points="292,738 304,732 316,738 304,744" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="324" y="742" fill="#575757" font-size="9" font-family="'Geist', sans-serif">Câu hỏi</text>

      <rect x="412" y="732" width="24" height="12" rx="6" fill="rgba(0,107,79,0.08)" stroke="#006B4F" stroke-width="1.4"/>
      <text x="444" y="742" fill="#575757" font-size="9" font-family="'Geist', sans-serif">Trạng thái mới thay màn «0/0 KR»</text>

</html>
