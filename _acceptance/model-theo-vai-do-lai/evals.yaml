    expected: "exit 0; cho MỖI ứng viên Soạn OKR trong ke-hoach.json đúng số tệp evidence/eval-soan-<biến thể>-<n>.json bằng số lượt soạn ghim (glm: eval-soan-flash-<n>.json giữ nguyên byte; ds: eval-soan-ds-<n>.json), mỗi tệp qua khuôn Zod cùng khoá với eval-soan-sau.json của VK5; moHinh bằng model của ứng viên và model Gateway trả khớp; judge = zai/glm-5.2-fast; bam.thuoc bằng bam.thuoc của mốc; bam.loiDan bằng mốc, lượt lệch thì bộ so in «loi dan lech moc <biến thể>-<n>» và lượt vắng khỏi so sánh; lượt khongNopDeXuat true phải có soDeXuat 0 (lệch → ghim «khong nop lech <biến thể>-<n>»), bộ so in «luot soan hong <biến thể>-<n>: khong nop de xuat» và lượt đó trượt ngưỡng; băm config.ts bản sửa tạm khác băm bản commit tại HEAD. Chiều đỏ trên bản sao: đổi bam.loiDan lượt ds-1 → dòng «loi dan lech moc ds-1» và ds của hàng soan-okr in lại mang ghi chú «lời dặn lệch mốc» và «chưa đủ số»; đổi moHinh lượt ds-2 → ghim «sai model soan ds-2»; xoá tệp lượt ds-2 → ghim «thieu luot soan ds-2»; đặt lượt ds-1 soDeXuat 0, khongNopDeXuat true, dat 18 hong 0 → dòng «luot soan hong ds-1: khong nop de xuat» và ds không đạt ở hàng soan-okr; sửa một byte eval-soan-flash-1.json → ghim «bang chung glm doi»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-5
    executor: script
    cmd: config:executors.script.mtv_so
    paths: [_acceptance/model-theo-vai-do-lai/rang/so-do.ts, _acceptance/model-theo-vai-do-lai/rang/khuon.ts, _acceptance/model-theo-vai-do-lai/rang/nguong.json, _acceptance/model-theo-vai-do-lai/evidence/**, docs/model-theo-vai.md]
    expected: "exit 0; evidence/bang-kien-nghi.json qua khuôn Zod; tập vai toEqual đúng năm hàng VIẾT TRƯỚC {tac-nhan, tro-ly-kho, soan-okr, judge-okr, may-soan-kho}; tập ứng viên mỗi hàng toEqual tập ứng viên của vai trong ke-hoach.json (tac-nhan {glm, ds}, tro-ly-kho {glm, ds, gem}, soan-okr {glm, ds}); chi phí phần ứng viên mỗi lượt TÍNH LẠI = Σ (token vào × giá vào + đọc cache × giá cache + token ra × giá ra) trên các dòng aiChiPhi có tính năng của vai trong kết xuất của lượt, giá đọc từ ke-hoach.json, và toEqual số trong bảng (sai số 1e-6); mỗi số khác của mỗi ứng viên và của mốc tính lại từ tệp bằng chứng nó trỏ (tệp mốc: _acceptance/tac-nhan-glm-5-3-cham/evidence/bang.md, _acceptance/bo-cau-hoi-mau/evidence/cham-bo-do-mau.md, _acceptance/chu-may-sinh-ten-moi/evidence/eval-soan-sau.json) và toEqual; cờ đạt ngưỡng mỗi ứng viên bằng kết quả luật vai trong rang/nguong.json; kiến nghị mỗi hàng bằng kết quả luật chọn của rang/nguong.json áp lên các ứng viên đạt; hàng «giữ» có thong_so_chua_do không rỗng; judge-okr kiến nghị «giữ zai/glm-5.2-fast» kèm judgeHong và judgeDuoiNguong; may-soan-kho «chưa có thước»; docs/model-theo-vai.md in lại từ json trùng từng byte. Chiều đỏ trên bản sao: sửa một ô số của ds → ghim «lech so <vai> ds»; ma trận biên viết trước trên bản sao số — luật vai: Tác nhân 4/5 → đạt, 3/5 → không đạt, hai biến thể cùng 4/5 → biến thể trung vị giây thấp hơn đại diện ứng viên, 4 lượt qua và 1 lượt sai model → chưa đủ số; Trợ lý kho 2 câu lỗi → đạt, 3 → không, một tầng kém mốc 2 câu → không; Soạn OKR mọi lượt 13/18 hỏng 3 → đạt, một lượt 12/18 → không, một lượt hỏng 4 → không, một lượt 18/18 không nộp đề xuất → không; luật chọn: không ứng viên đạt → giữ model đang chạy; một ứng viên đạt → ứng viên đó; hai ứng viên đạt chi phí khác nhau → theo luật chọn ghim; hai đạt cùng chi phí → luật phá hoà ghim; giữ phần ứng viên, nhân đôi usd judge của ds trong tóm tắt soạn → kiến nghị không đổi (đối chứng: nâng token ra của ds để chi phí phần ứng viên vượt glm → kiến nghị đổi); ứng viên «chưa đủ số» không vào luật chọn dù số đã có đạt — mỗi ô đúng kiến nghị; sửa kiến nghị một hàng trái luật → ghim «kien nghi trai luat <vai>»; xoá thong_so_chua_do của một hàng giữ → ghim «thong so chua do <vai>»; xoá hàng may-soan-kho → ghim «thieu vai may-soan-kho»; xoá ứng viên gem khỏi hàng tro-ly-kho → ghim «thieu ung vien tro-ly-kho gem»; sửa một byte docs/model-theo-vai.md → ghim «docs lech»; trỏ một số vào tệp không tồn tại → ghim tên tệp."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-6
    executor: script
    cmd: config:executors.script.mtv_so
    paths: [_acceptance/model-theo-vai-do-lai/rang/so-do.ts, _acceptance/model-theo-vai-do-lai/rang/chi-phi.ts, _acceptance/model-theo-vai-do-lai/evidence/chi-phi.json, _acceptance/model-theo-vai-do-lai/evidence/ke-hoach.json, _acceptance/model-theo-vai-do-lai/evidence/aichiphi-*.json]
