evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.mtv_so
    paths: [_acceptance/model-theo-vai-do-lai/rang/so-do.ts, _acceptance/model-theo-vai-do-lai/rang/do-tac-nhan.ts, _acceptance/model-theo-vai-do-lai/rang/khuon.ts, _acceptance/model-theo-vai-do-lai/evidence/**]
    expected: "exit 0; đọc evidence/tac-nhan.jsonl và từng evidence/aichiphi-<biến thể>-<lượt>.json qua khuôn Zod. Bảng VIẾT TRƯỚC {(ứng viên, biến thể)} × số lượt đọc từ evidence/ke-hoach.json (không viết số cứng; ke-hoach.json 21/10 khai glm:{flash, flash-low} và ds:{ds, ds-low}): tập (ứng viên, biến thể, lượt) toEqual đúng bảng, trừ lượt ghi «dừng vì trần» trong chi-phi.json. Mỗi lượt: số bước, token vào, token ra, giây của phiên con agent_builder TÍNH LẠI từ aiChiPhi và toEqual số trong jsonl; lượt hỏng vì quá trần mang bi_cat true; không hai lượt chồng giờ; hai lượt liền nhau của cùng ứng viên khác biến thể; model Gateway trả cho phiên con agent_builder bằng model của ứng viên đọc từ ke-hoach.json, lượt lệch hay thiếu in «sai model tac-nhan <biến thể>-<lượt>» và vắng khỏi kết luận; chỉ lượt biến thể -low mang băm bản sửa tạm; dòng jsonl và tệp aichiphi-, su-kien-, luot- của flash, flash-low trùng từng byte bản ở 49456c140 (git show), lệch → ghim «bang chung glm doi». rang/do-tac-nhan.ts có chặn đọc lại ô model trước eval → in «doc lai model». Chiều đỏ tự chạy trên bản sao: xoá một dòng ds → ghim cặp thiếu; sửa một số bước → ghim «lech aichiphi»; hai lượt chồng giờ → ghim «chong gio»; đổi băm một lượt ds thành băm bản sửa → ghim «ro suy luan ds»; bỏ chặn đọc lại trong bản sao mã → ghim «THIEU DOC LAI MODEL»; đổi model Gateway trả của một lượt ds thành zai/glm-5.2-fast (giả lượt modelTheoVai lùi mặc định) → dòng «sai model tac-nhan ds-<lượt>» xuất hiện và hàng tac-nhan của bảng in lại không đếm lượt đó; sửa một byte dòng flash trong bản sao jsonl → ghim «bang chung glm doi»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.mtv_so
    paths: [_acceptance/model-theo-vai-do-lai/rang/so-do.ts, _acceptance/model-theo-vai-do-lai/rang/do-suy-luan.ts, _acceptance/model-theo-vai-do-lai/evidence/do-suy-luan*.json]
    expected: "exit 0; với MỖI ứng viên Tác nhân trong ke-hoach.json có một tệp dò (glm: evidence/do-suy-luan.json giữ nguyên byte; ds: tệp dò của ds) do rang/do-suy-luan.ts ghi từ phản hồi thật của Gateway, ba mục {mac-dinh, low, high} cùng một câu, mỗi mục có model Gateway trả bằng model của ứng viên và usage gồm token ra và token suy luận, hoặc cờ khong_tra_suy_luan; bộ so in ba số cạnh nhau mỗi ứng viên, in «muc low toi nha cung cap <ứng viên>» khi token suy luận low < mac-dinh, «chua kiem duoc <ứng viên>» khi thiếu trường. Chiều đỏ trên bản sao: xoá mục low của ds → ghim «do suy luan thieu low ds»; đổi model một mục ds → ghim «sai model do suy luan ds»; xoá tệp dò của ds → ghim «thieu do suy luan ds»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: script
    cmd: config:executors.script.mtv_so
    paths: [_acceptance/model-theo-vai-do-lai/rang/so-do.ts, _acceptance/model-theo-vai-do-lai/rang/do-kho.ts, _acceptance/model-theo-vai-do-lai/evidence/kho/**]
    expected: "exit 0; cho MỖI ứng viên Trợ lý kho trong ke-hoach.json (glm: evidence/kho/luot-1 giữ nguyên byte; ds, gem: thư mục của ứng viên dưới evidence/kho/) và mỗi lượt ghim: có bảng theo tầng, theo kiểu chữ, dòng «Tổng», danh sách mã không đạt kèm nhãn, mã thoát script chấm, model Gateway trả cho kho và gốc, băm bo-mau.json, băm tai-lieu-config.ts bản sửa tạm và băm bản commit, kết xuất aiChiPhi của kho đo qua khuôn Zod và số dư Gateway trước, sau lượt. Bộ so: tập mã vòng một (CRM) toEqual tập mã câu có nhom khác «khong-phai-quy-dinh» trong bo-mau.json (46), tập mã vòng hai (Zalo) toEqual mọi mã của bo-mau.json (50); model kho Gateway trả bằng model của ứng viên; băm bo-mau.json bằng băm tệp hiện tại; băm bản sửa tạm khác băm bản commit và băm bản commit bằng git hash-object của tai-lieu-config.ts tại HEAD; lượt mang lỗi «không có ZDR» được đếm hỏng. Chiều đỏ trên bản sao: xoá một mã khỏi vòng hai của ds → ghim «thieu ma <mã>»; đổi model kho của gem thành zai/glm-5.2-fast → ghim «sai model kho gem»; đổi băm bo-mau → ghim «bo-mau lech»; đặt lượt ds lỗi «không có ZDR» → hàng tro-ly-kho in lại ds không đạt; sửa một byte tệp dưới kho/luot-1 → ghim «bang chung glm doi»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: script
