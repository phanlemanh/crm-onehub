<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cửa sổ cache 5 phút</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap&subset=vietnamese" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #fafafa;
      --color-ink:    #171717;
      --color-muted:  #575757;
      --color-accent: #006B4F;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Lora', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.01em;
      line-height: 1.3;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }

    .sub {
      font-size: 0.9rem;
      color: var(--color-muted);
      line-height: 1.5;
      max-width: 60rem;
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Cổng Phạm vi · chat-an-toan-truoc-r1 · gap-probe P1-2</p>
    <h1>Cửa sổ cache 5 phút: chấp nhận hay bịt?</h1>
    <p class="sub">Gateway gỡ model giữa hai lần đọc danh mục thì lượt chat trong khoảng đó vẫn hỏng. Người chọn một trong hai lựa chọn ở nhánh «còn hạn». AC liên quan: AC-6, AC-7, AC-11.</p>

    <svg viewBox="0 0 1000 664" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#575757"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#006B4F"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#fafafa"/>

      <line x1="500" y1="80" x2="500" y2="112" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 360 172 H 208 Q 200 172 200 180 V 312" fill="none" stroke="#006B4F" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <path d="M 640 172 H 792 Q 800 172 800 180 V 312" fill="none" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="320" y1="392" x2="320" y2="420" stroke="#575757" stroke-width="1.2" stroke-dasharray="4,3"/>
      <path d="M 316 424 H 178 Q 170 424 170 432 V 456" fill="none" stroke="#575757" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <path d="M 324 424 H 462 Q 470 424 470 432 V 456" fill="none" stroke="#575757" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <rect x="228" y="148" width="112" height="16" rx="2" fill="#fafafa"/>
      <text x="284" y="160" fill="#006B4F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">còn hạn (≤5 phút)</text>

      <rect x="688" y="148" width="64" height="16" rx="2" fill="#fafafa"/>
      <text x="720" y="160" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">hết hạn</text>

      <rect x="328" y="396" width="92" height="16" rx="2" fill="#fafafa"/>
      <text x="332" y="408" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.06em">NGƯỜI CHỌN MỘT</text>

      <rect x="380" y="32" width="240" height="48" rx="20" fill="#fafafa"/>
      <rect x="380" y="32" width="240" height="48" rx="20" fill="rgba(23,23,23,0.03)" stroke="rgba(23,23,23,0.30)" stroke-width="1"/>
      <text x="500" y="60" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Gateway gỡ model đã chọn</text>

      <polygon points="500,112 640,172 500,232 360,172" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="500" y="164">Danh mục trong bộ nhớ </tspan><tspan x="500" y="180">còn hạn?</tspan></text>
      <text x="500" y="200" fill="#666666" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AC-7</text>

      <rect x="40" y="312" width="320" height="80" rx="20" fill="#fafafa"/>
      <rect x="40" y="312" width="320" height="80" rx="20" fill="rgba(0,107,79,0.08)" stroke="#006B4F" stroke-width="1.4"/>
      <text fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif"><tspan x="64" y="340">Lượt chat vẫn hỏng — </tspan><tspan x="64" y="356">ghi <tspan font-family="'Geist Mono', monospace" font-weight="500">model.khong-tim-thay</tspan></tspan></text>
      <text x="64" y="376" fill="#666666" font-size="9" font-family="'Geist Mono', monospace">AC-11</text>

      <rect x="640" y="312" width="320" height="120" rx="20" fill="#fafafa"/>
      <rect x="640" y="312" width="320" height="120" rx="20" fill="rgba(23,23,23,0.03)" stroke="rgba(23,23,23,0.30)" stroke-width="1"/>
      <text fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif"><tspan x="664" y="340">Đọc danh mục mới → thiếu id → </tspan><tspan x="664" y="356">lùi model mặc định — </tspan><tspan x="664" y="372">ghi <tspan font-family="'Geist Mono', monospace" font-weight="500">model.bi-go-lui</tspan>, </tspan><tspan x="664" y="388">Cài đặt hiện hộp báo</tspan></text>
      <text x="664" y="412" fill="#666666" font-size="9" font-family="'Geist Mono', monospace">AC-6</text>

      <rect x="40" y="456" width="260" height="120" rx="6" fill="#fafafa"/>
      <rect x="40" y="456" width="260" height="120" rx="6" fill="#ffffff" stroke="rgba(23,23,23,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="56" y="468" width="20" height="16" rx="2" fill="transparent" stroke="rgba(23,23,23,0.40)" stroke-width="0.8"/>
      <text x="66" y="480" fill="#575757" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle">A</text>
      <text fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif"><tspan x="56" y="508">Chấp nhận cửa sổ 5 phút </tspan><tspan x="56" y="524">như ngoại lệ có tên</tspan></text>
      <text x="56" y="548" fill="#575757" font-size="12" font-family="'Geist', sans-serif">rẻ, giao kịp 10/10</text>

      <rect x="340" y="456" width="260" height="120" rx="6" fill="#fafafa"/>
      <rect x="340" y="456" width="260" height="120" rx="6" fill="#ffffff" stroke="rgba(23,23,23,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="356" y="468" width="20" height="16" rx="2" fill="transparent" stroke="rgba(23,23,23,0.40)" stroke-width="0.8"/>
      <text x="366" y="480" fill="#575757" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle">B</text>
      <text fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif"><tspan x="356" y="508">Thêm thử lại trong lượt </tspan><tspan x="356" y="524">bằng model mặc định</tspan></text>
      <text fill="#575757" font-size="12" font-family="'Geist', sans-serif"><tspan x="356" y="548">bịt cửa sổ, thêm khoảng nửa ngày </tspan><tspan x="356" y="564">và một lớp bọc model ở bước</tspan></text>

      <circle cx="320" cy="424" r="4" fill="#171717"/>

      <line x1="40" y1="604" x2="960" y2="604" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>
      <text x="40" y="620" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>

      <rect x="40" y="636" width="24" height="12" rx="6" fill="rgba(23,23,23,0.03)" stroke="rgba(23,23,23,0.30)" stroke-width="1"/>
      <text x="72" y="646" fill="#575757" font-size="9" font-family="'Geist', sans-serif">Bắt đầu / kết thúc</text>

      <polygon points="208,642 220,636 232,642 220,648" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="240" y="646" fill="#575757" font-size="9" font-family="'Geist', sans-serif">Câu hỏi rẽ nhánh</text>

      <rect x="364" y="636" width="24" height="12" rx="2" fill="#ffffff" stroke="rgba(23,23,23,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="396" y="646" fill="#575757" font-size="9" font-family="'Geist', sans-serif">Lựa chọn của người</text>

      <rect x="540" y="636" width="24" height="12" rx="6" fill="rgba(0,107,79,0.08)" stroke="#006B4F" stroke-width="1.4"/>
      <text x="572" y="646" fill="#575757" font-size="9" font-family="'Geist', sans-serif">Cửa sổ cần quyết</text>

      <line x1="708" y1="642" x2="736" y2="642" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="744" y="646" fill="#575757" font-size="9" font-family="'Geist', sans-serif">Nhánh</text>

      <line x1="808" y1="642" x2="836" y2="642" stroke="#575757" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="844" y="646" fill="#575757" font-size="9" font-family="'Geist', sans-serif">Người quyết</text>
    </svg>
  </div>
</body>
</html>
