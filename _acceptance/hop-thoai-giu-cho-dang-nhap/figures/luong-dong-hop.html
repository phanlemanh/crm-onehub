<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luồng đóng hộp theo trạng thái</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #fafafa;
      --color-ink:     #171717;
      --color-muted:   #575757;
      --color-accent:  #006B4F;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1240px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Cổng Phạm vi · hop-thoai-giu-cho-dang-nhap</p>
    <h1>Luồng đóng hộp theo trạng thái</h1>

    <svg viewBox="0 0 1160 640" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#575757"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#006B4F"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#fafafa"/>

      <!-- ============ ARROWS (behind nodes) ============ -->

      <!-- Fork từ «Người đóng hộp» — 3 đường -->
      <!-- p1: Bấm ra ngoài -->
      <path d="M 548 88 L 548 100 Q 548 112 536 112 L 212 112 Q 200 112 200 124 L 200 152"
            fill="none" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- p2: Esc / X / Huỷ / vuốt (thẳng) -->
      <line x1="600" y1="88" x2="600" y2="152" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- p3: Lưu xong (máy đóng) -->
      <path d="M 652 88 L 652 128 Q 652 140 664 140 L 968 140 Q 980 140 980 152 L 980 176"
            fill="none" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Diamond A ra: CHƯA -> merge; CÓ -> "Không làm gì" (accent, trọng tâm) -->
      <path d="M 300 200 L 348 200 Q 360 200 360 212 L 360 316"
            fill="none" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="200" y1="248" x2="200" y2="312" stroke="#006B4F" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- Diamond B ra: CHƯA -> merge; CÓ -> "Hỏi" -->
      <path d="M 500 200 L 452 200 Q 440 200 440 212 L 440 316"
            fill="none" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="600" y1="248" x2="600" y2="296" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- "Hỏi" ra: Tiếp tục sửa / Bỏ -->
      <line x1="500" y1="352" x2="500" y2="456" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="700" y1="352" x2="700" y2="456" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ============ ARROW LABELS ============ -->

      <rect x="314" y="88" width="120" height="16" rx="2" fill="#fafafa"/>
      <text x="374" y="100" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BẤM RA NGOÀI</text>

      <rect x="612" y="104" width="156" height="16" rx="2" fill="#fafafa"/>
      <text x="620" y="116" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.04em">ESC · X · HUỶ · VUỐT</text>

      <rect x="736" y="116" width="168" height="16" rx="2" fill="#fafafa"/>
      <text x="816" y="128" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">LƯU XONG (MÁY ĐÓNG)</text>

      <rect x="312" y="176" width="36" height="16" rx="2" fill="#fafafa"/>
      <text x="330" y="188" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CHƯA</text>

      <rect x="452" y="176" width="36" height="16" rx="2" fill="#fafafa"/>
      <text x="470" y="188" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CHƯA</text>

      <rect x="210" y="272" width="32" height="16" rx="2" fill="#fafafa"/>
      <text x="214" y="284" fill="#006B4F" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.08em">CÓ</text>

      <rect x="610" y="264" width="32" height="16" rx="2" fill="#fafafa"/>
      <text x="614" y="276" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.08em">CÓ</text>

      <rect x="510" y="396" width="108" height="16" rx="2" fill="#fafafa"/>
      <text x="514" y="408" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.06em">TIẾP TỤC SỬA</text>

      <rect x="710" y="396" width="32" height="16" rx="2" fill="#fafafa"/>
      <text x="714" y="408" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.08em">BỎ</text>

      <!-- ============ NODES ============ -->

      <!-- N1 Start: Người đóng hộp -->
      <rect x="500" y="40" width="200" height="48" rx="24" fill="rgba(23,23,23,0.03)" stroke="rgba(23,23,23,0.30)" stroke-width="1"/>
      <text x="600" y="68" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Người đóng hộp</text>

      <!-- N2 Diamond: Đã có thay đổi? (nhánh Bấm ra ngoài) -->
      <polygon points="200,152 300,200 200,248 100,200" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="200" y="204" fill="#171717" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đã có thay đổi?</text>

      <!-- N3 Diamond: Đã có thay đổi? (nhánh Esc/X/Huỷ/vuốt) -->
      <polygon points="600,152 700,200 600,248 500,200" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="600" y="204" fill="#171717" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đã có thay đổi?</text>

      <!-- N4 End: Đóng, không hỏi (Lưu xong) -->
      <rect x="900" y="176" width="160" height="48" rx="24" fill="rgba(23,23,23,0.03)" stroke="rgba(23,23,23,0.30)" stroke-width="1"/>
      <text x="980" y="194" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đóng, không hỏi</text>
      <text x="980" y="212" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">bất kể trạng thái</text>

      <!-- N5 End (merge): Đóng như cũ -->
      <rect x="320" y="316" width="160" height="48" rx="24" fill="rgba(23,23,23,0.03)" stroke="rgba(23,23,23,0.30)" stroke-width="1"/>
      <text x="400" y="344" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đóng như cũ</text>

      <!-- N6 End (focal): Không làm gì, chữ còn -->
      <rect x="120" y="312" width="160" height="56" rx="28" fill="rgba(0,107,79,0.08)" stroke="#006B4F" stroke-width="1.4"/>
      <text x="200" y="336" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Không làm gì</text>
      <text x="200" y="356" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">chữ còn nguyên</text>

      <!-- N7 Diamond: hộp hỏi lại -->
      <polygon points="600,296 700,352 600,408 500,352" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="600" y="346" fill="#171717" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bỏ những gì</text>
      <text x="600" y="360" fill="#171717" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">vừa nhập?</text>

      <!-- N8 End: Tiếp tục sửa -->
      <rect x="420" y="456" width="160" height="48" rx="24" fill="rgba(23,23,23,0.03)" stroke="rgba(23,23,23,0.30)" stroke-width="1"/>
      <text x="500" y="474" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tiếp tục sửa</text>
      <text x="500" y="492" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">về ô đang gõ</text>

      <!-- N9 End: Bỏ -->
      <rect x="628" y="456" width="144" height="48" rx="24" fill="rgba(23,23,23,0.03)" stroke="rgba(23,23,23,0.30)" stroke-width="1"/>
      <text x="700" y="474" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bỏ</text>
      <text x="700" y="492" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">đóng hộp</text>

      <!-- ============ GHI CHÚ (annotation callout) ============ -->
      <text x="1140" y="24" fill="#171717" font-size="13" font-style="italic" font-family="'Lora', serif" text-anchor="end">Có thay đổi = đã gõ vào ô thường,</text>
      <text x="1140" y="40" fill="#171717" font-size="13" font-style="italic" font-family="'Lora', serif" text-anchor="end">hoặc chỗ gọi tự khai; ô tìm, ô lọc</text>
      <text x="1140" y="56" fill="#171717" font-size="13" font-style="italic" font-family="'Lora', serif" text-anchor="end">không tính.</text>
      <path d="M 980 60 Q 700 90 400 130" fill="none" stroke="rgba(23,23,23,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="400" cy="130" r="2" fill="#171717"/>

      <!-- ============ LEGEND ============ -->
      <line x1="100" y1="552" x2="1060" y2="552" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>
      <text x="100" y="568" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>

      <rect x="100" y="584" width="28" height="14" rx="7" fill="rgba(23,23,23,0.03)" stroke="rgba(23,23,23,0.30)" stroke-width="1"/>
      <text x="136" y="595" fill="#575757" font-size="9" font-family="'Geist', sans-serif">Bắt đầu / kết thúc</text>

      <polygon points="340,584 352,591 340,598 328,591" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="364" y="595" fill="#575757" font-size="9" font-family="'Geist', sans-serif">Điểm quyết định</text>

      <line x1="560" y1="591" x2="592" y2="591" stroke="#006B4F" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="600" y="595" fill="#575757" font-size="9" font-family="'Geist', sans-serif">Giữ chữ khi bấm ra ngoài (trọng tâm)</text>

      <line x1="900" y1="591" x2="932" y2="591" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="940" y="595" fill="#575757" font-size="9" font-family="'Geist', sans-serif">Nhánh khác</text>
    </svg>
  </div>
</body>
</html>
