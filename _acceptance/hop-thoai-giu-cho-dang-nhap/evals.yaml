schema_version: 1
feature_slug: hop-thoai-giu-cho-dang-nhap
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.hg_bam_ngoai
    paths: [packages/ui/src/components/dialog.tsx, packages/ui/src/components/giu-thay-doi.tsx, packages/ui/test/giu-thay-doi.dom.tsx]
    expected: "exit 0; bài dựng một Dialog thật của packages/ui (Radix, không giả) có một Input, onOpenChange là hàm đếm. Ca đã gõ: userEvent gõ «Hợp đồng» vào ô, bắn pointerdown lên lớp phủ [data-slot=dialog-overlay] → [data-slot=dialog-content] vẫn có trong DOM, ô vẫn mang giá trị «Hợp đồng», số lời gọi onOpenChange = 0, không phần tử [role=alertdialog] nào. Đối chứng dương cùng fixture: chưa gõ, bấm lớp phủ → nội dung rời DOM, onOpenChange được gọi đúng 1 lần với false. CHIỀU ĐỎ: (1) bản sao dialog.tsx gỡ hẳn bộ giữ (gốc và phần nội dung) → ca đã gõ đỏ, bài in «bam-ngoai: hop dong du da go (onOpenChange goi 1 lan)»; (2) bản sao chỉ bỏ nhánh preventDefault ở onInteractOutside → hộp vẫn không đóng nhưng hỏi lại, ca đã gõ đỏ, bài in «bam-ngoai: bam ngoai ma hoi lai»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.hg_hoi_lai
    paths: [packages/ui/src/components/dialog.tsx, packages/ui/src/components/confirm-dialog.tsx, packages/ui/src/components/giu-thay-doi.tsx, packages/ui/src/lib/messages.ts, packages/ui/test/giu-thay-doi.dom.tsx]
    expected: "exit 0; cùng fixture E1, locale vi. MA TRẬN VIẾT TRƯỚC 2 đường (Esc trên ô đang gõ, bấm [data-slot=dialog-close]) × 3 trả lời (Tiếp tục sửa, Esc trên hộp hỏi, Bỏ) = 6 ca đã gõ, cộng 2 ca chưa gõ. Mỗi ca đã gõ: sau đường đóng có đúng một [role=alertdialog] với tiêu đề «Bỏ những gì vừa nhập?» và hai nút «Tiếp tục sửa», «Bỏ»; hộp đang sửa còn trong DOM; onOpenChange = 0. Tiếp tục sửa và Esc trên hộp hỏi: alertdialog rời DOM, ô vẫn «Hợp đồng», document.activeElement là ô đó, onOpenChange = 0. Bỏ: cả hai rời DOM, onOpenChange gọi đúng 1 lần với false. Ca chưa gõ: Esc và X đóng ngay, không alertdialog, onOpenChange = 1. CHIỀU ĐỎ: bản sao lớp gốc báo thẳng onOpenChange(false) không qua bộ giữ → ca Esc-đã-gõ đỏ, bài in «hoi-lai: dong khong hoi (esc)»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.hg_sheet
    paths: [packages/ui/src/components/sheet.tsx, packages/ui/src/components/giu-thay-doi.tsx, packages/ui/test/giu-thay-doi.dom.tsx]
    expected: "exit 0; Sheet thật của packages/ui có một Input và một Button bọc SheetClose asChild. BẢNG VIẾT TRƯỚC 4 đường (lớp phủ [data-slot=sheet-overlay], Esc, [data-slot=sheet-close], nút SheetClose) × 2 trạng thái = 8 ca, mỗi ca khẳng định ba trường (hộp còn mở?, có alertdialog?, số lời gọi onOpenChange) so toEqual với bảng: đã gõ → (mở, không, 0) cho lớp phủ và (mở, có, 0) cho ba đường còn lại; chưa gõ → (đóng, không, 1) cho cả bốn. Bài so cả bảng 8 dòng, không đếm riêng. CHIỀU ĐỎ: bản sao sheet.tsx không cắm bộ nhận vào SheetContent → dòng «nút SheetClose · đã gõ» đỏ, bài in bảng thực tế cạnh bảng viết trước."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.hg_drawer
    paths: [packages/ui/src/components/drawer.tsx, packages/ui/src/components/giu-thay-doi.tsx, packages/ui/test/giu-thay-doi.dom.tsx]
    expected: "exit 0; Drawer thật (vaul) của packages/ui mở có kiểm soát, có một Textarea. Ca đã gõ: bấm lớp phủ [data-slot=drawer-overlay] → drawer còn mở, chữ còn, onOpenChange = 0, không alertdialog; Esc → alertdialog hiện, onOpenChange = 0; gọi onRelease của gốc vaul thật với tỉ lệ kéo đã vượt ngưỡng đóng (qua onDrag, lấy từ prop của Root thật, không gọi hàm của bài) → alertdialog hiện, drawer còn mở, chữ còn; và khi đã gõ, gốc vaul nhận dismissible=false. Đối chứng: chưa gõ, cùng ba đường → đóng, onOpenChange = 1 mỗi đường. Bài này KHÔNG phải cú vuốt thật (DOM giả không có cử chỉ vaul); cú vuốt thật do E10 bước 5 đo. CHIỀU ĐỎ: bản sao drawer.tsx bỏ bộ giữ ở gốc → ca vuốt-đã-gõ đỏ, bài in «drawer: dong khi vuot da go»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.hg_may_dong
    paths: [packages/ui/src/components/dialog.tsx, packages/ui/src/components/giu-thay-doi.tsx, packages/ui/test/giu-thay-doi.dom.tsx]
    expected: "exit 0; Dialog có kiểm soát trong một cha có nút «Lưu» đặt open=false. Đã gõ rồi bấm Lưu → nội dung rời DOM, không [role=alertdialog] nào xuất hiện trong suốt quá trình (bài theo dõi bằng MutationObserver), onOpenChange = 0. Mở lại → bấm lớp phủ đóng ngay (trạng thái sạch). Ca gỡ hẳn Dialog khỏi cây khi đã gõ → không alertdialog, không lỗi console. Ca nút lưu bọc DialogClose có dongNgay: đã gõ, bấm → đóng, không alertdialog. HỘP KHÔNG KIỂM SOÁT (DialogTrigger, không truyền open, ma trận viết trước 4 ca): đã gõ + bấm lớp phủ → còn mở, không alertdialog; đã gõ + Esc → alertdialog, Bỏ → đóng; đã gõ + nút DialogClose không dongNgay → alertdialog; đã gõ + nút DialogClose có dongNgay → đóng không hỏi. CHIỀU ĐỎ: bản sao bộ giữ không xoá cờ khi open chuyển về true → ca mở lại đỏ, bài in «may-dong: mo lai van ban»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

