    expected: "exit 0; -t ttp-o-tep của apps/app/test/truong-tep.dom.tsx. Dựng ô Tệp thật qua OTruongPhieu (apps/app/components/crm/fields/kieu-truong.tsx) trong LocaleProvider vi với kho tRPC giả; dữ liệu tepTheoTruong rút qua schema TepTrongO thật (round-trip). Ma trận 3 trạng thái × 4 cặp cờ: {có tệp, bản ghi đã lưu trữ, khoá tắt} × {coTheMo, coTheXoa} ∈ {true,false}² = 12 ô; hai cờ đến từ đúng trường của tệp trong byId (đầu vào rút qua schema TepTrongO thật, cờ không tính ở máy khách). Đáp án viết tay mỗi ô: nút «Mở» bật hay khoá, nút «Xoá» có hay vắng (bản ghi đã lưu trữ: luôn vắng), dòng lý do («Chỉ quản trị mở được tệp.» / «Kho tệp chưa bật trên máy chủ nên chưa tải tệp lên được.», chữ đọc từ bảng chữ thật), vùng tải bật hay khoá. Lệch thì ném 'ttp o tep: <trang thai> <quyen> <ve>'. Số ô khác 12 thì ném 'ttp o tep: thieu o <n>'. Thêm: tên tệp không mang translate=\"no\" thì ném 'ttp o tep: dich ten'; nút «Mở», «Xoá» không có aria-label chứa tên tệp thì ném 'ttp o tep: nhan nut'. Quét mã: kieu-truong.tsx và tệp ô Tệp không import vai hay so sánh role (TypeScript compiler API, tìm chuỗi 'admin', 'owner', isWorkspaceAdmin); có thì ném 'ttp o tep: quyen tu tinh <tep>:<dong>'. Đối chứng dương: ô có tệp, coTheMo true: «Mở» bật; khoá thì ném 'ttp o tep: doi chung'. Chiều đỏ trong lịch sử: trên onehub KIEU_TRUONG không có FILE, ném 'ttp o tep: co tep true thieu o'."
