    criterion: AC-4
    executor: test
    layer: backend-effect
    cmd: config:executors.test.ttp_quyen
    expected: "exit 0; -t ttp-quyen của apps/api/test/truong-tep.spec.ts. Cô lập như E1. Fixture: thoả thuận có trường FILE với hai tệp; ba người thật ở bảng member: Q (admin), N (member), O (okr). Ma trận viết trước 3 vai × 6 thủ tục (deals.byId, fieldFiles.status, requestUpload, complete, downloadUrl, remove) = 18 ô, đáp án viết tay theo bảng mục 4 của design doc (remove theo Hỏi-2 lối đã duyệt). Với mỗi ô: kết quả khác đáp án thì ném 'ttp quyen: <vai> <thu tuc> <ket qua>'. Thêm: N gọi downloadUrl: lời trả chứa chuỗi 'http' thì ném 'ttp quyen: lo url'. Q gọi downloadUrl: URL không mang hạn, hay hạn > 300 giây sau lúc gọi (đọc tham số hạn của URL ký kho giả) thì ném 'ttp quyen: han <giay>'. O gọi deals.byId: không bị từ chối KHONG_TRONG_PHAM_VI thì ném 'ttp quyen: okr doc duoc'. Số ô khác 18 thì ném 'ttp quyen: thieu o <n>'. Cờ trong byId: với Q và N (O bị chặn trước) × 2 tệp (F1 do N tải, F2 do Q tải) = 4 ô, coTheMo và coTheXoa khác đáp án viết tay (Q: mở true, xoá true cả hai; N: mở false cả hai, xoá true cho F1, false cho F2 theo Hỏi-2 lối khuyến nghị) thì ném 'ttp quyen: co <vai> <tep> <co>'; số ô khác 4 thì ném 'ttp quyen: thieu co <n>'. Đối chứng dương cùng fixture: Q đọc byId thấy hai tệp; không thì ném 'ttp quyen: doi chung'. Chiều đỏ: đột biến tay lúc dựng (coTheMoTep trả true cho mọi vai) phải ném 'ttp quyen: member downloadUrl url', ghi vào sổ S3."
