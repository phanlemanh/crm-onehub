  - id: E2
    criterion: AC-2
    executor: test
    layer: backend-effect
    cmd: config:executors.test.ttp_tai_len
    expected: "exit 0; -t ttp-tai-len của apps/api/test/truong-tep.spec.ts. Cô lập như E1; kho Blob giả như E1 giữ byte được PUT theo pathname. Fixture qua đường ghi thật: một thoả thuận, một công ty, một cá nhân (service thật); mỗi loại một trường FILE bật showOnSheet, showOnTable; thêm một thoả thuận thứ hai không có tệp. Bốn tệp mẫu sinh trong test bằng byte đầu thật của từng kiểu (PDF '%PDF-1.4', DOCX là zip có word/document.xml dựng bằng JSZip, PNG '89 50 4E 47 0D 0A 1A 0A', JPEG 'FF D8 FF E0'), mỗi tệp một nội dung khác. Với mỗi loại bản ghi × bốn tệp (12 ô cố định): requestUpload → PUT byte vào URL kho giả → complete. (a) URL của requestUpload có host là host kho giả, không phải host API; khác thì ném 'ttp tai len: url qua api <url>'. (b) Đọc db.fieldFile của bản ghi: thiếu hàng, kieu khác kiểu nhận theo byte, kichThuoc khác số byte, sha256 khác sha256 tính lại trong test, taiBoiId khác người gọi thì ném 'ttp tai len: <loai> <tep> <cot>'. Số ô đã so khác 12 thì ném 'ttp tai len: thieu o <n>'. (c) byId của từng loại: tepTheoTruong[<khoá>] không đủ bốn tệp theo đúng thứ tự tải thì ném 'ttp tai len: byId <loai> <ten>'; phần tử không parse được bằng schema TepTrongO của packages/validation/src/tep-truong.ts thì ném 'ttp tai len: khuon <loai>'. (d) deals.list, companies.list, contacts.list, deals.board: soTepTheoTruong[<khoá>] khác 4 cho bản ghi có tệp hay khác 0 cho thoả thuận thứ hai thì ném 'ttp tai len: dem <thu tuc> <n>'. Đối chứng dương: tệp PDF mẫu đặt đuôi .docx vẫn được nhận và kieu ghi PDF (kiểu theo byte); ghi DOCX thì ném 'ttp tai len: kieu theo ten'. Chiều đỏ trong lịch sử: trên onehub không có fieldFiles.requestUpload, ném 'ttp tai len: DEAL pdf thieu thu tuc'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
