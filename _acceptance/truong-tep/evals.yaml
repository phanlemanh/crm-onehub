  - id: E2b
    criterion: AC-2
    executor: test
    layer: backend-effect
    cmd: config:executors.test.ttp_blob_that
    expected: "exit 0 VÀ stdout có '0 skip' và ít nhất 3 'pass' của ttp-blob-that (bun test in số bài) — exit 0 mà có bài bị bỏ hay 0 bài chạy là không đo được, không phải đạt; -t ttp-blob-that của apps/api/test/truong-tep-blob-that.spec.ts; tệp chỉ chạy khi TTB_BLOB_THAT=1 (describe.skipIf, để bộ suite thường trên CI không có khoá bỏ qua nó); lệnh của eval đặt sẵn cờ. Cờ bật mà TEP_BAN_GHI_BLOB_TOKEN vắng hay rỗng thì ném 'ttp blob that: thieu khoa' (không bỏ qua). Cờ bật mà khoá bằng KHO_TAI_LIEU_BLOB_TOKEN hay BLOB_READ_WRITE_TOKEN thì ném 'ttp blob that: muon khoa kho khac'. Trên kho Blob riêng tư thật, qua service thật (không kho giả): một thoả thuận và trường FILE mang tiền tố ca; requestUpload → fetch PUT một PDF 8 KB sinh trong test → complete. (a) downloadUrl bởi quản trị rồi fetch: mã khác 200 hay sha256 byte tải về khác sha256 đã PUT thì ném 'ttp blob that: tai ve <ma> <sha>'. (b) fetch đường dẫn trần của Blob (URL không ký, dựng từ pathname và host kho): mã 200 thì ném 'ttp blob that: khong rieng tu'. (c) remove tệp rồi chờ lượt xoá sau commit; fetch lại URL đã ký ở (a): mã 200 thì ném 'ttp blob that: xoa con <ma>'; db.blobChoXoa còn hàng của pathname thì ném 'ttp blob that: hang cho xoa con'. Cuối ca lưu trữ rồi xoá vĩnh viễn thoả thuận, đếm lại Blob mang tiền tố ca bằng list của @vercel/blob: khác 0 thì ném 'ttp blob that: don de lai <n>'. Đối chứng dương cùng fixture: ngay sau complete, fetch URL ký trả 200; không thì ném 'ttp blob that: doi chung'. Chiều đỏ: trên onehub thủ tục không có, ném 'ttp blob that: thieu thu tuc'; vế (b) chứng bằng đột biến tay lúc dựng (đổi access sang public ở blob-tep-truong.ts trong bản sao) phải ném 'ttp blob that: khong rieng tu', ghi vào sổ S3."
