doi: doi chung'. Chiều đỏ trong lịch sử: trên onehub không đường purge nào xoá Blob — chứng bằng đột biến tay lúc dựng (bỏ ghi hàng chờ ở deals.purge) phải ném 'ttp vong doi: deals.purge xoa []', ghi vào sổ S3."
