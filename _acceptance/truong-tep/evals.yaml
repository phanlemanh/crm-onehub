    executor: test
    layer: backend-effect
    cmd: config:executors.test.ttp_tao_truong
    expected: "exit 0; -t ttp-tao-truong của apps/api/test/truong-tep.spec.ts trên kho thử của lượt. Cô lập: mọi trường và bản ghi của ca mang tiền tố khoá 'ttp_<ca>_'; đầu ca fields.list có trường mang tiền tố ấy thì ném 'ttp <ca>: lan <n>'; cuối ca lưu trữ trường đã tạo. Kho Blob giả trong bộ nhớ bơm bằng overrideProvider (khuôn khoNguonGia của packages/db/test/blob-nguon-gia.ts). (a) Với mỗi entity {DEAL, COMPANY, CONTACT}: fields.create với type FILE bởi quản trị; fields.list không trả trường ấy với type 'FILE' thì ném 'ttp tao truong: <entity> khong luu'. Số ô khác 3 thì ném 'ttp tao truong: thieu o <n>'. (b) Một trường FILE của DEAL có một tệp gắn qua requestUpload → PUT kho giả → complete thật; fields.update đổi type sang TEXT: không ném CONFLICT thì ném 'ttp tao truong: doi kieu co tep'; đọc lại type khác FILE thì ném 'ttp tao truong: kieu da doi'. Đối chứng dương cùng fixture: trường FILE thứ hai chưa có tệp đổi sang TEXT được; bị chặn thì ném 'ttp tao truong: doi chung chan oan'. (c) fields.create bởi member (vai member, cùng đường đăng nhập thử của apps/api/test/fields.spec.ts): không ném FORBIDDEN thì ném 'ttp tao truong: member tao duoc'. Chiều đỏ trong lịch sử: trên onehub 110a07377 z.enum(FIELD_TYPES) không có FILE, fields.create ném BAD_REQUEST, test ném 'ttp tao truong: DEAL khong luu'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [packages/db/prisma/schema.prisma, packages/db/prisma/migrations/**, packages/db/src/fields-shape.ts, apps/api/src/fields/**, apps/api/test/truong-tep.spec.ts]

