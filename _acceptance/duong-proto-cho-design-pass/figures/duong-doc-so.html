<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đường đọc sổ đăng ký</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #fafafa;
      --color-ink:    #171717;
      --color-muted:  #575757;
      --color-accent: #006B4F;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Lora', Georgia, serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1280px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.01em;
      line-height: 1.2;
      color: var(--color-ink);
      margin-bottom: 0.4rem;
    }
    .sub {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1040px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sơ đồ phụ thuộc · AC-4 · AC-7 · AC-8</p>
    <h1>Sổ đăng ký tách hai, và đường bóc văn bản bị gạch bỏ</h1>
    <p class="sub">apps/app/app/proto/ — catalog.ts không nhập gì, nên răng đo import thẳng nó</p>

    <svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#575757"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#006B4F"/></marker>
        <marker id="arrow-dim" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8a8a8a"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#fafafa"/>

      <!-- ARROWS (before boxes) -->
      <!-- A1 registry.ts → catalog.ts -->
      <line x1="460" y1="272" x2="320" y2="272" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- A2 page.tsx (mục lục) → registry.ts -->
      <path d="M 860,136 H 528 Q 520,136 520,144 V 240" fill="none" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- A3 [slug]/page.tsx → registry.ts -->
      <line x1="860" y1="280" x2="700" y2="280" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- A4 răng đo → catalog.ts  (ACCENT: đường phép đo đi thật) -->
      <path d="M 860,444 H 388 Q 380,444 380,436 V 320 Q 380,312 372,312 H 320" fill="none" stroke="#006B4F" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
      <!-- A5 ĐƯỜNG SAI, ĐÃ GẠCH: răng đo bóc văn bản registry.ts -->
      <path d="M 1060,444 H 1092 Q 1100,444 1100,436 V 216 Q 1100,208 1092,208 H 668 Q 660,208 660,216 V 240" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-dim)"/>

      <!-- ARROW LABELS -->
      <rect x="366" y="250" width="48" height="16" rx="2" fill="#fafafa"/>
      <text x="390" y="262" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">IMPORT</text>

      <rect x="532" y="176" width="48" height="16" rx="2" fill="#fafafa"/>
      <text x="536" y="188" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.10em">IMPORT</text>

      <rect x="800" y="258" width="48" height="16" rx="2" fill="#fafafa"/>
      <text x="824" y="270" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">IMPORT</text>

      <rect x="596" y="422" width="48" height="16" rx="2" fill="#fafafa"/>
      <text x="620" y="434" fill="#006B4F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">IMPORT</text>

      <rect x="898" y="186" width="84" height="16" rx="2" fill="#fafafa"/>
      <text x="940" y="198" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">BÓC VĂN BẢN</text>

      <!-- Dấu gạch bỏ trên đường sai -->
      <rect x="804" y="192" width="32" height="32" rx="2" fill="#fafafa"/>
      <line x1="808" y1="196" x2="832" y2="220" stroke="#171717" stroke-width="1.6"/>
      <line x1="832" y1="196" x2="808" y2="220" stroke="#171717" stroke-width="1.6"/>

      <!-- NODES -->
      <!-- N1 catalog.ts — FOCAL -->
      <rect x="80" y="240" width="240" height="96" rx="6" fill="#fafafa"/>
      <rect x="80" y="240" width="240" height="96" rx="6" fill="rgba(0,107,79,0.08)" stroke="#006B4F" stroke-width="1.4"/>
      <rect x="92" y="250" width="68" height="16" rx="2" fill="transparent" stroke="rgba(0,107,79,0.40)" stroke-width="0.8"/>
      <text x="126" y="262" fill="#006B4F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DỮ LIỆU</text>
      <text x="200" y="294" fill="#171717" font-size="13" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">catalog.ts</text>
      <text x="200" y="312" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">{ slug, tên, states[] }</text>
      <text x="200" y="328" fill="#006B4F" font-size="9" font-weight="500" font-family="'Geist', sans-serif" text-anchor="middle">không nhập gì cả</text>

      <!-- N2 registry.ts -->
      <rect x="460" y="240" width="240" height="96" rx="6" fill="#ffffff"/>
      <rect x="460" y="240" width="240" height="96" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <rect x="472" y="250" width="52" height="16" rx="2" fill="transparent" stroke="rgba(23,23,23,0.40)" stroke-width="0.8"/>
      <text x="498" y="262" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GHÉP</text>
      <text x="580" y="294" fill="#171717" font-size="13" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">registry.ts</text>
      <text x="580" y="312" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">slug → Component</text>
      <text x="580" y="328" fill="#575757" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">nhập catalog.ts</text>

      <!-- N3 mục lục -->
      <rect x="860" y="96" width="200" height="80" rx="6" fill="#ffffff"/>
      <rect x="860" y="96" width="200" height="80" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <rect x="872" y="106" width="44" height="16" rx="2" fill="transparent" stroke="rgba(23,23,23,0.40)" stroke-width="0.8"/>
      <text x="894" y="118" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ĐỌC</text>
      <text x="960" y="144" fill="#171717" font-size="11" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">app/proto/page.tsx</text>
      <text x="960" y="162" fill="#575757" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">mục lục — liệt kê N proto</text>

      <!-- N4 trang proto -->
      <rect x="860" y="240" width="200" height="80" rx="6" fill="#ffffff"/>
      <rect x="860" y="240" width="200" height="80" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <rect x="872" y="250" width="44" height="16" rx="2" fill="transparent" stroke="rgba(23,23,23,0.40)" stroke-width="0.8"/>
      <text x="894" y="262" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ĐỌC</text>
      <text x="960" y="288" fill="#171717" font-size="11" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">[slug]/page.tsx</text>
      <text x="960" y="306" fill="#575757" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">trang proto · đọc ?state=</text>

      <!-- N5 răng đo -->
      <rect x="860" y="400" width="200" height="88" rx="6" fill="#ffffff"/>
      <rect x="860" y="400" width="200" height="88" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1.2"/>
      <rect x="872" y="410" width="72" height="16" rx="2" fill="transparent" stroke="rgba(23,23,23,0.40)" stroke-width="0.8"/>
      <text x="908" y="422" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PHÉP ĐO</text>
      <text x="960" y="450" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">răng đo sổ đăng ký</text>
      <text x="960" y="468" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">bun · import catalog.ts</text>

      <!-- CALLOUT 1 — lý do gạch bỏ đường bóc văn bản -->
      <text x="64" y="88" fill="#171717" font-size="14" font-style="italic" font-family="'Lora', serif">khai sổ bằng .map() thì răng đọc ra 0 mục —</text>
      <text x="64" y="110" fill="#171717" font-size="14" font-style="italic" font-family="'Lora', serif">vòng lặp trên tập rỗng thì đúng một cách vô nghĩa:</text>
      <text x="64" y="132" fill="#171717" font-size="14" font-style="italic" font-family="'Lora', serif">ba eval xanh trên một sổ chưa từng được đọc.</text>
      <path d="M 392,140 Q 580,170 792,204" fill="none" stroke="rgba(23,23,23,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="800" cy="208" r="2" fill="#171717"/>

      <!-- CALLOUT 2 — vì sao tách được -->
      <text x="64" y="524" fill="#006B4F" font-size="14" font-style="italic" font-family="'Lora', serif">catalog.ts không nhập gì, nên bun import</text>
      <text x="64" y="546" fill="#006B4F" font-size="14" font-style="italic" font-family="'Lora', serif">thẳng được — đúng đường mã thật dùng.</text>
      <path d="M 296,514 Q 250,440 204,344" fill="none" stroke="rgba(0,107,79,0.50)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="200" cy="336" r="2" fill="#006B4F"/>

      <!-- LEGEND -->
      <line x1="40" y1="612" x2="1160" y2="612" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>
      <text x="40" y="628" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI · MŨI TÊN LÀ CHIỀU NHẬP</text>

      <line x1="40" y1="657" x2="72" y2="657" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="84" y="661" fill="#575757" font-size="9" font-family="'Geist', sans-serif">nhập (bên đọc → nguồn)</text>

      <line x1="260" y1="657" x2="292" y2="657" stroke="#006B4F" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
      <text x="304" y="661" fill="#575757" font-size="9" font-family="'Geist', sans-serif">đường phép đo đi thật</text>

      <line x1="480" y1="657" x2="516" y2="657" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4,3"/>
      <line x1="492" y1="651" x2="504" y2="663" stroke="#171717" stroke-width="1.4"/>
      <line x1="504" y1="651" x2="492" y2="663" stroke="#171717" stroke-width="1.4"/>
      <text x="528" y="661" fill="#575757" font-size="9" font-family="'Geist', sans-serif">đường đã gạch bỏ</text>

      <rect x="700" y="650" width="28" height="14" rx="4" fill="rgba(0,107,79,0.08)" stroke="#006B4F" stroke-width="1.4"/>
      <text x="736" y="661" fill="#575757" font-size="9" font-family="'Geist', sans-serif">khối nguồn trọng tâm</text>

      <rect x="900" y="650" width="28" height="14" rx="4" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="936" y="661" fill="#575757" font-size="9" font-family="'Geist', sans-serif">khối ghép / khối đọc</text>
    </svg>
  </div>
</body>
</html>
