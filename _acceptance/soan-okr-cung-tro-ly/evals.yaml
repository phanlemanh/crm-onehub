  - id: E1
    criterion: AC-1
    executor: test
    layer: backend-effect
    cmd: config:executors.test.soan_quyen
    expected: "exit 0; bài API trên kho _test có bộ OKR mẫu nạp bằng napBoOkrMau và cấu hình lưu qua okr.setProgram. MA TRẬN TOÀN PHẦN viết trước ở _acceptance/soan-okr-cung-tro-ly/rang/ma-tran-quyen.md (bài đọc tệp lúc chạy, đường suy từ vị trí bài): người {quản trị, trưởng bộ phận, trưởng phòng ban, phụ trách KR không sửa được đơn vị, thành viên, trưởng phòng ban vai okr, trưởng bộ phận vai okr} × đơn vị {OneHub, bộ phận, phòng ban} × nấc {tat, an, bat} × thủ tục {soanSanSang, soanMo, soanDanhSachCuoc, soanDanhSach (trên cuộc quản trị mở ở nấc an), soanQuyet, soanDuaVao (kể cả ca đơn vị đã chuyển sang tat sau khi cuộc mở)} → giá trị ô là ĐÚNG MỘT trong {mo, <maLyDo có tên>, 403, 404}, không có ô 'hoặc' — 403 ở soanSanSang, soanMo, soanDanhSachCuoc; 404 ở soanDanhSach, soanQuyet, soanDuaVao và bài chỉ đọc một ô là 404 khi câu trả về đúng câu của mã không có (khongCoCuoc; ở soanQuyet là câu dòng không có), để 404 «thủ tục chưa có» không khớp nhầm; bảng 378 ô gồm 108 ô 403 và 126 ô 404; bài từ chối chạy nếu bảng có ô trống hay ô hai giá trị. Gọi qua tRPC VÀ REST; số khẳng định in ra = số ô × 2, lệch là đỏ. Đối chứng dương: ô 'trưởng phòng ban vai okr × phòng ban × bat × soanMo' = mo. Chiều đỏ: bản sao bỏ kiểm nấc ở soanMo → 'o lech: thanh-vien x phong-ban x tat x soanMo'; bản sao cho trưởng phòng đọc cuộc ẩn → 'o lech: truong-phong x phong-ban x an x soanDanhSach'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [apps/api/src/okr/soan.service.ts, apps/api/src/okr/okr.router.ts, apps/api/src/okr/okr-access.service.ts, packages/db/src/okr-tro-ly.ts, packages/db/src/okr-tro-ly-danh-muc.ts, _acceptance/soan-okr-cung-tro-ly/rang/ma-tran-quyen.md, apps/api/test/soan-okr-quyen.spec.ts]

