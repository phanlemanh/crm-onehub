      ban da khai — tro vao component khong con boc thu vien nao la DO goi ten ca hai.
      So dong bang BANG so component boc-ma-khong-doc chan dem ra; lech la thoat ma 2 in
      ca hai danh sach.
      Chieu do: doi mot dong sang mot component khong boc thu vien -> ma 1 goi ten.
