schema_version: 1
feature_slug: chu-mac-dinh-thu-vien-ngoai
evals:

  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.tv_chu_la_tren_man
    expected: >-
      exit 0. Bang dong ghim (man, so chuoi nhin thay duoc toi thieu) neo tu so do 06/09.
      SO MAN dung duoc BANG so dong ban khai, va so chuoi moi man KHONG THAP HON neo —
      lech la thoat ma 2 goi ten man kem hai con so. Day la ma tran toan phan viet truoc:
      guard "tap rong la ma 2" mot minh chi chan duoc ca rong tuyet doi, khong chan duoc
      ca man chuyen huong ve dang nhap hay khoi tai cham chua kip ve.
      TAP LOAI TRU cua phep thu nguon ghim ten: node_modules · .next · dist · build. Chan
      phai IN so file da quet khi hoi nguon — o kho nay bun gom node_modules len goc nen
      apps/*/node_modules gan nhu rong, tuc phep do TINH CO dung neu khong loai tru; ghim
      de no thoi phu thuoc vao cach trinh quan ly goi xep thu muc.
      Chuoi KHONG co trong file nguon nao ma cung KHONG nam trong bang dong NAM ly do la
      DO goi ten man:thuoc tinh:nguyen van. Dong thuoc ly do thu nam (sinh tu kho chuoi
      qua ham ghep hoac phep dinh dang) phai TRO mot khoa CO THAT trong kho chuoi; khoa
      chet la DO goi ten khoa.
      Chieu do da phai chung: go phep ghi de nhan vung thong bao cua sonner -> ma 1, thong
      diep chua NGUYEN VAN "Notifications".
    paths:
      - "packages/ui/src/**"
      - "apps/app/**"
      - "_acceptance/chu-mac-dinh-thu-vien-ngoai/rang/**"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-1b
    executor: script
    cmd: config:executors.script.tv_dong_khai_song
    expected: >-
      exit 0. Moi dong trong bang dong bon ly do phai con ve ra tren mot man nao do —
      dong chet la DO goi ten. Bang rong la thoat ma 2.
      Chieu do: them mot dong khai cho mot chuoi khong he ve ra -> ma 1 goi ten dong.
    paths:
      - "_acceptance/chu-mac-dinh-thu-vien-ngoai/rang/**"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

