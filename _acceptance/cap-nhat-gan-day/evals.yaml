schema_version: 1
slug: cap-nhat-gan-day

evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.cng_thanh_ben
    paths:
      - "apps/app/app/(app)/[slug]/okr/tab-okr.ts"
      - "apps/app/app/(app)/[slug]/okr/thanh-ben-muc-tieu.tsx"
      - "apps/app/app/(app)/[slug]/okr/cap-nhat-gan-day/**"
      - "apps/app/lib/messages/okr*.ts"
      - "packages/ui/src/components/area-sidebar.tsx"
      - "apps/app/test/cap-nhat-gan-day.dom.tsx"
    expected: |
      Ca "cng-thanh-ben" dung ThanhBenMucTieu voi ma tran viet truoc 4 duong (/ws/okr, /ws/okr/cap-nhat-gan-day,
      /ws/okr/cap-nhat-gan-day?kyOkr=c2, /ws/okr/moi-kr): so muc [data-slot=area-sidebar-item] == 7; nhan nhom dau
      doc ra == [nhan Cua toi, nhan Cap nhat gan day] rut tu messages (khong viet tay chuoi); href muc moi ==
      "/ws/okr/cap-nhat-gan-day" o duong khong ky va "/ws/okr/cap-nhat-gan-day?kyOkr=c2" o duong co ky; dung mot
      aria-current va o dung muc mong cho tung dong (4 x 3 khang dinh). Trang: dung page.tsx cua
      /okr/cap-nhat-gan-day (server, qua ham dung trang cua test) -> co dung mot PageShellTitle "Cập nhật gần đây" va
      dung mot PageShellDescription truoc Suspense.
      CHIEU DO: ban sao NHOM_THANH_BEN bo "cap-nhat-gan-day" -> do "thieu muc Cap nhat gan day" (so muc 6); ban sao
      href bo kyOkr -> do dong "?kyOkr=c2" voi thong diep "muc moi mat chu ky".

  - id: E2
    criterion: AC-2
    executor: test
    layer: backend-effect
    cmd: config:executors.test.cng_nguon
    paths:
      - "apps/api/src/okr/cap-nhat-gan-day.ts"
      - "apps/api/src/okr/okr-cap-nhat-gan-day.service.ts"
      - "apps/api/src/okr/okr-cap-nhat-gan-day.contracts.ts"
      - "apps/api/src/okr/okr-xem.config.ts"
      - "apps/api/src/okr/okr.router.ts"
      - "apps/api/scripts/okr-mau/ca-cap-nhat-gan-day.ts"
      - "apps/api/test/okr-cap-nhat-gan-day.spec.ts"
    expected: |
      Ca "cng-nguon" ghim dong ho, nap ca mau ca-cap-nhat-gan-day qua dich vu that (OkrService tao/cong bo,
      OkrCapNhatService moCapNhat/guiCapNhat voi now ghim, khong chen bang): chu ky Q4 co muc tieu cong-bo cap onehub,
      bo-phan, phong-ban, ca-nhan, moi muc co lan cap nhat; mot muc tieu da-bo co lan cap nhat truoc khi bo; mot muc
      tieu o chu ky khac co lan cap nhat; mot lan cap nhat thay (onBehalf); mot KR moc; KR cap nhat hai lan cung tuan.
      Goi okr.capNhatGanDay qua
      tRPC (quan tri, phamVi tat-ca), di het moi trang: (a) tap checkInId gop == tap viet truoc trong ma tran (N_CO lan
      mong co, N_VANG lan mong vang, moi lan mot khang dinh); (b) thu tu == danh sach viet truoc theo thoi diem gui
      giam dan (so sanh mang id, khong sap lai trong test); (c) dong cua lan cap nhat thay mang nguoi cap nhat va chu KR
      dung id viet truoc; dong KR moc mang kieu moc; moi dong co ghiChu, tuTin, giaTri bang gia tri da gui; (d) total ==
      N_CO; dau ra qua capNhatGanDayOutput.parse.
      CHIEU DO: ban sao bo dieu kien cap ca-nhan -> do "lan cap nhat ca nhan lot vao" ghim checkInId; ban sao bo dieu
      kien status cong-bo -> do "lan cua muc tieu da bo lot vao"; ban sao xep theo createdAt tang -> do (b) ghim cap id
      dau tien sai cho.

  - id: E3
    criterion: AC-2
    executor: script
    layer: backend-effect
    cmd: config:executors.script.cng_man
    paths:
      - "apps/app/app/(app)/[slug]/okr/cap-nhat-gan-day/**"
      - "apps/api/src/okr/cap-nhat-gan-day.ts"
      - "apps/api/src/okr/okr-cap-nhat-gan-day.service.ts"
      - "apps/api/src/okr/okr.router.ts"
      - "apps/api/scripts/okr-mau/**"
      - "_acceptance/cap-nhat-gan-day/rang/do-man.mjs"
    expected: |
      Ban do qua tien-de (phien do rieng, bo OKR mau). Dang nhap mot nguoi mau dan don vi, mo /okr/cap-nhat-gan-day;
      tong tren chan == 0 -> thoat ma 2 "khong dung duoc Given AC-2" (khong in DUNG). Doc chip dang sang tren man
      ([data-pham-vi][aria-pressed=true]), goi okr.capNhatGanDay cung chu ky qua API cua phien do voi dung phamVi do,
      trang 1 (khong viet cung tat-ca). DEM dong [data-dong-tin] tren man (khong doc nhan tong): bang so
      dong cua rows; tap checkInId tren man ([data-dong-tin] mang id) == tap cua rows, cung thu tu; so tren chan ==
      total cua API; dong dau mang du sau truong theo thu tu: nguoi, thoi diem, KR, muc tieu va bo, gia tri va muc tu
      tin, ghi chu (khi co). In "DUNG AC-2 dong-tin: so-dong=<n>, total=<n>, thu-tu=khop". Lech -> "SAI AC-2 <gi>", ma
      1. Buoc tra loi tren chong that: bam "Trả lời" duoi dong moiNhat dau tien, go chuoi co dau thoi gian, Gui; khong
      tai lai trang, cho toi 10 giay: so [data-tra-loi] duoi dong do tang dung 1 va lan tra loi moi mang dung chuoi da
      go; in "DUNG AC-6 tra-loi tren man: +1". Lech -> "SAI AC-6 tra loi khong hien duoi dong", ma 1. Bi day ve
      /sign-in hay /onboarding -> ma 2.
      CHIEU DO: pha-thu CNG_PHA=khong-lam-moi (ban do chan yeu cau lam moi okr.capNhatGanDay sau khi gui) -> "SAI AC-6
      tra loi khong hien duoi dong"; pha-thu CNG_PHA=dao-thu-tu (ban do dao mang rows API truoc khi so) -> "SAI AC-2 thu tu lech";
      CNG_PHA=bot-dong (xoa dong cuoi tren man truoc khi dem) -> "SAI AC-2 so dong != rows".

  - id: E4
    criterion: AC-3
    executor: test
    layer: backend-effect
    cmd: config:executors.test.cng_quyen
    paths:
      - "apps/api/src/okr/cap-nhat-gan-day.ts"
      - "apps/api/src/okr/okr-cap-nhat-gan-day.service.ts"
      - "apps/api/src/okr/okr.router.ts"
      - "apps/api/scripts/okr-mau/ca-cap-nhat-gan-day.ts"
      - "apps/api/test/okr-cap-nhat-gan-day.spec.ts"
      - "apps/api/test/vai-chi-okr.spec.ts"
    expected: |
      Ca "cng-quyen": ca mau co mot muc tieu phong-ban muc hien thi gioi-han co hai lan cap nhat va mot muc tieu mo
      cung phong ban co mot lan; nguoi xem hep theo doi muc tieu mo ay (nen bo phong ban do vao Dang theo doi cua ho).
      Nguoi xem hep goi okr.capNhatGanDay ca ba phamVi: hai
      checkInId cua OKR gioi han vang khoi rows o moi trang; total va facetCounts.phamVi tat-ca nho hon cua quan tri
      dung 2; lan cua muc tieu mo co mat (doi chung duong); chon chip theo-doi: rows == [lan cua muc tieu mo] va
      facetCounts.phamVi theo-doi == 1 (khong phai 3). Quan tri goi cung chu ky: hai lan co mat. Lenh con: bai
      vai-chi-okr -t ma-tran-trpc xanh voi "okr.capNhatGanDay" trong tap cho phep vai okr (tap viet tay trong spec), va
      _acceptance/gioi-han-duyet-cay-okr/rang/soi-ma.mjs --ca xem thoat 0 (moi lan doc okrCheckIn, okrComment,
      okrFollow cua thu tuc moi mang dieuKienXemMucTieu).
      CHIEU DO: ban sao dung where khong dieuKienXemMucTieu -> do "nguoi xem hep thay lan cap nhat gioi han" ghim
      checkInId, va soi-ma --ca xem do goi ten cap-nhat-gan-day.ts; ban sao bo dieu kien quyen chi o lan dem theo-doi
      -> do "chip Dang theo doi lo OKR gioi han" (so 3 != 1).

  - id: E5
    criterion: AC-4
    executor: test
    cmd: config:executors.test.cng_pham_vi
    paths:
      - "apps/api/src/okr/cap-nhat-gan-day.ts"
      - "apps/api/src/okr/okr-cap-nhat-gan-day.service.ts"
      - "apps/api/scripts/okr-mau/ca-cap-nhat-gan-day.ts"
      - "apps/api/test/okr-cap-nhat-gan-day.spec.ts"
      - "packages/validation/src/okr-tham-so.ts"
    expected: |
      Ca "cng-pham-vi" voi cay mau (OneHub; B1 co P1, P2; B2 co P3) va ma tran viet truoc 5 nguoi x 3 chip = 15 dong:
      truong B1 (Toi dan == lan cua bo bp:B1, khong co lan cua P1, P2); truong P1 (Toi dan == lan cua pb:P1); nguoi
      vua truong P3 vua theo doi mot muc tieu cua P2 (Toi dan == pb:P3, Dang theo doi == moi lan cua bo pb:P2 ke ca
      lan cua muc tieu khong theo doi); thanh vien khong dan, khong theo doi (Toi dan 0, Dang theo doi 0); quan tri
      (khong ai co bo OneHub trong Toi dan). Moi dong: tap checkInId == tap viet truoc; facetCounts.phamVi[c].count ==
      total khi goi voi chip c (ca 15 dong).
      CHIEU DO: ban sao Toi dan keo phong ban con cua bo phan -> do dong truong B1 "Toi dan keo phong ban con" ghim id
      lan cua P1; ban sao Dang theo doi theo muc tieu thay theo bo -> do "thieu lan cua muc tieu cung bo khong theo doi".

  - id: E6
    criterion: AC-5
    executor: test
    cmd: config:executors.test.cng_trang
    paths:
      - "apps/api/src/okr/cap-nhat-gan-day.ts"
      - "apps/api/src/okr/okr-cap-nhat-gan-day.service.ts"
      - "apps/api/src/okr/okr-xem.config.ts"
      - "apps/api/test/okr-cap-nhat-gan-day.spec.ts"
    expected: |
      Ca "cng-trang": ca mau co 45 lan cap nhat trong chu ky. trang 1, 2, 3 -> so dong 20, 20, 5 (coTrang tu OKR_XEM,
      khong viet tay 20 trong test); noi ba trang == danh sach gop viet truoc, khong trung khong sot; trang 4 -> rows
      rong, total 45. Dem truy van: bat Prisma $on("query") quanh mot lan goi; nap them 40 lan cap nhat va 3 don vi roi
      goi lai -> so truy van bang nhau (ghim con so cua lan dau, khong chi so sanh).
      CHIEU DO: ban sao doc lan moi nhat bang mot truy van moi KR -> do "so truy van tang theo so KR" ghim hai con so;
      ban sao bo orderBy id -> do noi trang "trung id" khi hai lan cung thoi diem.

  - id: E7
    criterion: AC-5
    executor: test
    cmd: config:executors.test.cng_duong_dan
    paths:
      - "apps/app/app/(app)/[slug]/okr/cap-nhat-gan-day/**"
      - "apps/app/app/(app)/[slug]/okr/okr-search-params.ts"
      - "apps/app/lib/search-param-keys.ts"
      - "apps/app/test/cap-nhat-gan-day.dom.tsx"
    expected: |
      Ca "cng-duong-dan" dung trang qua nuqs test adapter, okr.capNhatGanDay gia ghi lai input: mo ?phamViBo=toi-dan&
      <tham so trang>=2 -> input {phamVi:"toi-dan", trang:2} va chip Toi dan aria-pressed; bam chip Dang theo doi ->
      url phamViBo=theo-doi va tham so trang bi xoa (ve 1); bam Tiep o chan -> url trang 2; doi ky c2 -> c3 qua
      ChonChuKy -> phamViBo giu, trang ve 1; duong ?phamViBo=xau&<trang>=abc -> input {phamVi:"tat-ca", trang:1}, khong
      loi; duong tran (khong phamViBo, khong trang) -> input {phamVi:"tat-ca", trang:1} va chip Tat ca aria-pressed
      (Hoi-1). Ma tran 6 dong viet truoc.
      CHIEU DO: ban sao giu trang khi doi chip -> do "doi chip khong ve trang 1"; ban sao luu chip vao state cuc bo ->
      do "tai lai mat chip".

  - id: E8
    criterion: AC-6
    executor: test
    layer: backend-effect
    cmd: config:executors.test.cng_tra_loi
    paths:
      - "apps/api/src/okr/cap-nhat-gan-day.ts"
      - "apps/api/src/okr/okr-cap-nhat-gan-day.service.ts"
      - "apps/api/src/okr/okr-trao-doi.service.ts"
      - "apps/api/scripts/okr-mau/ca-cap-nhat-gan-day.ts"
      - "apps/api/test/okr-cap-nhat-gan-day.spec.ts"
    expected: |
      Ca "cng-tra-loi" voi dong ho ghim. Tien de (doi chung): binh luan ghi qua OkrTraoDoiService.addComment voi now
      ghim co createdAt == now ghim, va lan cap nhat qua guiCapNhat voi now ghim co session.submittedAt == now ghim
      (hai khang dinh; dat thi ca hai dau ranh gioi cung mot dong ho). KR k1 do nguoi U viet co lan t1 (luc 10:00) va
      t2 (luc 12:00); binh luan gan k1 luc 09:00,
      11:00, 13:00; binh luan gan KR khac cung muc tieu luc 13:30; binh luan khong gan KR luc 13:40. Goi
      okr.capNhatGanDay: dong t2 moiNhat=true, traLoi == [binh luan 13:00] (dung id, cu truoc); dong t1 moiNhat=false,
      traLoi vang. Goi okr.addComment {objectiveId, keyResultId:k1, body, mentionUserIds:[]} luc 14:00 roi goi lai:
      traLoi cua t2 == [13:00, 14:00]; okr.comments(objectiveId) co binh luan 14:00 voi keyResultId k1 va keyResultTitle
      cua k1. Nhac ten (Hoi-2): trang gui mentionUserIds tu dong mentionNguoiCapNhat cua dong; nguoi viet t2 la U, nguoi
      tra loi khac U -> mentionNguoiCapNhat == U; nguoi tra loi la U -> rong; U khong con la thanh vien -> rong. Chu ky da an: addComment tra loi loi cua may chu, okr.capNhatGanDay khong doi.
      CHIEU DO: ban sao lay moi binh luan cua KR (bo moc thoi diem) -> do "binh luan truoc lan moi nhat lot vao" ghim id
      09:00 va 11:00; ban sao gan traLoi cho moi lan -> do "lan cu co tra loi".

  - id: E9
    criterion: AC-6
    executor: test
    cmd: config:executors.test.cng_tra_loi_man
    paths:
      - "apps/app/app/(app)/[slug]/okr/cap-nhat-gan-day/**"
      - "apps/app/lib/messages/okr*.ts"
      - "apps/app/test/cap-nhat-gan-day.dom.tsx"
    expected: |
      Ca "cng-tra-loi-man" dung dong tin voi du lieu gia hai dong cung KR (moiNhat true va false): chi dong moiNhat co
      nut "Trả lời" (rut tu messages); dong cu co cau "co lan moi hon" va khong co nut. Bam Tra loi -> o InputGroup co
      aria-label goi ten nguoi cap nhat, nut Gui tat khi rong; go "abc" Gui -> okr.addComment duoc goi dung mot lan voi
      {objectiveId, keyResultId, body:"abc", mentionUserIds:[mentionNguoiCapNhat cua dong]} (ca hai dong gia: co va
      khong co nguoi nhac) (gian diep tren mutation that cua tRPC client gia); khi
      thanh cong truy van okr.capNhatGanDay bi lam moi (khong window.location.reload) va o dong; khi addComment loi 400
      voi thong diep may chu -> thong diep hien duoi o, gia tri o van "abc".
      CHIEU DO: ban sao hien nut tren moi dong -> do "dong cu co nut tra loi"; ban sao xoa o khi loi -> do "mat chu da
      go khi gui hong".

  - id: E10
    criterion: AC-7
    executor: test
    cmd: config:executors.test.cng_mo_kr
    paths:
      - "apps/app/app/(app)/[slug]/okr/cap-nhat-gan-day/**"
      - "apps/app/components/crm/record-sheet/dien-bien-kr.ts"
      - "apps/app/test/cap-nhat-gan-day.dom.tsx"
    expected: |
      Ca "cng-mo-kr": bam ten KR k7 cua mot dong -> useMoNganKr goi voi "k7" (gian diep tren ham that cua dien-bien-kr,
      khong mock ca module) va phan tu ngan KR that (role=dialog cua record-sheet) hien voi tieu de KR k7; bam vung
      trong cua dong -> cung ket qua; bam vao o tra loi dang mo va nut Gui -> useMoNganKr khong duoc goi; dong ngan ->
      url ve dung phamViBo va trang truoc khi mo.
      CHIEU DO: ban sao ten KR la Link sang trang muc tieu -> do "bam KR roi khoi trang"; ban sao khong chan noi bot tu
      o tra loi -> do "go tra loi mo ngan KR".

  - id: E11
    criterion: AC-7
    executor: script
    cmd: config:executors.script.cng_ma_tran
    paths:
      - "_acceptance/ngan-kr-mot-cho/rang/quet-loi.mjs"
      - "_acceptance/ngan-kr-mot-cho/decisions.jsonl"
      - "apps/app/app/(app)/[slug]/okr/cap-nhat-gan-day/**"
    expected: |
      Lenh: bun _acceptance/ngan-kr-mot-cho/rang/quet-loi.mjs thoat 0 va in "so loi quet: <n> · so o ma tran: <n>" voi
      hai so bang nhau va lon hon 9, co dong "loi: cap-nhat-gan-day apps/app/app/(app)/[slug]/okr/cap-nhat-gan-day/";
      va _acceptance/ngan-kr-mot-cho/decisions.jsonl co mot dong type "fix" chua "cap-nhat-gan-day" va "D8" (kiem bang
      node -e doc JSON tung dong, khong grep chuoi tho).
      CHIEU DO: tren ban sao quet-loi.mjs bo o cap-nhat-gan-day -> thoat 1 in "loi ngoai ma tran: ...cap-nhat-gan-day";
      bo dong so -> lenh in "thieu dong so fix D8", ma 1.

  - id: E12
    criterion: AC-1
    executor: script
    cmd: config:executors.script.cng_thuoc_vkm
    paths:
      - "_acceptance/vo-khu-muc-tieu/rang/do-man-lib.mjs"
      - "_acceptance/vo-khu-muc-tieu/decisions.jsonl"
      - "apps/app/test/vo-khu-muc-tieu.dom.tsx"
      - "apps/app/app/(app)/[slug]/okr/tab-okr.ts"
    expected: |
      Lenh: node doc DO tu _acceptance/vo-khu-muc-tieu/rang/do-man-lib.mjs (import that, khong grep) -> DO.soMuc == 7
      va bang so muc cua NHOM_THANH_BEN trong tab-okr.ts (import that); _acceptance/vo-khu-muc-tieu/decisions.jsonl co
      mot dong type "fix" chua "cap-nhat-gan-day" va "D7"; config:executors.test.vkm_thanh_ben thoat 0. In "DUNG thuoc
      vkm: soMuc=7, NHOM=7, dong so=1".
      CHIEU DO: tren ban sao do-man-lib.mjs dat soMuc 6 -> "SAI thuoc vkm: soMuc 6 != NHOM 7", ma 1.

  - id: E13
    criterion: AC-8
    executor: test
    cmd: config:executors.test.cng_trang_thai
    paths:
      - "apps/app/app/(app)/[slug]/okr/cap-nhat-gan-day/**"
      - "apps/app/lib/messages/okr*.ts"
      - "apps/app/test/cap-nhat-gan-day.dom.tsx"
    expected: |
      Ca "cng-trang-thai": ma tran viet truoc 6 trang thai (cho, loi, chuachuky, rong, rongloc, codulieu) -> moi trang
      thai co dung [data-trang-thai=ST-cng-<ten>] va tieu de PageShellTitle "Cập nhật gần đây" van co mat (6 x 2 khang
      dinh); loi co nut Thu lai goi refetch; rongloc (chip Dang theo doi, total 0) co nut "Xem tất cả" xoa phamViBo;
      rong (chip Tat ca, total 0) khong co nut Xem tat ca.
      CHIEU DO: ban sao dat tieu de trong ma khach sau Suspense -> do trang thai "cho" "mat tieu de"; ban sao dung chung
      mot Empty cho rong va rongloc -> do "rong co nut Xem tat ca".

  - id: E14
    criterion: AC-9
    executor: ui-check
    layer: ui-observed
    cmd: config:executors.script.cng_man
    steps:
      - "Chay O TIEN CANH tu goc kho, Bash timeout 600000, nguyen van: CNG_CHEP_ANH=1 EVAL= bun scripts/lan-do/tien-de.mjs --chay \"bun _acceptance/cap-nhat-gan-day/rang/do-man.mjs\" (ban do chi chep anh sang _acceptance/cap-nhat-gan-day/evidence/ khi co CNG_CHEP_ANH=1)"
      - "Doc dong KET LUAN cuoi: ma 0 = khong dong SAI; ma 2 = khong do duoc; ma 1 = co dong SAI"
      - "Mo cac anh trong _acceptance/cap-nhat-gan-day/evidence/ (khong tinh thu muc design-pass/) va doi chieu bang mat voi Expected"
    inputs:
      - _acceptance/cap-nhat-gan-day/evidence/
    paths:
      - "apps/app/app/(app)/[slug]/okr/**"
      - "_acceptance/cap-nhat-gan-day/rang/do-man.mjs"
    expected: |
      Anh cap-nhat-1280, tra-loi-1280, cap-nhat-375, tra-loi-375. O 1280: thanh ben khu co muc "Cập nhật gần đây" sang
      ngay duoi "Của tôi"; hang chip Tat ca · Toi dan · Dang theo doi co so nam tren dong tin; moi dong doc duoc nguoi ·
      thoi diem, ten KR, muc tieu · bo, gia tri canh cham muc tu tin kem chu, ghi chu; chan co so "1–20 trong so N" va
      nut trang; anh tra-loi co o tra loi mo duoi lan moi nhat voi Huy · Gui. O 375: trang khong tran ngang, hang chip
      cuon trong chinh no, ten KR dai xuong dong (khong bi cat mat), cham tu tin van kem chu. Ban do in "DUNG AC-9 375:
      tran ngang 0". Thieu anh -> khong dat.

  - id: E15
    criterion: AC-10
    executor: test
    layer: backend-effect
    cmd: config:executors.test.cng_bo_mau
    paths:
      - "apps/api/scripts/okr-mau/**"
      - "apps/api/test/okr-mau.spec.ts"
    expected: |
      Ca "cap-nhat-gan-day" trong okr-mau.spec.ts: nap bo OKR mau tren kho test (lenh nap that cua okr:mau). Sau lan
      nap: so okrFollow va so okrComment co keyResultId cua chu ky quy 4 bang hang so khai trong khuon (khong viet tay
      trong test); mot nguoi mau dan don vi goi okr.capNhatGanDay -> facetCounts theo-doi > 0 va co it nhat mot dong
      moiNhat voi traLoi khong rong; moi binh luan mau co vet "binh-luan" trong okrTrail (chung tu da qua
