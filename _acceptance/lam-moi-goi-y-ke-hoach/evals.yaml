  - id: E10
    criterion: AC-4
    executor: script
    cmd: config:executors.script.lmgy_duong
    expected: "exit 0; node _acceptance/lam-moi-goi-y-ke-hoach/rang/duong-doi-giai-doan.mjs --tu-thu rồi chạy thật. Bảng viết trước trong script, bốn nơi: (stage-stepper.tsx, deals.setStage) · (stage-change.tsx, deals.setStage) · (use-deal-board-move.ts, deals.setStage) · (deals-bulk-actions.tsx, deals.bulkSetStage). Quét mọi tệp .ts/.tsx dưới apps/app trừ test/: mỗi chỗ có 'deals.setStage.mutationOptions(' hay 'deals.bulkSetStage.mutationOptions(' mà (tệp, thủ tục) không thuộc bảng thì thoát 1 với 'gy-lm: duong doi giai doan chua khai <tệp>'; nơi trong bảng không còn chỗ gọi thì thoát 1 với 'gy-lm: duong da khai khong con <tệp>'; khối đối số của mutationOptions (cắt theo ngoặc cân) không chứa 'cache.deal(' thì thoát 1 với 'gy-lm: duong khong lam moi cache.deal <tệp>'; số nơi đã kiểm khác 4 thì thoát 1 với 'gy-lm: bang thieu o'. --tu-thu chạy cùng hàm trên ba cây giả trong thư mục tạm: cây lành phải thoát 0; cây có một nơi bỏ cache.deal khỏi khối phải in 'gy-lm: duong khong lam moi cache.deal'; cây thêm một tệp gọi deals.setStage ngoài bảng phải in 'gy-lm: duong doi giai doan chua khai' — thiếu một trong ba thì thoát 2."
