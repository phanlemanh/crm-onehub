<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trang chọn nguồn lộ trình</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #fafafa;
      --color-ink:     #171717;
      --color-muted:   #575757;
      --color-accent:  #006B4F;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.3;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }

    .sub {
      font-size: 0.875rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Cây quyết định · Lộ trình đọc bản chụp</p>
    <h1>Trang chọn nguồn — không bao giờ lùi</h1>
    <p class="sub">Mỗi lần mở trang Lộ trình, trang trả lời tối đa ba câu rồi đọc đúng một nguồn.</p>

        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f4f7a"/></marker>

      <rect width="100%" height="100%" fill="#fafafa"/>

      <rect x="696" y="92" width="48" height="12" rx="2" fill="#fafafa"/>
      <text x="720" y="101" fill="#666666" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KHÔNG</text>
      <rect x="488" y="184" width="24" height="12" rx="2" fill="#fafafa"/>

      <text x="1156" y="268" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">AC-6</text>

      <rect x="800" y="424" width="320" height="64" rx="32" fill="#fafafa"/>
      <rect x="800" y="424" width="320" height="64" rx="32" fill="#ffffff" stroke="#575757" stroke-width="1"/>
      <text x="960" y="460" fill="#171717" font-size="13" font-weight="600" text-anchor="middle">Tệp đóng gói — ghi (bản dựng)</text>
      <rect x="1136" y="448" width="40" height="16" rx="2" fill="none" stroke="rgba(23,23,23,0.40)" stroke-width="0.8"/>
      <text x="1156" y="460" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">AC-7</text>

      <rect x="320" y="600" width="320" height="64" rx="32" fill="#fafafa"/>

      <text x="480" y="636" fill="#171717" font-size="13" font-weight="600" text-anchor="middle">Bản chụp — giờ lấy</text>
      <rect x="656" y="624" width="40" height="16" rx="2" fill="none" stroke="rgba(0,107,79,0.50)" stroke-width="0.8"/>
      <text x="676" y="636" fill="#006B4F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">AC-7</text>

      <text x="600" y="716" fill="#171717" font-size="14" font-style="italic" font-family="'Lora', serif" text-anchor="middle">Mọi ca mơ hồ chọn tệp đóng gói: chậm bằng hôm nay, không bao giờ cũ hơn bản đang chạy</text>

      <line x1="24" y1="740" x2="1176" y2="740" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>
      <text x="24" y="768" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CHÚ GIẢI</text>

      <polygon points="136,756 148,764 136,772 124,764" fill="#ffffff" stroke="#171717" stroke-width="1"/>

</html>
