schema_version: 1
slug: chan-uy-thac-sai-luot

evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.cu_quyen_hai_chieu
    paths:
      - "apps/agent/agent/lib/session-purpose.ts"
      - "apps/agent/agent/subagents/agent_builder/lib/authorization.ts"
      - "apps/agent/test/chan-uy-thac.spec.ts"
    expected: |
      Luot mang purpose=builder VA commandType=CREATE_AGENT thi policy cho di tiep.
      CAP HAI CHIEU tren CUNG mot fixture, khac dung MOT truong:
        chieu 1 (duong tinh): CREATE_AGENT -> cho di tiep.
        chieu 2 (do): doi rieng commandType sang CHAT -> tu choi.
      Doi mot truong ma ket qua khong lat -> ma 1: khi ay policy khong doc truong ay,
      no chi tinh co trung.
      SAN KHUON FIXTURE (bat buoc, khong duoc bo): fixture phien KHONG duoc tu dung
      dung khuon ben doc. Bai do phai RUT khoa dat thuoc tinh tu chinh duong runtime
      dat no (builderCommandType / purposeOf trong apps/agent), roi ASSERT khoa ay
      trung khoa policy doc. Khong round-trip duoc -> ma 2.
      Vi sao la ma 2 chu khong phai bo qua: mot fixture dat commandType o tang phang
      trong khi runtime dat trong session.auth se cho CA HAI CHIEU xanh, trong khi
      tren prod policy doc undefined voi MOI luot — ke ca luot bam nut Tao tac nhan —
      nen builder bi tu choi 100% va AC-1 vo ngay sau khi merge.
      San dan so: fixture khong nap duoc thuoc tinh nao -> ma 2.

  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.cu_quyen_hai_chieu
    paths:
      - "apps/agent/agent/subagents/agent_builder/lib/authorization.ts"
      - "apps/agent/agent/subagents/agent_builder/tools/inspect_context.ts"
      - "apps/agent/test/chan-uy-thac.spec.ts"
    expected: |
      Phien purpose=builder + commandType=CHAT: policy tra ve trang thai TU CHOI kem
      reason, chu KHONG nem Error. Kiem ca hai ve:
        (a) ket qua la denied — doc duoc, khong phai exception;
        (b) reason BANG DUNG hang da ghim, so nguyen van chuoi.
      Chieu do: doi hang ghim trong ban sao -> ma 1, IN ra chuoi thuc nhan duoc.
      Chi assert "co tu choi" ma khong ghim chuoi -> chua du: mot tu choi khong loi
      giai khong phan biet duoc voi tu choi vi ly do khac.

  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.cu_phu_moi_tool
    paths:
      - "apps/agent/agent/subagents/agent_builder/tools/inspect_context.ts"
      - "apps/agent/agent/subagents/agent_builder/tools/write_agent_file.ts"
      - "apps/agent/agent/subagents/agent_builder/tools/save_agent_draft.ts"
      - "apps/agent/agent/subagents/agent_builder/lib/authorization.ts"
      - "apps/agent/test/chan-uy-thac.spec.ts"
    expected: |
      Ma tran TOAN PHAN tren DANH SACH GHIM CUNG BA TEN trong chinh bai do:
      inspect_context, write_agent_file, save_agent_draft. So assert bang dung 3,
      khong duoc chay vong lap roi vut so dem.
      Moi tool phai thoa CA HAI VE:
        (a) khai policy dung chung;
        (b) VAN giu requireBuilderAttribute (lop trong).
      CAM lay dan so tu dia lam dan so cua phep do. Dia chi dung de DOI CHIEU: dem
      so tool goi requireBuilderAttribute tren dia, khac 3 -> ma 2, IN ten tool thua
      hoac thieu. Vi sao: neu dan so troi theo dia thi go requireBuilderAttribute
      khoi write_agent_file se lam "dem duoc 2 thi doi 2" tu khop, va mot cua vao
      builder ho hoan toan van cho mau xanh.
      Chieu do: go policy khoi DUNG MOT tool trong ban sao -> ma 1, neu TEN tool.
      Go requireBuilderAttribute khoi DUNG MOT tool -> cung ma 1.
      Cam do bang cach tim chuoi "approval" trong file: doc bang AST hoac import that
      module roi soi thuoc tinh, vi chuoi ay xuat hien hop le o cho khac.

  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.cu_quyen_hai_chieu
    paths:
      - "apps/agent/agent/lib/session-purpose.ts"
      - "apps/agent/agent/subagents/agent_builder/lib/authorization.ts"
      - "apps/agent/test/chan-uy-thac.spec.ts"
    expected: |
      MA TRAN TOAN PHAN tren tich: {research, team-agent, builder} x {co CREATE_AGENT,
      khong co}. So assert bang so phan tu cua tich (6), khong duoc chi kiem
      research.
      Moi to hop TRU (builder + CREATE_AGENT) deu phai TU CHOI, kem dung hang ghim.
      To hop team-agent PHAI co mat: policy viet theo dung chu "tu choi khi research
      hoac thieu thuoc tinh" se de phien team-agent lot cua, roi roi xuong
      requireBuilderAttribute va nem Error — quay lai dung chuoi thu-lai roi treo ma
      vong nay sinh ra de chan.
      San dan so: tap gia tri purposeOf tra ve dem ra khac 3 -> ma 2, IN gia tri la.
      Chieu do (doi chung duong): to hop builder + CREATE_AGENT phai CHO DI TIEP.
      Neu no cung bi tu choi -> ma 1: khi ay "tu choi tat" khong phan biet duoc voi
      "policy luon dong".

  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.cu_quyen_hai_chieu
    paths:
      - "apps/agent/agent/lib/session-purpose.ts"
      - "apps/agent/agent/subagents/agent_builder/lib/authorization.ts"
      - "apps/agent/test/chan-uy-thac.spec.ts"
    expected: |
      BA hinh dang thieu thuoc tinh, cung mot lop loi, phai kiem CA BA:
        (i) khong co purpose; (ii) co purpose=builder nhung khong co commandType;
        (iii) vang ca hai.
      Ca ba deu phai TU CHOI (fail-closed). Chi kiem mot hinh dang -> chua du.
      Chieu do: nap du hai thuoc tinh hop le tren cung fixture -> cho di tiep.

  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.cu_ket_thuc_sach
    paths:
      - "apps/agent/agent/subagents/agent_builder/agent.ts"
      - "apps/agent/test/chan-uy-thac.spec.ts"
    expected: |
      Parse THAT bang outputSchema cua agent_builder, khong doc chuoi nguon:
        (a) { status: "not_authorized", reason: <chuoi khong rong> } -> parse THANH CONG;
        (b) { status: "draft_ready", summary, agentId, versionId } -> van parse THANH CONG
            (chong hoi quy: mo union khong duoc lam mat nhanh cu);
        (c) { status: "not_authorized" } thieu reason -> parse HONG.
      Chieu do: go nhanh not_authorized khoi schema trong ban sao -> (a) phai hong,
      phep do ma 1.

  - id: E7
    criterion: AC-7
    executor: judgment
    cmd: judgment
    question: >-
      Cau tra loi ma cha soan khi nhan not_authorized co doc nhu mot dong nghiep noi
      chuyen khong: no chi duong dung tac nhan bat dau tu nut Tao tac nhan, roi tra loi
      tiep cau nguoi dung vua hoi, ma khong do loi cho nguoi dung, khong dung tu ky
      thuat (commandType, subagent, schema, outputSchema), va khong trinh bay nhu mot
      loi he thong?
    inputs:
      - ../../apps/agent/agent/instructions/task.ts
      - ../../CONTEXT.md
    expected: >-
      Chi dan cho cha viet bang tieng cua nguoi dung CRM. Nguoi doc hieu ngay phai bam
      gi de dung tac nhan, va cau hoi ho vua dat van duoc tra loi chu khong bi nuot.
      Khong cau nao khien nguoi dung tuong ho da lam sai. Chi dan phai GHIM hai vat:
      (a) danh sach tu cam xuat hien trong cau tra loi — commandType, subagent, schema,
      outputSchema, va truong reason ky thuat dan nguyen van; (b) yeu cau tra loi tiep
      cau hoi goc cua nguoi dung sau khi chi duong. Thieu mot trong hai -> FAIL, trich
      cau thieu.
      GIOI HAN DA BIET, khai o day de khong ai tuong da do: phep do nay cham CHI DAN
      viet cho cha, KHONG cham cau tra loi cha that su soan. Chi dan dung giong ma
      runtime van dan reason ky thuat vao mat nguoi dung thi phep do nay VAN xanh.
      Do dau ra that can mot luot chay end-to-end voi model that (duong
      `bun run --filter=agent eval`), vong nay khong dung — xem entry revisit trong
      decisions.jsonl.

  - id: E8
    criterion: AC-8
    executor: test
    cmd: config:executors.test.cu_man_khong_treo
    paths:
      - "apps/app/lib/agent-builder-state.ts"
      - "apps/app/test/chan-uy-thac.spec.ts"
    expected: |
      VE MAN cua cap cross-layer AC-8. Goi CHINH ham builderConversationIsWorking cua
      apps/app — import that, CAM viet lai dieu kien (sessionId && !continuationToken)
      theo tri nho, vi viet lai la duong lui tu cham.
      Nap hang hoi thoai do ve agent (E8b) ghi ra, khong tu bia hang:
        chieu 1: hang da settle (continuationToken khac null) -> tra false.
        chieu 2 (do): hang chua settle (continuationToken = null) -> tra true.
      Thieu chieu 2 thi mau xanh khong phan biet duoc "khong treo" voi "thuoc chua
      bao gio chay".

  - id: E8b
    criterion: AC-8
    executor: test
    layer: backend-effect
    cmd: config:executors.test.cu_khong_treo
    paths:
      - "apps/agent/agent/lib/custom-agent-dispatch.ts"
      - "apps/agent/agent/channels/crm.ts"
      - "apps/agent/test/chan-uy-thac.spec.ts"
    expected: |
      VE AGENT cua cap cross-layer AC-8: hoi thoai DA NHAN ma khong bao gio settle
      phai duoc THU HOI.
      CAP HAI CHIEU tren cung vi tu builderTurnAbandoned:
        chieu 1 (do): sessionId co, continuationToken null, acceptedAt qua han
                      -> true (bi thu hoi).
        chieu 2 (doi chung duong): BA hinh dang KHONG duoc thu hoi, kiem CA BA —
                      (i) da co continuationToken; (ii) chua co sessionId;
                      (iii) acceptedAt CHUA qua han. So assert bang 3.
      Chieu do them: bo dieu kien continuationToken khoi vi tu trong ban sao -> ma 1.
      San dan so: tap ba hinh dang dem ra khac 3 -> ma 2.

  - id: E9
    criterion: AC-9
    executor: test
    cmd: config:executors.test.cu_man_khong_treo
    paths:
      - "apps/app/lib/agent-transcript.ts"
      - "apps/app/test/chan-uy-thac.spec.ts"
    expected: |
      VE MAN cua cap cross-layer AC-9. Nap dong su kien do ve agent (E9b) sinh ra vao
      CHINH ham latestTurnFailure cua apps/app.
      Do QUAN HE su kien -> the do, KHONG do ten su kien co mat: mot su kien dung ten
      nhung sai vo du lieu van lam latestTurnFailure tra null, va nguoi dung van thay
      hoi thoai treo khong the do — dung trieu chung prod vong nay hua chua.
      CAP HAI CHIEU tren cung nguon su kien:
        chieu 1 (do): dong su kien cua luot bi nem -> tra KHAC null.
        chieu 2 (doi chung duong): dong su kien cua mot luot binh thuong -> tra null.
      San dan so: dong su kien rong -> ma 2.

  - id: E9b
    criterion: AC-9
    executor: test
    layer: backend-effect
    cmd: config:executors.test.cu_khong_treo
    paths:
      - "apps/agent/agent/channels/crm.ts"
      - "apps/agent/agent/lib/custom-agent-dispatch.ts"
      - "apps/agent/test/chan-uy-thac.spec.ts"
    expected: |
      VE AGENT cua cap cross-layer AC-9: luot thu hoi phai duoc NOI VAO dung cua vao
      cua lich dispatch, khong phai mot ham mo coi khong ai goi.
      Do QUAN HE chu khong do chuoi-co-mat o pham vi file: doc THAN cua
      pendingBuilderSubmissionIds (cua vao ma schedules/dispatch.ts chay moi phut)
      va doi hoi no goi recoverStalledBuilderTurns.
      Chieu do: go loi goi ay khoi than ham trong ban sao -> ma 1.
      San dan so: khong dinh vi duoc than ham -> ma 2.
      GIOI HAN DA BIET: luot thu hoi chay theo lease 15 phut, nen day la bao dam
      "tu go trong vong 15 phut", KHONG phai "hong ra mat ngay" nhu ban chot pham vi
      hua — xem muc Notes cua contract va entry approach stage S3 trong decisions.jsonl.

  - id: E10
    criterion: AC-10
    executor: test
    cmd: config:executors.test.cu_phu_moi_tool
    paths:
      - "apps/agent/agent/subagents/agent_builder/lib/authorization.ts"
      - "apps/agent/agent/subagents/agent_builder/tools/inspect_context.ts"
      - "apps/agent/agent/subagents/agent_builder/tools/write_agent_file.ts"
      - "apps/agent/agent/subagents/agent_builder/tools/save_agent_draft.ts"
      - "apps/agent/test/chan-uy-thac.spec.ts"
    expected: |
      Chuoi ly do den tu MOT hang duoc export, dung chung. Do QUAN HE chu khong do
      chuoi-co-mat: khong file tool nao chua chuoi ly do viet thang tai cho — moi tool
      phai IMPORT hang ay.
      Chieu do: viet lai chuoi ay tai cho o mot tool trong ban sao -> ma 1, neu
      file:dong.
