  - id: E14
    criterion: AC-2
    executor: judgment
    question: >-
      Đọc bảng _acceptance/doi-nhan-khu-muc-tieu/evidence/bang-chu.md (mỗi dòng: khái niệm, vai, khoá, ngôn ngữ, chữ cũ,
      chữ mới) và mục «Bảng thay chữ» của design doc. Như một thành viên OneHub đọc khu Mục tiêu, mỗi chữ mới có (1) dùng
      đúng một tên cho khái niệm của dòng — «Góp vào»/«contribute» cho căn chỉnh, «Lấy ý kiến» cho lần hỏi ý; với dòng
      khái niệm goc, đúng chữ của cột vai theo design doc («Công ty»/«Company» cho tên cấp và dự phòng tên gốc, «cả công
