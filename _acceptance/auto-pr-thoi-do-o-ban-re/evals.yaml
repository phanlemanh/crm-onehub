schema_version: 1
slug: auto-pr-thoi-do-o-ban-re

evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.apr_chay_that
    paths:
      - ".github/workflows/auto-pr.yml"
      - "_acceptance/auto-pr-thoi-do-o-ban-re/rang/**"
    expected: |
      CAP HAI CHIEU tren CUNG mot chan, cung kho, hai commit GHIM CUNG ca hai ve:
      chieu xanh — `--sha c042478` (mac dinh, commit mang ban va): check-run
      `Open a pull request into main` ket luan `skipped`, ma 0. VA hai ve doi chieu:
      c042478 la to tien cua HEAD; `.github/workflows/auto-pr.yml` tai c042478 bang
      dung ban tren cay hien tai.
      chieu do — `--sha 5ac85ef --doi-chieu khong` (dau onehub TRUOC ban va): ket luan
      `failure`, ma 1, thong diep ghim ten check-run va ket luan doc duoc.
      Ca hai chieu DA CHAY ngay 07/09.
      Moc xanh GHIM CUNG chu KHONG lay HEAD, doi xung voi moc do. Ly do: HEAD la moc di
      dong — o vong cham no la commit ho so vua tao, chua day va chua chay xong, nen
      chan tra ma 2 va chan cong vi mot ly do khong lien quan den ban va. Hai ve doi
      chieu la thu giu cho mot so do ghim cung van noi ve cay dang merge.
      Day la chan DUY NHAT do hanh vi that; ba chan con lai do hinh dang.
      Commit chua day / chua chay xong / `gh` chua dang nhap -> ma 2, TUYET DOI khong
      tra xanh.

  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.apr_khoa
    paths:
      - ".github/workflows/auto-pr.yml"
      - "_acceptance/auto-pr-thoi-do-o-ban-re/rang/**"
    expected: |
      MA TRAN TOAN PHAN truc B — BON hinh dang khoa, BON luot chay, khong luot nao suy
      ra tu luot khac. Cong mot luot cho ve remote. Tat ca DA CHAY ngay 07/09:
      1. xanh — tep that: job `open` co DUNG MOT dong `if` = `github.repository ==
         'trycompai/crm'`, va slug rut tu remote (`phanlemanh/crm-onehub`) khac chuoi
         do -> ma 0.
      2. do — ban sao BO dong `if` (`--workflow`): ma 1, ghim "KHONG co dong `if`".
      3. do — ban sao doi khoa sang `phanlemanh/crm-onehub`: ma 1, in ca dieu kien doc
         duoc lan dieu kien mong doi.
      4. do — ban sao co HAI dong `if` o tang job: ma 1, in RA CA HAI dong doc duoc.
         Luot nay bit lo P0 cua phan bien: truc B khai bon gia tri ma chi ba luot co
         assert, trong khi Coverage khai da phu — so hoc khong khop.
      5. do — bom remote gia `--remote https://github.com/trycompai/crm.git`: ma 1,
         ghim "kho tai cho ... dung bang kho hang".
      Ve "slug khac kho hang" la ASSERTION AM TINH nen phai co chieu do rieng (luot 5):
      khong co luot ay thi ve nay co the la mot hang dung ma khong ai biet — dung lop
      loi doi-chung-tu-so-voi-chinh-minh cua [chan-lai-component-ra-man#F2].
      Phep so la RUT `owner/repo` tu URL remote roi so voi slug, KHONG so nguyen URL
      voi slug.
      Khong doc duoc tep / khong rut duoc owner-repo -> ma 2.

  - id: E3
    criterion: AC-3
    executor: script
    cmd: config:executors.script.apr_lech_mot_dong
    paths:
      - ".github/workflows/auto-pr.yml"
      - "_acceptance/auto-pr-thoi-do-o-ban-re/rang/**"
    expected: |
      CAP HAI CHIEU, va chan do QUAN HE chu khong do CON SO:
      chieu xanh — nen `origin/release`: dung 1 dong them, 0 dong bot, VA dong them
      bang dung `    if: github.repository == 'trycompai/crm'` ke ca BON DAU CACH dau
      dong (bon dau cach moi la tang job), VA khi `upstream/HEAD` giai duoc thi ket qua
      so voi no cung dung nhu vay -> ma 0.
      chieu do 1 — nen `HEAD`: khong lech dong nao -> ma 1, ghim "ban va chua co mat".
      chieu do 2 — thay dong khoa bang mot dong TRONG trong cay lam viec: van +1/-0
      nhung noi dung khac -> ma 1, in ra dong doc duoc.
      Ca ba luot DA CHAY ngay 07/09; cay da khoi phuc sau luot do 2.
      Chieu do 2 bit lo P1 cua phan bien: dem dong la DO CON SO trong khi loi hua la
      QUAN HE — mot dong trong, mot dong `env`, hay mot `if` dat nham o tang step deu
      cho +1/-0 va deu se lot.
      Ve doi chieu `upstream/HEAD` bien tien de "origin/release khop ban hang" tu mot
      cau van xuoi thanh mot phep do. May khong co remote `upstream` thi chan NOI RO no
      chi do tren `origin/release`, khong im lang bo qua.
      Khong giai duoc ref nen -> ma 2.

  - id: E4
    criterion: AC-4
    executor: script
    cmd: config:executors.script.apr_mot_tep
    paths:
      - ".github/workflows/**"
      - "_acceptance/auto-pr-thoi-do-o-ban-re/rang/**"
    expected: |
      CAP HAI CHIEU tren TOAN BO diff, khong gioi han duoi `.github/`:
      chieu xanh — nen `origin/onehub`: moi tep doi deu nam trong danh sach ghim ten
      (auto-pr.yml · _acceptance/config.yaml · _acceptance/<slug>/** · design doc cua
      vong), va auto-pr.yml co mat -> ma 0.
      chieu do 1 — nen `HEAD`: 0 tep -> ma 1.
      chieu do 2 — nen `origin/release`: 897 tep roi ngoai danh sach -> ma 1, in ten ra.
      Ca ba luot DA CHAY ngay 07/09.
      Ban dau cua chan nay chi nhin duoi `.github/`, nen mot tep sua lay o `packages/`
      hay `.env.example` se lot qua trong khi Coverage khai da phu truc C — lo P2 cua
      phan bien. Nay chan quet toan bo diff.
      Chan nay giu `pr-base.yml` (cung benh, dang ngu) o NGOAI pham vi vong nay that,
      chu khong chi trong loi hua.
      Khong giai duoc ref nen -> ma 2.

  - id: E5
    criterion: AC-5
    executor: script
    cmd: config:executors.script.check_types_khong_cache
    paths:
      - ".github/workflows/auto-pr.yml"
      - "_acceptance/auto-pr-thoi-do-o-ban-re/rang/**"
    expected: |
      `bunx turbo run check-types --force` ma 0 tren cay mang ban va.
      Ban va khong cham ma nguon nen day la luoi chong tac dung phu ngoai du doan.
      `--force` bat buoc: mot mau xanh phat lai khong phan biet duoc "cay lanh" voi
      "thuoc chua bao gio chay" — bai hoc cua ho so lenh-chung-khong-an-cache-doi.

  - id: E6
    criterion: AC-5
    executor: script
    cmd: config:executors.script.lint_khong_cache
    paths:
      - ".github/workflows/auto-pr.yml"
      - "_acceptance/auto-pr-thoi-do-o-ban-re/rang/**"
    expected: |
      `bunx turbo run lint --force` ma 0 tren cay mang ban va. Ly do `--force` nhu E5.

  - id: E7
    criterion: AC-5
    executor: script
    cmd: config:executors.script.lint_slop
    paths:
      - ".github/workflows/auto-pr.yml"
      - "_acceptance/auto-pr-thoi-do-o-ban-re/rang/**"
    expected: |
      `bun run lint:slop` ma 0. Chan nay giai ra `oxlint` chay thang, KHONG qua turbo —
      nen khong can `--force` va khong an cache doi duoc.
      No cung soi chinh script `rang/khoa-auto-pr.mjs` vong nay viet.

  - id: E8
    criterion: AC-5
    executor: test
    cmd: config:executors.test.api
    paths:
      - ".github/workflows/auto-pr.yml"
      - "_acceptance/auto-pr-thoi-do-o-ban-re/rang/**"
    expected: |
      `bun run test` ma 0 tren cay mang ban va. Moi luot chay dung mot co so du lieu
      rieng `crm_<id>_test` nen hang AgentTask cua luot khac khong lan sang.
