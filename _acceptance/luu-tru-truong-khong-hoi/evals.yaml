feature_slug: luu-tru-truong-khong-hoi
evals:
  - id: E1
    criterion: AC-1
    executor: test
    layer: logic
    cmd: config:executors.test.ltk_menu
    paths:
      - "apps/app/components/crm/fields/**"
      - "apps/app/lib/messages/crm.ts"
      - "apps/app/test/luu-tru-truong-khong-hoi.dom.tsx"
    expected: |
      exit 0; FieldsList that (tRPC gia, Toaster that) voi truong dang dung «Nguồn khách» id f-1: mo menu «…» cua dong,
      chon muc crmMessages("vi").fields.archive -> fields.archive nhan dung {id:"f-1"} mot lan; so phan tu
      [role=alertdialog] va [role=dialog] moi mo = 0; vung toast co chu fields.archived("Nguồn khách") va nut
      sheet.hoanTac; so lan goi fields.list tang sau luu tru (danh sach doc lai).
      CHIEU DO ghim: ban sao menu goi archive khong bao toast -> do "ltk: menu luu tru khong co hoan tac".

  - id: E2
    criterion: AC-2
    executor: test
    layer: logic
    cmd: config:executors.test.ltk_trinh_sua
    paths:
      - "apps/app/components/crm/fields/**"
      - "apps/app/lib/messages/crm.ts"
      - "apps/app/test/luu-tru-truong-khong-hoi.dom.tsx"
    expected: |
      exit 0; FieldsSheet THAT (component chu that, khong onDone gia) mo trinh sua truong «Nguồn khách» id f-1 qua
      duong dan: bam nut fields.archive -> fields.archive nhan {id:"f-1"} mot lan ngay, khong co [role=alertdialog] nao;
      trinh sua bi go khoi cay (khong con o nhan); SAU khi go, vung toast van co fields.archived va nut «Hoàn tác»; bam
      -> fields.restore nhan {id:"f-1"} mot lan. Doi chung: truoc khi bam, khong co toast nao.
      CHIEU DO ghim: ban sao giu hop hoi lai -> do "ltk: trinh sua van hoi lai"; ban sao dat hook trong FieldEditor va
      bao toast trong callback cua mutate -> do "ltk: trinh sua dong mat toast".

  - id: E3
    criterion: AC-3
    executor: test
    layer: logic
    cmd: config:executors.test.ltk_hoan_tac
    paths:
      - "apps/app/components/crm/fields/**"
      - "packages/ui/src/lib/bao-luu-tru.ts"
      - "apps/app/test/luu-tru-truong-khong-hoi.dom.tsx"
    expected: |
      exit 0; ma tran viet truoc 2 duong (menu dong, trinh sua): sau luu tru, bam «Hoàn tác» hai lan bang userEvent ->
      fields.restore goi dung 1 lan voi {id:"f-1"}; vung toast co fields.restored("Nguồn khách"); so lan goi fields.list
      tang sau khoi phuc. expect(o.length).toBe(2).
      CHIEU DO ghim: ban sao hoan tac goi restore voi id khac -> do "ltk: hoan tac sai truong"; ban sao bo lam moi sau
      khoi phuc -> do "ltk: hoan tac khong lam moi danh sach".

  - id: E4
    criterion: AC-4
    executor: test
    layer: logic
    cmd: config:executors.test.ltk_hoan_tac_loi
    paths:
      - "apps/app/components/crm/fields/**"
      - "apps/app/lib/messages/crm.ts"
      - "apps/app/test/luu-tru-truong-khong-hoi.dom.tsx"
    expected: |
      exit 0; fields.restore nem loi message "loi-tho-may-chu": bam «Hoàn tác» -> vung toast co
      crmMessages("vi").fields.hoanTacLoi; textContent cua vung toast KHONG chua "loi-tho-may-chu". Ban en ->
      crmMessages("en").fields.hoanTacLoi.
      CHIEU DO ghim: ban sao onError in error.message -> do "ltk: hoan tac loi in loi tho".

  - id: E5
    criterion: AC-5
    executor: test
    layer: logic
    cmd: config:executors.test.ltk_chu
    paths:
      - "apps/app/lib/messages/crm.ts"
      - "apps/app/test/luu-tru-truong-khong-hoi.dom.tsx"
    expected: |
      exit 0; crmMessages("vi").fields.archived("Nguồn khách") === "Đã lưu trữ Nguồn khách.", restored === "Đã khôi
      phục Nguồn khách.", hoanTacLoi === "Chưa hoàn tác được. Trường vẫn ở mục Đã lưu trữ."; ban en cua ba khoa khong
      khop /[À-ỹ]/ (tru phan nhan truong truyen vao); ba khoa archiveTitle, archiveBody, archiveField khong con trong
      ca hai ban.
      CHIEU DO ghim: ban sao en hoanTacLoi co dau Viet -> do "ltk: chu en co dau Viet".

  - id: E6
    criterion: AC-5
    executor: test
    layer: logic
    cmd: config:executors.test.ltk_cap_chu
    paths:
      - "apps/app/lib/messages/*.ts"
      - "apps/app/test/messages-guard.spec.ts"
    expected: |
      exit 0; messages-guard cua kho chay lai: moi khoa moi co du cap en/vi, khoa en khong co chu Viet, khong khoa nao
      khong ai goi (ca «khoa chet»), moi ham ghep bien co khang dinh.

  - id: E7
    criterion: AC-6
    executor: test
    layer: logic
    cmd: config:executors.test.cqt_man_khoa
    paths:
      - "apps/app/components/crm/fields/**"
      - "apps/app/test/chi-quan-tri-truong.dom.tsx"
    expected: |
      exit 0; bai cqt-man-khoa cua ho so da ky chi-quan-tri-truong chay lai khong sua: nguoi khong co quyen thay nut
      khoa va dong noi vi sao.

  - id: E8
    criterion: AC-6
    executor: test
    layer: logic
    cmd: config:executors.test.cqt_sheet_khoa
    paths:
      - "apps/app/components/crm/fields/**"
      - "apps/app/test/chi-quan-tri-truong.dom.tsx"
    expected: |
      exit 0; bai cqt-sheet-khoa cua ho so da ky chi-quan-tri-truong chay lai khong sua.

  - id: E9
    criterion: AC-7
    executor: script
    layer: backend-effect
    cmd: config:executors.script.ltk_man
    paths:
      - "apps/app/components/crm/fields/**"
      - "apps/app/app/(app)/[slug]/settings/fields/**"
      - "_acceptance/luu-tru-truong-khong-hoi/rang/man.mjs"
    expected: |
      exit 0 va "luu-tru-truong-khong-hoi man: dat"; tren may chu that cua phien do, o ca ba buoc cua E10 (menu dong 1440,
      trinh sua 390, ngan «Quản lý trường»): sau «Lưu trữ» fields.list includeArchived tra ve truong voi archived true;
      sau «Hoàn tác» archived false. Ma tran viet truoc 3 buoc x 2 trang thai = 6 phep.
      CHIEU DO ghim: --chieu-do-api bo buoc bam Hoan tac -> do "man: hoan tac khong khoi phuc tren may chu".

  - id: E10
    criterion: AC-7
    executor: ui-check
    layer: ui-observed
    cmd: config:executors.script.ltk_man
    paths:
      - "apps/app/components/crm/fields/**"
      - "apps/app/app/(app)/[slug]/settings/fields/**"
      - "apps/app/lib/messages/crm.ts"
      - "_acceptance/luu-tru-truong-khong-hoi/rang/man.mjs"
    expected: |
      exit 0 va "luu-tru-truong-khong-hoi man: dat"; buoc 1 (1440) menu dong -> «Lưu trữ» -> khong co [role=alertdialog];
      toast «Đã lưu trữ …» co «Hoàn tác»; truong o nhom «Đã lưu trữ»; chup ltk-toast-1440.png; bam «Hoàn tác» -> truong ve
      nhom dang dung; chup ltk-hoan-tac-1440.png. Buoc 2 (390) mo trinh sua cua truong -> «Lưu trữ» -> trinh sua dong,
      khong co hop hoi lai, toast va nut «Hoàn tác» nam trong khung nhin; chup ltk-toast-390.png; bam «Hoàn tác» -> truong
      ve nhom dang dung. Buoc 3 (1440) mo /companies?manageFields=company -> menu dong -> «Lưu trữ» -> bam «Hoàn tác» ->
      ngan van mo, truong ve nhom dang dung; chup ltk-ngan-1440.png. CHIEU DO ghim them: ngan dong sau Hoan tac -> do
      "man: hoan tac dong ngan".
      Ho so da signed-off/machine-cleared thi khong chep anh vao ho so.
      CHIEU DO ghim: --chieu-do khong luu tru -> do "man: khong thay toast luu tru".
    steps:
      - "Chay nguyen van dong lenh khai trong cmd (tien-de.mjs --chay), KHONG goi thang man.mjs"
      - "Buoc 1 (1440): menu dong, toast, Hoan tac -> ltk-toast-1440.png, ltk-hoan-tac-1440.png"
      - "Buoc 2 (390): trinh sua, toast trong khung nhin -> ltk-toast-390.png"
      - "Buoc 3 (1440): ngan Quan ly truong tu bang Cong ty -> ltk-ngan-1440.png"
    evidence_required:
      - "_acceptance/luu-tru-truong-khong-hoi/evidence/ltk-toast-1440.png"
      - "_acceptance/luu-tru-truong-khong-hoi/evidence/ltk-hoan-tac-1440.png"
      - "_acceptance/luu-tru-truong-khong-hoi/evidence/ltk-toast-390.png"
      - "_acceptance/luu-tru-truong-khong-hoi/evidence/ltk-ngan-1440.png"

  - id: E11
    criterion: AC-8
    executor: judgment
    inputs:
      - "_acceptance/luu-tru-truong-khong-hoi/evidence/ltk-toast-1440.png"
      - "_acceptance/luu-tru-truong-khong-hoi/evidence/ltk-hoan-tac-1440.png"
      - "_acceptance/luu-tru-truong-khong-hoi/evidence/ltk-toast-390.png"
      - "docs/vong-doi.md"
    question: |
      Ghi chú cho người chấm: ảnh ltk-toast chụp danh sách trường ở Cài đặt ngay sau khi một trường vừa được lưu trữ;
      ảnh ltk-hoan-tac chụp sau khi bấm «Hoàn tác». Đuôi -1440 và -390 là bề rộng màn.
      Nhìn ba ảnh: (1) người đọc có hiểu ngay trường vừa được cất, không phải bị xoá? (2) «Hoàn tác» có dễ thấy và đọc như
      cách lấy lại ngay không? (3) chữ có đúng bộ chữ của `docs/vong-doi.md` — «Lưu trữ», «Đã lưu trữ», «Khôi phục»,
      «Hoàn tác» — không có «ẩn» hay «xoá»? (4) ở 390 toast và nút có bị cắt hay tràn không? Nêu từng điểm kèm ảnh.

  - id: E12
    criterion: AC-5
    executor: test
    layer: logic
    cmd: config:executors.test.vdc_chu
    paths:
      - "apps/app/lib/messages/crm.ts"
      - "apps/app/test/vong-doi-mot-cach-cat.dom.tsx"
    expected: |
      exit 0; bai vdc-chu cua ho so da ky vong-doi-mot-cach-cat chay lai sau khi bo tham chieu archiveBody: chu mo ta
      truong luu tru (archivedNote) van khong co «ẩn»/«hidden».

  - id: E13
    criterion: AC-2
    executor: script
    layer: logic
    cmd: config:executors.script.ltk_san_thiet_ke
    paths:
      - "apps/app/components/crm/fields/field-editor.tsx"
      - "apps/app/components/crm/fields/fields-list.tsx"
    expected: |
      exit 0; design-gate.mjs --mode static cua kit qua ca hai tep field-editor.tsx va fields-list.tsx.
