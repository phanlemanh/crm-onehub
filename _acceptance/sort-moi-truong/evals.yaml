  - id: E9
    criterion: AC-9
    executor: ui-check
    layer: ui-observed
    cmd: config:executors.script.smt_man
    steps:
      - "Chạy ở thư mục gốc kho: BANG_CHUNG=_acceptance/sort-moi-truong/evidence bun scripts/lan-do/tien-de.mjs --chay \"bun _acceptance/sort-moi-truong/rang/do-man.mjs\" — phiên đo tự dựng kho riêng, API và app của cây này."
      - "Đọc dòng cuối: mã 0 kèm 'smt man: dat' = đạt; mã 2 = không đo được (nêu lý do); mã 1 = lỗi bước có lời 'smt man: …'."
      - "Mở sáu ảnh smt-bang-thoa-thuan-sap-1280.png, smt-bang-thoa-thuan-768.png, smt-bang-cong-ty-768.png, smt-bang-thoa-thuan-375-menu.png, smt-kanban-1280.png, smt-kanban-375.png, đối chiếu bằng mắt với Expected."
    inputs: [_acceptance/sort-moi-truong/evidence/]
    expected: |
      Dữ liệu dựng qua API thật trong phiên đo: mỗi loại bản ghi ba bản ghi; mười trường tự tạo mỗi loại (một mỗi kiểu, bật «Hiện trong bảng»), có giá trị khác nhau, một bản ghi trống trường Số; thoả thuận nằm ở hai giai đoạn.
      0. smt-bang-thoa-thuan-sap-1280 (ST-bang-sap-tang): đường dẫn mang sort=field:<khoá Số>&dir=asc; tiêu đề cột Số có mũi tên và aria-sort='ascending'; cột Số căn phải như Giá trị; hàng theo giá trị tăng, hàng trống cuối. do-man.mjs đọc DOM: aria-sort của cột Số khác 'ascending' thì thoát 1 'smt man: aria-sort <gia tri>'; mũi tên sắp (svg trong nút tiêu đề) vắng, bị một khung cắt (overflow) giữa nó và ô tiêu đề cắt mất, hay tâm của nó thuộc phần tử ngoài ô tiêu đề (elementFromPoint) thì thoát 1 'smt man: mui ten <vang|bi-cat|bi-che>'; thứ tự tên hàng khác đáp án dựng trong rang thì thoát 1 'smt man: thu tu <ten>'.
      1. smt-bang-*-768 (ST-bang-hep): cột trường tự tạo kiểu Người, Liên kết, Email, Điện thoại, Số nhìn thấy như cột Người phụ trách; cột Chữ, Ngày, Chọn, Ô tích không thấy, như Ngày chốt. do-man.mjs đọc getComputedStyle(display) của tiêu đề mỗi cột 'field:*' ở 768: khác đáp án theo kiểu thì thoát 1 'smt man: 768 <kieu> <display>'.
      1b. smt-bang-thoa-thuan-375-menu: mở menu sort của bảng ở 375; đáp án viết tay trong rang: chín nhãn trường tự tạo sort được có mục, nhãn Ô tích không có; thiếu thì thoát 1 'smt man: 375 menu thieu <kieu>', thừa Ô tích thì thoát 1 'smt man: 375 menu thua o tich'. Chọn trường Ngày: đường dẫn không mang sort=field:<khoá Ngày> thì thoát 1 'smt man: 375 url <qs>'; thứ tự tên hàng khác đáp án thì thoát 1 'smt man: 375 thu tu <ten>'.
      2. smt-kanban-1280 (ST-kanban-the): thẻ có hai dòng nhãn và giá trị của hai trường tự tạo đầu tiên, Số «1.234,5», nằm dưới Ngày chốt, cùng cỡ chữ và lề với các dòng có sẵn; thẻ có trường trống không có dòng ấy; do-man.mjs kiểm thẻ Beta có mặt trước, vắng thì thoát 1 'smt man: kanban beta vang'.
      3. smt-kanban-375: có ít nhất ba thẻ, không thì thoát 1 'smt man: 375 khong co the <n>'; không cuộn ngang; do-man.mjs đo document.documentElement.scrollWidth > 375 thì thoát 1 'smt man: 375 cuon ngang'.
      Đối chứng bằng mắt: thẻ không vỡ chữ, dòng trường không đè Người phụ trách hay Giai đoạn.
