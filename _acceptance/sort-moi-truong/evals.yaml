    expected: "exit 0; -t smt-api-sap của apps/api/test/sort-moi-truong.spec.ts trên kho thử của lượt. Cô lập: kho thử của lượt dùng chung giữa các tệp, nên mọi bản ghi của ca mang tiền tố tên riêng của ca và mọi lời gọi list/board mang q là tiền tố ấy; đầu ca, lời gọi với q ấy trả khác 0 hàng thì ném 'smt <ca>: lan <n>'; cuối ca lưu trữ trường đã tạo. Fixture qua đường ghi thật (caller tRPC với phiên quản trị): chín trường DEAL tự tạo, một mỗi kiểu TEXT, LONG_TEXT, NUMBER, DATE, SELECT, USER, URL, EMAIL, PHONE; SELECT có ba lựa chọn mà thứ tự position khác thứ tự chữ cái (C, A, B); USER trỏ ba thành viên tên khác nhau. Sáu thoả thuận T1..T6 tạo lần lượt (createdAt và id tăng dần), tên sau tiền tố: T1 'Bình', T2 'Cường', T3 'Dung', T4 'An', T5 'Em', T6 'Chi': với mỗi kiểu, T1, T4, T6 mang cùng một giá trị (nhóm hoà ba bản ghi), T2 giá trị nhỏ nhất, T5 giá trị lớn nhất, T3 trống. Đáp án viết tay trong test cho mỗi kiểu, không tính bằng hàm của mã: tăng = [T2, T4, T1, T6, T5, T3], giảm = [T5, T4, T1, T6, T2, T3] (nhóm hoà theo tên A→Z như sort chuẩn: An, Bình, Chi = T4, T1, T6 ở cả hai chiều — khác cả thứ tự tạo T1, T4, T6 lẫn thứ tự ngược T6, T4, T1, nên luật hoà theo id hay createdAt chiều nào cũng đỏ; trống cuối cả hai chiều); riêng SELECT tăng theo position. Gọi deals.list({q, sort: 'field:<khoa>', dir, pageSize: 25}) cho 9 kiểu × 2 chiều. Thứ tự id lệch đáp án thì ném 'smt api sap: <kieu> <dir> ra <ten>'. Số ô đã so khác 18 thì ném 'smt api sap: thieu o <n>'. Đối chứng dương cùng fixture: deals.list({sort: 'amount'}) phải trả đúng thứ tự Giá trị đã gán (T3, T5, T1, T4, T2, T6) (thước đọc được thứ tự thật), lệch thì ném 'smt api sap: doi chung amount'. Chiều đỏ trong lịch sử: trên onehub 03d4842f1, sort 'field:…' rơi về createdAt desc = [T5, T4, T3, T2, T1], ném 'smt api sap: TEXT asc ra T5,T4,T3,T2,T1'."
