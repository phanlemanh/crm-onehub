  - id: E13
    criterion: AC-12
    executor: script
    cmd: config:executors.script.tvhk_do_khoi
    paths:
      - "apps/app/app/(app)/[slug]/settings/members/**"
      - "_acceptance/thanh-vien-hai-khoi-cung-khuon/rang/do-khoi.mjs"
