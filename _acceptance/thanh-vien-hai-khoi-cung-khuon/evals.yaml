schema_version: 1
slug: thanh-vien-hai-khoi-cung-khuon

evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.tvhk_do_khoi
    paths:
      - "apps/app/app/(app)/[slug]/settings/members/**"
      - "packages/ui/src/components/card-table.tsx"
      - "packages/ui/src/components/simple-table.tsx"
      - "packages/ui/src/components/data-table.tsx"
      - "_acceptance/thanh-vien-hai-khoi-cung-khuon/rang/do-khoi.mjs"
    expected: |
      Ban do tu chan cay (canhCay qua APP_URL), gieo 15 loi cho phep tien to "tvhk-lan-do-",
      mo trang that o 1440x900, 768x1024, 375x812. Ma tran viet truoc: moi kho DUNG MOT dong
      "DUNG <kho>: vo hai bang — vien tren A/B px, goc A/B, nen tieu de A/B, co chu A/B" voi
      A la vo bang tren ([data-slot=table-container] dau tien trong page-shell-content), B la
      vo bang dau tien trong section chua tieu de «Được phép vào» (bang ve tay khong co vo thi
      B la chinh <table>); dat khi vien tren ca hai >= 1px va bang nhau, border-radius bang
      nhau, background-color cua <thead> bang nhau va khong trong suot, font-size cua o tbody
      dau bang nhau. Thieu mot trong hai bang -> dong SAI goi ten bang thieu, khong ma 2.
      MA TRAN VIET TRUOC cua ca luot tvhk_do_khoi (mang MA_TRAN trong do-khoi.mjs, moi dong mot
      ma): 4 ma moi kho x 3 kho (vo, mep-tieu-de, mep-du-lieu, tran-ngang) + 1440: 5 luong cho
      phep (E3) + 4 duong loi (E18) + 4 tieu de (E4) + 8 hanh dong hang (E6) + 4 cot (E7) + 1 o
      tim (E13) + 3 khong quyen (E10) + 375: 2 cuon ngang (E5) + 3 don (E14) = 46. Dong KET LUAN
      cuoi: "46 DUNG, 0 SAI — ma thoat 0". Ma nao trong MA_TRAN khong phat ra dong nao khi luot
      ket thuc -> "SAI thieu <ma>", ma 1. Pha-thu o S3: TVHK_BO_KHO=768 -> dung bon dong
      "SAI thieu 768-..." (tran-ngang, mep-*, vo cua 768 = 4 dong), ma 1.
      CHIEU DO (chay o S3 tren giao dien chua sua, sau khi chuoi va tu dien da co): "SAI <kho>:
      vo hai bang — vien tren 1/0 px ... co chu 12/14px" o ca ba kho, ma 1.

  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.tvhk_do_khoi
    paths:
      - "apps/app/app/(app)/[slug]/settings/members/**"
      - "packages/ui/src/components/card-table.tsx"
      - "packages/ui/src/components/data-table.tsx"
      - "_acceptance/thanh-vien-hai-khoi-cung-khuon/rang/do-khoi.mjs"
    expected: |
      Moi kho hai dong: "DUNG <kho>: mep trai noi dung o tieu de cot dau lech <d>px" va "DUNG
      <kho>: mep trai noi dung o du lieu cot dau lech <d>px" voi d = |(rect.left + padding-left
      + border-left) cua o tren - cua o duoi| <= 1, do khi scrollLeft cua vo bang duoi = 0.
      Doi chung duong: mep trai cua chinh o tren do hai lan cho cung so (in trong dong GHI CHU).
      CHIEU DO (giao dien chua sua): "SAI <kho>: mep trai ... lech 17px" (o duoi khong co padding
      va khong co vien vo) o ca ba kho, ma 1.

  - id: E3
    criterion: AC-3
    executor: script
    layer: backend-effect
    cmd: config:executors.script.tvhk_do_khoi
    paths:
      - "apps/app/app/(app)/[slug]/settings/members/**"
      - "apps/app/components/page-shell.tsx"
      - "_acceptance/thanh-vien-hai-khoi-cung-khuon/rang/do-khoi.mjs"
    expected: |
      O 1440x900, scrollTop 0: "DUNG 1440: nut «Cho phép một địa chỉ» trong [data-slot=
      page-shell-actions] (true), tron trong khung nhin (bottom <px> <= 900), tam tra ve chinh
      nut (true)". Roi bam nut: "DUNG 1440: hop «Cho phép một địa chỉ» mo"; go dia chi
      "tvhk-lan-do-<pid>-moi@lan-do.onehub.vn", bam «Cho phép»: "DUNG 1440: hang cua dia chi moi
      hien trong khoi duoi", "DUNG 1440: DB co 1 loi cho phep dang cho cho dia chi moi",
      "DUNG 1440: tieu de khoi duoi tu «Được phép vào · M» thanh «Được phép vào · M+1»".
      Chuoi nut, tieu de hop va nut gui doc tu thanhVienMessages("vi").
      CHIEU DO (giao dien chua sua): "SAI 1440: nut ... trong page-shell-actions (false), tron
      trong khung nhin (bottom ~990 <= 900) ..." ma 1 — nut nam o dau khoi duoi, duoi mep man.
      Ve luong cho phep la doi chung duong: tren giao dien cu luong van chay tu nut o khoi duoi.

  - id: E4
    criterion: AC-4
    executor: script
    cmd: config:executors.script.tvhk_do_khoi
    paths:
      - "apps/app/app/(app)/[slug]/settings/members/**"
      - "apps/app/lib/messages/settings-thanh-vien.ts"
      - "_acceptance/thanh-vien-hai-khoi-cung-khuon/rang/do-khoi.mjs"
    expected: |
      O 1440: "DUNG 1440: tieu de khoi tren «Đã vào · N»" voi N = db.member.count theo
      WORKSPACE_ID, "DUNG 1440: tieu de khoi duoi «Được phép vào · M»" voi M = db.invitation.count
      status pending theo WORKSPACE_ID (sau gieo), ca hai doc tu [data-slot=card-title] va so
      voi t.dem(t.bang.tieuDe, N) / t.dem(t.duocPhepVao.tieuDe, M); "DUNG 1440: moi khoi la section
      aria-labelledby tro toi chinh card-title cua no" (2/2). Mo lai voi ?q=<ten mot thanh vien>
      co san: "DUNG 1440: loc con 1 hang, tieu de van «Đã vào · N»".
      CHIEU DO (giao dien chua sua): khong co card-title nao -> "SAI 1440: tieu de khoi tren
      «(khong co)»" va tuong tu khoi duoi, "SAI ... section aria-labelledby 0/2", ma 1.

  - id: E5
    criterion: AC-5
    executor: script
    cmd: config:executors.script.tvhk_do_khoi
    paths:
      - "apps/app/app/(app)/[slug]/settings/members/**"
      - "packages/ui/src/components/card-table.tsx"
      - "apps/app/components/page-shell.tsx"
      - "_acceptance/thanh-vien-hai-khoi-cung-khuon/rang/do-khoi.mjs"
    expected: |
      O 375x812: "DUNG 375: tran ngang 0px (document va main)" — max(document.scrollWidth -
      clientWidth, main.scrollWidth - main.clientWidth) <= 0; "DUNG 375: vo bang duoi cuon
      ngang duoc (scrollWidth S > clientWidth C)"; dat chuot vao tam vo bang duoi, lan con lan
      ngang (page.mouse.wheel deltaX, toi 20 nac, dung khi scrollLeft het doi — KHONG gan
      scrollLeft): "DUNG 375: con lan ngang dua vo toi scrollLeft <n> va nut «…» cua hang dau
      nam tron trong vo (true)". O 1440 va 768 them "DUNG <kho>: tran ngang 0px".
      CHIEU DO (giao dien chua sua): "SAI 375: tran ngang 98px" va "SAI 375: vo bang duoi cuon
      ngang duoc (false)", ma 1. Pha-thu o S3: them overflow-x-hidden cho vo CardTable (ban sao)
      -> dong con lan ngang SAI.

  - id: E6
    criterion: AC-6
    executor: script
    layer: backend-effect
    cmd: config:executors.script.tvhk_do_khoi
    paths:
      - "apps/app/app/(app)/[slug]/settings/members/**"
      - "packages/ui/src/components/dropdown-menu.tsx"
      - "_acceptance/thanh-vien-hai-khoi-cung-khuon/rang/do-khoi.mjs"
    expected: |
      O 1440, trong khoi duoi: "DUNG 1440: 0 nut chu «Rút» hien san" (button co textContent
      trim bang t.duocPhepVao.rut, rect > 0, khong nam trong [role=menu]); "DUNG 1440: moi hang
      co nut «Phát liên kết» hien san (15+/15+)"; "DUNG 1440: moi hang co nut «…» ten «Hành động
      với <dia chi>» (15+/15+)". Voi hang loi cho phep gieo so 00: bam «…» -> "DUNG 1440: menu co
      muc «Rút» data-variant=destructive"; chon -> "DUNG 1440: hop «Rút lời cho phép này?» mo";
      bam «Rút» trong hop -> "DUNG 1440: hang bien mat", "DUNG 1440: tieu de giam mot",
      "DUNG 1440: DB — loi cho phep 00 khong con status pending (canceled)".
      CHIEU DO (giao dien chua sua): "SAI 1440: 15+ nut chu «Rút» hien san", "SAI 1440: moi hang
      co nut «…» (0/15+)", cac dong luong menu SAI (khong co nut de bam) — khong ma 2, ma 1.

  - id: E7
    criterion: AC-7
    executor: script
    cmd: config:executors.script.tvhk_do_khoi
    paths:
