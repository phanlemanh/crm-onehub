      CHIEU DO (giao dien chua sua): o vai tro mau chu thuong khac mau tieu de -> SAI; cot thoi
      gian left/left -> SAI; co chu 14px/12px -> SAI; ma 1.

  - id: E8
    criterion: AC-8
    executor: test
    cmd: config:executors.test.tvhk_dang_tai
    paths:
      - "apps/app/app/(app)/[slug]/settings/members/allowances-table.tsx"
      - "apps/app/test/thanh-vien-hai-khoi.dom.tsx"
    expected: |
      bun test ca "dang-tai" xanh: render AllowancesTable voi workspace.get canManageMembers true
      va workspace.allowances co queryFn khong bao gio tra ve; khang dinh section co
      [data-slot=card-title] bat dau bang t.duocPhepVao.tieuDe, co >= 3 [data-slot=skeleton],
      va textContent khong chua t.duocPhepVao.trong. Du lieu gia go kieu bang
      `satisfies RouterOutputs["workspace"]["allowances"]` (va ["workspace"]["get"]) de
      check-types do khi khuon lech dau ra that. Doi chung duong trong cung tep: cung khung
      nhung queryFn tra 1 hang -> 0 skeleton va dia chi hien.
      CHIEU DO (giao dien chua sua): expect loi "khung xuong: 0 >= 3" va "cau rong hien khi
      dang tai", exit 1.

  - id: E9
    criterion: AC-9
    executor: test
    cmd: config:executors.test.tvhk_rong
    paths:
      - "apps/app/app/(app)/[slug]/settings/members/allowances-table.tsx"
      - "packages/ui/src/components/card-table.tsx"
      - "apps/app/test/thanh-vien-hai-khoi.dom.tsx"
    expected: |
