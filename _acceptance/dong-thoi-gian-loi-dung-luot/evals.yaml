evals:
  - id: E1
    criterion: AC-1
    executor: test
    layer: logic
    cmd: config:executors.test.dtl_lam_moi_roi_xem_cu
    paths:
      - "apps/app/components/crm/timeline/timeline.tsx"
      - "apps/app/test/dong-thoi-gian-loi-dung-luot.dom.tsx"
      - "apps/app/test/khung-gop-y.tsx"
    expected: |
      exit 0; Timeline that, tRPC gia (khung-gop-y.tsx), mot con nho goi queryClient.invalidateQueries(). Trang dau 3 muc
      (nextCursor "c1"); lan doc lai trang dau nem "boom-lam-moi" -> invalidate -> cho [data-dtg-loi=lam-moi]. Ma tran viet
      truoc 3 o, moi o mot lan mo moi: (a) dang tai: trang "c1" tra promise do bai giu -> bam «Xem cũ hơn» -> cho lan goi
      cursor "c1" -> [data-dtg-loi=xem-cu] === null va [data-dtg-loi=lam-moi] !== null (doc lai sau 10 nhip trong luc con
      treo), nut «Xem cũ hơn» !== null va disabled === true, bam them -> so lan goi cursor "c1" van la 1; MutationObserver
      gan tu luc bam toi luc giai promise dem so lan chen [data-dtg-loi=xem-cu] === 0; (b) xong thanh cong: giai promise voi 2 muc -> 5 dong, [data-dtg-loi=lam-moi] VAN !== null, khong xem-cu;
      (c) xong loi: promise reject -> ca hai thong bao !== null. Chi so gia tri nguyen thuy (luat 35).
      CHIEU DO ghim: ban sao timeline.tsx dung lai co isFetchNextPageError/isRefetchError -> do "dtl: thong bao xem cu hien khi dang tai" (o a) va "dtl: canh bao lam moi tat sau xem cu" (o b).

