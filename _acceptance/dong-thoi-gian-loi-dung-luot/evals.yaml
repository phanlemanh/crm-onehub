    cmd: config:executors.test.dtl_xem_cu_roi_lam_moi
    paths:
      - "apps/app/components/crm/timeline/timeline.tsx"
      - "apps/app/test/dong-thoi-gian-loi-dung-luot.dom.tsx"
      - "apps/app/test/khung-gop-y.tsx"
    expected: |
      exit 0; trang dau 3 muc (nextCursor "c1"), trang "c1" nem "boom-trang-ke" -> bam «Xem cũ hơn» -> cho
      [data-dtg-loi=xem-cu]. Ma tran viet truoc 3 o, moi o mot lan mo moi: (a) dang tai: lan doc lai trang dau tra promise
      do bai giu -> invalidate -> cho lan goi khong cursor -> [data-dtg-loi=lam-moi] === null va [data-dtg-loi=xem-cu]
      !== null (doc lai sau 10 nhip); MutationObserver dem so lan chen [data-dtg-loi=lam-moi] tu luc invalidate toi luc
      giai promise === 0; (b) lam moi thanh cong: giai promise -> ca hai === null, nut «Xem cũ hơn» !== null;
      (c) lam moi loi: promise reject -> ca hai !== null.
      CHIEU DO ghim: ban sao dung lai co cua luot dang chay -> do "dtl: canh bao lam moi hien khi dang tai".

  - id: E3
    criterion: AC-3
    executor: test
    layer: logic
    cmd: config:executors.test.dtl_thu_lai_lam_moi
    paths:
      - "apps/app/components/crm/timeline/timeline.tsx"
      - "apps/app/test/dong-thoi-gian-loi-dung-luot.dom.tsx"
    expected: |
      exit 0; thong bao lam-moi hien; lan doc lai tra promise do bai giu -> bam «Thử lại» cua thong bao -> nut co
      disabled === true, bam them -> so lan goi khong cursor tang dung 1; thong bao VAN hien trong luc treo; giai promise
      -> thong bao === null. O doi chung: thong bao lam-moi hien + xem cu thanh cong (trang "c1" tra 2 muc) -> thong bao
      lam-moi VAN !== null (chi luot lam moi thanh cong moi tat). O giu qua doi tab: staleTime 30000, lam moi loi -> xem
      cu thanh cong (5 dong) -> sang Ghi chu -> quay lai Tat ca (khong tai lai) -> thong bao lam-moi VAN !== null.
      CHIEU DO ghim: ban sao tat lamMoi khi so trang tang -> do "dtl: canh bao lam moi tat sau xem cu"; ban sao nho loi
      theo lan gan (khong theo QueryClient) -> do "dtl: canh bao lam moi mat khi doi tab".

  - id: E4
    criterion: AC-4
    executor: test
    layer: logic
    cmd: config:executors.test.dtl_doi_tab
    paths:
      - "apps/app/components/crm/timeline/timeline.tsx"
      - "apps/app/test/dong-thoi-gian-loi-dung-luot.dom.tsx"
    expected: |
      exit 0; tab Tat ca co thong bao xem-cu (trang "c1" loi) -> bam tab «Ghi chú» (filter notes, tra 2 muc khong loi) ->
      khong [data-dtg-loi] nao; doi chung duong: tab Ghi chu co lan doc lai loi -> invalidate -> [data-dtg-loi=lam-moi]
      !== null. O quay lai: QueryClient dat staleTime 30000 (nhu app) -> tab Tat ca loi xem cu -> sang Ghi chu -> quay lai
      Tat ca: TanStack 5.101 tai lai trang dau (luot loi dat isInvalidated: true, query.js:388) -> dung 1 lan goi khong
      cursor; trong luc lan tai lai treo, thong bao xem-cu cua chinh tab do hien lai (AC-4 «hien lai dung loai») va
      MutationObserver dem so lan chen [data-dtg-loi=lam-moi] === 0; giai -> khong [data-dtg-loi], nut «Xem cũ hơn»
      !== null. O quay lai loi: nhu tren nhung lan tai lai bi tu choi -> ca lam-moi va xem-cu !== null (nhu AC-2 o c). Moi bai dat lai dong ho that (setSystemTime()) truoc khi chay.
      O sang tab co cache: Ghi chu da tai (staleTime 30000) -> Tat ca loi xem cu -> sang Ghi chu tu cache -> khong
      [data-dtg-loi] nao chen vao va khong con sau 10 nhip.
      CHIEU DO ghim: ban sao dung lai co cua luot dang chay (isRefetchError/isFetchNextPageError) -> do "dtl: thong bao theo
      sang tab moi"; ban sao nho loi theo lan gan -> do "dtl: quay lai tab loi mat thong bao" va "dtl: quay lai tai lai
      hong sai loai thong bao".

