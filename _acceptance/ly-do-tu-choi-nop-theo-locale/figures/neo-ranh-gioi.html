<!DOCTYPE html>
<html lang="vi" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google" content="notranslate">
  <title>Neo thước ranh giới</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #fafafa;
      --color-ink:    #171717;
      --color-muted:  #575757;
      --color-accent: #006B4F;
      --font-sans:    'Geist', -apple-system, 'Helvetica Neue', Arial, sans-serif;
      --font-serif:   'Lora', Georgia, 'Times New Roman', serif;
      --font-mono:    'Geist Mono', 'SF Mono', Menlo, Consolas, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1240px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.01em;
      line-height: 1.3;
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    svg .sans { font-family: var(--font-sans); }
    svg .mono { font-family: var(--font-mono); }
    svg .serif { font-family: var(--font-serif); }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Luồng quyết định · ly-do-tu-choi-nop-theo-locale · AC-8</p>
    <h1>Thước ranh giới đo từ đâu, trước và sau khi hồ sơ lên onehub</h1>

    <svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Thước ranh giới chọn điểm neo theo việc hồ sơ đã lên onehub hay chưa">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#575757"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#006B4F"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#fafafa"/>

      <text class="mono" x="40" y="48" fill="#575757" font-size="9" font-weight="500" letter-spacing="0.18em">THƯỚC CHỌN ĐIỂM NEO TRƯỚC KHI ĐẾM TỆP ĐỔI</text>

      <line x1="232" y1="176" x2="260" y2="176" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="504" y1="176" x2="556" y2="176" stroke="#006B4F" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
      <path d="M384,240 V336 Q384,344 392,344 H556" fill="none" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M800,176 H1004 Q1012,176 1012,184 V196" fill="none" stroke="#006B4F" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
      <path d="M800,344 H1004 Q1012,344 1012,336 V324" fill="none" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="516" y="152" width="32" height="16" rx="2" fill="#fafafa"/>
      <text class="mono" x="532" y="164" fill="#006B4F" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="0.08em">CÓ</text>

      <rect x="392" y="276" width="44" height="16" rx="2" fill="#fafafa"/>
      <text class="mono" x="396" y="288" fill="#575757" font-size="9" letter-spacing="0.08em">KHÔNG</text>

      <rect x="40" y="152" width="192" height="48" rx="24" fill="#fafafa"/>
      <rect x="40" y="152" width="192" height="48" rx="24" fill="rgba(23,23,23,0.03)" stroke="rgba(23,23,23,0.30)" stroke-width="1"/>
      <text class="sans" x="136" y="172" fill="#171717" font-size="12" font-weight="600" text-anchor="middle">Thước ranh giới</text>
      <text class="sans" x="136" y="188" fill="#171717" font-size="12" font-weight="600" text-anchor="middle">K2c chạy</text>
      <text class="mono" x="136" y="220" fill="#575757" font-size="9" text-anchor="middle">bài đo E8</text>

      <polygon points="264,176 384,112 504,176 384,240" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text class="sans" x="384" y="172" fill="#171717" font-size="12" font-weight="600" text-anchor="middle">Hồ sơ đã lên</text>
      <text class="sans" x="384" y="188" fill="#171717" font-size="12" font-weight="600" text-anchor="middle">onehub?</text>

      <rect x="560" y="128" width="240" height="96" rx="6" fill="#fafafa"/>
      <rect x="560" y="128" width="240" height="96" rx="6" fill="rgba(0,107,79,0.08)" stroke="#006B4F" stroke-width="1.4"/>
      <rect x="576" y="140" width="64" height="16" rx="2" fill="transparent" stroke="rgba(0,107,79,0.55)" stroke-width="0.8"/>
      <text class="mono" x="608" y="152" fill="#006B4F" font-size="9" font-weight="500" text-anchor="middle" letter-spacing="0.08em">ĐÃ GỘP</text>
      <text class="sans" x="576" y="184" fill="#171717" font-size="12" font-weight="600">Tìm merge đưa hồ sơ lên</text>
      <text class="sans" x="576" y="204" fill="#575757" font-size="11">đo diff của chính merge đó</text>
      <text class="mono" x="680" y="244" fill="#575757" font-size="9" text-anchor="middle">merge-base(M^1, M^2) → M^2</text>

      <rect x="560" y="296" width="240" height="96" rx="6" fill="#fafafa"/>
      <rect x="560" y="296" width="240" height="96" rx="6" fill="rgba(23,23,23,0.03)" stroke="rgba(23,23,23,0.30)" stroke-width="1"/>
      <rect x="576" y="308" width="100" height="16" rx="2" fill="transparent" stroke="rgba(23,23,23,0.35)" stroke-width="0.8"/>
      <text class="mono" x="626" y="320" fill="#575757" font-size="9" font-weight="500" text-anchor="middle" letter-spacing="0.08em">NHÁNH CÒN MỞ</text>
      <text class="sans" x="576" y="352" fill="#171717" font-size="12" font-weight="600">Đo từ điểm rẽ khỏi onehub</text>
      <text class="sans" x="576" y="372" fill="#575757" font-size="11">tới đỉnh nhánh</text>
      <text class="mono" x="680" y="412" fill="#575757" font-size="9" text-anchor="middle">merge-base onehub HEAD → HEAD</text>

      <rect x="864" y="200" width="296" height="120" rx="6" fill="#fafafa"/>
      <rect x="864" y="200" width="296" height="120" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1.2"/>
      <rect x="880" y="212" width="96" height="16" rx="2" fill="transparent" stroke="rgba(23,23,23,0.45)" stroke-width="0.8"/>
      <text class="mono" x="928" y="224" fill="#171717" font-size="9" font-weight="500" text-anchor="middle" letter-spacing="0.08em">CẢ HAI ĐƯỜNG</text>
      <text class="sans" x="880" y="256" fill="#171717" font-size="12" font-weight="600">Mọi tệp đổi phải nằm trong</text>
      <text class="sans" x="880" y="276" fill="#171717" font-size="12" font-weight="600">ranh giới hàng</text>
      <text class="sans" x="880" y="296" fill="#575757" font-size="11">hoặc danh sách đã duyệt</text>
      <text class="mono" x="1160" y="340" fill="#575757" font-size="9" text-anchor="end">cham-tep</text>

      <line x1="40" y1="452" x2="1160" y2="452" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>
      <text class="mono" x="40" y="480" fill="#575757" font-size="9" font-weight="500" letter-spacing="0.18em">VÌ SAO</text>

      <rect x="40" y="496" width="112" height="20" rx="2" fill="transparent" stroke="rgba(23,23,23,0.45)" stroke-width="0.8"/>
      <text class="mono" x="96" y="510" fill="#171717" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="0.08em">TRƯỚC KHI SỬA</text>
      <text class="serif" x="168" y="512" fill="#171717" font-size="14" font-style="italic">thước chỉ neo điểm rẽ tự hết hạn khi hồ sơ lên onehub — E13b của K2 đỏ khi ghim lại 08/10.</text>
      <text class="sans" x="168" y="536" fill="#575757" font-size="11">Thước mới in ra điểm neo đã chọn, để người soát thấy nó đo từ đâu.</text>

      <line x1="40" y1="556" x2="1160" y2="556" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>
      <text class="mono" x="40" y="584" fill="#575757" font-size="9" font-weight="500" letter-spacing="0.18em">CHÚ GIẢI</text>
      <rect x="124" y="574" width="24" height="12" rx="2" fill="rgba(0,107,79,0.08)" stroke="#006B4F" stroke-width="1"/>
      <text class="sans" x="156" y="584" fill="#575757" font-size="11">đường mới của vòng này</text>
      <rect x="328" y="574" width="24" height="12" rx="2" fill="rgba(23,23,23,0.03)" stroke="rgba(23,23,23,0.30)" stroke-width="1"/>
      <text class="sans" x="360" y="584" fill="#575757" font-size="11">đường giữ nguyên</text>
      <polygon points="496,580 508,572 520,580 508,588" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text class="sans" x="528" y="584" fill="#575757" font-size="11">câu máy tự xét</text>
      <text class="mono" x="672" y="584" fill="#575757" font-size="9">chữ nhỏ dạng mã</text>
      <text class="sans" x="764" y="584" fill="#575757" font-size="11">= lệnh, tên trong code</text>
    </svg>
  </div>
</body>
</html>
