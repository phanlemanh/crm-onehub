schema_version: 1
enforcement: strict
gap_probe: advisory
recheck: strict
feature_loop:
  ui_standards_skill: web-design-guidelines
  suite_keys:
    - executors.test.api
    - executors.script.check_types_khong_cache
    - executors.script.lint_khong_cache
    - executors.script.lint_slop
design_pass:
  ds_skill: web-design-guidelines
executors:
  test:
    api: "bun run db:test && bun run test"
    api_khong_cache_tru_agent: "bun run db:test && bunx turbo run test --concurrency=1 --force --filter=!agent"
  script:
    product_map: "node ${CLAUDE_PLUGIN_ROOT}/scripts/product-map.mjs --root . --check"
    db_test: "bun run db:test"
    resolve_plugin: "node scripts/resolve-plugin.mjs --plugin acceptance-gate --require scripts/product-map.mjs"
    lint: "bun run lint"
    lint_khong_cache: "bunx turbo run lint --force"
    lint_slop: "bun run lint:slop"
    check_types: "bun run check-types"
    check_types_khong_cache: "bunx turbo run check-types --force"
    rang_suite_sach: "bash _acceptance/sua-test-do-thu-tu-nap/rang-suite.sh --chan sach"
    rang_suite_thu_tu: "bash _acceptance/sua-test-do-thu-tu-nap/rang-suite.sh --chan thu-tu"
    rang_config_doi: "bash _acceptance/sua-test-do-thu-tu-nap/rang-config.sh --chan doi"
    rang_config_o_cam: "bash _acceptance/sua-test-do-thu-tu-nap/rang-config.sh --chan o-cam"
    rang_config_o_cam_duong: "bash _acceptance/sua-test-do-thu-tu-nap/rang-config.sh --chan o-cam-duong"
    rang_config_o_cam_do: "bash _acceptance/sua-test-do-thu-tu-nap/rang-config.sh --chan o-cam-do"
    rang_config_o_cam_trung_tinh: "bash _acceptance/sua-test-do-thu-tu-nap/rang-config.sh --chan o-cam-trung-tinh"
    rang_config_khai_thac: "bash _acceptance/sua-test-do-thu-tu-nap/rang-config.sh --chan khai-thac"
    rang_microsoft_duong: "bash _acceptance/khang-dinh-microsoft-co-rang/rang-microsoft.sh --chan duong"
    rang_microsoft_do: "bash _acceptance/khang-dinh-microsoft-co-rang/rang-microsoft.sh --chan do"
    rang_microsoft_nguon_env: "bash _acceptance/khang-dinh-microsoft-co-rang/rang-microsoft.sh --chan nguon-env"
    rang_microsoft_hinh_thuc: "bash _acceptance/khang-dinh-microsoft-co-rang/rang-microsoft.sh --chan hinh-thuc"
    rang_hook_ep_chay: "bash _acceptance/luoi-day-do-that/rang-hook.sh --chan ep-chay"
    rang_hook_canary_slop: "bash _acceptance/luoi-day-do-that/rang-hook.sh --chan canary-slop"
    rang_hook_con_rang: "bash _acceptance/luoi-day-do-that/rang-hook.sh --chan con-rang"
    rang_hook_loi_thoat: "bash _acceptance/luoi-day-do-that/rang-hook.sh --chan loi-thoat"
    rang_hook_tro_dung: "bash _acceptance/luoi-day-do-that/rang-hook.sh --chan tro-dung"
    rang_ngon_ngu_la: "bash _acceptance/tieng-viet-cho-crm/rang-ngon-ngu.sh --chan la"
    rang_cookie: "bash _acceptance/tieng-viet-cho-crm/rang-ngon-ngu.sh --chan cookie"
    rang_du_lieu_khong_dich: "bash _acceptance/tieng-viet-cho-crm/rang-ngon-ngu.sh --chan du-lieu-khong-dich"
    rang_dinh_dang: "bash _acceptance/tieng-viet-cho-crm/rang-ngon-ngu.sh --chan dinh-dang"
    rang_ban_ve: "cd packages/ui && bun run test"
    rang_goc_mot_goc: "bash _acceptance/bo-dung-chung-nhan-chuoi/rang-goc-ngon-ngu.sh --chan mot-goc"
    rang_goc_khong_nhap_nguoc: "bash _acceptance/bo-dung-chung-nhan-chuoi/rang-goc-ngon-ngu.sh --chan khong-nhap-nguoc"
    rang3_ba_man: "node _acceptance/nhan-ung-dung-noi-tieng-viet/rang/ban-ve.mjs --chan ba-man"
    rang3_ho_so: "node _acceptance/nhan-ung-dung-noi-tieng-viet/rang/ban-ve.mjs --chan ho-so"
    rang3_dong_thoi_gian: "node _acceptance/nhan-ung-dung-noi-tieng-viet/rang/ban-ve.mjs --chan dong-thoi-gian"
    rang3_no_vong_1: "node _acceptance/nhan-ung-dung-noi-tieng-viet/rang/ban-ve.mjs --chan no-vong-1"
    rang3_trinh_doc_man_hinh: "node _acceptance/nhan-ung-dung-noi-tieng-viet/rang/ban-ve.mjs --chan trinh-doc-man-hinh"
    rang3_khai_tieng: "node _acceptance/nhan-ung-dung-noi-tieng-viet/rang/khai-tieng.mjs khai-tieng"
    rang3_doi_tieng: "node _acceptance/nhan-ung-dung-noi-tieng-viet/rang/ban-ve.mjs --chan doi-tieng"
    rang3_may_chu_ve: "bash _acceptance/nhan-ung-dung-noi-tieng-viet/rang/may-chu-ve.sh"
    rang3_be_rong: "node _acceptance/nhan-ung-dung-noi-tieng-viet/rang/ban-ve.mjs --chan be-rong"
    rang3_du_lieu_bien: "node _acceptance/nhan-ung-dung-noi-tieng-viet/rang/du-lieu-bien.mjs"
    rang3_dot_bien: "node _acceptance/nhan-ung-dung-noi-tieng-viet/rang/dot-bien.mjs"
    rang3_giai_doan: "node _acceptance/nhan-ung-dung-noi-tieng-viet/rang/khai-tieng.mjs giai-doan"
    rang3_khong_may_quet: "bash _acceptance/nhan-ung-dung-noi-tieng-viet/rang/khong-may-quet.sh"
    start_scan: "bash _acceptance/o-cam-khai-thac-trung-tinh/rang-quet.sh"
    rang_t1_chan: "bash _acceptance/sua-test-do-thu-tu-nap/rang-t1-escape.sh --chan chan"
    rang_t1_im: "bash _acceptance/sua-test-do-thu-tu-nap/rang-t1-escape.sh --chan im"
  design:
    gate: "node ${CLAUDE_PLUGIN_ROOT}/scripts/design-gate.mjs"
    ui_check: "${CLAUDE_PLUGIN_ROOT}/scripts/design-scan.js"
risk_tiers:
  t1_skip_globs:
    - "docs/**"
    - "**/*.md"
    - "PRODUCT-MAP.md"
  t3_paths:
    - "packages/auth/**"
    - "packages/db/prisma/**"
    - "apps/api/src/auth/**"
    - "apps/api/src/api-keys/**"
    - "apps/api/src/sso/**"
    - "apps/api/src/users/**"
    - "apps/api/src/workspace/**"
    - "apps/api/src/tracking/**"
    - "apps/api/src/mailbox/**"
signoff:
  required_for: [T2, T3]
  approvers: ["Manh Phan"]
dev_server:
  start: "TURBO_UI=false bunx turbo run dev --ui=stream --filter=app --filter=api"
  url: "http://localhost:3000"
  api_base: ["http://localhost:3001"]
capture:
  ui: "bun run ui:capture"
