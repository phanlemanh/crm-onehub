risk_tiers:
  t1_skip_globs:
    - "docs/**"
    - "**/*.md"
    - "PRODUCT-MAP.md"
    - "AGENTS.md"
    - "CLAUDE.md"
    # Ba dòng trên là .md ở GỐC kho, phải liệt đích danh vì "**/*.md" chỉ khớp
    # khi có ít nhất một đoạn thư mục — file .md ở gốc lọt qua. PRODUCT-MAP.md đã
    # được vá kiểu này từ trước; AGENTS.md vấp đúng chỗ đó ở PR #29 (09/09);
    # CLAUDE.md vấp lần thứ ba ở PR gỡ luật trailer đồng tác giả (10/09).
    # Lỗi glob thuộc về kit, đã mở chip sang ~/dev/acceptance-gate-kit.
    # Bộ cổng vendored theo INIT-CI-COPY-LIST (đường dẫn ĐÍCH DANH, không glob):
    # đây là THƯỚC ĐO, không phải product code — nâng chính cái thước không được
    # làm hết hạn bằng chứng đã ghim, và không được tự chặn lượt nâng nó.
    - "scripts/pre-merge-check.sh"
    - "scripts/recheck-evidence.cjs"
    - "lib/evidence-core.cjs"
    - "lib/gap-probe.cjs"
    - "lib/workspace-record.cjs"
    - "lib/ac-line.cjs"
    - "lib/md-section.cjs"
    - "lib/eval-yaml.cjs"   # bộ đọc evals.yaml của luật làn ghim-lại (ADR 0014), và là nguồn duy nhất đọc expected_exit
    # lop-nhin-thay: mục thứ CHÍN của INIT-CI-COPY-LIST, kit thêm ở 2.10.0.
    # Thiếu nó thì NOTE lớp nhìn-thấy in «không kiểm được» và luật W8 tắt im ở
    # kho này — cùng lớp measuring-stick với tám mục trên.
    - "lib/lop-nhin-thay.cjs"
    # Cấu hình trình soạn: .claude/launch.json chỉ khai lệnh chạy dev server và
    # số cổng cho phiên máy. Không file nào import nó, không bản dựng nào đọc
    # nó, và không phép đo nào lấy giá trị từ nó — các thước tự đặt APP_URL và
    # API_URL, nên đổi cổng ở đây không dịch chuyển được kết quả đo nào.
    # Khai T1 ngày 17/09 sau khi cổng chặn một PR chỉ thêm hai mục cổng.
    - ".claude/launch.json"
  t3_paths:
    - "packages/auth/**"
    - "packages/db/prisma/**"
    - "apps/api/src/auth/**"
    - "apps/api/src/api-keys/**"
    - "apps/api/src/sso/**"
    - "apps/api/src/users/**"
    - "apps/api/src/workspace/**"
    - "apps/api/src/tracking/**"
    - "apps/api/src/mailbox/**"
signoff:
  required_for: [T2, T3]
  approvers: ["Manh Phan"]
dev_server:
  start: "TURBO_UI=false bunx turbo run dev --ui=stream --filter=app --filter=api"
  url: "http://localhost:3000"
  api_base: ["http://localhost:3001"]
capture:
  ui: "bun run ui:capture"
