    - khung-tao-okr-nhu-deal/E6
    - may-soan-de-xuat/E15a
    - soan-okr-cung-tro-ly/E8
    - soan-okr-cung-tro-ly/E13
    - soan-okr-cung-tro-ly/E22
    - tac-nhan-model-rieng/E4
    - the-gop-y-okr/E1
    - the-gop-y-okr/E13
    - tro-ly-doc-kho/E15
    - tro-ly-okr-de-xuat/E4
    - tro-ly-okr-de-xuat/E22
