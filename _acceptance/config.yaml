  repin_retry: 1
  repin_budget_min: 80
  repin_cost_cmd: node scripts/lan-do/chi-phi-gateway.mjs
  repin_ci_blank_env: [AI_GATEWAY_API_KEY, KHO_TAI_LIEU_AI_GATEWAY_API_KEY, KHO_TAI_LIEU_BLOB_TOKEN, ZALO_BOT_TOKEN]
