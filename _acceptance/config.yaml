    - eval-model-that-dung-luc/E11
    - tro-ly-okr-de-xuat/E24
    - tro-ly-okr-nen/E9
    - tro-ly-okr-nen/E12
    - tro-ly-okr-tom-tat/E9
    - tro-ly-okr-tom-tat/E17
    - zalo-hoi-okr-khong-chet/E1
    - zalo-hoi-okr-khong-chet/E6
    - zalo-hoi-okr-khong-chet/E8
    - tro-ly-okr-bo-final-output/E6
    - tro-ly-okr-bo-final-output/E7
    - tro-ly-okr-bo-final-output/E11
design_pass:
  ds_skill: web-design-guidelines
  proto_route: http://localhost:3000/proto/{slug}
  dev_cmd: PROTO_ROUTE=1 TURBO_UI=false bunx turbo run dev --ui=stream --filter=app --filter=api
  host_embed:
    guide: "docs/proto.md"
    route: "apps/app/app/proto/[slug]/page.tsx"
    dev_flag: "PROTO_ROUTE"
