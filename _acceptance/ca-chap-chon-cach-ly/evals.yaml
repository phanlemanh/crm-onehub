schema_version: 1
feature_slug: ca-chap-chon-cach-ly
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.cccl_mo_coi
    paths: [apps/agent-okr/test/support/khoi-dong.ts, apps/agent-okr/test/khoi-dong-don.spec.ts]
    expected: "exit 0; trên một gốc tạm có node_modules/.bin/eve GIẢ (tiến trình chạy mãi, dòng lệnh «<gốc>/node_modules/.bin/eve dev --no-ui --port <n>»): một tiến trình con bun nhập khoi-dong.ts THẬT, gọi giuKhoaEve([gốc]) rồi sinh eve giả qua đúng hàm ghi pid vào khoá của khoi-dong.ts (tệp chu.json do bên ghi thật viết, không viết tay), in «SAN SANG», rồi bị bài SIGKILL — để lại khoá có chủ đã chết và eve giả mồ côi còn sống (bài khẳng định cả hai trước khi đi tiếp, vắng thì ném «khong dung duoc canh mo coi»). Bài gọi giuKhoaEve([gốc]) → trả về được, eve giả mồ côi và mọi tiến trình con của nó đã chết (process.kill(pid, 0) ném), chu.json mới mang pid của chính bài. CHIỀU ĐỎ (rang/dot-bien.mjs cặp a): bản sao bỏ lời gọi dọn mồ côi khỏi nhánh khoá cũ → bài đỏ với thông điệp ghim «mo coi con song: <pid>»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.cccl_ngoai_khoa
    paths: [apps/agent-okr/test/support/khoi-dong.ts, apps/agent-okr/test/khoi-dong-don.spec.ts]
    expected: "exit 0; cùng bàn thử của E1, hai ca viết trước: (i) một eve giả do CHÍNH bài sinh (không qua hàm ghi khoá) chạy ở gốc, cạnh một khoá chủ-chết do tiến trình con ghi cho một eve giả khác → sau giuKhoaEve([gốc]) eve của bài còn sống (process.kill(pid, 0) không ném), eve trong khoá đã chết; (ii) tiến trình con ghi vào khoá pid của một tiến trình không phải eve (`sleep 300` do bài sinh, giả pid bị tái dùng) → sau giuKhoaEve([gốc]) tiến trình `sleep` còn sống. Mỗi ca in tên ca ở thông điệp. CHIỀU ĐỎ (cặp b): bản sao bỏ bước so dòng lệnh với «<gốc>/node_modules/.bin/eve dev» → ca (ii) đỏ với thông điệp ghim «dung nham tien trinh khong phai eve»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.cccl_cho_route
    paths: [apps/agent-okr/test/support/khoi-dong.ts, apps/agent-okr/test/khoi-dong-don.spec.ts]
    expected: "exit 0; bốn ca viết trước trên hàm chờ route của khoi-dong.ts, trần nhỏ truyền vào: (1) Bun.serve giả trả /health 503 ba lần rồi 404 → hàm trả 404 và số lần hỏi ≥ 4; (2) cổng bị từ chối trong ba lần hỏi đầu, sau đó Bun.serve mới mở ở đúng cổng và trả 404 → hàm trả 404 và số lần hỏi > 3; (3) Bun.serve trả 503 mãi → hàm ném lỗi chứa đúng «/health» và «503»; (4) cổng không ai nghe → lỗi chứa «/health» và «khong ket noi». Thêm một dòng đo trên hằng: KHOI_DONG.sanSang.choMs < KHOI_DONG.choMs (trần mỗi gốc mà app-rieng cộng vào hook). CHIỀU ĐỎ: cặp (c) bản sao trả ngay sau lần hỏi đầu → ca (1) đỏ «tra may khi route con 503»; cặp (c') bản sao ném ngay khi bị từ chối → ca (2) đỏ «bo cuoc khi bi tu choi»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: script
    cmd: config:executors.script.cccl_mo_coi_xanh
    paths: [apps/agent-okr/test/support/khoi-dong.ts, apps/agent-okr/test/app-rieng.integration.spec.ts, _acceptance/ca-chap-chon-cach-ly/rang/mo-coi.mjs]
    expected: "exit 0; Node ≥ 24 (Node < 24 → exit 2 «can Node 24», không tính xanh). Ba lượt, mỗi lượt: chạy `bun test test/app-rieng.integration.spec.ts` trong apps/agent-okr của cây này, đợi tới khi có một tiến trình con mà dòng lệnh chứa «apps/agent-okr/node_modules/.bin/eve dev», SIGKILL tiến trình test, khẳng định eve đó còn sống với cha là 1 (vắng → exit 2 «khong dung duoc eve mo coi»); rồi chạy `bun test test/app-rieng.integration.spec.ts -t \"chạy cạnh\"`; in «LUOT <n>: xanh» khi log có 1 pass, 0 fail VÀ eve mồ côi cùng mọi tiến trình con của nó đã chết. Thiếu một dòng LUOT → exit 1. Mọi tiến trình script sinh ra được dừng trong finally."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-4
    executor: script
    cmd: config:executors.script.cccl_mo_coi_do
    paths: [apps/agent-okr/test/support/khoi-dong.ts, _acceptance/ca-chap-chon-cach-ly/rang/mo-coi.mjs]
    expected: "exit 0 khi CHIỀU ĐỎ hiện đúng: trên bản sao cây (git worktree ngoài kho, node_modules liên kết) đã gỡ lời gọi dọn mồ côi khỏi khoi-dong.ts, cùng bàn đo của E4 một lượt → ca «chạy cạnh» đỏ và log chứa «dang co eve dev khong phai cua bai thu»; script in «DO DUNG: eve mo coi chan luot sau». Ca vẫn xanh, hoặc đỏ không có thông điệp đó → exit 1 «chieu do khong hien». Script dừng eve mồ côi của bản sao và gỡ worktree trong finally."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-5
    executor: test
    cmd: config:executors.test.cccl_tai_lieu
    paths: [apps/api/test/tai-lieu-san.ts, apps/api/test/tai-lieu-khong-ro.spec.ts, apps/api/test/tai-lieu-thay-trang.spec.ts]
    expected: "exit 0; `bun run test -- \"cd apps/api && bun test test/tai-lieu-khong-ro.spec.ts test/tai-lieu-thay-trang.spec.ts\"` trên CSDL riêng của lượt: 0 fail; số «(pass)» trong log ≥ số ca `test(` của hai tệp ở merge-base (script đếm ở rang/dot-bien.mjs bước tiền đề, in «CA: <n>»)."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-5
    executor: script
    cmd: config:executors.script.cccl_dot_bien
    paths: [apps/api/test/tai-lieu-san.ts, apps/api/test/tai-lieu-khong-ro.spec.ts, apps/api/test/tai-lieu-thay-trang.spec.ts, apps/agent-okr/test/support/khoi-dong.ts, apps/agent-okr/test/khoi-dong-don.spec.ts, turbo.json, _acceptance/ca-chap-chon-cach-ly/rang/dot-bien.mjs]
    expected: "exit 0; rang/dot-bien.mjs chạy trên bản sao cây (git worktree ngoài kho), SO_CAP_KHAI = 10, mỗi cặp in một dòng «<cặp> <tên> xanh=… do=…» và phải có xanh trước-phá, đỏ sau-phá với thông điệp ghim của cặp. Cặp (a) E1, (b) E2, (c) và (c') E3 như ghi ở ba eval đó. Cặp (d1) (d2) (d3) — MA TRẬN 3 hook: cài `await Bun.sleep(6000)` vào đầu (d1) beforeAll của dungSan(), (d2) beforeAll của tai-lieu-khong-ro, (d3) beforeAll của tai-lieu-thay-trang; còn trần TAI_LIEU_SAN.hookMs thì spec tương ứng xanh; bỏ đối số trần khỏi ĐÚNG hook đó thì đỏ với log chứa «timed out». Cặp (e) công tắc: bản sao bỏ SOKR_KHONG_CHAY_AGENT_CU khỏi globalPassThroughEnv → lệnh của E8 với biến bật không còn bỏ ca (ghim «cong tac khong toi test»). Cặp (f) phạm vi: chạy rang/pham-vi.mjs với danh sách viết tay chứa apps/api/src/app.module.ts → đỏ «cham ma san pham: apps/api/src/app.module.ts». Số cặp đã chạy ≠ SO_CAP_KHAI → exit 1."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E8
    criterion: AC-6
    executor: script
    cmd: config:executors.script.cccl_cong_tac
    paths: [turbo.json, apps/agent-okr/test/app-rieng.integration.spec.ts, _acceptance/ca-chap-chon-cach-ly/rang/cong-tac.mjs]
    expected: "exit 0; Node ≥ 24 (không thì exit 2). Chạy hai lần `bun run test -- --filter=agent-okr -- test/app-rieng.integration.spec.ts -t \"chạy cạnh\"` qua lớp bọc ở gốc kho: (1) với SOKR_KHONG_CHAY_AGENT_CU=1 → log có «bo qua ca chay canh apps/agent» và ca «chạy cạnh» không nằm trong các dòng «(pass)»; (2) không đặt biến → ca «chạy cạnh» có trong «(pass)». In «BAT: bo ca» và «TAT: chay ca». Thiếu một trong hai → exit 1."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E9
    criterion: AC-7
    executor: script
    cmd: config:executors.script.cccl_pham_vi
    paths: [_acceptance/ca-chap-chon-cach-ly/rang/pham-vi.mjs]
    expected: "exit 0; rang/pham-vi.mjs lấy danh sách tệp đổi giữa merge-base với origin/onehub và HEAD, khẳng định không tên nào khớp apps/*/src/**, apps/*/agent/**, apps/*/app/**, packages/*/src/**; in «PHAM VI: <n> tep, 0 ma san pham». Chiều đỏ ở cặp (f) của E7."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
