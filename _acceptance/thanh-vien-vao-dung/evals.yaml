      - "apps/app/lib/messages/settings-thanh-vien.ts"
      - "docs/api.md"
      - "docs/environment.md"
      - "_acceptance/thanh-vien-vao-dung/rang/tu-dien.mjs"
    expected: |
      tu-dien.mjs: CONTEXT.md co muc «**Tên miền nội bộ**» voi dong _Avoid_ va dong «Vì sao» trong
      cung muc; import thanhVienMessages("vi") va ("en") that: moi khoa moi cua nhom tenMienNoiBo
      co chuoi khac rong o ca hai; docs/api.md co cau «already a member» va «staffDomains»;
      docs/environment.md co «Settings → Members» trong doan staffEmailDomains. Moi muc mot dong
