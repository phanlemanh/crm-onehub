  - id: E21
    criterion: AC-13
    executor: test
    cmd: config:executors.test.r1b_khong_hoi_quy_api
    paths:
      - "apps/api/src/workspace/**"
      - "packages/auth/src/**"
      - "apps/api/src/tracking/tracking-filing.service.ts"
      - "apps/api/src/mailbox/mailbox-match.service.ts"
    expected: |
