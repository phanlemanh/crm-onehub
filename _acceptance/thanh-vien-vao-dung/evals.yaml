  - id: E26
    criterion: AC-7
    executor: test
    cmd: config:executors.test.r1b_dom
    paths:
      - "apps/app/app/(app)/[slug]/settings/members/**"
      - "apps/app/test/thanh-vien-vao-dung.dom.tsx"
    expected: |
      describe "duoc-phep-vao" ca "treo-khong-dem": allowances co 2 dong pending va 1 dong
