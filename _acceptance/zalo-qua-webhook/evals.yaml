schema_version: 1
slug: zalo-qua-webhook

evals:
  - id: E1
    criterion: AC-1
    executor: test
    layer: backend-effect
    cmd: config:executors.test.zqw_webhook_noi
    paths:
      - "apps/agent/agent/lib/zalo-*.ts"
      - "apps/agent/agent/channels/zalo.ts"
      - "packages/db/src/zalo-lien-ket.ts"
      - "packages/validation/src/zalo-update.ts"
      - "apps/agent/test/zalo-qua-webhook.integration.spec.ts"
      - "apps/agent/test/support/zalo-gia.ts"
      - "apps/agent/test/fixtures/zalo-tin-that.json"
    expected: |
      Fixture chung cho moi eval: apps/agent/test/fixtures/zalo-tin-that.json CHEP
      nguyen phan hoi getUpdates THAT ngay 2026-09-23 (khoa, long, kieu, gia tri
      chat_type va event_name giu nguyen; chi thay id, display_name, text,
      message_id bang gia tri gia cung dinh dang). Than webhook = tin do boc vo
      {ok:true,result} theo mau tai lieu Zalo — ham dung than doc tu fixture,
      khong go tay khuon.
      Gieo that tren DB bang thu tuc cua kho (taoMaLienKet). Goi nhanWebhook voi
      Request that: header dung, text = ma cua U. Ma tran:
        1 status 200
        2 doc LAI DB: dung 1 ZaloLink (U, Z), zaloDisplayName = display_name cua Z
        3 hang ma co usedAt khac null
        4 dung 1 ZaloUpdateSeen cho message_id
        5 dung 1 sendMessage toi chat_id Z, van ban chua ten CRM cua U
      Doi chung duong cung fixture: goi lai voi message_id moi va ma khong ton tai
      -> khong ZaloLink moi.
      DOT BIEN CHUNG MINH (ban sao): bo goi noiBangMa trong nhanh webhook -> dong 2
      do voi thong diep ghim "webhook noi duoc U voi Z".
  - id: E2
    criterion: AC-2
    executor: test
    layer: backend-effect
    cmd: config:executors.test.zqw_webhook_khoa
    paths:
      - "apps/agent/agent/lib/zalo-webhook.ts"
      - "apps/agent/test/zalo-qua-webhook.integration.spec.ts"
    expected: |
      Nam ca header roi nhau, viet truoc: khong co; rong ""; sai cung do dai khoa
      dung; sai dai 1 ky tu; sai dai 300 ky tu. Moi ca mot Request co than la
      ReadableStream dem so lan bi keo. Ma tran 5 ca x 6 assert:
        1 status 403
        2 promise khong reject (khong nem, khong 500)
        3 request.bodyUsed false VA stream khong bi keo lan nao
        4 dem ZaloLink, ZaloUpdateSeen, ZaloLinkAttempt truoc/sau bang nhau
        5 fetcher gia 0 loi goi
        6 hang ma cua U usedAt van null
      Doi chung duong: cung than, header dung -> 200 va co ZaloLink.
      DOT BIEN: so khoa bang timingSafeEqual truc tiep khong bam -> ca "sai dai 1"
      do voi "khoa khac do dai tra 403"; doc than truoc khi kiem khoa -> dong 3 do
      voi "than khong bi doc khi khoa sai".
  - id: E3
    criterion: AC-3
    executor: test
    layer: backend-effect
    cmd: config:executors.test.zqw_webhook_tat
    paths:
      - "apps/agent/agent/lib/zalo-webhook.ts"
      - "apps/agent/agent/channels/zalo.ts"
      - "apps/agent/test/zalo-qua-webhook.integration.spec.ts"
    expected: |
      Hai ca chay trong TIEN TRINH CON (Bun.spawn) co env thieu dung mot bien
      (ZALO_WEBHOOK_SECRET; roi ZALO_BOT_TOKEN), cac bien khac giu nguyen. Tien
      trinh con import agent/channels/zalo.ts, goi handler route POST /zalo/webhook
      voi header bat ky, in ra JSON {nap: ok, status, bodyUsed, soGoiZalo}.
      Moi ca:
        1 tien trinh con thoat 0 (nap kenh khong nem)
        2 status 404
        3 bodyUsed false
        4 soGoiZalo 0 (fetch toan cuc trong con bi thay bang ham dem)
        5 test cha dem ba bang truoc/sau bang nhau
      DOT BIEN: parse bien bang Zod luc nap module -> ca 1 do voi "nap kenh khong
      nem khi thieu bien"; bo nhanh thieu-token -> ca 2 do voi "thieu token tra 404".
  - id: E4
    criterion: AC-4
    executor: test
    layer: backend-effect
    cmd: config:executors.test.zqw_webhook_trung
    paths:
      - "apps/agent/agent/lib/zalo-*.ts"
      - "apps/agent/test/zalo-qua-webhook.integration.spec.ts"
      - "apps/agent/test/support/zalo-gia.ts"
    expected: |
      Cung mot tin (cung message_id, ma cua U) qua webhook hai lan, roi Zalo gia
      giao lai tin do cho mot luot pollZalo. Ma tran:
        1 hai status deu 200
        2 dung 1 ZaloLink (U, Z)
        3 dung 1 ZaloUpdateSeen cho message_id
        4 dung 1 sendMessage toi Z (dem tren ca webhook va poll)
      DOT BIEN: bo laTinMoi o loi chung -> dong 4 do voi "moi tin tra loi mot lan".

  - id: E5
    criterion: AC-5
    executor: test
    layer: backend-effect
    cmd: config:executors.test.zqw_webhook_bo_qua
    paths:
      - "apps/agent/agent/lib/zalo-*.ts"
      - "packages/validation/src/zalo-update.ts"
      - "apps/agent/test/zalo-qua-webhook.integration.spec.ts"
      - "apps/agent/test/fixtures/zalo-tin-that.json"
    expected: |
      Nam ca voi khoa dung (ma tran 5 x 3 viet truoc):
        a than "khong-json"; b JSON sai khuon co result.message.message_id "m-hong";
        c {event_name, message} KHONG vo (message tu fixture that);
        d tin ma song tu from.is_bot true; e tin ma song chat_type "GROUP"
      Moi ca: status 200 · 0 hang moi o ba bang · 0 sendMessage.
      Log (console.error bi bat): ca b chua "m-hong" va chua "result"; ca c chua
      "event_name,message" (danh sach khoa cap dau). Sau ca e: ma U usedAt null.
      Doi chung duong: ca e doi chat_type ve gia tri cua fixture that ("PRIVATE")
      -> co ZaloLink (chung minh bo qua la do GROUP, khong do fixture hong).
      DOT BIEN: bo loc chat_type -> ca e do voi "tin tu nhom bi bo qua"; tra 400 cho
      than hong -> ca a do voi "than hong tra 200"; log khong in khoa -> ca c do
      voi "log in khoa cap dau".
  - id: E6
    criterion: AC-6
    executor: test
    layer: backend-effect
    cmd: config:executors.test.zqw_webhook_luat_ma
    paths:
      - "apps/agent/agent/lib/zalo-*.ts"
      - "packages/db/src/zalo-lien-ket.ts"
      - "apps/agent/test/zalo-qua-webhook.integration.spec.ts"
    expected: |
      Chuoi tin cua Z qua webhook, doc bo dem sai (ZaloLinkAttempt) sau moi tin:
        1 ma sai -> dem tang 1, 1 sendMessage bang ZALO.loi.huongDan
        2 chu "xin chao" -> dem khong doi, 1 cau huong dan
        3 tin anh (khong text, co photo) -> dem khong doi, 1 cau huong dan
        4 gieo them sai den doMa.toiDa roi gui ma song cua U -> khong ZaloLink,
          khong sendMessage moi, ma U usedAt null
        5 moi lan status 200
      DOT BIEN: bo dangBiChan o loi chung -> dong 4 do voi "dang bi chan thi im".

  - id: E7
    criterion: AC-7
    executor: test
    layer: backend-effect
    cmd: config:executors.test.zqw_kiem_bot
    paths:
      - "apps/agent/agent/lib/zalo-bot.ts"
      - "apps/agent/agent/schedules/dispatch.ts"
      - "apps/agent/test/zalo-qua-webhook.integration.spec.ts"
    expected: |
      Import default cua agent/schedules/dispatch.ts va goi CHINH ham run cua lich
      voi receive/waitUntil gia (gom promise roi await). fetch toan cuc bi thay:
      URL bat dau bang ZALO.api -> Zalo gia (dem theo method); URL khac -> tra 503
      va ghi lai. Ba ca, token dat/xoa qua process.env trong test va tra lai sau:
        a token + getMe ok -> getUpdates 0, getMe dung 1, zaloBotName "Bot OneHub",
          zaloPolledAt >= luc bat dau nhip
        b token + getMe 401 -> run khong reject, getUpdates 0, zaloBotName null
        c khong token -> 0 loi goi toi ZALO.api, zaloBotName null
      DOT BIEN: tra pollZalo vao dispatch (ke ca import doi ten) -> ca a do voi
      "nhip khong goi getUpdates"; kiemBot khong ghi zaloPolledAt -> ca a do.
  - id: E8
    criterion: AC-8
    executor: test
    layer: backend-effect
    cmd: config:executors.test.zqw_giao_khi_mo
    paths:
      - "apps/agent/agent/lib/zalo-*.ts"
      - "apps/agent/test/zalo-qua-webhook.integration.spec.ts"
      - "apps/agent/test/support/zalo-gia.ts"
    expected: |
      Zalo gia che do chiGiaoKhiMo, dong ho ao; tin ma cua U den o giay 30.
      Ba duong tren CUNG fixture (gieo lai ma moi cho moi duong):
        a pollZalo timeout 1 giay o giay 0, 60, 120 -> 0 ZaloLink, 0 sendMessage
        b vongTay (pollZalo, ZALO.pollTay.timeoutGiay, lien tuc) den giay 180 ->
          dung 1 ZaloLink
        c tin do qua nhanWebhook -> dung 1 ZaloLink
      Doi chung cho chinh gia: tin den o giay 0.5 -> duong a bat duoc (chung minh
      gia giao khi dang mo, khong phai gia hong luon tra 408).
      DOT BIEN: cho gia giu tin den khi co loi goi (bo luat chiGiaoKhiMo) -> duong a
      xanh sai, assert "nhip cu mat tin" do; ZALO.pollTay.timeoutGiay = 1 ->
      duong b do voi "vong tay bat duoc tin".

  - id: E9
    criterion: AC-9
    executor: test
    layer: backend-effect
    cmd: config:executors.test.zqw_lenh_webhook
    paths:
      - "apps/agent/agent/lib/zalo-dang-ky.ts"
      - "apps/agent/scripts/zalo-webhook.ts"
      - "apps/agent/scripts/zalo-poll.ts"
      - "apps/agent/package.json"
      - "packages/validation/src/zalo-update.ts"
      - "apps/agent/test/zalo-qua-webhook.integration.spec.ts"
    expected: |
      Hai lop, ma tran viet truoc:
      Lop ham (dangKyWebhook voi Zalo gia; setWebhook tra mau tai lieu, outcome
      "webhook.ok"):
        a https + du bien -> dung 1 setWebhook, body.url = url, body.secret_token =
          secret; ket qua chua "webhook.ok"
        b --xoa -> dung 1 deleteWebhook, 0 setWebhook
      Lop lenh that (Bun.spawn "bun run zalo:webhook ..." / "bun run zalo:poll" trong
      apps/agent, env thieu dung mot bien, ZALO_BOT_TOKEN va ZALO_WEBHOOK_SECRET
      gia): 
        c http:// -> exit != 0, stderr chua "https"
        d thieu ZALO_WEBHOOK_SECRET -> exit != 0, stderr chua "ZALO_WEBHOOK_SECRET"
        e thieu ZALO_BOT_TOKEN -> exit != 0, stderr chua "ZALO_BOT_TOKEN"
        f zalo:poll thieu ZALO_BOT_TOKEN -> exit != 0, stderr chua "ZALO_BOT_TOKEN"
        c-f: token gia khong hop le nen neu co loi goi mang thi stderr se chua ma
        loi cua Zalo — assert stderr KHONG chua "error_code" (chung minh dung truoc
        khi goi mang).
      Doc tham so: docThamSo(["--xoa"]) -> {xoa:true, url:null};
      docThamSo(["https://x/zalo/webhook"]) -> url do.
      DOT BIEN: bo kiem https -> ca c do voi "chi nhan https"; script khong dat
      process.exitCode -> ca d do voi "lenh thoat ma khac 0".
  - id: E10
    criterion: AC-10
    executor: test
    layer: unit
    cmd: config:executors.test.zqw_khai_bien
    paths:
      - ".env.example"
      - "docs/environment.md"
      - "turbo.json"
      - "apps/agent/turbo.json"
      - "apps/agent/test/zalo-qua-webhook.integration.spec.ts"
    expected: |
      Doc tep bang duong suy tu vi tri test (import.meta.dir), khong hardcode goc.
      turbo.json va apps/agent/turbo.json parse bang JSONC (co comment) roi so
      MANG, khong so chuoi:
        1 globalEnv chua ca ZALO_BOT_TOKEN va ZALO_WEBHOOK_SECRET
        2 tasks.dev.passThroughEnv va tasks["dev:headless"].passThroughEnv moi mang
          chua ca hai
        3 .env.example co dong khai ZALO_WEBHOOK_SECRET (dang comment "# ZALO_...=")
          va dong ghi chu ngay tren no
        4 docs/environment.md co hang bang bat dau "| `ZALO_WEBHOOK_SECRET`"
        5 .env.example chua "Zalo Bot Manager" va khong chua "bot.zaloplatforms.com"
          trong khoi Zalo
      DOT BIEN: xoa ZALO_WEBHOOK_SECRET khoi passThroughEnv cua dev:headless -> dong 2
      do voi ten task bi thieu.

  - id: E11
    criterion: AC-11
    executor: test
    layer: backend-effect
    cmd: config:executors.test.zqw_kenh_route
    paths:
      - "apps/agent/agent/channels/zalo.ts"
      - "apps/agent/agent/lib/zalo-webhook.ts"
      - "apps/agent/test/zalo-qua-webhook.integration.spec.ts"
    expected: |
      Import default tu agent/channels/zalo.ts; loc routes theo method POST va path
      /zalo/webhook:
        1 dung 1 route
        2 goi handler voi tin AC-1 + khoa dung -> 200 va ZaloLink (U, Z) doc lai tu DB
        3 goi handler voi khoa sai -> 403
      DOT BIEN: doi path thanh /zalo/hook -> dong 1 do voi "route /zalo/webhook
      duoc mount".

  - id: E12
    criterion: AC-12
    executor: script
    layer: backend-effect
    cmd: config:executors.script.zqw_giu_nqz
    paths:
      - "apps/agent/agent/lib/zalo-*.ts"
      - "apps/agent/test/nhac-qua-zalo.integration.spec.ts"
      - "apps/agent/test/support/zalo-gia.ts"
    expected: |
      Lenh gom hai ve, ve nao do thi thoat khac 0 voi thong diep ghim:
        1 git diff --quiet <merge-base HEAD voi onehub> -- tep spec cua nhac-qua-zalo
          (merge-base tinh luc chay, khong neo sha co dinh) -> co thay doi thi in
          "spec da ky cua nhac-qua-zalo bi sua" va thoat 1
        2 chay tron tep spec do qua wrapper bun run test -> moi ca xanh
      DOT BIEN: doi mac dinh cua zalo-gia sang chiGiaoKhiMo -> ve 2 do (cac ca
      noi-ma cu mat tin); sua mot dong trong spec cu -> ve 1 do.

