    expected: "exit 0; do-bo-cuc.mjs in 'buoc 1: dat' kem be rong Chi tiet, noi dung tab va so hang thuoc tinh o moi kho. Vi pham in 'ctc-man: gioi thieu sau chi tiet <kho>', 'ctc-man: chi tiet hep <kho> <rong>/<noi dung>', 'ctc-man: chi tiet mot cot <kho>' hoac 'ctc-man: chi tiet khong hang nao <kho>', ma 1. CHIEU DO tren ban sao (E7): (1) phieu cong ty dung lai cot phai 320px -> ghim 'ctc-man: chi tiet hep 1440'; (2) Gioi thieu dat sau Chi tiet -> ghim 'ctc-man: gioi thieu sau chi tiet 1440'; (3) Chi tiet columns={1} -> ghim 'ctc-man: chi tiet mot cot 1440'."

