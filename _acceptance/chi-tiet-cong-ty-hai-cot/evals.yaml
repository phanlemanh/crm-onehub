  - id: E1
    criterion: AC-1
    executor: ui-check
    layer: ui-observed
    cmd: config:executors.script.ctc_man
    steps:
      - "Phien do rieng (tien-de.mjs) qua bash _acceptance/tieu-de-cot-doc-tron/rang/mot-luot.sh; API cua phien khoi lai voi kho Blob gia (khuon _acceptance/truong-tep/rang/blob-gia.mjs + nap-blob-gia.mjs). Gieo qua API that: fields.create ba truong FILE 'Hop dong ctc' (COMPANY, CONTACT, DEAL, bat hien tren phieu); companies.create cong ty CO (description 3 cau) va cong ty TRONG (khong description, khong ten mien); contacts.create, deals.create gan cong ty CO; moi ban ghi CO, lien he, thoa thuan mot tep PDF ten DUNG 60 ky tu co dau (do-bo-cuc.mjs dung ten roi kiem [...ten].length === 60, lech thi 'KHONG DO DUOC: ten tep khong 60 ky tu') qua fieldFiles.requestUpload -> PUT kho gia -> fieldFiles.complete."
      - "Buoc 1 (1440 roi 768): mo ngan cong ty CO, tab Tong quan; tieu de muc doc tu bang chu that (apps/app/lib/messages); muc 'Gioi thieu' co rect.top < rect.top cua muc 'Chi tiet'; rect.width cua muc Chi tiet >= rect.width cua noi dung tab - 2; dem cap hang thuoc tinh cua Chi tiet cung offsetTop khac offsetLeft, can >= 2; in so hang thuoc tinh da do, bang 0 thi do; chup ctc-cong-ty-1440.png, ctc-cong-ty-768.png vao _acceptance/chi-tiet-cong-ty-hai-cot/evidence/"
    paths:
      - "apps/app/components/crm/record-sheet/company-sheet.tsx"
      - "apps/app/components/crm/record-sheet/record-parts.tsx"
      - "apps/app/components/detail-sheet.tsx"
