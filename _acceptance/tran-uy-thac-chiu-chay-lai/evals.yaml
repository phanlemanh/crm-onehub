      2. giu gac + get(), bo record va update   (tai 83501f3: 22 XANH)
      3. giu gac + get + record, bo update      (tai 83501f3: 22 XANH)
      NGUONG: CA BA phai bi bat.
      SAN KHUON, sau dieu, thieu mot la ma 2:
      (a) CA BA ban dot bien dan tu VAN BAN THAT doc tu dia. Sua sau vong cham 2:
          ban thu nhat truoc day chep tay nen chot banDotBien === nguon khong bao gio
          no duoc cho no.
      (b) Rang KHONG sua file trong cay lam viec — ghi duoi node_modules/.cache, ngoai
          tam tsconfig, git va glob bo do, don trong finally.
      (c) Rang KHONG in nhat ky cua luot dot bien ra stdout. Ba ma thoat tach ro:
          0 = ca ba bi bat · 1 = co hinh dang khong bi bat · 2 = khong do duoc.
      (d) Ban dot bien phai CHUNG DUOC no da song va da chay: dem so lan handle gia bi
          cham, doi > 0. Phan biet ba loai su co, khong gop: AssertionError cua bo do
          -> BI BAT; loi nap/giai module -> ma 2; bun test TU CHOI tim file (khi thieu
          duong dang "./...") -> ma 2. Ca thu ba co that, da chung tai 83501f3.
      (e) MOI duong dan suy tu fileURLToPath(import.meta.url), KHONG tu cwd; rang in
          duong dan tuyet doi cua file no doc va SHA cua cay ay.
      (f) TRON phep do song trong MOT ham cua module dung chung (kiemChuoiCuongChe +
          hang CHUOI_SONG), duoc CA bo do that LAN spec do rang sinh goi. Spec sinh ra
          chi mot dong assert nen khong the lac hau. Sua sau vong cham 2: ban truoc
          chep 6 dong assert vao spec sinh, va chung lac hau ngay khi driver doi API.
      CHIEU DO CUA CHINH RANG: tren cay LANH phep do phai XANH, chay TRUOC khi dot
      bien; khong xanh -> ma 2.
      PHAM VI DA DO: chay in-process, KHONG chung minh eve THAT truyen dung event.data
      xuong hook. Khai o Known limits.

