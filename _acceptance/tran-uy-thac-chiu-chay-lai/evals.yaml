      - "apps/agent/test/tran-uy-thac.spec.ts"
      - "apps/agent/test/tran-uy-thac/chuoi-cuong-che.ts"
    expected: |
      CA MA BAN KHOA-THEO-TOA-DO CUA VONG CHAM 1 VA 2 CHO LOT. Hai nguoi soi doc
      lap bat duoc, va da tu kiem lai tren dist/ cua eve 0.29.4.
      Trang thai da ghi mot uy thac tai (turn-1, step 2) voi call-a. Mot su kien
