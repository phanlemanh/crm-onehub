      - "apps/agent/test/tran-uy-thac.spec.ts"
      - "apps/agent/test/tran-uy-thac/chuoi-cuong-che.ts"
    expected: |
      CA MA BAN TAI 83501f3 GIET OAN, va RANH GIOI CHAY LAI la step.started —
      KHONG phai sequence. Doi khuon sau vong cham 2; ly do o muc "Su that ve eve"
      cua contract.
      Trang thai da ghi mot uy thac tai (turn-1, step 2) voi call-a. Hook nhan
      step.started mang CUNG (turn-1, step 2) -> xoa o (stepIndex ve null, callIds
