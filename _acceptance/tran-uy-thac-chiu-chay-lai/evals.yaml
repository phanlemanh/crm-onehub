      ghi o (turn-1, step 2, [call-b]).
      SAN KHUON, ba dieu:
      (a) Trang thai "da ghi" phai ROUND-TRIP qua chinh recordBuilderDelegation —
          object literal viet tay dung khuon ben doc la ma 2 (finding trong hop
          dong cua vong cham 2).
      (b) callId hai lan phai KHAC nhau.
      (c) step.started cua mot step KHAC phai de o NGUYEN — do trong cung nhom bai.
      CHIEU DO chay that: tren cung fixture, BO step.started di -> loi goi thu hai
      PHAI nem. Ve nay la cho phan biet duy nhat, va la ly do khoa theo toa do
      khong lam duoc: khong co step.started thi hai ca co toa do y het.

  - id: E2
