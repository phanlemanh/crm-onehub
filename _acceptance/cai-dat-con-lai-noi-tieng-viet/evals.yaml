  - id: E16
    criterion: AC-12
    executor: script
    cmd: config:executors.script.cd2_doan_ma_chep
    expected: >-
      exit 0. KHONG so vi voi en — hai luot dung tu cung mot template nen luon bang nhau
      ke ca khi template sai. Moi doan so voi NGUON CHAN LY NGOAI MAN: the <script> so voi
