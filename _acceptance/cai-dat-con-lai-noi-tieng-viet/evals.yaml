      Doi hoi: so o quan sat tren man (trang thai dang hien cua onehub) + so o do muc ma
      (moi khoa con dung mot nut AST doc no, ban vi co dau) + so o khai khong-ton-tai = 20.
      Thieu mot o la thoat ma 2 goi ten o. Ma tran in ra output. KHONG dung luong OAuth that.
      Chieu do: xoa nut doc khoa cua o "Microsoft x cam lai" thi chan do goi ten o do —
      khong phai "liet nhung gi tim thay" ma la "doi du 20".
