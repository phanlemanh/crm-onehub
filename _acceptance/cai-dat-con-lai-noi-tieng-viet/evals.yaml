schema_version: 1
feature_slug: cai-dat-con-lai-noi-tieng-viet
evals:

  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.cd2_hai_tieng
    expected: >-
      exit 0. Danh sach route SINH TU THU MUC settings/ (moi page.tsx la mot route),
      TRU hai route dot mot va tru cac route khai khong-dung-duoc co ly do trong ban khai.
      Moi route dung hai luot vi/en tren may chu that, redirect: manual — 3xx la
      THOAT MA 2 goi ten route. Ba ve tren TUNG route: so chuoi bang nhau · moi cap khac
      nhau tru bang AC-6 · luot vi co dau. Tap rong tren mot route la thoat ma 2.
      In so route do duoc / so route thu muc sinh ra; hai so lech ma khong co dong khai
      ly do la thoat ma 2.
      Chieu do: ghim settingsMessages("vi") vao mot trang thi luot en hien tieng Viet,
      ve 2 gay, chan do goi ten trang va duong DOM.
    paths:
      - "apps/app/app/(app)/[slug]/settings/**"
      - "apps/app/lib/messages/settings-*.ts"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

