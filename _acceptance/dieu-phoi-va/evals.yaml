schema_version: 1
slug: dieu-phoi-va

evals:
  - id: E1
    criterion: AC-1
    executor: test
    layer: backend-effect
    cmd: config:executors.test.dpv_ma_lech
    paths:
      - "packages/db/src/agent-tasks.ts"
      - "packages/validation/src/onboarding-identify.ts"
      - "apps/agent/agent/lib/dispatch.ts"
      - "apps/agent/agent/lib/ma-lech.ts"
      - "apps/agent/test/dieu-phoi-va.spec.ts"
    expected: |
      apps/agent/test/dieu-phoi-va.spec.ts describe "ma-lech": gieo ke hoach mo (ownerId, companyId) va mot hang AgentTask
      kind onboarding-identify voi payload dung bang onboardingIdentifyPayload.parse (cung schema API ghi), roi chay mot
      luot lan truc tiep that (runDirect / ham dispatch cua lan truc tiep). Ma tran: (1) "onboarding-identify" thuoc
      TASK_KINDS va DIRECT_KINDS; (2) claimDue cua lan nghien cuu (except KHONG_VAO_LAN_NGHIEN_CUU) khong nhan hang do;
      (3) dung mot Activity TASK completedAt null cua ke hoach; (4) createdById = ownerId; (5) companyId cua ke hoach;
      (6) dueAt = dau ngay VN hom nay; (7) subject chua ma; (8) meta.platformBrokerId = ma; (9) AgentTask completedAt khac
      null; (10) khong session nghien cuu nao duoc mo cho hang do. Doi chung duong cho (2) va (10): gieo kem mot hang
      kind "identify" hop le (co contact) — claimDue cua lan nghien cuu NHAN dung hang do, khong nhan hang onboarding-identify.
      CHIEU DO: ban sao bo "onboarding-identify" khoi DIRECT_KINDS -> dong 1 do voi thong diep ghim "onboarding-identify khong o lan truc tiep";
      ban sao dua onboarding-identify vao lan nghien cuu -> dong 2 do voi thong diep ghim "lan nghien cuu nhan onboarding-identify".

  - id: E1c
    criterion: AC-1
    executor: test
    layer: backend-effect
    cmd: config:executors.test.dpv_mach_lien
    paths:
      - "apps/api/src/agent/agent-trigger.service.ts"
      - "apps/api/src/onboarding/onboarding-ingest.service.ts"
      - "packages/db/src/agent-tasks.ts"
      - "apps/agent/agent/lib/dispatch.ts"
      - "apps/agent/agent/lib/ma-lech.ts"
      - "apps/api/test/dieu-phoi-va.spec.ts"
      - "apps/agent/test/dieu-phoi-va.spec.ts"
    expected: |
      Mach lien that trong CUNG mot luot `bun run test` (cung co so du lieu cua luot): (a) apps/api/test/dieu-phoi-va.spec.ts
      describe "mach-lien-ghi" tao ke hoach mo id "dpv-mach-lien-<ma luot>" va goi OnboardingIngestController that voi lo
      hai ma lech, KHONG don hang AgentTask; (b) apps/agent/test/dieu-phoi-va.spec.ts describe "mach-lien-doc" tim hang
      onboarding-identify cua ke hoach do (khong tu gieo), chay mot luot lan truc tiep that. Ma tran: (1) dung hai hang
      duoc nhan boi claimDue cua lan truc tiep; (2) dung hai Activity TASK mo, moi Activity mang dung mot ma; (3) ca hai
      AgentTask dong; don ke hoach + Activity + AgentTask o cuoi (b).
      CHIEU DO: ban sao writer dat runAt o tuong lai (hoac kind khac) -> dong 1 do voi thong diep ghim "lan truc tiep khong nhan hang API ghi".

  - id: E1b
    criterion: AC-1
    executor: test
    layer: backend-effect
    cmd: config:executors.test.dpv_nhan_lo
    paths:
      - "apps/api/src/agent/agent-trigger.service.ts"
      - "apps/api/src/onboarding/onboarding-ingest.service.ts"
      - "packages/validation/src/onboarding-identify.ts"
      - "apps/api/test/dieu-phoi-va.spec.ts"
    expected: |
      apps/api/test/dieu-phoi-va.spec.ts describe "nhan-lo": goi OnboardingIngestController that voi mot lo co mot ma khop
      va mot ma lech. Ma tran: (1) mot hang AgentTask kind onboarding-identify cho ma lech; (2) payload cua hang qua
      onboardingIdentifyPayload.parse va mang dung planId, platformBrokerId; (3) kind cua hang thuoc DIRECT_KINDS doc tu
      @crm/db/agent-tasks (vong ghi -> doc khep bang mot schema); (4) lo ba ma lech -> dung ba hang, moi hang qua schema
      voi dung ma cua no (doi chung: lo mot ma lech -> mot hang).
      CHIEU DO: ban sao gom ca lo vao mot hang -> dong 4 do voi thong diep ghim "ma lech bi gom vao mot hang"; ban sao agent-trigger ghi payload { plan: planId } -> dong 2 do voi thong diep ghim "payload onboarding-identify khong qua schema".

  - id: E2
    criterion: AC-2
    executor: test
    layer: backend-effect
    cmd: config:executors.test.dpv_khong_trung
    paths:
      - "apps/agent/agent/lib/ma-lech.ts"
      - "apps/agent/test/dieu-phoi-va.spec.ts"
    expected: |
      dieu-phoi-va.spec.ts (agent) describe "khong-trung": hai hang cung ke hoach + ma, chay lan truc tiep hai lan -> dung
      mot Activity mo; danh dau viec do xong, them hang thu ba -> hai Activity (mot da xong, mot mo); cung ma o ke hoach
      thu hai -> mot viec rieng cua ke hoach do. Moi hang AgentTask deu dong.
      CHIEU DO: ban sao bo buoc tim viec mo -> dong "mot viec mo" do voi thong diep ghim "ghi trung viec ma lech".

  - id: E3
    criterion: AC-3
    executor: test
    layer: backend-effect
    cmd: config:executors.test.dpv_dong_som
    paths:
      - "apps/agent/agent/lib/ma-lech.ts"
      - "packages/validation/src/onboarding-identify.ts"
      - "apps/agent/test/dieu-phoi-va.spec.ts"
    expected: |
      dieu-phoi-va.spec.ts (agent) describe "dong-som": ba ca, moi ca mot hang onboarding-identify — (a) ma da gan vao mot ca
      nhan qua truong MA_NEN_TANG truoc khi lan chay; (b) ke hoach closedAt khac null; (c) payload { planId: 1 }. Moi ca:
      0 Activity moi, AgentTask completedAt khac null sau DUNG mot luot, ket qua chua dung cum "ma da khop" / "ke hoach da
      dong hoac khong con" / "payload onboarding-identify hong" (ca c kem thong diep parse). Doi chung duong: ca (d) ma van
      lech, ke hoach mo -> 1 Activity.
      CHIEU DO: ban sao bo nhanh "ma da khop" -> ca (a) do voi thong diep ghim "ghi viec cho ma da khop".

  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.dpv_them_buoc_dom
    paths:
      - "apps/app/components/crm/record-sheet/plan-steps.tsx"
      - "apps/app/lib/messages/onboarding.ts"
      - "apps/app/test/dieu-phoi-va.dom.tsx"
    expected: |
      apps/app/test/dieu-phoi-va.dom.tsx describe "ke-hoach-rong": render PlanSteps voi listSteps rong va listDepartments
      hai bo phan. Ma tran: (1) khung trong co nut "Thêm bước"; (2) bam -> form co o chon bo phan; (3) Luu khoa khi ten trong;
      (4) Luu khoa khi chua chon bo phan; (5) chon bo phan B, go ten, Luu -> onboarding.addStep nhan dung { planId,
      departmentId: B, label, dueAt }. Chi khang dinh tren gia tri nguyen thuy.
      CHIEU DO: ban sao chi ve ThemBuoc trong nhom -> dong 1 do voi thong diep ghim "ke hoach rong khong co nut them buoc".

  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.dpv_them_buoc_dom
    paths:
      - "apps/app/components/crm/record-sheet/plan-steps.tsx"
      - "apps/app/test/dieu-phoi-va.dom.tsx"
    expected: |
      dieu-phoi-va.dom.tsx describe "bo-phan-khac": ke hoach co buoc o bo phan A, listDepartments A, B, C. Ma tran: (1) nut
      "Thêm bước ở bộ phận khác" hien; (2) o chon co dung B, C (khong A); (3) khi moi bo phan deu co nhom -> nut khong hien;
      (4) ke hoach da dong (closedAt) -> khong nut them nao trong toan khung.
      CHIEU DO: ban sao khong loc bo phan da co nhom -> dong 2 do voi thong diep ghim "o chon liet bo phan da co nhom".

  - id: E6
    criterion: AC-6
    executor: test
    layer: backend-effect
    cmd: config:executors.test.dpv_bo_phan_hong
    paths:
      - "apps/api/src/onboarding/onboarding-ghi.ts"
      - "apps/api/src/onboarding/onboarding.contracts.ts"
      - "apps/api/test/dieu-phoi-va.spec.ts"
    expected: |
      dieu-phoi-va.spec.ts (api) describe "bo-phan-hong": goi router onboarding.addStep that voi (a) departmentId khong co that,
      (b) bo phan archivedAt khac null. Moi ca: loi BAD_REQUEST (khong INTERNAL_SERVER_ERROR), thong diep nem ma (ca a) hoac
      ten (ca b) cua bo phan — dung thong diep san co TO_CHUC.thongDiep.khongCoBoPhan / ONBOARDING.thongDiep.boPhanDaLuuTru,
      so OnboardingStep cua ke hoach khong doi. Doi chung duong: bo phan dang dung -> buoc duoc ghi.
      CHIEU DO: ban sao bo kiem bo phan -> ca (b) do voi thong diep ghim "addStep ghi buoc vao bo phan da luu tru".

  - id: E6b
    criterion: AC-6
    executor: test
    cmd: config:executors.test.dpv_them_buoc_dom
    paths:
      - "apps/app/components/crm/record-sheet/plan-steps.tsx"
      - "apps/app/test/dieu-phoi-va.dom.tsx"
    expected: |
      dieu-phoi-va.dom.tsx describe "loi-bo-phan": addStep gia lap nem TRPCClientError BAD_REQUEST voi thong diep "Bộ phận
      đã lưu trữ". Ma tran: (1) thong diep hien trong form; (2) o ten giu dung chu da go; (3) form van mo (o chon bo phan con
      trong DOM). Doi chung duong: addStep thanh cong -> form dong.
      CHIEU DO: ban sao dong form khi loi -> dong 3 do voi thong diep ghim "form dong khi luu loi".

  - id: E7
    criterion: AC-7
    executor: test
    layer: backend-effect
    cmd: config:executors.test.dpv_dem_qua_han
    paths:
      - "apps/api/src/dashboard/dashboard.service.ts"
      - "apps/api/src/dashboard/dashboard.contracts.ts"
      - "apps/api/test/dieu-phoi-va.spec.ts"
    expected: |
      dieu-phoi-va.spec.ts (api) describe "dem-qua-han": gieo 25 Activity TASK qua han (dueAt truoc dauNgayVN(now), chua xong,
      createdById nguoi A), 3 TASK qua han cua nguoi B, 2 TASK cua A da xong, 2 TASK cua A han hom nay, 15 OnboardingStep
      qua han giao A trong ke hoach mo, 2 buoc qua han giao A trong ke hoach da dong. Goi dashboard.summary that. Ma tran:
      (1) "Cua toi" A: quaHan.viec = 25; (2) quaHan.buoc = 15; (3) overdueTasks.length = 10; (4) "Tat ca": quaHan.viec =
      28 cong so TASK qua han san co (so san co dem truoc khi gieo, mot lan, roi cong 28 viet truoc); (5) "Tat ca":
      quaHan.buoc = 15 (van la buoc cua A, khong doi theo pham vi); (6) doi chung: viec han hom nay, viec da xong, buoc
      trong ke hoach da dong khong dem.
      CHIEU DO: ban sao dem bang overdueTasks.length -> dong 1 do voi thong diep ghim "quaHan.viec bi tran 10".

  - id: E7b
    criterion: AC-7
    executor: test
    cmd: config:executors.test.dpv_the_qua_han_dom
    paths:
      - "apps/app/app/(app)/[slug]/dashboard-summary.tsx"
      - "apps/app/lib/messages/tong-quan.ts"
      - "apps/app/test/dieu-phoi-va.dom.tsx"
    expected: |
      dieu-phoi-va.dom.tsx describe "the-qua-han": render DashboardSummary voi du lieu tu cung khuon dashboard.summary
      (overdueTasks 10 dong, mySteps 10 dong trong do 6 qua han, quaHan { viec: 25, buoc: 15 }). Ma tran: (1) mo ta the chua
      "40"; (2) dong "và 24 việc quá hạn nữa" (40 - 16 dong qua han dang hien) co mat; (3) chu tieng Anh "and 24 more past due"
      khi locale en.
      CHIEU DO: ban sao dem tren mang -> dong 1 do voi thong diep ghim "so qua han dem tren danh sach da cat".

  - id: E8
    criterion: AC-8
    executor: test
    cmd: config:executors.test.dpv_the_qua_han_dom
    paths:
      - "apps/app/app/(app)/[slug]/dashboard-summary.tsx"
      - "apps/app/test/dieu-phoi-va.dom.tsx"
    expected: |
      dieu-phoi-va.dom.tsx describe "the-qua-han": hai ca — quaHan { viec: 3, buoc: 1 } voi 3 viec + 1 buoc qua han dang hien;
      va quaHan { viec: 0, buoc: 0 }. Ma tran: (1) ca mot ghi "4", khong co chuoi "nữa"; (2) ca hai ghi chu rong cua the,
      khong co chuoi "nữa".
      CHIEU DO: ban sao luon ve dong "và N" -> ca mot do voi thong diep ghim "dong con sot hien khi khong sot".

  - id: E9
    criterion: AC-9
    executor: script
    cmd: config:executors.script.dpv_hoi_quy
    paths:
      - "apps/api/test/dieu-phoi-diem-nhan.spec.ts"
      - "apps/api/test/han-viec.spec.ts"
      - "apps/app/test/ke-hoach-sheet.dom.tsx"
      - "apps/app/test/moi-phia-ke-hoach.dom.tsx"
      - "apps/app/test/han-viec.dom.tsx"
      - "_acceptance/dieu-phoi-va/rang/khong-xoa-expect.mjs"
    expected: |
      rang/khong-xoa-expect.mjs (khuon cua giai-doan-mac-dinh, TEP = nam tep tren, --moc bat buoc) --tu-thu roi --moc d0ccad984:
      moi cau expect( o moc con nguyen (chuan hoa khoang trang ngoai chuoi) -> thoat 0; roi chay lai nam tep bang lenh test
      cua kho va bun run check-types, tat ca thoat 0.
      CHIEU DO: --tu-thu sua mot ky tu trong chuoi cua mot expect -> do voi thong diep ghim "expect bi sua".

  - id: E10
    criterion: AC-4
    executor: ui-check
    layer: ui-observed
    cmd: config:executors.script.dpv_man
    steps:
      - "Cảnh cây trước màn đầu; phiên đo riêng (tien-de.mjs, do:man), mỗi khổ một tiến trình con; đăng nhập theo bộ mẫu"
      - "Ở 1440 và 390: mở bản ghi một kế hoạch mở không bước (ST-ke-hoach-rong), bấm Thêm bước (ST-ke-hoach-them-bo-phan), chọn bộ phận, gõ tên, Lưu, đọc lại bước qua API; mở kế hoạch có bước (ST-ke-hoach-bo-phan-khac); mở kế hoạch đã đóng (ST-ke-hoach-dong); chụp ảnh khung nhìn mỗi trạng thái"
    expected: "exit 0; 8 ảnh (4 trạng thái × 2 khổ) trong _acceptance/dieu-phoi-va/evidence/; mỗi trạng thái in 'dat'; bước vừa thêm đọc lại được qua API."
    evidence_required: [run_id, exit_code, verifier, verified_at, output, screenshots]
    paths: ["apps/app/components/crm/record-sheet/plan-steps.tsx", "apps/app/lib/messages/onboarding.ts", "_acceptance/dieu-phoi-va/rang/man.mjs"]

  - id: E11
    criterion: AC-7
    executor: ui-check
    layer: ui-observed
    cmd: config:executors.script.dpv_man
    steps:
      - "Cảnh cây trước màn đầu; phiên đo riêng; gieo 25 việc và 15 bước quá hạn cho người đăng nhập qua Prisma trong phiên đo"
      - "Ở 1440 và 390: mở Tổng quan, đọc thẻ data-khoi=viec-qua-han (ST-tong-quan-con-sot): mô tả ghi 40, có dòng «và N việc quá hạn nữa» với N = 40 − số dòng quá hạn đang hiện; dọn gieo, mở lại (ST-tong-quan-du): không có dòng «nữa»; chụp ảnh"
    expected: "exit 0; 4 ảnh (2 trạng thái × 2 khổ) trong _acceptance/dieu-phoi-va/evidence/; mỗi trạng thái in 'dat'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output, screenshots]
    paths: ["apps/app/app/(app)/[slug]/dashboard-summary.tsx", "apps/api/src/dashboard/dashboard.service.ts", "_acceptance/dieu-phoi-va/rang/man.mjs"]
