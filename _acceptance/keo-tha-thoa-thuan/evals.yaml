schema_version: 1
slug: keo-tha-thoa-thuan

evals:
  - id: E1
    criterion: AC-2
    executor: test
    layer: backend-effect
    cmd: config:executors.test.ktt_board_dem_tong
    paths:
      - "apps/api/src/deals/**"
      - "apps/api/test/deals-board.spec.ts"
    expected: |
      Tich hop tren co so du lieu kiem cua bun run test. Fixture: 9 thoa thuan rai tren 5 giai
      doan, 2 da luu tru, 2 loai tien (VND va USD, co baseAmount). Ma tran viet truoc: 7 cot x
      [dem, tong, tap id the] = 21 khang dinh, gia tri ky vong tinh TU fixture bang mot ham
      doc lap trong bai kiem (loc archivedAt null, nhom theo stage, cong baseAmount), khong
      chep so cung. Thu tu cot khang dinh bang mang giai doan cua deal-stage.
      CHIEU DO: ban sao bo dieu kien archivedAt null trong thu tuc -> do voi thong diep ghim
      "cot DEMO_BOOKED: dem 4 != 3" (thoa thuan luu tru bi tinh; da chay 2026-09-23).
      Vong 2 (S4-r1): them khang dinh thu tu moi cot — so thoa thuan chua quy doi (unconverted.count)
      bang so thoa thuan trong fixture co gia tri ma tien te khong quy doi duoc. Ma tran 7 x 4 = 28.
      CHIEU DO (da chay 2026-09-23): thu tuc luon tra count 0 -> "cot DEMO_BOOKED: chua quy doi 0 != 1".

  - id: E2
    criterion: AC-3
    executor: test
    layer: backend-effect
    cmd: config:executors.test.ktt_board_tran_50
    paths:
      - "apps/api/src/deals/**"
      - "apps/api/test/deals-board.spec.ts"
    expected: |
      Fixture 53 thoa thuan o QUALIFIED_TO_BUY. Khang dinh: dem = 53, so the = 50, the la 50
      phan tu dau theo cung sort/dir ma deals.list tra cho stage do (so tung id theo chi so).
      Cap hai chieu tren cung fixture: 50 thoa thuan -> dem 50, the 50.
      CHIEU DO: nang tran len 60 trong ban sao -> do voi thong diep ghim "tran cot: 53 the != 50" (da chay 2026-09-23).

  - id: E3
    criterion: AC-4
    executor: test
    layer: backend-effect
    cmd: config:executors.test.ktt_board_loc
    paths:
      - "apps/api/src/deals/**"
      - "apps/api/test/deals-board.spec.ts"
    expected: |
      Ma tran viet truoc: 4 bo loc [q, owner, closing, fields] x 7 cot x [dem, tong baseAmount,
      tap id the] = 84 khang dinh. Gia tri ky vong lay tu deals.list THAT cung bo loc
      (status=all, archived=false, pageSize 100, fixture < 100 dong) roi gom theo stage — khong
      viet tay. So theo tung cot, khong so tap gop.
      CHIEU DO: ban sao chi rieng phan dem mat moi bo loc, phan the van loc -> do voi thong
      diep ghim "bo loc q, cot DEMO_BOOKED: dem 4 != 1" (da chay 2026-09-23).

  - id: E4
    criterion: AC-5
    executor: test
    layer: backend-effect
    cmd: config:executors.test.ktt_board_ghi
    paths:
      - "apps/api/src/deals/**"
      - "apps/api/test/deals-board.spec.ts"
    expected: |
      Goi deals.setStage(DEMO_BOOKED -> CONTRACT_SENT) roi deals.board: the o cot CONTRACT_SENT,
      dem hai cot doi +1/-1, stageChangedAt moi hon luc truoc, co dung MOT activity
      STAGE_CHANGE meta {from, to}. Cap: setStage sang CLOSED_WON -> closedAt duoc dong dau.
      CHIEU DO: goi board voi ban ghi chua doi (khong goi setStage) -> do voi thong diep ghim
      "the khong o cot CONTRACT_SENT".

  - id: E5
    criterion: AC-6
    executor: test
    layer: backend-effect
    cmd: config:executors.test.ktt_board_ly_do
    paths:
      - "apps/api/src/deals/**"
      - "apps/api/test/deals-board.spec.ts"
    expected: |
      Hai ca cung fixture: setStage sang CLOSED_LOST khong ly do -> loi BadRequest, board khong
      doi; co ly do -> board co the o cot CLOSED_LOST va closedReason da ghi. Dem ca = 2.
      CHIEU DO: ca co ly do dung chuoi rong -> do voi thong diep ghim "ly do rong van ghi".

  - id: E6
    criterion: AC-1
    executor: test
    cmd: config:executors.test.ktt_man_chuyen
    paths:
      - "apps/app/app/(app)/[slug]/deals/**"
      - "apps/app/lib/messages/deals.ts"
      - "apps/app/test/keo-tha-thoa-thuan.dom.tsx"
    expected: |
      jsdom, tRPC gia. Bam «Bang cot» -> tham so view=board, bay phan tu data-board-column theo
      dung thu tu mang giai doan (so theo chi so), o tim van co mat; bam «Bang» -> bang
      DataTable tro lai. Dung lai voi view=board tren duong dan -> bang cot.
      CHIEU DO: dao nguoc thu tu cot trong ban sao -> do voi thong diep ghim "cot 1:
      UNQUALIFIED_TO_BUY != DEMO_BOOKED" (da chay 2026-09-23).

  - id: E7
    criterion: AC-11
    executor: test
    cmd: config:executors.test.ktt_man_chuyen
    paths:
      - "apps/app/app/(app)/[slug]/deals/**"
      - "apps/app/test/keo-tha-thoa-thuan.dom.tsx"
    expected: |
      Cung tep voi E6, ca luu-tru: archived=true va view=board tren duong dan -> nut chuyen
      aria-disabled, khong co data-board-column nao, DataTable hien. Cap: archived=false cung
      duong dan -> bang cot hien.
      CHIEU DO: bo dieu kien archived trong ban sao -> do voi thong diep ghim "luu tru: bang cot
      van hien".

  - id: E8
    criterion: AC-5
    executor: test
    cmd: config:executors.test.ktt_man_tha
    paths:
      - "apps/app/app/(app)/[slug]/deals/**"
      - "apps/app/test/keo-tha-thoa-thuan.dom.tsx"
    expected: |
      jsdom. Goi bo xu ly tha cua bang cot thoa thuan voi su kien doi tu cot A sang cot B (keo
      that do bang Chrome o E14). Khang dinh: the nam o cot B TRUOC khi mutation tra ve (lac
      quan), setStage duoc goi DUNG MOT lan voi {id, stage: B}, the mo va khong keo duoc toi khi
      mutation xong. Cap: cot B = CLOSED_WON -> goi thang, khong mo hop thoai.
      CHIEU DO: bo buoc doi lac quan -> do voi thong diep ghim "the chua o cot B khi dang luu".

  - id: E9
    criterion: AC-8
    executor: test
    cmd: config:executors.test.ktt_man_tha
    paths:
      - "apps/app/app/(app)/[slug]/deals/**"
      - "apps/app/test/keo-tha-thoa-thuan.dom.tsx"
    expected: |
      Ma tran viet truoc 3 ca: tha vao chinh cot cu, su kien khong co cot dich, huy keo. Moi ca:
      setStage goi 0 lan va the o nguyen cot. Doi chung duong cung tep: E8 goi 1 lan.
      CHIEU DO: bo phep so cot cu == cot moi -> do voi thong diep ghim "cung cot: setStage goi 1 lan".

  - id: E10
    criterion: AC-6
    executor: test
    cmd: config:executors.test.ktt_man_thua
    paths:
      - "apps/app/app/(app)/[slug]/deals/**"
      - "apps/app/components/crm/stage-change.tsx"
      - "apps/app/test/keo-tha-thoa-thuan.dom.tsx"
    expected: |
      Ma tran 2 cot thua [CLOSED_LOST, UNQUALIFIED_TO_BUY] x 2 nhanh [luu, huy] = 4 ca. Tha vao
      cot thua -> hop thoai ly do mo (tham so closeDeal/closeStage), setStage goi 0 lan. Luu voi
      ly do -> setStage goi 1 lan kem closedReason, the o cot thua. Huy -> setStage 0 lan, the
      o cot cu.
      Hop thoai ly do that (CloseReasonDialog) gan trong cay kiem; nhanh luu go ly do roi bam Luu,
      nhanh huy bam Huy va khang dinh hop thoai dong.
      CHIEU DO (da chay 2026-09-23): goi setStage ngay khi tha vao cot thua trong ban sao -> do voi
      thong diep ghim "cot thua: ghi truoc khi co ly do".

  - id: E11
    criterion: AC-7
    executor: test
    cmd: config:executors.test.ktt_man_tu_choi
    paths:
      - "apps/app/app/(app)/[slug]/deals/**"
      - "apps/app/test/keo-tha-thoa-thuan.dom.tsx"
    expected: |
      setStage gia tra TRPCError voi thong diep "Khong duoc doi." -> the ve cot cu, toast.error
      nhan DUNG chuoi do. Doi chung duong cung fixture: setStage thanh cong -> the o cot moi,
      khong toast loi.
      CHIEU DO: bo buoc hoan tac trong ban sao -> do voi thong diep ghim "tu choi: the van o cot moi".

  - id: E12
    criterion: AC-9
    executor: test
    cmd: config:executors.test.ktt_man_ban_phim
    paths:
      - "apps/app/app/(app)/[slug]/deals/**"
      - "apps/app/test/keo-tha-thoa-thuan.dom.tsx"
    expected: |
      Chi ban phim, khong click: focus nut menu giai doan tren the (nam ngoai tay keo), keydown
      Enter mo menu, focus muc «Qualified to buy», keydown Enter -> setStage goi 1 lan, the o cot
      moi; lam lai voi «Closed lost» -> tham so hop thoai ly do (closeDeal/closeStage) duoc dat,
      setStage 0 lan.
      CHIEU DO (da chay 2026-09-23): the khong co menu giai doan -> do voi thong diep ghim
      "the khong co menu giai doan".

  - id: E13
    criterion: AC-10
    executor: test
    cmd: config:executors.test.ktt_man_bam_the
    paths:
      - "apps/app/app/(app)/[slug]/deals/**"
      - "apps/app/test/keo-tha-thoa-thuan.dom.tsx"
    expected: |
      Bam than the -> openRecord goi voi {kind: "deal", id}. Bam nut menu giai doan tren the ->
      openRecord KHONG goi. Dem ca = 2.
      CHIEU DO (da chay 2026-09-23): boc the trong mot lop bat click de mo tam -> do voi thong diep
      ghim "bam menu mo tam".

  - id: E14
    criterion: AC-13
    executor: ui-check
    layer: ui-observed
    cmd: config:executors.script.ktt_man_chrome
    paths:
      - "apps/app/app/(app)/[slug]/deals/**"
      - "packages/ui/src/components/board.tsx"
      - "packages/ui/src/components/reui/**"
      - "_acceptance/keo-tha-thoa-thuan/rang/man-bang-cot.mjs"
    steps:
      - "Canh cay (rang/canh-cay.mjs) truoc man dau tien; lech cay -> ma 2"
      - "Dang nhap bang dev:session, gieo 12 thoa thuan rai tren 4 giai doan mo"
      - "Mo {APP_URL}/<slug>/deals?view=board o 320, 375, 768, 1024, 1440, lang vi va en -> chup evidence/bang-cot-<kho>-<tieng>.png"
      - "Moi o: scrollWidth cua trang <= innerWidth; dau moi cot co ten, so dem, tong"
      - "O 1440/vi: keo bang chuot mot the tu cot 1 sang cot 2 (pointer down, move tung buoc, up) -> the o cot 2, tai lai trang -> van o cot 2 -> chup evidence/sau-khi-keo.png"
      - "O 1440/vi: keo mot the vao cot Contract sent dang rong -> the o cot do, deals.byId tra CONTRACT_SENT -> chup evidence/tha-cot-rong.png"
    expected: |
      exit 0. Chrome that tren may chu dev cua cay dang xet. Ma tran viet truoc 5 kho x 2 tieng
      = 10 o x [khong tran, 7 dau cot du ba phan, 7 cot cung mot hang] = 30 khang dinh, cong 2 khang dinh keo
      (sau khi tha, sau khi tai lai), cong 2 khang dinh keo vao cot mo DANG RONG (gieo de
      CONTRACT_SENT rong; sau khi tha the o cot do, deals.byId tra CONTRACT_SENT) = 34 (hang
      KY_MONG trong tep thuoc; lech -> ma 2).
      Them: console va loi trang cua moi o khong co loi hydrate (/hydrat/i), doc sau khi mang
      yen va React hydrate xong.
      Chieu do (da chay 2026-09-23, moi lan mot ban sao, cung may chu cua cay):
      (1) khung bang overflow-hidden -> "bang khong cuon duoc hoac tran trang 320/vi";
      (2) class bang cot dat len con cua KanbanBoard asChild -> "bay cot khong cung mot hang 320/vi";
      (3) bo qua tha khi dich la chinh khung cot -> "cot rong khong nhan tha";
      (4) chen gia tri ngau nhien vao dau cot (lech hydrate) -> "loi hydrate 320/vi".
      Doi chung duong: ban sach -> o=10/10 khang-dinh=34/34, 0 dong HONG.

  - id: E15
    criterion: AC-1
    executor: ui-check
    layer: ui-observed
    cmd: config:executors.script.ktt_man_chrome
    steps:
      - "Cung lan chay voi E14 (config:executors.script.ktt_man_chrome)"
      - "Mo {APP_URL}/<slug>/deals?view=board o 5 kho x 2 tieng, doc bay cot theo chi so"
      - "Chup evidence/E14-bang-cot-<kho>-<tieng>.png"
    paths:
      - "apps/app/app/(app)/[slug]/deals/**"
      - "_acceptance/keo-tha-thoa-thuan/rang/man-bang-cot.mjs"
    expected: |
      Cung lan chay E14: bam nut «Bang cot» that, dia chi doi sang view=board, doc bay ten cot
      bang cai nguoi thay theo chi so; bam «Bang» -> bang tro lai. CHIEU DO chung voi E14.

  - id: E16
    criterion: AC-5
    executor: ui-check
    layer: ui-observed
    cmd: config:executors.script.ktt_man_chrome
    steps:
      - "Cung lan chay voi E14; o 1440/vi keo chuot mot the sang cot khac"
      - "Tai lai trang, doc cot cua the va goi deals.byId de so giai doan may chu da ghi"
      - "Chup evidence/E14-sau-khi-keo.png va evidence/E14-tha-cot-rong.png"
    paths:
      - "apps/app/app/(app)/[slug]/deals/**"
      - "apps/api/src/deals/**"
      - "_acceptance/keo-tha-thoa-thuan/rang/man-bang-cot.mjs"
    expected: |
      Buoc keo cua E14 doc them API that sau khi tha: deals.byId tra stage cua cot 2 — frame
      nhin thay va ban ghi may chu cung mot cau tra loi.

  - id: E17
    criterion: AC-12
    executor: test
    cmd: config:executors.test.ktt_board_giu_nguyen
    paths:
      - "packages/ui/src/components/board.tsx"
      - "packages/ui/src/components/reui/**"
      - "packages/ui/test/board-giu-nguyen.dom.tsx"
    expected: |
      Board khong onMove: khong phan tu nao mang data-slot kanban-item-handle, the la <a href>
      voi dung href da truyen, so data-board-column bang so cot truyen vao; Board co onMove:
      co tay keo tren moi the. Hai ca cung fixture cot.
      CHIEU DO: Board luon boc Kanban trong ban sao -> do voi thong diep ghim
      "khong onMove: co tay keo".

  - id: E18
    criterion: AC-14
    executor: test
    cmd: config:executors.test.ktt_man_tai_loi
    paths:
      - "apps/app/app/(app)/[slug]/deals/**"
      - "apps/app/test/keo-tha-thoa-thuan.dom.tsx"
    expected: |
      Ba ca: dang tai -> o tim, bo loc, nut chuyen co mat va co dau dang tai; loi -> loi va nut
      «Thu lai» trong vung bang, bam thi deals.board goi lai 1 lan; co du lieu -> khong loi.
      CHIEU DO: bo o tim khoi thanh cong cu cua bang cot trong ban sao -> do voi thong diep ghim
      "dang tai: mat o tim" (da chay 2026-09-23).

  - id: E19
    criterion: AC-15
    executor: script
    cmd: config:executors.script.ktt_reui_da_chinh
    paths:
      - "packages/ui/src/components/reui/**"
      - "packages/ui/package.json"
      - "_acceptance/keo-tha-thoa-thuan/rang/reui-da-chinh.mjs"
    expected: |
      Quet MOI tep trong packages/ui/src/components/reui (ma tran = danh sach tep doc tu dia,
      in so tep). Moi tep: khong import tu "cn", khong import "lucide-react", khong co chu thich
      (// hay /* ngoai chuoi). package.json khong co khoa "cn". Thu muc rong -> ma 2 (khong duoc
      xanh vi khong co gi de quet).
      CHIEU DO: ban sao chen `import { cn } from "cn"` vao kanban.tsx -> do voi thong diep ghim
      "kanban.tsx: nhap tu goi cn".

  - id: E20
    criterion: AC-15
    executor: script
    cmd: config:executors.script.ktt_san_thiet_ke
    paths:
      - "apps/app/app/(app)/[slug]/deals/**"
      - "packages/ui/src/components/board.tsx"
      - "packages/ui/src/components/reui/**"
      - "_acceptance/keo-tha-thoa-thuan/rang/san-thiet-ke.mjs"
    expected: |
      Danh sach tep lay tu git diff --name-only <merge-base voi onehub>...HEAD giao voi cac glob
      .tsx cua paths (khong ghi dich danh), in so tep; danh sach rong -> ma 2. Chay cong thiet ke
      tinh tren tung tep, moi tep exit 0.
      CHIEU DO (da chay 2026-09-23): ban sao dat chu xam tren nen mau (bg-blue-600 text-gray-400)
      vao cot cua board.tsx -> do voi thong diep ghim "HONG packages/ui/src/components/board.tsx".
      GIOI HAN DA DO: cong tinh cua bo kit chi chan 5 luat P0 (tuong phan, xam tren nen mau, tran chu,
      anh hong, chu sat mep); mot mau hex chen vao TSX KHONG bi bat (da thu) — luat "chi primary va
      destructive duoc to nen" cua docs/design.md khong co thuoc may o vong nay, nguoi soi bang anh.

  - id: E21
    criterion: AC-4
    executor: test
    cmd: config:executors.test.ktt_man_loc_vao_board
    paths:
      - "apps/app/app/(app)/[slug]/deals/**"
      - "apps/app/test/keo-tha-thoa-thuan.dom.tsx"
    expected: |
      jsdom, spy vao input cua deals.board. Ma tran viet truoc 5 ca [q, owner, closing, fields,
      sort+dir] dat tren duong dan: moi ca khang dinh input co DUNG khoa va DUNG gia tri, va
      khong co khoa stage, status, page. Dem khang dinh = 5 + 1 (vang ba khoa) = 6.
      CHIEU DO: bo khoa owner khoi input -> do voi thong diep ghim "input board thieu owner".

  - id: E22
    criterion: AC-3
    executor: test
    cmd: config:executors.test.ktt_man_dau_cot
    paths:
      - "apps/app/app/(app)/[slug]/deals/**"
      - "packages/ui/src/components/board.tsx"
      - "apps/app/test/keo-tha-thoa-thuan.dom.tsx"
      - "apps/api/test/deals-board.spec.ts"
    expected: |
      Du lieu man lay tu tep dau ra ma bai kiem API cua E1/E2 ghi ra (round-trip tu writer that,
      khong viet tay so). Ma tran 7 cot x [chu so dem = count, chu tong = formatMoney(tong)] = 14,
      cong cot 53 thoa thuan co «+3 nua», cot 50 thoa thuan khong co dong do = 16 khang dinh.
      Sau khi setStage gia thanh cong tu cot A sang B: dau A giam 1, dau B tang 1 ma khong tai
      lai (2 khang dinh). Tong 18.
      CHIEU DO: dem bang so the thay count -> do voi thong diep ghim
      "cot QUALIFIED_TO_BUY: hien 50 != 53".
      Tep du lieu chi duoc ghi lai khi GHI_FIXTURE_BANG_COT=1 (khong lam ban cay moi lan test) va
      bai kiem man parse no qua dealBoardOutput cua API truoc khi dung.
      Vong 2 (S4-r1): cot co thoa thuan chua quy doi noi ra bang chuoi deals.meta.notCounted, cot co
      tong rong va 2 thoa thuan CHF khong in tong 0 (docs/currency.md: "disclosed not zeroed").
      CHIEU DO (da chay 2026-09-23): dau cot tro ve formatMoney(valueCents ?? 0) -> "cot DEMO_BOOKED:
      thieu loi bao chua quy doi".

  - id: E23
    criterion: AC-9
    executor: test
    cmd: config:executors.test.ktt_man_tro_nang
    paths:
      - "apps/app/app/(app)/[slug]/deals/**"
      - "apps/app/lib/messages/deals.ts"
      - "apps/app/test/keo-tha-thoa-thuan.dom.tsx"
    expected: |
      Ma tran viet truoc: moi the x 2 nut [ten thoa thuan, ten cong ty] mang translate="no";
      2 tieng [vi, en] x 3 loi bao [nhac, doi, tha] khop chuoi trong messages/deals.ts cua tieng
      do va hai tieng khac nhau = 6 khang dinh loi bao.
      Them: khong nut nao nam trong phan tu role="button" cua the (dem = 0 tren moi the), tay
      keo la phan tu nhan tieu diem ban phim.
      CHIEU DO: bo translate tren ten cong ty -> do voi thong diep ghim
      "the: ten cong ty thieu translate=no".
