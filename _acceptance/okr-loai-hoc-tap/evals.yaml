    expected: "exit 0; trên CSDL riêng của lượt: okr.createObjective kind hoc-tap → 200; db.okrObjective đọc lại kind «hoc-tap»; okr.objective trả kind «hoc-tap»; okr.danhSach của chu kỳ có bộ đếm loai mang khoá hoc-tap = 1. Đối chứng âm cùng fixture: kind «hoc tap» (sai mã) → 400, số okrObjective của chu kỳ không đổi. CHIỀU ĐỎ: bản sao LOAI_MUC_TIEU bỏ hoc-tap → bước tạo 400, bài in «tao hoc-tap bi tu choi»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-2
    executor: test
    cmd: config:executors.test.olht_tinh_trang
    paths: [packages/validation/src/okr-muc-tieu.ts, packages/validation/test/okr-loai-hoc-tap.spec.ts]
    expected: "exit 0; BẢNG VIẾT TRƯỚC 3 loại × 7 mức tỉ lệ (0, 0,49, 0,5, 0,69, 0,7, 0,85, 1 — tiến độ = mức × kỳ vọng 50) = 21 dòng, mỗi dòng gõ tay tình trạng kỳ vọng; bài khẳng định 21 dòng đã chạy, cột hoc-tap toEqual cột tham-vong từng dòng, và không dòng hoc-tap nào là «truot»; ca kyVong null và 0 cho hoc-tap → «chua-co-ky-vong». CHIỀU ĐỎ: bản sao tinhTrang giữ điều kiện loai === \"tham-vong\" → dòng hoc-tap × 0,49 đỏ với thông điệp ghim «hoc-tap ra truot o muc 0.49»."
