schema_version: 1
feature_slug: okr-loai-hoc-tap
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.olht_mot_nguon
    paths: [packages/validation/src/okr-muc-tieu.ts, packages/validation/src/okr-cuoc-soan.ts, apps/api/src/okr/okr.contracts.ts, packages/validation/test/okr-loai-hoc-tap.spec.ts]
    expected: "exit 0; bài khẳng định new Set(LOAI_MUC_TIEU) toEqual {cam-ket, tham-vong, hoc-tap} (tập viết tay), new Set(LOAI_MUC_TIEU_NHAP) toEqual cùng tập, và lấy tập giá trị từ schema thật của loaiMucTieu trong okr.contracts.ts (đọc .options của z.enum qua đúng đối tượng hợp đồng xuất ra, không chép) toEqual cùng tập. CHIỀU ĐỎ (rang/dot-bien.mjs): bản sao okr-cuoc-soan.ts khai lại mảng tay [\"cam-ket\", \"tham-vong\"] → bài đỏ với thông điệp ghim «LOAI_MUC_TIEU_NHAP lech LOAI_MUC_TIEU»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

