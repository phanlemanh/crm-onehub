      Cuoi luot DON bang conversations.remove KE CA KHI DO HONG; lenh don that bai la
      thoat ma 2. Sau khi don, chan trang thai cua ho so dot mot phai xanh tro lai —
      day la doi chung rang cay that su sach, khong phai loi khai cua chinh chan nay.
      Chieu do: bo tao pham dinh danh di thi moi chan man phai thoat ma 2, khong chan nao
      duoc tu gieo bu.
