  - id: E12
    criterion: AC-12
    executor: test
    cmd: config:executors.test.ssct_loai_tep
    paths: [apps/app/lib/tai-lieu-man.ts, packages/validation/src/tai-lieu-nguon.ts, "apps/app/app/(app)/[slug]/tai-lieu/hop-tai-nguon.tsx", apps/app/test/ssct-loai-tep.dom.tsx]
    expected: "exit 0; thuộc tính accept của ô chọn tệp toEqual chuỗi sinh từ KIEU_NGUON (import, không chép tay); quét mã: tai-lieu-man.ts không còn chuỗi '.docx' hay '.pdf' (đối chứng dương: chuỗi mẫu bị bắt). Bài dom hộp tải chọn tệp .txt → câu báo chứa tên mọi loại trong KIEU_NGUON."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E13
    criterion: AC-13
    executor: script
    cmd: config:executors.script.ssct_so_bo_mau
    paths: [_acceptance/sua-sau-chay-that/rang/**, _acceptance/sua-sau-chay-that/evidence/do-bo-mau.md, _acceptance/sua-sau-chay-that/evidence/cham-tung-cau.jsonl, _acceptance/bo-cau-hoi-mau/evidence/cham-tung-cau.jsonl, apps/agent/agent/subagents/tro_ly_kho/**, apps/agent/agent/lib/tai-lieu-*.ts, packages/validation/src/tai-lieu-hoi.ts]
    expected: "exit 0; so-bo-mau.ts không cờ, không gọi model: đọc evidence/cham-tung-cau.jsonl của lượt này (sinh ở S3 bằng do-bo-mau.ts --do với BCM_EVIDENCE trỏ thư mục hồ sơ) và của bo-cau-hoi-mau đã ký, bằng docBaoCao/khuôn của bo-cau-hoi-mau/rang (import, không chép); kiemBangChung của lượt này xanh, băm bo-mau khớp và băm mã trợ lý ghi trong evidence bằng băm tính trên HEAD (cùng hàm băm của do-bo-mau); in mỗi mã câu đạt ở lượt ký mà không đạt ở lượt này (trừ câu kết cục lỗi gọi model, in riêng) — danh sách lùi rỗng và số câu lỗi model không vượt số của lượt đã ký thì exit 0. CHIỀU ĐỎ trên bản sao trong thư mục tạm: đổi kết cục một câu đạt thành sai → exit 1, stdout ghim mã câu đó; đổi một câu thành lỗi model → exit 0, câu in ở mục lỗi model; đổi ba câu đạt thành lỗi model → exit 1, ghim ba mã; sửa một byte của một tệp trợ lý trong bản sao cây → exit 1, ghim tên tệp."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E14
    criterion: AC-2
    executor: ui-check
    layer: ui-observed
    cmd: config:executors.script.ssct_man
    steps:
      - "Canh cay; phien do rieng (tien-de.mjs qua mot-luot.sh); gieo qua duong ghi that: trang P co mot de xuat sua noi dung va mot de xuat luu tru cung cho; trang M co tieu de «Luong & thuong» va «A < B»; mot de xuat them cot bang; dang nhap dev:session thanh vien"
      - "Buoc 1 (1440): man doc P -> «Co 1 ban cho duyet», nut «Xem ban cho» tro de xuat sua noi dung -> anh ssct-doc-cho-1440.png"
      - "Buoc 2 (1440): man doc M -> muc luc hien dung hai tieu de, bam muc luc «A < B» -> cuon toi dung id -> anh ssct-muc-luc-1440.png"
      - "Buoc 3 (1440): man duyet de xuat them cot -> hai bang rieng -> anh ssct-bang-doi-cot-1440.png"
      - "Buoc 4 (1440): man sua trang -> nhap lien ket http://a.vn -> cau «Chỉ nhận liên kết https», khong tao lien ket -> anh ssct-soan-http-1440.png"
      - "Buoc 5 (1440): danh sach -> «Tải nguồn lên» -> chon tep .txt -> cau sai loai neu Word va PDF -> anh ssct-tai-sai-loai-1440.png"
    paths: ["apps/app/app/(app)/[slug]/tai-lieu/**", packages/ui/src/components/**, _acceptance/sua-sau-chay-that/rang/**]
    expected: "exit 0; man.mjs in 'buoc N: dat' cho 5 buoc; chu doc tu DOM bang innerText. CHIEU DO: --chieu-do tren ban sao bo loc loai o [trang]/page.tsx -> 'buoc 1: dem ban cho sai', ma 1."
    evidence_required: [run_id, exit_code, verifier, verified_at, output, screenshot]
