schema_version: 1
feature_slug: sua-sau-chay-that
evals:
  - id: E1
    criterion: AC-1
    executor: test
    layer: backend-effect
    cmd: config:executors.test.ssct_nguon
    paths: [apps/api/src/tai-lieu/**, apps/api/test/ssct-nguon.spec.ts, apps/api/test/tai-lieu-san.ts]
    expected: "exit 0; Postgres _test thật, gieo qua đường ghi thật (create, approve, deXuatLuuTru + approve). Ma trận VIẾT TRƯỚC ba dòng gọi đường nhận nguồn cập nhật của API (thủ tục nhận nguồn của taiLieuNguon) với đích: trang A đã lưu trữ → BAD_REQUEST chuỗi daLuuTru · trang B chưa từng duyệt do người khác tạo, gọi bởi thành viên không thấy B → NOT_FOUND cùng mã và câu với taiLieu.get(B) · trang C đang dùng → nhận (đối chứng dương). Mỗi dòng từ chối: đếm hàng taiLieuNguon và taiLieuDeXuat trước/sau bằng nhau. Số ca = 3, đúng bằng số dòng bảng."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E1b
    criterion: AC-1
    executor: test
    layer: backend-effect
    cmd: config:executors.test.ssct_nop_luu_tru
    paths: [apps/agent/agent/lib/tai-lieu-nop.ts, apps/agent/test/ssct-nop-luu-tru.spec.ts]
    expected: "exit 0; Postgres _test thật. Gieo nguồn DANG_SOAN cho trang đang dùng P (đường ghi thật của API), rồi lưu trữ P qua deXuatLuuTru + approve; gọi nopBanDeXuat (hàm thật của tai-lieu-nop.ts) với một bản hợp lệ → nguồn trangThai LOI, lyDo chứa chữ «lưu trữ», số taiLieuDeXuat của P không đổi. CHIỀU ĐỎ cùng fixture: trang Q y hệt nhưng chưa lưu trữ → nopBanDeXuat tạo đúng một đề xuất (thước phân biệt được hai trạng thái trang, không hằng đúng)."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.ssct_doc_cho
    paths: ["apps/app/app/(app)/[slug]/tai-lieu/[trang]/**", apps/app/lib/tai-lieu-cho.ts, apps/app/test/ssct-doc-cho.dom.tsx]
    expected: "exit 0; hàm lọc bản chờ của trang (apps/app/lib) trên bảng VIẾT TRƯỚC bốn dòng đề xuất {NOI_DUNG chờ, LUU_TRU chờ, KHOI_PHUC chờ, NOI_DUNG chờ nhưng cu} của cùng trang và một NOI_DUNG chờ của trang khác → toEqual [id NOI_DUNG chờ chưa cũ của đúng trang]; bảng chỉ LUU_TRU chờ → []. Bài dom ManDoc với hai dữ liệu đó: ca đầu «Có 1 bản chờ duyệt» và href nút «Xem bản chờ» là /ws/tai-lieu/de-xuat/<id NOI_DUNG>; ca sau không có huy hiệu số và không có nút. CHIỀU ĐỎ: bản sao bộ lọc bỏ điều kiện loai → ca sau ra một phần tử, bài ghim tên ca."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.ssct_doc_cho
    paths: ["apps/app/app/(app)/[slug]/tai-lieu/[trang]/**", apps/app/lib/messages/tai-lieu.ts, apps/app/test/ssct-doc-cho.dom.tsx]
    expected: "exit 0; bài dom ManDoc nhận cờ lỗi tải bản chờ: thấy câu «Chưa tải được bản chờ duyệt» (chữ rút từ taiLieuMessages('vi')) và nút «Thử lại»; không có phần tử data-co-ban-cho nào; bấm «Thử lại» gọi router.refresh đúng một lần (đếm). Đối chứng: cùng trang không có cờ lỗi → không có câu lỗi."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: test
    layer: backend-effect
    cmd: config:executors.test.ssct_quay_lai
    paths: [apps/api/src/tai-lieu/tai-lieu-lich-su.service.ts, apps/api/test/ssct-quay-lai.spec.ts]
    expected: "exit 0; Postgres _test thật. Trang T: v1 tên «Quy định cũ» nội dung X; v2 tên «Quy định mới» nội dung X (đổi tên qua propose có ten, duyệt thật). quayLai(T,1) → đúng một đề xuất mới NOI_DUNG, ten «Quy định cũ», tuPhienBanSo 1, một sự kiện DE_XUAT. Trang U: v1 và v2 trùng cả tên lẫn nội dung không tạo được — dùng bản đang dùng: quayLai(U, số bản đang dùng) → CONFLICT chuaDoi, đếm hàng trước/sau bằng nhau. CHIỀU ĐỎ: bảng hai ca viết trước, khẳng định mã trả về khác nhau giữa T và U."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.ssct_muc_luc
    paths: [packages/ui/src/components/markdown-reader.tsx, packages/ui/test/ssct-muc-luc.dom.tsx]
    expected: "exit 0; markdown nguồn sinh bằng bộ tuần tự hoá thật của trình soạn (tuanTuHoa của @crm/validation/tai-lieu-markdown hoặc trình soạn tiptap thật) cho ba tiêu đề «Lương & thưởng», «A < B», «Mục *quan trọng*» — không viết tay chuỗi đã thoát. readerHeadings trả text toEqual ba chữ đó; render MarkdownReader cùng nguồn: tập id các thẻ h2/h3 toEqual tập id mục lục. CHIỀU ĐỎ: bản sao readerHeadings đời cũ (regex trên chữ thô, dựng trong bài) cho text chứa '&amp;' hoặc '\\' và id lệch — bài ghim tên tiêu đề lệch."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.ssct_lien_ket
    paths: [packages/ui/src/components/markdown-reader.tsx, packages/ui/src/components/trinh-soan-thanh-cong-cu.tsx, packages/ui/src/lib/dan-tu-van-phong.ts, packages/ui/src/lib/lien-ket-an-toan.ts, packages/ui/test/ssct-lien-ket.dom.tsx]
    expected: "exit 0; ma trận VIẾT TRƯỚC năm đích {http://a.vn, https://a.vn, mailto:x@a.vn, /ws/tai-lieu/t, javascript:alert(1)} × ba nơi {trình đọc, ô liên kết trình soạn, bộ lọc dán} → bảng nhận/bỏ toEqual nhau ở cả ba nơi (http và javascript bỏ, ba đích còn lại nhận). Trình soạn với http hiện câu «Chỉ nhận liên kết https» (rút từ messages) và không tạo mark link. Bộ lọc dán đoạn HTML có hai <a href='http://…'> → chữ còn, không có link, và hiện dòng báo chứa số 2 (chữ rút từ messages); dán đoạn chỉ có https → không có dòng báo (đối chứng). CHIỀU ĐỎ: quét mã cấm regex giao thức riêng trong ba tệp (đối chứng dương: chuỗi mẫu '/^(https?:' bị bắt)."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-7
    executor: test
    cmd: config:executors.test.ssct_chon_loi
    paths: ["apps/app/app/(app)/[slug]/tai-lieu/**", apps/app/test/ssct-chon-loi.dom.tsx]
    expected: "exit 0; hàm lua-chon-trang với nguồn thành viên ném lỗi → trả cờ lỗi (không phải mảng rỗng im lặng); bài dom form trang mới và hộp tải nguồn nhận cờ đó → thấy câu «Chưa tải được danh sách thành viên» và nút «Thử lại»; đối chứng: danh sách thật rỗng không lỗi → không có câu lỗi. Hai nơi = hai ca, đúng số dòng bảng."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E8
    criterion: AC-8
    executor: test
    cmd: config:executors.test.ssct_tim_nhanh
    paths: [apps/app/components/crm/quick-switcher.tsx, apps/app/test/ssct-tim-nhanh-loi.dom.tsx]
    expected: "exit 0; bài dom hộp tìm nhanh, truy vấn CRM ném lỗi, truy vấn Tài liệu trả một trang → thấy dòng báo nhóm CRM chưa tìm được (chữ rút từ messages) và trang đó; không có chữ «Không có gì khớp». CHIỀU ĐỎ: cả hai truy vấn thành công và rỗng → có «Không có gì khớp», không có dòng lỗi (thước phân biệt lỗi với rỗng)."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E9
    criterion: AC-9
    executor: test
    cmd: config:executors.test.ssct_hoi_en
    paths: ["apps/app/app/(app)/[slug]/tai-lieu/hoi-tra-loi.tsx", apps/app/lib/messages/tai-lieu.ts, packages/validation/src/tai-lieu-hoi.ts, apps/app/test/ssct-hoi-en.dom.tsx]
    expected: "exit 0; bài dom màn Hỏi, ma trận VIẾT TRƯỚC ba tình huống {từ chối, lỗi, quá hạn} × hai ngôn ngữ {en, vi}: mỗi ô khẳng định chữ hiện toEqual taiLieuMessages(<ngôn ngữ>) của khoá tương ứng; ô en không chứa ký tự tiếng Việt có dấu (regex /[à-ỹđ]/i). 6 khẳng định = 6 ô. Đối chứng: câu gửi qua Zalo (hàm của tai-lieu-hoi dùng cho Zalo) vẫn bằng tiếng Việt."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E9b
    criterion: AC-9
    executor: test
    layer: backend-effect
    cmd: config:executors.test.ssct_hoi_ma
    paths: [apps/api/src/tai-lieu/**, packages/db/src/tai-lieu-hoi.ts, apps/agent/agent/lib/tai-lieu-hoi*.ts, apps/api/test/ssct-hoi-ma.spec.ts]
    expected: "exit 0; Postgres _test thật. Ba câu hỏi đưa qua đường ghi thật tới ba trạng thái {TU_CHOI, LOI (lý do loi-model), QUA_HAN}; đọc lại qua thủ tục API mà màn Hỏi gọi → mỗi bản ghi trả trangThai thuộc enum và lyDo là mã thuộc khuôn lý do (parse bằng khuôn của @crm/validation/tai-lieu-hoi), không trường nào chứa câu chữ cố định của TAI_LIEU_HOI (so từng chuỗi). Bài dom E9 dựng dữ liệu từ đúng đầu ra này. CHIỀU ĐỎ: bản sao một hàng có lyDo là câu tiếng Việt → khuôn từ chối, bài ghim tên tình huống."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E10
    criterion: AC-10
    executor: test
    cmd: config:executors.test.ssct_bang_doi_cot
    paths: [packages/validation/src/tai-lieu-diff.ts, packages/ui/src/components/diff-trang.tsx, packages/ui/test/ssct-bang-doi-cot.dom.tsx]
    expected: "exit 0; hai ca VIẾT TRƯỚC (thêm một cột, bớt một cột) với markdown bảng 3 hàng; soSanh thật rồi render DiffTrang: đúng hai phần tử table; bảng một mọi ô là del, hàng tiêu đề thead là tiêu đề cũ; bảng hai mọi ô là ins, thead là tiêu đề mới; không có hàng tbody nào bằng tiêu đề mới hay cũ. Đối chứng: ca cùng số cột chỉ đổi một ô → vẫn một bảng (hành vi 2bc61eaed giữ nguyên)."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E11
    criterion: AC-11
    executor: test
    cmd: config:executors.test.ssct_duyet_may_cu
    paths: ["apps/app/app/(app)/[slug]/tai-lieu/de-xuat/[id]/**", apps/app/lib/messages/tai-lieu.ts, apps/app/test/ssct-duyet-may-cu.dom.tsx]
    expected: "exit 0; bài dom ManDuyet với bản máy soạn (may có coBanGoc) đã đọc xong: cu=true → tiêu đề thẻ so sánh toEqual nhãn «So với bản gốc lúc máy soạn» của messages; cu=false → nhãn soVoiBan cũ (đối chứng). Hai ca."
