evals:
  - id: E1
    criterion: AC-1
    cau_hoi: Bảng dùng chung hiện chữ tiếng Việt cho mọi chuỗi nó tự chứa?
    cach_do: >-
      Bài kiểm dựng component: vẽ DataTable trong nhà cung cấp tiếng Việt, rồi
      khẳng định từng chuỗi của bảng dịch xuất hiện trong cây đã vẽ. Menu thả
      xuống mở bằng sự kiện của thư viện kiểm, không bằng trình duyệt — vòng ①
      đã chứng minh Chrome không giao diện không mở được nó.
    chieu_do: >-
      Trả một khoá của bảng dịch về chuỗi tiếng Anh. Bài kiểm phải đỏ và gọi tên
      đúng khoá đó.
    lenh: bun run test --filter=@crm/ui
    executor: script
    cmd: config:executors.script.bdc_bo_dung_ui
    paths:
      - "packages/ui/**"
      - "_acceptance/bo-dung-chung-nhan-chuoi/rang-goc-ngon-ngu.sh"
    expected: |
      Ma 0. Khuon may cua phep do da ky 2026-09-01 (cau_hoi / cach_do / chieu_do o tren
      giu nguyen van; lenh cu = lenh cua khoa bdc_bo_dung_ui). Chieu do theo chieu_do cua
      chinh eval nay, da chay o vong cham 1-4 ngay 2026-09-01 (evidence-report.md).
      Chuyen khuon 2026-09-23 (ho so tieu-de-cot-doc-tron, nguoi chon mo lai): lenh cu chay
      nguyen van o dinh ed30103e — ma 0.

