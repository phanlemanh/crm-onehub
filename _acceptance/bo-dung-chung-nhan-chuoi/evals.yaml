  - id: E5
    criterion: AC-5
    cau_hoi: Còn chuỗi tiếng Anh khoá cứng nào trong bộ dựng chung không?
    cach_do: >-
      Dựng THẬT từng component hai lần — một lần tiếng Anh, một lần tiếng Việt —
      trong jsdom, mở cả ba menu thả xuống của bảng, rồi lấy chữ trong thẻ cùng
      chín thuộc tính trình đọc màn hình đọc lên. Chữ nào giống hệt ở cả hai bản
      vẽ mà không có tên trong danh sách trung tính thì nó chưa được dịch.
    chieu_do: >-
      Là chính E6. Phép đo không đọc mã, nên không có lối lách cú pháp nào.
    lenh: cd packages/ui && bun run test
    executor: script
