  - id: E10
    criterion: AC-10
    cau_hoi: Chữ đọc như tiếng Việt của người trong nghề?
    cach_do: >-
      Hội đồng phán chấm đúng bảng dịch đã chốt trong
      `ban-dich.md` TRƯỚC khi chấm. Không chấm chữ chưa ai khai.
    chieu_do: >-
      Không có chiều máy. Đây là tiêu chí phán xét, và bảng dịch phải nằm trong
      hồ sơ trước lúc chấm để hội đồng không bắn vào bia đang chạy.
    lenh: null
    executor: judgment
    inputs:
      - _acceptance/bo-dung-chung-nhan-chuoi/ban-dich.md
      - packages/ui/src/lib/messages.ts
    paths:
      - "packages/ui/src/lib/messages.ts"
      - "_acceptance/bo-dung-chung-nhan-chuoi/ban-dich.md"
    expected: |
      Hoi dong phan cham DUNG bang dich da chot trong ban-dich.md (sinh tu
      packages/ui/src/lib/messages.ts): chu doc nhu tieng Viet cua nhan vien quan he doi
      tac, khong chu nao phai di hoi moi hieu. Chu chua co trong bang thi khong cham.
      Da nhan o vong cham 4 ngay 2026-09-01 sau khi sua ba dong hoi dong neu.

