<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thước đã ký bấm mở dòng</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #fafafa;
      --color-ink:    #171717;
      --color-muted:  #575757;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Lora', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1480px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.25; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sơ đồ luồng · Hỏi-1 · Cổng Phạm vi</p>
    <h1>Thước đã ký chạm bảng đơn vị: có cho đổi ba lớp không?</h1>

    <svg viewBox="0 0 1480 468" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mở sẵn KR đảo nghĩa nút mở dòng, chạm khoảng 24 thước đã ký ở ba lớp (bước mở, bố cục, một khẳng định bàn phím); rẽ hai nhánh: cho đổi thì sửa từng hồ sơ và đo hai chiều, không cho thì bỏ mở sẵn hoặc để các hồ sơ ấy đỏ.">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#575757"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#006B4F"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#fafafa"/>

      <!-- Connectors (behind nodes) -->
      <g fill="none" stroke="#575757" stroke-width="1.2">
        <line x1="200" y1="100" x2="240" y2="100" marker-end="url(#arrow)"/>
        <line x1="400" y1="100" x2="440" y2="100" marker-end="url(#arrow)"/>
        <line x1="600" y1="100" x2="640" y2="100" marker-end="url(#arrow)"/>
        <line x1="1000" y1="100" x2="1040" y2="100" marker-end="url(#arrow)"/>
        <line x1="1220" y1="100" x2="1260" y2="100" marker-end="url(#arrow)"/>
        <path d="M700 148 V228 Q700 236 708 236 H756"/>
        <line x1="764" y1="236" x2="820" y2="236" marker-end="url(#arrow)"/>
        <path d="M760 240 V328 Q760 336 768 336 H820" marker-end="url(#arrow)"/>
      </g>
      <line x1="760" y1="100" x2="820" y2="100" stroke="#006B4F" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <circle cx="760" cy="236" r="4" fill="#171717"/>

      <!-- Connector labels -->
      <rect x="762" y="76" width="28" height="16" rx="2" fill="#fafafa"/>
      <text x="776" y="88" fill="#006B4F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CHO</text>
      <rect x="708" y="176" width="68" height="16" rx="2" fill="#fafafa"/>
      <text x="742" y="188" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KHÔNG CHO</text>

      <!-- Trunk: 3 sequential steps -->
      <rect x="40" y="64" width="160" height="72" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="120" y="92" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bảng trang đơn vị</text>
      <text x="120" y="108" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">mở sẵn KR</text>
      <text x="120" y="124" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AC-4</text>

      <rect x="240" y="64" width="160" height="72" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="320" y="96" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Nút mở dòng nay</text>
      <text x="320" y="112" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">đảo nghĩa: bấm = gập</text>

      <rect x="440" y="64" width="160" height="72" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="520" y="96" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">~24 thước đã ký: bấm mở,</text>
      <text x="520" y="112" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">bố cục, 1 phím đảo</text>

      <!-- Decision -->
      <polygon points="700,52 760,100 700,148 640,100" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="700" y="98" fill="#171717" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chủ kho cho</text>
      <text x="700" y="112" fill="#171717" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">đổi không?</text>

      <!-- Branch A: machine advises -->
      <rect x="820" y="64" width="180" height="72" rx="6" fill="rgba(0,107,79,0.08)" stroke="#006B4F" stroke-width="1.4"/>
      <text x="910" y="92" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chủ kho cho đổi đúng</text>
      <text x="910" y="108" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ba lớp ấy</text>
      <text x="910" y="124" fill="#006B4F" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">MÁY KHUYÊN</text>

      <rect x="1040" y="64" width="180" height="72" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="1130" y="92" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mỗi hồ sơ một dòng fix</text>
      <text x="1130" y="108" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">đo hai chiều</text>
      <text x="1130" y="124" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">decided_by: chủ kho</text>

      <rect x="1260" y="64" width="180" height="72" rx="36" fill="rgba(23,23,23,0.03)" stroke="rgba(23,23,23,0.30)" stroke-width="1"/>
      <text x="1350" y="96" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Không xấu hơn nền</text>
      <text x="1350" y="112" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AC-9</text>

      <!-- Branch B: refused -->
      <rect x="820" y="200" width="180" height="72" rx="36" fill="rgba(23,23,23,0.03)" stroke="rgba(23,23,23,0.30)" stroke-width="1"/>
      <text x="910" y="226" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bỏ mở sẵn mặc định</text>
      <text x="910" y="242" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">không đạt «mọi KR</text>
      <text x="910" y="258" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">đã mở sẵn»</text>

      <rect x="820" y="300" width="180" height="72" rx="36" fill="rgba(23,23,23,0.03)" stroke="rgba(23,23,23,0.30)" stroke-width="1"/>
      <text x="910" y="326" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Giữ mở sẵn</text>
      <text x="910" y="342" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">các hồ sơ ấy đỏ</text>
      <text x="910" y="358" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">trên cây vòng</text>

      <!-- Legend -->
      <line x1="40" y1="404" x2="1440" y2="404" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>
      <text x="40" y="424" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI · HÌNH DÁNG CHỈ LOẠI NÚT</text>

      <rect x="40" y="436" width="24" height="12" rx="2" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="72" y="446" fill="#575757" font-size="9" font-family="'Geist', sans-serif">Bước</text>

      <polygon points="168,442 180,436 192,442 180,448" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="200" y="446" fill="#575757" font-size="9" font-family="'Geist', sans-serif">Quyết định</text>

      <rect x="304" y="436" width="24" height="12" rx="6" fill="rgba(23,23,23,0.03)" stroke="rgba(23,23,23,0.30)" stroke-width="1"/>
      <text x="336" y="446" fill="#575757" font-size="9" font-family="'Geist', sans-serif">Kết cục</text>

      <line x1="440" y1="442" x2="468" y2="442" stroke="#006B4F" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="476" y="446" fill="#575757" font-size="9" font-family="'Geist', sans-serif">Đường máy khuyên</text>
    </svg>
  </div>
</body>
</html>
