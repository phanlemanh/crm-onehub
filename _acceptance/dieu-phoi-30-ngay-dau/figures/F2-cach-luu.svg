<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 896" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#575757"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#006B4F"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#fafafa"/>

      <text x="40" y="44" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">ĐIỂM QUYẾT ĐỊNH 2 · BƯỚC LẤY TỪ KHUÔN THẾ NÀO · 2 NHÁNH</text>

      <path d="M 500 140 L 500 164 A 8 8 0 0 1 492 172 L 268 172 A 8 8 0 0 0 260 180 L 260 204" fill="none" stroke="#575757" stroke-width="1" marker-end="url(#arrow)"/>

      <path d="M 500 172 L 732 172 A 8 8 0 0 1 740 180 L 740 204" fill="none" stroke="#575757" stroke-width="1" marker-end="url(#arrow)"/>

      <rect x="280" y="56" width="440" height="84" rx="6" fill="#fafafa"/>
      <rect x="280" y="56" width="440" height="84" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <rect x="292" y="68" width="60" height="16" rx="2" fill="transparent" stroke="rgba(23,23,23,0.40)" stroke-width="0.8"/>
      <text x="322" y="79" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CÂU HỎI</text>
      <text data-mx="708" x="292" y="108" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Người sửa nhãn một bước TRONG KHUÔN —</text>
      <text data-mx="708" x="292" y="124" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif">kế hoạch đang chạy có đổi theo không?</text>

      <rect x="40" y="204" width="440" height="188" rx="6" fill="#fafafa"/>
      <rect x="40" y="204" width="440" height="188" rx="6" fill="rgba(0,107,79,0.08)" stroke="#006B4F" stroke-width="1.4"/>
      <rect x="52" y="216" width="60" height="16" rx="2" fill="#006B4F"/>
      <text x="82" y="227" fill="#fafafa" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ĐÃ CHỌN</text>
      <text data-mx="468" x="52" y="256" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Bước được CHÉP từ khuôn lúc tạo kế hoạch</text>
      <text data-mx="468" x="52" y="271" fill="#575757" font-size="9" font-family="'Geist Mono', monospace">khuôn → bản sao bước, không còn dây nối về khuôn</text>
      <line x1="52" y1="280" x2="468" y2="280" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>
      <text x="52" y="296" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">NẾU CHỌN</text>
      <text data-mx="468" x="52" y="311" fill="#575757" font-size="10" font-family="'Geist', sans-serif">Kế hoạch đang chạy giữ nguyên nhãn cũ: người đã làm việc theo</text>
      <text data-mx="468" x="52" y="325" fill="#575757" font-size="10" font-family="'Geist', sans-serif">bản cũ thì không bị đổi đề bài giữa đường. Đây là thứ AC-1 đo.</text>
      <line x1="52" y1="332" x2="468" y2="332" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>
      <text x="52" y="348" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ĐỔI LẠI</text>
      <text data-mx="468" x="52" y="363" fill="#575757" font-size="10" font-family="'Geist', sans-serif">Sửa một lỗi chính tả trong khuôn không lan tới kế hoạch nào</text>
      <text data-mx="468" x="52" y="377" fill="#575757" font-size="10" font-family="'Geist', sans-serif">đang chạy — phải sửa tay từng kế hoạch, hoặc để nó vênh.</text>

      <rect x="520" y="204" width="440" height="188" rx="6" fill="#fafafa"/>
      <rect x="520" y="204" width="440" height="188" rx="6" fill="rgba(23,23,23,0.05)" stroke="#575757" stroke-width="0.8"/>
      <rect x="532" y="216" width="80" height="16" rx="2" fill="transparent" stroke="rgba(23,23,23,0.40)" stroke-width="0.8"/>
      <text x="572" y="227" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">KHÔNG CHỌN</text>
      <text data-mx="948" x="532" y="256" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Bước THAM CHIẾU tới khuôn, đọc nhãn lúc hiện ra</text>
      <text data-mx="948" x="532" y="271" fill="#575757" font-size="9" font-family="'Geist Mono', monospace">bước giữ khoá trỏ về bước của khuôn</text>
      <line x1="532" y1="280" x2="948" y2="280" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>
      <text x="532" y="296" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">NẾU CHỌN</text>
      <text data-mx="948" x="532" y="311" fill="#575757" font-size="10" font-family="'Geist', sans-serif">Sửa nhãn một lần là mọi kế hoạch đổi theo, kể cả kế hoạch</text>
      <text data-mx="948" x="532" y="325" fill="#575757" font-size="10" font-family="'Geist', sans-serif">đang chạy — không ai phải đi sửa lại chỗ nào.</text>
      <line x1="532" y1="332" x2="948" y2="332" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>
      <text x="532" y="348" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ĐỔI LẠI</text>
      <text data-mx="948" x="532" y="363" fill="#575757" font-size="10" font-family="'Geist', sans-serif">Đổi khuôn tháng sau làm đổi cả việc người đang làm dở; và xoá</text>
      <text data-mx="948" x="532" y="377" fill="#575757" font-size="10" font-family="'Geist', sans-serif">một bước khỏi khuôn thì kế hoạch cũ hụt bước, không ai biết vì sao.</text>

      <line x1="32" y1="428" x2="968" y2="428" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>

      <text x="40" y="452" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">ĐIỂM QUYẾT ĐỊNH 3 · BỐN BẬC CỦA MÔI GIỚI LƯU BẰNG GÌ · 2 NHÁNH</text>

      <path d="M 500 548 L 500 572 A 8 8 0 0 1 492 580 L 268 580 A 8 8 0 0 0 260 588 L 260 612" fill="none" stroke="#575757" stroke-width="1" marker-end="url(#arrow)"/>

      <path d="M 500 580 L 732 580 A 8 8 0 0 1 740 588 L 740 612" fill="none" stroke="#575757" stroke-width="1" marker-end="url(#arrow)"/>

      <rect x="280" y="464" width="440" height="84" rx="6" fill="#fafafa"/>
      <rect x="280" y="464" width="440" height="84" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <rect x="292" y="476" width="60" height="16" rx="2" fill="transparent" stroke="rgba(23,23,23,0.40)" stroke-width="0.8"/>
      <text x="322" y="487" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CÂU HỎI</text>
      <text data-mx="708" x="292" y="516" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Một bậc của môi giới đã đạt —</text>
      <text data-mx="708" x="292" y="532" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif">sản phẩm ghi lại bằng cái gì?</text>

      <rect x="40" y="612" width="440" height="188" rx="6" fill="#fafafa"/>
      <rect x="40" y="612" width="440" height="188" rx="6" fill="rgba(0,107,79,0.08)" stroke="#006B4F" stroke-width="1.4"/>
      <rect x="52" y="624" width="60" height="16" rx="2" fill="#006B4F"/>
      <text x="82" y="635" fill="#fafafa" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ĐÃ CHỌN</text>
      <text data-mx="468" x="52" y="664" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Lưu một MỐC NGÀY cho từng bậc</text>
      <text data-mx="468" x="52" y="679" fill="#575757" font-size="9" font-family="'Geist Mono', monospace">mốc rỗng = chưa đạt · mốc có = đạt lúc đó</text>
      <line x1="52" y1="688" x2="468" y2="688" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>
      <text x="52" y="704" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">NẾU CHỌN</text>
      <text data-mx="468" x="52" y="719" fill="#575757" font-size="10" font-family="'Geist', sans-serif">Trả lời được cả «khi nào» và «cách bậc trước bao lâu», không chỉ</text>
      <text data-mx="468" x="52" y="733" fill="#575757" font-size="10" font-family="'Geist', sans-serif">«đã chưa» — rỗng hay không rỗng vẫn trả lời được câu cũ. AC-4 đo đúng chỗ này.</text>
      <line x1="52" y1="740" x2="468" y2="740" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>
      <text x="52" y="756" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ĐỔI LẠI</text>
      <text data-mx="468" x="52" y="771" fill="#575757" font-size="10" font-family="'Geist', sans-serif">Mỗi chỗ đọc phải tự đổi mốc thành đã/chưa; và một mốc gõ sai ngày</text>
      <text data-mx="468" x="52" y="785" fill="#575757" font-size="10" font-family="'Geist', sans-serif">vẫn đọc ra là «đã đạt», sản phẩm không cản được.</text>

      <rect x="520" y="612" width="440" height="188" rx="6" fill="#fafafa"/>
      <rect x="520" y="612" width="440" height="188" rx="6" fill="rgba(23,23,23,0.05)" stroke="#575757" stroke-width="0.8"/>
      <rect x="532" y="624" width="80" height="16" rx="2" fill="transparent" stroke="rgba(23,23,23,0.40)" stroke-width="0.8"/>
      <text x="572" y="635" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">KHÔNG CHỌN</text>
      <text data-mx="948" x="532" y="664" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Lưu một cờ đúng/sai cho từng bậc</text>
      <text data-mx="948" x="532" y="679" fill="#575757" font-size="9" font-family="'Geist Mono', monospace">cờ đúng = đạt · cờ sai = chưa đạt</text>
      <line x1="532" y1="688" x2="948" y2="688" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>
      <text x="532" y="704" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">NẾU CHỌN</text>
      <text data-mx="948" x="532" y="719" fill="#575757" font-size="10" font-family="'Geist', sans-serif">Đọc và lọc đơn giản nhất: đúng là xong, sai là chưa. Không có ngày</text>
      <text data-mx="948" x="532" y="733" fill="#575757" font-size="10" font-family="'Geist', sans-serif">nào để gõ sai, không ai phải chọn múi giờ.</text>
      <line x1="532" y1="740" x2="948" y2="740" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>
      <text x="532" y="756" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ĐỔI LẠI</text>
      <text data-mx="948" x="532" y="771" fill="#575757" font-size="10" font-family="'Geist', sans-serif">Mất luôn «khi nào» và «cách bậc trước bao lâu» — muốn có lại thì</text>
      <text data-mx="948" x="532" y="785" fill="#575757" font-size="10" font-family="'Geist', sans-serif">phải đổi cột và chuyển dữ liệu đã ghi, lúc đó không còn miễn phí.</text>

      <line x1="32" y1="836" x2="968" y2="836" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>
      <text x="32" y="852" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>
      <rect x="32" y="864" width="14" height="10" rx="2" fill="rgba(0,107,79,0.08)" stroke="#006B4F" stroke-width="1.4"/>
      <text x="52" y="873" fill="#575757" font-size="9" font-family="'Geist', sans-serif">Nhánh đã chọn</text>
      <rect x="196" y="864" width="14" height="10" rx="2" fill="rgba(23,23,23,0.05)" stroke="#575757" stroke-width="0.8"/>
      <text x="216" y="873" fill="#575757" font-size="9" font-family="'Geist', sans-serif">Nhánh không chọn</text>
      <rect x="360" y="864" width="14" height="10" rx="2" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="380" y="873" fill="#575757" font-size="9" font-family="'Geist', sans-serif">Câu hỏi của điểm quyết định</text>
      <text x="544" y="873" fill="#575757" font-size="9" font-family="'Geist', sans-serif" font-style="italic">Hai điểm quyết định rời nhau, cùng một câu hỏi nền: sự thật nằm ở đâu và ai đổi được nó.</text>
    </svg>
