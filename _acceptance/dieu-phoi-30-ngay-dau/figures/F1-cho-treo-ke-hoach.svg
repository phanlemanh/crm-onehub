<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 528" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#575757"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#006B4F"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#fafafa"/>

      <text x="40" y="44" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">ĐIỂM QUYẾT ĐỊNH 1 · 3 NHÁNH</text>

      <path d="M 500 140 L 500 170 A 8 8 0 0 1 492 178 L 192 178 A 8 8 0 0 0 184 186 L 184 216" fill="none" stroke="#575757" stroke-width="1" marker-end="url(#arrow)"/>

      <path d="M 500 178 L 500 216" fill="none" stroke="#575757" stroke-width="1" marker-end="url(#arrow)"/>

      <path d="M 500 178 L 808 178 A 8 8 0 0 1 816 186 L 816 216" fill="none" stroke="#575757" stroke-width="1" marker-end="url(#arrow)"/>

      <rect x="340" y="56" width="320" height="84" rx="6" fill="#fafafa"/>
      <rect x="340" y="56" width="320" height="84" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <rect x="352" y="68" width="60" height="16" rx="2" fill="transparent" stroke="rgba(23,23,23,0.40)" stroke-width="0.8"/>
      <text x="382" y="79" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CÂU HỎI</text>
      <text data-mx="648" x="352" y="108" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Kế hoạch 30 ngày treo vào cái gì,</text>
      <text data-mx="648" x="352" y="124" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif">và cái gì bấm đồng hồ?</text>

      <rect x="40" y="216" width="288" height="216" rx="6" fill="#fafafa"/>
      <rect x="40" y="216" width="288" height="216" rx="6" fill="rgba(23,23,23,0.05)" stroke="#575757" stroke-width="0.8"/>
      <rect x="52" y="228" width="80" height="16" rx="2" fill="transparent" stroke="rgba(23,23,23,0.40)" stroke-width="0.8"/>
      <text x="92" y="239" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">KHÔNG CHỌN</text>
      <text data-mx="316" x="52" y="268" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Mỗi công ty chỉ một bản kế hoạch</text>
      <text data-mx="316" x="52" y="283" fill="#575757" font-size="9" font-family="'Geist Mono', monospace">một hàng kế hoạch cho mỗi công ty</text>
      <line x1="52" y1="292" x2="316" y2="292" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>
      <text x="52" y="308" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">NẾU CHỌN</text>
      <text data-mx="316" x="52" y="323" fill="#575757" font-size="10" font-family="'Geist', sans-serif">Màn nào cũng khỏi hỏi «lượt nào»; một</text>
      <text data-mx="316" x="52" y="337" fill="#575757" font-size="10" font-family="'Geist', sans-serif">đối tác là một dòng, gọn nhất.</text>
      <line x1="52" y1="344" x2="316" y2="344" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>
      <text x="52" y="360" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ĐỔI LẠI</text>
      <text data-mx="316" x="52" y="375" fill="#575757" font-size="10" font-family="'Geist', sans-serif">Đối tác mở thêm mảng, đổi gói hay làm lại</text>
      <text data-mx="316" x="52" y="389" fill="#575757" font-size="10" font-family="'Geist', sans-serif">sau khi nguội thì phải ghi đè bản cũ —</text>
      <text data-mx="316" x="52" y="403" fill="#575757" font-size="10" font-family="'Geist', sans-serif">lịch sử lượt trước mất.</text>

      <rect x="356" y="216" width="288" height="216" rx="6" fill="#fafafa"/>
      <rect x="356" y="216" width="288" height="216" rx="6" fill="rgba(0,107,79,0.08)" stroke="#006B4F" stroke-width="1.4"/>
      <rect x="368" y="228" width="60" height="16" rx="2" fill="#006B4F"/>
      <text x="398" y="239" fill="#fafafa" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ĐÃ CHỌN</text>
      <text data-mx="632" x="368" y="268" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Một công ty, nhiều lượt theo thời gian</text>
      <text data-mx="632" x="368" y="283" fill="#575757" font-size="9" font-family="'Geist Mono', monospace">OnboardingPlan.companyId + startedAt</text>
      <line x1="368" y1="292" x2="632" y2="292" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>
      <text x="368" y="308" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">NẾU CHỌN</text>
      <text data-mx="632" x="368" y="323" fill="#575757" font-size="10" font-family="'Geist', sans-serif">Đối tác onboard lại được, mỗi lượt một hồ</text>
      <text data-mx="632" x="368" y="337" fill="#575757" font-size="10" font-family="'Geist', sans-serif">sơ riêng — và sản phẩm khỏi đọc «Giai đoạn</text>
      <text data-mx="632" x="368" y="351" fill="#575757" font-size="10" font-family="'Geist', sans-serif">thoả thuận» (<tspan font-family="'Geist Mono', monospace" font-size="9">DealStage</tspan>) chưa chốt nghĩa.</text>
      <line x1="368" y1="358" x2="632" y2="358" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>
      <text x="368" y="374" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ĐỔI LẠI</text>
      <text data-mx="632" x="368" y="389" fill="#575757" font-size="10" font-family="'Geist', sans-serif">Không gì tự bấm đồng hồ hộ người: người</text>
      <text data-mx="632" x="368" y="403" fill="#575757" font-size="10" font-family="'Geist', sans-serif">phải tự đặt ngày bắt đầu, quên là kế hoạch</text>
      <text data-mx="632" x="368" y="417" fill="#575757" font-size="10" font-family="'Geist', sans-serif">nằm im và không ai bị nhắc.</text>

      <rect x="672" y="216" width="288" height="216" rx="6" fill="#fafafa"/>
      <rect x="672" y="216" width="288" height="216" rx="6" fill="rgba(23,23,23,0.05)" stroke="#575757" stroke-width="0.8"/>
      <rect x="684" y="228" width="80" height="16" rx="2" fill="transparent" stroke="rgba(23,23,23,0.40)" stroke-width="0.8"/>
      <text x="724" y="239" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">KHÔNG CHỌN</text>
      <text data-mx="948" x="684" y="268" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Treo vào thoả thuận hợp tác</text>
      <text data-mx="948" x="684" y="283" fill="#575757" font-size="9" font-family="'Geist Mono', monospace">đồng hồ bấm khi thoả thuận sang bậc đã ký</text>
      <line x1="684" y1="292" x2="948" y2="292" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>
      <text x="684" y="308" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">NẾU CHỌN</text>
      <text data-mx="948" x="684" y="323" fill="#575757" font-size="10" font-family="'Geist', sans-serif">Đồng hồ tự bấm lúc thoả thuận sang bậc đã</text>
      <text data-mx="948" x="684" y="337" fill="#575757" font-size="10" font-family="'Geist', sans-serif">ký — không ai phải nhớ đặt ngày.</text>
      <line x1="684" y1="344" x2="948" y2="344" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>
      <text x="684" y="360" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ĐỔI LẠI</text>
      <text data-mx="948" x="684" y="375" fill="#575757" font-size="10" font-family="'Geist', sans-serif">Thừa kế một enum chưa chốt nghĩa: «Giai</text>
      <text data-mx="948" x="684" y="389" fill="#575757" font-size="10" font-family="'Geist', sans-serif">đoạn thoả thuận» (<tspan font-family="'Geist Mono', monospace" font-size="9">DealStage</tspan>) vẫn mang bảy</text>
      <text data-mx="948" x="684" y="403" fill="#575757" font-size="10" font-family="'Geist', sans-serif">bước phễu bán phần mềm cũ.</text>

      <line x1="32" y1="468" x2="968" y2="468" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>
      <text x="32" y="484" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>
      <rect x="32" y="496" width="14" height="10" rx="2" fill="rgba(0,107,79,0.08)" stroke="#006B4F" stroke-width="1.4"/>
      <text x="52" y="505" fill="#575757" font-size="9" font-family="'Geist', sans-serif">Nhánh đã chọn</text>
      <rect x="196" y="496" width="14" height="10" rx="2" fill="rgba(23,23,23,0.05)" stroke="#575757" stroke-width="0.8"/>
      <text x="216" y="505" fill="#575757" font-size="9" font-family="'Geist', sans-serif">Nhánh không chọn</text>
      <rect x="360" y="496" width="14" height="10" rx="2" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="380" y="505" fill="#575757" font-size="9" font-family="'Geist', sans-serif">Câu hỏi của điểm quyết định</text>
      <text x="544" y="505" fill="#575757" font-size="9" font-family="'Geist', sans-serif" font-style="italic">Mỗi nhánh mang một câu đổi lại, kể cả nhánh đã chọn.</text>
    </svg>
