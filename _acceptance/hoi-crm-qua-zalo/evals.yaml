      hom nay -> cau ke van send (dem 19 < 20); gieo them 1 gui-hong -> tu choi (dem 20).
      Chieu do: dem ngay theo UTC -> o (c) do ghim "ngay xuong"; dem ca hang loi -> do ghim "loi khong tinh".
