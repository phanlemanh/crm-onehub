  - id: E1
    criterion: AC-1
    executor: test
    layer: backend-effect
    cmd: config:executors.test.hcz_duong_chinh
    paths:
      - "apps/agent/agent/channels/zalo.ts"
      - "apps/agent/agent/lib/zalo-nhan.ts"
      - "apps/agent/agent/lib/zalo-hoi.ts"
      - "apps/agent/agent/lib/zalo-webhook.ts"
      - "apps/agent/agent/lib/thanh-vien-principal.ts"
      - "packages/db/prisma/schema.prisma"
      - "apps/agent/test/hoi-crm-qua-zalo.integration.spec.ts"
      - "apps/agent/test/support/eve-gia.ts"
    expected: |
      DB that, Zalo gia (thanWebhook khuon that), eve gia bat send/reset.
      Gieo A noi ZA vai member. ZA nhan cau hoi qua nhanWebhook -> 200.
      eveGia.send dai 1: auth toEqual {authenticator:"zalo", principalType:"user",
      principalId:A.id, attributes:{purpose:"zalo", userId:A.id, zaloChatId:ZA, hoiId:<id hang>}};
      continuationToken khop ^chat:ZA:<A.id>:YYYY-MM-DD$; text === cau hoi. sendChatAction toi ZA dem = 1.
      zaloHoi.findMany({messageId}) dai 1, ketQua "dang-hoi", crmUserId A.id, zaloChatId ZA,
      sessionId === id Session eve gia tra ve. O thu tu: eve gia send() chi resolve sau 3s -> response
      webhook toi duoi 500ms (do bang performance.now) va hang dang-hoi da co truoc khi send resolve; sau do
      eveGia.send dai 1. Chieu do: cai dat await hoi() truoc khi tra 200 -> qua 3s -> do ghim "200 truoc send".
      Gieo AgentEvent bang cach goi hook hooks/audit.ts (writer that) voi 3 su kien step.completed khuon eve
      cung sessionId, usage {inputTokens:100,outputTokens:20},{50,10},{null,null} — khong insert tay.
      Goi events["message.completed"]({message:T}, {continuationToken:"chat:"+ZA, ...}).
      sendMessage toi ZA dai 1, text === T. Doc lai hang: ketQua "da-tra-loi", traLoiLuc >= hoiLuc,
      doTreMs === traLoiLuc - hoiLuc, tokenVao 150, tokenRa 30. eveGia.send van dai 1.
      Ca cau dan: message.completed finishReason "tool-calls" -> sendMessage 0, hang van dang-hoi; roi finishReason
      "stop" -> gui dung cau cuoi (chieu do: bo kiem finishReason -> do ghim "cau dan khong toi Zalo").
      Chieu do (pha-thu S3): bo attributes.hoiId khoi auth -> do ghim "auth cua send";
      doi ten khoa usage trong fixture su kien (input_tokens) -> tokenVao null -> do ghim "tokenVao 150"
      (chung to test doc qua writer that, khong tu dung khuon).
