schema_version: 1
feature_slug: nang-kit-3-1-1
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: node --test _acceptance/nang-kit-3-1-1/thu/nang-kit.test.mjs
    expected: "exit 0; ba ca ok, không «# SKIP»/«# TODO». «AC-1 «lớp CI chép khớp từng byte bản v3.1.1»: vật thật xanh, hai bản phá đỏ» — danh sách rút từ khối INIT-CI-COPY-LIST của commit 1193bc22 có đúng 39 đích, kiemLopChep ra rỗng; bản phá thêm một byte vào scripts/product-map.mjs → đúng «lệch bản v3.1.1: scripts/product-map.mjs»; bản phá xoá scripts/tro-ly-quyet-dinh.cjs → đúng «thiếu: scripts/tro-ly-quyet-dinh.cjs»; và đối chứng: bản merge-base của lib/workspace-record.cjs lệch bản thẻ. «AC-1 «resolve-plugin.mjs khớp bản feature-loop v3.1.1»» — khớp từng byte. «AC-1 «t1_skip_globs liệt đủ 39 đích»: vật thật xanh, bản phá đỏ» — bỏ scripts/tro-ly-quyet-dinh.cjs khỏi danh sách → «t1_skip_globs thiếu: scripts/tro-ly-quyet-dinh.cjs»; bản merge-base của config.yaml đỏ đúng thông điệp ấy (đối chứng). Kèm ca «kit đọc đúng commit của thẻ v3.1.1, không phải đối tượng thẻ» — rev-parse v3.1.1^{commit} bằng 1193bc22, rev-parse v3.1.1 khác."
    paths: [scripts/**, lib/**, skills/**, _acceptance/config.yaml, _acceptance/nang-kit-3-1-1/thu/**, _acceptance/nang-kit-3-1-1/rang/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: script
    cmd: node --test _acceptance/nang-kit-3-1-1/thu/nang-kit.test.mjs
    expected: "exit 0; hai ca ok. «AC-2 «tin-hieu-gom.yml kéo thẻ v3.1.1, phần còn lại bằng nhánh chính»: vật thật xanh, ba bản phá đỏ» — bản merge-base → «KIT_REF phải đúng một dòng v3.1.1 (thấy v3.0.0)»; thêm dòng KIT_REF thứ hai → «KIT_REF phải đúng một dòng v3.1.1 (thấy v3.1.1,v3.1.1)»; đổi một dòng khác → «tin-hieu-gom.yml đổi ngoài dòng KIT_REF». «AC-2 «bộ giải kit của phiên gom và của kiểm chéo đêm ra bản 3.1.1»: vật thật xanh, đối chứng đỏ» — scripts/resolve-plugin.mjs với đúng GOM.kit.giai trên cache dựng từ commit thẻ (delivery-loop/acceptance-gate/3.1.1) thoát 0, in đúng thư mục ấy; với KIEM_CHEO.goiDieuPhoi (dispatch, ba --require) ra delivery-loop/dispatch/3.1.1; đối chứng: cùng đối số GOM.kit.giai trên một cache rỗng thoát 1, stderr «no usable install of \"acceptance-gate\"»."
    paths: [.github/**, scripts/tin-hieu/**, scripts/kiem-cheo/**, scripts/resolve-plugin.mjs, _acceptance/nang-kit-3-1-1/thu/**, _acceptance/nang-kit-3-1-1/rang/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: script
    cmd: node --test _acceptance/nang-kit-3-1-1/thu/nang-kit.test.mjs
    expected: "exit 0; hai ca ok. «AC-3 «settings chỉ đổi ref chợ sang v3.1.1»: vật thật xanh, ba bản phá đỏ» — ref v3.0.0 → «ref của chợ delivery-loop phải là v3.1.1 (thấy v3.0.0)»; thêm một quyền vào permissions → «settings đổi ngoài ref chợ: permissions»; tắt knowledge@delivery-loop → «settings đổi ngoài ref chợ: enabledPlugins». «AC-3 «chợ của thẻ mang tên delivery-loop và đủ sáu plugin đang bật»: vật thật xanh, bản phá đỏ» — đọc .claude-plugin/marketplace.json tại commit thẻ; bỏ roadmap → «chợ của thẻ không có plugin roadmap»."
    paths: [.claude/settings.json, _acceptance/nang-kit-3-1-1/thu/**, _acceptance/nang-kit-3-1-1/rang/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

