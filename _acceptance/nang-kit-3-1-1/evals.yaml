    cmd: node --test _acceptance/nang-kit-3-1-1/thu/nang-kit.test.mjs
    expected: "exit 0; ca «AC-7 «diff từ nhánh chính chỉ chạm tệp viết trước»: vật thật 0 tệp lạ, bản cấy đỏ» ok — mọi tệp của git diff merge-base...HEAD khớp danh sách viết trước (tám tệp của thiết kế mục 2, hồ sơ này, thiết kế, kế hoạch, PRODUCT-MAP.md, LO-TRINH.html); bản cấy packages/core/src/agreements.ts và _acceptance/chuyen-cho-delivery-loop-3-0/evals.yaml → đúng hai dòng «tệp ngoài danh sách: …»."
