    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-6
    executor: script
    cmd: node --test _acceptance/nang-kit-3-1-1/thu/nang-kit.test.mjs
    expected: "exit 0; ca «AC-6 «làn khô khớp diff, xếp lớp đúng, gioi-han khớp đỏ vì vòng»: vật thật xanh, bốn bản phá đỏ» ok — evidence/phan-loai.json có sha tip mà cây ngoài _acceptance/ bằng cây HEAD và sha nhánh chính bằng merge-base; ung_vien bằng tập suy lại từ evals.yaml của hồ sơ đã ký và diff (không chép tay); bản phá: đổi sha tip về merge-base → «làn khô không chạy trên cây HEAD»; xếp một eval xanh-ở-nhánh-chính vào do-ca-hai → «<hồ sơ>/<eval>: xếp đỏ cả hai bên mà nhánh chính xanh»; bỏ một ứng viên → «ứng viên lệch tập suy từ diff»; thêm một dòng gioi-han không đỏ vì vòng → «gioi-han không khớp đỏ vì vòng»."
