  - id: E5b
    criterion: AC-5
    executor: script
    cmd: node --test _acceptance/nang-kit-3-1-1/thu/nang-kit.test.mjs
    expected: "exit 0; ca «AC-5 «hàm so đối chứng»: cùng tập OK xanh; lệch, VIOLATION, thiếu luật, hồ sơ thôi OK, VIOLATION ngoài vòng đều đỏ đúng thông điệp» ok — trên văn bản tổng hợp: «tập OK của hai lớp chép trên merge-base lệch», «merge-base có VIOLATION», «lớp chép nhánh chính: lưới không chạy đủ luật», «hồ sơ thôi OK trên HEAD: b», «VIOLATION ngoài vòng trên HEAD: 1»; chỉ dòng VIOLATION mang [nang-kit-3-1-1] không làm đỏ — một dòng VIOLATION [PR] trên HEAD → «VIOLATION ngoài vòng trên HEAD: 1». Kèm ca «AC-5 «lưới chế độ PR chỉ báo hồ sơ của vòng»» chiều đỏ: văn bản có VIOLATION [chuyen-cho-delivery-loop-3-0] → «lưới PR báo hồ sơ khác vòng: chuyen-cho-delivery-loop-3-0»."
