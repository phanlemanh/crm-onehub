  - id: E2
    criterion: AC-2
    executor: test
    layer: backend-effect
    cmd: config:executors.test.dg_gom
    expected: "exit 0; -t dg-gom của apps/api/test/du-an.spec.ts. (1) dg-m gọi viec.create({tieuDe, nguoiThucHienId: dg-b, duAnId: P}): việc mới khác duAnId P hoặc nguoiGiaoId khác dg-m thì ném 'dg: viec trong du an sai'; số DuAnVet 'them-viec' của P khác 1 thì ném 'dg: thieu vet them-viec'. (2) Việc riêng V của dg-a (không gắn gì); trước khi đưa vào, dg-x gọi viec.get(V) nhận NOT_FOUND, không thì ném 'dg: doi chung viec rieng lo'. dg-a gọi viec.doiDuAn({id: V, duAnId: P}): V.duAnId khác P thì ném 'dg: doi du an khong ghi'; ViecVet 'doi-du-an' của V không đúng một dòng truoc null sau P thì ném 'dg: vet doi-du-an sai <json>'; dg-x gọi viec.get(V) không thành công thì ném 'dg: viec trong du an khong thay'. (3) dg-a taoCon cho V: con khác duAnId P thì ném 'dg: con khong mang du an'. (4) V chờ W (ViecPhuThuoc W→V) và chờ mốc M; dg-a gọi viec.doiDuAn({id: V, duAnId: null}): V đổi trangThai, batDauNgay hay hanNgay thì ném 'dg: bot viec doi viec'; còn hàng ViecPhuThuoc hay DuAnMocCho của V thì ném 'dg: bot viec con phu thuoc'; vết 'go-phu-thuoc' thiếu trên V hoặc trên W thì ném 'dg: go phu thuoc thieu vet <dau>'; DuAnVet 'bot-viec' của P khác 1 thì ném 'dg: thieu vet bot-viec'. (5) viec.create trong P với nguoiThucHienId là người vai okr: code khác BAD_REQUEST hoặc message không chứa tên họ và 'chỉ OKR' thì ném 'dg: okr nhan viec du an <msg>'; số Viec, ViecVet tăng thì ném 'dg: okr van ghi'. Chiều đỏ ở E15 (b)."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [packages/db/prisma/schema.prisma, packages/db/src/viec.ts, packages/db/src/viec-ghi.ts, packages/db/src/du-an-ghi.ts, apps/api/src/viec/**, apps/api/src/du-an/**, apps/api/test/du-an.spec.ts]

