      5. dg-khung-viec-1280: ô Bắt đầu, Hạn, Dự án và mục «Phải chờ (n)» (ST-khung-viec-lich); dg-hoi-dong-1280: hộp hỏi lại đóng dự án nêu số việc chưa xong (ST-du-an-hoi-dong); dg-lich-lam-viec-1280: hai thẻ ngày nghỉ trong tuần và ngày lễ (ST-lich-lam-viec).
