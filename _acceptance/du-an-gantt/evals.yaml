      - "Mở các ảnh dg-cua-toi-1280.png, dg-pham-vi-1280.png, dg-ds-1280.png, dg-gantt-1280.png, dg-gantt-moc-tre-1280.png, dg-gantt-da-doi-1280.png, dg-khung-viec-1280.png, dg-hoi-dong-1280.png, dg-lich-lam-viec-1280.png, dg-gantt-375.png, dg-ds-375.png và đối chiếu bằng mắt với Expected."
    inputs: [_acceptance/du-an-gantt/evidence/]
    expected: |
      0. dg-cua-toi-1280: phạm vi «Của tôi» như DA1, dòng việc trong dự án có dòng phụ «Dự án: …» (ST-viec-cua-toi-du-an); dg-pham-vi-1280: ô Phạm vi mở với Của tôi, Tất cả dự án, dự án đang mở, «Đã đóng (n)», «Tạo dự án…» (ST-pham-vi-mo).
      1. dg-ds-1280: phạm vi «Tất cả dự án», bảng dự án có tên, «x/y việc xong», khoảng ngày, mốc kế, người tạo; dòng gập «Đã đóng (n)» (ST-du-an-ds-co).
      2. dg-gantt-1280: hàng Mốc có hình thoi, cây việc có con thụt, thanh màu trạng thái, mũi tên nối đúng cặp, cột Thứ Bảy, Chủ nhật và ngày lễ tô nền, vạch hôm nay; nhóm «Chưa có lịch (n)» có «Đặt ngày» (ST-gantt-co-lich, ST-gantt-chua-lich).
      3. dg-gantt-moc-tre-1280: mốc tô màu lỗi (ST-gantt-moc-tre). man.mjs đọc duAn.lich: mốc đó tre khác true thì thoát 1 'dg man: moc khong tre'.
