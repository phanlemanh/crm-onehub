  - id: E14
    criterion: AC-14
    executor: judgment
    question: "Đọc CONTEXT.md và docs/api.md. (1) CONTEXT.md mục «Dự án» nói: chỗ chứa việc; xem trong màn Việc ở phạm vi một dự án (ô Phạm vi: Của tôi · Tất cả dự án · một dự án; Gantt chỉ ở phạm vi dự án), và mục «Việc của tôi» nói nó là phạm vi «Của tôi» của màn Việc; một việc nhiều nhất một dự án; ai đọc được phạm vi đối tác thì thấy dự án và việc trong đó, vai «chỉ OKR» không; dự án gỡ bằng Xoá khi chưa có lịch sử, còn lại Đóng · Mở lại, đóng không đổi việc. (2) Có mục «Mốc (dự án)» (ngày, việc phải xong trước, trễ khi việc phải xong trước có hạn sau mốc, mốc không tự dời), mục «Phụ thuộc (việc)» (chỉ xong-rồi-mới-bắt-đầu, cùng dự án, tự dời khi chồng, không kéo lùi) và mục «Lịch làm việc» (thứ nghỉ trong tuần mặc định Thứ Bảy, Chủ nhật; ngày lễ quản trị thêm; tự dời bỏ ngày nghỉ; đổi lịch không dời việc đã có). (3) docs/api.md mục «Việc» có phần «Dự án» nêu duAn.list, duAn.lich, duAn.moc.*, duAn.phuThuoc.*, viec.doiLich, viec.doiDuAn, luật dời khi chồng, nguồn vết gantt và tu-doi, và lichLamViec.*. Thiếu điều nào thì FAIL và nêu điều đó."
    inputs: [CONTEXT.md, docs/api.md]
    evidence_required: [verdict, rationale, verified_at]

