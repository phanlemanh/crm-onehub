slug: du-an-gantt
evals:
  - id: E1
    criterion: AC-1
    executor: test
    layer: backend-effect
    cmd: config:executors.test.dg_tao
    expected: "exit 0; -t dg-tao của apps/api/test/du-an.spec.ts. Phiên 'dg-m' (member) gọi duAn.tao({ten: 'Triển khai Ngân hàng A'}) qua caller tRPC thật. Đọc lại bằng Prisma: số DuAn mang ten đó khác 1 hoặc taoBoiId khác dg-m thì ném 'dg: tao du an sai <json>'; số DuAnVet loai 'tao' của nó khác 1 thì ném 'dg: thieu vet tao'. duAn.tao với ten '' và với ten 121 ký tự: code khác BAD_REQUEST thì ném 'dg: ten sai van tao <n>'; số DuAn tăng thì ném 'dg: ten sai van ghi'. duAn.list({trangThai: 'mo'}) trên fixture hai dự án mở một dự án đóng: khác đúng hai id mở thì ném 'dg: list mo sai <json>'; mỗi hàng thiếu soViec, soXong, batDauSom, hanMuon, mocKe hoặc taoBoi thì ném 'dg: list thieu cot <truong>'; duAn.list({trangThai: 'dong'}) khác đúng một id thì ném 'dg: list dong sai'. Đối chứng dương cùng fixture: dự án tạo bằng ten 120 ký tự thành công, không thì ném 'dg: doi chung ten 120 hong'. Chiều đỏ ở E15 (a)."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [packages/db/prisma/schema.prisma, packages/db/src/du-an.ts, packages/db/src/du-an-ghi.ts, apps/api/src/du-an/**, apps/api/test/du-an.spec.ts]

  - id: E1b
    criterion: AC-1
    executor: test
    cmd: config:executors.test.dg_man_ds
    expected: "exit 0; -t dg-man-ds của apps/app/test/du-an.dom.tsx, mock tRPC theo khuôn viec-cua-toi.dom.tsx, nuqs testing adapter. (1) Mount trang Việc không tham số: hiện ba nhóm và kiểu Danh sách của DA1 (SimpleTable), ô Phạm vi đọc «Của tôi», không thì ném 'dg: mac dinh khong phai cua toi'; khung-dieu-huong không có mục khoá du-an, không thì ném 'dg: con muc du an rieng'. (2) Mở ô Phạm vi: thiếu một trong «Của tôi», «Tất cả dự án», hai dự án mở, «Đã đóng (1)», «Tạo dự án…» thì ném 'dg: o pham vi thieu <muc>'. (3) Chọn «Tất cả dự án»: URL không mang phamVi=tat-ca-du-an thì ném 'dg: url pham vi sai <url>'; ViewSwitch có mục Gantt thì ném 'dg: gantt o tat ca du an'; bảng không có đúng hai hàng mở với tên, «x/y việc xong», khoảng ngày, mốc kế, người tạo thì ném 'dg: bang du an sai <n>'. (4) Chọn «Tạo dự án…», gõ tên, bấm «Tạo»: duAn.tao gọi khác đúng một lần hoặc URL không thành phamVi=<id mới>&xemViec=gantt thì ném 'dg: tao khong sang pham vi moi'; tên trống: lỗi không hiện dưới ô hoặc duAn.tao vẫn gọi thì ném 'dg: ten trong van gui'. (5) Ba ca ở phạm vi Tất cả dự án: duAn.list treo → khung xương và tiêu đề «Việc» còn, không thì 'dg: ds cho tai sai'; lỗi → VungTaiLoi có «Thử lại», không thì 'dg: ds loi sai'; rỗng → Empty «Chưa có dự án» có nút tạo, không thì 'dg: ds rong sai'. Ở matchMedia 375: bảng dự án là phần tử data-slot='item', không thì 'dg: 375 khong la item'. Đối chứng: mount lại với ?phamVi=tat-ca-du-an giữ phạm vi đó, không thì ném 'dg: khong giu pham vi'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
