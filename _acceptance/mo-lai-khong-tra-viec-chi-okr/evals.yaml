  - id: E9
    criterion: AC-9
    executor: judgment
    question: >-
      Đọc docs/api.md, mục «Kế hoạch 30 ngày không giao việc cho người không đọc được dữ liệu đối tác» và các dòng
      quanh nó, như một người mới vào kho. Tài liệu có nói rõ bốn điều không: (1) mở lại kế hoạch đã đóng và bỏ «xong»
      một bước đi qua cùng điều kiện nhận việc với giao bước (kiemNguoiNhanViec — thành viên và vai docDuocDoiTac);
      (2) khi mở lại kế hoạch, bước chưa xong của người không nhận được việc thành chưa giao và lượt theo dõi kế hoạch
      của họ bị gỡ, còn bước đã xong giữ nguyên người làm; bỏ «xong» bước của người không nhận được việc thì bước
      mở lại ở dạng chưa giao; (3) người cầm trịch không nhận được việc bị thay bằng người bấm mở lại, và mỗi đổi
      người có vết; (4) người bấm mở lại cũng không nhận được việc thì mở lại bị từ chối, kế hoạch vẫn đóng. Tài liệu
      không tự đúc từ ghép tiếng Việt cho thuật ngữ kỹ thuật mà CONTEXT.md không có. Trả PASS khi đủ bốn điều, FAIL
      nêu điều thiếu.
    inputs: [docs/api.md, CONTEXT.md]
    evidence_required: [verdict, rationale, verified_at]
    paths: [docs/api.md]
