  - id: E4
    criterion: AC-4
    executor: test
    layer: backend-effect
    cmd: config:executors.test.mlk_mo_lai
    expected: "exit 0; cùng -t mlk-mo-lai, ca 'người bấm không nhận được việc': khuôn E1 đến sau doiVai(A,'okr'). Chụp ownerId, closedAt, assigneeId các bước, lượt theo dõi, số vết. new OnboardingGhi(db).datDong(id, false, X) với X là người vai okr 'mlk-x-okr': phải ném BadRequestException có message bằng ONBOARDING.thongDiep.vaiChiOkr(tên X), không thì ném 'mlk: nguoi bam vai okr khong bi chan' (chưa ném) hay 'mlk: loi nguoi bam sai <message>'; với X là user không có hàng member 'mlk-x-ngoai': message bằng ONBOARDING.thongDiep.khongPhaiThanhVien(mã X), cùng hai thông điệp với chữ 'ngoai'. Sau mỗi lần: bất kỳ giá trị đã chụp khác trước thì ném 'mlk: tu choi ma van ghi <khoá>'. Chiều đỏ: thay kiemNguoiNhanViec(người bấm) bằng giá trị không kiểm làm ca đỏ 'mlk: nguoi bam vai okr khong bi chan' (chạy tay ở S3, ghi trong sổ)."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [apps/api/src/onboarding/onboarding-ghi.ts, apps/api/src/onboarding/onboarding-config.ts, apps/api/test/mo-lai-vai-chi-okr.spec.ts]

