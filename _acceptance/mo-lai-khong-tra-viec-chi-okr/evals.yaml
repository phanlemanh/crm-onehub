slug: mo-lai-khong-tra-viec-chi-okr
evals:
  - id: E1
    criterion: AC-1
    executor: test
    layer: backend-effect
    cmd: config:executors.test.mlk_mo_lai
    expected: "exit 0; -t mlk-mo-lai của apps/api/test/mo-lai-vai-chi-okr.spec.ts, hai ca. Dựng qua đường ghi thật (OnboardingService.createFromTemplate, OnboardingGhi.addStep/assignStep/setStepDone, OnboardingTheoDoi.bat, OnboardingService.closePlan, WorkspaceService.setMemberRole). Ca 'chỉ OKR': A 'mlk-a' vai member cầm trịch, bước 1 chưa xong giao A, bước 2 chưa xong giao M 'mlk-m' vai member, bước 3 giao A rồi đánh dấu xong; M theo dõi; đóng kế hoạch; setMemberRole(quanTri, {memberId của A, role:'okr'}) phải thành công. Chốt dựng trước thao tác: ownerId khác A, bước 1 khác A, bước 2 khác M, hay M không có lượt theo dõi thì ném 'mlk: dung sai <khoá>'. Đếm vết. OnboardingService.reopenPlan({id}, Q) với Q vai member. Sau đó: closedAt khác null thì ném 'mlk: ke hoach khong mo'; ownerId khác Q thì ném 'mlk: cam trich chua doi sang nguoi mo lai <ownerId>'; bước 1 khác null thì ném 'mlk: buoc mo con trong tay vai okr'; bước 2 khác M thì ném 'mlk: buoc cua member bi doi'; bước 3 khác A hoặc completedAt null thì ném 'mlk: buoc da xong bi doi'; mất lượt theo dõi của M thì ném 'mlk: theo doi cua member bi go'; tập kind vết mới (sắp theo chữ) khác đúng ['buoc.giao','keHoach.doiCamTrich','keHoach.moLai'] thì ném 'mlk: vet mo lai sai <json>'; vết keHoach.doiCamTrich phải tu=A, den=Q và vết buoc.giao phải tu=A, den=null, không thì ném 'mlk: vet doi nguoi sai <json>'. Ca 'cầm trịch đọc được' (dữ liệu cũ): M cầm trịch, bước chưa xong giao A, A theo dõi; đóng; doiVai(A,'okr') đặt thẳng vai (trạng thái trước DA0a — đường thật setMemberRole sẽ gỡ lượt theo dõi). Chốt dựng: A không còn lượt theo dõi hay bước không còn của A thì ném 'mlk: dung sai <khoá>'. reopenPlan bởi Q: ownerId khác M thì ném 'mlk: doi cam trich doc duoc'; bước khác null thì ném 'mlk: cam trich doc duoc ma buoc con trong tay vai okr'; A còn lượt theo dõi thì ném 'mlk: cam trich doc duoc ma vai okr con theo doi'; tập kind vết mới khác ['buoc.giao','keHoach.moLai'] thì ném 'mlk: vet cam trich doc duoc sai <json>'. Chiều đỏ ở E8 (a), (b), (c), (e), (f)."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [apps/api/src/onboarding/onboarding-ghi.ts, apps/api/src/onboarding/onboarding.service.ts, apps/api/test/mo-lai-vai-chi-okr.spec.ts]

