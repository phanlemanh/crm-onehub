    expected: "exit 0; -t mlk-bo-xong của apps/api/test/mo-lai-vai-chi-okr.spec.ts. Kế hoạch đang chạy do M vai member cầm trịch; bước của A (A vai member lúc giao) và bước của M đều đánh dấu xong qua setStepDone; setMemberRole(quanTri, {memberId của A, role:'okr'}) phải thành công. Chốt dựng: hai bước chưa xong, hay bước A khác A, thì ném 'mlk: dung sai <khoá>'. OnboardingService.setStepDone({stepId: bước A, done:false}, Q): completedAt khác null thì ném 'mlk: buoc khong mo lai'; assigneeId khác null thì ném 'mlk: bo xong tra buoc ve vai okr'; tập kind vết mới (sắp theo chữ) khác đúng ['buoc.boXong','buoc.giao'] thì ném 'mlk: vet bo xong sai <json>'; vết buoc.giao khác tu=A den=null thì ném 'mlk: vet bo xong doi nguoi sai <json>'. Bước của M: assigneeId khác M thì ném 'mlk: bo xong doi nguoi member'; vết mới khác ['buoc.boXong'] thì ném 'mlk: doi chung bo xong co vet thua <json>'. Ca 'đã rời': cùng khuôn, A gỡ bằng WorkspaceService.removeMember thay đổi vai; bỏ xong bước của A: assigneeId khác null thì ném 'mlk: bo xong tra buoc ve nguoi da roi'. Chiều đỏ ở E8 (d), (e)."
