    expected: "exit 0; -t vc-sua của apps/api/test/viec-ghi.spec.ts, việc giao vc-a, thực hiện vc-b, theo dõi vc-w, thêm vc-c và vc-x vai member, quản trị vc-q. Chuỗi được, mỗi bước đếm vết tăng đúng 1 với loai đúng và truoc/sau đúng, không thì ném 'vc: sua <buoc> vet sai': vc-a doiNguoiThucHien→vc-c ('doi-nguoi-thuc-hien'), vc-a sửa tiêu đề ('doi-noi-dung'), vc-a sửa hạn ('doi-han'), vc-a theoDoi thêm vc-x ('theo-doi'), vc-c (nay là người thực hiện) sửa hạn ('doi-han'), vc-w boTheoDoi chính mình ('bo-theo-doi'), vc-q tự theo dõi ('theo-doi'). Chuỗi không được: vc-b (đã không còn là người thực hiện) sửa hạn, vc-c doiNguoiThucHien, vc-x sửa tiêu đề, vc-w thêm vc-b làm người theo dõi — mỗi lệnh TRPCError FORBIDDEN, việc không đổi, không vết mới, không thì ném 'vc: sua lot <nguoi> <thao tac>'. viec.lichSu(id) trả mọi vết mới nhất trước, mỗi dòng có nguoi.name, loai, luc, nguon, không thì ném 'vc: lich su sai thu tu'. Chiều đỏ ở E16 (c)."
