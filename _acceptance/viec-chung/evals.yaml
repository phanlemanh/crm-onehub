slug: viec-chung
evals:
  - id: E1
    criterion: AC-1
    executor: test
    layer: backend-effect
    cmd: config:executors.test.vc_tao
    expected: "exit 0; -t vc-tao của apps/api/test/viec-ghi.spec.ts. Dựng qua đường ghi thật: công ty 'VC Cty' và thoả thuận D của nó, người 'vc-a', 'vc-b', 'vc-w' vai member (gieoThanhVien). Gọi viec.create qua caller tRPC thật với phiên vc-a: {tieuDe, dealId: D, nguoiThucHienId: vc-b, hanNgay: ngày mai VN, nguoiTheoDoiIds: [vc-w]}. Đếm hàng viec có tieuDe đó khác 1 thì ném 'vc: tao viec khong ra dung mot hang <n>'; trangThai khác CHUA_LAM, nguoiGiaoId khác vc-a, nguoiThucHienId khác vc-b thì ném 'vc: tao viec sai truong <truong>'; ViecTheoDoi không có vc-w thì ném 'vc: thieu nguoi theo doi'; ViecGan không phải đúng một hàng dealId D thì ném 'vc: gan sai'; ViecVet không phải đúng một dòng loai 'tao', nguoiId vc-a, nguon 'web' thì ném 'vc: vet tao sai'. viec.cuaBanGhi({dealId: D}) và viec.cuaBanGhi({companyId: cty}) phải chứa mã việc, không thì ném 'vc: khoi viec <ban-ghi> thieu viec'. Ca 'không chọn người': tạo không có nguoiThucHienId → nguoiThucHienId bằng vc-a, không thì ném 'vc: nguoi thuc hien mac dinh sai'. Đối chứng âm cùng fixture: thoả thuận khác D2 của công ty khác — viec.cuaBanGhi({dealId: D2}) chứa mã việc thì ném 'vc: viec lot sang ban ghi khac'. Chiều đỏ ở E16 (a)."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [packages/db/prisma/schema.prisma, packages/db/src/viec.ts, packages/db/src/viec-ghi.ts, apps/api/src/viec/**, apps/api/test/viec-ghi.spec.ts]

  - id: E1b
    criterion: AC-1
    executor: test
    cmd: config:executors.test.vc_man_o_soan
    expected: "exit 0; apps/app/test/viec-o-soan.dom.tsx, mock tRPC theo khuôn ke-hoach-sheet.dom.tsx. Ca -t vc-o-soan-giao: mount <Timeline anchor={{ dealId }}/>: ô soạn có loại «Việc» và không còn loại «Việc cần làm», không thì ném 'vc: o soan con viec can lam'; chọn «Việc», gõ tiêu đề, chọn người thực hiện từ ô chọn đọc onboarding.nguoiNhanViec, chọn hạn, bấm «Giao việc» — mutation viec.create được gọi đúng một lần với dealId của mốc, tieuDe, nguoiThucHienId đã chọn, không thì ném 'vc: o soan goi sai <json>'. Ô người thực hiện mặc định hiện «Tôi», không thì ném 'vc: mac dinh khong phai toi'. Mock viec.cuaBanGhi trả một việc: khối «Việc» đầu thẻ hiện tiêu đề việc trước dòng sự kiện đầu tiên, không thì ném 'vc: khoi viec khong dung dau the'. Đối chứng: viec.cuaBanGhi trả rỗng (kể cả không việc đã khép) thì khối không hiện, không thì ném 'vc: khoi rong van hien'. Ca -t vc-o-soan-loi: viec.create trả lỗi — lời lỗi hiện dưới nút, ô tiêu đề còn chữ đã gõ, không thì ném 'vc: o soan mat chu khi loi'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [apps/app/components/crm/timeline/**, apps/app/components/viec/**, apps/app/lib/messages/viec.ts, apps/app/lib/messages/crm.ts, apps/app/test/viec-o-soan.dom.tsx]

  - id: E2
    criterion: AC-2
    executor: test
    layer: backend-effect
    cmd: config:executors.test.vc_gan
    expected: "exit 0; -t vc-gan của apps/api/test/viec-ghi.spec.ts trên fixture của E1, thêm kế hoạch 30 ngày P của cùng công ty (createFromTemplate thật). vc-a gọi viec.gan({id, planId: P}): đếm hàng viec của việc khác 1 thì ném 'vc: gan them nhan ban viec'; viec.cuaBanGhi({planId: P}) không chứa việc thì ném 'vc: ke hoach khong thay viec'; viec.cuaBanGhi({companyId: cty}) chứa mã việc khác đúng 1 lần thì ném 'vc: cong ty hien viec <n> lan'; không có vết loai 'gan' thì ném 'vc: thieu vet gan'. vc-a gọi viec.go({id, dealId: D}): viec.cuaBanGhi({dealId: D}) còn việc thì ném 'vc: go xong van hien'; viec.cuaBanGhi({companyId}) mất việc thì ném 'vc: cong ty mat viec khi con gan ke hoach'; không có vết 'go' thì ném 'vc: thieu vet go'. Chiều đỏ ở E16 (b)."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [packages/db/src/viec-ghi.ts, packages/db/src/viec.ts, apps/api/src/viec/**, apps/api/test/viec-ghi.spec.ts]

  - id: E3
    criterion: AC-3
    executor: test
    layer: backend-effect
    cmd: config:executors.test.vc_trang_thai
    expected: "exit 0; -t vc-trang-thai của apps/api/test/viec-ghi.spec.ts. Ma trận viết trước trong spec, chép từ bảng «Đồ thị trạng thái» của design doc: 5 người (giao vc-a, thực hiện vc-b, theo dõi vc-w, thành viên khác vc-x, quản trị vc-q) × 20 cặp nguồn khác đích của năm trạng thái = 100 ô, mỗi ô một việc mới gắn thoả thuận D dựng qua viec-ghi thật rồi đưa tới trạng thái nguồn bằng chuỗi chuyển hợp lệ của vc-a. Số ô đã chạy khác 100 thì ném 'vc: ma tran trang thai thieu o <n>'. Ô hợp lệ có quyền: viec.doiTrangThai thành công, trangThai bằng đích, đúng một vết 'doi-trang-thai' với truoc/sau, không thì ném 'vc: o duoc hong <nguoi> <nguon>-<dich>'. Cặp ✗: TRPCError BAD_REQUEST message bằng nguyên văn VIEC.thongDiep.khongChuyenDuoc(nguon, dich) với mọi người, không thì ném 'vc: cap khong hop le lot <nguoi> <nguon>-<dich>'. Ô không quyền: FORBIDDEN, message bằng nguyên văn lời ghim của ô (VIEC.thongDiep.chiNguoiGiao(viec) với ô chỉ G, VIEC.thongDiep.chiGiaoVaThucHien(viec) với ô G · T), trangThai không đổi, không vết mới, không thì ném 'vc: o khong lot <nguoi> <nguon>-<dich>' (thành công) hay 'vc: loi tu choi sai o <nguoi> <nguon>-<dich>' (lời khác). roiChuaLamLuc: sau ô vc-b CHUA_LAM→DANG_LAM khác null, không thì ném 'vc: roiChuaLamLuc khong ghi'; sau ô vc-a CHUA_LAM→DANG_LAM và ô vc-a CHUA_LAM→HUY vẫn null, không thì ném 'vc: roiChuaLamLuc ghi boi nguoi giao'; một việc vc-b CHUA_LAM→DANG_LAM rồi vc-b DANG_LAM→CHUA_LAM rồi vc-b CHUA_LAM→DANG_LAM giữ giá trị lần đầu, không thì ném 'vc: roiChuaLamLuc ghi lai'. Chiều đỏ ở E16 (c), (k), (l)."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [packages/db/src/viec-ghi.ts, packages/db/src/viec.ts, apps/api/src/viec/**, apps/api/test/viec-ghi.spec.ts]

  - id: E16
    criterion: AC-3
    executor: script
    cmd: config:executors.script.vc_dot_bien
    expected: "exit 0; rang/dot-bien.mjs dùng ban-sao.mjs của ca-chap-chon-cach-ly như DA0a: với mỗi cặp chạy phép đo trên bản sao lành phải xanh, rồi thay một lần chuỗi vật thật và chạy lại phải đỏ với đúng thông điệp ghim — (a) bỏ hàng ViecGan khi tạo → E1 'vc: gan sai'; (b) bỏ lọc trùng việc ở khối của công ty → E2 'vc: cong ty hien viec'; (c) bỏ kiểm quyền đổi trạng thái của người theo dõi → E3 'vc: o khong lot'; (d) bỏ vế vai ở kiemNguoiNhanViec của viec-ghi → E5 'vc: giao cho vai okr khong bi chan'; (e) bỏ điều kiện việc riêng trong dieuKienXemViec → E6 'vc: viec rieng lo'; (f) bỏ cổng vai của nguồn việc trong bộ gom → E8 'vc: bo gom co viec doi tac cho vai okr'; (g) bỏ kiểm người nhắn ở nhánh xong n của việc → E10 'vc: xong n nguoi la lot'; (h) bỏ lệnh chuyển người giao ở chuyển việc → E11 'vc: chuyen viec bo sot nguoi giao'; (i) bỏ kiểm «chưa có lịch sử» khi xoá → E12 'vc: xoa viec co lich su'; (j) đổi so sánh hạn của thước sang ngày hôm sau → E14 'vc: thuoc dem sai dung han'; (k) bỏ chặn người theo dõi ở cặp CHO_DANH_GIA→XONG → E3 'vc: o khong lot'; (l) bỏ vế «người đổi là người thực hiện» ở chỗ ghi roiChuaLamLuc → E3 'vc: roiChuaLamLuc ghi boi nguoi giao' và E14 'vc: thuoc dem sai dung han'; (m) bỏ lời gọi kiemNguoiNhanViec ở nhánh mở lại → E5 'vc: giao cho vai okr khong bi chan'. Thiếu cặp nào hay bản sao lành đỏ thì thoát khác 0 nêu cặp."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [_acceptance/viec-chung/rang/dot-bien.mjs, packages/db/src/viec-ghi.ts, packages/db/src/viec.ts, packages/db/src/onboarding-nhac.ts, apps/agent/agent/lib/tra-loi-nhac.ts, apps/api/src/onboarding/onboarding-ghi.ts, _acceptance/viec-chung/rang/do-nguong.mjs]

  - id: E4
    criterion: AC-4
    executor: test
    layer: backend-effect
