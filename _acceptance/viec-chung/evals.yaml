    expected: "exit 0; -t vc-vai-okr của apps/api/test/viec-quyen.spec.ts. Người 'vc-okr' tên 'Người OKR VC' vai okr, vc-a, vc-b vai member, quản trị vc-q, thoả thuận D. Bảy đường, mỗi đường đếm viec, viecTheoDoi, viecVet và trangThai trước và sau: (1) viec.create nguoiThucHienId vc-okr, (2) doiNguoiThucHien sang vc-okr, (3) theoDoi thêm vc-okr, (4) onboarding.transferWork từ vc-a sang vc-okr khi vc-a thực hiện một việc mở, (5) — (7) việc gắn D người giao vc-a, người thực hiện vc-m vai member đã đưa tới XONG, CHO_DANH_GIA, HUY rồi đổi member.role của vc-m sang 'okr' trực tiếp: vc-a «Làm lại» XONG→DANG_LAM, «Làm lại» CHO_DANH_GIA→DANG_LAM, «Mở lại» HUY→CHUA_LAM — mỗi đường phải BadRequest có message chứa tên người vai okr và 'chỉ OKR' và các số đếm không đổi, không thì ném 'vc: giao cho vai okr khong bi chan <duong>'. Đối chứng dương cùng fixture cho (5): khi vc-m còn vai member, «Làm lại» thành công. Router: phiên vc-okr gọi viec.cuaToi, viec.get, viec.create phải TRPCError FORBIDDEN message KHONG_TRONG_PHAM_VI, không thì ném 'vc: router viec mo cho vai okr <thu tuc>'. onboarding.nguoiNhanViec không chứa vc-okr, không thì ném 'vc: o chon co vai okr'. Đổi vai: vc-b thực hiện một việc mở → workspace.setMemberRole(vc-b, okr) ConflictException message bằng nguyên văn WORKSPACE_CONFIG.messages.conViec(…) có số việc 1 và chữ 'Chuyển việc', vai vẫn member, không thì ném 'vc: doi vai khi con viec khong bi chan'; biến thể vc-b chỉ là người giao của một việc mở — cũng 409. vc-c theo dõi một việc mở và một việc XONG → đổi vai thành công và số ViecTheoDoi của vc-c bằng 0, không thì ném 'vc: con theo doi viec sau doi vai'. Đối chứng dương: viec.create với vc-b thành công. Chiều đỏ ở E16 (d), (m)."
