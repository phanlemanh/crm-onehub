    paths: [packages/db/src/viec-ghi.ts, apps/api/src/viec/**, apps/api/test/viec-ghi.spec.ts]

  - id: E4b
    criterion: AC-4
    executor: test
    cmd: config:executors.test.vc_man_khung
    expected: "exit 0; apps/app/test/viec-khung.dom.tsx, mock tRPC: viec.get trả một việc, viec.lichSu trả ba vết (tao web, doi-trang-thai web, doi-trang-thai zalo) thứ tự mới nhất trước. Mở khung qua useRecordSheet ?record=viec:<id>: thẻ «Lịch sử» liệt kê ba dòng đúng thứ tự, dòng zalo ghi «qua Zalo», không thì ném 'vc: khung lich su sai'. Ba ca người xem (mock phiên): người thực hiện ở DANG_LAM thấy đúng hai nút «Gửi đánh giá» và «Xong»; người giao ở CHO_DANH_GIA thấy đúng «Xong», «Làm lại», «Huỷ»; người theo dõi không thấy nút trạng thái nào và thấy dòng «Chỉ người giao và người thực hiện đổi được trạng thái» — sai ca nào thì ném 'vc: nut trang thai sai <ca>'. Bấm «Xong» gọi viec.doiTrangThai một lần với den XONG; mutation trả lỗi FORBIDDEN thì nhãn trạng thái quay về cũ và toast có lời của máy chủ, không thì ném 'vc: khung khong lui khi bi tu choi'. Nút Xoá: viec.get trả coLichSu false và người xem là người giao — nút «Xoá» hiện, bấm mở ConfirmDialog, xác nhận gọi viec.xoa đúng một lần, không thì ném 'vc: xoa khong qua hoi lai'; coLichSu true — không có nút «Xoá», không thì ném 'vc: nut xoa hien khi co lich su'."
