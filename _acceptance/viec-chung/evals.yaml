  - id: E15
    criterion: AC-15
    executor: judgment
    question: >-
      Đọc CONTEXT.md (mục «Việc» và các mục mới hay sửa quanh nó), docs/api.md (mục về router viec và phạm vi dữ
      liệu) và docs/agent.md (mục «Nhắc buổi sáng») như một người mới vào kho. Tài liệu có nói rõ sáu điều không:
      (1) Việc là gì — năm trạng thái cố định, người giao, một người thực hiện, người theo dõi, gắn được nhiều bản
      ghi mà vẫn là một việc, và mục «Việc» đã bỏ dòng «nghĩa chốt tại Cổng Phạm vi»; (2) ai đổi được trạng thái
      và ai không (người theo dõi, thành viên khác, quản trị không đổi); (3) ai thấy một việc — gắn đối tác thì
      mọi người đọc được dữ liệu đối tác, không gắn gì thì chỉ người trong cuộc — và người vai «chỉ OKR» chưa dùng
      Việc ở lượt này; (4) Việc vào tin nhắc buổi sáng (quá hạn, sắp hạn cho người thực hiện; chờ đánh giá cho
      người giao) và «xong n» đóng được việc; (5) «Chuyển việc» ở màn Thành viên chuyển cả việc đang mở, và mục từ
      điển cũ «Chuyển việc 30 ngày» đã đổi theo; (6) ba câu vòng đời: Xoá khi chưa có lịch sử, Xong hay Huỷ là
      kết cục mở lại được, xoá vĩnh viễn bản ghi gắn chỉ gỡ liên kết. Tài liệu không tự đúc từ ghép tiếng Việt cho
      thuật ngữ kỹ thuật mà CONTEXT.md không có. Trả PASS khi đủ sáu điều, FAIL nêu điều thiếu.
    inputs: [CONTEXT.md, docs/api.md, docs/agent.md]
    evidence_required: [verdict, rationale, verified_at]
