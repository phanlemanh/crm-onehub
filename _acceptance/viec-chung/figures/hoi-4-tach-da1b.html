<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tách hàng chép việc cũ</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #fafafa;
      --color-ink:    #171717;
      --font-sans:    'Geist', system-ui, sans-serif;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <svg viewBox="0 0 1000 616" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hỏi-4: chép việc cần làm cũ ở hàng DA1 hay tách hàng DA1b">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#575757"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#fafafa"/>

      <text x="32" y="36" fill="#575757" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">HỎI-4 · CHÉP VIỆC CẦN LÀM CŨ Ở ĐÂU</text>
      <text x="32" y="66" fill="#171717" font-size="20" font-family="'Lora', serif">Chép việc cần làm cũ sang Việc trong cùng hàng, hay tách hàng riêng?</text>
      <text x="32" y="90" fill="#575757" font-size="12" font-family="'Geist', sans-serif">«Việc cần làm» là loại ghi trên dòng thời gian hôm nay: không có người thực hiện, không nhắc ai, ai cũng đánh dấu xong được.</text>

      <line x1="264" y1="144" x2="264" y2="392" stroke="#171717" stroke-width="1"/>
      <text x="276" y="120" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Hàng trước gộp · 16/10</text>
      <text x="276" y="136" fill="#575757" font-size="10" font-family="'Geist', sans-serif">DA0b · mở lại không trả việc cho người «chỉ OKR»</text>

      <rect x="440" y="196" width="320" height="24" fill="rgba(23,23,23,0.06)"/>
      <path d="M 440 196 V 188 H 760 V 196" fill="none" stroke="#171717" stroke-width="0.8"/>
      <rect x="490" y="166" width="220" height="16" rx="2" fill="#fafafa"/>
      <text x="600" y="178" fill="#171717" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">dòng thời gian có cả hai kiểu việc</text>

      <line x1="264" y1="208" x2="968" y2="208" stroke="#006B4F" stroke-width="1.6"/>
      <line x1="264" y1="392" x2="968" y2="392" stroke="#575757" stroke-width="1.2" stroke-dasharray="5,4"/>

      <line x1="440" y1="208" x2="440" y2="232" stroke="#006B4F" stroke-width="1"/>
      <line x1="760" y1="208" x2="760" y2="232" stroke="#006B4F" stroke-width="1"/>
      <line x1="640" y1="392" x2="640" y2="416" stroke="#575757" stroke-width="1"/>

      <circle cx="264" cy="208" r="5" fill="#171717"/>
      <circle cx="264" cy="392" r="5" fill="#171717"/>
      <circle cx="440" cy="208" r="6" fill="#006B4F"/>
      <circle cx="760" cy="208" r="6" fill="#006B4F"/>
      <circle cx="640" cy="392" r="6" fill="#fafafa" stroke="#575757" stroke-width="1.4"/>

      <rect x="32" y="200" width="80" height="18" rx="2" fill="rgba(0,107,79,0.08)" stroke="#006B4F" stroke-width="1.2"/>
      <text x="72" y="213" fill="#006B4F" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">MÁY KHUYÊN</text>
      <text x="32" y="244" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Tách phần chép dữ liệu</text>
      <text x="32" y="260" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif">ra hàng riêng ngay sau</text>
      <text x="32" y="278" fill="#575757" font-size="10" font-family="'Geist', sans-serif">hàng mới: DA1b</text>

      <rect x="32" y="384" width="68" height="18" rx="2" fill="none" stroke="#575757" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="66" y="397" fill="#575757" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">LỐI KHÁC</text>
      <text x="32" y="428" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Làm hết trong một hàng</text>
      <text x="32" y="444" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif">như lộ trình đang ghi</text>
      <text x="32" y="462" fill="#575757" font-size="10" font-family="'Geist', sans-serif">tất cả trong DA1</text>

      <rect x="376" y="232" width="208" height="112" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="392" y="256" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Việc chung gộp</text>
      <text x="392" y="272" fill="#575757" font-size="10" font-family="'Geist', sans-serif">DA1 · gộp sớm hơn</text>
      <text x="392" y="296" fill="#171717" font-size="11" font-family="'Geist', sans-serif">• Việc mới chạy</text>
      <text x="392" y="314" fill="#171717" font-size="11" font-family="'Geist', sans-serif">• Việc cần làm cũ vẫn sống,</text>
      <text x="402" y="332" fill="#171717" font-size="11" font-family="'Geist', sans-serif">đánh dấu xong như hôm nay</text>

      <rect x="616" y="232" width="352" height="112" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="632" y="256" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Chép việc cần làm cũ gộp</text>
      <text x="632" y="272" fill="#575757" font-size="10" font-family="'Geist', sans-serif">DA1b · có cổng duyệt riêng</text>
      <text x="632" y="296" fill="#171717" font-size="11" font-family="'Geist', sans-serif">• Chép việc cũ sang Việc — sửa dữ liệu production</text>
      <text x="632" y="314" fill="#171717" font-size="11" font-family="'Geist', sans-serif">• Đổi hai đường Tác nhân còn ghi việc cần làm</text>
      <text x="632" y="332" fill="#171717" font-size="11" font-family="'Geist', sans-serif">• Bỏ «Việc cần làm» khỏi dòng thời gian</text>

      <text x="656" y="380" fill="#575757" font-size="10" font-family="'Geist', sans-serif">không có khoảng hai kiểu việc</text>
      <rect x="456" y="416" width="512" height="112" rx="6" fill="#ffffff" stroke="#575757" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="472" y="440" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Việc chung gộp — muộn hơn</text>
      <text x="472" y="456" fill="#575757" font-size="10" font-family="'Geist', sans-serif">DA1 · thêm khoảng ba tiêu chí, một PR</text>
      <text x="472" y="480" fill="#171717" font-size="11" font-family="'Geist', sans-serif">• Việc mới chạy</text>
      <text x="472" y="498" fill="#171717" font-size="11" font-family="'Geist', sans-serif">• Chép việc cũ sang — sửa dữ liệu production trong cùng PR</text>
      <text x="472" y="516" fill="#171717" font-size="11" font-family="'Geist', sans-serif">• Đổi hai đường Tác nhân · bỏ «Việc cần làm» khỏi dòng thời gian</text>

      <line x1="264" y1="556" x2="960" y2="556" stroke="#575757" stroke-width="1" marker-end="url(#arrow)"/>
      <text x="264" y="548" fill="#575757" font-size="10" font-family="'Geist', sans-serif">thứ tự gộp vào nhánh chính — chỉ mốc 16/10 có ngày, khoảng cách không theo tỉ lệ ngày</text>

      <line x1="32" y1="576" x2="968" y2="576" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>
      <text x="32" y="600" fill="#575757" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CHÚ GIẢI</text>
      <circle cx="136" cy="596" r="5" fill="#171717"/>
      <text x="148" y="600" fill="#575757" font-size="10" font-family="'Geist', sans-serif">mốc chung của hai lối</text>
      <circle cx="292" cy="596" r="6" fill="#006B4F"/>
      <text x="304" y="600" fill="#575757" font-size="10" font-family="'Geist', sans-serif">mốc gộp — máy khuyên</text>
      <circle cx="452" cy="596" r="6" fill="#fafafa" stroke="#575757" stroke-width="1.4"/>
      <text x="464" y="600" fill="#575757" font-size="10" font-family="'Geist', sans-serif">mốc gộp — lối khác</text>
      <rect x="592" y="590" width="32" height="12" fill="rgba(23,23,23,0.06)"/>
      <text x="632" y="600" fill="#575757" font-size="10" font-family="'Geist', sans-serif">khoảng người dùng thấy hai kiểu việc</text>
    </svg>
  </div>
</body>
</html>
