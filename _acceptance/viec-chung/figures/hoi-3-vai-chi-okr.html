<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vai chỉ OKR và Việc</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #fafafa;
      --color-ink:    #171717;
      --font-sans:    'Geist', system-ui, sans-serif;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <svg viewBox="0 0 1000 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hỏi-3: người vai chỉ OKR thấy loại việc nào, theo hai lối">
      <rect width="100%" height="100%" fill="#fafafa"/>

      <text x="32" y="36" fill="#575757" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">HỎI-3 · VAI «CHỈ OKR» VÀ VIỆC Ở LƯỢT NÀY</text>
      <text x="32" y="66" fill="#171717" font-size="20" font-family="'Lora', serif">Người vai «chỉ OKR» thấy và nhận được loại việc nào?</text>
      <text x="32" y="90" fill="#575757" font-size="12" font-family="'Geist', sans-serif">Vai «chỉ OKR» chỉ dùng phần OKR, không đọc dữ liệu đối tác. Lượt này là hàng «Việc chung»; việc gắn KR đến ở hàng sau.</text>

      <rect x="556" y="196" width="200" height="104" rx="6" fill="rgba(0,107,79,0.08)" stroke="#006B4F" stroke-width="1.4"/>
      <rect x="556" y="316" width="200" height="104" rx="6" fill="none" stroke="#575757" stroke-width="1" stroke-dasharray="5,4"/>

      <line x1="32" y1="188" x2="968" y2="188" stroke="rgba(23,23,23,0.24)" stroke-width="0.8"/>
      <line x1="32" y1="308" x2="968" y2="308" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>
      <line x1="32" y1="428" x2="968" y2="428" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>
      <line x1="344" y1="120" x2="344" y2="428" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>
      <line x1="552" y1="120" x2="552" y2="428" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>
      <line x1="760" y1="120" x2="760" y2="428" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>

      <text x="32" y="144" fill="#666666" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LỐI CHỌN ↓ · LOẠI VIỆC →</text>
      <text x="448" y="144" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Việc gắn đối tác</text>
      <text x="448" y="162" fill="#575757" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">thoả thuận, công ty, cá nhân,</text>
      <text x="448" y="176" fill="#575757" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">kế hoạch 30 ngày</text>
      <text x="656" y="144" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Việc riêng, không gắn gì</text>
      <text x="656" y="162" fill="#575757" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">chỉ người giao, người thực hiện,</text>
      <text x="656" y="176" fill="#575757" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">người theo dõi thấy</text>
      <text x="864" y="144" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Việc gắn KR</text>
      <text x="864" y="162" fill="#575757" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">đến ở hàng «KR nối việc chung»</text>
      <text x="864" y="176" fill="#575757" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">(DA5), sau lượt này</text>

      <rect x="32" y="204" width="80" height="18" rx="2" fill="rgba(0,107,79,0.08)" stroke="#006B4F" stroke-width="1.2"/>
      <text x="72" y="217" fill="#006B4F" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">MÁY KHUYÊN</text>
      <text x="32" y="248" fill="#171717" font-size="13" font-weight="600" font-family="'Geist', sans-serif">Chặn ở lượt này</text>
      <text x="32" y="268" fill="#575757" font-size="11" font-family="'Geist', sans-serif">mở cùng lượt việc gắn KR (DA5)</text>
      <text x="32" y="286" fill="#575757" font-size="11" font-family="'Geist', sans-serif">phải thêm: không gì — cửa chặn đã có sẵn</text>

      <rect x="32" y="324" width="68" height="18" rx="2" fill="none" stroke="#575757" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="66" y="337" fill="#575757" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">LỐI KHÁC</text>
      <text x="32" y="368" fill="#171717" font-size="13" font-weight="600" font-family="'Geist', sans-serif">Mở việc riêng ngay</text>
      <text x="32" y="388" fill="#575757" font-size="11" font-family="'Geist', sans-serif">việc không gắn gì dùng được từ lượt này</text>
      <text x="32" y="406" fill="#575757" font-size="11" font-family="'Geist', sans-serif">phải thêm: phạm vi mới, lọc vai ở mọi lời đọc</text>

      <circle cx="448" cy="228" r="7" fill="none" stroke="#575757" stroke-width="1.2"/>
      <line x1="443" y1="233" x2="453" y2="223" stroke="#575757" stroke-width="1.2"/>
      <text x="448" y="260" fill="#575757" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Không thấy, không nhận</text>
      <text x="448" y="278" fill="#575757" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">như hôm nay</text>

      <circle cx="656" cy="228" r="7" fill="none" stroke="#006B4F" stroke-width="1.2"/>
      <line x1="651" y1="233" x2="661" y2="223" stroke="#006B4F" stroke-width="1.2"/>
      <text x="656" y="260" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Không thấy, không nhận</text>
      <text x="656" y="278" fill="#575757" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">cho tới khi hàng DA5 gộp</text>

      <path d="M 857 228 L 862 233 L 872 223" fill="none" stroke="#171717" stroke-width="1.6"/>
      <text x="864" y="260" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Thấy, nhận được</text>
      <text x="864" y="278" fill="#575757" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">khi hàng DA5 gộp</text>

      <circle cx="448" cy="348" r="7" fill="none" stroke="#575757" stroke-width="1.2"/>
      <line x1="443" y1="353" x2="453" y2="343" stroke="#575757" stroke-width="1.2"/>
      <text x="448" y="380" fill="#575757" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Không thấy, không nhận</text>
      <text x="448" y="398" fill="#575757" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">như hôm nay</text>

      <path d="M 649 348 L 654 353 L 664 343" fill="none" stroke="#171717" stroke-width="1.6"/>
      <text x="656" y="380" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Thấy, nhận được</text>
      <text x="656" y="398" fill="#575757" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">ngay lượt này</text>

      <path d="M 857 348 L 862 353 L 872 343" fill="none" stroke="#171717" stroke-width="1.6"/>
      <text x="864" y="380" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Thấy, nhận được</text>
      <text x="864" y="398" fill="#575757" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">khi hàng DA5 gộp</text>

      <text x="968" y="460" fill="#006B4F" font-size="14" font-style="italic" font-family="'Lora', serif" text-anchor="end">Hai lối chỉ khác nhau ở cột giữa; việc gắn đối tác thì cả hai đều «không».</text>
      <line x1="656" y1="432" x2="656" y2="444" stroke="#006B4F" stroke-width="1"/>

      <line x1="32" y1="476" x2="968" y2="476" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>
      <text x="32" y="500" fill="#575757" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CHÚ GIẢI</text>
      <path d="M 129 496 L 134 501 L 144 491" fill="none" stroke="#171717" stroke-width="1.6"/>
      <text x="156" y="500" fill="#575757" font-size="10" font-family="'Geist', sans-serif">thấy việc, được giao hay theo dõi</text>
      <circle cx="356" cy="496" r="7" fill="none" stroke="#575757" stroke-width="1.2"/>
      <line x1="351" y1="501" x2="361" y2="491" stroke="#575757" stroke-width="1.2"/>
      <text x="372" y="500" fill="#575757" font-size="10" font-family="'Geist', sans-serif">không thấy việc, không ai giao được cho họ</text>
      <rect x="640" y="490" width="24" height="12" rx="2" fill="rgba(0,107,79,0.08)" stroke="#006B4F" stroke-width="1.2"/>
      <text x="672" y="500" fill="#575757" font-size="10" font-family="'Geist', sans-serif">máy khuyên</text>
      <rect x="760" y="490" width="24" height="12" rx="2" fill="none" stroke="#575757" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="792" y="500" fill="#575757" font-size="10" font-family="'Geist', sans-serif">lối khác</text>
    </svg>
  </div>
</body>
</html>
