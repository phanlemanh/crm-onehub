        1 /<slug>/tin-hieu: [role=tablist] co hai tab, tab "Của tôi" aria-current=page; bam "Tất cả" (chuot that) ->
          url ket thuc /tin-hieu/tat-ca, tab "Tất cả" aria-current=page
