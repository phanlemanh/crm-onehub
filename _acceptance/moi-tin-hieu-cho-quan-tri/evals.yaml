      Kem: gth_hop cua LT2 van xanh (cmd rieng o suite).
      CHIEU DO: ban sao bo cau bao truoc -> do voi thong diep ghim "hop gui khong bao truoc quan tri thay ten".

  - id: E10
    criterion: AC-10
    executor: test
    cmd: config:executors.test.mth_trang_thai_man
    paths:
      - "apps/app/app/(app)/[slug]/tin-hieu/tat-ca/**"
