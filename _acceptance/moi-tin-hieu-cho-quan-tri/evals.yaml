        dang tai: co [data-tin-hieu-tat-ca-dang-tai] gom khung xuong ba o va >=3 dong; loi: VungTaiLoi voi
        m.tatCa.taiLoiTieuDe, bam "Thử lại" goi refetch cua query tatCa dung 1 lan; rong: ba o so 0 va Empty
