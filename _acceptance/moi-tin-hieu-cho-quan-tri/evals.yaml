  - id: E12
    criterion: AC-4
    executor: judgment
    question: |
      Đọc tệp chữ của trang Tín hiệu (bản tiếng Việt). Các chữ mới của thẻ «Tất cả», ba ô số, bộ lọc và câu báo trước
      trong hộp gửi có (a) nói bằng chữ người dùng CRM hiểu, không thuật ngữ máy, (b) không thừa chữ — xoá một chữ mà
      người đứng ở màn đó vẫn hiểu đúng thì chữ đó thừa, (c) gọi đúng tên «tín hiệu», «phòng ban», «lấy về» như phần
      chữ LT2 đã có trong cùng tệp? Trả lời từng vế (a)(b)(c), dẫn chữ cụ thể.
    inputs:
      - "apps/app/lib/messages/tin-hieu.ts"
      - "CONTEXT.md"

  - id: E13
    criterion: AC-10
    executor: script
    cmd: config:executors.script.mth_thiet_ke
    paths:
      - "apps/app/components/tin-hieu/**"
      - "apps/app/app/(app)/[slug]/tin-hieu/**"
