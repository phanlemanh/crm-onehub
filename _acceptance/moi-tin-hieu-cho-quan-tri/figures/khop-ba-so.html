<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khớp ba số</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&subset=vietnamese&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Geist', system-ui, sans-serif; background: #fafafa; color: #171717; padding: 3rem 2rem; display: flex; justify-content: center; }
    .frame { max-width: 1240px; width: 100%; }
    .eyebrow { font-family: 'Geist Mono', monospace; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #575757; margin-bottom: 1rem; }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Hình quyết định · Mọi tín hiệu cho quản trị</p>

    <svg viewBox="0 0 1200 576" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#575757"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#006B4F"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#fafafa"/>

      <text x="40" y="40" fill="#171717" font-size="24" font-family="'Lora', serif">Vì sao trang và lệnh ra cùng ba số</text>
      <text x="40" y="64" fill="#575757" font-size="12" font-family="'Geist', sans-serif">Lệnh kéo về và thẻ «Tất cả» đi hai đường từ máy chủ, rồi gặp nhau ở một cách đếm duy nhất, trên cùng một bản vẽ lộ trình.</text>

      <!-- Arrows first -->
      <path d="M200 236 H216 Q224 236 224 228 V160 Q224 152 232 152 H248" fill="none" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M200 260 H216 Q224 260 224 268 V336 Q224 344 232 344 H248" fill="none" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="448" y1="152" x2="488" y2="152" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="448" y1="344" x2="488" y2="344" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M688 152 H704 Q712 152 712 160 V224 Q712 232 720 232 H736" fill="none" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M688 344 H704 Q712 344 712 336 V272 Q712 264 720 264 H736" fill="none" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="824" y1="352" x2="824" y2="296" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="912" y1="248" x2="960" y2="248" stroke="#006B4F" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="1060" y1="320" x2="1060" y2="384" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="832" y="312" width="96" height="18" rx="2" fill="#fafafa"/>
      <text x="836" y="325" fill="#575757" font-size="10" font-family="'Geist', sans-serif">tập «đã có chỗ»</text>

      <!-- Server -->
      <rect x="40" y="216" width="160" height="64" rx="6" fill="#fafafa"/>
      <rect x="40" y="216" width="160" height="64" rx="6" fill="rgba(23,23,23,0.05)" stroke="#575757" stroke-width="1"/>
      <text x="120" y="244" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Máy chủ CRM</text>
      <text x="120" y="262" fill="#575757" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">mọi tín hiệu đã gửi</text>

      <!-- Path (a): pull command -->
      <rect x="248" y="120" width="200" height="64" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="348" y="148" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lệnh kéo về</text>
      <text x="348" y="166" fill="#575757" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">phản hồi có tên + mã phòng ban</text>

      <rect x="488" y="120" width="200" height="64" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="588" y="148" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chuyển thành dòng đếm</text>
      <text x="588" y="166" fill="#575757" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">phòng ban tính theo mã</text>

      <!-- Path (b): All tab -->
      <rect x="248" y="312" width="200" height="64" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="348" y="340" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Thẻ «Tất cả»</text>
      <text x="348" y="358" fill="#575757" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">danh sách mọi tín hiệu</text>

      <rect x="488" y="312" width="200" height="64" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="588" y="340" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chuyển thành dòng đếm</text>
      <text x="588" y="358" fill="#575757" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">phòng ban tính theo mã</text>

      <!-- Shared counter (focal) -->
      <rect x="736" y="200" width="176" height="96" rx="6" fill="#fafafa"/>
      <rect x="736" y="200" width="176" height="96" rx="6" fill="rgba(0,107,79,0.08)" stroke="#006B4F" stroke-width="1.4"/>
      <text x="824" y="244" fill="#171717" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hàm đếm chung</text>
      <text x="824" y="264" fill="#575757" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">một cách đếm, hai bên gọi</text>

      <!-- Roadmap drawing -->
      <rect x="736" y="352" width="176" height="64" rx="6" fill="#fafafa"/>
      <rect x="736" y="352" width="176" height="64" rx="6" fill="rgba(23,23,23,0.05)" stroke="#575757" stroke-width="1"/>
      <text x="824" y="380" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bản vẽ lộ trình</text>
      <text x="824" y="398" fill="#575757" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">cùng một bản dựng</text>

      <!-- Three numbers -->
      <rect x="960" y="176" width="200" height="144" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="976" y="200" fill="#575757" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">BA CON SỐ</text>
      <text x="976" y="228" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Tín hiệu 30 ngày qua</text>
      <text x="976" y="256" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Phòng ban có tín hiệu</text>
      <text x="976" y="272" fill="#575757" font-size="10" font-family="'Geist', sans-serif">đếm theo mã, không theo tên</text>
      <text x="976" y="300" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Quá 7 ngày chưa có chỗ</text>

      <!-- Goal -->
      <rect x="960" y="384" width="200" height="64" rx="32" fill="#fafafa"/>
      <rect x="960" y="384" width="200" height="64" rx="32" fill="rgba(0,107,79,0.08)" stroke="#006B4F" stroke-width="1.4"/>
      <text x="1060" y="412" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bằng nhau ngày 12/11</text>
      <text x="1060" y="430" fill="#575757" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">đọc trên trang, rồi chạy lệnh</text>

      <text x="248" y="452" fill="#575757" font-size="14" font-style="italic" font-family="'Lora', serif">Hai phòng ban trùng tên được đếm là hai, vì cả hai đường cùng đếm theo mã.</text>

      <!-- Legend -->
      <line x1="40" y1="496" x2="1160" y2="496" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>
      <text x="40" y="516" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>
      <rect x="40" y="528" width="24" height="16" rx="2" fill="rgba(23,23,23,0.05)" stroke="#575757" stroke-width="1"/>
      <text x="72" y="540" fill="#575757" font-size="10" font-family="'Geist', sans-serif">Nguồn dữ liệu</text>
      <rect x="192" y="528" width="24" height="16" rx="2" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="224" y="540" fill="#575757" font-size="10" font-family="'Geist', sans-serif">Một bước</text>
      <rect x="320" y="528" width="24" height="16" rx="2" fill="rgba(0,107,79,0.08)" stroke="#006B4F" stroke-width="1.4"/>
      <text x="352" y="540" fill="#575757" font-size="10" font-family="'Geist', sans-serif">Chỗ hai đường gặp nhau · đích phải đạt</text>
      <text x="1160" y="540" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.08em">TIÊU CHÍ AC-2 · AC-7 · AC-8</text>
    </svg>
  </div>
</body>
</html>
