schema_version: 1
feature_slug: tieng-viet-cho-crm
evals:
  - id: E1
    criterion: AC-1
    executor: ui-check
    steps:
      - "Khoi dong dev server theo config dev_server.start"
      - "Xoa sach cookie, gui Accept-Language: vi-VN,vi;q=0.9 -> chup evidence/E1-step1.png"
      - "Doc HTML tu luot ve DAU TIEN cua may chu va khang dinh <html lang=\"vi\">"
    expected: "chua tung chon + trinh duyet uu tien vi -> may chu ve ra lang=vi ngay luot dau; do o TANG VE, khong phai o ham resolver"
    evidence_required: [run_id, exit_code, verifier, verified_at, screenshot]

  - id: E2
    criterion: AC-2
    executor: ui-check
    steps:
      - "Xoa sach cookie, gui Accept-Language: en-US,en;q=0.9 -> chup evidence/E2-step1.png"
      - "Khang dinh <html lang=\"en\"> trong HTML may chu tra ve"
    expected: "chua tung chon + trinh duyet uu tien en -> lang=en"
    evidence_required: [run_id, exit_code, verifier, verified_at, screenshot]

  - id: E3
    criterion: AC-3
    executor: ui-check
    steps:
      - "Dat cookie ngon ngu = vi, mo mot trang bat ky -> chup evidence/E3-step1.png"
      - "Doc HTML luot ve dau tien, khang dinh <html lang=\"vi\">"
      - "Chup sau khi hydrate -> evidence/E3-step2.png; hai anh phai giong nhau ve thu tieng"
    expected: "lang=vi co trong HTML may chu tra ve, khong phai chi sau khi hydrate"
    evidence_required: [run_id, exit_code, verifier, verified_at, screenshot]

  - id: E4
    criterion: AC-4
    executor: script
    cmd: config:executors.script.rang_ngon_ngu_la
    expected: "exit 0; gia tri khong hop le BCP 47 -> tra ve en, khong nem loi. Chieu do: bo buoc kiem hop le thi chan nay do voi thong diep ghim ten gia tri gay loi"
    paths: ["apps/app/lib/locale/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-5
    executor: script
    cmd: config:executors.script.rang_cookie
    expected: "exit 0; Set-Cookie mang DU ba thuoc tinh Max-Age=31536000, Path=/, SameSite=Lax. Chieu do: bo Max-Age (thanh cookie phien) thi chan nay do va goi ten thuoc tinh thieu"
    paths: ["apps/app/lib/locale/**", "apps/app/components/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-6
    executor: ui-check
    steps:
      - "Dat ngon ngu vi, mo man cong ty -> chup evidence/E6-step1.png"
      - "Doc TOAN BO chu nhin thay tren trang da ve (khong grep ma nguon) va liet ke moi chuoi tieng Anh con lai"
      - "Loc bo lang loc du lieu nguoi nhap (ten cong ty, ten mien)"
      - "Mo bo loc facet va tab de bat ba chuoi bang dung chung -> chup evidence/E6-step2.png"
    expected: "0 chuoi giao dien tieng Anh nhin thay; hai nhan trinh-doc-man-hinh khoa cung trong bang dung chung nam ngoai pham vi va KHONG tinh"
    evidence_required: [run_id, exit_code, verifier, verified_at, screenshot]

  - id: E7
    criterion: AC-7
    executor: script
    cmd: config:executors.script.rang_du_lieu_khong_dich
    expected: "exit 0; CHINH phan tu ve ten cong ty mang translate=no (khong phai mot the boc nao do o tren), va noi dung ten giu nguyen. Chieu do: go translate=no khoi phan tu do thi chan nay do"
    paths: ["apps/app/app/(app)/[slug]/companies/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E8
    criterion: AC-8
    executor: script
    cmd: config:executors.script.rang_dinh_dang
    expected: "exit 0; MA TRAN DAY DU 5 ham x 2 ngon ngu, moi o mot chuoi ky vong ghim san: formatDay/formatCount/formatMoney/formatMoneyCompact/formatPercent tren cung mot gia tri co dinh. VA dem so cho khai cung vung trong apps/app + packages/ui/src/lib = 0. Chieu do: tra MOT ham ve en-US thi chan nay do va goi dung ten ham do"
    paths: ["packages/ui/src/lib/format.ts", "apps/app/components/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E9
    criterion: AC-9
    executor: ui-check
    steps:
      - "Mo man cong ty o tieng Viet, dat be rong cua so 768px -> chup evidence/E9-step1.png"
      - "Doc anh: khang dinh khong TIEU DE COT nao ket thuc bang dau ba cham"
      - "Dat lai 1440px -> chup evidence/E9-step2.png de doi chieu"
    expected: "o 768px khong tieu de cot nao bi cat cut; o du lieu dai van duoc phep cat"
    evidence_required: [run_id, exit_code, verifier, verified_at, screenshot]

  - id: E10
    criterion: AC-10
    executor: ui-check
    steps:
      - "Mo bat ky trang nao, nhan Tab cho toi khi tieu diem toi nut doi tieng -> chup evidence/E10-step1.png"
      - "Doc anh va khang dinh CO vong tieu diem nhin thay duoc quanh nut"
      - "Nhan Enter -> chup evidence/E10-step2.png; khang dinh menu da mo"
    expected: "vong tieu diem nhin thay duoc trong anh, va Enter mo duoc menu — khong dua vao bo quet a11y tu dong"
    evidence_required: [run_id, exit_code, verifier, verified_at, screenshot]

  - id: E11
    criterion: AC-12
    executor: ui-check
    steps:
      - "Dat cookie ngon ngu = en, gui Accept-Language: vi-VN -> chup evidence/E11-step1.png"
      - "Khang dinh <html lang=\"en\"> — lua chon da luu thang ngon ngu trinh duyet"
    expected: "lua chon da luu thang header trinh duyet; do o tang ve"
    evidence_required: [run_id, exit_code, verifier, verified_at, screenshot]

  - id: E12
    criterion: AC-11
    executor: judgment
    question: "Hai cau. (1) Muoi nhan cot tieng Viet da khai trong muc Notes cua contract — Ten, Ten mien, Nganh, Phu trach, Ca nhan, Thoa thuan mo, Ngay tao, Hoat dong cuoi, Bo sung, Luu tru — doc nhu tieng Viet cua nguoi trong nghe quan he doi tac, hay nhu ban dich may? (2) Nhan nao lap lai danh tu ma man hinh DA noi, tuc pham luat ngan-theo-ngu-canh trong CONTEXT.md? Goi ten nhan do."
    inputs: [contract.md, ../../CONTEXT.md, evidence/ban-mau-man-cong-ty.html]
    paths:
      - "_acceptance/tieng-viet-cho-crm/contract.md"
      - "CONTEXT.md"
      - "_acceptance/tieng-viet-cho-crm/evidence/ban-mau-man-cong-ty.html"
    evidence_required: [judged_by, verdict, rationale]
