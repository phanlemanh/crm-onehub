<!DOCTYPE html>
<html lang="vi" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google" content="notranslate">
  <title>Hoàn tác Căn chỉnh</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #fafafa;
      --color-ink:    #171717;
      --color-muted:  #575757;
      --color-accent: #006B4F;
      --font-sans:    'Geist', -apple-system, 'Helvetica Neue', Arial, sans-serif;
      --font-serif:   'Lora', Georgia, 'Times New Roman', serif;
      --font-mono:    'Geist Mono', 'SF Mono', Menlo, Consolas, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1240px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.01em;
      line-height: 1.3;
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    svg .sans { font-family: var(--font-sans); }
    svg .mono { font-family: var(--font-mono); }
    svg .serif { font-family: var(--font-serif); }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Luồng · kara-gop-y-luot-2 · AC-7</p>
    <h1>Hoàn tác sau khi nhận «Căn chỉnh» chỉ gỡ đúng liên kết vừa tạo</h1>

    <svg viewBox="0 0 1200 656" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Luồng nhận góp ý Căn chỉnh: chụp danh sách liên kết trước, nhận, làm mới, so hai danh sách rồi quyết biên nhận có hay không có Hoàn tác">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#575757"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#006B4F"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#fafafa"/>

      <text class="mono" x="40" y="48" fill="#575757" font-size="9" font-weight="500" letter-spacing="0.18em">NHẬN MỘT GÓP Ý «CĂN CHỈNH» ĐI QUA BỐN CHẶNG, RỒI RẼ HAI NGẢ</text>
      <text class="mono" x="1160" y="48" fill="#575757" font-size="9" font-weight="500" letter-spacing="0.12em" text-anchor="end">AC-7</text>

      <line x1="240" y1="176" x2="268" y2="176" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="424" y1="176" x2="452" y2="176" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="648" y1="176" x2="676" y2="176" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M952,176 H1028 Q1036,176 1036,184 V324" fill="none" stroke="#006B4F" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
      <path d="M816,264 V284 Q816,292 808,292 H608 Q600,292 600,300 V324" fill="none" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="1044" y="244" width="32" height="16" rx="2" fill="#fafafa"/>
      <text class="mono" x="1048" y="256" fill="#006B4F" font-size="9" font-weight="600" letter-spacing="0.08em">CÓ</text>

      <rect x="628" y="264" width="156" height="16" rx="2" fill="#fafafa"/>
      <text class="mono" x="706" y="276" fill="#575757" font-size="9" text-anchor="middle" letter-spacing="0.08em">KHÔNG · ĐÍCH ĐÃ CĂN SẴN</text>

      <rect x="40" y="136" width="200" height="80" rx="6" fill="#fafafa"/>
      <rect data-hop x="40" y="136" width="200" height="80" rx="6" fill="rgba(23,23,23,0.03)" stroke="rgba(23,23,23,0.30)" stroke-width="1"/>
      <text class="sans" x="56" y="172" fill="#171717" font-size="12" font-weight="600">Chụp danh sách liên kết</text>
      <text class="sans" x="56" y="192" fill="#171717" font-size="12" font-weight="600">căn chỉnh TRƯỚC</text>

      <rect x="272" y="136" width="152" height="80" rx="6" fill="#fafafa"/>
      <rect data-hop x="272" y="136" width="152" height="80" rx="6" fill="rgba(23,23,23,0.03)" stroke="rgba(23,23,23,0.30)" stroke-width="1"/>
      <text class="sans" x="288" y="172" fill="#171717" font-size="12" font-weight="600">Nhận góp ý</text>
      <text class="sans" x="288" y="192" fill="#171717" font-size="12" font-weight="600">Căn chỉnh</text>

      <rect x="456" y="136" width="192" height="80" rx="6" fill="#fafafa"/>
      <rect data-hop x="456" y="136" width="192" height="80" rx="6" fill="rgba(23,23,23,0.03)" stroke="rgba(23,23,23,0.30)" stroke-width="1"/>
      <text class="sans" x="472" y="172" fill="#171717" font-size="12" font-weight="600">Làm mới Mục tiêu</text>
      <text class="sans" x="472" y="192" fill="#575757" font-size="11">danh sách SAU</text>

      <polygon data-hop points="680,176 816,88 952,176 816,264" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text class="sans" x="816" y="160" fill="#171717" font-size="12" font-weight="600" text-anchor="middle">Có liên kết trong SAU</text>
      <text class="sans" x="816" y="180" fill="#171717" font-size="12" font-weight="600" text-anchor="middle">mà không có trong TRƯỚC,</text>
      <text class="sans" x="816" y="200" fill="#171717" font-size="12" font-weight="600" text-anchor="middle">khớp đích?</text>

      <rect x="880" y="328" width="280" height="104" rx="6" fill="#fafafa"/>
      <rect data-hop x="880" y="328" width="280" height="104" rx="6" fill="rgba(0,107,79,0.08)" stroke="#006B4F" stroke-width="1.4"/>
      <text class="sans" x="896" y="364" fill="#171717" font-size="12" font-weight="600">Biên nhận có Hoàn tác</text>
      <rect data-hop x="896" y="384" width="72" height="24" rx="4" fill="#ffffff" stroke="#006B4F" stroke-width="1"/>
      <text class="sans" x="932" y="400" fill="#006B4F" font-size="11" font-weight="600" text-anchor="middle">Hoàn tác</text>
      <text class="sans" x="980" y="401" fill="#006B4F" font-size="12" font-weight="600">→ gỡ đúng liên kết đó</text>

      <rect x="440" y="328" width="320" height="104" rx="6" fill="#fafafa"/>
      <rect data-hop x="440" y="328" width="320" height="104" rx="6" fill="rgba(23,23,23,0.03)" stroke="rgba(23,23,23,0.30)" stroke-width="1"/>
      <text class="sans" x="456" y="372" fill="#171717" font-size="12" font-weight="600">Biên nhận không có Hoàn tác</text>
      <text class="sans" x="456" y="396" fill="#575757" font-size="11">không gỡ liên kết người dùng tự tạo</text>

      <line x1="40" y1="476" x2="1160" y2="476" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>
      <text class="mono" x="40" y="504" fill="#575757" font-size="9" font-weight="500" letter-spacing="0.18em">VÍ DỤ</text>

      <rect x="40" y="532" width="64" height="20" rx="2" fill="transparent" stroke="rgba(23,23,23,0.45)" stroke-width="0.8"/>
      <text class="mono" x="72" y="546" fill="#171717" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="0.08em">TRƯỚC</text>
      <rect data-hop x="116" y="528" width="40" height="28" rx="4" fill="#ffffff" stroke="rgba(23,23,23,0.45)" stroke-width="1"/>
      <text class="sans" x="136" y="547" fill="#171717" font-size="12" font-weight="600" text-anchor="middle">Y</text>
      <line x1="172" y1="542" x2="204" y2="542" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="216" y="532" width="48" height="20" rx="2" fill="transparent" stroke="rgba(23,23,23,0.45)" stroke-width="0.8"/>
      <text class="mono" x="240" y="546" fill="#171717" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="0.08em">SAU</text>
      <rect data-hop x="276" y="528" width="40" height="28" rx="4" fill="#ffffff" stroke="rgba(23,23,23,0.45)" stroke-width="1"/>
      <text class="sans" x="296" y="547" fill="#171717" font-size="12" font-weight="600" text-anchor="middle">Y</text>
      <rect data-hop x="324" y="528" width="64" height="28" rx="4" fill="rgba(0,107,79,0.08)" stroke="#006B4F" stroke-width="1"/>
      <text class="sans" x="356" y="547" fill="#006B4F" font-size="12" font-weight="600" text-anchor="middle">X mới</text>
      <line x1="404" y1="542" x2="436" y2="542" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="448" y="532" width="80" height="20" rx="2" fill="transparent" stroke="rgba(0,107,79,0.55)" stroke-width="0.8"/>
      <text class="mono" x="488" y="546" fill="#006B4F" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="0.08em">HOÀN TÁC</text>
      <rect data-hop x="540" y="528" width="40" height="28" rx="4" fill="#ffffff" stroke="rgba(23,23,23,0.45)" stroke-width="1"/>
      <text class="sans" x="560" y="547" fill="#171717" font-size="12" font-weight="600" text-anchor="middle">Y</text>
      <rect data-hop x="588" y="528" width="64" height="28" rx="4" fill="none" stroke="rgba(23,23,23,0.30)" stroke-width="1" stroke-dasharray="3,3"/>
      <text class="sans" x="620" y="547" fill="#575757" font-size="12" text-anchor="middle" text-decoration="line-through">X mới</text>
      <text class="sans" x="672" y="547" fill="#171717" font-size="14">gỡ X mới, <tspan fill="#575757">Y còn.</tspan></text>

      <line x1="40" y1="592" x2="1160" y2="592" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>
      <text class="mono" x="40" y="624" fill="#575757" font-size="9" font-weight="500" letter-spacing="0.18em">CHÚ GIẢI</text>
      <rect x="124" y="614" width="24" height="12" rx="2" fill="rgba(0,107,79,0.08)" stroke="#006B4F" stroke-width="1"/>
      <text class="sans" x="156" y="624" fill="#575757" font-size="11">biên nhận có Hoàn tác · liên kết mới</text>
      <rect x="400" y="614" width="24" height="12" rx="2" fill="rgba(23,23,23,0.03)" stroke="rgba(23,23,23,0.30)" stroke-width="1"/>
      <text class="sans" x="432" y="624" fill="#575757" font-size="11">một chặng, hoặc biên nhận không Hoàn tác</text>
      <polygon points="704,620 716,612 728,620 716,628" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text class="sans" x="736" y="624" fill="#575757" font-size="11">câu máy tự xét</text>
    </svg>
  </div>
</body>
</html>
