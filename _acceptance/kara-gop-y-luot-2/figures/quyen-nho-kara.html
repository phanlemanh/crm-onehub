<!DOCTYPE html>
<html lang="vi" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google" content="notranslate">
  <title>Quyền nhờ Kara</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #fafafa;
      --color-ink:    #171717;
      --color-muted:  #575757;
      --color-accent: #006B4F;
      --font-sans:    'Geist', -apple-system, 'Helvetica Neue', Arial, sans-serif;
      --font-serif:   'Lora', Georgia, 'Times New Roman', serif;
      --font-mono:    'Geist Mono', 'SF Mono', Menlo, Consolas, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1240px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.01em;
      line-height: 1.3;
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    svg .sans { font-family: var(--font-sans); }
    svg .mono { font-family: var(--font-mono); }
    svg .serif { font-family: var(--font-serif); }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Quyết định · kara-gop-y-luot-2 · AC-10</p>
    <h1>Ai được nhờ Kara đọc một Mục tiêu, và người đó thấy những góp ý nào</h1>

    <svg viewBox="0 0 1200 676" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Quyết định ba nhánh khi một người bấm Nhờ Kara trên một Mục tiêu: sửa được Mục tiêu, sửa được ít nhất một KR, hoặc bị từ chối">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#575757"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#006B4F"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#fafafa"/>

      <text class="mono" x="40" y="48" fill="#575757" font-size="9" font-weight="500" letter-spacing="0.18em">MỘT LẦN BẤM NHỜ KARA ĐI QUA HAI CÂU HỎI, RA MỘT TRONG BA KẾT QUẢ</text>
      <text class="mono" x="1160" y="48" fill="#575757" font-size="9" font-weight="500" letter-spacing="0.12em" text-anchor="end">AC-10</text>

      <line x1="232" y1="176" x2="276" y2="176" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="520" y1="176" x2="660" y2="176" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="400" y1="240" x2="400" y2="284" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="520" y1="352" x2="660" y2="352" stroke="#006B4F" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
      <path d="M400,416 V488 Q400,496 408,496 H660" fill="none" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="572" y="150" width="36" height="16" rx="2" fill="#fafafa"/>
      <text class="mono" x="590" y="162" fill="#575757" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="0.08em">CÓ</text>

      <rect x="572" y="326" width="36" height="16" rx="2" fill="#fafafa"/>
      <text class="mono" x="590" y="338" fill="#006B4F" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="0.08em">CÓ</text>

      <rect x="408" y="252" width="48" height="16" rx="2" fill="#fafafa"/>
      <text class="mono" x="412" y="264" fill="#575757" font-size="9" font-weight="600" letter-spacing="0.08em">KHÔNG</text>

      <rect x="408" y="444" width="48" height="16" rx="2" fill="#fafafa"/>
      <text class="mono" x="412" y="456" fill="#575757" font-size="9" font-weight="600" letter-spacing="0.08em">KHÔNG</text>

      <rect x="40" y="148" width="192" height="56" rx="28" fill="#fafafa"/>
      <rect data-hop x="40" y="148" width="192" height="56" rx="28" fill="rgba(23,23,23,0.03)" stroke="rgba(23,23,23,0.30)" stroke-width="1"/>
      <text class="sans" x="136" y="172" fill="#171717" font-size="12" font-weight="600" text-anchor="middle">Người bấm Nhờ Kara</text>
      <text class="sans" x="136" y="190" fill="#171717" font-size="12" font-weight="600" text-anchor="middle">trên một Mục tiêu</text>

      <polygon data-hop points="280,176 400,112 520,176 400,240" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text class="sans" x="400" y="180" fill="#171717" font-size="12" font-weight="600" text-anchor="middle">Sửa được Mục tiêu?</text>

      <polygon data-hop points="280,352 400,288 520,352 400,416" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text class="sans" x="400" y="348" fill="#171717" font-size="12" font-weight="600" text-anchor="middle">Sửa được ít nhất</text>
      <text class="sans" x="400" y="366" fill="#171717" font-size="12" font-weight="600" text-anchor="middle">một KR?</text>

      <rect x="664" y="136" width="400" height="80" rx="6" fill="#fafafa"/>
      <rect data-hop x="664" y="136" width="400" height="80" rx="6" fill="rgba(23,23,23,0.03)" stroke="rgba(23,23,23,0.30)" stroke-width="1"/>
      <text class="sans" x="680" y="172" fill="#171717" font-size="12" font-weight="600">Kara đọc cả Mục tiêu</text>
      <text class="sans" x="680" y="192" fill="#575757" font-size="11">thấy mọi góp ý</text>

      <rect x="664" y="296" width="400" height="112" rx="6" fill="#fafafa"/>
      <rect data-hop x="664" y="296" width="400" height="112" rx="6" fill="rgba(0,107,79,0.08)" stroke="#006B4F" stroke-width="1.4"/>
      <text class="sans" x="680" y="332" fill="#171717" font-size="12" font-weight="600">Kara đọc cả Mục tiêu</text>
      <text class="sans" x="680" y="356" fill="#006B4F" font-size="12" font-weight="600">chỉ thấy góp ý của KR mình sửa được</text>
      <text class="sans" x="680" y="380" fill="#575757" font-size="11">góp ý cấp Mục tiêu bị ẩn và không quyết được</text>

      <rect x="664" y="472" width="160" height="48" rx="6" fill="#fafafa"/>
      <rect data-hop x="664" y="472" width="160" height="48" rx="6" fill="rgba(23,23,23,0.03)" stroke="rgba(23,23,23,0.30)" stroke-width="1"/>
      <text class="sans" x="680" y="500" fill="#171717" font-size="12" font-weight="600">Từ chối</text>

      <line x1="40" y1="552" x2="1160" y2="552" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>
      <rect x="40" y="572" width="112" height="20" rx="2" fill="transparent" stroke="rgba(23,23,23,0.45)" stroke-width="0.8"/>
      <text class="mono" x="96" y="586" fill="#171717" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="0.08em">TRƯỚC KHI SỬA</text>
      <text class="serif" x="168" y="588" fill="#171717" font-size="14" font-style="italic">người phụ trách nhiều KR chỉ nhờ được cho KR đầu tiên.</text>

      <line x1="40" y1="616" x2="1160" y2="616" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>
      <text class="mono" x="40" y="644" fill="#575757" font-size="9" font-weight="500" letter-spacing="0.18em">CHÚ GIẢI</text>
      <rect x="124" y="634" width="24" height="12" rx="2" fill="rgba(0,107,79,0.08)" stroke="#006B4F" stroke-width="1"/>
      <text class="sans" x="156" y="644" fill="#575757" font-size="11">đường vòng này đổi</text>
      <rect x="312" y="634" width="24" height="12" rx="2" fill="rgba(23,23,23,0.03)" stroke="rgba(23,23,23,0.30)" stroke-width="1"/>
      <text class="sans" x="344" y="644" fill="#575757" font-size="11">kết quả giữ nguyên</text>
      <polygon points="496,640 508,632 520,640 508,648" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text class="sans" x="528" y="644" fill="#575757" font-size="11">câu máy tự xét</text>
    </svg>
  </div>
</body>
</html>
