<!DOCTYPE html>
<html lang="vi" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google" content="notranslate">
  <title>Vòng đời vùng Kara</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #fafafa;
      --color-ink:    #171717;
      --color-muted:  #575757;
      --color-accent: #006B4F;
      --font-sans:    'Geist', -apple-system, 'Helvetica Neue', Arial, sans-serif;
      --font-serif:   'Lora', Georgia, 'Times New Roman', serif;
      --font-mono:    'Geist Mono', 'SF Mono', Menlo, Consolas, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1240px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.01em;
      line-height: 1.3;
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    svg .sans { font-family: var(--font-sans); }
    svg .mono { font-family: var(--font-mono); }
    svg .serif { font-family: var(--font-serif); }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Trạng thái · kara-gop-y-luot-2 · AC-1 · AC-2 · AC-3 · AC-4 · AC-5</p>

      <rect width="100%" height="100%" fill="#fafafa"/>

      <rect data-hop x="320" y="320" width="224" height="96" rx="6" fill="rgba(23,23,23,0.03)" stroke="rgba(23,23,23,0.30)" stroke-width="1"/>

      <text class="sans" x="336" y="372" fill="#575757" font-size="11">mỗi góp ý một dòng,</text>
      <text class="sans" x="336" y="392" fill="#575757" font-size="11">không dấu tia sáng riêng</text>

      <rect x="600" y="320" width="200" height="96" rx="6" fill="#fafafa"/>
      <rect data-hop x="600" y="320" width="200" height="96" rx="6" fill="rgba(23,23,23,0.03)" stroke="rgba(23,23,23,0.30)" stroke-width="1"/>

      <polygon points="632,732 644,724 656,732 644,740" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text class="sans" x="664" y="736" fill="#575757" font-size="11">câu máy tự xét</text>
      <line x1="784" y1="732" x2="820" y2="732" stroke="#575757" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

  </div>

</html>
