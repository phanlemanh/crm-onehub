schema_version: 1
slug: chi-quan-tri-sua-duoc-truong

evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.cqt_ham_quyen
    paths:
      - "packages/auth/src/**"
      - "packages/auth/test/quyen-truong.spec.ts"
    expected: |
      Ma tran viet truoc bon ca [owner true, admin true, member false, null false]; mot test
      khang dinh tap vai trong ma tran (bo null) bang dung WORKSPACE_ROLES.
      CHIEU DO: canManageFields tra true cho member -> do voi thong diep ghim "member: true".

  - id: E2
    criterion: AC-2
    executor: test
    layer: backend-effect
    cmd: config:executors.test.cqt_member_bi_chan
    paths:
      - "apps/api/src/fields/**"
      - "packages/auth/src/**"
      - "apps/api/test/chi-quan-tri-truong.spec.ts"
    expected: |
      Qua HTTP that (tRPC). Ma tran viet truoc BA loi x BAY thao tac = 21 ca: loi (a) phien
      member, (b) khoa API cua member (header x-api-key, khoa tao bang auth.api cho dung user
      do), (c) phien cua nguoi khong co hang member. Bay thao tac: create, update, reorder,
      archive, restore, delete, backfill; moi ca tren fixture rieng do owner tao truoc. Moi ca:
      HTTP 403 va thong diep chua cau khong-du-quyen cua fields-config; roi doc thang DB:
      create -> khong co hang voi nhan do; update -> nhan cu; reorder -> vi tri cu; archive ->
      archivedAt van null; restore -> archivedAt van co; delete -> hang con; backfill -> khong
      co agentTask moi cho truong do. Dem ca = 21.
      CHIEU DO: bo requireManager o mot thao tac (vd delete) -> do voi thong diep ghim loi va
      ten thao tac; requireManager bo qua role null -> loi (c) do voi thong diep ghim
      "non-member <thao tac>".

  - id: E3
    criterion: AC-3
    executor: test
    layer: backend-effect
    cmd: config:executors.test.cqt_quan_tri_lam_duoc
    paths:
      - "apps/api/src/fields/**"
      - "packages/auth/src/**"
      - "apps/api/test/chi-quan-tri-truong.spec.ts"
    expected: |
      Cung ma tran bay thao tac cua E2, chay cho BA loi: phien admin, phien owner, khoa API cua
      admin (21 ca): moi ca HTTP 200 va hieu ung DB dung (tao co hang, nhan moi, thu tu moi,
      archivedAt co, archivedAt null, hang het, backfill tra queued). Dem ca = 21. Doi chung
      duong cua E2 tren cung dang fixture.
      CHIEU DO: requireManager dung canManageOnboarding sai huong (chi owner) hoac chan het ->
      admin do voi thong diep ghim "admin <thao tac>".

  - id: E4
    criterion: AC-4
    executor: test
    layer: backend-effect
    cmd: config:executors.test.cqt_member_doc_duoc
    paths:
      - "apps/api/src/fields/**"
      - "apps/api/test/chi-quan-tri-truong.spec.ts"
    expected: |
      Phien member goi list, byKey, filters, coverage tren truong owner da tao: bon ca HTTP 200,
      list chua truong do, byKey tra dung khoa. Dem ca = 4.
      CHIEU DO: gan requireManager vao list -> do voi thong diep ghim "member list".

  - id: E5
    criterion: AC-5
    executor: test
    layer: backend-effect
    cmd: config:executors.test.cqt_access
    paths:
      - "apps/api/src/fields/**"
      - "packages/auth/src/**"
      - "apps/api/test/chi-quan-tri-truong.spec.ts"
    expected: |
      fields.access voi bon phien: owner true, admin true, member false, nguoi co phien nhung
      khong co hang member -> false (HTTP 200, khong 500). Dem ca = 4.
      CHIEU DO: access tra true co dinh -> member do voi thong diep ghim "member canManage".

  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.cqt_man_khoa
    paths:
      - "apps/app/app/(app)/[slug]/settings/fields/**"
      - "apps/app/components/crm/fields/**"
      - "apps/app/test/chi-quan-tri-truong.dom.tsx"
    expected: |
      jsdom, tRPC gia. FieldsSettings voi access {canManage:false}: danh sach hien truong gia;
      co [data-trang-thai=ST-truong-khong-quyen] voi cau khoa; nut Truong moi, nut Them cua
      goi y, tay keo, menu dong, Khoi phuc deu disabled; bam dong khong goi onEdit (URL khong
      doi); dat ?field=new va ?field=<khoa> -> khong co o sua (khong co o nhap Nhan). Voi
      {canManage:true}: khong co dong khoa, cac nut tren khong disabled, bam dong mo o sua.
      Access dang tai -> tinh la khoa. Moi khang dinh ghim ten nut.
      CHIEU DO: bo khoa o nut Truong moi -> do voi thong diep ghim "Truong moi disabled".

  - id: E7
    criterion: AC-7
    executor: test
    cmd: config:executors.test.cqt_sheet_khoa
    paths:
      - "apps/app/components/crm/fields/**"
      - "apps/app/test/chi-quan-tri-truong.dom.tsx"
    expected: |
      Cung khang dinh E6 tren FieldsSheet (bang Truong mo tu ho so) cho hai vai.
      CHIEU DO: FieldsSheet khong doc access -> member do voi thong diep ghim "sheet dong khoa".

  - id: E8
    criterion: AC-8
    executor: test
    cmd: config:executors.test.cqt_fields_hoi_quy
    paths:
      - "apps/api/src/fields/**"
      - "apps/api/test/fields.spec.ts"
    expected: |
      Chay toan bo apps/api/test/fields.spec.ts sau khi doi loi goi sang dang co actingUserId
      (tai khoan chu duoc gieo lam owner). Moi khang dinh cu giu nguyen; chi dong goi doi.
      CHIEU DO: bai kiem cu da chung o vong truong-tu-tao-o-cai-dat; vong nay ghi exit 0.

  - id: E9
    criterion: AC-9
    executor: ui-check
    layer: ui-observed
    cmd: config:executors.design.ui_check
    steps:
      - "Dung api va app cua CAY DANG XET; cong lay tu APP_URL va API_URL; khong sua tep nao trong cay"
      - "CHAN CAY: dat dau moc .svg vao apps/app/public roi xin lai qua APP_URL; xin fields.access qua API_URL — thieu dau moc hoac thu tuc access khong co -> thoat ma 2"
      - "Dang nhap bang `cd apps/api && bun run dev:session <email>` cho mot quan tri va mot thanh vien, dat cookie vao trinh duyet chup"
      - "GIEO bang thu tuc that qua HTTP voi cookie quan tri: tao mot truong tu tao va luu tru mot truong khac, de man co ca dong dang dung, goi y va da luu tru"
      - "Chup Cai dat › Truong cho thanh vien va cho quan tri o 1440 va 768: evidence/E9-<vai>-<kho>.png"
      - "Mo ho so mot cong ty, mo bang Truong tu ho so, chup cho thanh vien va quan tri o 1440: evidence/E9-bang-<vai>-1440.png"
    inputs:
      - _acceptance/chi-quan-tri-sua-duoc-truong/evidence/
    paths:
      - "apps/app/app/(app)/[slug]/settings/fields/**"
      - "apps/app/components/crm/fields/**"
    expected: |
      Nhin thay tren anh: ban thanh vien co dong «Cần quyền quản trị để đổi trường của cả đội.»
      va nut Truong moi, Them, Khoi phuc mo — ca o Cai dat › Truong lan o bang Truong mo tu ho
      so; ban quan tri khong co dong do va nut sang. Kho 768 khong co gi tran ngang. Thieu anh
      nao -> khong dat.
