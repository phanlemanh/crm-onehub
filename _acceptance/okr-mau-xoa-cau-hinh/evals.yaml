  - id: E8
    criterion: AC-8
    executor: judgment
    question: >-
      Đọc mục «Bộ OKR mẫu» của docs/setup.md như một người mới vào kho. Mục có nói rõ ba điều không:
      (1) `--xoa` và nạp lại xoá phiên bản cấu hình chương trình OKR do người mẫu tạo, kể cả bản còn
      sót từ một lần xoá trước; (2) mã đơn vị mẫu được gỡ khỏi các phiên bản cấu hình khác, còn các phiên
      bản ấy ở lại; (3) hệ quả: cấu hình đang dùng lùi về bản trước phiên mẫu, hoặc về mặc định khi chưa
      có bản nào. Mục còn câu nói phiên bản do người mẫu tạo «vẫn còn sau --xoa» không? Chữ có tự đúc từ
      ghép tiếng Việt cho thuật ngữ kỹ thuật mà CONTEXT.md không có không?
    inputs: [docs/setup.md, CONTEXT.md, _acceptance/okr-mau-xoa-cau-hinh/contract.md]
    expected: >-
      PASS khi mục nói đủ ba ý, không còn câu cũ, không chữ tự đúc; FAIL nêu ý thiếu, câu cũ còn, hay chữ tự đúc.
    evidence_required: [run_id, verdict, rationale]
    paths: [docs/setup.md]

  - id: E9
    criterion: AC-9
    executor: script
    cmd: config:executors.script.omc_dot_bien
    expected: "exit 0; _acceptance/okr-mau-xoa-cau-hinh/rang/dot-bien.mjs trên bản sao cây (dungBanSao/thayMotLan/goBanSao của _acceptance/ca-chap-chon-cach-ly/rang/ban-sao.mjs), SO_CAP_KHAI = 8; mỗi lệnh chạy xanh một lần trên bản sao chưa phá, mỗi cặp chạy lệnh của nó đỏ sau khi phá với một dòng 'error:' chứa đúng chuỗi ghim: (a) bỏ okrProgramConfig.deleteMany của xoaTrong → omc_lui 'omc: cau hinh mau con'; (b) bỏ vòng ghi lại mảng → omc_gat 'omc: con ma don vi mau'; (c) ghi mảng rỗng thay vì lọc mã mẫu → omc_gat 'omc: cau hinh sau mau sai'; (d) bỏ vế tiền tố createdById trong tapMau → omc_mo_coi 'omc: cau hinh mo coi con (co bo mau)'; (e) deleteMany cấu hình không điều kiện → omc_lui 'omc: cau hinh truoc mau bi doi'; (f) bỏ hai con số cấu hình khỏi dòng in → omc_gat 'omc: dong in thieu dem cau hinh'; (g) bỏ hai tập cấu hình khỏi tong → omc_mo_coi 'omc: mo coi bao khong co bo mau'; (h) cùng phá như (a) → omx_xoa 'omx: con tham chieu mau'. Chuỗi neo mỗi cặp xuất hiện đúng một lần (không thì thoát 2 'KHONG DO DUOC'); tệp trả lại trong finally; số cặp đã chạy ≠ 8 → thoát 1. In 'DOT BIEN: 8/8 cap dat'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [apps/api/scripts/okr-mau/nap.ts, apps/api/scripts/okr-mau/lenh.ts, apps/api/test/okr-mau-cau-hinh.spec.ts, _acceptance/okr-mau-xoa-cau-hinh/rang/dot-bien.mjs]

  - id: E10
    criterion: AC-10
