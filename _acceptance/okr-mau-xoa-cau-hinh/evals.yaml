slug: okr-mau-xoa-cau-hinh
evals:
  - id: E1
    criterion: AC-1
    executor: test
    layer: backend-effect
    cmd: config:executors.test.omx_xoa
    expected: "exit 0; -t omx-xoa của apps/api/test/okr-mau-cuoc-soan.spec.ts sau khi bỏ DU_PHEP: ids = tapIdMau() chụp trước khi xoá. Đối chứng dương trước --xoa: demThamChieu(ids) có khoá okrProgramConfig.createdById (cùng bốn khoá okrCuocSoan.*), và demThamChieuMang(ids) — phép quét mới ở okr-mau-san.ts, mọi cột data_type ARRAY phần tử text của schema public, đếm hàng có cột && ids — có khoá okrProgramConfig.aiSoanDonVi; demThamChieuMang trả kèm danh sách bảng.cột đã quét, danh sách đó phải bằng tập lấy bằng một truy vấn độc lập (information_schema.columns với udt_name '_text') và chứa đủ 6 cột *DonVi của okrProgramConfig ghim tay trong spec, không thì ném 'omx: quet mang thieu cot <tên>'. Sau chayLenh(['--xoa']) mã 0: demThamChieu(ids) khác {} thì ném 'omx: con tham chieu mau <json>' (không lọc khoá nào); demThamChieuMang(ids) khác {} thì ném 'omx: con ma mau trong mang <json>'. Chiều đỏ ở E9 (h): bỏ lệnh xoá cấu hình → omx_xoa đỏ 'omx: con tham chieu mau'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [apps/api/scripts/okr-mau/nap.ts, apps/api/test/okr-mau-cuoc-soan.spec.ts, apps/api/test/okr-mau-san.ts]

  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.omc_gat
    expected: "exit 0; cùng lượt -t omc-gat: stdout của chayLenh(['--xoa']) bắt đầu 'Đã xoá bộ OKR mẫu:' và chứa nguyên hai chuỗi '1 phiên bản cấu hình chương trình OKR do người mẫu tạo' và 'gỡ mã đơn vị mẫu khỏi 1 phiên bản khác'; thiếu thì ném 'omc: dong in thieu dem cau hinh: <stdout>'. Chiều đỏ ở E9 (f)."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [apps/api/scripts/okr-mau/lenh.ts, apps/api/scripts/okr-mau/nap.ts, apps/api/test/okr-mau-cau-hinh.spec.ts]

  - id: E3
    criterion: AC-3
    executor: test
    layer: backend-effect
    cmd: config:executors.test.omc_lui
    expected: "exit 0; -t omc-lui của apps/api/test/okr-mau-cau-hinh.spec.ts, hai ca. Dựng chung mọi ca omc-: beforeAll chụp to_jsonb mọi hàng okrProgramConfig; mỗi ca batDauMau rồi db.okrProgramConfig.deleteMany({}) để kho chỉ còn hàng của ca; afterAll xoá hết rồi chèn lại đúng ảnh chụp (đo ở E11). Ca 'về bản trước': cookie le-hai-dang ghiCauHinh { krCap: 7 } (bộ ghi thật), rồi UPDATE đúng cột createdById của hàng đó sang 'ngoai-mau-nguoi-omc' → bản trước; ghiCauHinh lần hai với 6 mảng *DonVi lấy từ information_schema (cột ARRAY của okrProgramConfig — tập tên phải bằng đúng 6 tên ghim trong spec, không thì ném 'omc: cot mang khac <tên>'), mỗi mảng ['mau-okr-pb-kd-bac'] và *PhamVi tương ứng 'danh-sach' → bản mẫu. Chụp to_jsonb bản trước. Đối chứng dương: cauHinhAiLuc(db).version = version bản mẫu. chayLenh(['--xoa']) mã 0; ném 'omc: cau hinh mau con' nếu hàng bản mẫu còn; 'omc: cau hinh truoc mau bi doi' nếu to_jsonb bản trước khác hay mất; 'omc: cau hinh hien hanh khong lui (<v> != <v truoc>)' nếu cauHinhAiLuc(db).version khác version bản trước. Ca 'về mặc định': chỉ ghi bản mẫu như trên; sau --xoa ném 'omc: con cau hinh sau xoa (<n>)' nếu bảng còn hàng, 'omc: khong ve mac dinh (<v>)' nếu cauHinhAiLuc(db).version khác 0. Chiều đỏ ở E9 (a), (e)."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [apps/api/scripts/okr-mau/nap.ts, apps/api/test/okr-mau-cau-hinh.spec.ts]

  - id: E4
    criterion: AC-4
    executor: test
    layer: backend-effect
    cmd: config:executors.test.omc_gat
    expected: "exit 0; -t omc-gat: dựng bản trước và bản mẫu như E3, rồi cookie le-hai-dang ghiCauHinh lần ba với mỗi mảng ['mau-okr-pb-kd-bac', 'ngoai-mau-pb-omc'] và krCap 9, UPDATE createdById của hàng đó sang 'ngoai-mau-nguoi-omc' → bản sau. Chụp to_jsonb bản trước và bản sau. Sau chayLenh(['--xoa']) mã 0: ném 'omc: con ma don vi mau <json>' nếu bất kỳ phần tử nào bắt đầu 'mau-okr-' còn trong một cột mảng của okrProgramConfig (kiểm trước); ném 'omc: cau hinh sau mau sai <json>' nếu to_jsonb bản sau khác bản chụp trước với mọi mảng *DonVi thay bằng ['ngoai-mau-pb-omc'] (mọi cột khác, gồm version, createdById, createdAt, so nguyên văn); 'omc: cau hinh truoc mau bi doi' nếu bản trước khác; 'omc: cau hinh hien hanh sai (<v>)' nếu cauHinhAiLuc(db).version khác version bản sau. Ca 'gạt thành rỗng' (cùng describe omc-gat): bản sau thay bằng bản ngoài bộ mẫu mà mỗi mảng chỉ ['mau-okr-pb-kd-bac'] và mọi *PhamVi 'danh-sach' (ghi qua ghiCauHinh rồi đổi createdById); sau --xoa mã 0, mọi mảng của bản đó là []; gọi app.get(OkrService).program(), docChamVaTran(db), cauHinhAiLuc(db) (docThangCham ở apps/agent, cùng truy vấn với docChamVaTran, test của apps/api không nhập được) — bộ nào ném thì ném 'omc: cau hinh sau gat khong doc duoc <bộ đọc>: <lỗi>'; program().version phải bằng version bản đó. Chiều đỏ ở E9 (b), (c)."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [apps/api/scripts/okr-mau/nap.ts, apps/api/test/okr-mau-cau-hinh.spec.ts]

  - id: E5
    criterion: AC-5
    executor: test
    layer: backend-effect
    cmd: config:executors.test.omc_mo_coi
    expected: "exit 0; -t omc-mo-coi, hai ca. Ca 'kho không còn bộ mẫu': batDauMau, deleteMany({}) cấu hình, cookie le-hai-dang ghiCauHinh { aiOn: true, aiSoanPhamVi: 'danh-sach', aiSoanDonVi: ['mau-okr-pb-kd-bac'] }, chụp to_jsonb hàng đó, xoaBoOkrMau(db), INSERT lại đúng hàng bằng jsonb_populate_record; đối chứng: tapIdMau() rỗng và hàng có mặt với createdById 'mau-okr-nguoi-le-hai-dang'. chayLenh(['--xoa']) mã 0; ném 'omc: mo coi bao khong co bo mau' nếu stdout chứa 'không có bộ mẫu'; 'omc: cau hinh mo coi con' nếu hàng còn; stdout phải chứa '1 phiên bản cấu hình chương trình OKR do người mẫu tạo'. Ca 'người mẫu không còn trong bộ đang có': batDauMau, ghi một hàng như trên rồi UPDATE createdById sang 'mau-okr-nguoi-da-nghi-omc' (mã có tiền tố, không thuộc bộ đang nạp); --xoa mã 0; ném 'omc: cau hinh mo coi con (co bo mau)' nếu hàng còn. Chiều đỏ ở E9 (d), (g)."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [apps/api/scripts/okr-mau/nap.ts, apps/api/scripts/okr-mau/lenh.ts, apps/api/test/okr-mau-cau-hinh.spec.ts]

