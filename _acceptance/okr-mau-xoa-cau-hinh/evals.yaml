  - id: E11
    criterion: AC-11
    executor: test
    cmd: config:executors.test.omc_tron
    expected: "exit 0; chạy cả tệp apps/api/test/okr-mau-cau-hinh.spec.ts (không -t). Ca cuối của tệp, describe 'omc-tra-lai', chạy SAU mọi ca khác: gọi đúng hàm trả lại mà afterAll dùng, rồi so to_jsonb mọi hàng okrProgramConfig (sắp theo id) với ảnh chụp của beforeAll; lệch thì ném 'omc: spec de lai cau hinh <json>'. Đối chứng dương: trước khi trả lại, bảng khác ảnh chụp (các ca đã ghi hàng), nếu không thì ném 'omc: tra lai khong co gi de do'. Chiều đỏ: bỏ lệnh chèn lại trong hàm trả lại làm ca này đỏ 'omc: spec de lai cau hinh' — chạy tay một lần ở S3."
