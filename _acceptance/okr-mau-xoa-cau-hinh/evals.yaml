  - id: E7
    criterion: AC-7
    executor: test
    layer: backend-effect
    cmd: config:executors.test.omc_dang_giu
    expected: "exit 0; -t omc-dang-giu: batDauMau, bản mẫu như E3 và bản sau ngoài bộ mẫu có mã phòng mẫu như E4; tạo công ty 'ngoai-mau-cty-omc' và thoả thuận 'ngoai-mau-deal-omc' có ownerId người mẫu do-minh-khoa; đối chứng: vanTayKho() có khoá okrProgramConfig và bảng có 2 hàng — vanTayKho băm md5 nội dung mọi hàng (string_agg của t::text), nên một mảng bị gạt mà số hàng giữ nguyên vẫn làm lệch; chayLenh(['--xoa']) phải trả mã 5, không thì ném 'omc: ma 5 khong ra (<mã>)'; vanTayKho() sau khác trước thì ném 'omc: ma 5 doi kho <bảng lệch>'. Dọn trong finally: xoá thoả thuận và công ty."
