    executor: test
    cmd: config:executors.test.vtl_nguon_khoa
    expected: "exit 0; bài thuần apps/agent/test/mo-hinh-khoa.spec.ts -t nguon-khoa gọi nguonKhoaMoHinh trên MA TRẬN TOÀN PHẦN viết trước trong bài: mười ô {OKR riêng, chung, cả hai, header OIDC còn hạn, biến VERCEL_OIDC_TOKEN còn hạn, không có, vé hết hạn, vé không phải JWT, layVe ném, khoá chỉ khoảng trắng} → kỳ vọng {khoa-rieng, khoa-chung, khoa-rieng, oidc, oidc, null, null, null, null, null}; tên biến rút từ TRO_LY_OKR.khoa (không chép chuỗi); số khẳng định = số ô (in ra, lệch là đỏ). Vé giả là JWT ba phần base64url với exp tương lai (ô hết hạn: exp quá khứ), và bài giải mã fixture bằng bộ giải mã của chính @vercel/oidc trước khi dùng (fixture sai khuôn là đỏ 'fixture ve sai khuon'). Ca header dùng getVercelOidcToken THẬT với request context giả ở globalThis[Symbol.for('@vercel/request-context')] (không giả layVe) — đối chứng dương đường thật. Mọi ô chạy với HOME và cwd là thư mục tạm không có .vercel và không có phiên CLI; spy globalThis.fetch và spy createGateway/gateway đều đếm 0. Chiều đỏ trên cùng bảng: bản sao chỉ đọc process.env (hàm cũ) → ô header OIDC ra null, thông điệp ghim 'o lech: header-oidc'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [apps/agent/agent/lib/mo-hinh-khoa.ts, apps/agent/agent/lib/okr/config.ts, apps/agent/test/mo-hinh-khoa.spec.ts]

