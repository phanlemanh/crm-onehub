        4 sua tay mot tep da co -> ma thoat 1, stderr goi ten tep, tep khong bi ghi de
      CHIEU DO: ban sao ghi de tep da co -> dong 4 do voi thong diep ghim "lenh keo ve ghi de tep da co".

  - id: E9
    criterion: AC-9
    executor: script
    cmd: config:executors.script.gth_vong_kit
