      - "_acceptance/gui-tin-hieu-trong-crm/rang/may-chu-gia.ts"
    expected: |
      vong-kit.mjs phan "doc": dung may chu gia tra dung dau ra cua ham dung tep that (tepTuBanGhi tren ban ghi mau co
      danh tinh, khong viet tay JSON), chay lenh keo ve vao kho tam, roi lay bo doc cua kit main (git archive
