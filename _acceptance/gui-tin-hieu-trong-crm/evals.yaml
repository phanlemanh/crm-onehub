        hop-1280: bam nut -> hop mo, dong "Gửi từ màn" == duong dan khong slug; go chu, Gui -> bien nhan mang ma crm-<so>
        trang-1280: bam "Xem tín hiệu đã gửi" -> URL ket thuc /tin-hieu; dong dau co dieu vua ke va "Đã nhận — chờ lượt
          kéo về kho"
        trang-375: cung trang o 375px hien danh sach Item, khong cuon ngang
      Anh: nut tren thanh dau trang, hop, bien nhan, trang o hai kho.

  - id: E14
    criterion: AC-1
    executor: judgment
    inputs:
      - apps/app/lib/messages/tin-hieu.ts
      - docs/superpowers/specs/2026-10-12-gui-tin-hieu-trong-crm-design.md
    question: |
      Doc phan tieng Viet (vi) cua tep loi cho nut, hop gui va trang "Tín hiệu đã gửi". Mot nhan vien phong ban khong dung
      git doc moi nhan va cau trong tep do, co hieu (a) nut nay de ke dieu minh gap trong CRM, (b) gui xong thi tin hieu
      di dau va xem lai o dau, (c) tung cau trang thai noi tin hieu dang o dau — ma khong gap ten tep, ten lenh hay chu noi
      bo cua bo cong cu (kit, khoi, khuon, git, ho so, run)? Doi chieu voi bang trang thai va "Câu trạng thái" cua tep thiet
      ke. Neu cau nao vi pham, trich nguyen cau.
    expected: |
      PASS khi ca ba y (a)(b)(c) co cau tuong ung trong tep loi va khong cau nao mang ten tep, ten lenh hay chu noi bo.

