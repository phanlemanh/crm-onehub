      product-map.mjs cua kit main ve LO-TRINH.html tren ban sao:
        1 khoi du lieu tho (JSON.parse) co khoa tin_hieu; tap id == tap tep keo ve
        2 bo doc trang thai cua CRM (apps/app/lib/tin-hieu) doc HTML do -> moi id co cau == truong cau cua kit, khong loi
        3 khoi _acceptance/config.yaml cua kho goc khai tin_hieu voi nguon tin-hieu/crm va gom tin-hieu/gom (doc bang
          bo doc khoa cua kit, khong regex rieng)
      CHIEU DO: ban sao config bo khoi tin_hieu -> dong 1 do voi thong diep ghim "ban ve khong mang danh sach tin hieu";
      ban sao bo doc CRM bo qua cau -> dong 2 do voi thong diep ghim "cau trang thai lech cau kit".

  - id: E10
    criterion: AC-10
    executor: test
    cmd: config:executors.test.gth_trang_thai
    paths:
      - "apps/app/lib/tin-hieu/**"
      - "packages/validation/src/tin-hieu.ts"
      - "apps/app/test/tin-hieu-trang-thai.spec.ts"
    expected: |
