schema_version: 1
slug: gui-tin-hieu-trong-crm

evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.gth_hop
    paths:
      - "apps/app/components/tin-hieu/**"
      - "apps/app/components/app-header.tsx"
      - "apps/app/lib/messages/tin-hieu.ts"
      - "apps/app/test/tin-hieu.dom.tsx"
    expected: |
      tin-hieu.dom.tsx describe "hop": render AppHeader voi mock trpc, ma tran viet truoc gom ba vai (owner, member, okr)
      x hai kho (desktop matchMedia >= md, mobile < md) = 6 o, moi o mot assert:
        1 nut [data-slot=nut-gui-tin-hieu] co mat; desktop co chu "Gửi tín hiệu"; mobile chi bieu tuong va aria-label
          == chu do (rut tu tep loi, khong viet tay)
        2 bam nut -> hop mo, co nhan "Bạn gặp điều gì?", dong "Gửi từ màn" mang duong dan da bo slug (pathname mock
          "/acme/okr/kr?x=1" -> "/okr/kr")
        3 o rong va o chi co khoang trang -> nut Gui disabled; go chu -> enabled
      CHIEU DO: ban sao bo dieu kien trim -> o 3 do voi thong diep ghim "o toan khoang trang van gui duoc";
      ban sao giu slug trong man -> o 2 do voi thong diep ghim "man con mang ten khong gian lam viec".

  - id: E2
    criterion: AC-2
    executor: test
    layer: backend-effect
    cmd: config:executors.test.gth_gui
    paths:
      - "apps/api/src/tin-hieu/**"
      - "packages/validation/src/tin-hieu.ts"
      - "packages/db/prisma/schema.prisma"
      - "packages/db/prisma/migrations/**"
      - "apps/api/test/tin-hieu.spec.ts"
    expected: |
      tin-hieu.spec.ts describe "gth-gui" tren kho thu cua luot. Ma tran viet truoc (4 nguoi gui):
        a co phong ban chinh dang dung, b phong ban chinh da luu tru, c khong co OrgPlacement, d co phong ban chinh
        nhung man co "?q=1#x". Voi MOI nguoi: goi tinHieu.gui -> doc lai hang TinHieu bang Prisma:
        1 dung mot hang moi, nguoiGuiId == nguoi goi
        2 phongBanId == ky vong (a: id; b, c: null; d: id)
        3 man khong chua "?" hay "#"; tieuDe == dong dau khac rong (cat 120 + "…" khi dai hon); moTa co khi chu dai hon
          dong dau, vang khi bang
        4 so tang dan, idTep(so) == "crm-" + so; ket qua tra ve mang ma do
      Tieu de dai 300 ky tu mot dong -> cat dung TIN_HIEU.doDaiTieuDe.
      CHIEU DO: ban sao lay phong ban khong loc archivedAt -> o b do voi thong diep ghim "phong ban da luu tru van gan";
      ban sao giu query trong man -> o d do voi thong diep ghim "man mang phan truy van".

  - id: E2b
    criterion: AC-2
    executor: test
    cmd: config:executors.test.gth_hop
    paths:
      - "apps/app/components/tin-hieu/**"
      - "apps/app/lib/messages/tin-hieu.ts"
      - "apps/app/test/tin-hieu.dom.tsx"
    expected: |
      describe "hop" ca "gui": mock mutation tinHieu.gui tra {id, ma: "crm-12"}. Go chu, bam Gui:
        1 mutation nhan dung {chu, man} (man da bo slug)
        2 hop hien bien nhan chua "crm-12" va lien ket "Xem tín hiệu đã gửi" tro /<slug>/tin-hieu
        3 useCrmCache goi invalidate cho tinHieu.cuaToi dung mot lan
      CHIEU DO: ban sao bo invalidate -> dong 3 do voi thong diep ghim "gui xong khong lam moi danh sach".

  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.gth_tran
    paths:
      - "apps/api/src/tin-hieu/**"
      - "packages/validation/src/tin-hieu.ts"
      - "apps/api/test/tin-hieu.spec.ts"
    expected: |
      describe "gth-tran", TZ=Asia/Ho_Chi_Minh, dong ho gia:
        1 gui TIN_HIEU.tranMoiNgay lan -> deu thanh cong; lan ke -> HttpException 429, so hang khong doi,
          thong diep chua so tran (rut tu hang so, khong viet tay)
        2 dong ho sang 00:00 gio Viet Nam ngay sau (16:59Z -> 17:00Z) -> gui duoc lai; 16:59Z van bi chan
        3 chu dai TIN_HIEU.doDaiToiDa + 1 -> bi tu choi o khuon dau vao, khong cat
        4 hai loi goi dong thoi o so tran - 1 -> dung mot thanh cong (khoa theo nguoi)
      CHIEU DO: ban sao dem theo ngay UTC -> dong 2 do voi thong diep ghim "tran tinh theo ngay UTC";
      ban sao bo khoa theo nguoi -> dong 4 do voi thong diep ghim "hai loi goi cung vuot tran".

  - id: E3b
    criterion: AC-3
    executor: test
    cmd: config:executors.test.gth_hop
    paths:
      - "apps/app/components/tin-hieu/**"
      - "apps/app/lib/messages/tin-hieu.ts"
      - "apps/app/test/tin-hieu.dom.tsx"
    expected: |
      describe "hop" ca "loi": mock mutation tra loi 429 voi thong diep may chu, roi loi 500.
        1 429 -> loi duoi o hien dung thong diep may chu; o van giu nguyen chu da go; nut Gui bam lai duoc
        2 500 -> loi duoi o la cau chung cua tep loi (khong lo thong diep may chu); chu giu nguyen
        3 o co maxLength == TIN_HIEU.doDaiToiDa; dem ky tu hien khi con duoi TIN_HIEU.nguongDem
      CHIEU DO: ban sao xoa chu khi loi -> dong 1 do voi thong diep ghim "loi lam mat chu da go".

  - id: E4
    criterion: AC-4
    executor: test
    layer: backend-effect
    cmd: config:executors.test.gth_cua_toi
    paths:
      - "apps/api/src/tin-hieu/**"
      - "apps/api/test/tin-hieu.spec.ts"
    expected: |
      describe "gth-cua-toi": ba nguoi moi nguoi gui 3 tin hieu xen ke thoi diem. Voi MOI nguoi:
        1 cuaToi tra dung tap tin hieu cua ho (so sanh tap id voi truy van doc lap), khong id cua nguoi khac
        2 thu tu guiLuc giam dan
      Goi khong phien -> 401.
      CHIEU DO: ban sao bo where nguoiGuiId -> dong 1 do voi thong diep ghim "danh sach lo tin hieu nguoi khac".

  - id: E4b
    criterion: AC-4
    executor: test
    cmd: config:executors.test.gth_trang_thai
    paths:
      - "apps/app/lib/tin-hieu/**"
      - "apps/app/test/tin-hieu-trang-thai.spec.ts"
    expected: |
      tin-hieu-trang-thai.spec.ts ca "chi-cua-toi": khoi du lieu mau (sinh bang bo ve kit, xem E9) co tin_hieu cua 5 ma;
      ham dung trangThai cho nguoi xem co ma {crm-1, crm-3}:
        1 tap khoa cua ket qua == {crm-1, crm-3} (khong ma khac, khong tieu_de cua ma khac trong JSON dau ra)
      CHIEU DO: ban sao tra ca mang tin_hieu -> do voi thong diep ghim "trang dua tin hieu nguoi khac xuong trinh duyet".

  - id: E5
    criterion: AC-5
    executor: test
    layer: backend-effect
    cmd: config:executors.test.gth_xoa
    paths:
      - "apps/api/src/tin-hieu/**"
      - "apps/api/test/tin-hieu.spec.ts"
    expected: |
      describe "gth-xoa": ma tran viet truoc 4 o:
        1 cua minh, chua keo ve -> xoa thanh cong; hang mat; keoVe sau do khong co id do
        2 cua minh, da keo ve -> HttpException 409, thong diep chua "đã vào kho", hang con
        3 cua nguoi khac, chua keo ve -> 404, hang con
        4 dua: keoVe va xoa chay dong thoi tren cung tin hieu -> hoac xoa thanh cong va keoVe khong tra no, hoac keoVe
          tra no va xoa nhan 409 (khong co ca hai)
      CHIEU DO: ban sao kiem keoVeLuc ngoai giao dich -> o 4 do voi thong diep ghim "tin hieu vua keo ve van bi xoa".

  - id: E5b
    criterion: AC-5
    executor: test
    cmd: config:executors.test.gth_trang
    paths:
      - "apps/app/components/tin-hieu/**"
      - "apps/app/app/(app)/[slug]/tin-hieu/**"
      - "apps/app/test/tin-hieu.dom.tsx"
    expected: |
      describe "trang" ca "xoa": danh sach mock 2 dong (daKeoVe false, true).
        1 dong chua keo ve co nut Xoa; dong da keo ve khong co
        2 bam Xoa -> ConfirmDialog voi tieu de mang ma tin hieu va nut "Xoá tín hiệu"; huy -> khong goi mutation
        3 xac nhan -> goi tinHieu.xoa voi dung id, invalidate cuaToi
      CHIEU DO: ban sao hien Xoa moi dong -> dong 1 do voi thong diep ghim "dong da vao kho van co nut Xoa".

  - id: E6
    criterion: AC-6
    executor: test
    layer: backend-effect
    cmd: config:executors.test.gth_keo_ve
    paths:
      - "apps/api/src/tin-hieu/**"
      - "packages/validation/src/tin-hieu.ts"
      - "apps/api/test/tin-hieu.spec.ts"
    expected: |
      describe "gth-keo-ve": goi qua REST /rest/tin-hieu/keo-ve bang khoa API that (tao trong kho thu). Ma tran vai:
        owner, admin -> 200; member, okr -> 403 va keoVeLuc khong doi o bat ky hang nao.
      Voi owner:
        1 tra moi tin hieu con lai, xep theo so; moi phan tu qua tepTinHieu.parse khong loi; phongBan == ten phong ban
          luc gui hoac null
        2 sau loi goi, moi hang co keoVeLuc; goi lai -> cung tap tep, cung byte JSON; keoVeLuc cua hang cu khong doi
        3 tep khong co khoa nao chua nguoiGuiId, email, ten nguoi, phongBan (quet de quy moi gia tri chuoi cua tep
          so voi tap gia tri danh tinh cua kho thu)
      CHIEU DO: ban sao cho member goi -> dong vai do voi thong diep ghim "khoa thanh vien thuong keo ve duoc";
      ban sao ghi email vao noi_dung -> dong 3 do voi thong diep ghim "tep mang danh tinh nguoi gui".

