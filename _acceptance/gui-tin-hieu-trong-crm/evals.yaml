    superseded_by: sua-giao-dien-tin-hieu#AC-8
    criterion: AC-1
    executor: test
    cmd: config:executors.test.gth_hop
    paths:
      - "apps/app/components/tin-hieu/**"
      - "apps/app/components/app-header.tsx"
      - "apps/app/lib/messages/tin-hieu.ts"
      - "apps/app/test/tin-hieu.dom.tsx"
    expected: |
      tin-hieu.dom.tsx describe "hop" (gom ca "menu"): render AppHeader voi mock trpc, ma tran viet truoc gom ba vai (owner, member, okr)
      x hai kho (desktop matchMedia >= md, mobile < md) = 6 o, moi o mot assert:
        1 nut [data-slot=nut-gui-tin-hieu] co mat; desktop co chu "Gửi tín hiệu"; mobile chi bieu tuong va aria-label
          == chu do (rut tu tep loi, khong viet tay)
        2 bam nut -> hop mo, co nhan "Bạn gặp điều gì?", dong "Gửi từ màn" mang duong dan da bo slug (pathname mock
          "/acme/okr/kr?x=1" -> "/okr/kr")
        3 ma tran hai o (muon lam, da xay ra) x {rong, chi khoang trang, co chu} = 9 to hop viet truoc: Gui chi enabled khi
          ca hai o co chu
        5 nut tren thanh dau trang co data-variant va data-size bang dung cac nut khac trong cung cum (doc tu DOM cua cum,
          khong viet tay "outline")
        4 ca "menu": mo menu nguoi dung -> co muc "Tín hiệu đã gửi" tro /<slug>/tin-hieu (ca ba vai)
      CHIEU DO: ban sao bo dieu kien trim -> o 3 do voi thong diep ghim "o toan khoang trang van gui duoc";
      ban sao bo muc menu -> o 4 do voi thong diep ghim "khong co loi vao trang tin hieu tu menu";
      ban sao doi nut sang ghost -> dong 5 do voi thong diep ghim "nut gui tin hieu lech kieu cum nut dau trang";
      ban sao giu slug trong man -> o 2 do voi thong diep ghim "man con mang ten khong gian lam viec".

  - id: E2
