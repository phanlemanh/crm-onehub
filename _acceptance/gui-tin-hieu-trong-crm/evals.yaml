        1 so tep == so ban ghi; loi == []; moi tin hieu loai "tin-hieu" co tieu_de
        2 khong tep nao chua chuoi danh tinh cua ban ghi mau (ten, email, id nguoi, ten phong ban)
      Khong tim thay kho kit -> thoat 2 voi thong diep ghim "khong co bo doc tin hieu cua kit".
      CHIEU DO: ban sao lenh keo ve bo "tieu_de" -> do voi thong diep ghim "bo doc kit tu choi tep";
      ban sao them email vao tep -> dong 2 do voi thong diep ghim "tep mang danh tinh".

  - id: E8
    criterion: AC-8
    executor: script
    cmd: config:executors.script.gth_lenh_keo_ve
    paths:
      - "scripts/tin-hieu/**"
      - "packages/validation/src/tin-hieu.ts"
    expected: |
      scripts/tin-hieu/test/keo-ve.test.ts tren kho tam + may chu gia (Bun.serve) tra dau ra tu tepTuBanGhi:
        1 lan 1 ghi N tep; lan 2: 0 tep moi, moi tep cung byte (so bam truoc/sau)
        2 may chu bo mot ban ghi (da xoa truoc khi keo) -> khong co tep cua ma do
