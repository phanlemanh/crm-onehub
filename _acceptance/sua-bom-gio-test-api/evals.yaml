schema_version: 1
slug: sua-bom-gio-test-api

evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.suite_api
    paths:
      - "apps/api/**"
      - "packages/db/**"
      - "packages/validation/**"
    expected: |
      Trọn suite api (`bun run test -- --filter=api`, CSDL riêng mỗi lượt) thoát 0, dòng tổng kết «0 fail», số
      pass ≥ 2168 và «18 skip» như nền 74a29a68 (không ca nào bị chuyển sang skip/todo). Chín ca
      đỏ sẵn ở 74a29a68 đều có trong danh sách pass: cmst-goc (beforeAll), dem-chip ×5 (gồm dem-chip kr-da-xoa),
      loc-gop-y «lọc Có góp ý chờ», dong-bo «đổi tay tên KR», bo-qua «Bỏ qua viết lại gửi bac».
      CHIỀU ĐỎ: cùng lệnh trên 74a29a68 (đo 20/11 09:03–09:10Z) ra «2159 pass · 9 fail» đúng chín tên ấy.

  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.bom_gio
    paths:
      - "apps/api/test/chu-may-sinh-ten-moi-goc.spec.ts"
      - "apps/api/test/gop-y-dung-cho.spec.ts"
      - "apps/api/test/tro-ly-okr-san.ts"
      - "apps/api/test/okr-khep-san.ts"
      - "apps/api/src/okr/**"
      - "packages/db/src/okr-tro-ly.ts"
      - "_acceptance/sua-bom-gio-test-api/rang/**"
    expected: |
      `rang/bom-gio.mjs` chạy hai lượt, mỗi lượt một CSDL riêng qua packages/db/scripts/test-run.ts: (a)
      chu-may-sinh-ten-moi-goc.spec.ts một mình; (b) gop-y-dung-cho.spec.ts với preload `rang/hang-sot.ts` cấy
      một hàng okrProgramConfig ghi bằng giờ thật trước mọi bài (id bom-gio-hang-sot, người tạo
      bom-gio-hang-sot-admin, OKR_PROGRAM_MAC_DINH — aiOn false), đúng hình hàng sót đã đo trong suite. Cả hai
      lượt thoát 0, «0 fail», pass > 0; lệnh in «XANH bom-gio» và thoát 0.
      CHIỀU ĐỎ: trên cây 74a29a68 (trước khi sửa) cùng lệnh in «cmst-goc: ma 1 · 0 pass · 1 fail» và
      «gop-y-dung-cho: ma 1 · 4 pass · 8 fail», rồi «DO bom-gio: cmst-goc, gop-y-dung-cho …», thoát 1.

  - id: E3
    criterion: AC-2
    executor: script
    cmd: config:executors.script.bom_gio_doi_chung
    paths:
      - "apps/api/test/**"
      - "_acceptance/sua-bom-gio-test-api/rang/**"
    expected: |
      `rang/bom-gio.mjs --doi-chung 74a29a68d` dựng một lớp phủ ngoài kho (thư mục tạm trong $TMPDIR: liên kết mọi
      mục của kho, chỉ thay đúng hai tệp kiểm bằng bản ở 74a29a68d qua `git show`), chạy hai lượt như E2 trên lớp
      phủ, rồi xoá lớp phủ. Cả hai lượt phải đỏ đúng dấu: cmst-goc thoát ≠ 0 và đầu ra có «don-vi-chua-bat»;
      gop-y-dung-cho thoát ≠ 0, 8 fail, đầu ra có «dem sai». Lệnh in «DOI CHUNG DUONG» và thoát 0. Không ghi tệp
      nào vào cây; sau lệnh không còn thư mục bom-gio-* trong $TMPDIR.
      CHIỀU ĐỎ: một lượt không đỏ đúng dấu (thước không bắt được bom giờ) → in «DOI CHUNG HONG: … <tên ca> khong do
      dung dau», thoát 1.

  - id: E4
    criterion: AC-3
    executor: script
    cmd: config:executors.script.bom_gio_pham_vi
    paths:
      - "**"
    expected: |
      `rang/pham-vi.mjs` lấy hợp của diff merge-base(HEAD, origin/onehub)..HEAD và tệp của các commit không gộp mang
      «(sua-bom-gio-test-api)» từ 74a29a68d tới HEAD; mọi tệp khớp vùng cho phép: đúng hai tệp
      apps/api/test/chu-may-sinh-ten-moi-goc.spec.ts và apps/api/test/gop-y-dung-cho.spec.ts, hồ sơ của vòng,
      _acceptance/config.yaml, docs/superpowers/, PRODUCT-MAP.md, LO-TRINH.html. In «PHAM VI XANH», thoát 0.
      CHIỀU ĐỎ (cùng lệnh, danh sách giả): `--tep apps/api/test/gop-y-dung-cho.spec.ts,apps/api/test/tro-ly-okr-san.ts`
      in «PHAM VI DO: 1 tep ngoai hai tep kiem va ho so: apps/api/test/tro-ly-okr-san.ts», thoát 1;
      `--tep apps/api/src/okr/dem-gop-y.ts` đỏ cùng thông điệp với tệp ấy; vòng không đổi tệp nào (cây 74a29a68) in
      «PHAM VI DO: vong khong doi tep nao», thoát 1.

  - id: E5
    criterion: AC-4
    executor: script
    cmd: config:executors.script.bom_gio_khong_ha
    paths:
      - "apps/api/test/chu-may-sinh-ten-moi-goc.spec.ts"
      - "apps/api/test/gop-y-dung-cho.spec.ts"
      - "_acceptance/sua-bom-gio-test-api/rang/**"
    expected: |
      `rang/pham-vi.mjs --khong-ha` đọc `git diff --unified=0 74a29a68d HEAD` của đúng hai tệp kiểm: có ít nhất một
      dòng thêm, 0 dòng bớt, 0 dòng thêm khớp skip/todo/only/skipIf/if/xit/xdescribe. In «KHONG HA XANH», thoát 0.
      CHIỀU ĐỎ (cùng lệnh, mẫu vá trong rang/mau/): `--patch rang/mau/bot-khang-dinh.patch` in «KHONG HA DO: hai tep
      kiem bot 1 dong …» kèm dòng «-	expect(a).toBe(3);», thoát 1; `--patch rang/mau/them-skip.patch` in «KHONG HA
      DO: … them 1 dong ha thuoc» kèm dòng test.skip, thoát 1; `--patch rang/mau/chi-them.patch` in «KHONG HA XANH»,
      thoát 0.

  - id: E6
    criterion: AC-5
    executor: script
    cmd: config:executors.script.vvc_ca_goi_api
    paths:
      - "apps/api/test/**"
      - "apps/api/src/**"
      - "_acceptance/test-api-khong-de-viec-vo-chu/rang/**"
    expected: |
      Thước E5 của hồ sơ đã ký test-api-khong-de-viec-vo-chu (#616), dùng lại nguyên lệnh: trong CÙNG một CSDL của
      lượt, `rang/dem-sot.ts gieo-le` gieo liên hệ mồi, chạy trọn suite api (`cd apps/api && bun test`, phải thoát 0),
      rồi `rang/dem-sot.ts ca-goi` đếm. Số dòng AgentTask chưa xong, số liên hệ khác mồi, số công ty đều 0; thoát 0.
      Trên cây của vòng điều này nói: lần ghi chương trình thứ hai ở gieoCuocSoan (aiOn đã true, program() đọc theo
      version) không sinh việc okr-kiem-san-sang nào lọt bước dọn createdAt ≥ BAT_DAU, và gop-y-dung-cho trả lại đủ hàng
      cấu hình đã gỡ (suite thoát 0 trong cùng lượt).
      CHIỀU ĐỎ: một việc okr-kiem-san-sang chưa xong còn lại → thước in «goi api de lai hang» kèm kind okr-kiem-san-sang,
      thoát 1 (chiều đỏ gốc của thước: gỡ spyOn(BackfillService.auto) ở go-la-cat-quyen.spec.ts → «agentTask chua
      xong=1 (cua lien he le=1)»).
