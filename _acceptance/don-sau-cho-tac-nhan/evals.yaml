schema_version: 1
slug: don-sau-cho-tac-nhan
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.dsctn_noi_song
    paths: [packages/ui/src/components/the-dang-dung.tsx, apps/app/components/agent-builder/**, apps/app/app/proto/_modules/cho-tac-nhan-lau/**, apps/app/test/the-dang-dung-noi-song.spec.ts]
    expected: |
      apps/app/test/the-dang-dung-noi-song.spec.ts doc TOAN cay apps/app va packages/ui (.ts, .tsx; duong suy tu vi tri
      tep test, khong ghim ROOT). Ham kiemNoiSong(tep) nhan ban do duong -> noi dung, tra danh sach vi pham. Ca "cay-that": cay hien tai -> []. Ma tran
      chieu do viet truoc, moi ca la ban sao cua cay that sua dung mot cho, moi ca ghim thong diep:
      (a) them lai apps/app/components/agent-builder/the-dang-dung.tsx dinh nghia TheDangDung -> "TheDangDung con dinh nghia o apps/app";
      (b) agent-builder-chat.tsx nhap "./the-dang-dung" -> "cho goi khong nhap tu @crm/ui/components/the-dang-dung";
      (c) the-dang-dung.tsx cua packages/ui nhap "@/lib/use-seconds" -> "the nhap ngoai packages/ui";
      (d) the-dang-dung.tsx nhap "@crm/db" -> "the nhap goi may chu";
      (e) CardAction mang className="gap-3" -> "CardAction mang className";
      (f) CardFooter mang className="gap-2 border-t" -> "CardFooter mang className";
      (g) proto cho-tac-nhan-lau/index.tsx nhap "@/components/agent-builder/the-dang-dung" -> "cho goi khong nhap tu @crm/ui/components/the-dang-dung";
      (h) the-dang-dung.tsx nhap "@crm/auth" -> "the nhap goi may chu";
      (i) them apps/app/components/khac.tsx dinh nghia function TheDangDung -> "TheDangDung dinh nghia o hon mot noi".
      So assert chieu do = 9 = so phan tu ma tran.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.dsctn_the_ui
    paths: [packages/ui/src/components/the-dang-dung.tsx, packages/ui/src/components/card.tsx, packages/ui/test/the-dang-dung.dom.tsx]
    expected: |
      packages/ui/test/the-dang-dung.dom.tsx, ca "lop-mac-dinh": ve TheDangDung va ve canh no mot Card co CardAction,
      CardFooter khong tham so; className cua [data-slot=card-action] va [data-slot=card-footer] trong the BANG dung
      className cua ban khong tham so (quan he, khong do chuoi co mat). Doi chung do cung ca: ve CardAction className="gap-3"
      thi ham so lop bao khac voi thong diep ghim "CardAction lech lop mac dinh".
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.dsctn_noi_dung
    paths: [packages/ui/src/components/the-dang-dung.tsx, apps/app/lib/agent-builder-the-dang-dung.ts, apps/app/lib/messages/agent-builder-tro-chuyen.ts, apps/app/test/the-dang-dung.dom.tsx]
    expected: |
      apps/app/test/the-dang-dung.dom.tsx, ca "noi-dung": ve TheDangDung cua packages/ui voi tham so do useTheDangDung cua app dung; chu doi chieu lay tu
      troChuyenMessages("vi") (writer that, khong viet tay chu). Ma tran viet truoc daXong in {0,1,3,4} x 4 buoc: buoc i < daXong hien ten
      vat hoac "Xong"; buoc i = daXong (< 4) mang aria-current="step" va "Dang lam", co dong "Dang ghi <duong>" khi dangGhi
      co; buoc i > daXong hien "Dang xep"; daXong = 4 thi khong buoc nao mang aria-current. 16 assert trang thai = 16 o.
      da-troi va lau-hon: co khi dua vao, vang khi null (4 assert). Chan the co cau roi trang va nut duoc dua vao.
      Chieu do cung fixture: DOM ve voi daXong=1 ma doi chieu nhu daXong=2 -> ham kiem tra tra vi pham ghim "buoc dang lam".
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.dsctn_k7_nguyen
    paths: [packages/ui/src/components/the-dang-dung.tsx, apps/app/components/agent-builder/**, apps/app/lib/agent-builder-*.ts, apps/app/lib/use-seconds.ts, apps/app/test/cho-tac-nhan-lau.dom.tsx]
    expected: |
      Bai kiem cua K7 (apps/app/test/cho-tac-nhan-lau.dom.tsx) ve the qua BuildingAgentCard cua agent-builder-chat.tsx,
      khong nhap the truc tiep, nen khong can sua. Lenh truoc het chay git diff --exit-code tu merge-base voi origin/onehub
      tren dung tep do: tep doi -> thoat khac 0 truoc khi chay test (chieu do: sua mot dong tep test trong ban sao -> lenh
      do o buoc diff). Roi chay bai kiem: ma 0. Cac ca "thoi-gian",
      "gan-muon", chan the va qua nguong xanh tren the moi dung tu packages/ui. Chieu do da co san trong ho so K7 (E1, E2,
      E3, E8 cua cho-tac-nhan-lau).
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-5
    executor: ui-check
    layer: ui-observed
    cmd: config:executors.script.dsctn_do_man
    steps:
      - "Chay o tien canh, Bash timeout 600000: lenh dsctn_do_man (bai do man cua K7, anh ghi vao .acceptance-runs/don-sau-cho-tac-nhan/evidence, khong ghi vao ho so K7)"
      - "Doc dong KET LUAN cuoi: ma 0 = moi dong DUNG; ma 2 = khong do duoc; ma 1 = co dong SAI"
      - "Mo anh tren-nguong-1280, tren-nguong-375, duoi-nguong-1280, duoi-nguong-375 va doi chieu bang mat voi Expected"
    inputs:
      - .acceptance-runs/don-sau-cho-tac-nhan/evidence/
      - _acceptance/cho-tac-nhan-lau/evidence/tren-nguong-1280.png
      - _acceptance/cho-tac-nhan-lau/evidence/tren-nguong-375.png
      - _acceptance/cho-tac-nhan-lau/evidence/duoi-nguong-1280.png
      - _acceptance/cho-tac-nhan-lau/evidence/duoi-nguong-375.png
    paths: [packages/ui/src/components/the-dang-dung.tsx, apps/app/components/agent-builder/**, apps/app/lib/agent-builder-*.ts]
    expected: |
      Anh 1280 va 375: the "Dang dung tac nhan" co dong ho "Da m:ss", "n tren 4", bon buoc, cau roi trang va nut Dung; tren
      nguong co dong "Da qua 3 phut. Kara van dang dung."; duoi nguong khong co. Khong tran ngang o 375. Doi chieu tung cap
      truoc/sau cung kho va trang thai (anh K7 trong inputs): moi chu va thu tu trung nhau; chi khoang o dau va chan the
      duoc khac, dung theo loi Hoi-1 da chon o Cong Pham vi (mac dinh cua Card: dong ho va tien do gan nhau hon, cau roi
      trang cach nut xa hon). Khong chu chong nhau, khong cat chu.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
