    expected: |
      apps/api/test/bao-loi-sau-cau-hoi.spec.ts, ca "blth-mot-cau", tren kho test that, moi buoc qua bo ghi cua san pham (createBuilder/submitBuilder -> dispatchBuilderSubmission that voi send gia theo hop dong eve -> crmEvents input.requested voi su kien da chup hai-luot-hoi-that.json / session-limit-that.json va ngu canh phien bo giao dua cho eve -> session.waiting -> answerBuilderQuestion -> giao -> ket thuc luot), ket thuc bang turn.failed. Khang
      dinh: danh sach loai thong bao cua cuoc bang dung ["tac-nhan-can-tra-loi","tac-nhan-hong"]; dong hong co
      nguoiNhanId = nguoi mo cuoc, duongDan = /chat/<id>, luotId = id lan gui tra loi; lastAssistantAt chup truoc
      turn.failed khac rong va gia tri sau lon hon han. Doi chung cung fixture: E5 (tro chuyen) cho 0 hong. Chieu do: ban
      sao cho answerBuilderQuestion ghi commandType "CHAT" co dinh -> ca do voi thong diep ghim "hong sau tra loi: mot-cau".
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

