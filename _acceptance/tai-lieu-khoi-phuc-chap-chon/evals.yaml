schema_version: 1
slug: tai-lieu-khoi-phuc-chap-chon

evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.tlkp_khoi_phuc
    paths:
      - "apps/api/test/tai-lieu-luu-tru.spec.ts"
    expected: "ca «khoi-phuc: de xuat khoi phuc duoc duyet» xanh; phep dem su kien cua lan duyet dung tap id chup truoc khi duyet (suKienMoi) va ra dung { KHOI_PHUC: 1 }. CHIEU DO o E3: cung du lieu gieo, cach dem theo moc gio cu dem nham."

  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.tlkp_luu_tru
    paths:
      - "apps/api/test/tai-lieu-luu-tru.spec.ts"
    expected: "ca «duyet-luu-tru: ma tran nguoi viet truoc» xanh voi ca nam nguoi; ba nguoi duoc phep dem dung { LUU_TRU: 1, CU: 1 } bang tap id chup truoc khi duyet. CHIEU DO o E3."

  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.tlkp_dem
    paths:
      - "apps/api/test/tai-lieu-luu-tru.spec.ts"
    expected: "ca «tlkp-dem» xanh: gieo mot su kien co luc = bay gio + 5 giay TRUOC khi chup moc; suKienMoi(trang, truoc) khong dem no (so moi = {}); tren cung du lieu, dem theo moc new Date(Date.now() - 1) dem nham no (so DE_XUAT = 1) — doi chung bat buoc, thieu thi ca do voi ghim 'tlkp-dem: du lieu gieo khong kich duoc loi moc gio'. Cach dem moi dem nham thi ghim 'tlkp-dem: dem nham su kien truoc moc'."

  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.tlkp_tinh
    paths:
      - "apps/api/test/tai-lieu-luu-tru.spec.ts"
    expected: "ca «tlkp-tinh» xanh: quet ma nguon chinh tep, khong dong nao chua 'Date.now() - 1' (khong tinh dong mau cua chinh ca nay); chuoi mau co moc do thi ham quet tra ve dong vi pham — doi chung, thieu thi ghim 'tlkp-tinh: ham quet bo sot moc gio'. Con moc trong tep thi ghim 'tlkp-tinh: con moc dong ho o dong <n>'."

  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.tlkp_tep
    paths:
      - "apps/api/test/tai-lieu-luu-tru.spec.ts"
    expected: "ca tep tai-lieu-luu-tru.spec.ts xanh, 0 fail."
