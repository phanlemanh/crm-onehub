<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xoá khi chen giữa</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #fafafa;
      --color-ink:     #171717;
      --color-muted:   #575757;
      --color-accent:  #006B4F;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1100px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.01em;
      line-height: 1.25;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sơ đồ tuần tự · don-okr-nhap-sai</p>

        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#fafafa"/>

      <line x1="176" y1="104" x2="176" y2="560" stroke="rgba(23,23,23,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="512" y1="104" x2="512" y2="560" stroke="rgba(23,23,23,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="848" y1="104" x2="848" y2="512" stroke="rgba(23,23,23,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

      <line x1="180" y1="200" x2="512" y2="200" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="160" y1="638" x2="188" y2="638" stroke="#575757" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="196" y="642" fill="#575757" font-size="11" font-family="'Geist', sans-serif">Trả về</text>

      <rect x="264" y="628" width="8" height="20" fill="rgba(23,23,23,0.06)" stroke="#575757" stroke-width="0.8"/>

      <rect x="364" y="628" width="8" height="20" fill="#fafafa" stroke="#575757" stroke-width="0.8" stroke-dasharray="3,3"/>

      <text x="992" y="642" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.08em">AC-2 · E19</text>

</html>
