    expected: "exit 0; man-suc-khoe.mjs in 'buoc N: dat' cho 4 buoc; so cua tung khoi doc tu DOM bang innerText khop mong doi cua do thi E7. CHIEU DO: --chieu-do tren ban sao an tab Suc khoe -> 'buoc 1: khong thay tab Suc khoe', ma 1; --chieu-do=2 tren ban sao tra khung dau trang ve luoi cu -> 'buoc 2: 390: tieu de de len nut ...', ma 1."

  - id: E9
    criterion: AC-9
    executor: test
    layer: backend-effect
    cmd: config:executors.test.tdk_nhac_sang
    paths:
      - "apps/agent/agent/lib/nhac-ke-hoach.ts"
      - "apps/agent/agent/lib/tin-nhac.ts"
      - "packages/db/src/onboarding-nhac.ts"
      - "packages/db/src/tai-lieu*.ts"
      - "packages/validation/src/nhac-ke-hoach.ts"
      - "apps/agent/test/tai-lieu-nhac.spec.ts"
    expected: |
      TZ=Asia/Ho_Chi_Minh, Postgres that, dong ho gia 09:00 VN (afterEach tra dong ho). Ma tran viet
