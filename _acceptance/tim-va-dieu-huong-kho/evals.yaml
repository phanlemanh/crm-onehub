  - id: E8u
    criterion: AC-8
    executor: ui-check
    layer: ui-observed
    cmd: config:executors.script.tdk_man_suc_khoe
    steps:
      - "Canh cay; phien do rieng; gieo do thi cua E7 va hai trang qua han xac minh qua duong ghi that; dang nhap chu trang"
      - "Buoc 1 (1440): Kho -> tab 'Sức khoẻ' -> nam khoi voi dung so -> anh tdk-suc-khoe-1440.png"
