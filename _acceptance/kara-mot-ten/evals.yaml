    expected: "exit 0; -t kmt-luat của apps/app/test/kara-mot-ten.spec.ts. CAM khai trong apps/app/test/kara-mot-ten-luat.ts đúng 16 cụm: vi so đúng chữ (13) «Trợ lý», «trợ lý», «Máy soạn», «máy soạn», «Máy góp ý», «máy góp ý», «Máy tóm tắt», «máy tóm tắt», «Máy ghi số», «Máy chạy ở chế độ ẩn», «Máy đang soạn», «máy không đọc», «Tác nhân nghiên cứu»; en so không phân biệt hoa thường (3) «assistant», «composer», «your agent». Luật nghĩa: «tác nhân», «Tác nhân», en «agent» (không phân biệt hoa thường) chỉ được ở mô-đun hay khoá thuộc VAT_DOI_DUNG. (a) Kho chữ: rải phẳng mọi giá trị vi và en của mọi mô-đun apps/app/lib/messages/*.ts và kho chữ packages/ui; áp soatMotTen(muc, CAM, VAT_DOI_DUNG); danh sách lỗi khác rỗng thì ném nguyên danh sách, mỗi dòng '<tệp>#<khoá> <ngôn ngữ>: <cụm>'; số mô-đun nạp được nhỏ hơn số tệp *.ts dưới apps/app/lib/messages thì ném 'kmt: luat bo sot mo-dun <danh sách>'. (b) Chữ cứng: đọc dạng chữ mọi *.ts, *.tsx dưới apps/app/app, apps/app/components (trừ apps/app/app/proto/**), apps/api/src, apps/agent/agent, packages/validation/src; mỗi dòng chứa một cụm vi của CAM là lỗi '<tệp>:<dòng>: <cụm>', trừ đúng các dòng của 6 mục hanh_dong 'mien' trong kiem-ke.json (lời cho mô hình của Hỏi-1, nhật ký vận hành); mục miễn mà chuỗi cũ không còn ở tệp thì ném 'kmt: mien mo coi <tệp>#<khoá>'. (c) Chiều đỏ viết trước: với mỗi cụm của CAM một mục giả {khoá 'gia-<i>'} mang cụm đó (en viết hoa đầu để thử không phân biệt hoa thường) phải ra đúng một lỗi gọi tên khoá đó — 16 mục, 16 lỗi; ba mục giả «tác nhân», «Tác nhân», «Agent» ở khoá ngoài VAT_DOI_DUNG ra đúng ba lỗi; cùng ba giá trị ở một khoá thuộc VAT_DOI_DUNG ra 0 lỗi. Số lỗi khác 19 hoặc mục giả được phép ra lỗi thì ném 'kmt: luat khong bat <khoá>'. (d) VAT_DOI_DUNG trùng khít hợp của hai nhóm mô-đun vật đội dựng (mọi agent-builder-*.ts và settings-ket-noi.ts) với các mục hanh_dong 'giu' của kiem-ke.json; lệch thì ném 'kmt: vat doi dung lech kiem-ke <khoá>'."
