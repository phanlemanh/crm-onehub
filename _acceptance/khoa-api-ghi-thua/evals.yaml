    expected: "Muc ve ban va khoa-api-ghi-thua trong docs/api.md tra loi duoc hai cau co/khong: (1) co neu dieu kien go ban va gan voi better-auth#10921 khong; (2) co chi dan phai lam lai ban va khi nang @better-auth/api-key khong. Ca hai co thi dat"
    evidence_required: [judged_by, verdict, rationale]

