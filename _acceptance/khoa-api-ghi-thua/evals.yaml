  - id: E13
    criterion: AC-9
    executor: judgment
    question: "Tren cau hinh cua kho (luu khoa bang CSDL, khong co secondaryStorage), tep va co chi doi hai viec va chi khi co tuy chon lastRequestUpdateIntervalMs khong: hai nhanh skip cua evaluateRateLimit bo ghi lastRequest con trong nguong, va claimUsageInDatabase bo lan dong dau updatedAt? Co khong doi cach dem cua nhanh rate-limit bat, khong cham consumeRemaining, khong them chu thich khong? Design doc va AC-9 co noi ro duong secondary-storage bi cham nhung kho khong dung khong? Nguong co nam o packages/auth/src/api-keys.ts khong?"
    inputs: [patches/@better-auth%2Fapi-key@1.6.25.patch, packages/auth/src/api-keys.ts, packages/auth/src/auth.ts, docs/superpowers/specs/2026-09-26-khoa-api-ghi-thua-design.md, _acceptance/khoa-api-ghi-thua/contract.md]
    paths:
      - "patches/@better-auth%2Fapi-key@1.6.25.patch"
      - "packages/auth/src/api-keys.ts"
      - "packages/auth/src/auth.ts"
      - "docs/superpowers/specs/2026-09-26-khoa-api-ghi-thua-design.md"
      - "_acceptance/khoa-api-ghi-thua/contract.md"
    expected: "Tren cau hinh cua kho ban va chi doi hai viec co dieu kien tuy chon; khong doi cach dem rate-limit bat, khong cham consumeRemaining, khong chu thich; duong secondary-storage bi cham duoc khai ro va AC-11 giu dieu kien kho khong dung no; nguong o module hang so"
    evidence_required: [judged_by, verdict, rationale]

