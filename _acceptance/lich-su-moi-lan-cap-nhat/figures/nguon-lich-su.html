<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nguồn của Lịch sử</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #fafafa;
      --color-ink:    #171717;
      --color-muted:  #575757;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Lora', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1280px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.25; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Luồng dữ liệu · Nguồn của Lịch sử · Cổng Phạm vi</p>
    <h1>Một nguồn lần, hai luồng đọc: Lịch sử lấy mọi lần, bốn nơi khác giữ theo tuần</h1>

    <svg viewBox="0 0 1280 432" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bảng OkrCheckIn đi qua lanCuaKr rồi chia hai thủ tục. okr.lichSuKr mới lấy mọi lần, chuỗi mỗi lần một điểm, cho mục Lịch sử của chi tiết KR. okr.dienBien giữ nguyên, lấy lần cuối mỗi tuần, cho hộp cập nhật, khối lần trước, dải tự tin và mức đổi của Họp tuần.">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#575757"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#006B4F"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#fafafa"/>

      <g fill="none" stroke="#575757" stroke-width="1.2">
        <line x1="200" y1="172" x2="280" y2="172" marker-end="url(#arrow)"/>
        <path d="M440 192 H520 Q528 192 528 200 V264 Q528 272 536 272 H680" marker-end="url(#arrow)"/>
        <line x1="920" y1="272" x2="1000" y2="272" marker-end="url(#arrow)"/>
      </g>
      <g fill="none" stroke="#006B4F" stroke-width="1.4">
        <path d="M440 152 H504 Q512 152 512 144 V80 Q512 72 520 72 H680" marker-end="url(#arrow-accent)"/>
        <line x1="920" y1="72" x2="1000" y2="72" marker-end="url(#arrow-accent)"/>
      </g>

      <rect x="564" y="48" width="64" height="16" rx="2" fill="#fafafa"/>
      <text x="596" y="60" fill="#006B4F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MỌI LẦN</text>
      <rect x="552" y="248" width="112" height="16" rx="2" fill="#fafafa"/>
      <text x="608" y="260" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LẦN CUỐI MỖI TUẦN</text>

      <rect x="40" y="132" width="160" height="80" rx="6" fill="#fafafa"/>

      <text x="66" y="147" fill="rgba(23,23,23,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BẢNG</text>
      <text x="120" y="176" fill="#171717" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">OkrCheckIn</text>
      <text x="120" y="194" fill="#575757" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">mỗi lần gửi một dòng</text>

      <rect x="280" y="132" width="160" height="80" rx="6" fill="#fafafa"/>

      <rect x="288" y="138" width="28" height="12" rx="2" fill="transparent" stroke="rgba(23,23,23,0.40)" stroke-width="0.8"/>
      <text x="302" y="147" fill="rgba(23,23,23,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HÀM</text>
      <text x="360" y="176" fill="#171717" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">lanCuaKr</text>
      <text x="360" y="194" fill="#575757" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">sắp theo giờ gửi</text>

      <rect x="680" y="32" width="240" height="80" rx="6" fill="#fafafa"/>
      <rect x="680" y="32" width="240" height="80" rx="6" fill="rgba(0,107,79,0.08)" stroke="#006B4F" stroke-width="1.4"/>
      <rect x="688" y="38" width="28" height="12" rx="2" fill="transparent" stroke="rgba(0,107,79,0.50)" stroke-width="0.8"/>
      <text x="702" y="47" fill="#006B4F" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MỚI</text>
      <text x="800" y="70" fill="#171717" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">okr.lichSuKr</text>
      <text x="800" y="86" fill="#575757" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">mọi lần · chuỗi mỗi lần một điểm</text>
      <text x="800" y="102" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AC-1 · AC-2</text>

      <rect x="680" y="232" width="240" height="80" rx="6" fill="#fafafa"/>
      <rect x="680" y="232" width="240" height="80" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <rect x="688" y="238" width="48" height="12" rx="2" fill="transparent" stroke="rgba(23,23,23,0.40)" stroke-width="0.8"/>
      <text x="712" y="247" fill="rgba(23,23,23,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CÓ SẴN</text>
      <text x="800" y="270" fill="#171717" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">okr.dienBien</text>
      <text x="800" y="286" fill="#575757" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">mỗi tuần một điểm · giữ nguyên</text>
      <text x="800" y="302" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AC-9</text>

      <rect x="1000" y="32" width="240" height="80" rx="6" fill="#fafafa"/>
      <rect x="1000" y="32" width="240" height="80" rx="6" fill="#f2f2f2" stroke="rgba(23,23,23,0.30)" stroke-width="1"/>
      <text x="1120" y="70" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lịch sử của chi tiết KR</text>
      <text x="1120" y="86" fill="#575757" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">mỗi lần một dòng, một điểm</text>
      <text x="1120" y="102" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AC-4 · AC-5</text>

      <rect x="1000" y="212" width="240" height="120" rx="6" fill="#fafafa"/>
      <rect x="1000" y="212" width="240" height="120" rx="6" fill="#f2f2f2" stroke="rgba(23,23,23,0.30)" stroke-width="1"/>
      <text x="1120" y="240" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bốn nơi đọc theo tuần</text>
      <text x="1120" y="260" fill="#575757" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">hộp cập nhật</text>
      <text x="1120" y="276" fill="#575757" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">khối lần trước</text>
      <text x="1120" y="292" fill="#575757" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">dải tự tin</text>
      <text x="1120" y="308" fill="#575757" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">mức đổi Họp tuần</text>

      <line x1="40" y1="364" x2="1240" y2="364" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>
      <text x="40" y="384" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>

      <rect x="40" y="396" width="24" height="12" rx="2" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="72" y="406" fill="#575757" font-size="9" font-family="'Geist', sans-serif">Dữ liệu, thủ tục có sẵn</text>

      <rect x="216" y="396" width="24" height="12" rx="2" fill="rgba(0,107,79,0.08)" stroke="#006B4F" stroke-width="1.4"/>
      <text x="248" y="406" fill="#575757" font-size="9" font-family="'Geist', sans-serif">Thủ tục mới của vòng</text>

      <rect x="384" y="396" width="24" height="12" rx="2" fill="#f2f2f2" stroke="rgba(23,23,23,0.30)" stroke-width="1"/>
      <text x="416" y="406" fill="#575757" font-size="9" font-family="'Geist', sans-serif">Nơi đọc trên màn</text>

      <line x1="528" y1="402" x2="556" y2="402" stroke="#006B4F" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="564" y="406" fill="#575757" font-size="9" font-family="'Geist', sans-serif">Luồng mới</text>
    </svg>
  </div>
</body>
</html>
