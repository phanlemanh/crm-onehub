<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lật Ngoài-1 của VK7</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #fafafa;
      --color-ink:    #171717;
      --color-muted:  #575757;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Lora', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1240px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.25; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Cây quyết định · Hỏi-1 · Cổng Phạm vi</p>
    <h1>Lật Known limits Ngoài-1 của VK7 để Lịch sử ghi mỗi lần một dòng?</h1>

    <svg viewBox="0 0 1240 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hỏi-1: lật Ngoài-1 của VK7 (lịch sử gom theo tuần) hay không. Lật thì đổi hai phép đo của VK7 qua cham-tep, ghi dòng sổ decided_by ở hồ sơ ngan-kr-mot-cho, và SV7 làm được Lịch sử mỗi lần một dòng. Không lật thì Lịch sử vẫn gom tuần, SV7 không đạt ngưỡng sống và đóng hàng.">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#575757"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#006B4F"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#fafafa"/>

      <g fill="none" stroke="#575757" stroke-width="1.2">
        <path d="M160 184 V252 Q160 260 168 260 H360" marker-end="url(#arrow)"/>
        <line x1="600" y1="260" x2="680" y2="260" marker-end="url(#arrow)"/>
      </g>
      <g fill="none" stroke="#006B4F" stroke-width="1.4">
        <line x1="280" y1="120" x2="360" y2="120" marker-end="url(#arrow-accent)"/>
        <line x1="600" y1="120" x2="680" y2="120" marker-end="url(#arrow-accent)"/>
        <line x1="880" y1="120" x2="960" y2="120" marker-end="url(#arrow-accent)"/>
      </g>

      <rect x="300" y="96" width="40" height="16" rx="2" fill="#fafafa"/>
      <text x="320" y="108" fill="#006B4F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LẬT</text>
      <rect x="220" y="236" width="88" height="16" rx="2" fill="#fafafa"/>
      <text x="264" y="248" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KHÔNG LẬT</text>

      <polygon points="160,56 280,120 160,184 40,120" fill="#fafafa"/>
      <polygon points="160,56 280,120 160,184 40,120" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="160" y="112" fill="#171717" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lật Ngoài-1 của VK7</text>
      <text x="160" y="127" fill="#171717" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">(lịch sử gom theo tuần)?</text>
      <text x="160" y="144" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AC-10</text>

      <rect x="360" y="72" width="240" height="96" rx="6" fill="#fafafa"/>
      <rect x="360" y="72" width="240" height="96" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="480" y="98" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đổi hai phép đo VK7</text>
      <text x="480" y="114" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">qua <tspan font-family="'Geist Mono', monospace" font-weight="500">cham-tep</tspan></text>
      <text x="480" y="136" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ca vk7-than-ngan</text>
      <text x="480" y="152" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">bước gom theo tuần · man.mjs</text>

      <rect x="680" y="80" width="200" height="80" rx="6" fill="#fafafa"/>
      <rect x="680" y="80" width="200" height="80" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="780" y="114" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dòng sổ <tspan font-family="'Geist Mono', monospace" font-weight="500">decided_by</tspan></text>
      <text x="780" y="132" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ở ngan-kr-mot-cho</text>

      <rect x="960" y="72" width="240" height="96" rx="48" fill="#fafafa"/>
      <rect x="960" y="72" width="240" height="96" rx="48" fill="rgba(0,107,79,0.08)" stroke="#006B4F" stroke-width="1.4"/>
      <text x="1080" y="108" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SV7 làm được:</text>
      <text x="1080" y="124" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lịch sử mỗi lần một dòng</text>
      <text x="1080" y="144" fill="#006B4F" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">MÁY KHUYÊN</text>

      <rect x="360" y="228" width="240" height="64" rx="6" fill="#fafafa"/>
      <rect x="360" y="228" width="240" height="64" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="480" y="264" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lịch sử vẫn gom tuần</text>

      <rect x="680" y="220" width="240" height="80" rx="40" fill="#fafafa"/>
      <rect x="680" y="220" width="240" height="80" rx="40" fill="rgba(23,23,23,0.03)" stroke="rgba(23,23,23,0.30)" stroke-width="1"/>
      <text x="800" y="256" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SV7 không đạt ngưỡng sống</text>
      <text x="800" y="272" fill="#575757" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">đóng hàng</text>

      <line x1="40" y1="332" x2="1200" y2="332" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>
      <text x="40" y="352" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI · HÌNH DÁNG CHỈ LOẠI NÚT</text>

      <rect x="40" y="364" width="24" height="12" rx="2" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="72" y="374" fill="#575757" font-size="9" font-family="'Geist', sans-serif">Bước</text>

      <polygon points="168,370 180,364 192,370 180,376" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="200" y="374" fill="#575757" font-size="9" font-family="'Geist', sans-serif">Quyết định</text>

      <rect x="304" y="364" width="24" height="12" rx="6" fill="rgba(23,23,23,0.03)" stroke="rgba(23,23,23,0.30)" stroke-width="1"/>
      <text x="336" y="374" fill="#575757" font-size="9" font-family="'Geist', sans-serif">Kết cục</text>

      <line x1="440" y1="370" x2="468" y2="370" stroke="#006B4F" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="476" y="374" fill="#575757" font-size="9" font-family="'Geist', sans-serif">Đường máy khuyên</text>
    </svg>
  </div>
</body>
</html>
