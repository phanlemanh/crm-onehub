schema_version: 1
feature_slug: tro-ly-okr-de-xuat
evals:
  - id: E1
    criterion: AC-1
    executor: test
    layer: backend-effect
    cmd: config:executors.test.tdx_quyen_nut
    expected: "exit 0; bài API trên kho _test có bộ OKR mẫu nạp bằng napBoOkrMau (hàm nạp thật của M, không gieo tay) và cấu hình lưu qua okr.setProgram. MA TRẬN TOÀN PHẦN viết trước trong bài: người {quản trị, trưởng phòng ban của Mục tiêu, phụ trách KR không sửa được Mục tiêu, thành viên không sửa được, vai okr} × đích {Mục tiêu OneHub, Mục tiêu phòng ban, KR của phòng ban} × nấc đơn vị {tat, an, bat} → mỗi ô một kỳ vọng {sanSang bat | lyDo có tên | 403}; gọi bốn thủ tục okr.troLySanSang, okr.troLyDeXuat, okr.troLyDanhSach, okr.troLyQuyet (nhan, sua, bac, bo-qua trên dòng do nop_de_xuat thật ghi) qua tRPC VÀ qua REST (restMeta của router) cho mọi ô; số khẳng định = số ô × số thủ tục (quyết tính bốn cách) × 2 đường (in ra; lệch là đỏ). Ô có nghĩa bat chỉ khi người sửa được đúng thứ đang hỏi và nấc bat. troLyDanhSach: đối chứng dương — người phụ trách KR nhận đúng tập id dòng của KR đó (so tập, không đếm); thành viên không sửa được → 403. troLyQuyet bac/bo-qua của người không sửa được đích → 403 và okrDeXuat vẫn 'cho'. Chiều đỏ trên cùng bảng: (a) bản sao bỏ assertSuaKr ở nhánh keyResultId → ô 'phụ trách KR khác × KR' ra bat, thông điệp ghim 'o lech: <nguoi> x <dich> x <nac> x <thu tuc>'; (b) bản sao bỏ kiểm quyền ở nhánh bac → 'bac khong quyen: <nguoi>'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [apps/api/src/okr/tro-ly.service.ts, apps/api/src/okr/okr.router.ts, apps/api/src/okr/okr-access.service.ts, packages/db/src/okr-tro-ly.ts, apps/api/test/tro-ly-okr-de-xuat-quyen.spec.ts, apps/api/test/tro-ly-okr-san.ts]

