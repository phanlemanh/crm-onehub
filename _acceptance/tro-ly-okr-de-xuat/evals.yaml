  - id: E4
    criterion: AC-2
    executor: ui-check
    layer: ui-observed
    cmd: config:executors.script.tdx_man_that
    steps:
      - "Cảnh cây (canh-cay.mjs) trước màn đầu tiên; lệch cây → mã 2"
      - "Phiên đo riêng (tien-de); nạp bộ OKR mẫu bằng bun run okr:mau --moc <ghim>; bật góp ý cho một phòng ban mẫu qua okr.setProgram; đăng nhập dev:session trưởng phòng đó"
      - "Theo đơn vị › Mục tiêu của phòng › Sửa → ảnh ST-muctieu-nut ở 1440 và 390"
      - "Gõ một chữ vào tên → ảnh ST-muctieu-nut-khoa-sua; hoàn lại"
      - "Bấm góp ý (model thật có ZDR trên kho đo; thiếu khoá thì mã 2, không xanh) → ảnh ST-muctieu-dang-soan, rồi ST-muctieu-co-dong khi có dòng"
      - "Sửa một dòng → ST-muctieu-sua-dong; Nhận → ST-muctieu-da-quyet: ô tên trong form đổi đúng câu đã nhận, toast có Hoàn tác"
      - "Bấm Hoàn tác trên toast → okr.objective đọc lại title bằng câu cũ; rang/hoan-tac.sql trên kho đo đếm 1; Nhận lại một lần nữa để tiếp"
      - "Tab Vết của Mục tiêu → dòng có 'theo đề xuất của Trợ lý OKR'"
      - "Hộp KR của một KR nguồn CRM mẫu → ảnh ST-kr-xu-huong"
      - "Đăng nhập quản trị mẫu; Cài đặt › Chương trình OKR → ảnh ST-caidat-nac; đặt Chế độ ẩn cho một phòng ban khác, lưu; trưởng phòng đó sửa tên một Mục tiêu → chờ lượt ẩn xong → quản trị tải lại, ảnh ST-sodo-co-so, mở lượt → ảnh ST-sodo-ngan; trưởng phòng đó mở lại hộp Mục tiêu → không có nút, không có cột"
      - "Mọi ảnh ở 1440 và 390; đo scrollWidth ≤ clientWidth mỗi ảnh"
    expected: "exit 0; mỗi bước có ảnh trong .acceptance-runs/tro-ly-okr-de-xuat/man/ và một dòng kết quả; ô tên sau Nhận bằng giá trị đọc lại qua okr.objective; hàng OkrTrail mới có note tro-ly-okr:<id>; không bước nào tràn ngang. Chiều đỏ ghim trong script: trước khi bấm Nhận, bản đọc lại tên đã lưu phải KHÁC câu mới (nếu bằng nhau thì bước Nhận không chứng gì, mã 3 'nhan khong doi gi')."
