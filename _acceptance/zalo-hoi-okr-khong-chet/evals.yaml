schema_version: 1
feature_slug: zalo-hoi-okr-khong-chet
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.zhok_c33
    paths: [apps/agent/agent/tools/tro-ly-okr-ngoai.ts, apps/agent/agent/lib/okr/config.ts, apps/agent/agent/hooks/okr-uy-quyen.ts, apps/agent/agent/lib/okr/uy-quyen.ts, "apps/agent/agent/subagents/tro_ly_okr/**", _acceptance/zalo-hoi-okr-khong-chet/rang/c33.mjs, _acceptance/zalo-hoi-okr-khong-chet/bo-do/c33.json]
    expected: "exit 0; rang/c33.mjs chạy `bun _acceptance/tro-ly-doc-kho/rang/cham-bo-do.ts --bo _acceptance/zalo-hoi-okr-khong-chet/bo-do/c33.json` (bàn đo thật: kho đo dùng-một-lần, eve dev của apps/agent, Zalo giả, model gốc thật) đúng SÁU lượt liền. Mỗi lượt chạy tuần tự (cham-bo-do ghi vào thư mục cố định .acceptance-runs/tro-ly-doc-kho/cham-bo-do); ngay sau lượt, c33.mjs chép eve.log và ket-qua.jsonl của thư mục đó sang thư mục bằng chứng riêng .acceptance-runs/zalo-hoi-okr-khong-chet/c33/xanh-<n>/ rồi mới đọc. Lượt nào eve.log có «→ subagent tro_ly_okr» (model vẫn gọi subagent thật dù có công cụ đè) thì hợp lệ khi eve.log có '[okr-uy-quyen] ngoai-okr purpose=zalo' — thiếu thì in «goi that khong qua hook moi» và tính là sai; số lượt có gọi in «co goi subagent: <k>/6», không đòi model gọi. Với MỌI lượt: (1) ket-qua.jsonl có đúng một hàng luot 2 id c33, ketQua = «da-tra-loi», loi = null — sai thì in «c33 ZaloHoi <ketQua>»; (2) eve.log không chứa «may be called only from an OKR session» — có thì in «uy quyen OKR giet luot»; (3) ô «trả lời trên Zalo» của c33 trong bảng «Lượt hai» của <dir>/cham-bo-do.md tách theo « / » (cham-bo-do nối các tin Zalo giả nhận bằng « / ») ra đúng một tin; tin đó khác nguyên văn ZALO.loi.tacTuLoi (import từ apps/agent/agent/lib/zalo-config.ts) và chứa «OKR» không phân biệt hoa thường — sai thì in «tra loi khong co nghia: <chữ>». Một lượt sai → exit 1; bàn đo không chạy được → exit 2; đủ sáu lượt đạt → in «C33: 6/6 luot dat» và exit 0. Chiều đỏ của đường có gọi trên eve thật đã đo ở round 1 (.acceptance-runs/zalo-hoi-okr-khong-chet/c33/do-3: hook cũ ném «may be called only from an OKR session», lượt chết) và không chạy lại; chiều đỏ của hook mới đo bằng cặp (d) ở E5."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.zhok_ngoai
    paths: [apps/agent/agent/tools/tro-ly-okr-ngoai.ts, apps/agent/agent/lib/okr/config.ts, apps/agent/test/okr-uy-quyen-ngoai.spec.ts]
    expected: "exit 0; ma trận viết trước, số dòng = SESSION_PURPOSES.length = 8 (bài khẳng định hai số bằng nhau): mỗi giá trị purpose dựng ctx bằng phienAudit(<id>, purpose) của test/support/eve-kieu.ts — cùng fixture mà okr-chi-tro-ly.spec.ts dùng cho resolver step.started — rồi gọi THẲNG resolver step.started của tools/tro-ly-okr-ngoai.ts. okr → null, sai thì ném «phien okr bi de tro_ly_okr». Bảy giá trị còn lại → object có đúng một khoá «tro_ly_okr» (sai thì ném «<purpose>: khong de tro_ly_okr»); gọi execute({}) → { ok: false, reason } với reason === TRO_LY_OKR.ngoaiPhien.lyDo. Công tắc đo: đặt process.env[TRO_LY_OKR.ngoaiPhien.bienBoDe] = '1' thì purpose zalo nhận null (sai thì ném «cong tac bo de khong tat»), xoá biến thì về như trên — cặp (g) bản sao cho resolver bỏ qua công tắc → đỏ «cong tac bo de khong tat». Vế «okr còn nguyên subagent thật» trên eve thật đo ở E6. CHIỀU ĐỎ (rang/dot-bien.mjs): cặp (a) bản sao cho resolver trả null với purpose zalo → dòng zalo đỏ «zalo: khong de tro_ly_okr»; cặp (b) bản sao bỏ điều kiện purpose (luôn đè) → dòng okr đỏ «phien okr bi de tro_ly_okr»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.zhok_hook
    paths: [apps/agent/agent/hooks/okr-uy-quyen.ts, apps/agent/agent/lib/okr/uy-quyen.ts, apps/agent/test/okr-uy-quyen-ngoai.spec.ts, apps/agent/test/okr-uy-quyen.spec.ts]
    expected: "exit 0; hai lệnh: (1) khối «hook» của okr-uy-quyen-ngoai.spec.ts — ma trận viết trước 8 purpose × 3 loại xin (gọi tro_ly_okr · gọi công cụ khác · gọi tro_ly_okr lần hai), số dòng = SESSION_PURPOSES.length × 3 (bài khẳng định), gọi THẲNG handler actions.requested của hooks/okr-uy-quyen.ts với ctx dựng bằng phienAudit như E2, spyOn(console.warn) thu dòng: mọi purpose khác okr gọi tro_ly_okr → không ném, đúng một dòng '[okr-uy-quyen] ngoai-okr purpose=<purpose>' và uyQuyenOkrState.get() không đổi — ném thì «<purpose>: hook van giet luot»; dòng log chứa chữ của câu hỏi gieo ('cau-hoi-rieng-h1') thì «lo cau hoi trong log»; purpose okr gọi công cụ khác → ném đúng LOI_UY_QUYEN.khacTroLy, gọi lần hai → ném đúng LOI_UY_QUYEN.lanHai; (2) okr-uy-quyen.spec.ts (bài của tro-ly-okr-nen, chỉ các dòng ma trận của purpose khác okr đổi từ mong lỗi sang mong cho qua — E4 đo chỉ những dòng đó đổi) chạy xanh. CHIỀU ĐỎ: cặp (d) của rang/dot-bien.mjs — bản sao cho hook ném lại khi purpose khác okr → (1) đỏ «zalo: hook van giet luot»; cặp (c) giữ: bản sao cho quyetUyQuyen trả cho:true khi purpose okr gọi công cụ khác → (1) đỏ «okr: khac tro ly khong bi chan»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: script
    cmd: config:executors.script.zhok_pham_vi
    paths: [_acceptance/zalo-hoi-okr-khong-chet/rang/pham-vi.mjs]
    expected: "exit 0; rang/pham-vi.mjs lấy danh sách tệp đổi giữa merge-base với origin/onehub và HEAD; mọi tên phải nằm trong đúng danh sách .env.example, _acceptance/tro-ly-okr-nen/run-log.jsonl, _acceptance/tro-ly-okr-nen/evidence-report.md, apps/agent/agent/tools/tro-ly-okr-ngoai.ts, apps/agent/agent/lib/okr/config.ts, apps/agent/agent/lib/okr/uy-quyen.ts, apps/agent/agent/hooks/okr-uy-quyen.ts, apps/agent/test/okr-uy-quyen-ngoai.spec.ts, apps/agent/test/okr-uy-quyen.spec.ts, docs/agent.md, _acceptance/zalo-hoi-okr-khong-chet/**, PRODUCT-MAP.md, LO-TRINH.html, _acceptance/config.yaml, apps/agent/agent/lib/zalo-config.ts, packages/telemetry/src/allowlist.ts, apps/app/lib/agent-transcript.ts, apps/app/lib/messages/kara-ban-ghi.ts; với _acceptance/config.yaml thì diff -U0 không có dòng bỏ nào; với bốn tệp sau thì diff -U0 không dòng bỏ và có đúng số dòng thêm khai trước (1, 1, 1, 2), mỗi dòng chứa «tro-ly-okr-ngoai» — sai thì in «<tệp>: khong dung dong them da khai»; in «PHAM VI: <n> tep, 0 ngoai ranh gioi». Đối chứng trong cùng lệnh, trên danh sách dựng sẵn: rỗng → thoát 2 «diff rong»; .env.example chỉ có đúng một dòng thêm khai TRO_LY_OKR_BO_DE kèm ghi chú; _acceptance/tro-ly-okr-nen/run-log.jsonl chỉ có dòng thêm, mỗi dòng parse được và kind thuộc repin; _acceptance/tro-ly-okr-nen/evidence-report.md chỉ đổi dòng verified_commit và thêm một mục «### Re-pin» ở cuối — sai thì in «tro-ly-okr-nen: doi ngoai phan ghim lai»; okr-uy-quyen.spec.ts chỉ được đổi các dòng ma trận có purpose khác okr (mỗi dòng bỏ/thêm của diff -U0 phải chứa một trong bảy purpose đó) — sai thì in «okr-uy-quyen.spec.ts: doi dong ngoai ma tran ngoai okr»; có apps/agent/agent/subagents/tro_ly_okr/agent.ts → «ngoai ranh gioi: apps/agent/agent/subagents/tro_ly_okr/agent.ts»; có _acceptance/tro-ly-okr-nen/contract.md → «ngoai ranh gioi: _acceptance/tro-ly-okr-nen/contract.md»; có apps/agent/agent/lib/zalo-chi-dan.ts → «ngoai ranh gioi: apps/agent/agent/lib/zalo-chi-dan.ts»; thiếu một đối chứng thì exit 1."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-2
    executor: script
    cmd: config:executors.script.zhok_dot_bien
    paths: [apps/agent/agent/hooks/okr-uy-quyen.ts, apps/agent/agent/lib/okr/nop-de-xuat.ts, apps/agent/agent/tools/tro-ly-okr-ngoai.ts, apps/agent/agent/lib/okr/uy-quyen.ts, apps/agent/test/okr-uy-quyen-ngoai.spec.ts, _acceptance/zalo-hoi-okr-khong-chet/rang/dot-bien.mjs]
    expected: "exit 0; rang/dot-bien.mjs trên bản sao cây, SO_CAP_KHAI = 7: cặp (a), (b), (g) như E2, (c), (d) như E3, (e), (f) như E7 — xanh trước khi phá, đỏ sau khi phá với đúng thông điệp ghim; số cặp đã chạy ≠ SO_CAP_KHAI → exit 1."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-5
    executor: script
    layer: backend-effect
    cmd: config:executors.script.zhok_dau_cuoi
    paths: [apps/agent/agent/tools/tro-ly-okr-ngoai.ts, "apps/agent/agent/subagents/tro_ly_okr/**", "apps/agent/agent/lib/okr/**", apps/agent/agent/hooks/okr-uy-quyen.ts]
    expected: "exit 0; chạy lại E9 của tro-ly-okr-nen (rang/cach-ly-dau-cuoi.mjs --lan 3, không sửa): việc OKR nền thật, eve thật, model thật có cờ ZDR, ba lần, xếp hàng qua _acceptance/tieu-de-cot-doc-tron/rang/mot-luot.sh để không đụng eve dev của E1/E8 (round 1: «A dev server is already running for this eve agent»); cổng của eval đòi calledSubagent('tro_ly_okr', {count:1}) và phiên con chỉ gọi nop_de_xuat — nếu công cụ đè chiếm tên ở purpose okr thì không có phiên con và cổng đỏ. Không có khoá Gateway → mã 2, không xanh."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-6
    executor: test
    layer: backend-effect
    cmd: config:executors.test.zhok_nop_ngoai
    paths: [apps/agent/agent/lib/okr/nop-de-xuat.ts, apps/agent/agent/lib/okr/nop-tom-tat.ts, apps/agent/agent/lib/okr/viec-con.ts, apps/agent/test/okr-uy-quyen-ngoai.spec.ts]
    expected: "exit 0; khối «nop-ngoai» của okr-uy-quyen-ngoai.spec.ts: dựng ctx phiên con bằng token subagent:<phiên gốc>:<callId> (lib/phien-con.ts — cùng khuôn eve truyền cho phiên con) với phiên gốc không có hàng okr-* nào; gieo trước một việc okr-de-xuat ĐANG CHẠY gắn một phiên gốc KHÁC (bàn thử của tro-ly-okr-nen); gọi THẲNG nopDeXuatVao và nopTomTatVao từ phiên con của phiên gốc không có việc, với đầu vào hợp lệ (parse bằng nopDeXuat / schema nộp tóm tắt của @crm/validation/okr-tro-ly); cả hai trả ketQua tu-choi với lý do 'not an OKR session', và count(okrDeXuat), count(okrTomTat) không đổi — sai thì ném «<cong cu>: phien con ngoai OKR ghi duoc» (riêng ca có việc của phiên khác: «nop_de_xuat: nhan viec cua phien khac»). Cặp (f) của rang/dot-bien.mjs: bản sao bỏ điều kiện phiên gốc khi tìm việc (docViecTheoPhienGoc đọc việc đang chạy bất kỳ) → đỏ «nop_de_xuat: nhan viec cua phien khac». Đối chứng dương: gieo một việc okr-de-xuat đang chạy gắn phiên gốc (bàn thử của tro-ly-okr-nen) → nopDeXuatVao ghi được ít nhất một hàng (không ghi thì ném «doi chung: viec OKR that khong ghi duoc»). CHIỀU ĐỎ: cặp (e) của rang/dot-bien.mjs — bản sao bỏ dòng kiểm 'if (!hang)' ở nop-de-xuat.ts → đỏ «nop_de_xuat: phien con ngoai OKR ghi duoc» hoặc lỗi ném khác — thông điệp ghim là dòng error: đầu tiên của bun."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E8
    criterion: AC-7
    executor: script
    cmd: config:executors.script.zhok_ep
    paths: [apps/agent/agent/tools/tro-ly-okr-ngoai.ts, apps/agent/agent/hooks/okr-uy-quyen.ts, apps/agent/agent/lib/okr/uy-quyen.ts, "apps/agent/agent/subagents/tro_ly_okr/**", _acceptance/zalo-hoi-okr-khong-chet/rang/c33.mjs, _acceptance/zalo-hoi-okr-khong-chet/bo-do/c33.json]
    expected: "exit 0; rang/c33.mjs --ep, cùng bàn đo và cùng cách đọc lượt như E1, chạy cham-bo-do với env TRO_LY_OKR_BO_DE=1 (tên biến rút từ TRO_LY_OKR.ngoaiPhien.bienBoDe) — không sửa, không cất tệp nào trong cây; trước và sau lượt kiểm git status sạch cho apps/agent/agent/tools (không sạch thì exit 1 «cay bi cham trong luc do»). Chạy c33 tuần tự tới khi có lượt eve.log chứa «→ subagent tro_ly_okr», tối đa sáu lượt. Mọi lượt đã chạy dùng NGUYÊN ba phép kiểm (1)–(3) của E1 — ZaloHoi da-tra-loi và loi null; không «may be called only from an OKR session»; ô «trả lời trên Zalo» tách theo « / » ra đúng một tin, khác nguyên văn ZALO.loi.tacTuLoi, có «OKR» không phân biệt hoa thường — sai thì in «luot <n>: <lỗi>» và exit 1; lượt có gọi phải có thêm '[okr-uy-quyen] ngoai-okr purpose=zalo' — thiếu thì in «luot <n>: goi that khong qua hook moi» và exit 1. Sáu lượt không lượt nào gọi → in «khong ep duoc goi» và exit 2. Đạt → in «EP: luot <n> goi subagent that, luot song» và exit 0. Chiều đỏ trên eve thật: round 1 do-3 (như E1); hook ở cặp (d) của E5."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
