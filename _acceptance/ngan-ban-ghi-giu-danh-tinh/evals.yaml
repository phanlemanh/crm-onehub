      - "apps/app/test/ngan-ban-ghi-giu-danh-tinh.dom.tsx"
    expected: |
      exit 0; ban may chu users.list = [Lan] dehydrate luc T. Mo ngan, roi trinh duyet setQueryData users.list =
      [Lan, Minh] (moi hon T), closeAll, open lai: users.list van la [Lan, Minh] o luot ve dau va sau mot nhip effect.
      Doi chung duong cung tep: go khoa users.list khoi bo dem roi open lai -> nhan ban may chu [Lan].
      CHIEU DO ghim (E5 ca 3): hydrate cuong buc moi lan mo -> do "gdt: du lieu moi bi ban may chu de".

  - id: E5
    criterion: AC-1
    executor: script
    layer: logic
    cmd: config:executors.script.gdt_chieu_do
    paths:
      - "apps/app/components/crm/record-sheet/nap-san-khi-mo-ngan.tsx"
      - "apps/app/test/ngan-ban-ghi-giu-danh-tinh.dom.tsx"
      - "_acceptance/ngan-ban-ghi-giu-danh-tinh/rang/chieu-do.mjs"
    expected: |
      exit 0 va "gdt chieu do: dat 5/5". Tu kiem cay truoc. Moi ca dung mot git worktree tach roi tu HEAD (duong goc suy
      tu vi tri tep rang), ap dung mot dot bien vao nap-san-khi-mo-ngan.tsx (khop dung 1 cho, khong khop -> ma 2), chay
      tep DOM cua ho so trong ban sao; ca dat khi ma thoat khac 0 VA dau ra chua dung thong diep ghim:
      (1) tep cua merge-base voi origin/onehub -> "gdt: chu ngan dung lai khi doi ngan" va "gdt: ngan dong mot nhip roi moi mo";
      (2) luon do state -> "gdt: ngan rong da nap san";
      (3) hydrate cuong buc moi lan stack khac rong -> "gdt: du lieu moi bi ban may chu de";
      (4) chi do khoa chua co trong bo dem -> "gdt: khoa cu khong nhan ban may chu moi hon";
      (5) doi chung duong: ban sao KHONG dot bien -> exit 0.
      Cay that khong doi sau luot (so bam truoc/sau); lech -> "CHIEU DO GHI CAY <tep>" va exit 1.

