    expected: |
      exit 0 va "ngan-ban-ghi-giu-danh-tinh man: dat"; cung luot voi E6, phep mo: /deals da tai xong (khong record=),
      cai MutationObserver roi bam dong «Wise» cua bang, ghi performance.now() luc bam. Phan tu ngan duoc chen vao trang
      trong <= 150 ms ke tu luc bam, chen dung 1 lan, luc chen getAnimations() co animation dang chay, va observer khong
      ghi lan go nao cho toi khi moi animation cua no ket thuc.
      Gioi han khai: loi luc mo cua ban cu la tre mot nhip ranh (requestIdleCallback), khong phai bien roi hien; tren
      may ranh nhip do co the < 150 ms nen E7 la thuoc giu-khong-hoi-quy. Chieu do cua no (E12) them do tre 400 ms vao
      sau-khi-tai-xong.ts cua ban sao mang ma cu -> do "man: ngan mo tre".

