      exit 0 va "ngan-ban-ghi-giu-danh-tinh man: dat"; ma tran viet truoc 2 kho (1440, 390) x 3 phep (dong, mo, mo lai)
      = 6 o; moi o in mot dong "o <kho> <phep>: dat|<ly do>" vao stdout VA vao evidence/gdt-man.log; so dong o === 6.
      Phep dong: /deals?record=deal:seed-deal-wise-1 da mo xong; cai MutationObserver tren document.body (subtree)
      truoc khi bam nut dong; ngay sau bam: phan tu ngan ([data-slot=sheet-content] o 1440, [data-slot=drawer-content]
      o 390) con trong trang, data-state="closed", getAnimations() co it nhat mot animation playState "running"; lan go
      phan tu do (observer) xay ra SAU luc moi animation cua no ket thuc (animationend hoac finished).
      CHIEU DO ghim (E12): phien do dung tu ban sao mang nap-san-khi-mo-ngan.tsx cua merge-base -> do
      "man: ngan bien mat khi dong".

  - id: E7
