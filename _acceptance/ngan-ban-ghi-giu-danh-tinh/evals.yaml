feature_slug: ngan-ban-ghi-giu-danh-tinh
evals:
  - id: E1
    criterion: AC-1
    executor: test
    layer: logic
    cmd: config:executors.test.gdt_danh_tinh
    paths:
      - "apps/app/components/crm/record-sheet/nap-san-khi-mo-ngan.tsx"
      - "apps/app/components/crm/record-sheet/record-stack.ts"
      - "apps/app/test/ngan-ban-ghi-giu-danh-tinh.dom.tsx"
    expected: |
      exit 0; NapSanKhiMoNgan THAT boc mot dau do dem so lan dung (mount) va go (unmount); useRecordStack THAT tren
      NuqsTestingAdapter hasMemory, cac ham goi tu nut ben trong cay. Ma tran viet truoc 7 buoc phu ca nam ham:
      open(company:a) [rong->1], lotDuoi(contact:c) [1->2], close() [2->1], close() [1->rong], open(deal:b) [rong->1],
      thayDinh(deal:d) [1->1 khac], closeAll() [->rong]. Sau MOI buoc doc stack de chung minh buoc da xay ra dung
      (so khoa ky vong viet truoc tung buoc), roi doc dau do: dung === 1 va go === 0. expect(soBuoc).toBe(7).
      CHIEU DO ghim (E5 ca 1): ban sao tep cua merge-base -> do "gdt: chu ngan dung lai khi doi ngan".

  - id: E2
    criterion: AC-2
    executor: test
    layer: logic
    cmd: config:executors.test.gdt_tai_xong
    paths:
      - "apps/app/components/crm/record-sheet/nap-san-khi-mo-ngan.tsx"
      - "apps/app/components/crm/record-sheet/sau-khi-tai-xong.ts"
      - "apps/app/test/ngan-ban-ghi-giu-danh-tinh.dom.tsx"
    expected: |
      exit 0; document.readyState "complete"; dau do ben trong NapSanKhiMoNgan ghi gia tri useSauKhiTaiXong() o moi
      luot ve. Cho co bat true khi ngan rong, roi open(deal:b) va closeAll() roi open(deal:b) lan nua: moi gia tri ghi
      tu luot ve dau sau lan open dau tro di deu la true. Doi chung duong cung tep: mot dau do dung moi ngay luc do
      (khong boc) ghi false o luot ve dau — thuoc nhin thay duoc mot lan dung lai.
      CHIEU DO ghim (E5 ca 1): ban sao tep cua merge-base -> do "gdt: ngan dong mot nhip roi moi mo".

  - id: E3
    criterion: AC-6
    executor: test
    layer: logic
    cmd: config:executors.test.gdt_nap_vai
    paths:
      - "apps/app/components/crm/record-sheet/nap-san-khi-mo-ngan.tsx"
      - "apps/app/lib/ngan-ban-ghi-nap-san.ts"
      - "apps/app/test/ngan-ban-ghi-giu-danh-tinh.dom.tsx"
    expected: |
      exit 0; trang thai may chu dehydrate bang chiKhoaNapSan THAT tu mot QueryClient co ca ba khoa VA mot khoa ngoai
      danh sach (users.me). Ma tran viet truoc 2 vai (khoaNapSan(true), khoaNapSan(false)): dung NapSanKhiMoNgan luc
      ngan rong -> bo dem khong co khoa nap san nao va khong co users.me; open(deal:b) -> o luot ve dau sau open dau do
      doc moi khoa cua vai thay du lieu may chu, tap khoa trong bo dem bang dung tap cua vai, users.me khong co.
      expect(soVai).toBe(2). Ca them: bo dem trinh duyet co san users.list voi dataUpdatedAt nho hon ban may chu;
      open(deal:b), qua mot nhip effect -> users.list mang du lieu may chu.
      CHIEU DO ghim (E5 ca 2): luon do state ke ca khi ngan rong -> do "gdt: ngan rong da nap san"; (E5 ca 4) chi do
      khoa chua co trong bo dem -> do "gdt: khoa cu khong nhan ban may chu moi hon".

  - id: E4
    criterion: AC-7
