<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luồng vào Mọi KR</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #fafafa;
      --color-ink:    #171717;
      --font-sans:    'Geist', system-ui, sans-serif;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <svg viewBox="0 0 1000 576" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hỏi-1 và Hỏi-4: luồng từ Sức khoẻ tới Mọi KR và ngăn KR">
      <defs>

        </marker>

      <text x="32" y="66" fill="#171717" font-size="20" font-family="'Lora', serif">Từ Sức khoẻ tới danh sách KR trượt trong một bấm</text>

      <line x1="124" y1="148" x2="124" y2="196" stroke="#575757" stroke-width="0.8" stroke-dasharray="2,3"/>

      <line x1="216" y1="224" x2="278" y2="224" stroke="#575757" stroke-width="1" marker-end="url(#arrow)"/>

      <text x="664" y="346" fill="#575757" font-size="9" font-family="'Geist Mono', monospace">tinhTrangKr · donViKr · nguoiKr</text>

      <rect x="32" y="392" width="184" height="56" rx="20" fill="#ffffff" stroke="#575757" stroke-width="1"/>

      <text x="124" y="432" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mọi KR</text>

      <text x="620" y="432" fill="#575757" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">(không lọc)</text>

      <text x="32" y="488" fill="#006B4F" font-size="14" font-style="italic" font-family="'Lora', serif">Một bấm từ ô KR trượt tới danh sách đã lọc; số trên ô bằng số dòng.</text>
      <text x="32" y="508" fill="#575757" font-size="12" font-family="'Geist', sans-serif">Ngăn KR mở trên chính trang; đóng ngăn thì đường dẫn còn nguyên bộ lọc.</text>

      <text x="280" y="556" fill="#575757" font-size="10" font-family="'Geist', sans-serif">màn, ô</text>
      <line x1="340" y1="552" x2="372" y2="552" stroke="#006B4F" stroke-width="1.4"/>
      <text x="380" y="556" fill="#575757" font-size="10" font-family="'Geist', sans-serif">đường một bấm</text>
      <line x1="476" y1="552" x2="508" y2="552" stroke="#575757" stroke-width="1" stroke-dasharray="5,4"/>

      <line x1="612" y1="552" x2="644" y2="552" stroke="#575757" stroke-width="0.8" stroke-dasharray="2,3"/>
      <text x="652" y="556" fill="#575757" font-size="10" font-family="'Geist', sans-serif">ghi chú gắn vào</text>
      <text x="968" y="556" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">AC-1 · AC-3 · AC-7 · AC-8 · AC-9</text>

</html>
