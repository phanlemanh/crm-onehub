schema_version: 1
slug: lam-moi-chuyen-viec-qua-loi-chung

evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.lmcv_ba_khoa
    paths:
      - "apps/app/app/(app)/[slug]/settings/members/chuyen-viec-dialog.tsx"
      - "apps/app/lib/trpc/cache.ts"
      - "apps/app/test/lam-moi-chuyen-viec.dom.tsx"
    expected: |
      Test DOM lam-moi-chuyen-viec.dom.tsx ca "ba-khoa": cache.ts THAT. useTRPC (mock
      @/lib/trpc/client) tra ve createTRPCOptionsProxy<AppRouter> THAT cua @trpc/tanstack-react-query
      tren createTRPCClient voi mot link gia tra du lieu theo op.path — khoa query do CHINH thu vien
      sinh, khong viet tay khuon khoa. Query gieo san bang queryOptions(input).queryKey cua cung
      proxy: onboarding.manDanhMuc x2 (hai bo loc), onboarding.bangCot, onboarding.planById,
      onboarding.listSteps, onboarding.listEnrollments, activities.myTasks, companies.byId (khong ai
      xem); onboarding.transferPreview va users.list do hop dang xem. invalidateQueries cua chinh
      QueryClient trong Provider duoc boc de ghi lai tung queryKey.
      Sau khi chon Tuan va bam «Chuyển», cho toi khi lenh dong hop duoc goi. MA TRAN VIET TRUOC:
      (1) danh sach khoa da goi BANG DUNG (toEqual, khong xet thu tu) [trpc.onboarding.manDanhMuc
      .queryKey(), trpc.onboarding.bangCot.queryKey(), trpc.onboarding.transferPreview.queryKey()]
      lay tu cung proxy — thong diep ghim "Expected dung ba khoa lam moi"; (2) 3 query danh muc/bang
      cot isInvalidated = true, moi query mot expect co ten; (3) transferPreview duoc tai them dung
      1 lan (dem qua link gia); (4) 5 query khong lien quan isInvalidated = false, moi query mot
      expect co ten "<ten> khong bi danh dau cu". transferWork qua link gia dung mot lan voi
      {fromUserId: u-h, toUserId: u-t}. Xanh tren ma TRUOC sua lan SAU sua (phep do giu nguyen).
      CHIEU DO (pha thu o S3, commit truoc roi pha tai cho, git checkout sau): bo
      trpc.onboarding.transferPreview.queryKey() khoi muc workTransferred -> do voi
      "Expected dung ba khoa lam moi"; them trpc.onboarding.planById.queryKey() vao muc -> do voi
      cung thong diep va "onboarding.planById khong bi danh dau cu".

  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.lmcv_dong_sau_lam_moi
    paths:
      - "apps/app/app/(app)/[slug]/settings/members/chuyen-viec-dialog.tsx"
      - "apps/app/lib/trpc/cache.ts"
      - "apps/app/test/lam-moi-chuyen-viec.dom.tsx"
    expected: |
      Ca "dong-sau-lam-moi": lan tai thu hai cua onboarding.transferPreview tra ve mot Promise bi
      giu. Bam «Chuyển» -> cho transferWork duoc goi va du 3 loi goi invalidateQueries; roi qua
      20 nhip vong su kien: lenh dong hop CHUA duoc goi va [role=dialog] van con — thong diep ghim
      "hop dong truoc khi lam moi xong". Tha Promise -> lenh dong hop duoc goi (doi chung duong,
      cung fixture). Xanh tren ma truoc va sau sua.
      CHIEU DO (pha thu o S3): doi muc thanh run([], [ba khoa], { settle: "record" }) (ba khoa o
      nhom ban khong cho) -> do voi "hop dong truoc khi lam moi xong"; bo await truoc
      cache.workTransferred() trong dialog -> do voi cung thong diep. (Luu y gap-probe F2:
      goi cache.workTransferred({ settle: "record" }) voi ba khoa o nhom record la dot bien tuong
      duong — run van cho nhom record — nen khong dung lam chieu do.)

  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.lmcv_loi_khong_lam_moi
    paths:
      - "apps/app/app/(app)/[slug]/settings/members/chuyen-viec-dialog.tsx"
      - "apps/app/lib/trpc/cache.ts"
      - "apps/app/test/lam-moi-chuyen-viec.dom.tsx"
    expected: |
      Ca "loi-khong-lam-moi": transferWork nem Error("Nguoi nhan khong con trong khong gian").
      Sau khi bam «Chuyển»: cho toi khi [role=alert] trong hop chua dung cau loi; so loi goi
      invalidateQueries = 0 (thong diep ghim "khong lam moi khi loi"); bo ghi ghi MOI loi goi
      invalidateQueries, loi goi khong queryKey ghi thanh ["(khong khoa)"] (Ngoai-3, F8); lenh dong hop chua goi;
      [role=dialog] van con. DOI CHUNG DUONG CUNG CA, CUNG FIXTURE, CUNG BO GHI: link gia doi sang
      tra thanh cong, bam «Chuyển» lan hai -> dung 3 loi goi invalidateQueries ghi tren cung bo ghi
      (thong diep ghim "bo ghi con song: lan hai thanh cong phai co 3 loi goi") va hop dong.
      CHIEU DO (pha thu o S3): chuyen loi goi lam moi sang onSettled -> "khong lam moi khi loi" do.

  - id: E4
    criterion: AC-4
    executor: script
    cmd: config:executors.script.lmcv_soi_ma
    paths:
      - "apps/app/app/(app)/[slug]/settings/members/chuyen-viec-dialog.tsx"
      - "apps/app/lib/trpc/cache.ts"
      - "_acceptance/lam-moi-chuyen-viec-qua-loi-chung/rang/soi-ma.mjs"
    expected: |
      Soi cay cu phap TypeScript (goi typescript cua kho). Goc kho suy tu vi tri script
      (import.meta.url), khong dung process.cwd(); dong dau in duong tuyet doi hai tep da soi.
      MA TRAN VIET TRUOC, 6 dong:
      (1) chuyen-viec-dialog.tsx: 0 loi goi invalidateQueries/refetchQueries/queryKey/useQueryClient;
      (2) dialog goi useCrmCache(); (3) dialog goi .workTransferred(; (4) cache.ts: kieu CrmCache co
      thanh vien workTransferred; (5) cache.ts: doi tuong tra ve cua useCrmCache co thuoc tinh
      workTransferred; (6) loi goi run(...) cua muc do co mang dau gom dung ba khoa
      trpc.onboarding.manDanhMuc.queryKey(), trpc.onboarding.bangCot.queryKey(),
      trpc.onboarding.transferPreview.queryKey() va mang thu hai rong.
      DOI CHUNG AM CHAY TRONG CUNG LENH: doan ma mau viet trong tep thuoc
      (queryClient.invalidateQueries({ queryKey: trpc.x.queryKey() }) va useQueryClient()) di qua
      CHINH bo bat vi pham va phai bi bat du 3 vi pham — thieu thi ma 2 "thuoc hong".
      Ket: "6 DUNG, 0 SAI — ma thoat 0"; vi pham in "SAI <tep>:<dong> <loi goi>" va ma 1.
      O S3 chay them mot lan tu thu muc lam viec /tmp (cd /tmp && bun <duong tuyet doi script>)
      -> cung ket "6 DUNG, 0 SAI" va cung hai duong tuyet doi.
      CHIEU DO (ma hien tai, truoc sua): "SAI chuyen-viec-dialog.tsx:<dong> useQueryClient",
      "... invalidateQueries", ba dong "... queryKey", "SAI ... khong goi useCrmCache",
      "SAI ... khong goi .workTransferred(", "SAI cache.ts ... khong co workTransferred", ma 1.

  - id: E5
    criterion: AC-5
    executor: script
    cmd: config:executors.script.lmcv_khong_hoi_quy
    paths:
      - "apps/app/app/(app)/[slug]/settings/members/chuyen-viec-dialog.tsx"
      - "apps/app/lib/trpc/cache.ts"
      - "apps/app/test/lam-moi-chuyen-viec.dom.tsx"
      - "_acceptance/lam-moi-chuyen-viec-qua-loi-chung/rang/khong-hoi-quy.mjs"
    expected: |
      rang/khong-hoi-quy.mjs (goc kho suy tu vi tri script, khong hardcode):
        1. TEP_VONG = ba tep ma cua vong nay (dialog, cache.ts, lam-moi-chuyen-viec.dom.tsx), hang
           trong script. Moc co dinh: cap gop PR #145, B = 100847e8a^1, D = 100847e8a (sha day du
           trong script); sha khong giai duoc -> "KHONG DO DUOC" ma 2. D_that = git diff --name-only
           B..D bo _acceptance/** va glob risk_tiers.t1_skip_globs; tep ma nao cua D_that ngoai
           TEP_VONG -> ma 1 "tep ngoai vong: <tep>" (danh sach TEP_VONG khong duoc sot). evals.yaml
           va config.yaml doc bang bo doc cua kit (lib/eval-yaml, evidence-core resolveConfigKey/
           resolveConfigList/evalPathsOf/isRepinMachineEval), cung bo doc luot ghim dung.
        2. Ham rut(D): moi eval test/script (khong status not-run) cua ho so signed-off/
           machine-cleared khac ho so nay co mot glob trong paths CUA CHINH EVAL khop mot tep cua D
           (** xuyen thu muc, * mot cap, ky tu khac nghia den — cung ngu nghia globToRe cua kit);
           gom theo lenh config: giai tu _acceptance/config.yaml; ref khong giai duoc -> "KHONG DO
           DUOC" ma 2.
        3. DOI CHUNG DUONG CO DINH (khong phu thuoc diff): rut([dialog]) phai chua
           moi-phia-deu-thay-ke-hoach:E3 va rut([cache.ts]) phai chua thanh-vien-hai-khoi-cung-khuon:E19
           — thieu -> ma 1 "bo rut tap hong".
        4. Tap = rut(TEP_VONG). LOAI QUET LONG: lenh tro toi mot tep _acceptance/*/rang/*.mjs co chu
           "worktree" hoac "repin-lane" (mot luot quet dung cay goc khac hoac chay lan ghim) -> in "LOAI quet long: <lenh> (<eval>)", khong
           chay; in so ho so da quet (> 0), so eval, so lenh chay, so lenh loai. HEAD da chua D (vong
           da len onehub) -> in "vong da len onehub o <D8> — ve chay lai lenh cua ho so khac do luot
           kiem cheo dem kiem-cheo-sau-gop tra loi", ma 0 (tien le thuoc-khong-tu-het-han AC-6).
        5. HEAD chua chua D: chay tuan tu tung lenh o HEAD tu goc kho; lenh do chay lai mot lan o HEAD (xanh -> in
           "chap chon", khong tinh); lenh con do chay tren worktree tam o B
           (.acceptance-runs/lam-moi-chuyen-viec-qua-loi-chung/goc: .env symlink, bun install,
           bun run db:generate; go trong finally). Xanh o B -> ma 1 "vong nay lam do them N lenh:
           <lenh> (<eval>)". Khong lenh nao -> "khong lenh nao do them so voi <B8>", ma 0.
      So lieu S1 (25/09, rut tren dialog + cache.ts): 49 lenh cua ~25 ho so; tap tay tam khoa ban
      dau sot 41 — ly do eval nay rut bang may [mot-duong-ghi-phong-ban#F1].
      CHIEU DO (pha thu o S3, commit truoc, git checkout sau): xoa loi goi chuyen.mutate(...) trong
      dialog -> kh2_chuyen_giao_man do o HEAD, xanh o B -> ma 1 ghi ten lenh va
      moi-phia-deu-thay-ke-hoach:E3; rut dung ham rut voi D rong o buoc 3 (pha tren ban sao script)
      -> ma 1 "bo rut tap hong".
