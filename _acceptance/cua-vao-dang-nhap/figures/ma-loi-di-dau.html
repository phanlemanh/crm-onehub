<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mã lỗi đi đâu</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #fafafa;
      --color-ink:     #171717;
      --color-muted:   #575757;
      --color-accent:  #006B4F;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1280px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    svg { width: 100%; min-width: 1000px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Cổng Phạm vi · Luồng · cua-vao-dang-nhap</p>

    <svg viewBox="0 0 1248 416" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#575757"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#006B4F"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f4f7a"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#fafafa"/>

      <text x="32" y="36" fill="#171717" font-size="20" font-family="'Lora', serif">Mã lỗi đi đâu</text>
      <text x="32" y="56" fill="#575757" font-size="12" font-family="'Geist', sans-serif">Câu tiếng Anh của hook đi nguyên tới /sign-in, chỉ khoảng trắng thành _</text>

      <text x="1216" y="28" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">AC-5 · AC-6 · AC-7 · AC-8</text>

      <path d="M 32 116 L 32 108 L 544 108 L 544 116" fill="none" stroke="#575757" stroke-width="1"/>
      <text x="288" y="100" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">đo bằng mỏ neo nguồn — <tspan fill="#171717" font-weight="600">E5</tspan></text>

      <path d="M 608 116 L 608 108 L 960 108 L 960 116" fill="none" stroke="#575757" stroke-width="1"/>
      <text x="784" y="100" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">đo bằng test và bàn đo — <tspan fill="#171717" font-weight="600">E6–E9, E19</tspan></text>

      <line x1="192" y1="192" x2="224" y2="192" stroke="#575757" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="384" y1="192" x2="416" y2="192" stroke="#575757" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="576" y1="192" x2="608" y2="192" stroke="#575757" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="768" y1="192" x2="800" y2="192" stroke="#575757" stroke-width="1" marker-end="url(#arrow)"/>

      <path d="M 960 156 L 976 156 A 8 8 0 0 0 984 148 L 984 104 A 8 8 0 0 1 992 96 L 1024 96" fill="none" stroke="#006B4F" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <path d="M 960 180 L 996 180 A 8 8 0 0 0 1004 172 L 1004 168 A 8 8 0 0 1 1012 160 L 1024 160" fill="none" stroke="#575757" stroke-width="1" marker-end="url(#arrow)"/>
      <path d="M 960 204 L 996 204 A 8 8 0 0 1 1004 212 L 1004 216 A 8 8 0 0 0 1012 224 L 1024 224" fill="none" stroke="#575757" stroke-width="1" marker-end="url(#arrow)"/>
      <path d="M 960 228 L 976 228 A 8 8 0 0 1 984 236 L 984 280 A 8 8 0 0 0 992 288 L 1024 288" fill="none" stroke="#575757" stroke-width="1" marker-end="url(#arrow)"/>

      <rect x="32" y="136" width="160" height="112" rx="6" fill="#fafafa"/>
      <rect x="32" y="136" width="160" height="112" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="44" y="156" fill="#575757" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">1 · packages/auth</text>
      <text x="44" y="180" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Hook chặn người lạ</text>
      <text x="44" y="200" fill="#575757" font-size="9" font-family="'Geist Mono', monospace">user.create.before</text>
      <text x="44" y="216" fill="#575757" font-size="9" font-family="'Geist Mono', monospace">APIError("FORBIDDEN")</text>
      <text x="44" y="232" fill="#575757" font-size="9" font-family="'Geist Mono', monospace">"This CRM is private. …"</text>

      <rect x="224" y="136" width="160" height="112" rx="6" fill="#fafafa"/>
      <rect x="224" y="136" width="160" height="112" rx="6" fill="rgba(87,87,87,0.08)" stroke="#666666" stroke-width="1"/>
      <text x="236" y="156" fill="#575757" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">2 · better-auth</text>
      <text x="236" y="180" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Bắt lỗi, giữ câu</text>
      <text x="236" y="200" fill="#575757" font-size="9" font-family="'Geist Mono', monospace">handleOAuthUserInfo</text>
      <text x="236" y="216" fill="#575757" font-size="9" font-family="'Geist Mono', monospace">{ error: e.message }</text>

      <rect x="416" y="136" width="160" height="112" rx="6" fill="#fafafa"/>
      <rect x="416" y="136" width="160" height="112" rx="6" fill="rgba(87,87,87,0.08)" stroke="#666666" stroke-width="1"/>
      <text x="428" y="156" fill="#575757" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">3 · better-auth</text>
      <text x="428" y="180" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Callback chuyển về</text>
      <text x="428" y="200" fill="#575757" font-size="9" font-family="'Geist Mono', monospace">khoảng trắng → _</text>
      <text x="428" y="216" fill="#575757" font-size="9" font-family="'Geist Mono', monospace">/sign-in?error=…</text>
      <text x="428" y="232" fill="#666666" font-size="9" font-family="'Geist', sans-serif">cả @better-auth/sso</text>

      <rect x="608" y="136" width="160" height="112" rx="6" fill="#fafafa"/>
      <rect x="608" y="136" width="160" height="112" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="620" y="156" fill="#575757" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">4 · apps/app</text>
      <text x="620" y="180" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif">/sign-in đọc error</text>
      <text x="620" y="200" fill="#575757" font-size="9" font-family="'Geist Mono', monospace">searchParams.get("error")</text>
      <text x="620" y="216" fill="#666666" font-size="9" font-family="'Geist', sans-serif">lặp thì lấy giá trị đầu</text>

      <rect x="800" y="136" width="160" height="112" rx="6" fill="#fafafa"/>
      <rect x="800" y="136" width="160" height="112" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="812" y="156" fill="#575757" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">5 · apps/app</text>
      <text x="812" y="180" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Phân loại</text>
      <text x="812" y="200" fill="#575757" font-size="9" font-family="'Geist Mono', monospace">phanLoaiLoiDangNhap</text>
      <text x="812" y="216" fill="#575757" font-size="9" font-family="'Geist Mono', monospace">(error)</text>
      <text x="812" y="232" fill="#666666" font-size="9" font-family="'Geist', sans-serif">chỉ loại đi qua, không in URL</text>

      <rect x="1024" y="72" width="192" height="48" rx="6" fill="#fafafa"/>
      <rect x="1024" y="72" width="192" height="48" rx="6" fill="rgba(0,107,79,0.08)" stroke="#006B4F" stroke-width="1.4"/>
      <text x="1036" y="90" fill="#006B4F" font-size="9" font-family="'Geist Mono', monospace">tiền tố This_CRM_is_private.</text>
      <text x="1036" y="108" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif">«Chưa được cho phép»</text>

      <rect x="1024" y="136" width="192" height="48" rx="6" fill="#fafafa"/>
      <rect x="1024" y="136" width="192" height="48" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="1036" y="154" fill="#575757" font-size="9" font-family="'Geist Mono', monospace">access_denied</text>
      <text x="1036" y="172" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif">«Dừng giữa chừng»</text>

      <rect x="1024" y="200" width="192" height="48" rx="6" fill="#fafafa"/>
      <rect x="1024" y="200" width="192" height="48" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="1036" y="218" fill="#575757" font-size="9" font-family="'Geist Mono', monospace">giá trị khác</text>
      <text x="1036" y="236" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Câu chung</text>

      <rect x="1024" y="264" width="192" height="48" rx="6" fill="#fafafa"/>
      <rect x="1024" y="264" width="192" height="48" rx="6" fill="#ffffff" stroke="#575757" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="1036" y="282" fill="#575757" font-size="9" font-family="'Geist Mono', monospace">vắng · rỗng</text>
      <text x="1036" y="300" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Không hiện ô</text>

      <text x="32" y="292" fill="#575757" font-size="12" font-style="italic" font-family="'Lora', serif">Không chạy đầu-cuối với nhà cung cấp OAuth giả (d-4).</text>

      <line x1="32" y1="340" x2="1216" y2="340" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>
      <text x="32" y="360" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>

      <rect x="32" y="372" width="24" height="16" rx="2" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="64" y="384" fill="#575757" font-size="9" font-family="'Geist', sans-serif">Mã của kho OneHub</text>

      <rect x="216" y="372" width="24" height="16" rx="2" fill="rgba(87,87,87,0.08)" stroke="#666666" stroke-width="1"/>
      <text x="248" y="384" fill="#575757" font-size="9" font-family="'Geist', sans-serif">Mã thư viện better-auth, không sửa</text>

      <rect x="448" y="372" width="24" height="16" rx="2" fill="rgba(0,107,79,0.08)" stroke="#006B4F" stroke-width="1.4"/>
      <text x="480" y="384" fill="#575757" font-size="9" font-family="'Geist', sans-serif">Ngả d-1: nhận bằng tiền tố, không so trọn chuỗi</text>

      <rect x="720" y="372" width="24" height="16" rx="2" fill="#ffffff" stroke="#575757" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="752" y="384" fill="#575757" font-size="9" font-family="'Geist', sans-serif">Không vẽ gì lên trang</text>
    </svg>
  </div>
</body>
</html>
