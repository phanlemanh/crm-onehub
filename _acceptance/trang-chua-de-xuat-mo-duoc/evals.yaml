schema_version: 1
slug: trang-chua-de-xuat-mo-duoc
evals:
  - id: E1
    criterion: AC-1
    executor: test
    layer: backend-effect
    cmd: config:executors.test.tcd_ma_tran
    paths:
      - "apps/api/src/tai-lieu/**"
      - "packages/db/src/tai-lieu-quyen.ts"
      - "apps/api/test/tai-lieu-thay-trang.spec.ts"
      - "apps/api/test/tai-lieu-san.ts"
    expected: |
      Gieo sau trang, nguoi tao 'tao', chu trang 'chu': da duyet (create + approve) · cho duyet lan dau
      (create) · may dang soan · can go tay · may chua soan duoc (ba trang qua taiLieuNguon.nhan voi
      khoNguonGia, roi dat trangThai nguon DANG_SOAN / CAN_GO_TAY / LOI nhu may soan dat, khong ban de
      xuat) · ban dau bi tra lai (create + reject). Bang MONG viet truoc 6 nguoi x 6 trang = 36 o, moi o
      mot khang dinh cho moi diem vao (list, get, nhacToi) = 108 khang dinh; so khang dinh dem duoc in ra
      va bang 108. Quan he: moi nguoi, tap slug list (loc trong 6 trang thu) == tap get HTTP 200 == tap
      nhacToi khong NOT_FOUND. CHIEU DO: ban sao (.acceptance-runs/) khoi phuc dieu kien thayTrang cu
      trong get -> 'lech list/get: tao may-soan' (o dau tien theo thu tu AI cua tai-lieu-san), ma 1.

  - id: E2
    criterion: AC-2
    executor: test
    layer: backend-effect
    cmd: config:executors.test.tcd_diem_vao
    paths:
      - "apps/api/src/tai-lieu/**"
      - "packages/db/src/tai-lieu-quyen.ts"
      - "apps/api/test/tai-lieu-thay-trang.spec.ts"
    expected: |
      Cung ma tran E1. Moi nguoi: moi dong taiLieuNguon.list -> get(trang.slug) HTTP 200; moi ket qua
      taiLieu.tim voi tu chi co trong trang da duyet -> get HTTP 200; so dong nguon cua 'tao' >= 3 (doi
      chung duong: phep do khong rong). Chieu nguoc: moi nguoi x moi trang (6 x 6 = 36 o) co
      get.choLanDau.nguon khac null -> nguon.id thuoc tap id cua taiLieuNguon.list cua chinh nguoi do; so
      o co nguon khac null in ra va > 0. O thay-trang-khong-thay-nguon (luot xanh): trang do 'tao' tai
      (LOI) them mot nguon moi hon CAN_GO_TAY do 'admin' tai (gieo db) — 'tao' thay trang (nguoi tao) nhung
      khong thay nguon: get cua tao tra dangCho go-tay va nguon null; chu, admin, owner nhan nguon.id cua
      admin (doi chung duong). CHIEU DO: (a) ban sao bo ve taoBoiId khoi dieuKienThay ->
      'dong nguon dan toi 404: tao loi', ma 1; (b) ban sao tra nguon khong loc bang dieuKienThayNguon trong
      get -> 'nguon khong thay: tao nguon-admin', ma 1.

  - id: E3
    criterion: AC-3
    executor: test
    layer: backend-effect
    cmd: config:executors.test.tcd_khong_thay
    paths:
      - "apps/api/src/tai-lieu/**"
      - "apps/api/test/tai-lieu-thay-trang.spec.ts"
    expected: |
      'khac' goi get va nhacToi cho trang may dang soan va cho slug khong co: {status, loi} bang nhau tung
      cap, status 404, loi = TAI_LIEU_API.thongDiep.khongCo; doi chung duong: 'chu' goi cung trang -> 200.
      list cua 'khac' khong co slug do. CHIEU DO: ban sao de get tra FORBIDDEN cho trang co ma khong duoc thay ->
      'khong thay khac khong ton tai: taiLieu.get', ma 1.

  - id: E4
    criterion: AC-4
    executor: test
    layer: backend-effect
    cmd: config:executors.test.tcd_dang_cho
    paths:
      - "apps/api/src/tai-lieu/**"
      - "apps/api/test/tai-lieu-thay-trang.spec.ts"
    expected: |
      Ma tran viet truoc: (1) trang don — con ban CHO_DUYET -> duyet; moi gia tri cua TRANG_THAI_NGUON
      (nhap hang tu @crm/validation/tai-lieu-nguon, khong chep tay) mot trang: CHO_DOC, CHO_SOAN, DANG_SOAN
      -> may-soan · CAN_GO_TAY -> go-tay · LOI co lyDo -> loi va nguon.lyDo bang lyDo · DA_SOAN khong de
      xuat -> chua-co-ban; ban dau TRA_LAI khong nguon -> tra-lai; khong nguon khong de xuat -> chua-co-ban
      (gieo thang bang db vi khong duong ghi nao tao ra no). (2) trang ghep: CHO_DUYET + nguon DANG_SOAN ->
      duyet · TRA_LAI + nguon moi hon DANG_SOAN -> may-soan · TRA_LAI + nguon LOI -> loi · TRA_LAI + nguon
      DA_SOAN -> tra-lai · hai nguon (cu LOI, moi CAN_GO_TAY) -> go-tay va nguon.id la nguon moi theo taiLuc.
      (3) trang da duyet -> choLanDau null. Mot khang dinh moi o; so khang dinh in ra bang so o cua bang.
      CHIEU DO: ban sao dao thu tu uu tien (tra-lai truoc nguon) -> 'dangCho sai: tra-lai-roi-soan-lai',
      ma 1 (o ghep TRA_LAI + DANG_SOAN).

  - id: E5
    criterion: AC-5
    executor: test
    layer: ui
    cmd: config:executors.test.tcd_man_doc
    paths:
      - "apps/app/app/(app)/[slug]/tai-lieu/[trang]/man-doc.tsx"
      - "apps/app/lib/messages/tai-lieu.ts"
      - "apps/app/test/tai-lieu-trang-cho.dom.tsx"
    expected: |
      Render ManDoc voi 6 gia tri dangCho (vi va en): tieu de va loi doc tu taiLieuMessages (khong chep
      chu tay trong test), co ten chu trang va ten tep; nut theo bang: may-soan {Xem nguon}, go-tay {Viet
      tay, Xem nguon}, loi {Viet tay, Xem nguon} + ly do (va o loi co lyDo null: chi ten tep, khong dau ':' treo), tra-lai {Viet tay}, chua-co-ban {Viet tay}, duyet
      {} va loi 'Dang cho ... duyet'; href Xem nguon = duongTabNguon() + '#' + neoNguon(id), href Viet tay
      = duongSuaTrang(slug); phan tu chua ten chu trang / ten tep co translate="no". CHIEU DO: ban sao an
      nut Viet tay o go-tay -> 'go-tay: thieu nut Viết tay', ma 1.

  - id: E6
    criterion: AC-6
    executor: test
    layer: backend-effect
    cmd: config:executors.test.tcd_viet_tay
    paths:
      - "apps/api/src/tai-lieu/**"
      - "apps/api/test/tai-lieu-thay-trang.spec.ts"
    expected: |
      Trang can go tay (khong ban de xuat) va trang ban dau bi tra lai: 'chu' va 'tao' goi taiLieu.propose
      -> 200, hang TaiLieuDeXuat co banGocId null va trangThai CHO_DUYET; get sau do -> dangCho duyet.
      'khac' goi propose cung trang -> NOT_FOUND (doi chung am co ghim). CHIEU DO: ban sao them dieu kien
      banDangDungId not null vao propose -> 'viet tay bi chan: chu <slug trang can go tay>', ma 1.

  - id: E6u
    criterion: AC-6
    executor: ui-check
    layer: ui-observed
    cmd: config:executors.script.tcd_man_trang_cho
    steps:
      - "Canh cay; phien do rieng (tien-de.mjs); gieo trang can go tay bang db cua phien do (taiLieuTrang + taiLieuNguon CAN_GO_TAY, taoBoi owner, chu trang mot member; phien do khong co Blob nen khong goi duoc nhan — duong ghi that do o E1); dang nhap dev:session owner"
      - "Buoc 3 (1440): mo man doc trang can go tay, bam 'Viết tay' -> URL ket thuc /sua, trinh soan co mat, chu trong trinh soan rong (innerText) -> anh tcd-viet-tay-1440.png"
      - "Buoc 4 (1440): go chuoi moc vao trinh soan, bam 'Gửi duyệt' -> URL ve man doc (khong tai lai tay), khung [data-cho-lan-dau] co chu dang cho duyet lay tu taiLieuMessages (innerText); CSDL phien do co dung mot TaiLieuDeXuat banGocId null, noi dung chua chuoi moc -> anh tcd-gui-ban-dau-1440.png"
    paths:
      - "apps/app/app/(app)/[slug]/tai-lieu/**"
      - "_acceptance/trang-chua-de-xuat-mo-duoc/rang/man-trang-cho.mjs"
    expected: "exit 0; man-trang-cho.mjs in 'buoc 3: dat', 'buoc 4: dat'. CHIEU DO: --chieu-do=3 tren ban sao tra lai redirect cua /sua khi noiDung null -> 'buoc 3: khong mo trinh soan', ma 1; --chieu-do=4 tren ban sao khoa nut Gui duyet (khoaGui = true) -> 'buoc 4: khong gui duoc', ma 1."

  - id: E7
    criterion: AC-7
    executor: test
    layer: backend-effect
    cmd: config:executors.test.tcd_ma_tran
    paths:
      - "apps/api/src/tai-lieu/**"
      - "packages/db/src/tai-lieu-quyen.ts"
      - "apps/api/test/tai-lieu-thay-trang.spec.ts"
    expected: "Cung lan chay E1: o (owner, may dang soan) va (owner, can go tay) — list co slug VA get HTTP 200 VA choLanDau.dangCho la may-soan / go-tay: hieu ung may chu ma buoc bam dong cua E7u dua vao, tu nonce la slug gieo trong chinh lan chay. CHIEU DO: nhu E1 -> 'lech list/get: tao may-soan', ma 1."

  - id: E7u
    criterion: AC-7
    executor: ui-check
    layer: ui-observed
    cmd: config:executors.script.tcd_man_trang_cho
    steps:
      - "Canh cay; phien do rieng; gieo bang db cua phien do bon trang chua co ban (nguon DANG_SOAN, CAN_GO_TAY, LOI co lyDo; mot trang ban dau TRA_LAI); dang nhap dev:session owner"
      - "Buoc 1 (1440): mo /<ws>/tai-lieu, bam dong trang may dang soan -> URL la /<ws>/tai-lieu/<slug>, HTTP khong 404, khung [data-cho-lan-dau] co chu 'Máy đang soạn' (innerText) -> anh tcd-may-soan-1440.png"
      - "Buoc 2 (390 va 1440): lap qua bon trang (may-soan, go-tay, loi, tra-lai), ten tep va ly do dai khong dau cach (vd Chinh_sach_nhan_vien_2026_ban_cuoi_cung_da_ky_va_dong_dau.pdf) -> moi trang o 390 scrollWidth <= clientWidth, in 'buoc 2: dat <trang>' cho ca bon; anh tcd-<trang>-1440.png va tcd-<trang>-390.png"
    paths:
      - "apps/app/app/(app)/[slug]/tai-lieu/**"
      - "packages/db/src/tai-lieu-quyen.ts"
      - "apps/api/src/tai-lieu/**"
      - "_acceptance/trang-chua-de-xuat-mo-duoc/rang/man-trang-cho.mjs"
    expected: "exit 0; man-trang-cho.mjs in 'buoc 1: dat' va bon dong 'buoc 2: dat <trang>'; anh o .acceptance-runs/trang-chua-de-xuat-mo-duoc/evidence/, vong S4 chep sang _acceptance/trang-chua-de-xuat-mo-duoc/evidence/ cho E9j. CHIEU DO: --chieu-do=1 tren ban sao khoi phuc thayTrang cu trong get -> 'buoc 1: man doc 404', ma 1; --chieu-do=2 tren ban sao doi wrap-anywhere thanh whitespace-nowrap o dong nguon -> 'buoc 2: ... cuon ngang loi-390' (ca ba trang co dong nguon cung cuon), ma 1."

  - id: E8
    criterion: AC-8
    executor: test
    layer: ui
    cmd: config:executors.test.tcd_san_thiet_ke
    paths:
      - "apps/app/app/(app)/[slug]/tai-lieu/[trang]/**"
    expected: "design-gate --mode static tren man-doc.tsx va sua/page.tsx: exit 0, khong P0. CHIEU DO: ban sao them className='text-gray-500 bg-red-500' (chu xam tren nen mau) vao khung trang thai -> design-gate verdict REJECT, p0_count 1, lenh tcd_san_thiet_ke exit 1. (Mot mau don 'bg-red-500' KHONG bi bat — bo quet canh mau giao dien kieu AI, khong canh mau le.)"

  - id: E9j
    criterion: AC-9
    executor: judgment
    question: "Mot nhan vien van phong nhin anh man doc trang chua co ban o bon trang thai (may dang soan, can go tay, may chua soan duoc, ban dau bi tra lai) o kho 390 va 1440: co hieu ngay trang dang cho gi va minh bam gi tiep khong, nhan co theo tu dien CONTEXT.md (Nguồn, Máy soạn, Cần gõ tay, Chủ trang, Bản đề xuất), co cho nao cuon ngang hay chu de len nhau khong?"
    evidence_required: [judged_by, verdict, rationale]
    inputs:
      - "CONTEXT.md"
      - "_acceptance/trang-chua-de-xuat-mo-duoc/evidence/tcd-may-soan-1440.png"
      - "_acceptance/trang-chua-de-xuat-mo-duoc/evidence/tcd-may-soan-390.png"
      - "_acceptance/trang-chua-de-xuat-mo-duoc/evidence/tcd-go-tay-1440.png"
      - "_acceptance/trang-chua-de-xuat-mo-duoc/evidence/tcd-go-tay-390.png"
      - "_acceptance/trang-chua-de-xuat-mo-duoc/evidence/tcd-loi-1440.png"
      - "_acceptance/trang-chua-de-xuat-mo-duoc/evidence/tcd-loi-390.png"
      - "_acceptance/trang-chua-de-xuat-mo-duoc/evidence/tcd-tra-lai-1440.png"
      - "_acceptance/trang-chua-de-xuat-mo-duoc/evidence/tcd-tra-lai-390.png"
    paths:
      - "CONTEXT.md"
      - "_acceptance/trang-chua-de-xuat-mo-duoc/evidence/tcd-may-soan-1440.png"
      - "_acceptance/trang-chua-de-xuat-mo-duoc/evidence/tcd-may-soan-390.png"
      - "_acceptance/trang-chua-de-xuat-mo-duoc/evidence/tcd-go-tay-1440.png"
      - "_acceptance/trang-chua-de-xuat-mo-duoc/evidence/tcd-go-tay-390.png"
      - "_acceptance/trang-chua-de-xuat-mo-duoc/evidence/tcd-loi-1440.png"
      - "_acceptance/trang-chua-de-xuat-mo-duoc/evidence/tcd-loi-390.png"
      - "_acceptance/trang-chua-de-xuat-mo-duoc/evidence/tcd-tra-lai-1440.png"
