schema_version: 1
feature_slug: thuoc-khai-dung-tieng
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.tk_ghim_phan_biet
    expected: >-
      exit 0. Voi MOI chuoi ghim khai trong pha-thu.mjs: chay chan do tuong ung
      tren vat LANH (khong pha gi), bat dau ra, va khang dinh chuoi ghim VANG.
      In bang: ten dot bien | chuoi ghim | vang o luot lanh co/khong.
      Chuoi nao CO mat o luot lanh la chuoi KHONG phan biet duoc — chan nay DO va
      goi ten dung chuoi do.
      So khang dinh = so chuoi ghim khai trong pha-thu.mjs, doc TU pha-thu.mjs,
      khong go lai mot danh sach thu hai. Danh sach go lai la mot ban khai thu hai
      se troi khoi ban that.
      Vi sao chan nay ton tai: 7/11 chuoi ghim hien tai la TEN CHAN, ma ten chan
      in ra o moi luot chay (dong "-- DAN SO:" va "ket qua: chan="), nen chot
      "thong diep co ghim" luon tra CO ke ca luot xanh.
      Cap hai chieu: ban sao doi mot chuoi ghim ve ten chan -> chan nay DO, thong
      diep ghim chua dung chuoi do va chu "co mat o luot lanh".
    paths:
      - "_acceptance/ho-so-khai-dung-tieng/rang/pha-thu.mjs"
      - "_acceptance/thuoc-khai-dung-tieng/rang/ghim-phan-biet.mjs"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.tk_khai_sinh_dung_ghim
    expected: >-
      exit 0. Doc pha-thu.mjs va khang dinh no DUNG ket qua cua E1, khong chi
      tinh roi vut: moi dot bien phai tinh dat theo BA dieu (ma thoat khac 0 ·
      thong diep chua chuoi ghim · chuoi ghim da chung la vang o luot lanh), va
      thieu dieu thu ba thi dot bien tinh KHONG DAT.
      Khang dinh bang cach CHAY pha-thu tren mot ban sao co mot chuoi ghim co y
      dat thanh ten chan: pha-thu phai bao dot bien do KHONG DAT, khong duoc bao
      dat.
      Day la chan chong "dem-roi-vut": mot ban cai dat tinh dung roi bo qua ket
      qua van qua duoc E1.
      Cap hai chieu: ban sao bo dieu kien thu ba khoi pha-thu -> chan nay DO,
      thong diep ghim chua "dem roi vut".
    paths:
      - "_acceptance/ho-so-khai-dung-tieng/rang/pha-thu.mjs"
      - "_acceptance/thuoc-khai-dung-tieng/rang/khai-sinh-dung-ghim.mjs"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: script
    cmd: config:executors.script.tk_cong_chan_duoc
    expected: >-
      exit 0. Do HIEU LUC, khong do ban khai. Trong mot ban sao git worktree
      rieng: them MOT cho khai tieng thu muoi vao apps/app, roi chay `bun run
      test` trong ban sao va khang dinh no DO, va dau ra GOI TEN dung tep vua
      them.
      Roi tra ban sao ve nguyen trang va chay lai: phai XANH. Hai chieu tren cung
      mot ban sao.
      Khang dinh "mot-duong.mjs co khai trong gate-shape.json" la do BAN KHAI,
      khong do hieu luc — chan nay khong duoc dung mot minh khang dinh do.
      Cay dang xet KHONG duoc cham mot byte nao; chan nay chung dieu do bang cach
      so `git status --porcelain` truoc va sau.
      Cap hai chieu: ban sao go mot-duong.mjs khoi khoi khai -> `bun run test`
      XANH du da them cho thu muoi -> chan nay DO, thong diep ghim "cong khong
      chan duoc".
    paths:
      - ".githooks/gate-shape.json"
      - "packages/ui/test/rang-chat.spec.ts"
      - "_acceptance/ho-so-khai-dung-tieng/rang/mot-duong.mjs"
      - "_acceptance/thuoc-khai-dung-tieng/rang/cong-chan-duoc.mjs"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: script
    cmd: config:executors.script.tk_hai_ho_so
    expected: >-
      exit 0. Co che khai thuoc nay do HAI ho so. Khang dinh:
      (a) ba thuoc cua nen-chat-ai-elements (mo-coi · chu-cung · mau-ban-kinh)
          VAN duoc bo chay goi va VAN xanh — goi ten tung cai;
      (b) moi tep .mjs trong rang/ cua CA HAI ho so deu co dinh doat (trong cong,
          hoac ngoai cong kem ly do doc duoc). HANG GHIM trong tep thuoc, chep tay
          tu cay: nen-chat-ai-elements co N1 tep .mjs, ho-so-khai-dung-tieng co N2.
          Chan khang dinh so tep QUET DUOC bang dung N1 va N2 TRUOC khi so voi ban
          khai — so hai con so cung suy tu mot luot quet la 0 bang 0 khi glob neo
          sai goc. Chan in ra danh sach tung tep da quet;
      (c) bo chay doc ban khai chu khong go cung danh sach: doi mot id trong ban
          khai thi bo chay phai doi theo.
      Ho so nen-chat-ai-elements da signed-off; lam vo ba thuoc cua no la lam vo
      mot loi hua da ky.
      Cap hai chieu, HAI vi tri de chung pham vi quet:
      (i) ban sao bo khai mot tep .mjs khoi ban khai -> chan DO va GOI TEN tep do;
      (ii) ban sao them mot tep .mjs MOI vao rang/ cua ho so thu hai -> chan DO va
      GOI TEN tep do, chung rang chan that su quet CA HAI thu muc chu khong chi mot.
    paths:
      - ".githooks/gate-shape.json"
      - "packages/ui/test/rang-chat.spec.ts"
      - "_acceptance/nen-chat-ai-elements/rang/**"
      - "_acceptance/ho-so-khai-dung-tieng/rang/**"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-5
    executor: script
    cmd: config:executors.script.tk_khong_de_lai_vet
    expected: >-
      exit 0. Chup trang thai TRUOC cua moi ban ghi that ma bo do co the muon
      (thoa thuan bi datDuGiaiDoan muon, cong ty/ca nhan bi dat muon neu con),
      ep MOT NGOAI LE THAT o giua luot chay, roi chup lai va DOI CHIEU.
      Khang dinh: 0 ban ghi that con lech sau luot chay. Chan GOI TEN tung ban
      ghi da kiem kem gia tri truoc/sau, khong tra mot con so.
      Ngoai le phai ep o giua — sau khi da muon, truoc khi tra — khong phai o dau
      hay o cuoi; ep sai cho thi chan nay xanh ma khong chung duoc gi.
      Cap hai chieu: ban sao VO HIEU HOA phep tra lai (than ham `tra()` tra ve ngay)
      -> chan DO, thong diep ghim "ban-ghi-that-con-lech:" kem id ban ghi.
      Vi sao khai NHU VAY chu khong phai "go try/finally": duong don dep co HAI loi
      vao — khoi `finally` VA hai bay uncaughtException/unhandledRejection — va ca
      hai cung goi `tra()`. Go rieng try/finally thi bay van don, chan van xanh; da
      do tay 19/09 (ma thoat 3 = bay chay, 0 ban ghi lech). Khai "go try/finally" la
      mo ta mot co che KHAC voi co che that su giu loi hua, dung lop benh ma AC-7
      cua chinh vong nay bat. Diem nem cung da doi: no nam TRONG than vong lap, tuc
      sau khi da muon thoa thuan that, chu khong con nam ngoai khoi try.
      Tu 19/09 (S4 vong 3): phep phu giai doan TAO thoa thuan moi thay vi MUON
      thoa thuan co san. Nen vet de lai khong con la ban ghi LECH ma la ban ghi
      THUA, va chan do bat bang nhanh MOI SINH cong voi phep dem vat mang MOC
      cua chinh luot nay. Doi cach vi MUON hong hai lop cung luc: hai luot chay
      song song gianh cung mot ban ghi, va mot lan chet giua chung de lai vet
      tren du lieu that. Anh chup cung BO tep mang tien to vat-thu, neu khong
      mot chan do khac dang chay se hien ra thanh "MOI SINH" — mot bao do gia.
    paths:
      - "_acceptance/ho-so-khai-dung-tieng/rang/du-lieu-thu.mjs"
      - "_acceptance/ho-so-khai-dung-tieng/rang/hoi-quy-nam-cho.mjs"
      - "_acceptance/thuoc-khai-dung-tieng/rang/khong-de-lai-vet.mjs"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-6
    executor: script
    cmd: config:executors.script.tk_xoa_co_kiem
    expected: >-
      exit 0. Ba duong, ba khang dinh:
      (a) CAY_SAO tro toi mot worktree do chinh script tao -> xoa duoc, exit 0;
      (b) CAY_SAO tro toi GOC KHO -> tu choi, thoat co ten, va thu muc VAN CON;
      (c) CAY_SAO tro toi mot thu muc thuong (khong phai worktree) -> tu choi,
          thoat co ten, va thu muc VAN CON.
      Hai duong (b)(c) phai khang dinh THU MUC VAN CON sau khi goi — chi khang
      dinh ma thoat la chua du, vi mot ban cai dat xoa xong roi moi bao loi cung
      cho cung ma thoat.
      Chan tu dung thu muc thu cua chinh no, khong muon thu muc that nao.
      Cap hai chieu: ban sao bo phep kiem khoi dungCaySao -> duong (b) hoac (c)
      xoa that -> chan DO, thong diep ghim duong nao da xoa nham.
    paths:
      - "_acceptance/ho-so-khai-dung-tieng/rang/pha-thu.mjs"
      - "_acceptance/thuoc-khai-dung-tieng/rang/xoa-co-kiem.mjs"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-7
    executor: script
    cmd: config:executors.script.tk_ban_khai_khop
    expected: >-
      exit 0. Doi chieu ban khai voi ban that, hai chieu:
      (a) moi doan `expected` cua evals.yaml ho-so-khai-dung-tieng mo ta mot API
          hay mot hinh dang dau vao -> hinh dang do phai CON TON TAI trong ma;
      (b) moi KHOA ma eval hoi dong bao cham -> phai co chan do GHI RA khoa do.
          Chan doc danh sach khoa tu `expected` cua eval judgment va doi chieu voi
          cac khoa chan do that su ghi vao vung-khai.json.
      Chan GOI TEN tung khoa va tung hinh dang da doi chieu, khong tra con so.
      So khang dinh = so khoa hoi dong bao cham + so hinh dang duoc mo ta.
      Cap hai chieu: ban sao them mot khoa vao `expected` cua eval judgment ma
      khong chan do nao ghi -> chan DO va GOI TEN khoa do.
    paths:
      - "_acceptance/ho-so-khai-dung-tieng/evals.yaml"
      - "_acceptance/ho-so-khai-dung-tieng/rang/khai-tieng-ho-so.mjs"
      - "_acceptance/thuoc-khai-dung-tieng/rang/ban-khai-khop.mjs"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E8
    criterion: AC-8
    executor: script
    cmd: config:executors.script.tk_bai_kiem_dung_nha_quet
    expected: >-
      exit 0. Hai khang dinh:
      (a) 0 tep trong packages/ nhap ma cua apps/ bang duong dan tuong doi. HANG
          GHIM trong tep thuoc: so tep nguon phai quet duoi packages/ (chep tay tu
          cay). Chan khang dinh so tep quet duoc BANG hang do truoc khi dem vi pham
          — glob neo sai goc thi tap quet rong va 0 vi pham la 0 bang 0. Goi ten
          tung vi pham theo file:dong;
      (b) bai kiem cua MetaLine nam trong pham vi mot tsconfig THAT SU soi no:
          chan doi chieu duong dan bai kiem voi `include` cua tsconfig gan nhat,
          va khang dinh no nam trong.
      Chieu do CUA SAN PHAM (khong phai cua chan nay) do o E9 cua bo kiem kieu:
      doi kieu MetaPart -> `bun run check-types` phai DO.
      Cap hai chieu, HAI vi tri: (i) them mot dong nhap nguoc chieu vao
      packages/ui/src -> chan DO goi ten file:dong; (ii) them mot dong nhap nguoc
      chieu vao packages/ui/test -> chan DO goi ten file:dong. Hai vi tri de chung
      pham vi quet phu ca src lan test, khong chi mot nhanh.
    paths:
      - "packages/ui/test/**"
      - "apps/app/test/**"
      - "packages/ui/tsconfig.json"
      - "apps/app/tsconfig.json"
      - "_acceptance/thuoc-khai-dung-tieng/rang/bai-kiem-dung-nha.mjs"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E9
