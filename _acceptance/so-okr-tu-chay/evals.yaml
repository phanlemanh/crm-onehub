schema_version: 1
feature_slug: so-okr-tu-chay
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.sot_danh_muc
    paths: [packages/validation/src/okr-chi-so.ts, packages/db/src/okr-chi-so-danh-muc.ts, packages/validation/src/okr-nguon.ts, packages/validation/test/okr-chi-so.spec.ts]
    expected: "exit 0; BẢNG VIẾT TRƯỚC 7 dòng × 5 trường (mã, đơn vị, ngày quyết định kỳ, quy công, loại bản ghi) và tập phạm vi từng mã so toEqual với CHI_SO_OKR — không đếm số khoá mà so cả bảng; MA_CHI_SO bằng đúng 7 mã theo thứ tự khai. Ma trận từ chối viết trước 7 ca, mỗi ca ghim thông điệp: mã lạ «Chỉ số không có trong danh mục», phạm vi kieu lạ, phạm vi bo-phan thiếu id, ghi-danh-dat-bac thiếu bac, bac lạ, trường thừa `bieuThuc`, trường thừa `cot` (khuôn strict). Đối chứng dương: 7 đầu vào hợp lệ (một mỗi mã, ghi danh có bac) parse ra đúng đối tượng. CHIỀU ĐỎ: bản sao khuôn bỏ .strict() → ca `bieuThuc` đỏ, bài in đầu vào lọt."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-1
    executor: test
    cmd: config:executors.test.sot_chu
    paths: [apps/app/lib/messages/okr-so.ts, apps/app/test/messages-guard.spec.ts, apps/app/test/okr-so-chu.spec.ts]
    expected: "exit 0; okr-so-chu.spec rút danh sách mã từ MA_CHI_SO (không chép tay) và khẳng định mỗi mã có nhãn và định nghĩa ở vi và en, vi khác en, vi có dấu; messages-guard xanh với tệp chữ mới. CHIỀU ĐỎ: bản sao tệp chữ thiếu nhãn en của email-gui-ra → bài đỏ in mã thiếu."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-2
    executor: test
    layer: backend-effect
    cmd: config:executors.test.sot_dem
    paths: [packages/db/src/okr-chi-so.ts, packages/db/src/okr-chi-so-danh-muc.ts, packages/db/src/okr-so-config.ts, apps/api/test/okr-chi-so.spec.ts, apps/api/test/okr-so-san.ts]
    expected: "exit 0; sàn okr-so-san gieo bộ phận B1 (P1, P2), B2 (P3), năm người (a,b ở P1; c ở P2; d ở P3; e không phòng ban), kỳ 2026-04-01 → 2026-06-30 (một quý đã qua, để bản ghi mang giờ hiện tại do bài khác để lại không rơi vào kỳ). Cho mỗi chỉ số gieo: 2–3 bản ghi đủ điều kiện rải trên người, 1 bản ghi ngày 2026-03-31 23:59 VN (ngoài), 1 bản ghi 2026-04-01 00:00 VN (trong), 1 đã lưu trữ, 1 không đủ điều kiện (CLOSED_LOST; bước xong sau dueAt; cuộc gọi ANSWERED; form chưa xếp; thư từ địa chỉ ngoài). MA TRẬN VIẾT TRƯỚC 7 chỉ số × 4 phạm vi (toan-cong-ty, bo-phan:B1, phong-ban:P1, nguoi:a) + ghi-danh 4 bậc × toan-cong-ty = 32 ô, mỗi ô so toBe với demChiSo và với số dòng banGhiChiSo cùng lời gọi (đếm và liệt kê cùng một where — so cả hai, không suy cái này từ cái kia); tập id danh sách so bằng tập viết trước ở 7 ô toan-cong-ty. Ca biên: form của cá nhân không phụ trách có ở toan-cong-ty, vắng ở mọi phạm vi khác; bo-phan:B1 bằng tổng P1 + P2 cho mọi chỉ số người-quy-công. CHIỀU ĐỎ: bản sao dieuKienChiSo bỏ lọc archivedAt → ô thoa-thuan-moi × toan-cong-ty đỏ, bài in tên ô, số mong và số nhận; bản sao lấy ranh giới ngày theo UTC → ô bản ghi 00:00 VN đỏ."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-3
    executor: test
    layer: backend-effect
    cmd: config:executors.test.sot_dat_nguon
    paths: [apps/api/src/okr/**, packages/validation/src/okr-nguon.ts, packages/validation/src/okr-vet.ts, apps/api/test/okr-nguon.spec.ts, apps/api/test/okr-so-san.ts]
    expected: "exit 0; trên mục tiêu nháp: bốn lời gọi datNguonKr (crm thoa-thuan-chot-duoc phong-ban:P1; api; bang-tinh url+ô với biến Sheets cắm; tay) — sau MỖI lời gọi đọc DB: okrKeyResult.source và dòng okrNguonKr (loai, chiSo, phamVi, bac, sheetId, sheetO) bằng bảng viết trước; sau lời gọi tay không còn dòng okrNguonKr và số dòng okrSoChup gieo sẵn cho KR không đổi; đúng 4 dòng vết doi-nguon với before/after viết trước. Ma trận từ chối viết trước 9 ca, mỗi ca ghim thông điệp và khẳng định okrNguonKr + source + số dòng vết không đổi: đơn vị không tồn tại; phòng ban đã lưu trữ; người không phải thành viên; url ngoài docs.google.com/spreadsheets; ô 'B' (sai khuôn); Sheets khi hai biến vắng; pha cham-diem; pha da-dong; người gọi không sửa được KR. Đối chứng dương: cùng người gọi, cùng đầu vào, ở pha dang-chay và người sửa được → ghi được. Luật kiểu: datNguonKr crm cho KR mốc (nháp), KR phần trăm (nháp) và KR mốc đã công bố (đo cạnh) → 400 câu ghim «Chỉ số CRM là số đếm — KR mốc hay phần trăm không lấy số từ đây.», source, okrNguonKr và vết không đổi; updateKeyResult đổi kiểu một KR đang lấy nguồn crm sang mốc hay phần trăm → cùng câu ghim, KR không đổi; đối chứng: KR tăng tới lấy crm được, KR mốc lấy api được, KR crm đổi đích vẫn được. CHIỀU ĐỎ: bản sao service bỏ kiểm tra đơn vị lưu trữ → ca phòng ban lưu trữ đỏ, bài in tên ca."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-3
    executor: test
    layer: backend-effect
    cmd: config:executors.test.sot_khoa_cong_bo
    paths: [apps/api/src/okr/**, apps/api/test/okr-nguon.spec.ts]
    expected: "exit 0; mục tiêu đã công bố ở pha dang-chay có KR tay T và KR crm C: datNguonKr(T, crm) → ghi được, đọc DB source(T) vẫn 'tay', có okrNguonKr(T), một vết doi-nguon ghi «đo cạnh»; datNguonKr(C, api) và datNguonKr(C, tay) → từ chối câu ghim «Nguồn đã khoá khi công bố», okrNguonKr(C) và source(C) không đổi; updateKeyResult(C, currentValue) bị từ chối câu ghim ở pha lap-ke-hoach (mục tiêu nháp nguồn crm) và ở pha dang-chay (ở cham-diem và da-dong mọi ghi đã khoá theo lượt 3 — một ca kiểm lại câu khoá pha); updateKeyResult(T, currentValue) ở mục tiêu nháp vẫn ghi được (đối chứng); removeKeyResult trên KR có một dòng okrSoChup → từ chối câu ghim, KR còn. KR tay T có bản chụp crm; đổi đo cạnh sang api → okr.objective trả soMay null, nguonMay.loai api; sau lần ghiSoKr đầu → soMay là số api. CHIỀU ĐỎ: bản sao datNguonKr không kiểm publishedAt → ca C→api đỏ, bài in source mới."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-4
    executor: test
    layer: backend-effect
    cmd: config:executors.test.sot_chup
    paths: [apps/agent/agent/lib/okr-chup.ts, apps/agent/agent/schedules/dispatch.ts, packages/db/src/okr-chi-so.ts, packages/db/src/okr-so-config.ts, apps/agent/test/okr-chup.integration.spec.ts]
    expected: "exit 0; now đóng băng 2026-10-20 00:05 VN; gieo sáu KR của mục tiêu đã công bố (trừ K4): K1 crm đủ điều kiện, K2 đo cạnh (source tay, okrNguonKr crm), K3 bang-tinh (đọc ô giả trả 1240), K4 mục tiêu da-bo, K5 chu kỳ pha da-dong, K6 chu kỳ bắt đầu 2026-10-25. Lượt 1 chupSoOkr: bảng okrSoChup có đúng 3 dòng {K1, K2, K3} với ngay = 2026-10-19; giá trị K1 và K2 bằng demChiSo(khoảng 2026-10-01 → hết 2026-10-19) tính độc lập trong bài, K3 = 1240; currentValue(K1) = giá trị đó, currentValue(K3) = 1240, currentValue(K2) bằng số tay gieo; K4, K5, K6 không dòng. KR crm và KR bang-tinh của mục tiêu nháp cùng chu kỳ → không dòng, bộ đọc ô không được gọi, currentValue đứng yên. Lượt 2 và 3 cùng now → tổng dòng vẫn 3. Chuỗi nhịp dispatch thật (schedules/dispatch) gọi chupSoOkr — bài đọc thứ tự lượt trong mô-đun, không chỉ gọi hàm trực tiếp. CHIỀU ĐỎ: bản sao bỏ skipDuplicates và bộ lọc «chưa có dòng» → lượt 2 đỏ in 6 dòng; bản sao cập nhật currentValue cho mọi KR có nguồn → K2 đỏ in giá trị máy."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-4
    executor: test
    cmd: config:executors.test.sot_chup_hieu_nang
    paths: [apps/agent/agent/lib/okr-chup.ts, packages/db/src/okr-chi-so.ts, apps/agent/test/okr-chup-hieu-nang.integration.spec.ts]
    expected: "exit 0; (a) gieo 200 KR crm chia đều 7 chỉ số và 4 phạm vi cùng 2.000 bản ghi nguồn; một lượt chupSoOkr ghi 200 dòng và chạy dưới 20 000 ms — con số viết ở đây, không đọc từ OKR_SO (in số ms); đếm câu truy vấn (PRISMA_LOG_QUERIES) ở bộ 20 KR và bộ 200 KR: số câu mỗi KR bằng nhau (in hai số). (b) bộ trộn 50 KR crm + 20 KR bang-tinh với Google giả treo (không trả lời): một lượt xong dưới 60 000 ms, số lần gọi fetch giả ≤ OKR_SO.sheets.toiDaMoiNhip × số lần thử, 50 KR crm có dòng, KR bang-tinh chưa đọc được không có dòng và được đọc ở lượt kế (Google giả trả lời) — in số lần gọi mỗi lượt. CHIỀU ĐỎ: bản sao nạp phòng ban chính từng người trong vòng lặp bản ghi → số câu mỗi KR ở bộ 200 lớn hơn bộ 20, bài in hai số; bản sao bỏ cả trần số lần đọc mỗi nhịp lẫn hạn thời gian của nhịp (OKR_SO.chup) → (b) vượt 60 000 ms, bài in thời gian; bỏ riêng một trong hai thì trần kia vẫn giữ nhịp dưới 60 000 ms."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E8
    criterion: AC-4
    executor: script
    cmd: config:executors.script.sot_soi_chi_them
    paths: [apps/**, packages/**, _acceptance/so-okr-tu-chay/rang/soi-ma.mjs]
    expected: "exit 0; script suy gốc kho từ vị trí của nó, soi AST (typescript) mọi .ts/.tsx dưới apps/ và packages/ trừ test/: không lời gọi nào có dạng <x>.okrSoChup.update|updateMany|upsert|delete|deleteMany; không chuỗi SQL thô ($executeRaw, $queryRaw, $executeRawUnsafe) nào chứa okrSoChup cùng UPDATE hoặc DELETE; lời gọi okrSoChup.create* chỉ ở apps/agent/agent/lib/okr-chup.ts, hàm chụp dùng chung chupKrCrm trong packages/db/src/okr-chi-so.ts và dịch vụ ghiSoKr (in danh sách tệp và số lời gọi tìm thấy — phải > 0). CHIỀU ĐỎ: --chieu-do chép okr-chup.ts vào tmpdir, chèn một okrSoChup.updateMany → script đỏ in «okrSoChup bị sửa: <tệp>:<dòng>»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E9
    criterion: AC-5
    executor: test
    layer: backend-effect
    cmd: config:executors.test.sot_khong_doi
    paths: [apps/agent/agent/lib/okr-chup.ts, packages/db/src/okr-chi-so.ts, apps/api/src/okr/**, apps/agent/test/okr-chup.integration.spec.ts, apps/api/test/okr-nguon.spec.ts]
    expected: "exit 0; KR crm thoa-thuan-chot-duoc phong-ban:P1 có bản chụp ngày D = 3 (ghi bằng chupSoOkr thật, không chèn tay); chu kỳ của KR thứ hai đã qua endsOn. Sau đó theo thứ tự: lưu trữ một thoả thuận đã đếm; mở lại một thoả thuận chốt được (stage về QUALIFIED_TO_BUY, closedAt null); chuyển người a sang P3; đổi đồng tiền báo cáo và gọi rerateAll; chạy chupSoOkr ở D+1 và D+2. Khẳng định: dòng okrSoChup ngày D vẫn 3 (đọc DB) và okr.lichSuSo trả 3 cho D; currentValue KR chu kỳ đã qua không đổi sau hai nhịp; okr.banGhiChiSo(D) trả soDaChup 3, soTinhLai 0 (bằng số tính độc lập), lech true. Đối chứng dương: một KR không đổi dữ liệu → lech false, soDaChup = soTinhLai. CHIỀU ĐỎ: bản sao lichSuSo tính lại bằng demChiSo thay vì đọc bảng → D đỏ in 0."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E10
    criterion: AC-6
    executor: test
    layer: backend-effect
    cmd: config:executors.test.sot_ban_ghi
    paths: [apps/api/src/okr/**, packages/db/src/okr-chi-so.ts, apps/api/test/okr-nguon.spec.ts]
    expected: "exit 0; KR crm của mục tiêu nháp có bản chụp ba ngày ghi bằng chupKrCrm thật — hàm chụp dùng chung mà chupSoOkr của tác tử gọi (chupSoOkr chỉ gọi nó cho mục tiêu đã công bố; bài gọi thẳng trên mục tiêu nháp) — với ngày lùi từng ngày (không chèn bảng tay) (57 thoả thuận chốt được, cỡ trang OKR_SO.banGhi.coTrang = 50): banGhiChiSo không ngày → ngày mới nhất, trang 1 có 50 dòng, trang 2 có 7, tổng dòng hai trang = soTinhLai = 57 = soDaChup, lech false; mỗi dòng có {loai:'deal', id, ten, ngay} và tập id hai trang bằng tập 57 id gieo; với ngày cũ nhất → khoảng ngày và soDaChup của ngày đó. soTinhLai là tổng của cùng lần liệt kê — một lần deal.count mỗi lời gọi (bài đếm bằng db bọc). Ma trận vai viết trước 4 ca: owner/admin, trưởng P1 (member), thành viên thường → đọc được; vai okr → FORBIDDEN câu ghim «Danh sách bản ghi thuộc dữ liệu đối tác», và cùng người đó gọi lichSuSo, objective → đọc được số. Ca đổi định nghĩa sau khi chụp: datNguonKr đổi phạm vi KR từ phong-ban:P1 sang bo-phan:B1 (mục tiêu nháp) → banGhiChiSo(ngày đã chụp) trả phamVi phong-ban:P1 lấy từ dòng chụp, lech false, danh sách chỉ thoả thuận của P1. KR nguồn api có hai lần ghi → banGhiChiSo trả lanGhi [{ngay, giaTri, nguoi}] mới trước, banGhi rỗng. CHIỀU ĐỎ: bản sao banGhiChiSo dựng where riêng thiếu lọc archivedAt → tổng dòng 58 ≠ soTinhLai 57, bài in hai số; bản sao đọc okrNguonKr hiện tại thay vì dòng chụp → ca đổi định nghĩa đỏ, bài in phamVi và lech."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E11
    criterion: AC-7
    executor: ui-check
    layer: ui-observed
    cmd: config:executors.script.sot_man_chrome
    steps:
      - "Cảnh cây (canh-cay.mjs) trước màn đầu tiên; lệch cây → mã 2"
      - "Gieo qua API thật + chupSoOkr thật (không chèn bảng tay): mục tiêu công bố có KR tay, KR crm có ba ngày lịch sử, KR đo cạnh, KR api; đăng nhập dev:session trưởng đơn vị; dọn theo id ở cuối, kể cả khi đỏ"
      - "Mở {APP_URL}/<slug>/okr?record=objective:<id> ở 1440/vi → ảnh buoc-bang-kr: đọc DOM dấu nguồn ở từng dòng (data-nguon = tay|crm|api), dòng đo cạnh có chữ «tay» và «máy»"
      - "Bấm số của KR crm → URL có record=so-kr:<id>; ngăn có tên chỉ số, phạm vi, khoảng ngày, số đã chụp, bảng bản ghi (đếm dòng), bảng lịch sử 3 dòng → ảnh buoc-ngan-so"
      - "Chọn ngày cũ nhất → URL có ngaySo, số đã chụp và số dòng đổi theo → ảnh buoc-ngay"
      - "Bấm một thoả thuận → sheet thoả thuận; «Quay lại» → ngăn số hiện lại"
      - "Lưu trữ một thoả thuận đã đếm qua API, tải lại → câu lệch có hai số → ảnh buoc-lech"
      - "Trạng thái rỗng (KR crm chỉ số không bản ghi), lỗi (chặn route banGhiChiSo trả 500 → «Thử lại», bỏ chặn, bấm → có dữ liệu) → ảnh buoc-rong, buoc-loi"
      - "Đăng nhập vai okr: số KR crm không phải nút (không role button, không href) → ảnh buoc-chi-okr"
      - "Lặp ảnh ngăn số ở 390; mọi ảnh scrollWidth <= innerWidth; tên chỉ số, tên bản ghi mang translate=no; không lỗi console"
    paths: ["apps/app/app/(app)/[slug]/okr/**", apps/app/components/crm/record-sheet/**, apps/app/lib/messages/okr-so.ts, _acceptance/so-okr-tu-chay/rang/man-so-tu-chay.mjs]
    expected: "exit 0 và ảnh ở .acceptance-runs/so-okr-tu-chay/evidence/; mọi bước khẳng định bằng DOM và URL chứ không chỉ chụp. CHIỀU ĐỎ: bản sao bang-kr bỏ nút số → bước bấm số đỏ, script in «không thấy nút số của KR crm»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E12
    criterion: AC-7
    executor: script
    layer: backend-effect
    cmd: config:executors.script.sot_man_chrome
    paths: [apps/api/src/okr/**, _acceptance/so-okr-tu-chay/rang/man-so-tu-chay.mjs]
    expected: "Cùng lần chạy với E11: ghi request tRPC; số đã chụp trên màn bằng giaTri dòng okrSoChup đọc thẳng DB cho ngày đó; số dòng bảng bản ghi trên màn bằng số dòng banGhiChiSo trả; chọn ngày gọi banGhiChiSo với input ngay khớp URL. CHIỀU ĐỎ: bản sao ngăn gọi banGhiChiSo không kèm ngày đã chọn (luôn ngày mới nhất) → bước chọn ngày đỏ, script in số màn và số DB."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

