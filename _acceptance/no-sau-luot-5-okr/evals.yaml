    expected: |-
      "exit 0; dựng KhoiKrCuaToi không cycleId (Tổng quan) với okr.cycles giả ném lỗi. Khẳng định: có đúng một [data-khoi='okr-cua-toi']; trong nó có [data-trang-thai='ST-tongquan-loi'] chứa chữ ghim «Không tải được KR của bạn.» và một nút chữ ghim «Thử lại»; nút trạng thái đó là [data-slot='empty'] và nút là [data-slot='button'] (quan hệ «đúng là LoiXem», không phải khối tự ráp cùng chữ); không có [data-slot='skeleton']; không có [data-kr-cua-toi]. CHIỀU ĐỎ trên cùng fixture: cây chưa vá (nhánh trả null đứng trước) → bài đỏ với thông điệp ghim «khoi-okr-bien-mat-khi-chu-ky-loi» kèm textContent của body. Mọi fixture khai `satisfies RouterOutputs["okr"][<thủ tục>]` (okr.cycles đủ {cycles, currentId}; okr.khoiCuaToi đủ trường của kiểu thật) và tệp test nằm trong phạm vi check-types của apps/app — bỏ một trường bắt buộc thì check-types đỏ."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

