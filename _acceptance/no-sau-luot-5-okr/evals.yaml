    expected: "exit 0; cùng fixture E1. Bước 1: okr.cycles vẫn ném, bấm «Thử lại» → số lần gọi okr.cycles tăng đúng 1, [data-trang-thai='ST-tongquan-loi'] còn. Bước 2: đổi giả để okr.cycles trả {cycles:[chu kỳ 'ky-1' đủ trường], currentId:'ky-1'} và okr.khoiCuaToi trả 2 KR, bấm «Thử lại» → số lần gọi okr.cycles tăng thêm 1, có đúng 2 [data-kr-cua-toi], không còn ST-tongquan-loi, khoiCuaToi được gọi với cycleId 'ky-1'. CHIỀU ĐỎ: cây chưa vá không có nút để bấm → bài đỏ ghim «khong-thay-nut-thu-lai»."
