      <text class="tm" x="40" y="604" fill="#575757" font-size="9" font-family="'Geist Mono', monospace">Lớp kiểm chung = AuthMiddleware + PhamVi{DoiTac,ToChuc,Okr,Chung}Middleware · câu 4 = docDuocPhamVi(role, phamVi) · từ chối = FORBIDDEN «KHONG_TRONG_PHAM_VI»</text>
