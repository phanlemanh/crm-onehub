    expected: "exit 0; repFromCrm(secret) của apps/agent/agent/channels/eve.ts với token HS256 đúc thật (cùng cách test/channel-auth.spec.ts) cho hai người gieo thật trong cơ sở dữ liệu của lượt kiểm: subject là người role okr → auth trả null (không xác thực); subject là người role member → principal {principalType:'user', principalId: userId}; subject không có dòng member → null. Chiều đỏ: bỏ lần đọc member khỏi repFromCrm thì vế okr đỏ, thông điệp in principal nhận được."
