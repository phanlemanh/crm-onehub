  - id: E8
    criterion: AC-7
    executor: test
    cmd: config:executors.test.vco_gan_vai
    expected: "exit 0; WorkspaceService thật. (1) admin gọi setMemberRole(memberId, 'okr') → đọc lại db.member: role === 'okr'; (2) admin gọi allowEmail({email, role:'okr'}) → db.invitation.role === 'okr'; rồi người đó đăng nhập bằng auth.api.signInEmail thật (móc session.create.before tạo dòng member) → db.member.role === 'okr', và toWorkspaceRole('okr') === 'okr'; (3) member gọi setMemberRole(..., 'okr') → ném ForbiddenException; (4) chủ sở hữu duy nhất tự đổi thành 'okr' → ném ForbiddenException với thông điệp cần một chủ sở hữu, role đọc lại vẫn 'owner'. Chiều đỏ: bỏ 'okr' khỏi WORKSPACE_ROLES thì (1) đỏ ở zod (đầu vào không nhận) và (2) đỏ vì toWorkspaceRole hạ về member, thông điệp in role đọc lại."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [apps/api/src/workspace/**, packages/auth/src/roles.ts, packages/auth/src/organization.ts, packages/auth/src/allow-list.ts, packages/validation/src/vai-workspace.ts, apps/api/test/vai-chi-okr.spec.ts]

