schema_version: 1
feature_slug: vai-chi-okr
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.vco_ma_tran_trpc
    expected: "exit 0; MA TRẬN TOÀN PHẦN rút lúc chạy từ app.get(AppRouterHost).appRouter — mọi thủ tục đang mount, query GET, mutation POST, đầu vào rỗng; bài đỏ nếu dưới 50 thủ tục. Người gieo với role okr, đăng nhập bằng auth.api.signInEmail thật, cookie từ set-cookie. Bài gom tập thủ tục KHÔNG trả 403 với đúng hằng KHONG_TRONG_PHAM_VI (xuất từ @crm/validation/vai-workspace) rồi so BẰNG (toEqual trên mảng đã sắp) với hằng CHO_PHEP của bài — mọi thủ tục của các alias users, settings, currency, zalo, apiKeys, sso, workspace, org cộng workspace.get và sso.signInOptions — quan hệ tập, không phải chuỗi-có-mặt; và khẳng định mọi thủ tục contacts.*, companies.*, deals.*, campaigns.*, onboarding.* trả đúng 403 + hằng đó. Ma trận gọi mọi query trước rồi mới tới mutation; bài in danh sách mutation KHÔNG có schema đầu vào (số ghim trong bài, đổi là bài đỏ) và kết bài khẳng định workspace.get của người okr vẫn 200 với viewerRole 'okr' — tư cách không đổi giữa chừng. Chiều đỏ trên cùng dựng cảnh: (a) bản trước vá — okr bị hạ về member, contacts.list trả 200 — bài đỏ, thông điệp in tập thừa; (b) xếp một router doi-tac sang PhamViChungMiddleware thì tập thừa alias đó và bài đỏ; (c) xếp users sang PhamViDoiTacMiddleware thì tập thiếu users.* và bài đỏ, thông điệp in hai tập."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [apps/api/src/trpc/middlewares/**, apps/api/src/**/*.router.ts, packages/validation/src/vai-workspace.ts, packages/auth/src/roles.ts, apps/api/test/vai-chi-okr.spec.ts]

  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.vco_ma_tran_khoa_rest
    expected: "exit 0; người okr gọi POST /api/trpc/apiKeys.create với đầu vào hợp lệ bằng cookie — phải 2xx và trả key (đối chứng dương cho phạm vi chung); rồi cùng ma trận tRPC của E1 qua header x-api-key với khoá đó: tập không bị từ chối về phạm vi so BẰNG với CHO_PHEP; rồi MA TRẬN REST rút lúc chạy từ khai báo openapi (method, path) của từng thủ tục, gọi dưới /rest với đúng phương thức, đầu vào rỗng, x-api-key: tập đường không bị từ chối về phạm vi so BẰNG với CHO_PHEP chiếu sang restKey; đường khai mà cầu không gắn thật (404) làm bài đỏ; bài đỏ nếu dưới 30 đường; kết bài workspace.get bằng khoá vẫn 200 với viewerRole 'okr'. Chiều đỏ: bỏ câu hỏi phạm vi khỏi AuthMiddleware thì cả hai vế đỏ, thông điệp ghim tên thủ tục/đường đầu tiên lọt."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [apps/api/src/trpc/middlewares/**, apps/api/src/create-app.ts, apps/api/src/trpc/openapi.ts, apps/api/src/api-keys/**, packages/auth/src/auth.ts, apps/api/test/vai-chi-okr.spec.ts]

  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.vco_doi_chung
    expected: "exit 0; đối chứng dương trên CÙNG ma trận của E1 cho hai người: role member và role admin, đăng nhập bằng cùng đường mật khẩu. Không hàng nào mang KHONG_TRONG_PHAM_VI (mã khác — 400/404/403 theo vai quản trị/409 — được phép); sáu thủ tục mẫu contacts.list, companies.list, deals.list, activities.myTasks, search.quick, campaigns.list trả 200 cho cả hai — gọi TRƯỚC ma trận; sau ma trận, workspace.get của mỗi người vẫn 200 với đúng vai đã gieo (một mutation không đầu vào làm đổi tư cách giữa chừng là bài đỏ, in tên thủ tục nghi ngờ = thủ tục cuối cùng trước khi tư cách đổi). Chiều đỏ: docDuocPhamVi trả false cho member ở một phạm vi bất kỳ thì hàng đó mang thông điệp phạm vi và bài đỏ, thông điệp ghim tên thủ tục đầu tiên bị chặn oan."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [apps/api/src/trpc/middlewares/**, packages/validation/src/vai-workspace.ts, apps/api/test/vai-chi-okr.spec.ts]

  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.vco_khong_khai_nhom
    expected: "exit 0; bài kiểm đơn vị trên lớp nền AuthMiddleware lấy từ app.get(AuthMiddleware) (không khai phamVi), gọi use() với ctx.session.user là người okr THẬT trong cơ sở dữ liệu của lượt kiểm và path 'router-moi.list': next KHÔNG được gọi và lỗi ném ra là TRPCError FORBIDDEN với message === KHONG_TRONG_PHAM_VI; cùng lớp với người member: next được gọi đúng một lần và ctx trả về mang user. Thêm: PhamViChungMiddleware với người okr → next gọi một lần. Chiều đỏ: cho lớp nền mặc định phamVi = 'chung' thì vế okr đỏ (next bị gọi), thông điệp in số lần gọi next."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [apps/api/src/trpc/middlewares/**, packages/validation/src/vai-workspace.ts, apps/api/test/vai-chi-okr.spec.ts]

  - id: E5
    criterion: AC-5
    executor: test
    layer: backend-effect
    cmd: config:executors.test.vco_proxy
    expected: "exit 0; API THẬT (AppModule) nghe cổng tạm; hàm proxy THẬT của apps/app/proxy.ts chạy trong tiến trình bun con đứng ở apps/app với API_URL trỏ cổng đó — không giả lập fetch. Người okr đăng nhập thật; với cookie đó: GET /contacts, /deals, /onboarding, /chat, /settings/members → mỗi phản hồi là chuyển hướng có location kết thúc bằng /<slug>/ngoai-pham-vi; GET / và /settings/notifications → location KHÔNG chứa ngoai-pham-vi; GET /settings → location kết thúc bằng /settings/api-keys; thành viên member GET /contacts → location không chứa ngoai-pham-vi. Thêm: GET /api/trpc/workspace.get bằng cookie okr trả 200 và result.data.viewerRole === 'okr'. Chiều đỏ: bỏ dieuHuongTheoVai khỏi proxy thì vế /contacts đỏ, thông điệp in location nhận được; gắn AuthMiddleware phạm vi doi-tac cho workspace.get thì proxy coi là không biết và cho qua, cũng đỏ."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [apps/app/proxy.ts, apps/app/lib/onboarding.ts, apps/app/lib/pham-vi-man.ts, apps/api/src/workspace/workspace.router.ts, apps/api/test/vai-chi-okr.spec.ts]

  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.vco_cau_noi
    expected: "exit 0; handler THẬT của apps/app/app/eve/v1/[...path]/route.ts; chỉ giả lập getSession, connection() và fetch ra ngoài (đếm lời gọi sang trợ lý AI). Vai đọc từ cơ sở dữ liệu thật của lượt kiểm. Hai chiều trên cùng dựng cảnh: member → 200 và đúng 1 lời gọi sang trợ lý AI; okr → 403, body.error === KHONG_TRONG_PHAM_VI, 0 lời gọi. Chiều đỏ: bỏ câu hỏi phạm vi khỏi route thì vế okr đỏ, thông điệp in {status, soLanToiAgent}."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: ["apps/app/app/eve/v1/**", packages/validation/src/vai-workspace.ts, apps/app/test/eve-cau-noi-chi-okr.spec.ts]

