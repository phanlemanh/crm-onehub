schema_version: 1
slug: noi-zalo-cho-nguoi-moi

evals:
  - id: E1
    criterion: AC-1
    executor: test
    layer: backend-effect
    cmd: config:executors.test.nzm_luu_bot
    paths:
      - "apps/agent/agent/channels/zalo.ts"
      - "apps/agent/agent/lib/zalo-*.ts"
      - "packages/validation/src/zalo-update.ts"
      - "packages/db/prisma/schema.prisma"
      - "apps/agent/test/noi-zalo-cho-nguoi-moi.integration.spec.ts"
      - "apps/agent/test/support/zalo-gia.ts"
    expected: |
      Goi handler route POST /internal/zalo/bot lay tu kenh mac dinh cua
      channels/zalo.ts (tim theo method + path, khong goi ham noi bo), Request that
      o goc https://tac-tu.test, header Authorization dung AGENT_BRIDGE_SECRET,
      than {token: T}. Zalo gia tra getMe dung khuon getMe THAT 23/09 (id,
      account_name "bot.uipSwwnr", account_type, can_join_groups, display_name
      "Bot OneHub"). Ma tran:
        1 dung 1 getMe, dung 1 setWebhook
        2 setWebhook.url = "https://tac-tu.test/zalo/webhook" (chu ghim, khong lay hang cua ma)
        3 setWebhook.secret_token dai 64, chi [0-9a-f]
        4 doc LAI DB: zaloBotToken = T, zaloWebhookSecret = dung chuoi o dong 3,
          zaloBotName = "Bot OneHub", zaloWebhookUrl = url dong 2, zaloWebhookLyDo null
        5 than phan hoi khong chua T
      Doi chung am cung fixture: khong header -> 401, 0 loi goi Zalo.
      DOT BIEN (ban sao): doi display_name -> account_name trong parseZaloGetMe ->
      dong 4 do voi thong diep ghim "ten bot theo display_name".
