    criterion: AC-1
    executor: test
    layer: backend-effect
    cmd: config:executors.test.nzm_luu_bot_api
    paths:
      - "apps/api/src/zalo/**"
      - "apps/api/test/noi-zalo-cho-nguoi-moi.spec.ts"
    expected: |
      Goi zalo.luuBot qua caller tRPC that, phien quan tri vien, cau noi tro vao
      mot may chu gia tai cho (Bun.serve) doi vai tac tu va GHI AppSetting nhu tac
      tu that (token T, url, ten). Roi goi zalo.xuong. Ma tran:
        1 may chu gia nhan dung 1 yeu cau; than parse bang schema cua
          packages/validation/src/zalo-cau-noi.ts va truong token bang dung T
          (quan he truong-gia-tri, khong phai chuoi-co-mat)
        2 xuong.nguonToken = "man-hinh"
        3 xuong.goiToken = 4 ky tu cuoi cua T
        4 xuong.webhook.trangThai = "da-dang-ky"
        5 JSON.stringify(ket qua luuBot) va JSON.stringify(xuong) KHONG chua T
      DOT BIEN: tra nguyen zaloBotToken trong xuong -> dong 5 do voi thong diep ghim
      "token khong ve trinh duyet".
