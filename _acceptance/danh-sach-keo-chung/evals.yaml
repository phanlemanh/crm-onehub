schema_version: 1
slug: danh-sach-keo-chung

evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.dsk_dang_luu
    paths:
      - "packages/ui/src/components/sortable-list.tsx"
      - "packages/ui/test/sortable-save-list.dom.tsx"
    expected: |
      sortable-save-list.dom.tsx, describe "dang-luu": dung SortableSaveList ba muc a, b, c, onSave tra mot Promise
      chua xong; dat getBoundingClientRect theo khuon to-chuc-chi-tiet.dom.tsx (datViTri), Space + ArrowDown + Space
      tren tay keo cua a. Ma tran viet truoc 4 dong:
        1 thu tu [data-muc] hien b, a, c ngay sau khi tha
        2 moi tay keo (nut "Đổi thứ tự …") co disabled
        3 onSave goi dung 1 lan voi { ids: ["b","a","c"], id: "a", index: 1 }
        4 duoi danh sach co dong huong dan bang dung sortableList.hint (vi)
        5 dung lai voi disabled: moi tay keo disabled, Space + ArrowDown + Space -> onSave goi 0 lan, thu tu giu a, b, c
          (doi chung duong la dong 3 cua chinh describe nay)
      CHIEU DO: ban sao bo khoa tay keo khi dang luu -> dong 2 do voi thong diep ghim "tay keo con mo khi dang luu".

  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.dsk_loi
    paths:
      - "packages/ui/src/components/sortable-list.tsx"
      - "packages/ui/test/sortable-save-list.dom.tsx"
    expected: |
      describe "loi": nhu E1, onSave reject(new Error("x")). Ma tran 3 dong:
        1 sau khi Promise tu choi, thu tu tro lai a, b, c (khong render lai tu ngoai)
        2 toast.error goi dung 1 lan voi "x" (sonner gia ghi lai loi goi)
        3 tay keo het disabled
      CHIEU DO: ban sao bo nhanh tra thu tu cu -> dong 1 do voi thong diep ghim "giu thu tu vua keo khi luu loi".

  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.dsk_hoan_tac
    paths:
      - "packages/ui/src/components/sortable-list.tsx"
      - "packages/ui/test/sortable-save-list.dom.tsx"
      - "packages/ui/src/lib/messages.ts"
    expected: |
      describe "hoan-tac": nhu E1, onSave xong. Ma tran 4 dong:
        1 toast (thanh cong) goi voi sortableList.saved ("Đã lưu thứ tự mới") va action.label sortableList.undo ("Hoàn tác")
        2 goi action.onClick -> onSave lan 2 voi { ids: ["a","b","c"], id: "a", index: 0 }
        3 goi action.onClick lan nua khi lan 2 chua xong -> khong co lan goi thu 3
        4 en: cung hai chu ban tieng Anh (LocaleProvider "en")
        5 lan goi hoan tac xong -> thu tu a, b, c, tay keo het disabled, toast thanh cong sortableList.restored
          ("Đã trả thứ tự cũ") KHONG co action
        6 lan goi hoan tac reject(new Error("y")) -> thu tu giu b, a, c, toast.error "y"
      CHIEU DO: ban sao Hoan tac gui lai thu tu moi -> dong 2 do voi thong diep ghim "hoan tac khong tra thu tu cu".

  - id: E4
    criterion: AC-4
    executor: ui-check
    layer: ui-observed
    cmd: config:executors.script.dsk_do_man
    steps:
      - "Chay O TIEN CANH, Bash timeout 600000, voi BANG_CHUNG=_acceptance/danh-sach-keo-chung/evidence dat tuong minh: lenh cua dsk_do_man (mot-luot.sh tu lay cong, tien-de.mjs dung kho do rieng cua cay, do-man.mjs tu chan cay, chup, don)"
      - "Doc dong KET LUAN cuoi: ma 0 = moi dong DUNG; ma 2 = khong do duoc; ma 1 = co dong SAI"
      - "Mo tung anh va doi chieu bang mat voi Expected"
    inputs:
      - _acceptance/danh-sach-keo-chung/evidence/
    paths:
      - "packages/ui/src/components/sortable-list.tsx"
      - "apps/app/app/(app)/[slug]/settings/giai-doan/giai-doan-settings.tsx"
      - "apps/app/app/(app)/[slug]/settings/organization/danh-sach-keo.tsx"
      - "apps/app/app/(app)/[slug]/settings/organization/chi-tiet-goc.tsx"
      - "_acceptance/danh-sach-keo-chung/rang/do-man.mjs"
    expected: |
      Ma tran viet truoc, moi o mot dong "DUNG <kho>: <canh> — <so lieu tho>" va mot anh evidence/<canh>-<kho>.png;
      dong dem "<n>/<n> o". Dang nhap quan tri (NGUOI quan tri cua kho do). Keo bang ban phim (focus tay keo
      "Đổi thứ tự <ten>", Space, ArrowUp, Space) — khong keo chuot.
        sap-giai-doan-1440: nhom Dang mo, dua giai doan thu hai len dau -> toast "Đã lưu thứ tự mới" co nut "Hoàn tác";
          tai lai trang -> thu tu moi con (in hai day nhan truoc/sau)
        hoan-tac-giai-doan-1440: dua len lan nua, bam "Hoàn tác" o toast, cho toast "Đã trả thứ tự cũ" (AC-3) va tay
          keo het disabled, tai lai -> thu tu truoc lan keo nay
        sap-to-chuc-1440: ?don=goc, dua bo phan thu hai len dau -> toast co "Hoàn tác"; tai lai -> thu tu moi con
        hoan-tac-to-chuc-1440: bam "Hoàn tác" sau mot lan sap, tai lai -> thu tu cu
      Tra ve thu tu goc cua kho do sau khi do (do-man tu don).
      CHIEU DO: tren onehub truoc vong nay, hoan-tac-to-chuc-1440 SAI "khong co nut Hoàn tác" (Tổ chức chua co).

  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.dsk_luu_loi
    paths:
      - "apps/app/app/(app)/[slug]/settings/giai-doan/giai-doan-settings.tsx"
      - "apps/app/app/(app)/[slug]/settings/organization/danh-sach-keo.tsx"
      - "apps/app/app/(app)/[slug]/settings/organization/chi-tiet-goc.tsx"
      - "apps/app/app/(app)/[slug]/settings/organization/chi-tiet-bo-phan.tsx"
      - "apps/app/test/giai-doan-cai-dat.dom.tsx"
      - "apps/app/test/sap-luu-loi.dom.tsx"
    expected: |
      Hai tep, mot lenh. giai-doan-cai-dat.dom.tsx describe "luu-loi" va sap-luu-loi.dom.tsx (moi, dung trang Tổ chức
      that voi trpc gia theo khuon to-chuc-chi-tiet.dom.tsx, keo bang ban phim theo khuon keoLen/datViTri). Ma tran
      viet truoc 3 noi x 3 dong = 9 assert:
        noi: giai doan (giaiDoan.reorder reject "tu choi"), goc (org.reorderDivisions reject "tu choi"),
             bo phan (org.moveDepartment reject "tu choi")
        1 sau khi tu choi, thu tu hang ([data-hang-giai-doan] / [data-muc-keo]) bang thu tu ban dau, khong tai lai
        2 toast.error goi dung 1 lan voi "tu choi"
        3 toast thanh cong (sortableList.saved) goi 0 lan
      Doi chung duong o moi noi: thu tuc gia tra ve thanh cong -> dong 3 thanh 1 lan (ghim de dong 3 khong xanh
      vi toast bi tat).
      CHIEU DO: ban sao de ham luu cua chi-tiet-goc nuot loi (khong nem lai) -> noi goc dong 1 va 3 do voi thong
      diep ghim "giu thu tu vua keo khi luu loi"; tren onehub truoc vong nay noi giai doan dong 1 do (Ngoai-8).

  - id: E6
    criterion: AC-6
    executor: script
    cmd: config:executors.script.dsk_mot_thanh_phan
    paths:
      - "apps/app/app/(app)/[slug]/settings/giai-doan/**"
      - "apps/app/app/(app)/[slug]/settings/organization/**"
      - "_acceptance/danh-sach-keo-chung/rang/mot-thanh-phan.mjs"
    expected: |
      rang/mot-thanh-phan.mjs doc AST (TypeScript) moi tep .tsx duoi hai thu muc: 0 cau import ten SortableList hoac
      SortableItem tu "@crm/ui/components/sortable-list"; >= 1 tep giai-doan va >= 1 tep organization import
      SortableSaveList; organization/danh-sach-keo.tsx khong co chuoi className chua ca "rounded-lg" va "border".
      In "0 import SortableList truc tiep; SortableSaveList o <ds tep>". --tu-thu: ba ban gia (import SortableList
      trong mot tep giai-doan; khong tep nao dung SortableSaveList; hop rounded-lg border) -> moi ban thoat 1 va goi
      ten tep.

  - id: E7
    criterion: AC-7
    executor: test
    cmd: config:executors.test.dsk_gd_luu_tru_ngay
    paths:
      - "apps/app/app/(app)/[slug]/settings/giai-doan/giai-doan-settings.tsx"
      - "apps/app/app/(app)/[slug]/settings/giai-doan/hop-thoai-giai-doan.tsx"
      - "apps/app/lib/messages/settings.ts"
      - "apps/app/test/giai-doan-cai-dat.dom.tsx"
    expected: |
      describe "luu-tru-ngay": giai doan khong thoa thuan (dealCount 0). Ma tran 5 dong:
        1 menu hang co muc "Lưu trữ"; khong [role=menuitem] nao co chu "Xoá"
        2 chon "Lưu trữ" -> khong co [role=dialog]/[role=alertdialog]; giaiDoan.archive goi 1 lan { id }
        3 toast thanh cong "Đã lưu trữ «<ten>»." co action.label "Hoàn tác"
        4 action.onClick -> giaiDoan.restore goi 1 lan { id }
        5 textContent toan trang khong con "Xoá" (vi) / "Delete" (en) cho giai doan
        6 luu tru giai doan thu hai cua OPEN roi action.onClick -> giaiDoan.restore { id } roi giaiDoan.reorder
          { kind: "OPEN", ids: <thu tu OPEN truoc khi luu tru> } (dung thu tu goi, dung day ids)
        7 nhom WON chi mot giai doan: muc "Lưu trữ" co aria-disabled va mang ly do cu (xoaCuoiCung hoac khoa tuong
          duong), chon -> archive goi 0 lan; doi chung duong: dong 2 (OPEN nhieu giai doan) goi 1 lan
        8 canManage false: moi tay keo disabled, nut menu hang disabled; doi chung duong: canManage true thi khong
      CHIEU DO: tren onehub truoc vong nay -> dong 1 va 2 do (menu "Xoá", co hop hoi); ban sao Hoan tac chi goi
      restore -> dong 6 do voi thong diep ghim "hoan tac luu tru khong tra dung cho cu".

  - id: E8
    criterion: AC-8
    executor: test
    cmd: config:executors.test.dsk_gd_luu_tru_chuyen
    paths:
      - "apps/app/app/(app)/[slug]/settings/giai-doan/hop-thoai-giai-doan.tsx"
      - "apps/app/lib/messages/settings.ts"
      - "apps/app/test/giai-doan-cai-dat.dom.tsx"
    expected: |
      describe "luu-tru-chuyen": giai doan co 4 thoa thuan (DEMO_BOOKED). Ma tran 4 dong:
        1 tieu de hop "Lưu trữ «Demo booked»?"
        2 cau phu chua "Đã lưu trữ" va noi thoa thuan o lai giai doan moi
        3 nut chinh "Chuyển và lưu trữ" khoa toi khi chon dich; chon dich -> archive goi { id, moveTo }
        4 toast thanh cong khong co action
      CHIEU DO: ban sao them action Hoan tac vao toast nay -> dong 4 do.

  - id: E9
    criterion: AC-9
    executor: test
    cmd: config:executors.test.dsk_gd_da_luu_tru
    paths:
      - "apps/app/app/(app)/[slug]/settings/giai-doan/giai-doan-settings.tsx"
      - "apps/app/lib/messages/settings.ts"
      - "apps/app/test/giai-doan-cai-dat.dom.tsx"
    expected: |
      describe "da-luu-tru": giaiDoan.archived gia tra 2 giai doan (OPEN, LOST). Ma tran 6 dong:
        1 [data-slot=archived-list] la khoi cuoi cua trang, nut gap "Đã lưu trữ (2)"
        2 mo gap: 2 dong [data-luu-tru], moi dong co ten va nhom ("Đang mở"/"Không thành" dung chu cua settings.giaiDoan)
        3 moi dong dung 1 nut "Khôi phục", 0 nut "Xoá vĩnh viễn"
        4 archived tra [] -> khong co [data-slot=archived-list]
        5 restore thanh cong -> toast "Đã khôi phục «<ten>»."; restore gia reject("trung") -> toast.error "trung", 2 dong van con
        6 nguoi khong quan tri (canManage false) -> nut "Khôi phục" disabled
      CHIEU DO: tren onehub truoc vong nay -> dong 1 do (khong co muc gap).

  - id: E10
    criterion: AC-10
    executor: test
    cmd: config:executors.test.dsk_api_khoi_phuc
    paths:
      - "apps/api/src/giai-doan/giai-doan.service.ts"
      - "apps/api/src/giai-doan/giai-doan.router.ts"
      - "apps/api/src/giai-doan/giai-doan.contracts.ts"
      - "apps/api/test/giai-doan.spec.ts"
      - "apps/api/test/giai-doan-quyen.spec.ts"
    expected: |
      giai-doan.spec.ts describe "khoi-phuc" tren CSDL kiem that; ma tran viet truoc 8 dong:
        1 cat giai doan OPEN rong roi restore -> archivedAt null, position > moi giai doan song OPEN
        2 cat, tao giai doan song ten " DEMO booked " (khac hoa, co khoang trang), restore -> BAD_REQUEST, archivedAt giu nguyen
        3 cat mot giai doan roi tao them toi 20 song, restore -> BAD_REQUEST, van 20 song
        4 restore giai doan dang song -> BAD_REQUEST
        5 restore ma khong co -> NOT_FOUND
        6 archived tra dung giai doan da cat, moi cat truoc, moi phan tu co id, label, kind, archivedAt; khong co giai doan song
        7 list sau restore co giai doan do o cuoi nhom
        8 sau restore, archive lai giai doan do -> archivedAt moi (khong giu ngay cu) — dung luat archive hien co
      giai-doan-quyen.spec.ts (rut thu tuc ghi tu router): restore cua thanh vien thuong -> FORBIDDEN.
      CHIEU DO: ban sao bo kiem trung ten trong restore -> dong 2 do.

  - id: E11
    criterion: AC-11
    executor: ui-check
    layer: ui-observed
    cmd: config:executors.script.dsk_do_man
    steps:
      - "Cung lan do voi E4 (dedupe lenh); doc dong luu-tru-khoi-phuc-1440, hoan-tac-luu-tru-1440 va da-luu-tru-375"
      - "Mo hai anh"
    inputs:
      - _acceptance/danh-sach-keo-chung/evidence/
    paths:
      - "apps/app/app/(app)/[slug]/settings/giai-doan/giai-doan-settings.tsx"
      - "apps/app/app/(app)/[slug]/settings/giai-doan/hop-thoai-giai-doan.tsx"
      - "apps/api/src/giai-doan/giai-doan.service.ts"
      - "_acceptance/danh-sach-keo-chung/rang/do-man.mjs"
    expected: |
        luu-tru-khoi-phuc-1440: tao qua API mot giai doan OPEN rong ten rieng cua lan do, "Lưu trữ" o menu -> khong
          hop hoi, hang bien, "Đã lưu trữ (n)" xuat hien; mo gap, "Khôi phục" -> hang hien lai la hang cuoi the
          Dang mo (in day nhan cua the)
        hoan-tac-luu-tru-1440: tao qua API mot giai doan OPEN rong rieng, dua no len vi tri thu hai cua the Dang mo,
          "Lưu trữ" -> bam "Hoàn tác" o toast, cho toast/tay keo mo, tai lai -> day nhan the Dang mo bang day truoc
          khi luu tru (in ca hai day)
        da-luu-tru-375: kho 375, sau khi luu tru giai doan rieng, mo "Đã lưu trữ (n)": hop muc gap va nut "Khôi phục"
          co left >= 0, right <= 375; khong tran ngang trang (scrollWidth <= 375)
      Anh: hang cuoi the Dang mo la giai doan vua khoi phuc; o 375 nut "Khôi phục" thay tron.
      Don: giai doan tao trong lan do bi cat lai sau khi do.

  - id: E12
    criterion: AC-12
    executor: test
    cmd: config:executors.test.dsk_hoi_quy
    paths:
      - "packages/ui/src/components/sortable-list.tsx"
      - "apps/app/app/(app)/[slug]/settings/organization/**"
      - "apps/app/test/chi-quan-tri-truong.dom.tsx"
      - "apps/app/test/to-chuc-chi-tiet.dom.tsx"
      - "apps/app/test/to-chuc.dom.tsx"
      - "apps/app/test/giai-doan-board.dom.tsx"
    expected: |
      git diff --quiet $(git merge-base HEAD origin/onehub) tren bon tep kiem app ke tren (khong sua ky vong), roi
      bon tep thoat 0: chi-quan-tri-truong.dom.tsx (Truong tuy chinh dung SortableList cu), to-chuc-chi-tiet.dom.tsx
      (gom describe "sap": reorderDivisions va moveDepartment dung dau vao cu), to-chuc.dom.tsx, giai-doan-board.dom.tsx.
      CHIEU DO: ban sao doi index moveDepartment thanh index cu -> to-chuc-chi-tiet "sap" do.

  - id: E13
    criterion: AC-13
    executor: script
    cmd: config:executors.script.dsk_san_thiet_ke
    paths:
      - "packages/ui/src/components/sortable-list.tsx"
      - "apps/app/app/(app)/[slug]/settings/giai-doan/**"
      - "apps/app/app/(app)/[slug]/settings/organization/**"
      - "_acceptance/danh-sach-keo-chung/rang/san-thiet-ke.mjs"
    expected: |
      rang/san-thiet-ke.mjs rut danh sach tep tu git diff --name-only --diff-filter=AM $(git merge-base HEAD
      origin/onehub), loc *.tsx duoi apps/app va packages/ui/src (bo test/), in "<n> tep" va ten tung tep, roi chay
      design-gate.mjs --mode static cho tung tep: khong P0. Danh sach rong -> thoat 2 ("khong co tep giao dien
      trong diff" — khong xanh gia). --tu-thu: mot tep tam co className doi mau tren Button -> thoat 1 va goi ten tep.
