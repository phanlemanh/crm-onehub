evals:
  - id: E1
    criterion: AC-1
    executor: test
    layer: backend-effect
    cmd: config:executors.test.bcd_bon_the
    paths:
      - "apps/api/src/okr/okr-xem.service.ts"
      - "apps/api/src/okr/okr-khep.service.ts"
      - "apps/api/test/bo-okr-chi-don-vi.spec.ts"
    expected: |
      Ca «bcd-bon-the» trên CSDL thử, dữ liệu vào qua service thật: chu kỳ đang ở pha chấm điểm; bộ phận B có mục
      tiêu công bố B1 (2 KR, 1 KR gắn việc), phòng ban con P1 có P1a, P1b, P2 có P2a (mỗi mục tiêu 1 KR gắn việc, 1
      lần cập nhật tuần này), bộ phận C có C1, OneHub có G1; thêm hai mục tiêu đã bỏ B2 (của B) và P1x (của P1).
      Người xem là quản trị chương trình. Ma trận viết trước 6 cột × 3 đơn vị = 18 ô (danhSach.rows id ·
      danhSach.daBo id · viecCuaBo KR id · hopTuan tongKr và KR id · bangCham mục tiêu id · soBo.soMucTieu và soKr),
      mỗi ô một tập kỳ vọng: bp:B → rows {B1}, daBo {B2}; pb:P1 → rows {P1a, P1b}, daBo {P1x}; goc → rows {G1},
      daBo {}. Số assert = 18. Thêm một ô nguoi:<chủ P1a> = như trước vòng (P1a), để chứng nhánh người không đổi.
      Đối chứng dương: chạy cùng ca trên mã trước vòng cho bp:B rows ⊇ {P1a} (thước bắt được gộp).
      CHIEU DO: bản sao dieuKienDonVi trả lại OR phòng ban con cho bp → đỏ «bcd-bon-the: bp:B lot phong ban con
      (danhSach P1a)» và «bcd-bon-the: bp:B lot da bo P1x»; bản sao trả {} cho bp → đỏ «bcd-bon-the: bp:B lot don vi
      khac (danhSach C1)».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: test
    layer: backend-effect
    cmd: config:executors.test.bcd_so_rieng
    paths:
      - "apps/api/src/okr/bo-okr.ts"
      - "apps/api/src/okr/toan-canh.ts"
      - "apps/api/src/okr/okr-xem.service.ts"
      - "apps/api/test/bo-okr-chi-don-vi.spec.ts"
    expected: |
      Ca «bcd-so-rieng», cùng dữ liệu E1 cộng bộ phận D không mục tiêu riêng có phòng con Q (1 mục tiêu) và một KR
      tự tin thấp ở P1a. QUAN HỆ trên mọi hàng của okr.danhSachBo có cap goc|bo-phan|phong-ban (ma trận viết trước từ
      org.tree: goc, bp:B, bp:C, bp:D, pb:P1, pb:P2, pb:Q = 7 ô): hang.tienDo = soBo(don).tienDo, hang.tuTinThap =
      soBo(don).tuTin.thap, hang.soMucTieu = countByUnit[don] ?? 0. Khẳng định số: bp:B soMucTieu 1, tuTinThap 0;
      bp:D soMucTieu 0, tienDo null; pb:P1 tuTinThap 1.
      CHIEU DO: bản sao gopDanhSachBo đọc lại hàng toanCanh → đỏ «bcd-so-rieng: bp:B tienDo gop (khac soBo)»; bản sao
      bỏ hàng bộ phận rỗng khỏi bảng số riêng → đỏ «bcd-so-rieng: bp:D thieu hang».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: test
    layer: backend-effect
    cmd: config:executors.test.bcd_toan_canh
    paths:
      - "apps/api/src/okr/toan-canh.ts"
      - "apps/api/src/okr/okr-xem.service.ts"
      - "apps/api/test/bo-okr-chi-don-vi.spec.ts"
    expected: |
      Ca «bcd-toan-canh», cùng dữ liệu E1: hàng toanCanh bp:B có soMucTieu 4 (B1, P1a, P1b, P2a) và soKr = tổng KR của
      bốn mục tiêu; hàng sucKhoe bp:B có tongKr bằng tổng ấy; hàng pb:P1 soMucTieu 2. Đối chứng: soBo(bp:B).soMucTieu 1
      ở cùng ca — hai số khác nhau là đúng hai luật.
      CHIEU DO: bản sao gopToanCanh bỏ conBp → đỏ «bcd-toan-canh: bp:B thoi cong don (1 != 4)».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.bcd_gon
    paths:
      - "apps/app/app/(app)/[slug]/okr/theo-don-vi/theo-don-vi.tsx"
      - "apps/app/app/(app)/[slug]/okr/theo-don-vi/hang-cong-cu.tsx"
      - "apps/app/test/bo-okr-chi-don-vi.dom.tsx"
    expected: |
      Ca «bcd-gon»: dựng TheoDonVi với tRPC giả theo đầu ra thật (parse bằng contracts) cho ma trận viết trước
      3 đơn vị (goc, bp:B, pb:P1) × 4 thẻ con (danh-sach, hop-tuan, viec, cham) = 12 ô. Mỗi ô: 0 [data-chon-don-vi],
      0 [data-don-vi-con], 0 [data-nhom-da-bo], 0 phần tử Collapsible có nhãn mang số đếm sau bảng; đúng 1
      [data-vi-tri-bo="mot-bo"], đúng 1 [data-the-con-bo], tối đa 1 hàng công cụ ([data-hang-cong-cu] — thẻ danh-sach
      đúng 1); thứ tự tài liệu vị trí < thẻ con < hàng công cụ < nội dung, và chân bảng là khối cuối của vùng nội dung.
      Đối chứng dương: cùng bộ chọn chạy trên mã trước vòng (git stash không dùng; bản sao cây tại merge-base) thấy đủ
      [data-chon-don-vi], [data-don-vi-con], [data-nhom-da-bo] ở ô bp:B danh-sach.
      CHIEU DO: bản sao gắn lại DonViCon → đỏ «bcd-gon: bp:B danh-sach con luoi truc thuoc»; gắn lại NhomDaBo → đỏ
      «bcd-gon: bp:B danh-sach con muc gap da bo»; gắn lại ChonDonVi → đỏ «bcd-gon: bp:B danh-sach con o chon don vi».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.bcd_menu
    paths:
      - "apps/app/app/(app)/[slug]/okr/theo-don-vi/vi-tri-bo.tsx"
      - "apps/app/app/(app)/[slug]/okr/theo-don-vi/lan-can.ts"
      - "packages/ui/src/components/breadcrumb.tsx"
      - "apps/app/test/bo-okr-chi-don-vi.dom.tsx"
    expected: |
      Ca «bcd-menu». (1) Hàm lanCan trên cây org.tree thật dạng (bộ phận B {P1, P2}, C {}, phòng chưa xếp X) — ma trận
      viết trước 6 đơn vị: goc → Trực thuộc [B, C, X]; bp:B → Thuộc [goc], Cùng cấp [C], Trực thuộc [P1, P2]; bp:C →
      Thuộc [goc], Cùng cấp [B], không Trực thuộc; pb:P1 → Thuộc [B], Cùng cấp [P2]; pb:X → Thuộc [goc]; nguoi:<id> →
      null. (2) DOM trên trang bp:B ở thẻ hop-tuan, kyOkr=q4: bấm [data-menu-vi-tri] → menu có ba nhãn nhóm đúng thứ
      tự, mục [data-menu-don] mang chữ «2 mục tiêu» cho P1 (countByUnit), href giữ donOkr=pb:P1, kyOkr=q4, xemOkr=hop-tuan;
      phím Escape đóng menu và document.activeElement là [data-menu-vi-tri]. Trang nguoi: không có [data-menu-vi-tri].
      CHIEU DO: bản sao lanCan bỏ lọc cùng cấp → đỏ «bcd-menu: bp:B cung cap lot P1»; bản sao bỏ xemOkr khỏi href → đỏ
      «bcd-menu: lien ket mat the con».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.bcd_da_bo
    paths:
      - "apps/app/app/(app)/[slug]/okr/theo-don-vi/theo-don-vi.tsx"
      - "apps/app/app/(app)/[slug]/okr/theo-don-vi/nut-da-bo.tsx"
      - "apps/app/app/(app)/[slug]/okr/okr-search-params.ts"
      - "apps/app/test/bo-okr-chi-don-vi.dom.tsx"
    expected: |
      Ca «bcd-da-bo», nuqs testing adapter: danhSach giả trả rows 3, daBo 2. Nút [data-nut-da-bo] chữ «Đã bỏ (2)»,
      aria-pressed false, nằm trong hàng công cụ của bảng. Bấm → URL có daBoOkr=1, aria-pressed true, bảng đúng 2 hàng
      và đúng id hai mục tiêu đã bỏ. Dựng lại với URL daBoOkr=1 → vẫn 2 hàng. Bấm lại → 3 hàng, URL không còn daBoOkr.
      daBo rỗng → không có [data-nut-da-bo]. URL có trangThaiOkr (lọc trạng thái đang bật, máy chủ trả daBo rỗng) →
      không có [data-nut-da-bo] và bảng hiện đúng rows máy chủ trả.
      CHIEU DO: bản sao bỏ ghi URL (useState) → đỏ «bcd-da-bo: tai lai mat trang thai»; bản sao hiện nút khi daBo rỗng
      → đỏ «bcd-da-bo: nut hien khi 0».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-7
    executor: test
    cmd: config:executors.test.bcd_rong
    paths:
      - "apps/app/app/(app)/[slug]/okr/trang-thai-okr.tsx"
      - "apps/app/app/(app)/[slug]/okr/theo-don-vi/theo-don-vi.tsx"
      - "apps/app/lib/messages/okr-vo-khu.ts"
      - "apps/app/test/bo-okr-chi-don-vi.dom.tsx"
    expected: |
      Ca «bcd-rong»: ma trận viết trước 3 ô rỗng — bp:D (tên «Khối Hỗ trợ», chu kỳ «Quý 4 2026») → [data-rong-bo-phan]
      chứa «Khối Hỗ trợ chưa có mục tiêu riêng trong Quý 4 2026» và câu chỉ sang menu dòng vị trí, tên khối trong phần
      tử translate="no"; pb:P2 rỗng → không [data-rong-bo-phan], câu rỗng hiện có; goc rỗng → như pb. Cả ba không có
      hàng mục tiêu nào.
      CHIEU DO: bản sao dùng câu rỗng chung cho bp → đỏ «bcd-rong: bp:D thieu cau rieng».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E8
    criterion: AC-8
    executor: test
    cmd: config:executors.test.bcd_hop_tuan_goc
    paths:
      - "apps/app/app/(app)/[slug]/okr/hop-tuan.tsx"
      - "apps/app/app/(app)/[slug]/okr/don-vi-co-kr.tsx"
      - "apps/app/lib/messages/okr-hop-tuan-bo.ts"
      - "apps/app/test/bo-okr-chi-don-vi.dom.tsx"
    expected: |
      Ca «bcd-hop-tuan-goc»: hopTuan thật parse (tongKr 0) cho goc, chu kỳ đang chạy, toanCanh có bp:B soKr 4. Màn có
      câu «OneHub chưa có KR công bố trong Quý 4 2026.», câu chỉ sang menu dòng vị trí, liên kết [data-nut="xem-moi-bo"]
      href /ws/okr/bo-okr?kyOkr=q4; không có [data-don-vi-co-kr]; không gọi okr.toanCanh (spy đếm 0).
      CHIEU DO: bản sao gắn lại DonViCoKr → đỏ «bcd-hop-tuan-goc: con danh sach don vi co KR».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E9
    criterion: AC-9
    executor: ui-check
    layer: ui-observed
    cmd: config:executors.script.bcd_man
    paths:
      - "apps/app/app/(app)/[slug]/okr/theo-don-vi/**"
      - "apps/app/app/(app)/[slug]/okr/hop-tuan.tsx"
      - "packages/ui/src/components/breadcrumb.tsx"
      - "apps/api/src/okr/okr-xem.service.ts"
      - "apps/api/src/okr/bo-okr.ts"
      - "_acceptance/bo-okr-chi-don-vi/rang/**"
    steps:
      - "Chạy đúng lệnh của eval với BCD_CHEP_ANH=1 (tien-de.mjs + man-bo-okr-chi-don-vi.mjs); không gọi thẳng script con"
      - "Đọc dòng ĐẾM của script: số mục tiêu mỗi thẻ con OKR · Họp tuần (KR) · Việc · Chấm điểm của Khối Kinh doanh, Khối Vận hành, Khối Hỗ trợ trên okr:mau"
      - "Mở ảnh _acceptance/bo-okr-chi-don-vi/evidence/bcd-khoi-1440-sang.png, bcd-menu-1440-sang.png, bcd-menu-375-sang.png, bcd-menu-375-toi.png, bcd-rong-1440-sang.png, bcd-danh-sach-1440-sang.png"
    expected: "Trên bộ mẫu: thẻ OKR của Khối Kinh doanh hiện đúng 1 mục tiêu, Khối Vận hành 1, Khối Hỗ trợ 0 kèm câu «chưa có mục tiêu riêng»; ba thẻ con còn lại của ba khối không có mục tiêu hay KR của phòng ban con (script in ĐẾM khớp okr.soBo). Ảnh khối: dòng vị trí «Bộ OKR › Khối Kinh doanh ▾» ngay dưới đầu trang, thẻ con, bốn ô số, một hàng công cụ, bảng; không ô chọn đơn vị, không lưới đơn vị trực thuộc dưới bảng. Ảnh menu: ba nhóm Thuộc · Cùng cấp · Trực thuộc, mỗi mục tên và số mục tiêu; ở 375 menu nằm gọn trong bề ngang màn, tên dài xuống dòng hay cắt có dấu, trang không tràn ngang; sáng và tối chữ không chìm nền. Script in ĐẾM QUAN HỆ cho ma trận viết trước 3 khối × 3 cột (Mục tiêu · Tiến độ · KR tự tin thấp) = 9 ô, mỗi ô so ba nguồn — chữ DOM ở hàng danh sách Bộ OKR, ô số tương ứng đầu thẻ OKR của bộ, okr.soBo (Mục tiêu so countByUnit) — và thoát khác 0 với dòng «bcd-man: <khối> <cột> lech» khi một ô lệch; ảnh danh sách cho thấy Khối Kinh doanh Mục tiêu 1, Khối Hỗ trợ Tiến độ trống. Script đi từ bộ khối sang bộ một phòng trong hai lần bấm."
    evidence_required: [run_id, exit_code, verifier, verified_at, output, screenshot]
