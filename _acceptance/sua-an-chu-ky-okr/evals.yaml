schema_version: 1
feature_slug: sua-an-chu-ky-okr
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.sac_viec
    paths: [packages/validation/src/okr-chu-ky.ts, packages/validation/test/okr-chu-ky-viec.spec.ts]
    expected: "exit 0; BẢNG CA VIẾT TRƯỚC là 40 ca phân biệt — pha (4) × đã ẩn/chưa (2) × năm dạng dữ liệu (trống năm, trống quý, có dữ liệu năm 0 quý hiện, có dữ liệu năm ≥1 quý hiện, có dữ liệu quý; «trống mà còn quý hiện» không tồn tại) — viết THẲNG thành 40 dòng trong bài, mỗi dòng mang sẵn object năm cờ kỳ vọng gõ tay theo bảng luật của design doc (không có hàm dựng kỳ vọng, không biểu thức chép thân viecChuKy); bài khẳng định 40 dòng và không hai dòng trùng tình trạng. Ca ghim riêng: trống lập kế hoạch → {suaMoiO true, suaTen true, go true, an false, hienLai false}; có dữ liệu đang chạy → {false, true, false, true, false}; có dữ liệu đã đóng → {false, false, false, true, false}; đã ẩn bất kỳ → chỉ hienLai true; năm có dữ liệu còn 1 quý hiện → an false. CHIỀU ĐỎ: bản sao viecChuKy cho suaTen true ở da-dong → ca đã đóng đỏ, bài in tình trạng và hai object."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-1
    executor: test
    layer: backend-effect
    cmd: config:executors.test.sac_cycles
    paths: [apps/api/src/okr/**, packages/validation/src/okr-chu-ky.ts, apps/api/test/okr-sua-an-chu-ky.spec.ts, apps/api/test/okr-sua-an-san.ts]
    expected: "exit 0; gieo qua thủ tục thật (createCycle, createObjective, setCyclePhase, anChuKy) năm dạng: C1 trống lập kế hoạch, C2 quý có mục tiêu đang chạy, C3 đã đóng, C4 đã ẩn, N1 năm có một quý chưa ẩn. okr.cycles → với mỗi id, viec toEqual viecChuKy(tình trạng đọc TRỰC TIẾP từ DB bằng đếm sáu quan hệ trong bài, không qua service), anLuc bằng DB (ISO hoặc null), quyConHien của N1 = 1, của quý = 0. CHIỀU ĐỎ: bản sao service đếm trống bỏ quan hệ okrHoiY → chu kỳ chỉ có lần hỏi ý báo go true, ca C-hoi-y đỏ in hai object."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-2
    executor: test
    layer: backend-effect
    cmd: config:executors.test.sac_sua_moi_o
    paths: [apps/api/src/okr/**, packages/validation/src/okr-chu-ky.ts, packages/validation/src/okr-vet.ts, packages/db/src/okr-vet.ts, apps/api/test/okr-sua-an-chu-ky.spec.ts, apps/api/test/okr-sua-an-san.ts]
    expected: "exit 0; năm N (2027-01-01 → 2027-12-31, trống) và quý Q (2028 Q1, trống, năm 2028 có quý R 2028-04-01 → 2028-06-30 chưa ẩn và quý S 2028-07-01 → 2028-09-30 đã ẩn): suaChuKy N đổi tên, endsOn 2027-12-30, nghỉ 2027-02-05 → 2027-02-12, updateWeekday 3 → đọc DB đúng từng ô; okrTrail đúng MỘT dòng sua-chu-ky cho N, before/after chỉ chứa các khoá đã đổi với giá trị cũ/mới. Ma trận từ chối viết trước 4 ca, mỗi ca ghim thông điệp và khẳng định bản ghi đọc lại toEqual bản trước và số dòng okrTrail không đổi: Q ra ngoài năm 2028; Q chồng R; startsOn = endsOn; nghỉ ngoài chu kỳ. Đối chứng dương cùng fixture: Q đổi sang 2028-07-15 → 2028-08-31 (chồng S đã ẩn) → ghi được. CHIỀU ĐỎ: bản sao kiểm chồng không lọc anLuc → ca chồng S đỏ, bài in tên quý chồng."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-3
    executor: test
    layer: backend-effect
    cmd: config:executors.test.sac_sua_ten
    paths: [apps/api/src/okr/**, packages/validation/src/okr-chu-ky.ts, apps/api/test/okr-sua-an-chu-ky.spec.ts, apps/api/test/okr-sua-an-san.ts]
    expected: "exit 0; BA chu kỳ viết trước mà viecChuKy cho suaMoiO false, suaTen true: D có một mục tiêu nháp pha dang-chay; E trống pha dang-chay; F trống pha cham-diem (gieo qua setCyclePhase thật, now đóng băng sau endsOn). Trên MỖI chu kỳ (3 × 4 = 12 ca): suaChuKy chỉ đổi tên → ghi được, một dòng vết; ba ca đổi tên kèm endsOn / kèm khoảng nghỉ / kèm updateWeekday → 400 thông điệp ghim OKR.thongDiep có chữ «chỉ sửa được tên», tên KHÔNG đổi (không ghi nửa chừng), okrTrail không thêm; bài khẳng định số ca đã chạy = 12; suaChuKy trên chu kỳ da-dong và trên chu kỳ đã ẩn (mỗi ca chỉ đổi tên) → 400 thông điệp ghim riêng, bản ghi không đổi. CHIỀU ĐỎ: bản sao service ghi tên trước rồi mới kiểm ô khác → ca kèm endsOn đỏ, bài in tên đọc được."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-4
    executor: test
    layer: backend-effect
    cmd: config:executors.test.sac_go
    paths: [apps/api/src/okr/**, packages/db/src/okr-chu-ky-hien.ts, packages/db/prisma/schema.prisma, packages/validation/src/okr-chu-ky.ts, apps/api/test/okr-sua-an-chu-ky.spec.ts, apps/api/test/okr-sua-an-san.ts]
    expected: "exit 0; bài đọc mô hình dữ liệu lúc chạy của Prisma client (db._runtimeDataModel, parse bằng Zod ở biên — bản Prisma 7 của kho không xuất Prisma.dmmf), lấy mọi trường quan hệ của các model trỏ tới OkrCycle (trừ OkrTrail — cột không khoá ngoại) và so TẬP toEqual với QUAN_HE_GIU_CHU_KY; bảng fixture GIEO_THEO_QUAN_HE khoá theo tên quan hệ, mỗi quan hệ một hàm gieo qua thủ tục thật (hôm nay sáu: mục tiêu đã bỏ qua dropObjective; lần hỏi ý qua moHoiY; quý con đã ẩn qua createCycle + anChuKy; đợt rà qua moRa; điểm KR qua setCyclePhase sang cham-diem; đích mang sang qua mangSang) — bài đỏ khi một quan hệ của DMMF không có hàm gieo, in tên quan hệ. Chạy goChuKy trên mỗi chu kỳ gieo (số ca = số quan hệ, khẳng định bằng độ dài tập) → 400 thông điệp ghim, không 500, okrCycle và bảng con tương ứng đọc lại toEqual bản trước. G0 trống pha dang-chay: goChuKy → okrCycle.findUnique null; okrTrail có dòng go-chu-ky với before chứa name, kind, startsOn, endsOn, phase đúng bản trước; dòng tao-chu-ky của G0 vẫn đọc được theo cycleId. CHIỀU ĐỎ: (a) bản sao QUAN_HE_GIU_CHU_KY bỏ children → so tập đỏ in «children»; (b) bản sao hàm tính trống bỏ children → ca quý-con-đã-ẩn đỏ in id và lỗi nhận được."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-5
    executor: test
    layer: backend-effect
    cmd: config:executors.test.sac_an_hien
    paths: [apps/api/src/okr/**, packages/validation/src/okr-chu-ky.ts, packages/validation/src/okr-khep.ts, apps/api/test/okr-sua-an-chu-ky.spec.ts, apps/api/test/okr-sua-an-san.ts]
    expected: "exit 0; quý H có mục tiêu, pha dang-chay: anChuKy không lyDo → 400 (Zod); lyDo 9 ký tự → 400; lyDo 10 ký tự → anLuc khác null, phase vẫn dang-chay, okrTrail một dòng an-chu-ky note = lyDo; hienChuKy → anLuc null, phase vẫn dang-chay, một dòng hien-chu-ky. Ma trận biên viết trước 5 ca, mỗi ca ghim thông điệp và bản ghi không đổi: anChuKy chu kỳ trống (thông điệp nói gỡ); anChuKy chu kỳ đã ẩn; anChuKy năm còn 1 quý chưa ẩn (thông điệp chứa số 1); hienChuKy quý khi năm cha đã ẩn; hienChuKy quý K khi quý L chưa ẩn cùng năm chồng ngày K (thông điệp chứa tên L). Đối chứng dương cùng fixture: ẩn L rồi hiện K → được. CHIỀU ĐỎ: bản sao hienChuKy bỏ kiểm chồng → ca K/L đỏ, bài in hai khoảng ngày."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-6
    executor: test
    layer: backend-effect
    cmd: config:executors.test.sac_pham_vi
    paths: [apps/api/src/okr/**, apps/api/test/vai-chi-okr.spec.ts, apps/api/test/ma-tran-thu.ts, apps/api/test/okr-sua-an-chu-ky.spec.ts]
    expected: "exit 0; vai-chi-okr ma-tran-trpc và ma-tran-khoa-rest xanh; bài tự dò thủ tục và khẳng định bốn tên suaChuKy, goChuKy, anChuKy, hienChuKy có trong tập dò được (so tập) và DAU_VAO_HOP_LE có đầu vào hợp lệ cho cả bốn; ca quyen trong okr-sua-an-chu-ky.spec: thành viên thường và vai okr gọi bốn thủ tục qua tRPC → 403 theo vai quản trị, bản ghi chu kỳ đọc lại toEqual và okrTrail không thêm; đối chứng dương quản trị cùng đầu vào → được. CHIỀU ĐỎ: bản sao goChuKy bỏ assertQuanTri → ca thành viên đỏ, bài in id chu kỳ đã mất."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E8
    criterion: AC-7
    executor: test
    layer: backend-effect
    cmd: config:executors.test.sac_ky_mac_dinh
    paths: [apps/api/src/okr/**, packages/db/src/okr-tien-do.ts, packages/db/src/okr-chu-ky-hien.ts, apps/api/test/okr-sua-an-chu-ky.spec.ts, apps/api/test/okr-sua-an-san.ts]
    expected: "exit 0; now đóng băng 2026-11-18 VN; quý A (2026-10-01 → 2026-12-31, dang-chay, đã ẩn) và quý B (2026-10-15 → 2026-12-31, lap-ke-hoach, chưa ẩn) cùng năm Y: okr.cycles().currentId === B.id; ẩn B → currentId không thuộc {A, B} (theo AC-7: null chỉ khi mọi chu kỳ đều đã ẩn; còn năm chưa ẩn thì là năm đó); createCycle quý chồng ngày A trong năm Y (B đã ẩn — B có dữ liệu nên không gỡ được) → tạo được; createCycle quý thuộc năm Z đã ẩn → 400 thông điệp ghim, số okrCycle không đổi. Đối chứng dương: hiện A → currentId === A. CHIỀU ĐỎ: bản sao cycles() truyền cả chu kỳ ẩn vào chonChuKyHienTai → ca đầu trả A, bài in id."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E9
    criterion: AC-8
    executor: test
    layer: backend-effect
    cmd: config:executors.test.sac_an_vang_api
    paths: [apps/api/src/okr/**, packages/db/src/okr-chu-ky-hien.ts, apps/api/test/okr-sua-an-chu-ky.spec.ts, apps/api/test/okr-sua-an-san.ts]
    expected: "exit 0; hai quý chạy song song cùng dữ liệu gieo (mục tiêu công bố, KR của người U, KR của người rời R, lần hỏi ý đang mở): X đã ẩn, V chưa ẩn. (1) MA TRẬN GHI: bài tự dò mọi thủ tục mutation của okr router (cùng cách vai-chi-okr dò thủ tục) và đòi mỗi tên có đúng một dòng trong GHI_VAO_KY_AN (đầu vào nhắm X hoặc bản ghi con của X) hoặc trong MIEN_GHI (lý do: không chạm chu kỳ, hoặc là suaChuKy/goChuKy/anChuKy/hienChuKy); thiếu dòng → đỏ in tên thủ tục; số ca chạy = độ dài GHI_VAO_KY_AN (khẳng định). Mỗi dòng: gọi vào X → 400 thông điệp ghim chu kỳ đã ẩn, bản ghi đích đọc lại toEqual bản trước; cùng lệnh đổi id sang V → được (đối chứng dương). Tối thiểu có dòng cho createObjective, updateObjective, publishObjective, createKeyResult, updateKeyResult, setCyclePhase, moRa, chamKr, mangSang (nguồn ở X), moHoiY, guiY. (2) mangSang từ quý trước cùng loại khi kỳ kế sớm nhất theo startsOn là X → bản nháp nằm ở V (id), không ở X; (3) okr cập nhật tuần của tôi cho U → danh sách KR toEqual đúng id KR của V; (4) chuyển việc khi R rời → chỉ KR của V đổi người, KR của X đọc lại giữ ownerUserId R. Hiện lại X → dòng (3) có thêm id KR của X. Thêm bốn ca X/V so theo id (hoặc theo đơn vị riêng của bài): alignmentTargets không có mục tiêu của X; cây căn chỉnh của năm (alignmentTree → mucTieuCuaCay) bỏ quý X; OKR còn mở của đơn vị (org.luuTruXemTruoc → dieuKienOkrMo) không đếm X; okr.objective trả kyGhiDuoc false cho mục tiêu của X, true cho V. CHIỀU ĐỎ: bản sao okr-cap-nhat bỏ KY_CON_HIEN → dòng (3) đỏ in id KR thừa."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E10
    criterion: AC-8
    executor: test
    layer: backend-effect
    cmd: config:executors.test.sac_an_vang_nen
    paths: [packages/db/src/okr-nhac.ts, apps/agent/agent/lib/okr/doc.ts, apps/agent/test/okr-dich-can-chinh.integration.spec.ts, packages/db/src/okr-chu-ky-hien.ts, apps/agent/agent/lib/okr-chup.ts, apps/agent/test/okr-nhac.integration.spec.ts, apps/agent/test/okr-chup.integration.spec.ts]
    expected: "exit 0; ca ky-an trong okr-nhac.integration: cùng gieo hai quý X (ẩn) / V (chưa ẩn) có KR của U chưa cập nhật tuần, mục tiêu chờ duyệt, lần hỏi ý đang mở mà U chưa góp; sinh nhắc buổi sáng cho U → các mục nhắc toEqual đúng tập id của V (mục cập nhật tuần, chờ duyệt, hỏi ý); lienQuanOkr của người chỉ có dữ liệu ở X → false. Ca ky-an trong okr-chup.integration: KR nguồn máy ở X và V, chạy chụp số một ngày → okrSoChup có dòng cho KR của V, 0 dòng cho KR của X. Hiện lại X và chạy lại → có mục/dòng của X. Ca ky-an trong okr-dich-can-chinh.integration: docDichCanChinh của tác tử Trợ lý OKR không trả mục tiêu của X, có của V (so id). CHIỀU ĐỎ: bản sao okr-chup bỏ KY_CON_HIEN → ca chụp đỏ in id KR của X."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E11
    criterion: AC-9
    executor: script
    cmd: config:executors.script.sac_soi_ky_con_hien
    paths: [apps/api/src/**, packages/db/src/**, apps/agent/agent/**, _acceptance/sua-an-chu-ky-okr/rang/soi-ma.mjs, _acceptance/sua-an-chu-ky-okr/rang/noi-doc-chu-ky.json]
    expected: "exit 0; soi-ma.mjs suy gốc kho từ vị trí của nó, quét .ts ở apps/api/src, packages/db/src, apps/agent/agent (bỏ generated, .eve, test) bằng AST TypeScript (không regex dòng); tìm mọi chỗ đọc chu kỳ không theo id: object where có khoá cycle ở MỌI độ sâu (kể cả qua objective, okrKeyResult), cycleId: { in: … }, điều kiện startsOn/endsOn trên chu kỳ, lời gọi okrCycle.findMany/findFirst/count/groupBy, $queryRaw có chuỗi okrCycle; gom thành tập (tệp, hàm bao quanh) và so TẬP toEqual với lọc ∪ miễn của rang/noi-doc-chu-ky.json (không so số) — thừa hay thiếu đều đỏ, in phần chênh; mỗi chỗ nhóm lọc phải có định danh KY_CON_HIEN trong cùng object where hoặc AND bao nó; in danh sách đã soi. CHIỀU ĐỎ trong tmpdir (--chieu-do): (a) okr-trao-doi.service.ts gỡ KY_CON_HIEN → exit 1 in tệp và dieuKienChuyen; (b) tệp giả findMany({ where: { cycle: { endsOn: { gte: now } } } }) → exit 1 in tệp giả là chỗ chưa khai; (c) tệp giả okrKeyResult.findMany({ where: { objective: { cycle: { phase: 'dang-chay' } } } }) → exit 1. Đối chứng dương: cây thật → exit 0."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

