schema_version: 1
feature_slug: cham-bo-do-chiu-cau-loi
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.cbd_tran_loi
    paths: [_acceptance/tro-ly-doc-kho/rang/quyet-do.ts, _acceptance/tro-ly-doc-kho/rang/quyet-do.spec.ts, _acceptance/tro-ly-doc-kho/rang/cham-bo-do.ts]
    expected: "exit 0; describe 'tran-loi' của quyet-do.spec.ts. MA TRẬN VIẾT TRƯỚC cho tranCauLoi (import, không chép công thức): N = 96 → 4, 60 → 3, 40 → 2, 20 → 1, 10 → 1, 1 → 1; bài khẳng định đã chạy 6 dòng. CHAM_BO_DO.tranLoi toEqual {phanTram: 5, toiThieu: 1}; CHAM_BO_DO.nguong toEqual bộ gõ tay {dungTrang 0.8, tuChoiDung 0.8, chuyenQuyDinh 0.9, chuyenNhamToiDa 0.1, traLoiKhongQuaKiem 0}. CHIỀU ĐỎ (cặp t1 của rang/dot-bien.mjs): tranCauLoi luôn trả 0 → bài đỏ ghim «tran 96 cau phai la 4»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.cbd_tran_loi
    paths: [_acceptance/tro-ly-doc-kho/rang/quyet-do.ts, _acceptance/tro-ly-doc-kho/rang/quyet-do.spec.ts]
    expected: "exit 0; describe 'tran-loi'. Lượt 96 câu theo hình bộ mẫu bo-cau-hoi-mau (lượt một 46: 36 co-trang + 10 khong-co; lượt hai 50: 46 quy định + 4 không; nhãn đạt cho mọi câu sạch) với 0, 1 và 4 câu loi đặt ở ba chỉ số khác nhau: ketLuan ra ma 0 (không phải 2) ở cả ba ca; tử/mẫu số của mỗi chỉ số bằng số câu sạch đếm tay; dòng câu lỗi bằng NGUYÊN VĂN chuỗi gõ tay, ví dụ ca 1 câu «cau loi model: 1/96 (<id>) · tran 4 · dungTrang 1 · tuChoiDung 0 · chuyenQuyDinh 0 · chuyenNham 0», ca 0 câu không có ngoặc; đúng một dòng bắt đầu «cau loi model:». Ca thêm: 4 câu loi và một chỉ số dưới ngưỡng → ma 1. Trần tính trên cả lượt, không theo trường luot: 3 câu loi cùng ở luot 1 → ma khác 2, dòng «cau loi model: 3/96 (…) · tran 4 …»; 4 câu loi cùng ở luot 2 → ma khác 2; sai thì ghim «tran tinh tren ca luot, khong theo luot con». CHIỀU ĐỎ (cặp t4): bỏ lệnh thêm dòng câu lỗi → đỏ ghim «thieu dong cau loi model»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.cbd_tran_loi
    paths: [_acceptance/tro-ly-doc-kho/rang/quyet-do.ts, _acceptance/tro-ly-doc-kho/rang/quyet-do.spec.ts]
    expected: "exit 0; describe 'tran-loi'. Cùng lượt 96 câu với 5 câu loi (trần 4 + 1) → {ma: 2, dong: [«KHONG DO DUOC: 5 cau loi vuot tran 4 (<5 id theo thứ tự lượt>)»]} so nguyên văn, và keHoachHoiLai trả []. Ranh giới: 4 câu loi → ma khác 2 (cùng fixture). CHIỀU ĐỎ (cặp t2): đổi điều kiện vượt trần thành không bao giờ đúng → đỏ ghim «loi vuot tran van do»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.emtdl_vung_xam
    paths: [_acceptance/tro-ly-doc-kho/rang/quyet-do.ts, _acceptance/tro-ly-doc-kho/rang/quyet-do.spec.ts]
    expected: "exit 0; describe 'vung-xam'. Lượt một 20 câu co-trang: 15 dung-trang, 4 sai, 1 loi (trần 1) → dungTrang 15/19 xám → keHoachHoiLai trả đúng một mục dungTrang với tập id bằng tập 20 id viết tay. Lượt một 20 câu có 2 loi (vượt trần 1) → ma 2, kế hoạch rỗng, thông điệp ghim «hoi lai khi luot 1 loi vuot tran». ketHoiLai với lượt hỏi lại 20 câu có 2 loi → ma 2, dòng mở đầu «hoi lai: KHONG DO DUOC: 2 cau loi vuot tran 1». CHIỀU ĐỎ (cặp e của _acceptance/eval-model-that-dung-luc/rang/dot-bien.mjs, lời mới): bỏ điều kiện vượt trần → ca vượt trần đỏ ghim «hoi lai khi luot 1 loi vuot tran»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.cbd_du_ma
    paths: [_acceptance/tro-ly-doc-kho/rang/quyet-do.ts, _acceptance/tro-ly-doc-kho/rang/quyet-do.spec.ts, _acceptance/tro-ly-doc-kho/rang/cham-bo-do.ts]
    expected: "exit 0; describe 'du-ma'. Tệp chấm từng câu dựng bằng dongTungCau (hàm bên ghi thật) rồi đọc lại bằng docTungCau: đủ mã → kiemDuMa trả null; nhân đôi dòng luot 2 id m01 → «KHONG DO DUOC: trung ma 2:m01»; có danh sách mong {luot 1: [a, b, c]} mà tệp thiếu b → «KHONG DO DUOC: thieu ma 1:b»; chamTungCau trên tệp trùng mã → kl.ma 2 với đúng dòng ấy. Đường đo đầy đủ: chamLuotDu(tungCau, cauDaHoi, nguong) — hàm cham-bo-do.ts gọi ở lượt một và lượt hỏi lại, cauDaHoi là tham số BẮT BUỘC {mot: id[], hai: id[]} — trên tệp dựng bằng dongTungCau từ bộ thật mam-tam.json (cauLuotMot cho lượt một, mọi câu cho lượt hai) bỏ đi một id → kl.ma 2 «KHONG DO DUOC: thieu ma <luot>:<id>»; tệp đủ → kl.ma khác 2. Đối chứng dương cùng fixture: bỏ dòng trùng → kl.ma khác 2. CHIỀU ĐỎ: cặp t3 (kiemDuMa luôn null → đỏ ghim «trung ma khong bi bat»); cặp t5 (chamLuotDu bỏ qua cauDaHoi → đỏ ghim «thieu ma khong bi bat»)."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-6
    executor: script
    cmd: config:executors.script.cbd_cham_lai_mau
    paths: [_acceptance/tro-ly-doc-kho/rang/quyet-do.ts, _acceptance/tro-ly-doc-kho/rang/cham-bo-do.ts, _acceptance/tro-ly-doc-kho/rang/mau-luot-that/**, _acceptance/cham-bo-do-chiu-cau-loi/rang/cham-lai-mau.mjs]
    expected: "exit 0; rang/cham-lai-mau.mjs chép mau-luot-that vào thư mục tạm thành <tam>/luot-1 rồi chạy `bun _acceptance/tro-ly-doc-kho/rang/cham-bo-do.ts --cham-lai <tam>/luot-1` (không khoá, không kho đo). Ca 1 nguyên vẹn: mã khác 2, có dòng bắt đầu «cau loi model: 1/» chứa «(c33)», và đủ bốn dòng chỉ số. Ca 2: đổi ketCuc của đủ câu lượt một thành LOI để số câu loi = trần + 1 (trần tính bằng tranCauLoi import từ quyet-do.ts) → mã 2, dòng «KHONG DO DUOC: <n> cau loi vuot tran <t>». Ca 3: nhân đôi một dòng → mã 2, dòng chứa «trung ma». In mỗi ca một dòng «<ca> ma <mã> <dat|sai>»; một ca sai → exit 1. Thư mục tạm xoá khi xong. CHIỀU ĐỎ: cặp t4b của rang/dot-bien.mjs làm ca 1 đỏ (thiếu dòng câu lỗi)."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-7
    executor: script
    cmd: config:executors.script.cbd_f12_xanh
    paths: [_acceptance/tro-ly-doc-kho/rang/**, _acceptance/eval-model-that-dung-luc/rang/**, _acceptance/bo-cau-hoi-mau/rang/**, _acceptance/cham-bo-do-chiu-cau-loi/rang/f12-xanh.mjs]
    expected: "exit 0; rang/f12-xanh.mjs mang MA TRẬN VIẾT TRƯỚC 20 khoá của các hồ sơ đã ký dùng hàm của quyet-do.ts hay gọi cham-bo-do.ts mà không gọi model, mỗi khoá kèm mã nền đo trên onehub bfca8a74a trước vòng: bcm_khuon, bcm_thanh_phan, bcm_trang_mong, bcm_y_trong_yeu, bcm_rieng_tu, bcm_bang_do, bcm_ma_thoat, emtdl_nhan_loi, emtdl_nhat_ky, emtdl_bam, emtdl_dung_lai, emtdl_vung_xam, emtdl_gop, emtdl_do_model, emtdl_giu_nguong, zkd_so_do, mh2_so, mh2_pham_vi → 0; ssct_so_bo_mau → 1 và mtv_so → 2 (đỏ sẵn trên nền). Lệnh đọc từ _acceptance/config.yaml (không chép); khoá vắng → exit 2 «thieu khoa <khoá>». Chạy lần lượt ở gốc kho, in mỗi khoá «<khoá> ma <mã> nen <mã nền> <giu|doi>»; mã ở HEAD khác mã nền → exit 1. Thêm khoá thứ 21 emtdl_cham_lai: dựng một thư mục lượt tạm từ mau-luot-that (luot-1/cham-tung-cau.jsonl và cham-bo-do.md có mục Tổng bằng đúng các dòng --cham-lai in) rồi chạy cham-lai.mjs của F12 với E15_THU_MUC_LUOT trỏ vào đó → mã 0 (ca dưới trần, vượt trần, vùng xám theo lời mới). Số dòng in = 21 = số phần tử ma trận. In «ma tran: 21/21 giu ma nen». Đối chứng âm tự chạy trước: hàm chạy trên lệnh giả `exit 3` báo «ma 3»; không báo → exit 2. zalo-hoi-okr-khong-chet E1 (c33.mjs) gọi model thật, ngoài ma trận: nó chỉ đọc mã 2 của cham-bo-do là «không đo được», vòng này chỉ làm mã 2 hiếm hơn."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7j
    criterion: AC-7
    executor: judgment
    question: "Đọc hợp đồng, evals.yaml, sổ, rang/cham-lai.mjs và rang/dot-bien.mjs của eval-model-that-dung-luc: cham-lai.mjs và cặp đột biến e có đo đúng lời mới (dưới trần không phải mã 2, vượt trần là mã 2) không? AC-1, AC-6, AC-7, AC-12 có còn chỗ nào nói một câu loi (bất kể trần) là mã 2 không? Lời mới có nói rõ trần (5% số câu của lượt, tối thiểu 1) và điều xảy ra dưới trần không? expected của các eval đo bốn tiêu chí ấy có khớp lời mới không? Sổ có một dòng fix mang decided_by Phan Le Manh nói vì sao đổi không?"
    evidence_required: [judged_by, verdict, rationale]
    inputs:
      - "_acceptance/eval-model-that-dung-luc/contract.md"
      - "_acceptance/eval-model-that-dung-luc/evals.yaml"
      - "_acceptance/eval-model-that-dung-luc/decisions.jsonl"
      - "_acceptance/eval-model-that-dung-luc/rang/cham-lai.mjs"
      - "_acceptance/eval-model-that-dung-luc/rang/dot-bien.mjs"

  - id: E8
    criterion: AC-8
    executor: script
    cmd: config:executors.script.cbd_dot_bien
    paths: [_acceptance/tro-ly-doc-kho/rang/quyet-do.ts, _acceptance/tro-ly-doc-kho/rang/quyet-do.spec.ts, _acceptance/tro-ly-doc-kho/rang/cham-bo-do.ts, _acceptance/cham-bo-do-chiu-cau-loi/rang/**]
    expected: "exit 0; rang/dot-bien.mjs dựng bản sao cây (ban-sao.mjs của ca-chap-chon-cach-ly), với mỗi cặp viết trước chạy lệnh xanh trên bản lành, thay đúng một chuỗi trong bản sao, chạy lại, hoàn lại: t1 tranCauLoi trả 0 → E1 đỏ ghim «tran 96 cau phai la 4»; t2 điều kiện vượt trần không bao giờ đúng → E3 đỏ ghim «loi vuot tran van do»; t3 kiemDuMa luôn null → E5 đỏ ghim «trung ma khong bi bat»; t4 bỏ dòng câu lỗi → E2 đỏ ghim «thieu dong cau loi model»; t4b cùng chỗ phá → E6 đỏ ghim «nguyen-van ma 0 sai — thieu dong cau loi model»; t5 chamLuotDu bỏ qua cauDaHoi → E5 đỏ ghim «thieu ma khong bi bat»; t6 (cặp e của F12 theo lời mới) bỏ điều kiện vượt trần ở ketLuan → E4 đỏ ghim «hoi lai khi luot 1 loi vuot tran». Mỗi cặp một dòng «<tên> xanh=<mã> do=<mã> ghim=<ok|thieu>»; số cặp đã chạy bằng số khai (7); chuỗi thay không tìm thấy → exit 2 (thước lệch mã); cặp nào không đủ ba điều → exit 1."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
