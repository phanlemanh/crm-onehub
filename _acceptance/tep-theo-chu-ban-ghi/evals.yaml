slug: tep-theo-chu-ban-ghi
evals:
  - id: E1
    criterion: AC-1
    executor: test
    layer: backend-effect
    cmd: config:executors.test.tcb_luat
    expected: "exit 0; -t tcb-luat của apps/api/test/tep-theo-chu.spec.ts trên kho thử của lượt. Cô lập: mọi trường và bản ghi của ca mang tiền tố 'tcb_<ca>_'; đầu ca còn trường mang tiền tố ấy thì ném 'tcb <ca>: lan <n>'. Kho Blob giả trong bộ nhớ bơm như E1 của DA19 (overrideProvider của KHO_TEP). Fixture qua đường ghi thật: bốn người ở bảng member — Q (admin), A (member), B (member), O (okr); bảy bản ghi, mỗi bản ghi một trường FILE với một tệp gắn qua requestUpload → PUT kho giả → complete: thoả thuận dA (A phụ trách), dQ (Q phụ trách), dO (O phụ trách, đặt bằng deals.update), công ty cA (A), công ty c0 (không người phụ trách), cá nhân pA (A), cá nhân p0 (không). Ma trận viết trước 4 người × 7 bản ghi = 28 ô, đáp án viết tay theo bảng mục 1 của design doc: Q URL ở cả bảy; A URL ở dA, cA, pA, FORBIDDEN ở dQ, dO, c0, p0; B FORBIDDEN ở cả bảy; O KHONG_TRONG_PHAM_VI ở cả bảy. Với mỗi ô: kết quả downloadUrl khác đáp án thì ném 'tcb luat: <nguoi> <ban ghi> <ket qua>'; ô FORBIDDEN mà lời trả chứa chuỗi 'http' thì ném 'tcb luat: lo url <nguoi> <ban ghi>'. Với mỗi ô không phải O: đọc byId cùng người cùng bản ghi, coTheMo khác (kết quả là URL) thì ném 'tcb luat: co mo lech <nguoi> <ban ghi>'; lyDoKhongMo khác đáp án viết tay (khong-phu-trach ở dQ, dO với A và mọi bản ghi có người phụ trách với B; chua-co-phu-trach ở c0, p0 với A, B; null khi mở được) thì ném 'tcb luat: ly do <nguoi> <ban ghi> <gia tri>'; phần tử không parse được bằng schema TepTrongO thật thì ném 'tcb luat: khuon'. Số ô downloadUrl khác 28 hay số ô cờ khác 21 thì ném 'tcb luat: thieu o <n>'. Đối chứng dương cùng fixture: Q đọc byId dA thấy một tệp với coTheMo true; không thì ném 'tcb luat: doi chung'. Chiều đỏ: trên luật DA19 (chỉ quản trị) ô A × dA ném 'tcb luat: A dA FORBIDDEN'; đột biến tay lúc dựng (quyenMoTep bỏ vế so người phụ trách, cho mọi member mở) phải ném 'tcb luat: B dA URL', ghi vào sổ S3."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [packages/auth/src/**, packages/validation/src/tep-truong.ts, apps/api/src/fields/**, apps/api/src/deals/**, apps/api/src/companies/**, apps/api/src/contacts/**, apps/api/test/tep-theo-chu.spec.ts]

  - id: E1b
    criterion: AC-1
    executor: test
    layer: unit
    cmd: config:executors.test.tcb_ham
    expected: "exit 0; -t tcb-ham của packages/auth/test/quyen-tep.spec.ts. (a) Bảng chân lý viết trước của quyenMoTep (packages/auth/src/quyen-tep.ts): 5 vai (owner, admin, member, okr, null) × 3 quan hệ (phuTrachId bằng userId, khác userId, null) = 15 ô, đáp án viết tay theo bảng mục 1 design doc; ô lệch thì ném 'tcb ham: <vai> <quan he> <ket qua>'; số ô khác 15 thì ném 'tcb ham: thieu o <n>'. (b) Quét mã bằng TypeScript compiler API trên apps/api/src/fields/** và apps/app/components/crm/fields/**: mọi lời gọi isWorkspaceAdmin, laQuanTriWorkspace, hay so sánh với chuỗi 'owner'/'admin' trong tệp có chữ 'fieldFile' hay 'downloadUrl' mà không đi qua quyenMoTep thì ném 'tcb ham: luat thu hai <tep>:<dong>'; FieldFilesService.downloadUrl và bộ dựng cờ byId không có lời gọi quyenMoTep (hay coTheMoTep gọi nó) thì ném 'tcb ham: khong goi <noi>'. Đối chứng dương cùng fixture: bản sao trong bộ nhớ của field-files.service.ts chèn thêm một dòng 'if (isWorkspaceAdmin(vai)) return true' phải làm vế (b) ném 'tcb ham: luat thu hai'; không ném thì ném 'tcb ham: quet mu'. Chiều đỏ: trước hàng này tệp quyen-tep.ts không có, import ném 'tcb ham: thieu quyenMoTep'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [packages/auth/src/**, apps/api/src/fields/**, apps/app/components/crm/fields/**, packages/auth/test/quyen-tep.spec.ts]

  - id: E2
    criterion: AC-2
    executor: test
    layer: backend-effect
    cmd: config:executors.test.tcb_doi_chu
    expected: "exit 0; -t tcb-doi-chu của apps/api/test/tep-theo-chu.spec.ts. Cô lập như E1; người Q, A, B như E1. Fixture: mỗi đường một bản ghi riêng có trường FILE và một tệp, ban đầu A phụ trách. Ma trận viết trước 7 đường đổi A→B: deals.update, companies.update, contacts.update, REST PATCH /deals/{id} (gọi qua app.inject của Nest với khoá API của Q), deals.bulkAssignOwner, companies.bulkAssignOwner, contacts.bulkAssignOwner. Với mỗi đường, ngay sau lời đổi (không chờ, không xoá cache nào): downloadUrl của B không phải URL thì ném 'tcb doi chu: <duong> B khong mo'; của A không phải FORBIDDEN thì ném 'tcb doi chu: <duong> A con mo'; byId của A có coTheMo true, hay của B có coTheMo false, thì ném 'tcb doi chu: <duong> co'. Số đường khác 7 thì ném 'tcb doi chu: thieu duong <n>'. Gỡ về trống (companies.update và contacts.update với ownerId null): A, B không phải FORBIDDEN hay lyDoKhongMo khác chua-co-phu-trach thì ném 'tcb doi chu: go trong <loai> <nguoi>'; Q không mở được thì ném 'tcb doi chu: go trong Q'. Đặt lại cho A: A không mở được thì ném 'tcb doi chu: dat lai A'. Không lưu quyền: đếm count(*) của mọi bảng có trong Prisma.dmmf trước và sau mọi lần đổi; bảng nào ngoài deal, company, contact và bảng log của API có số khác thì ném 'tcb doi chu: ghi bang <bang>'. Đối chứng dương cùng fixture: trước lần đổi đầu, A mở được bản ghi của đường deals.update; không thì ném 'tcb doi chu: doi chung'. Chiều đỏ: đột biến tay lúc dựng (downloadUrl đọc người phụ trách từ một Map nạp một lần khi khởi động service) phải ném 'tcb doi chu: deals.update B khong mo', ghi vào sổ S3."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [packages/auth/src/**, apps/api/src/fields/**, apps/api/src/deals/**, apps/api/src/companies/**, apps/api/src/contacts/**, apps/api/src/crm/bulk.ts, apps/api/test/tep-theo-chu.spec.ts]

  - id: E3
    criterion: AC-3
    executor: test
    layer: backend-effect
    cmd: config:executors.test.tcb_pham_vi
    expected: "exit 0; -t tcb-pham-vi của apps/api/test/tep-theo-chu.spec.ts. Cô lập như E1. Fixture: công ty cA do A phụ trách; thoả thuận dQ của cA do Q phụ trách, có trường FILE với hai tệp; cá nhân p0 thuộc cA, không người phụ trách, có một tệp; người R (member) phụ trách thoả thuận dR có một tệp, rồi bị gỡ khỏi nhóm bằng workspace.removeMember thật. (a) A gọi deals.byId dQ: tepTheoTruong thiếu tệp, thiếu tên hay cỡ thì ném 'tcb pham vi: an ten'; deals.list và deals.board: soTepTheoTruong của dQ khác 2 thì ném 'tcb pham vi: dem <thu tuc>'. (b) A tải một PDF mới lên dQ qua requestUpload → PUT → complete: bị từ chối thì ném 'tcb pham vi: tai len bi chan'. (c) A gọi downloadUrl tệp của dQ và tệp của p0: không phải FORBIDDEN thì ném 'tcb pham vi: thua ke <ban ghi>'. A gọi downloadUrl đúng tepId của tệp A vừa tải ở (b): không phải FORBIDDEN thì ném 'tcb pham vi: nguoi tai mo <tepId>'; byId của A cho tệp ấy có coTheMo khác false hay lyDoKhongMo khác khong-phu-trach thì ném 'tcb pham vi: nguoi tai co <tepId>'. (d) Một khoá API của A tạo bằng Better Auth thật, gọi downloadUrl qua REST của tệp dQ và tệp của một thoả thuận A phụ trách: kết quả khác FORBIDDEN / URL thì ném 'tcb pham vi: khoa api <ban ghi>'. (e) R (đã rời, vẫn là ownerId của dR) gọi requestUpload, complete, downloadUrl, remove: không phải NOT_A_MEMBER thì ném 'tcb pham vi: nguoi roi <thu tuc>'; số thủ tục đã thử khác 4 thì ném 'tcb pham vi: thieu thu tuc <n>'. Đối chứng dương cùng fixture: Q mở được tệp của dQ và p0; không thì ném 'tcb pham vi: doi chung'. Chiều đỏ: hai đột biến tay lúc dựng, ghi vào sổ S3 — phuTrachId của thoả thuận lùi về ownerId của công ty phải ném 'tcb pham vi: thua ke dQ'; luật mở thêm vế taiBoiId bằng userId phải ném 'tcb pham vi: nguoi tai mo <tepId>'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [packages/auth/src/**, apps/api/src/fields/**, apps/api/src/deals/**, apps/api/src/contacts/**, apps/api/src/workspace/**, apps/api/test/tep-theo-chu.spec.ts]

  - id: E4
    criterion: AC-4
    executor: test
    layer: backend-effect
    cmd: config:executors.test.tcb_xoa
    expected: "exit 0; -t tcb-xoa của apps/api/test/tep-theo-chu.spec.ts. Cô lập như E1. Fixture: thoả thuận dA do A phụ trách, trường FILE với ba tệp fA, fB, fQ do A, B, Q tải lên. Lối Hỏi-2 đã duyệt đọc từ khoá hoi2_loi của _acceptance/tep-theo-chu-ban-ghi/evidence/ke-hoach.json (ghi ở S2 theo dòng sổ gate1 của Hỏi-2; giá trị 'khuyen' | 'a' | 'b'); khoá vắng hay giá trị khác ba giá trị ấy thì ném 'tcb xoa: thieu loi hoi2'. Test giữ ba ma trận viết trước, mỗi ma trận 3 người × 3 tệp = 9 ô coTheXoa trước khi đổi và 9 ô sau khi đổi người phụ trách sang B; đáp án viết tay: 'khuyen' (quản trị, người phụ trách, người tải) — trước: Q ba true, A ba true, B chỉ fB; sau: Q ba true, A chỉ fA, B ba true. 'a' (quản trị, người tải — luật DA19) — trước và sau như nhau: Q ba true, A chỉ fA, B chỉ fB. 'b' (quản trị, người phụ trách) — trước: Q ba, A ba, B không tệp nào; sau: Q ba, A không tệp nào, B ba. Chạy ma trận của lối đã duyệt: ô lệch thì ném 'tcb xoa: co <loi> <truoc|sau> <nguoi> <tep> <gia tri>'; số ô khác 18 thì ném 'tcb xoa: thieu o <n>'. Rồi gọi remove cho bốn cặp B→fA, B→fB, A→fQ, Q→fA, đáp án lấy từ ô 'trước' của cùng ma trận: kết quả khác thì ném 'tcb xoa: remove <loi> <nguoi> <tep> <ket qua>'; tệp bị từ chối mà hàng fieldFile mất thì ném 'tcb xoa: mat hang <tep>'; tệp xoá được mà blobChoXoa không có pathname của nó hay thiếu dòng log 'Field file removed' thì ném 'tcb xoa: duong xoa <tep>'. Đối chứng hai lối cùng fixture: chạy thêm ma trận của một lối KHÁC lối đã duyệt trên cùng dữ liệu — nó phải lệch ít nhất một ô; không lệch thì ném 'tcb xoa: ma tran mu'. Đối chứng dương: Q đọc byId thấy đủ ba tệp trước lượt xoá; không thì ném 'tcb xoa: doi chung'. Chiều đỏ: với lối 'khuyen' hay 'b', luật DA19 cho ô trước × A × fQ là false nên ném 'tcb xoa: co <loi> truoc A fQ false'; với lối 'a', đột biến tay lúc dựng (coTheXoaTep thêm vế người phụ trách) phải ném 'tcb xoa: co a sau A fQ true'; ghi vào sổ S3."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [packages/auth/src/**, apps/api/src/fields/**, apps/api/test/tep-theo-chu.spec.ts]

  - id: E5
    criterion: AC-5
    executor: test
    layer: unit
    cmd: config:executors.test.tcb_o_tep
    expected: "exit 0; -t tcb-o-tep của apps/app/test/tep-theo-chu.dom.tsx. Dựng ô Tệp thật của DA19 (OTruongPhieu trong apps/app/components/crm/fields/kieu-truong.tsx) trong LocaleProvider vi với kho tRPC giả; tepTheoTruong rút qua schema TepTrongO thật (round-trip parse), người phụ trách rút qua bộ đọc đầu ra thật của deals.byId, companies.byId, contacts.byId. Ma trận viết trước 3 loại bản ghi × 3 giá trị lyDoKhongMo (khong-phu-trach, chua-co-phu-trach, null) × 2 ngôn ngữ (vi, en) = 18 ô (ô chua-co-phu-trach của thoả thuận dựng bằng dữ liệu rút qua schema thật như mọi ô, dù thoả thuận luôn có người phụ trách trên kho thật), đáp án viết tay: nút «Mở» bật hay khoá; dòng lý do đúng chữ của bảng chữ thật apps/app/lib/messages/crm.ts với tên người phụ trách 'Ngô Thị Lan' chèn vào; tên trong dòng mang translate=\"no\"; nút khoá có aria-describedby bằng id của dòng lý do. Ô lệch thì ném 'tcb o tep: <loai> <ly do> <ngon ngu> <ve>'; số ô khác 18 thì ném 'tcb o tep: thieu o <n>'. Mất quyền, mỗi loại bản ghi một ca (3 ca): ô với lyDoKhongMo null, kho tRPC giả trả TRPCError FORBIDDEN cho downloadUrl; bấm «Mở»: không có toast với chữ mất quyền của bảng chữ thật thì ném 'tcb o tep: mat quyen khong bao <loai>'; không có lời gọi invalidate của đúng byId của loại ấy (đếm trên queryClient giả), hay có invalidate byId của loại khác thay vào, thì ném 'tcb o tep: khong tai lai <loai>'; window.open được gọi thì ném 'tcb o tep: mo tab <loai>'; số ca khác 3 thì ném 'tcb o tep: thieu ca <n>'. Quét mã bằng TypeScript compiler API trên tệp ô Tệp và kieu-truong.tsx: có so sánh owner.id / ownerId với id người dùng, hay đọc role, thì ném 'tcb o tep: tu tinh quyen <tep>:<dong>'. Đối chứng dương cùng fixture: ô lyDoKhongMo null có «Mở» bật và không dòng lý do; khác thì ném 'tcb o tep: doi chung'. Chiều đỏ: chữ DA19 «Chỉ quản trị mở được tệp.» cho ô khong-phu-trach thì ném 'tcb o tep: khong-phu-trach vi dong'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [apps/app/components/crm/fields/**, apps/app/components/crm/record-sheet/**, apps/app/lib/messages/crm.ts, packages/validation/src/tep-truong.ts, apps/app/test/tep-theo-chu.dom.tsx]

  - id: E6
    criterion: AC-6
    executor: test
    layer: backend-effect
    cmd: config:executors.test.tcb_vet
    expected: "exit 0; -t tcb-vet của apps/api/test/tep-theo-chu.spec.ts. Cùng fixture và cùng 28 ô downloadUrl của E1 (dựng lại trong ca), với bộ bắt log thay ContextLogger (khuôn bắt log của apps/api/test có sẵn). Với mỗi ô mở được: không đúng một dòng message 'Field file opened' mang tepId, fieldId, id bản ghi, userId, role, laPhuTrach (kiểu boolean, khớp quan hệ của ô) thì ném 'tcb vet: mo <nguoi> <ban ghi> <khoa>'. Với mỗi ô FORBIDDEN (không tính ô O bị chặn ở middleware): không đúng một dòng 'Field file open refused' mang cùng các khoá và lyDo bằng lyDoKhongMo của ô thì ném 'tcb vet: tu choi <nguoi> <ban ghi> <khoa>'. Dòng nào (của mọi message trong ca) chứa chuỗi URL kho giả hay tham số chữ ký thì ném 'tcb vet: lo url'. Đếm dấu CHẾT bằng đúng câu lọc ghi ở Đường đo (laPhuTrach false và role không phải owner, admin) trên log của ca: khác 0 thì ném 'tcb vet: chet <n>'. Đối chứng dương cùng fixture: bơm thêm một dòng giả 'Field file opened' với laPhuTrach false, role member — câu lọc phải đếm 1; không thì ném 'tcb vet: thuoc chet mu'. Số ô khác 28 thì ném 'tcb vet: thieu o <n>'. Thước CHẾT phải bắt lỗi luật thật: trong cùng ca, dựng lại 28 ô dưới đột biến bơm vào provider (quyenMoTep cho mọi member mở, thay qua overrideProvider của lớp luật — đường ghi log giữ nguyên); câu lọc của Đường đo trên log phần ấy phải đếm đúng 11, con số viết tay trong test trước khi chạy (B mở cả bảy bản ghi, A mở dQ, dO, c0, p0; O vẫn bị middleware chặn) — khác con số đã viết thì ném 'tcb vet: chet mu <n>'. Tính laPhuTrach: quét mã (TypeScript compiler API) dòng ghi log trong FieldFilesService.downloadUrl — laPhuTrach không phải phép so ownerId của hàng bản ghi với userId (ví dụ suy từ coTheMo hay từ vai) thì ném 'tcb vet: la phu trach suy tu luat'. Chiều đỏ: trước hàng này downloadUrl không ghi dòng nào, ném 'tcb vet: mo Q dA message'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [apps/api/src/fields/**, apps/api/test/tep-theo-chu.spec.ts]

