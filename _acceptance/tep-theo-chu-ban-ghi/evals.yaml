    expected: |
      Dữ liệu dựng qua API thật trong phiên đo: trường DEAL kiểu Tệp «Hợp đồng»; thoả thuận T1 do A phụ trách với hai PDF; công ty C0 không người phụ trách có trường Tệp với một PDF. Đăng nhập bằng dev:session ba người: quản trị Q, nhân viên A, nhân viên B, mỗi người một ngữ cảnh trình duyệt.
      0. tcb-phu-trach-1280 (ST-otep-phu-trach): phiên A mở phiếu T1: «Mở» bật trên hai dòng, không dòng lý do. Bấm «Mở»: không có tab mới với URL của máy chủ giả thì thoát 1 'tcb man: A khong mo'.
      1. tcb-khong-phu-trach-375 (ST-otep-khong-phu-trach): phiên B ở 375: «Mở» khoá, dòng «Chỉ <tên A> và quản trị mở được tệp.». document.documentElement.scrollWidth > 375 thì thoát 1 'tcb man: 375 cuon ngang'.
      2. tcb-doi-chu-1280: phiên Q đổi ô «Phụ trách» của T1 từ A sang B trên phiếu (InlineSelectField thật); db.deal.ownerId của T1 khác id B thì thoát 1 'tcb man: doi chu khong luu'.
      3. tcb-mat-quyen-1280 (ST-otep-mat-quyen): phiên A, phiếu mở từ bước 0 không tải lại, bấm «Mở»: không có lời báo «Bạn không còn phụ trách bản ghi này nên không mở được tệp.» hay có tab mới thì thoát 1 'tcb man: mat quyen'; sau lời báo «Mở» phải khoá kèm dòng lý do nêu tên B.
      4. tcb-nguoi-moi-1280 (ST-otep-phu-trach): phiên B tải lại phiếu T1: «Mở» bật; bấm mở ra tab mới; không thì thoát 1 'tcb man: B khong mo'.
      4b. tcb-ca-nhan-1280 (ST-otep-khong-phu-trach, phiếu Cá nhân): cá nhân P1 do A phụ trách có trường Tệp với một PDF; phiên B mở phiếu P1: «Mở» khoá, dòng nêu tên A; phiên A mở được ở tab mới, không thì thoát 1 'tcb man: ca nhan A khong mo'.
      5. tcb-chua-phu-trach-375 (ST-otep-chua-phu-trach): phiên A mở phiếu C0 ở 375: «Mở» khoá, dòng «Bản ghi chưa có người phụ trách nên chỉ quản trị mở được tệp.».
      Thêm: phiên Q mở T1 và C0: «Mở» bật ở cả hai (kiểm DOM, không chụp riêng; sai thì thoát 1 'tcb man: quan tri bi khoa'). Trình đọc màn: nút «Mở» khoá có aria-describedby trỏ dòng lý do (kiểm DOM; sai thì thoát 1 'tcb man: aria').
      Đối chứng bằng mắt: dòng lý do nằm ngay dưới danh sách tệp, cỡ chữ phụ như mô tả ô; tên người phụ trách không bị trình duyệt dịch; ở 375 dòng lý do xuống dòng gọn, không đè nút.
