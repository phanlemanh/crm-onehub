schema_version: 1
slug: quyen-luot-mang-theo

evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.ql_hai_duong_that
    paths:
      - "apps/agent/agent/lib/builder-input.ts"
      - "packages/validation/src/builder-question.ts"
      - "apps/agent/test/builder-runtime.integration.spec.ts"
    expected: |
      Luot HOI duoc phep -> ban ghi mang quyen "duoc phep"; luot HOI khong duoc phep
      -> ban ghi mang quyen nguoc lai.
      CAP HAI CHIEU tren CUNG mot fixture ctx, khac dung MOT truong (commandType).
      Doi mot truong ma ban ghi khong lat -> ma 1: khi ay cho ghi khong doc ctx.
      San dan so: khong dung duoc ctx cua hook -> ma 2.
      CAM tu bia ban ghi roi assert tren no, VA cam tu tay dua co quyen vao phep do:
      bai do PHAI goi recordBuilderInputRequest — ham nhan ctx cua luot hoi va tu SUY
      ra co quyen bang builderTurnAuthorized — roi DOC LAI hang trong co so du lieu.
      Fixture ctx dung builderSessionAttributes, cap hai chieu khac dung mot truong
      commandType. Fixture dung tay dung khuon ben doc -> ma 2.
      Vi sao sieu chat hon vong truoc: vong 4 truyen co quyen tay vao
      persistBuilderInputRequest, nen doi duong sinh that thanh hang true van cho
      30/30 xanh. Sau khi tach, chinh dot bien ay lam phep do do.
      SAN: channels/crm.ts chi con noi day mot dong; moi phan suy quyen nam trong ham
      do duoc. Neu suy quyen quay lai nam trong than hook -> ma 2.

  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.ql_quyen_ke_thua
    paths:
      - "packages/validation/src/builder-question.ts"
      - "apps/api/src/conversations/conversations.service.ts"
      - "apps/agent/agent/lib/builder-input.ts"
      - "apps/agent/test/quyen-luot.spec.ts"
    expected: |
      HAI BIEN, HAI HANH VI KHAC NHAU — cham dung thu SAN PHAM CHAY, khong cham
      ham chet:
      (a) bien GHI (buildPendingInputRequest, duong ghi that goi): cau hoi sai khuon
      -> NEM loi co thong diep ghim. Loi parse o luc ghi la loi that.
      (b) bien DOC (commandTypeFromAuthorization, service that goi): ban ghi sai
      khuon -> FAIL-CLOSED tra "CHAT", KHONG nem. Do la thiet ke, va AC-4 la cho
      do no.
      San dan so: mot trong hai ham khong co nguoi goi nao trong ma chay that thi
      phep do dang cham code chet -> ma 2, IN ten ham.
      Chieu do: doi schema cho no chap nhan moi thu (passthrough) -> (a) phai het
      nem, phep do ma 1.
      Kieu tra ve cua ham dung PHAI suy bang z.infer tu chinh schema, khong go tay
      canh no — doi schema ma kieu khong doi la drift ma AGENTS.md cam.
      Ve "khong ben nao nhan Record<string, unknown>" KHONG do o day: no do
      `bun run lint:slop` giu (luat anti-slop no-known-value-widening, mot trong nam
      lenh cong, da bat dung loi ay cua vong nay mot lan). Khong dung phep do rieng
      doc cheo ma nguon cua app khac.

  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.ql_hai_duong_that
    paths:
      - "apps/api/src/conversations/conversations.service.ts"
      - "packages/validation/src/builder-question.ts"
      - "apps/api/test/conversations.spec.ts"
    expected: |
      Chay SERVICE THAT: answerBuilderQuestion cua conversations.service, tren mot
      hoi thoai co hang pendingInputRequest dung bang HAM DUNG CHUNG
      buildPendingInputRequest (ham ma duong ghi cua apps/agent cung goi).
      CAP HAI CHIEU tren cung fixture, khac dung MOT truong:
        ban ghi "duoc phep"       -> submission.commandType = CREATE_AGENT;
        ban ghi "khong duoc phep" -> submission.commandType = CHAT.
      Assert tren HANG submission that trong co so du lieu, khong assert tren gia tri
      tra ve trung gian.
      Doi mot truong ma ket qua khong lat -> ma 1: khi ay service khong doc ban ghi.
      San khuon: hang dung bang object literal viet tay thay vi ham dung chung -> ma 2.
      Rang buoc da dat ten (xem AC-3 trong contract): apps/agent va apps/api la hai
      deployment rieng, khong import duoc nhau, nen KHONG co bai test mot-tien-trinh
      di tu duong ghi sang duong doc. Ham dung chung la moi noi that su co.

  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.ql_api_doc_ban_ghi
    paths:
      - "apps/api/src/conversations/conversations.service.ts"
      - "apps/api/test/quyen-luot.spec.ts"
    expected: |
      BA hinh dang nguon quyen khong dung duoc, cung mot lop loi, kiem CA BA:
        (i) khong co pendingInputRequest;
        (ii) co nhung THIEU truong quyen;
        (iii) co nhung SAI KHUON.
      Ca ba deu phai cho CHAT (fail-closed). So assert bang 3; chi kiem mot hinh
      dang -> chua du.
      Chieu do (doi chung duong): ban ghi "duoc phep" hop le tren cung fixture ->
      phai cho CREATE_AGENT. Thieu chieu nay thi "luon CHAT" khong phan biet duoc
      voi "doc dung".

  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.ql_khong_suy_dien
    paths:
      - "apps/agent/agent/lib/custom-agent-dispatch.ts"
      - "apps/agent/test/quyen-luot.spec.ts"
    expected: |
      Goi HAM THAT builderCommandType(commandType, message) voi message mang
      inputResponse DAY DU (requestId + text, va bien the requestId + optionId):
        commandType "CHAT"          -> ket qua VAN la "CHAT";
        commandType "CREATE_AGENT"  -> ket qua "CREATE_AGENT" (khong lam mat duong cu).
      CAM ghi de thang truong commandType trong fixture roi assert — chinh loi tat
      ay lam lo nay song sot qua ba vong cham cua vong truoc: sau phep do xanh
      trong khi cong van mo.
      San dan so: dem tren dia so cho suy quyen tu hinh dang tin nhan phai bang 0;
      khac 0 -> ma 2, IN file:dong. Tai SHA ghim so nay bang 1.
      Chieu do: cay lai ve suy dien trong ban sao -> ma 1.

  - id: E7
    criterion: AC-7
    executor: test
    cmd: config:executors.test.ql_con_biet_cua_ra
    paths:
      - "apps/agent/agent/subagents/agent_builder/instructions.md"
      - "apps/agent/test/quyen-luot.spec.ts"
    expected: |
      instructions.md cua agent_builder phai khai cua ra khi bi tu choi: goi
      final_output voi status not_authorized, va KHONG co lua chon nao khac.
      Do CA HAI ve, khong chi dem chuoi:
        (a) van ban co nhac not_authorized (san dan so: 0 lan -> ma 1; tai SHA ghim
            so nay bang 0);
        (b) gia tri status ay PARSE DUOC bang outputSchema cua agent_builder — tuc
            chi dan va schema noi cung mot thu, khong lech ten.
      Chieu do: doi ten trang thai trong chi dan (vd "unauthorized") -> (b) phai
      hong, phep do ma 1.

  - id: E8
    criterion: AC-8
    executor: judgment
    cmd: judgment
    question: >-
      Hang BUILDER_DENIED_REASON — chuoi ma eve giao cho CON khi policy tu choi —
      co dang bao CON lam viec con lam duoc khong: tra not_authorized ngay? Hay no
      dang bao con "noi voi nguoi dung" va "tra loi cau ho hoi", hai viec ma con
      khong the lam vi no chay task mode, khong co kenh nguoi dung va phan lon tool
      da tat?
    inputs:
      - ../../apps/agent/agent/subagents/agent_builder/lib/authorization.ts
      - ../../apps/agent/agent/subagents/agent_builder/instructions.md
      - ../../apps/agent/agent/instructions/task.ts
    expected: >-
      Hang ly do noi voi CON, bang viec con lam duoc. Doc ba file cung luc phai thay
      su phan vai ro: con nhan lenh tra not_authorized; cha moi la ben noi voi nguoi
      dung va tra loi tiep cau hoi goc. Neu hang ly do van mang cau "Tell the user"
      hoac "answer what they actually asked" thi FAIL, trich nguyen van cau do.
      GIOI HAN DA BIET, khai o day de khong ai tuong da do: phep do nay cham HANG VA
      CHI DAN, KHONG cham van ban runtime ma cha that su soan — xem muc Out of scope
      cua contract.
    paths:
      - "apps/agent/agent/subagents/agent_builder/lib/authorization.ts"
      - "apps/agent/agent/subagents/agent_builder/instructions.md"
      - "apps/agent/agent/instructions/task.ts"

  - id: E9
    criterion: AC-9
    executor: test
    layer: backend-effect
    cmd: config:executors.test.ql_cong_dong_that
    paths:
      - "packages/validation/src/builder-question.ts"
      - "apps/agent/agent/lib/custom-agent-dispatch.ts"
      - "apps/agent/agent/lib/session-purpose.ts"
      - "apps/agent/agent/subagents/agent_builder/lib/authorization.ts"
      - "apps/agent/test/quyen-luot.spec.ts"
    expected: |
      Chay HET CHUOI bang cac ham THAT, khong dung tay khuc nao:
        ban ghi quyen -> ham suy commandType (dung chung o packages/validation)
        -> builderSessionAttributes -> builderTurnApproval.
      CAP HAI CHIEU tren cung fixture, khac dung MOT truong:
        ban ghi "khong duoc phep" -> policy tra TU CHOI kem hang ly do ghim (so
          nguyen van chuoi literal viet trong bai do, KHONG so voi chinh hang da
          import — so hang voi chinh no la hang-dung);
        ban ghi "duoc phep"       -> policy tra cho di tiep.
      San dan so: chuoi thieu mot mat (mot khuc dung tay thay vi goi ham that) ->
      ma 2, NEU mat nao.
      Vi sao co phep do nay: tam eval tren deu dung o commandType — mot GIA TRI
      TRUNG GIAN. Neu runtime lay quyen tu nguon khac trong ctx, hoac
      builderTurnAuthorized doc truong khac ten, thi ca tam van xanh trong khi cong
      van mo. Do dung hinh dang da xay ra o vong truoc.
