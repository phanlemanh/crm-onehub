  - id: E9
    criterion: AC-2
    executor: test
    cmd: config:executors.test.tl45_store_eve_that
    expected: "exit 0; bài dựng EveAgentStore thật của eve (gói eve/client, không giả) với một máy chủ eve giả có sổ sự kiện theo phiên (GET stream đọc từ startIndex và đợi sự kiện mới, POST gửi tiếp kiểm continuationToken): (a) send → luồng phát session.started, message.received, turn.started rồi im; bài ghi turn.cancelled rồi session.waiting (token 'eve:moi') vào sổ mà KHÔNG gọi stop → onFinish chưa chạy trước khi session.waiting được ghi, chạy đúng 1 lần sau đó với trạng thái 'ready'; send trong onFinish không ném, POST mang continuationToken 'eve:moi', và store đọc được câu trả lời 'tra loi luot moi' của lượt mới; (b) đối chứng dương cùng fixture, cách của bản 1: stop() rồi ghi mốc khép rồi gửi lại → luồng của lần gửi lại dừng ở session.waiting của lượt cũ và store KHÔNG có 'tra loi luot moi'; (c) gửi lần hai ngay khi phiên còn bận ném 'eve session is already processing a turn.'. Chiều đỏ ghim: không ghi mốc khép → 'onfinish-khong-goi' mã 1 (bài chờ có trần); bỏ đổi token ở session.waiting → 'token-cu' mã 1."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [apps/app/test/soan-okr-store-eve-huy.spec.ts]
