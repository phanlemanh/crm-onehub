slug: thu-lai-sau-45-giay
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.tl45_huy_truoc_gui
    expected: "exit 0; bài DOM dùng khung-soan-okr (không sửa khung): phiên giả streaming có continuationToken, sự kiện gồm một turn.started cũ 'luot-0', rồi message.received, rồi turn.started 'luot-1', tin cuối đã gửi qua lượt mở đầu, đồng hồ giả trôi quá SOAN_UI.hanKhongSuKienMs để chỗ báo lỗi hiện câu loiMoTa; globalThis.fetch giả ghi lại yêu cầu; bấm [data-nut='thu-lai'] → đúng 1 POST tới đường kết thúc bằng /eve/v1/session/<phiên>/cancel, header OKR_SOAN_CUA.header = mã cuộc, thân JSON đúng { turnId: 'luot-1' }; số lần dừng (daDung) KHÔNG đổi; daGui KHÔNG thêm tin nào trước khi onFinish được gọi. Đối chứng dương cùng fixture: phiên không bận (status error do lỗi HTTP) → bấm gửi lại ngay, không POST cancel. Chiều đỏ ghim: bản sao gọi agent.stop() trong nhánh bận → 'goi-stop' mã 1; bản sao gửi lại ngay khi bấm → 'gui-lai-truoc-khi-khep' mã 1; bản sao bỏ turnId khỏi thân → 'thieu-turn-id' mã 1; bản sao lấy turn.started bất kỳ cuối mảng mà luot-1 vắng (chỉ có luot-0 trước message.received) → thân phải rỗng, bản sao gửi luot-0 → 'turn-id-cu' mã 1."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: ["apps/app/app/(app)/[slug]/okr/soan/**", apps/app/test/soan-okr-thu-lai-45s.dom.tsx]

  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.tl45_gui_lai_sau_khep
    expected: "exit 0; cùng tệp, fetch giả trả 202 { ok: true, sessionId: <phiên>, status: 'accepted' } cho /cancel (giữ được promise); bốn ca thứ tự viết trước: (a) onFinish trước, hồi âm huỷ sau; (b) hồi âm huỷ trước, onFinish sau; (c) onFinish tới, hồi âm huỷ còn treo nửa trần rồi mới tới; (d) cả hai trong cùng một act — sau điều thứ nhất daGui không đổi, sau điều thứ hai daGui thêm đúng 1 tin bằng tin cuối; gọi onFinish lần nữa → daGui không đổi; onFinish được gọi với sự kiện từ lúc bấm gồm turn.cancelled 'luot-1' rồi session.waiting; thêm ca hồi âm 'no_active_turn' cũng là thành công (gửi lại 1 lần); ca khép thường (onFinish với session.waiting mà không turn.cancelled) → không gửi lại, [data-luot='loi'] tắt; ca khép lỗi (onFinish không mốc khép, status error) → không gửi lại, chỗ báo lỗi chứa chuaGuiLai. Chiều đỏ ghim: bản sao không chờ hồi âm huỷ → 'gui-lai-truoc-khi-huy <ca>' mã 1; bản sao không chờ onFinish → 'gui-lai-truoc-khi-khep <ca>' mã 1; bản sao bỏ gửi lại → 'khong-gui-lai <ca>' mã 1; bản sao gửi mỗi lần onFinish → 'gui-lai-hai-lan' mã 1; bản sao chỉ nhận 'accepted' → 'khong-gui-lai no-active-turn' mã 1; bản sao coi mọi onFinish là khép-vì-huỷ → 'gui-lai-khi-khep-thuong' mã 1."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: ["apps/app/app/(app)/[slug]/okr/soan/**", apps/app/test/soan-okr-thu-lai-45s.dom.tsx]

  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.tl45_dang_cho_khep
    expected: "exit 0; cùng tệp: sau bấm, trước khi đủ hai điều của AC-2 — [data-luot='loi'] còn, nút disabled, vùng aria-live chứa daThuLai('1') và câu loiMoTa, daDung = 0; đồng hồ giả trôi quá SOAN_UI.choKhepMs mà không gọi onFinish → [data-luot='loi'] chứa câu hoiThoai.chuaGuiLai, nút mở, daDung = 1 (lối thoát), daGui không đổi; phiên giả về ready, bấm tiếp → gửi thẳng (daGui +1), không POST cancel thứ hai. Chiều đỏ ghim: bản sao bỏ dangChoKhep khỏi dangThu → 'bao-loi-mat-khi-cho' mã 1; bản sao không có trần → 'khoa-mai' mã 1; bản sao quá trần không stop → 'khong-loi-thoat' mã 1."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: ["apps/app/app/(app)/[slug]/okr/soan/**", apps/app/test/soan-okr-thu-lai-45s.dom.tsx]

  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.tl45_gui_lai_bi_tu_choi
    expected: "exit 0; cùng tệp: (1) cờ của bài làm send giả ném Error('eve session is already processing a turn.') đúng lúc gửi lại; sau đủ hai điều của AC-2 → [data-luot='loi'] chứa câu hoiThoai.chuaGuiLai và daThuLai('1'), nút mở; hai nhánh bấm tiếp viết trước: phiên giả streaming → POST cancel thứ hai và daGui chưa đổi; phiên giả ready → gửi thẳng (daGui +1), KHÔNG POST cancel, và không còn câu chuaGuiLai; (2) yêu cầu huỷ hỏng — bốn ca: status 500, thân 202 không khớp khuôn ({ ok: true, status: 'la' }), thân 202 mang sessionId của phiên khác, fetch ném TypeError — → chỗ báo lỗi chứa chuaGuiLai, nút mở, và gọi onFinish sau đó KHÔNG làm daGui đổi; (3) lượt mở đầu bị eve từ chối lúc mở màn → không có [data-luot='loi']. Chiều đỏ ghim: bản sao nuốt lỗi gửi lại như cũ → 'gui-lai-im' mã 1; bản sao luôn huỷ khi loiGuiLai → 'huy-thua-khi-ranh' mã 1; bản sao coi mọi hồi âm huỷ là thành công → 'gui-bua-khi-huy-hong <ca>' mã 1; bản sao bật cờ cho mọi lần gửi → 'bao-chua-gui-lai-oan' mã 1."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: ["apps/app/app/(app)/[slug]/okr/soan/**", apps/app/lib/messages/okr-soan.ts, apps/app/test/soan-okr-thu-lai-45s.dom.tsx]

  - id: E5
    criterion: AC-5
    executor: test
    layer: backend-effect
    cmd: config:executors.test.tl45_huy_cua
    expected: "exit 0; bài gọi handler POST thật của cửa (khung-cua-hoan của R1h, không sửa) trên kho kiểm riêng: cuộc dang có phiên eve, n ∈ {0, 5}; bọc fetch ghi lại đường, phương thức và thân mọi yêu cầu cửa gửi Trợ lý, và tự trả cho đường /cancel một Response do bài dựng; ba cặp viết trước (202 { ok: true, sessionId: <phiên>, status: 'accepted' }), (202 { ok: true, sessionId: <phiên>, status: 'no_active_turn' }), (500 { ok: false, error: 'Failed to cancel the turn.' }); POST session/<phiên>/cancel thân { turnId: 'luot-7' } → Trợ lý nhận đúng 1 lời gọi, đường kết thúc /eve/v1/session/<phiên>/cancel, thân JSON toEqual { turnId: 'luot-7' }; cửa trả status bằng status Trợ lý trả và thân toEqual thân Trợ lý trả cho chính lời gọi đó; soLuot đọc lại = n. Đối chứng dương cùng fixture: POST session/<phiên> (gửi tiếp) 202 → soLuot = n + 1. Chiều đỏ ghim: bản sao thêm huyLuot vào CUA_OKR.dangLuot → 'huy-tinh-luot n=<n>' mã 1; bản sao cửa thay thân hồi âm bằng { ok: true } → 'than-khong-bang-tro-ly <ca>' mã 1; bản sao cửa ép status 200 → 'status-khong-bang-tro-ly <ca>' mã 1."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: ["apps/app/app/eve/agents/okr/**", apps/app/lib/cua-okr-config.ts, apps/app/test/soan-okr-huy-luot.spec.ts]

  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.tl45_giu_r1h
    expected: "exit 0; rang/giu-r1h.mjs: soan-okr-thu-lai.dom.tsx (R1h) giống hệt bản ở merge-base (khác → 'tep da ky bi sua: <tep>' mã 1); soan-okr-hong.dom.tsx (soan-okr-cung-tro-ly) sau khi bỏ đúng khối describe('hong — Thu lai roi van im') ở cả hai phía thì giống hệt bản ở merge-base (khác → 'sua ngoai khoi duoc phep: <tep>' mã 1; mất khối → 'mat khoi duoc phep sua' mã 1); khối đó chứa nguyên văn từng khẳng định bắt buộc (thiếu → 'khoi thieu khang dinh: <dòng>' mã 1): daDung bằng 0, đúng 1 POST tới đường /cancel, daGui chỉ 1 tin trước onFinish, đúng 2 tin bằng nhau sau onFinish có turn.cancelled rồi session.waiting, goiCua('okr.soanMo') rỗng (lời hứa AC-12c), không còn báo lỗi, hẹn giờ 45 s đặt lại; fetch giả đặt và trả lại trong chính khối; rồi chạy nguyên hai tệp, cả hai xanh. Chiều đỏ ghim (đã chạy ở S3): đổi một dòng ngoài khối → 'sua ngoai khoi duoc phep'; thêm một dòng vào tệp R1h → 'tep da ky bi sua'; xoá khẳng định soanMo khỏi khối → 'khoi thieu khang dinh' mã 1."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: ["apps/app/app/(app)/[slug]/okr/soan/**", apps/app/test/soan-okr-thu-lai.dom.tsx, apps/app/test/soan-okr-hong.dom.tsx, _acceptance/thu-lai-sau-45-giay/rang/giu-r1h.mjs]

  - id: E7
    criterion: AC-7
    executor: ui-check
    layer: ui-observed
    cmd: config:executors.script.tl45_man_that
    steps:
      - "Phiên đo riêng (mot-luot.sh), OKR_AGENT_BRIDGE_SECRET giả, OKR_AGENT_URL=http://127.0.0.1:3351; script dựng Trợ lý giả trên 3351 TRƯỚC màn đầu, có sổ sự kiện theo phiên: POST session → 202 có mã phiên và token (mã như eve thật: mở phiên 202, gửi tiếp 200, huỷ 202); GET stream → đọc từ startIndex, phát session.started, message.received (lặp tin đã nhận), turn.started (turnId) rồi giữ kết nối im; POST cancel → ghi turnId nhận được, trả 202 accepted ngay, 3 s sau ghi turn.cancelled rồi session.waiting (token mới) lên sổ (mốc đỗ); POST session/<phiên> trước mốc đỗ hay mang token cũ → 409, hợp lệ → 200 và phát một lượt mới có message.completed 'Câu trả lời của lượt mới (Trợ lý giả)' rồi session.waiting; ghi nhật ký từng yêu cầu kèm mốc giờ, kể cả lúc trình duyệt đóng một luồng"
      - "Đối chứng dương trước màn đầu: mở một luồng qua cửa (fetch có mã cuộc của cuộc gieo), đóng nó sau 1 s → Trợ lý giả phải ghi được lúc đóng (không ghi được → KHONG DO mã 2: phép đo 'luồng cũ không bị cắt' vô nghĩa ở máy này)"
      - "Cảnh cây trước màn đầu; seed: chu kỳ pha lap-ke-hoach, một phòng ban bật soạn, một cuộc dang soLuot 0; đăng nhập trưởng phòng ban"
      - "1440 px: mở ?cuocSoan=<id> (màn tự gửi lượt mở đầu) → chờ câu loiMoTa trong [data-luot='loi'] (tối đa 80 s); ảnh E7-qua-45s-1440; bấm [data-nut='thu-lai']; lấy mẫu [data-luot='loi'] mỗi 200 ms tới khi Trợ lý giả trả 200 cho POST gửi lại; ảnh E7-cho-khep-1440; chờ câu trả lời của lượt mới trên màn; ảnh E7-tra-loi-moi-1440"
      - "Lặp ở 390 px với cuộc mới; đo scrollWidth ≤ clientWidth"
    expected: "exit 0; thu-lai-45s-man-that.mjs in DUNG cho, ở cả hai khổ: Trợ lý giả nhận đúng 1 yêu cầu huỷ mang turnId của lượt đang chạy và trả 202 accepted; đối chứng dương ghi được lúc một luồng bị đóng; luồng của lượt cũ không bị trình duyệt đóng trước mốc đỗ (mốc đỗ = mốc nhận huỷ + 3 s, lúc Trợ lý giả ghi turn.cancelled rồi session.waiting mang token mới lên luồng đó); POST gửi lại trước mốc đỗ hoặc mang token cũ (nếu có) bị trả 409 và được ghi; có đúng một POST gửi lại được trả 200, sau mốc đỗ, mang token mới; câu trả lời của lượt mới hiện trong màn soạn trong ≤ 10 s sau POST 200 và [data-luot='loi'] không còn; số mẫu [data-luot='loi'] lấy giữa lúc bấm và POST 200 ≥ 3 và mọi mẫu đều thấy phần tử (in số mẫu); không tràn ngang; ảnh E7-qua-45s-<kho>, E7-cho-khep-<kho> (chụp trước mốc đỗ), E7-tra-loi-moi-<kho> + HTML có trên đĩa. Chiều đỏ ghim: cờ --kiem-do-do cho Trợ lý giả gửi một sự kiện mỗi 10 giây (không im) → in 'khong thay qua 45 giay' và mã 1."
    evidence_required: [run_id, exit_code, verifier, verified_at, output, screenshot]
    paths: ["apps/app/app/(app)/[slug]/okr/soan/**", apps/app/lib/messages/okr-soan.ts, _acceptance/thu-lai-sau-45-giay/rang/thu-lai-45s-man-that.mjs]

