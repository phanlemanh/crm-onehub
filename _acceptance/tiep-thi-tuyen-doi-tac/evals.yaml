    executor: test
    cmd: config:executors.test.tt_api
    expected: >-
      exit 0. Bai "goc nhin dang duoc dung": savedViews.delete tren goc nhin co
      chien dich → HttpException, thong diep chua TEN chien dich; goc nhin van
