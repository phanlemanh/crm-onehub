      Viet): chan TRU no khoi phep so hai thu tieng NHUNG ghi lai nguyen van
      chu hien ra vao evidence/E15-chu-may-chu.txt — cho dut nam trong ho so,
      khong bi giau. Voi lang=vi thu thap
      moi chuoi giao dien SINH TU MAY (tru gia tri du lieu: ten chuyen trang,
      dia ban, so dien thoai, ten goc nhin) va doi chieu voi lang=en: con lai 0
