      ghi thu nhat dut vi khoa ngoai, nen so dem bang 0 dung theo cau truc; no
      ghim P2003 va "activity_contactId_fkey" de phan biet "hong o buoc nao".
      Chieu do: bo transaction trong ban sao → bai "luot goi hong" do voi
      callCount = 1; bo contactId khoi activity.create trong ban sao → bai "ca
      nhan khong co that" do vi thong diep doi sang "campaignTouch_contactId_fkey".
