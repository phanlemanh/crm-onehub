      - "Mo ho so ca nhan dong dau, dem so hoat dong Goi TRUOC → n0; quay lai chien dich, bam Bat dau → evidence/E9-bat-dau.png"
      - "Bam ket qua 'Tra loi' tren dong do → evidence/E9-ghi.png"
