schema_version: 1
feature_slug: tiep-thi-tuyen-doi-tac
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.tt_api
    expected: >-
      exit 0. Bai "tiep nhan lo hop le" trong apps/api/test/listing-ingest.integration.spec.ts:
      gui 3 muc → 3 ca nhan source=LISTING, moi ca nhan co du 9 gia tri truong
      dung bang muc gui (san_luong, tin_dang, tin_moi_30_ngay, dia_ban, hinh_thai,
      chung_chi, ten_chuyen_trang, trang_nhatot, san_cap_nhat_luc), phan hoi
      {created: 3, updated: 0}. Ma tran toan phan: 9 khang dinh, moi truong mot,
      so gia tri that trong FieldValue (text / number / date / nhan option) voi
      dung truong cua muc gui; them mot khang dinh tap khoa doc ve bang dung 9
      khoa. Chieu do: hoan vi tin_dang ↔ tin_moi_30_ngay trong ban sao (hai
      truong cung kieu NUMBER) → bai do o assert got.tin_dang, "Expected: 101
      Received: 61".
    paths:
      - "apps/api/src/listings/**"
      - "packages/validation/src/listing-ingest.ts"
      - "apps/api/test/listing-ingest*.spec.ts"
      - "packages/db/prisma/schema.prisma"
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.tt_api
    expected: >-
      exit 0. Bai "gui lai cung lo": gui lo lan 1, gui lai lan 2 voi tin_dang doi
      va crawledAt moi → {created: 0, updated: N}, dem contact source=LISTING
      KHONG tang, tin_dang va san_cap_nhat_luc mang gia tri moi. Bai "giu so":
      lo 1 co phone → contact.phone = so; lo 2 VANG phone → contact.phone GIU
      nguyen; lo 3 co phone khac → doi. Chieu do: bo buoc tim theo trang_nhatot
      trong ban sao → bai do vi dem tang; ghi phone = null khi vang trong ban
      sao → bai "giu so" do goi ten phone.
    paths:
      - "apps/api/src/listings/**"
      - "apps/api/test/listing-ingest*.spec.ts"
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.tt_api
    expected: >-
      exit 0. Ba bai rieng, cung mot lo mau, ca ba goi qua chinh lop cong
      (ListingsController.run, khong goi thang bo phan tich): (a) khoa sai →
      ForbiddenException, getStatus() = 403; (b) khoa chua cau hinh →
      ServiceUnavailableException, getStatus() = 503, thong diep "Listing ingest
      is not configured."; (c) mot muc thieu listingsTotal → BadRequestException,
      getStatus() = 400 va thong diep chua "items.1.listingsTotal". Sau moi bai:
      dem FieldValue trang_nhatot cua lo = 0. Doi chung duong cung lop: khoa dung
      → cong tra {created: 1, updated: 0}. Chieu do: bo kiem khoa trong ban sao →
      bai (a) do "Cong da nhan lo ma dang le no phai tu choi"; ep nhanh
      !this.secret thanh false → bai (b) do o toBeInstanceOf
      ServiceUnavailableException; bo parse Zod → bai (c) do cung thong diep voi
      bai (a).
    paths:
      - "apps/api/src/listings/**"
      - "packages/validation/src/listing-ingest.ts"
      - "apps/api/test/listing-ingest*.spec.ts"
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.tt_api
    expected: >-
