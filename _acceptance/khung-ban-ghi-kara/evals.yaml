      Ca phuc hoi: truong co fact W da bi SUPERSEDED tu mot lan nhan TRUOC (moc cu t0), mot fact APPLIED
      (gia tri X) va mot PROPOSED khac (Y); nhan fact Z -> X va Y SUPERSEDED cung moc decidedAt cua Z; hoan tac
