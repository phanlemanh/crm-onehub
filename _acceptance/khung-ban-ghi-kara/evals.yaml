      SUPERSEDED va supersededAt van bang t0. CHIEU DO ghim: ban sao bo kiem nguoi da quyet -> do
      "chan: nguoi khac hoan tac duoc"; ban sao bo dieu kien khop moc supersededAt === decidedAt -> do
      "chan: phuc hoi fact cua lan nhan khac".

