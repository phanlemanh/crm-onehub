      - "apps/app/lib/agent-record.ts"
      - "apps/app/lib/messages/kara-ban-ghi.ts"
      - "apps/app/lib/messages/record-sheet.ts"
      - "apps/app/test/kara-ban-ghi.dom.tsx"
    expected: |
      exit 0; AgentPanel that voi useEveAgent gia (mock.module eve/react) va tRPC gia. Ma tran viet truoc
      3 loai (contact, company, deal) x 6 o (tieu de, mo ta, cho goi y o soan, 3 cau goi y) = 18 o,
      expect(o.length).toBe(18); moi o so chu hien (innerText) voi ban viet truoc tieng Viet trong bai
      (khong rut tu tep chu, de bat ca tep chu sai). Moi loai: khong co [data-slot=logo] / svg cua Logo
      trong tab, co dau Kara ([data-slot=kara-mark] hoac avatar KaraAvatar); recordSheetMessages("vi")
      .tabs.agent === "Kara". Ba nut goi y nam trong khoang rong [data-slot=empty] (xuong dong duoc, khong
      nam trong hang cuon cua o soan). Bam cau goi y thu hai -> agent.send goi dung mot lan voi {message: <cau do>}.
      CHIEU DO ghim: ban sao agent-panel.tsx tra <Logo vao khoang rong -> do "tab-rong: con logo OneHub";
      doi mot goi y cua deal trong tep chu -> do "tab-rong: deal goi y 2"; ban sao tra goi y ve hang cuon
      cua o soan -> do "tab-rong: contact goi y nam ngoai o trong".

