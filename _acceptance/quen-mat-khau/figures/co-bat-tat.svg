      <text x="512" y="305" fill="#666666" font-size="8" font-family="'Geist Mono', monospace">khai một nửa</text>

      <path d="M 240 288 L 240 332" fill="none" stroke="#575757" stroke-width="1" marker-end="url(#arrow)"/>
      <path d="M 240 392 L 240 436" fill="none" stroke="#575757" stroke-width="1" marker-end="url(#arrow)"/>
      <path d="M 760 288 L 760 332" fill="none" stroke="#575757" stroke-width="1" marker-end="url(#arrow)"/>
      <path d="M 760 392 L 760 436" fill="none" stroke="#575757" stroke-width="1" marker-end="url(#arrow)"/>

      <polygon points="500,88 620,136 500,184 380,136" fill="#fafafa"/>
      <polygon points="500,88 620,136 500,184 380,136" fill="rgba(0,107,79,0.08)" stroke="#006B4F" stroke-width="1.4"/>
