      <text x="760" y="272" fill="#575757" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">không hiện một cửa chưa dùng được</text>

      <rect x="620" y="336" width="280" height="56" rx="6" fill="#fafafa"/>
