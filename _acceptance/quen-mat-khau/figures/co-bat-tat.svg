      <text x="760" y="480" fill="#575757" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">quản trị phát liên kết đặt lại</text>
      <text x="760" y="516" fill="#575757" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AC-1</text>

      <rect x="400" y="440" width="200" height="56" rx="20" fill="#fafafa"/>
      <rect x="400" y="440" width="200" height="56" rx="20" fill="#ffffff" stroke="#171717" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="500" y="464" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Máy chủ không khởi động</text>
      <text x="500" y="480" fill="#575757" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">báo tên cả hai biến</text>
      <text x="500" y="516" fill="#575757" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AC-3</text>

      <line x1="32" y1="548" x2="968" y2="548" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>
      <text x="32" y="568" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>
      <polygon points="40,576 48,584 40,592 32,584" fill="none" stroke="#575757" stroke-width="1"/>
      <text x="56" y="588" fill="#575757" font-size="9" font-family="'Geist', sans-serif">Câu hỏi</text>
      <rect x="128" y="576" width="24" height="16" rx="4" fill="#ffffff" stroke="#575757" stroke-width="1"/>
      <text x="160" y="588" fill="#575757" font-size="9" font-family="'Geist', sans-serif">Màn hoặc bước</text>
      <rect x="264" y="576" width="24" height="16" rx="8" fill="#ffffff" stroke="#575757" stroke-width="1"/>
      <text x="296" y="588" fill="#575757" font-size="9" font-family="'Geist', sans-serif">Kết cục</text>
      <rect x="368" y="576" width="24" height="16" rx="8" fill="#ffffff" stroke="#575757" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="400" y="588" fill="#575757" font-size="9" font-family="'Geist', sans-serif">Ca cấu hình hỏng, chặn từ lúc khởi động</text>
      <rect x="632" y="576" width="24" height="16" rx="4" fill="rgba(0,107,79,0.08)" stroke="#006B4F" stroke-width="1.4"/>
      <text x="664" y="588" fill="#575757" font-size="9" font-family="'Geist', sans-serif">Chỗ vòng này quyết hoặc vá</text>
