      <text x="760" y="360" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Gõ thẳng trang xin liên kết</text>
      <text x="760" y="376" fill="#575757" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">bị đưa về màn đăng nhập</text>

