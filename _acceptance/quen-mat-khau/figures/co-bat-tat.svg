<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 608" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#575757"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#006B4F"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#fafafa"/>

      <path d="M 380 136 L 248 136 A 8 8 0 0 0 240 144 L 240 228" fill="none" stroke="#575757" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="264" y="114" width="92" height="12" rx="2" fill="#fafafa"/>
      <text x="310" y="123" fill="#666666" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">có, đủ cả hai</text>

      <path d="M 620 136 L 752 136 A 8 8 0 0 1 760 144 L 760 228" fill="none" stroke="#575757" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="652" y="114" width="72" height="12" rx="2" fill="#fafafa"/>
      <text x="688" y="123" fill="#666666" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">chưa khai</text>

      <path d="M 500 184 L 500 436" fill="none" stroke="#575757" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
