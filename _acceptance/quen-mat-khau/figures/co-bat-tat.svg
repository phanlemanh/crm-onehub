      <text x="240" y="480" fill="#575757" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">thư về hộp thư của chính họ</text>
      <text x="240" y="516" fill="#575757" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AC-2</text>

