      <text x="500" y="148" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">gửi thư?</text>

      <text x="648" y="68" fill="#171717" font-size="12" font-style="italic" font-family="'Lora', Georgia, serif">Hỏi lại mỗi lần, không nhớ từ lúc khởi động</text>

      <rect x="100" y="232" width="280" height="56" rx="6" fill="#fafafa"/>
