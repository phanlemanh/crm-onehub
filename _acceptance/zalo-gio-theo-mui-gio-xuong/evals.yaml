schema_version: 1
slug: zalo-gio-theo-mui-gio-xuong

evals:
  - id: E1
    criterion: AC-1
    executor: test
    layer: unit
    cmd: config:executors.test.zgm_ca_production
    paths:
      - "apps/app/lib/nhac-qua-zalo-man.ts"
      - "packages/db/src/onboarding-nhac.ts"
      - "apps/app/test/zalo-gio-theo-mui-gio-xuong.spec.ts"
    expected: |
      Lenh chay TZ=UTC. Ma tran viet truoc 2 o cho 2026-09-24T22:27:04Z, chuoi ghim nguyen van
      do tu dinh dang hien hanh cua ngayGio truoc khi sua (chi doi mui gio):
        vi -> "05:27 25-09"   en -> "09/25, 05:27 AM"
      Mot toEqual tren bang 2 o, thong diep ghim "gio theo mui gio xuong".
      Moi o cung bang Intl.DateTimeFormat doi chung (cung tuy chon, timeZone Asia/Ho_Chi_Minh).
      Doi chung am cung fixture: Intl.DateTimeFormat khong timeZone duoi TZ=UTC ra "22:27"
      (chung minh tien trinh dung la UTC — thieu dong nay thi test xanh tren may VN la vo nghia).
      DOT BIEN (ban sao): bo timeZone trong ngayGio -> do voi thong diep ghim do.
  - id: E2
    criterion: AC-2
    executor: test
    layer: unit
    cmd: config:executors.test.zgm_bien_nua_dem
    paths:
      - "apps/app/lib/nhac-qua-zalo-man.ts"
      - "packages/db/src/onboarding-nhac.ts"
      - "apps/app/test/zalo-gio-theo-mui-gio-xuong.spec.ts"
    expected: |
      Lenh chay TZ=UTC. Ma tran TOAN PHAN viet truoc 2 thoi diem x 2 ngon ngu = 4 o, chuoi ghim
      nguyen van: vi 16:59Z "23:59 24-09", vi 17:00Z "00:00 25-09", en 16:59Z "09/24, 11:59 PM",
      en 17:00Z "09/25, 12:00 AM". Mot toEqual tren bang 4 khoa, thong diep ghim "bien nua dem
      theo gio VN". DOT BIEN: bo timeZone -> ca 4 o do (ra "16:59 24-09", "17:00 24-09",
      "09/24, 04:59 PM", "09/24, 05:00 PM").
  - id: E3
    criterion: AC-3
    executor: ui-check
    layer: ui-observed
    cmd: config:executors.design.ui_check
    paths:
      - "apps/app/app/(app)/[slug]/settings/connections/zalo/**"
      - "apps/app/lib/nhac-qua-zalo-man.ts"
    steps:
      - "Dat truoc MOI buoc: APP_URL=http://127.0.0.1:3300 va API_URL=http://127.0.0.1:3301 — dung 127.0.0.1"
      - "Kiem cong 3300, 3301, 2000 truoc khi dung — tai nguyen chung; giu PID de tat, khong pkill. Co tac tu nao dang nghe 2000 (no ghi de zaloPolledAt) -> ghi PID va cwd vao E3-lenh.txt"
      - "Dung api 3301 va app 3300 cua CAY DANG XET; may chu app chay voi bien moi truong TZ=UTC (nhu Vercel). Ghi lai lenh da dung vao _acceptance/zalo-gio-theo-mui-gio-xuong/evidence/E3-lenh.txt, KEM mui gio THAT cua tien trinh app doc tu moi truong cua PID (ps eww <PID> | tr ' ' '\\n' | grep '^TZ=') — phai la TZ=UTC; khac thi thoat ma 2, KHONG chup"
      - "CHAN CAY: dat dau moc vao apps/app/public roi xin lai qua APP_URL; khong nhan lai -> thoat ma 2, KHONG chup anh"
      - "Ghi lai gia tri cu cua AppSetting.zaloPolledAt va zaloBotName; gieo zaloPolledAt = 2026-09-24T22:27:04Z (va zaloBotName 'Bot OneHub' neu dang rong)"
      - "Dang nhap quan tri vien (bun run dev:session trong apps/api cua cay dang xet). Mo Ket noi › Zalo: chup E3-1440.png; lap lai o kho 375: E3-375.png. Ngay sau MOI anh, doc lai AppSetting.zaloPolledAt va ghi vao E3-lenh.txt; khac 2026-09-24T22:27:04Z thi gieo lai va chup lai (toi da 1 lan), van khac -> BLOCKED ha tang"
      - "Moi anh ghi o _acceptance/zalo-gio-theo-mui-gio-xuong/evidence/ (duong tinh tu goc kho). Tra AppSetting ve gia tri cu, xoa dau moc, tat may chu bang PID"
    expected: |
      E3-1440 va E3-375: dong trang thai bot co "trả lời lần cuối lúc 05:27 25-09", KHONG co
      "22:27". E3-lenh.txt co TZ=UTC doc tu moi truong that cua PID app va zaloPolledAt doc lai
      bang 2026-09-24T22:27:04Z sau moi anh. Voi tien trinh UTC, trang chi ra 05:27 khi no truyen
      NHAC.muiGio — truyen mui gio cua tien trinh se ra 22:27.
    inputs:
      - _acceptance/zalo-gio-theo-mui-gio-xuong/evidence/
