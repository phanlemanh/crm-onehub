schema_version: 1
slug: khoa-con-bat-xa-tran

evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.kcb_thoi_gian
    paths:
      - "apps/api/test/go-la-cat-quyen.spec.ts"
      - "apps/api/test/setup.ts"
      - "apps/api/test/phien-thu.ts"
      - "_acceptance/khoa-con-bat-xa-tran/rang/do-thoi-gian.mjs"
      - "_acceptance/khoa-con-bat-xa-tran/rang/chung.mjs"
      - ".github/workflows/ci.yml"
    expected: |
      Lenh boc trong `bun run test --` nen co co so du lieu rieng cua luot; script tu choi
      (ma 2, goi ten) neu TEST_DATABASE_URL vang hoac ten co so du lieu la crm_test, va in ten
      co so du lieu. Xin khoa chung cua ho so (.acceptance-runs/khoa-con-bat-xa-tran/lan.khoa,
      mkdir + pid, don khoa cua pid da chet) truoc khi do, de E1/E2/E3 khong chay chong nhau.
      Chay that apps/api/test/go-la-cat-quyen.spec.ts 10 luot, moi luot mot tien trinh
      `bun test --preload ./test/setup.ts --randomize --reporter=junit` trong apps/api, env
      ALLOWED_SIGN_IN/GOOGLE_CLIENT_ID/GOOGLE_CLIENT_SECRET/API_URL/APP_URL doc tu
      .github/workflows/ci.yml (script parse tep, khong chep tay; thieu khoa nao -> ma 2).
      Ma tran viet truoc = 10 luot x {ma thoat 0; junit co dung 18 testcase va 0 failure;
      testcase khoa-con-bat co mat dung mot lan; time cua no <= 1.250s} + 1 khang dinh 10 seed
      (doc tu dau ra cua bun, khong tu dat) doi mot khac nhau. Moi luot in: seed, thoi gian
      khoa-con-bat, so ca do, so tien trinh `bun test` khac dang chay luc bat dau luot.
      CHIEU DO: cung script voi `--ban-sha 679432a0` (ban truoc va cua tep, dung o ban sao
      .acceptance-runs/khoa-con-bat-xa-tran/) -> do voi thong diep ghim
      "khoa-con-bat vuot 1250ms o luot <n>: <ms>ms" (do truoc khi lam: 1.63-4.10s).
      Ban cu co 17 testcase nen `--ban-sha` doc so ca ky vong tu chinh ban sao (dem test( ).

  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.kcb_lech_hang
    paths:
      - "apps/api/test/go-la-cat-quyen.spec.ts"
      - "_acceptance/khoa-con-bat-xa-tran/rang/pha-thu.mjs"
      - "_acceptance/khoa-con-bat-xa-tran/rang/chung.mjs"
      - ".github/workflows/ci.yml"
    expected: |
      Boc trong `bun run test --`, cung khoa ho so nhu E1. Ban sao cua tep hien tai o
      .acceptance-runs/khoa-con-bat-xa-tran/sao-<pid>-<ten>/, import tuong doi viet lai thanh duong
      tuyet doi, chay rieng `-t khoa-con-bat`. Ma tran viet truoc = 1 doi chung + 10 dot bien:
      (a) nguyen ven -> ma 0 (doi chung duong, cung khung dung ban sao);
      (b) 8 o {hut, thua, trung, dao} x {tRPC, REST}, moi o dot bien RIENG danh sach dua vao
          loi goi theoLo cua dung ma tran do (tRPC: soThuTuc().slice(1) / them thu tuc
          "khong.co" / them ban trung cua phan tu dau / .reverse(); REST: tuong tu voi duongRest()
          va duong ".../khong-co") -> ma khac 0 VA dau ra co DONG LOI dung bang
          "error: ma tran tRPC song song lech danh sach thu tuc" (4 o tRPC) hoac
          "error: ma tran REST song song lech danh sach duong" (4 o REST);
      (c) 2 dot bien cua chinh bo chia lo: bien vong lap bo lo cuoi, dao thu tu trong lo ->
          ma khac 0 VA dong loi tRPC nhu tren.
      So khop thong diep bang DONG LOI (AC-6), khong bang chuoi co mat trong dau ra.
      Chuoi dich cua mot dot bien khong xuat hien dung 1 lan trong tep -> ma 2 goi ten dot bien.

  - id: E3
    criterion: AC-3
    executor: script
    cmd: config:executors.script.kcb_con_thanh_vien
    paths:
      - "apps/api/test/go-la-cat-quyen.spec.ts"
      - "apps/api/src/trpc/middlewares/**"
      - "_acceptance/khoa-con-bat-xa-tran/rang/pha-thu.mjs"
      - "_acceptance/khoa-con-bat-xa-tran/rang/chung.mjs"
      - ".github/workflows/ci.yml"
    expected: |
      Cung khung E2: (a) ban sao nguyen ven -> ma 0; (b) ban sao bo dong
      `await db.member.delete(...)` trong khoa-con-bat (khoa thuoc nguoi VAN la thanh vien) ->
      ma khac 0 VA dau ra co DONG LOI "error: tRPC: khoa con bat cua nguoi ngoai van qua duoc".
      Dong can bo khong tim thay -> ma 2.

  - id: E6
    criterion: AC-6
    executor: script
    cmd: config:executors.script.kcb_con_thanh_vien
    paths:
      - "_acceptance/khoa-con-bat-xa-tran/rang/pha-thu.mjs"
      - "_acceptance/khoa-con-bat-xa-tran/rang/chung.mjs"
      - "apps/api/test/go-la-cat-quyen.spec.ts"
    expected: |
      Cung lan chay voi E3, tren CUNG dau ra cua ban sao dot bien con-thanh-vien (fixture that,
      khong dung tay): thong diep cua khang dinh ben canh
      "ma tran tRPC song song lech danh sach thu tuc" PHAI co mat trong dau ra (bun in no trong
      khung ma nguon quanh dong do — chung minh ca nay la bay that) VA bo khop dong loi PHAI
      KHONG nhan no. Thieu ve thu nhat -> do "thong diep lang gieng trong dau ra VANG" (tu kiem
      khong ket luan duoc); ve thu hai khop -> do "KHOP NHAM". Doi chung duong cung dau ra: bo
      khop NHAN "tRPC: khoa con bat cua nguoi ngoai van qua duoc" (E3).

  - id: E4
    criterion: AC-4
    executor: script
    cmd: config:executors.script.kcb_khong_noi_tran
    paths:
      - "apps/api/test/go-la-cat-quyen.spec.ts"
      - "apps/api/test/setup.ts"
      - "apps/api/package.json"
      - "apps/api/bunfig.toml"
      - "bunfig.toml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/acceptance.yml"
      - "_acceptance/khoa-con-bat-xa-tran/rang/soi-tep.mjs"
      - "_acceptance/khoa-con-bat-xa-tran/rang/chung.mjs"
    expected: |
      Doc tep (vang = khong cau hinh, in ra la vang). Ma tran viet truoc:
      - tep spec: dung 18 loi goi test( (quet ngoac can bang); moi loi goi dung hai doi so
        — 18 khang dinh, thong diep ghim ten ca;
      - tep spec + moi tep preload rut tu `--preload` cua script test (hien: apps/api/test/setup.ts):
        khong goi setDefaultTimeout; khong co --preload nao -> do (khong soat duoc);
      - apps/api/bunfig.toml, bunfig.toml: khong co khoa `timeout`;
      - moi script cua apps/api/package.json co `bun test`: khong `--timeout`;
      - MOI dong cua ci.yml va acceptance.yml (khong chi dong co `run:`): khong `--timeout`;
        ci.yml phai co >= 1 dong chay test (doi chung: bo soat nhin thay lenh CI); in so dong da doc.
      Tu kiem hai chieu, moi nhanh mot lan, tren cung ham soat, dot bien dung MOT tep:
      spec them `, 15_000` vao khoa-con-bat -> "test khoa-con-bat co tran rieng";
      script test them `--timeout 15000` -> "apps/api/package.json script test co --timeout";
      bunfig them `[test] timeout = 15000` -> "apps/api/bunfig.toml co khoa timeout";
      ci.yml them buoc `run: |` nhieu dong chua `bun test --timeout 15000` -> ".github/workflows/ci.yml co --timeout";
      setup.ts them setDefaultTimeout -> "apps/api/test/setup.ts goi setDefaultTimeout".
      Mot lan tu kiem khong bat -> script do, thuoc hong.

  - id: E5
    criterion: AC-5
    executor: script
    cmd: config:executors.script.kcb_tuan_tu
    paths:
      - "apps/api/test/go-la-cat-quyen.spec.ts"
      - "packages/db/src/client.ts"
      - "_acceptance/khoa-con-bat-xa-tran/rang/soi-tep.mjs"
      - "_acceptance/khoa-con-bat-xa-tran/rang/pha-thu.mjs"
      - "_acceptance/khoa-con-bat-xa-tran/rang/chung.mjs"
      - ".github/workflows/ci.yml"
    expected: |
      Boc trong `bun run test --`, cung khoa ho so nhu E1. Hai ve:
      (1) Hanh vi: chay that ca `theo-lo` (`-t theo-lo`) tren ban sao nguyen ven -> ma 0. Ca do:
          dem so luot dang chay cung luc lon nhat cua bo chia lo tren 40 phan tu gia — mac dinh = 1,
          LO_SONG_SONG = dung LO_SONG_SONG; roi DO co pool that: 32 truy van
          `SELECT pg_backend_pid() FROM pg_sleep(0.05)` dong thoi qua chinh `db` cua ung dung, dem
          so pid khac nhau; khang dinh so do < 32 (pool da bi lam day — phep do ket luan duoc) va
          LO_SONG_SONG + 2 <= so do. Chieu do tren ban sao: (i) bo chia lo bo qua tham so so luot
          -> dong loi "error: bo chia lo mac dinh chay nhieu hon mot luot"; (ii) LO_SONG_SONG = 12
          -> dong loi "error: LO_SONG_SONG lan vao pool pg" (pool that do duoc 10).
      (2) Cho goi: danh sach viet truoc = {ma-tran-dang-nhap-lai: maTranTrpc x1,
          ngoai-le-dung-tap-khai: maTranTrpc x1, doi-chung-thanh-vien: maTranTrpc x1,
          tab-dang-mo: maTranTrpc x1, khoa-con-bat: maTranTrpc x1 + maTranRest x1}; moi phan tu
          mot khang dinh: loi goi trong khoa-con-bat co doi so thu hai LO_SONG_SONG, loi goi o
          ca khac dung mot doi so; tong so loi goi trong tep dung 6. Tu kiem: noi dung them
          `, LO_SONG_SONG` vao loi goi cua doi-chung-thanh-vien -> phai bat voi thong diep ghim
          "doi-chung-thanh-vien goi ma tran song song".
