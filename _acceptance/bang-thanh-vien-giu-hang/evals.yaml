schema_version: 1
slug: bang-thanh-vien-giu-hang

evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.ttv_do_bang
    paths:
      - "apps/app/app/(app)/[slug]/settings/members/page.tsx"
      - "apps/app/app/(app)/[slug]/settings/members/members-table.tsx"
      - "packages/ui/src/components/data-table.tsx"
      - "_acceptance/bang-thanh-vien-giu-hang/rang/do-bang.mjs"
    expected: |
      Ban do tu chan cay (canhCay qua APP_URL), gieo 15 loi moi cho, mo trang that o
      1440x900, 768x1024, 375x812. Ma tran viet truoc cho ca luot: 30 khang dinh =
      8 moi kho x 3 kho (so hang nam tron, hang bi cat/tran trong, thu tu khoi, cuon,
      mot vung cuon, doi chung elementFromPoint, nut menu khong bi che, menu du vai) +
      2 tran ngang (1440, 768) + 1 tim rong + 1 Khoa API lap day + 2 don. Dong KET LUAN
      cuoi: "30 DUNG, 0 SAI — ma thoat 0"; 375 co them mot dong GHI CHU tran ngang, khong
      cham.
      Rieng AC-1, o ca ba kho: "DUNG <kho>: bang thanh vien hien N/N hang" — mau so N la so
      thanh vien doc thang DB theo WORKSPACE_ID, tu so la so hang tbody nam tron trong hop vo
      bang (cao > 0, top/bottom trong hop +-2px); tien dieu kien 2 <= N <= 25 (mot trang),
      sai thi ma 2. Va "DUNG <kho>: bang cao <n>px, 0 hang bi cat, tran trong <=2px".
      CHIEU DO (da chay 25/09 tren ma chua sua, 13 DUNG 14 SAI ma 1): "SAI <kho>: bang thanh
      vien hien 0/10 hang" va "SAI <kho>: bang cao 2px, 10 hang bi cat, tran trong 709|981px"
      o ca ba kho. Chieu do cua E1 la chinh ma goc (chuoi min-h-0 o page.tsx + DataTable lap
      day). Pha-thu da chay 25/09 tren cay da commit: CHI bo layout="content" thi bang VAN giu
      du hang (goc lap day trong cot cao theo noi dung nhan chieu cao noi dung) — chi E5 do,
      30 DUNG 1 SAI; khop du doan cua design: bo min-h-0 cho AC-1..AC-4, bien the content cho
      AC-5.

  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.ttv_do_bang
    paths:
      - "apps/app/app/(app)/[slug]/settings/members/page.tsx"
      - "apps/app/app/(app)/[slug]/settings/members/members-table.tsx"
      - "packages/ui/src/components/data-table.tsx"
      - "_acceptance/bang-thanh-vien-giu-hang/rang/do-bang.mjs"
    expected: |
      O ca ba kho: "DUNG <kho>: muc Duoc phep vao bat dau o Apx, duoi day bang Bpx" voi A >= B
      (B la day goc DataTable, gom ca dong phan trang); "DUNG <rong>: doi chung — tam tieu de
      trang tra ve chinh tieu de" (doi chung duong cua elementFromPoint); va "DUNG <rong>: nut
      menu vai cua Marcus Lindqvist nam trong khung nhin (true) va khong bi khoi nao de len
      (true)" sau scrollIntoView block center. Khong tim thay nut cua nguoi bi doi -> ma 2
      «khong co nut», khong bao gio thanh dong SAI hay DUNG rong.
      CHIEU DO (ma chua sua): "SAI <rong>: nut menu vai ... nam trong khung nhin (true) va khong
      bi khoi nao de len (false)" o ca ba kho, trong khi dong doi chung van DUNG, ma 1.

  - id: E3
    criterion: AC-3
    executor: script
    cmd: config:executors.script.ttv_do_bang
    paths:
      - "apps/app/app/(app)/[slug]/settings/members/page.tsx"
      - "apps/app/components/page-shell.tsx"
      - "apps/app/app/(app)/[slug]/settings/members/allowances-table.tsx"
      - "packages/ui/src/components/data-table.tsx"
      - "_acceptance/bang-thanh-vien-giu-hang/rang/do-bang.mjs"
    expected: |
      O ca ba kho: "DUNG <kho>: con lan cuon trang <n>px va toi duoc loi moi cuoi (true)" — dat
      chuot vao tam main [data-slot=page-shell-scroll], lan con lan (toi 40 nac x 600px, dung
      khi scrollTop het doi), roi khang dinh scrollTop > 0 VA hang loi moi cuoi nam tron THEO
      CHIEU DOC trong hop cua main (top >= main.top-2, bottom <= main.bottom+2); chieu ngang khong xet o dong nay. "Loi moi cuoi" la hang tbody
      cuoi cua bang Duoc phep vao theo thu tu DOM (15 loi moi gieo cung luc nen thu tu
      createdAt giua chung khong xac dinh — ban dau cua thuoc chon theo email va do gia o 375).
      Moi kho: "DUNG <kho>: chi mot vung cuon — tai lieu tran doc 0px" (document.scrollHeight
      - clientHeight <= 0). O 1440 va 768: "DUNG <kho>: tran ngang 0px (tai lieu va vung
      cuon)" — max(document.scrollWidth - clientWidth, main.scrollWidth - main.clientWidth)
      <= 0. O 375 chi mot dong "GHI CHU 375x812: tran ngang <n>px (tai lieu va vung cuon) —
      ... ngoai pham vi" (do 25/09: 98px, bang Duoc phep vao sau cot tran BEN TRONG main).
      CHIEU DO da chay 25/09 tren ban sua chua co section relative: "SAI <kho>: chi mot vung
      cuon — tai lieu tran doc 153|387|632px" o ca ba kho, ma 1; o 375 tran ngang 98px (hai
      span sr-only thoat khoi main). S4 round 1 REJECT: thuoc tran ngang cu chi do document
      nen "DUNG 375: tran ngang 0px" trong khi anh 375 cho thay bang tran trong main. Pha-thu
      cho thuoc moi, da chay 25/09: them min-w-[1600px] cho <table> cua allowances-table.tsx ->
      "SAI 1440x900: tran ngang 464px" va "SAI 768x1024: tran ngang 1136px", ma 1.
      Pha-thu rieng cho dong cuon, da chay 25/09: them prop
      `contained` cho PageShell o page.tsx (main thanh overflow-hidden) -> "SAI <kho>: con lan
      cuon trang 0px va toi duoc loi moi cuoi (false)" o ca ba kho, 28 DUNG 3 SAI, ma 1. Ban
      dau cua thuoc gan scrollTop bang JS va XANH tren pha-thu nay (gan scrollTop van chay tren
      overflow hidden) — vi vay dong cuon phai di bang con lan.

  - id: E4
    criterion: AC-4
    executor: script
    cmd: config:executors.script.ttv_do_bang
    paths:
      - "apps/app/app/(app)/[slug]/settings/members/**"
      - "apps/app/lib/messages/settings-thanh-vien.ts"
      - "packages/ui/src/components/data-table.tsx"
      - "_acceptance/bang-thanh-vien-giu-hang/rang/do-bang.mjs"
    expected: |
      O ca ba kho: "DUNG <rong>: menu vai mo, co du 4 vai [...]" — danh sach menuitem chua ca
      bon nhan cua thanhVienMessages("vi").vaiTro (Chu so huu, Quan tri, Thanh vien, Chi OKR),
      doc tu tep chuoi chu khong viet tay trong ban do. Nhan Escape dong menu, khong doi vai.
      CHIEU DO (ma chua sua): "SAI <rong>: menu vai mo, co du 4 vai []" o ca ba kho, ma 1.

  - id: E5
    criterion: AC-5
    executor: script
    cmd: config:executors.script.ttv_do_bang
    paths:
      - "packages/ui/src/components/data-table.tsx"
      - "apps/app/app/(app)/[slug]/settings/members/members-table.tsx"
      - "_acceptance/bang-thanh-vien-giu-hang/rang/do-bang.mjs"
    expected: |
      Mo /<slug>/settings/members?q=ttv-khong-ai-trung-tu-nay o 1440: "DUNG 1440: tim khong ra
      ai thi thay «Không có kết quả nào khớp bộ lọc» (cao >=16px, trong khung true, khong bi che
      true)" va "DUNG 1440: tim khong ra ai thi co nut «Bỏ lọc» trong vo bang (true)". Tu
      datatable-loc-ro (fb486420a) bang dang loc ma rong noi cau chung cua DataTable: cau lay tu
      messages("vi").table.noMatch cua packages/ui (tieu de [data-slot=empty-title], do chinh
      dong chu chu khong do khung lop phu), nut lay tu messages("vi").table.resetFilters.
      CHIEU DO (ma chua sua): "SAI 1440: tim khong ra ai ... (cao 64px, trong khung false,
      khong bi che false)", ma 1. Pha-thu sau khi sua: bo chieu cao toi thieu cua vo bang o
      bien the content trong data-table.tsx -> "trong khung false", ma 1.

  - id: E6
    criterion: AC-6
    executor: script
    cmd: config:executors.script.ttv_do_bang
    paths:
      - "packages/ui/src/components/data-table.tsx"
      - "_acceptance/bang-thanh-vien-giu-hang/rang/do-bang.mjs"
    expected: |
      Mo /<slug>/settings/api-keys o 1440x900: "DUNG 1440: bang Khoa API van lap day khung
      trang (lech day <n>px)" voi |n| <= 2 — day goc DataTable (gom ca dong phan trang) trung
      day [data-slot=page-shell]. Doi chung duong da chay tren ma chua sua: lech 0px.
      CHIEU DO: pha-thu doi mac dinh cua layout sang "content" trong data-table.tsx -> goc
      bang Khoa API cao theo noi dung, "SAI 1440: bang Khoa API van lap day khung trang (lech
      day <n>px)" voi n lon, ma 1.

  - id: E7
    criterion: AC-7
    executor: script
    cmd: config:executors.script.ttv_do_bang
    paths:
      - "_acceptance/bang-thanh-vien-giu-hang/rang/do-bang.mjs"
    expected: |
      Hai dong don: "DUNG don: con 0 loi moi cua ban do" va "DUNG don: loi moi co san truoc
      luot giu nguyen (N truoc, N sau)" — so sanh tap id doc thang DB truoc gieo va sau don.
      Luot hong giua chung (da chay 25/09): TTV_PHA_SAU_GIEO=1 nem loi ngay sau khi gieo ->
      ma 2 "KHONG DO DUOC: pha-thu TTV_PHA_SAU_GIEO", van in hai dong DUNG don, va mot truy van
      DB doc lap sau luot dem 0 hang id bat dau "ttv-lan-do-".
      CHIEU DO: pha-thu bo lenh deleteMany trong don() -> "SAI don: con 15 loi moi cua ban do",
      ma 1; lan chay ke tiep in "GHI CHU don 15 loi moi sot tu luot truoc".

  - id: E8
    criterion: AC-8
    executor: ui-check
    layer: ui-observed
    cmd: config:executors.script.ttv_do_bang
    steps:
      - "Cap cong 3500/3501 (ban-do-cot-app / ban-do-cot-api trong .claude/launch.json). Cong da co may chu: chay `APP_URL=http://localhost:3500 bun _acceptance/man-cai-dat-noi-tieng-viet/rang/canh-cay.mjs` — ma 0 thi dung luon; ma khac 0 thi BLOCKED goi ten tien trinh giu cong, khong giet. Cong trong: dung api va app cua CAY DANG XET bang hai muc do trong launch.json"
      - "Chay O TIEN CANH, Bash timeout 600000, voi BANG_CHUNG=_acceptance/bang-thanh-vien-giu-hang/evidence dat tuong minh (mac dinh ban do ghi ra .acceptance-runs/, vi sau cong cay _acceptance/<slug>/ la su lieu chi doc): lenh cua ttv_do_bang — mot-luot.sh xep hang voi moi lan do khac, tien-de.mjs dat khoa nghien cuu linh canh roi don; do-bang.mjs tu chan cay, gieo va don loi moi thu, chup vao evidence/"
      - "Doc dong KET LUAN cuoi: ma 0 = 30 DUNG; ma 2 = khong do duoc; ma 1 = co dong SAI"
      - "Mo tam anh va doi chieu bang mat voi Expected"
    inputs:
      - _acceptance/bang-thanh-vien-giu-hang/evidence/
    paths:
      - "apps/app/app/(app)/[slug]/settings/members/**"
      - "packages/ui/src/components/data-table.tsx"
      - "_acceptance/bang-thanh-vien-giu-hang/rang/do-bang.mjs"
    expected: |
      Tam anh, du ca: thanh-vien-1440-dau.png, thanh-vien-1440-noi.png, thanh-vien-768-dau.png,
      thanh-vien-768-noi.png, thanh-vien-375-dau.png, thanh-vien-375-noi.png, menu-vai-1440.png,
      tim-khong-ra-1440.png. Anh -dau (scrollTop 0): tieu de trang va cac hang dau cua bang
      thanh vien hien ro, khong khoi nao de len. Anh -noi (day goc DataTable dat giua khung
      cuon): hang cuoi cua bang, dong phan trang va tieu de «Được phép vào» cung nam trong mot
      khung, khoi «Được phép vào» bat dau ben duoi, khong de len hang nao. menu-vai-1440: menu
      mo voi bon vai. tim-khong-ra-1440: cau «Không ai khớp với bộ lọc này.» nam trong vo bang
      co vien. Thieu anh nao trong tam -> khong dat.
