schema_version: 1
slug: onboarding-giong-deals

evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.ogd_man_danh_muc
    paths:
      - "apps/app/app/(app)/[slug]/onboarding/**"
      - "apps/app/components/onboarding/**"
      - "apps/app/lib/messages/onboarding.ts"
      - "_acceptance/onboarding-giong-deals/rang/man-danh-muc.mjs"
    expected: |
      Chrome that tren may chu dev cua CAY DANG XET (canhCay chan cay khac, ma 2). Ma tran viet
      truoc: 3 man [onboarding-bang, onboarding-bang-cot, deals] x 5 kho [320,375,768,1024,1440]
      x 2 tieng [vi,en] = 30 o. Moi o: khong tran ngang + nut tao (nhan lay tu tep thong diep)
      nam trong [data-slot=page-shell-actions], hien trong khung nhin, data-variant=default,
      co svg. Man onboarding-bang them khang dinh tieu de (AC-3); deals chi do tran + nut.
      Dem khang dinh = 10x3 + 10x2 + 10x2 = 70 (hang O_MONG=30, KY_MONG=70 trong tep thuoc;
      lech -> ma 2). Deals la DOI CHUNG DUONG tren cung lan chay:
      nut cua no phai dat thi bo do nut moi dang doc dung.
      CHIEU DO (da chay 2026-09-22 tren cay chua sua d1bc95fa): onboarding-bang@1440/vi do voi
      thong diep ghim `nut tao "Kế hoạch mới" khong o dau trang: vung=false co=false`; deals dat.

  - id: E2
    criterion: AC-1
    executor: test
    cmd: config:executors.test.ogd_nut_dau_trang
    paths:
      - "apps/app/app/(app)/[slug]/onboarding/**"
      - "apps/app/components/onboarding/**"
      - "apps/app/test/onboarding-giong-deals.dom.tsx"
    expected: |
      jsdom, tRPC gia. Ma tran 2 cach xem [bang, bang-cot]: dung phan dau trang cua trang
      (component hanh dong dau trang) canh DanhMucTable. Moi cach xem: nut ten
      m.tao.keHoach.toolbar co data-variant=default va co svg; trong DanhMucTable KHONG co nut
      nao mang ten do. Dem ca = 2.
      CHIEU DO (da chay): bienThe ve outline -> do voi thong diep ghim "bang: dau-trang=true bienThe=outline".

  - id: E3
    criterion: AC-2
    executor: test
    cmd: config:executors.test.ogd_nut_mo_va_khoa
    paths:
      - "apps/app/app/(app)/[slug]/onboarding/**"
      - "apps/app/components/onboarding/**"
      - "apps/app/test/onboarding-giong-deals.dom.tsx"
    expected: |
      Hai ca tren cung fixture: (a) listTemplates tra 1 khuon -> nut bat, bam mo hop thoai co
      tieu de m.tao.keHoach.title; (b) listTemplates tra [] -> nut disabled. Dem ca = 2.
      CHIEU DO: bo khoaNut -> ca (b) do voi thong diep ghim "khong khuon: nut khoa".
      Them: noi-bon-nut.dom.tsx -t nut-tren-thanh-cong-cu (ho so noi-bon-nut-dieu-phoi) viet lai
      de do nut o dau trang, van xanh o hai cach xem.

  - id: E4
    criterion: AC-3
    executor: script
    cmd: config:executors.script.ogd_man_danh_muc
    paths:
      - "apps/app/app/(app)/[slug]/onboarding/**"
      - "_acceptance/onboarding-giong-deals/rang/man-danh-muc.mjs"
    expected: |
      Cung lan chay voi E1. Voi onboarding-bang o moi kho x tieng: moi th dang hien co nhan
      ([data-slot=table-head-label], hoac span.truncate/span.block) scrollWidth <= clientWidth VA scrollHeight <= clientHeight (nhan hai dong cat theo chieu doc); documentElement khong tran; o
      duoi 640 so th dang hien co chu = 3 (Doi tac, Tac o, Im lang).
      CHIEU DO (da chay tren cay chua sua): onboarding-bang@1440/vi do voi thong diep ghim
      "tieu de bi cat: Im lặng, Bước, Ngày".

  - id: E5
    criterion: AC-4
    executor: test
    cmd: config:executors.test.ogd_sap_mac_dinh
    paths:
      - "apps/app/app/(app)/[slug]/onboarding/**"
      - "apps/app/test/onboarding-giong-deals.dom.tsx"
    expected: |
      Duong dan trong: th cua cot Ngay co aria-sort=ascending; dau vao cuoi cua manDanhMuc co
      sort=startedAt, dir=asc; mo menu Sap xep: muc m.columns.days o trang thai chon
      (aria-checked=true). Dat ?dir=desc: dau vao cuoi mang dir=desc. Dem ca = 3.
      CHIEU DO: bo defaultSort -> do voi thong diep ghim "sort mac dinh: ''".

  - id: E6
    criterion: AC-5
    executor: test
    cmd: config:executors.test.ogd_dang_tai
    paths:
      - "apps/app/app/(app)/[slug]/onboarding/**"
      - "apps/app/test/onboarding-giong-deals.dom.tsx"
    expected: |
      Ma tran viet truoc, 7 khang dinh. Lan tai dau (manDanhMuc gia treo): (1) o tim
      (placeholder m.search) co mat, (2) nut Bang/Bang cot co mat, (3) trong phan tu table co
      [data-slot=spinner] (dau tai cua DataTable), (4) trong table KHONG co m.noMatch.title va
      KHONG co chu msg.table.noResults, (5) phan tu aria-live=polite chua m.loading. Giai
      promise: hang hien, m.loading mat. Tai lai (doi bo loc sang promise treo moi):
      (6) o tim van co, (7) trong vung bang (chan bang, TablePagination) co [data-slot=spinner].
      Dem khang dinh = 7.
      CHIEU DO (da chay): bo meta aria-live -> do voi thong diep ghim
      "dang tai: aria-live chua Dang tai=false".

  - id: E7
    criterion: AC-6
    executor: test
    cmd: config:executors.test.ogd_loi
    paths:
      - "apps/app/app/(app)/[slug]/onboarding/**"
      - "apps/app/test/onboarding-giong-deals.dom.tsx"
    expected: |
      manDanhMuc gia nem loi: o tim co mat, m.error.title va nut m.error.action nam TRONG phan
      tu table; bam nut -> so lan goi manDanhMuc tang 1. Ca thu ba (S4-r1): bang da co hang,
      manDanhMuc doi sang nem loi, invalidateQueries -> loi va dung mot nut Thu lai trong khung
      bang, o tim con. Dem ca = 3.
      CHIEU DO ca thu ba (da chay tren 448e60f): ghim "tai lai hong: loi trong bang=false nut=0".
      CHIEU DO (da chay): dua loi ra khoi o empty cua bang -> do voi thong diep ghim "loi hien"
      (loi khong bao gio xuat hien trong khung bang).

  - id: E8
    criterion: AC-7
    executor: test
    cmd: config:executors.test.ogd_o_trong_va_so
    paths:
      - "apps/app/app/(app)/[slug]/onboarding/**"
      - "apps/app/lib/messages/onboarding.ts"
      - "apps/app/test/onboarding-giong-deals.dom.tsx"
    expected: |
      Hang gia dung qua danhMucOutput.parse (schema dau ra that cua thu tuc danh sach,
      apps/api/src/onboarding/onboarding.contracts.ts) — khong dung hang viet tay khong qua schema.
      Ma tran viet truoc tren mot hang {imNgay:0, tacO:null, boPhanTac:null} va mot hang
      {imNgay:8}: ba o rong cua hang dau deu chua dung markup cua <EmptyCellValue/> dung rieng
      lam doi chieu (khong so chuoi viet tay); ba cot so cua hang hai co class tabular-nums;
      o Im lang cua hang hai = cells.silentDays(8) o vi ("8 ngày") va en ("8d"). Dem ca = 3+3+2 = 8.
      CHIEU DO: tra "—" viet tay -> do voi thong diep ghim "imNgay=0: EmptyCellValue".

  - id: E9
    criterion: AC-8
    executor: test
    cmd: config:executors.test.ogd_doi_tac_khong_an
    paths:
      - "apps/app/app/(app)/[slug]/onboarding/**"
      - "apps/app/test/onboarding-giong-deals.dom.tsx"
    expected: |
      Mo menu Cot: khong co muc nao nhan m.columns.partner; co muc m.columns.stuckOn (doi chung
      duong: menu that su mo va liet ke cot). Dem ca = 2.
      CHIEU DO: bo hideable:false -> do voi thong diep ghim "menu cot: Doi tac an duoc".

  - id: E10
    criterion: AC-9
    executor: test
    cmd: config:executors.test.ogd_o_chu_mot_dong
    paths:
      - "apps/app/app/(app)/[slug]/onboarding/**"
      - "apps/app/test/onboarding-giong-deals.dom.tsx"
    expected: |
      Ba cot chu [companyName, tacO, boPhanTac]: o cua moi cot co phan tu class truncate mang
      translate=no, va td khong mang whitespace-normal. Dem ca = 3.
      CHIEU DO: tra lai whitespace-normal break-words -> do voi thong diep ghim "<cot>: mot dong".

  - id: E11
    criterion: AC-10
    executor: test
    cmd: config:executors.test.ogd_nhan_bo_loc
    paths:
      - "apps/app/app/(app)/[slug]/onboarding/**"
      - "apps/app/test/onboarding-giong-deals.dom.tsx"
    expected: |
      Ma tran viet truoc 3 bo loc [boPhan, nguoiCam, nguoiGiao] x 2 ca = 6 khang dinh. Moi bo
      loc: facetCounts gia {<id1>:2,<id2>:0}. Ca 1 (khong chon): lua chon id1 co nhan dung ten,
      khong chua " · "; id2 vang. Ca 2 (id2 dang chon qua duong dan): id2 co mat, nhan dung ten.
      Dem khang dinh = 6.
      CHIEU DO (da chay): nhan kem " · so" -> do voi thong diep ghim "khong-cham=false".

  - id: E12
    criterion: AC-11
    executor: test
    cmd: config:executors.test.ogd_tao_xong_mo
    paths:
      - "apps/app/app/(app)/[slug]/onboarding/tao-ke-hoach.tsx"
      - "apps/app/components/onboarding/**"
      - "apps/app/test/onboarding-giong-deals.dom.tsx"
    expected: |
      Hop thoai dien du, createFromTemplate gia tra mot gia tri DI QUA planOutput.parse (schema
      dau ra that cua mutation): sau Luu, toast thanh cong xuat hien (van ban
      m.tao.keHoach.created) va duong dan mang record stack "plan:<id cua chinh gia tri da parse>"
      — so voi bien, khong so voi chuoi hang.
      createFromTemplate gia nem loi: khong toast thanh cong, hop thoai con mo. Dem ca = 2.
      CHIEU DO (da chay): bo openRecord -> do voi thong diep ghim "tao xong: plan:kh-vua-tao".

  - id: E13
    criterion: AC-11
    executor: test
    layer: backend-effect
    cmd: config:executors.test.ogd_tao_tra_id
    paths:
      - "apps/api/src/onboarding/**"
      - "apps/api/test/onboarding-giong-deals.spec.ts"
    expected: |
      Dich vu that tren CSDL thu: createFromTemplate cho mot khuon gieo san tra ban ghi qua
      duoc planOutput.parse; planById(id tra ve) doc lai dung id, ten cong ty va templateId cua
      khuon. Doi chung am tren cung fixture: id khong ton tai -> planById tra 404, ghim
      "id khong ton tai: 404". Dem khang dinh = 2.

  - id: E16
    criterion: AC-4
    executor: test
    layer: backend-effect
    cmd: config:executors.test.ogd_sap_hai_chieu
    paths:
      - "apps/api/src/onboarding/**"
      - "apps/api/test/onboarding-giong-deals.spec.ts"
    expected: |
      Dich vu that tren CSDL thu: gieo 3 ke hoach qua createFromTemplate voi startedAt khac nhau.
      Goi manDanhMuc voi (a) sort rong, (b) {sort:startedAt, dir:asc}, (c) {sort:startedAt,
      dir:desc}, loc theo 3 id do. Khang dinh: day id (a) == (b) == thu tu startedAt tang dan;
      (c) == dao nguoc cua (b). Dem khang dinh = 3.
      CHIEU DO (da chay): sapHang bo qua dir -> (c) do voi thong diep ghim "desc la dao nguoc cua asc".

  - id: E17
    criterion: AC-14
    executor: test
    cmd: config:executors.test.ogd_trang_thai_trong
    paths:
      - "apps/app/app/(app)/[slug]/onboarding/**"
      - "apps/app/test/onboarding-giong-deals.dom.tsx"
    expected: |
      Du lieu gia di qua danhMucOutput.parse. Ma tran 3 ca viet truoc: (a) trangThai
      ST-danhmuc-empty, listTemplates co 1 khuon: co m.empty.noPlan.title VA nut
      m.tao.keHoach.toolbar o dau trang co mat, khong disabled; (b) ST-danhmuc-khongkhop voi
      ?boPhan=x: m.noMatch.title va nut m.noMatch.action nam TRONG table, o tim co mat, bam nut
      -> duong dan khong con boPhan; (c) ST-danhmuc-chuacokhuon: co m.empty.noTemplate.title.
      Dem khang dinh = 6.
      CHIEU DO: dau trang chi hien nut khi co hang -> ca (a) do voi thong diep ghim
      "chua co ke hoach: nut dau trang".

  - id: E14
    criterion: AC-12
    executor: ui-check
    layer: ui-observed
    cmd: config:executors.design.ui_check
    paths:
      - "apps/app/app/(app)/[slug]/onboarding/**"
      - "apps/app/components/onboarding/**"
    steps:
      - "May chu dev cua CAY DANG XET: api 3001, app 3000; APP_URL va API_URL tro dung hai cong do. Chan cay (dat dau moc vao apps/app/public, xin lai qua APP_URL); khong nhan lai -> thoat ma 2."
      - "Tao phien bang `cd apps/api && bun run dev:session <email>`, dat cookie vao trinh duyet."
      - "Chup vao _acceptance/onboarding-giong-deals/evidence/ (tinh tu goc kho, KHONG phai evidence/ o goc): E14-onboarding-1440-sang.png, E14-deals-1440-sang.png, E14-onboarding-1440-toi.png, E14-deals-1440-toi.png, E14-onboarding-375-sang.png, E14-deals-375-sang.png (onboarding o cach xem bang)."
    inputs:
      - _acceptance/onboarding-giong-deals/evidence/
    expected: |
      Nhin thay tren anh, khong suy tu ma:
        1 nut «Kế hoạch mới» o goc phai dau trang, cung cho, cung mau xanh, cung icon voi
          «Thoả thuận mới» o ca 1440 va 375, sang va toi
        2 khong tieu de cot nao cua trang 30 ngay dau co dau ba cham
        3 o 375 nut tao thay ngay, khong nam trong o «Lọc»
      Thieu mot trong ba -> khong dat.

  - id: E15
    criterion: AC-13
    executor: test
    cmd: config:executors.test.ogd_san_thiet_ke
    paths:
      - "apps/app/app/(app)/[slug]/onboarding/**"
      - "apps/app/components/onboarding/**"
    expected: |
      design-gate --mode static tren danh-muc-table.tsx, danh-muc-cong-cu.tsx, tao-ke-hoach.tsx,
      page.tsx, khung-tao.tsx: moi tep exit 0.
      CHIEU DO: them mot mau hex vao className cua mot tep -> exit khac 0 voi ten tep.
