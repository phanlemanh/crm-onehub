<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ai gọi Zalo · Sơ đồ kiến trúc</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #fafafa;
      --color-ink:    #171717;
      --color-muted:  #575757;
      --color-soft:   #666666;
      --color-accent: #006B4F;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Lora', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1400px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.01em;
      line-height: 1.2;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .sub {
      font-size: 0.875rem;
      line-height: 1.5;
      color: var(--color-muted);
      max-width: 48rem;
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1000px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sơ đồ kiến trúc · nhac-qua-zalo · d-8 (gộp d-4)</p>
    <h1>Chỉ agent gọi Zalo; trang và máy gửi hỏi cùng một hàm</h1>
    <p class="sub">API không có đường nào tới Zalo: nó biết Zalo bật hay tắt bằng cách đọc hàng agent ghi. Kênh sẽ dùng cho một người được tính bởi một hàm duy nhất trong <code style="font-family: var(--font-mono); font-size: 0.8rem;">packages/db</code>, gọi từ cả hai phía.</p>

    <svg viewBox="0 0 1400 688" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#575757"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#006B4F"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f4f7a"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#fafafa"/>

      <!-- ===== Vùng ===== -->
      <rect x="24" y="64" width="464" height="352" rx="8" fill="rgba(23,23,23,0.02)" stroke="rgba(23,23,23,0.10)" stroke-width="0.8"/>
      <rect x="192" y="68" width="128" height="16" rx="2" fill="#fafafa"/>
      <text x="256" y="80" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">KHÔNG GỌI ZALO</text>

      <rect x="904" y="64" width="208" height="352" rx="8" fill="rgba(23,23,23,0.02)" stroke="rgba(23,23,23,0.10)" stroke-width="0.8"/>
      <rect x="928" y="68" width="160" height="16" rx="2" fill="#fafafa"/>
      <text x="1008" y="80" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CHỈ NƠI NÀY GỌI ZALO</text>

      <!-- ===== Đường đi (vẽ trước các ô) ===== -->
      <!-- App ⇄ API -->
      <line x1="216" y1="136" x2="294" y2="136" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="296" y1="184" x2="218" y2="184" stroke="#575757" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- API → Postgres -->
      <line x1="472" y1="160" x2="566" y2="160" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Agent → Postgres ① -->
      <line x1="920" y1="136" x2="810" y2="136" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- API → hàm ② -->
      <path d="M 384 208 V 344 Q 384 352 392 352 H 566" fill="none" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Agent → hàm ④ -->
      <path d="M 920 184 H 872 Q 864 184 864 192 V 344 Q 864 352 856 352 H 810" fill="none" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- hàm → Postgres -->
      <line x1="688" y1="312" x2="688" y2="242" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- .env → Agent -->
      <line x1="1008" y1="312" x2="1008" y2="210" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Agent ⇄ Zalo -->
      <line x1="1096" y1="136" x2="1182" y2="136" stroke="#1f4f7a" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="1184" y1="184" x2="1098" y2="184" stroke="#1f4f7a" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-link)"/>

      <!-- ===== Nhãn trên đường đi ===== -->
      <rect x="232" y="112" width="48" height="16" rx="2" fill="#fafafa"/>
      <text x="256" y="124" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tRPC</text>
      <rect x="228" y="156" width="56" height="16" rx="2" fill="#fafafa"/>
      <text x="256" y="168" fill="#575757" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">③ báo</text>

      <rect x="476" y="136" width="88" height="16" rx="2" fill="#fafafa"/>

      <!-- Postgres -->
      <rect x="568" y="88" width="240" height="152" rx="6" fill="#fafafa"/>
      <rect x="568" y="88" width="240" height="152" rx="6" fill="rgba(23,23,23,0.05)" stroke="#575757" stroke-width="1"/>
      <text x="688" y="116" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Postgres</text>
      <text x="688" y="142" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ZaloLink</text>
      <text x="688" y="158" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ZaloLinkCode</text>
      <text x="688" y="174" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">NotificationPreference</text>
      <text x="688" y="198" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">appSetting.zaloBotName</text>
      <text x="688" y="214" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">appSetting.zaloPolledAt</text>

      <!-- Hàm dùng chung (tiêu điểm) -->
      <rect x="568" y="312" width="240" height="80" rx="6" fill="#fafafa"/>
      <rect x="568" y="312" width="240" height="80" rx="6" fill="rgba(0,107,79,0.08)" stroke="#006B4F" stroke-width="1.4"/>
      <text x="688" y="340" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Một hàm chọn kênh</text>
      <text x="688" y="358" fill="#006B4F" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle">kenhSeDungCua → chonKenh</text>
      <text x="688" y="374" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">packages/db/src/kenh-thong-bao.ts</text>

      <rect x="920" y="112" width="176" height="96" rx="6" fill="#fafafa"/>
      <rect x="920" y="112" width="176" height="96" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1"/>

      <text x="1008" y="166" fill="#666666" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">apps/agent · pollZalo</text>
      <text x="1008" y="182" fill="#666666" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">chayNhac</text>

      <rect x="920" y="312" width="176" height="80" rx="6" fill="#fafafa"/>
      <rect x="920" y="312" width="176" height="80" rx="6" fill="rgba(23,23,23,0.02)" stroke="rgba(23,23,23,0.20)" stroke-width="1" stroke-dasharray="4,3"/>

      <text x="1008" y="364" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ZALO_BOT_TOKEN · tuỳ chọn</text>

      <rect x="1184" y="112" width="176" height="96" rx="6" fill="#fafafa"/>
      <rect x="1184" y="112" width="176" height="96" rx="6" fill="rgba(23,23,23,0.03)" stroke="rgba(23,23,23,0.30)" stroke-width="1"/>

      <text x="1272" y="166" fill="#1f4f7a" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">getMe · getUpdates</text>
      <text x="1272" y="182" fill="#1f4f7a" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sendMessage</text>

      <!-- ===== Hai lời bình ===== -->
      <line x1="40" y1="444" x2="40" y2="508" stroke="rgba(23,23,23,0.12)" stroke-width="1"/>
      <text x="52" y="454" fill="#575757" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.08em">AC-6</text>
      <text x="52" y="474" fill="#171717" font-size="12" font-style="italic" font-family="'Lora', serif">API không có vendor client, không đường nào tới Zalo.</text>
      <text x="52" y="492" fill="#575757" font-size="10" font-family="'Geist', sans-serif">«Zalo bật» phía API = <tspan font-family="'Geist Mono', monospace" font-size="9" fill="#171717">zaloBotName</tspan> khác null, do agent ghi mỗi nhịp.</text>
      <text x="52" y="508" fill="#575757" font-size="10" font-family="'Geist', sans-serif">API không đọc token, nên không khai nó trong <tspan font-family="'Geist Mono', monospace" font-size="9" fill="#171717">env.validation.ts</tspan>.</text>

      <line x1="568" y1="444" x2="568" y2="508" stroke="rgba(0,107,79,0.50)" stroke-width="1"/>
      <text x="580" y="454" fill="#006B4F" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.08em">AC-4 · AC-13</text>
      <text x="580" y="474" fill="#171717" font-size="12" font-style="italic" font-family="'Lora', serif">Trang và máy gửi gọi cùng một hàm, nên không thể trả lời</text>
      <text x="580" y="492" fill="#171717" font-size="12" font-style="italic" font-family="'Lora', serif">khác nhau cho cùng một trạng thái.</text>
      <text x="580" y="508" fill="#575757" font-size="10" font-family="'Geist', sans-serif">Bốn thứ: ưu tiên, <tspan font-family="'Geist Mono', monospace" font-size="9" fill="#171717">ZaloLink</tspan>, <tspan font-family="'Geist Mono', monospace" font-size="9" fill="#171717">zaloBotName</tspan>, khớp Slack.</text>

      <!-- ===== Bốn bước ===== -->
      <text x="40" y="548" fill="#575757" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">BỐN BƯỚC</text>

      <text x="40" y="572" fill="#171717" font-size="10" font-weight="600" font-family="'Geist', sans-serif">① Agent ghi appSetting</text>
      <text x="40" y="588" fill="#575757" font-size="10" font-family="'Geist', sans-serif">getMe được → tên bot, giờ poll;</text>
      <text x="40" y="604" fill="#575757" font-size="10" font-family="'Geist', sans-serif">không token hoặc 401 → null.</text>

      <text x="376" y="572" fill="#171717" font-size="10" font-weight="600" font-family="'Geist', sans-serif">② API đọc qua hàm chung</text>
      <text x="376" y="588" fill="#575757" font-size="10" font-family="'Geist', sans-serif">kênh sẽ dùng + cờ lệch cho</text>
      <text x="376" y="604" fill="#575757" font-size="10" font-family="'Geist', sans-serif">một người.</text>

      <text x="712" y="572" fill="#171717" font-size="10" font-weight="600" font-family="'Geist', sans-serif">③ Trang báo</text>
      <text x="712" y="588" fill="#575757" font-size="10" font-family="'Geist', sans-serif">«Thông báo của bạn» hiện lệch;</text>
      <text x="712" y="604" fill="#575757" font-size="10" font-family="'Geist', sans-serif">trang kết nối hiện bot sống hay im.</text>

      <text x="1048" y="572" fill="#171717" font-size="10" font-weight="600" font-family="'Geist', sans-serif">④ Agent đọc qua cùng hàm → gửi</text>
      <text x="1048" y="588" fill="#575757" font-size="10" font-family="'Geist', sans-serif">riêng lúc gửi còn đòi có token;</text>
      <text x="1048" y="604" fill="#575757" font-size="10" font-family="'Geist', sans-serif">Zalo lỗi → ném, không rơi sang Slack.</text>
