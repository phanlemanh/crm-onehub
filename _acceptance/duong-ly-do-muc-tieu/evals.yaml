    expected: "exit 0; _acceptance/duong-ly-do-muc-tieu/rang/ranh-gioi.mjs tự chọn neo (hồ sơ chưa lên onehub → merge-base với origin/onehub; đã lên → cặp sha của merge đưa nó lên): mỗi tệp đổi khớp danh sách Ranh giới của contract.md (đọc từ tệp, không chép), `_acceptance/duong-ly-do-muc-tieu/**`, `docs/**`, PRODUCT-MAP.md, LO-TRINH.html; với _acceptance/config.yaml và apps/app/lib/messages/okr.ts diff chỉ có dòng '+'. Đối chứng hai chiều trên cùng danh sách: một đường giả ngoài ranh giới → 'ngoai ranh gioi: <tệp>'; một dòng '-' giả ở okr.ts → 'sua dong co san: apps/app/lib/messages/okr.ts'."
