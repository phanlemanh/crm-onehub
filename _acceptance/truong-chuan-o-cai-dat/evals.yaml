slug: truong-chuan-o-cai-dat
evals:
  - id: E1
    criterion: AC-1
    executor: test
    layer: unit
    cmd: config:executors.test.tcc_danh_muc
    expected: "exit 0; -t tcc-danh-muc của apps/app/test/truong-chuan-cai-dat.dom.tsx. Đáp án viết sẵn trong test, chép từ danh mục của hợp đồng: 24 khoá theo thứ tự (Thoả thuận 6: name, amount, currency, expectedCloseDate, company, owner; Công ty 8: name, domain, website, phone, email, city, country, owner; Liên hệ 10: firstName, lastName, title, email, phone, linkedin, x, github, company, owner). Với mỗi locale trong {vi, en} và mỗi loại: (1) dựng FieldsSettings thật với kho tRPC giả (fields.list rỗng, fields.layout rút qua bộ đọc đầu ra thật của apps/api/src/fields — round-trip parse, không dựng tay), đọc nhãn các hàng trường chuẩn theo thứ tự DOM; (2) dựng DealOverview, CompanyOverview, ContactOverview thật với bản ghi rút qua bộ đọc đầu ra thật của API, đọc nhãn các hàng của mục Chi tiết theo thứ tự DOM, bỏ hàng Quy đổi của thoả thuận. Hai dãy nhãn khác nhau thì ném 'tcc danh muc: lech <locale> <loai> cai-dat=<json> phieu=<json>'. Số hàng chuẩn ở Cài đặt khác 6/8/10 thì ném 'tcc danh muc: so hang <loai> <n>'. Nhãn nào ở vi là chuỗi tiếng Anh của standard-fields.ts cũ ('Close date', 'Owner', 'First name', 'Stage') thì ném 'tcc danh muc: con tieng anh <chu>'. Cài đặt có hàng 'Mô tả', 'Giai đoạn' hay 'Quy đổi' thì ném 'tcc danh muc: thua <nhan>'. Số cặp đã so khác 6 (2 locale × 3 loại) thì ném 'tcc danh muc: thieu cap <n>'. Đối chứng của thước, cùng fixture: test bỏ phần tử cuối của dãy phiếu trong bản chép rồi so; không ném 'lech' thì ném 'tcc danh muc: thuoc mu'. Chiều đỏ trong lịch sử: trên onehub 03d4842f1 danh sách đọc standard-fields.ts, ở vi hiện 'Close date', ném 'tcc danh muc: con tieng anh Close date' (hoặc thiếu fields.layout trong router, import hỏng)."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [apps/app/components/crm/fields/**, apps/app/components/crm/record-sheet/deal-sheet.tsx, apps/app/components/crm/record-sheet/company-sheet.tsx, apps/app/components/crm/record-sheet/contact-sheet.tsx, "apps/app/app/(app)/[slug]/settings/fields/**", apps/app/lib/messages/crm.ts, packages/db/src/fields-chuan.ts, apps/app/test/truong-chuan-cai-dat.dom.tsx]

  - id: E1b
    criterion: AC-1
    executor: script
    layer: unit
    cmd: config:executors.script.tcc_quet
    expected: "exit 0; bun _acceptance/truong-chuan-o-cai-dat/rang/quet.mjs. Quét bằng TypeScript compiler API (ts.createSourceFile, không regex trên chữ) mọi tệp .ts/.tsx dưới apps/app và apps/api/src: (a) tệp apps/app/components/crm/fields/standard-fields.ts còn trên đĩa thì ném 'tcc quet: con standard-fields.ts'; (b) khai báo import nào có specifier kết thúc bằng 'standard-fields' thì ném 'tcc quet: con nhap standard-fields <tep>:<dong>'; (c) fields-list.tsx và ba phiếu record-sheet/{deal,company,contact}-sheet.tsx không nhập danh mục trường chuẩn (specifier kết thúc bằng 'truong-chuan' hay bằng '@crm/db/fields-chuan') thì ném 'tcc quet: khong doc danh muc <tep>'; (d) apps/api/src/fields/*.ts không nhập '@crm/db/fields-chuan' (hay đường tương đương trong packages/db) thì ném 'tcc quet: may chu khong doc danh muc'. Danh sách tệp ở (c), (d) viết sẵn trong rang; tệp vắng thì ném 'tcc quet: thieu tep <tep>'. Cặp hai chiều cùng fixture: rang chép fields-list.tsx của cây vào thư mục tạm, chèn dòng 'import { STANDARD_FIELDS } from \"./standard-fields\";', quét bản chép: không ném đúng 'con nhap standard-fields' thì ném 'tcc quet: thuoc mu'. Chiều đỏ trong lịch sử: trên onehub 03d4842f1 ném 'tcc quet: con standard-fields.ts'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
