    cmd: config:executors.test.tcc_sap_lai
    expected: "exit 0; -t tcc-sap-lai của apps/app/test/truong-chuan-cai-dat.dom.tsx. Dựng FieldsSettings thật ở vi, thẻ Thoả thuận, quyền quản trị, kho tRPC giả: fields.list có trường tự tạo TEXT khoá 'hang_doi_tac' nhãn 'Hạng đối tác'; fields.layout (round-trip qua bộ đọc đầu ra thật) theo thứ tự mặc định: name, amount, currency, expectedCloseDate, company, owner, hang_doi_tac. Đối chứng dương trước khi kéo: hàng 'Hạng đối tác' không có tay kéo có tên truy cập thì ném 'tcc sap lai: doi chung thieu tay keo'. Kéo bằng bàn phím trên tay kéo của 'Hạng đối tác': focus, Space, ArrowUp ba lần, Space (KeyboardSensor của SortableList). fields.reorder không được gọi đúng một lần thì ném 'tcc sap lai: khong luu'; variables khác đúng {entity:'DEAL', items:[{standard:'name'},{standard:'amount'},{standard:'currency'},{custom:<id của hang_doi_tac>},{standard:'expectedCloseDate'},{standard:'company'},{standard:'owner'}]} thì ném 'tcc sap lai: gui <json>'. Ngay sau khi thả (trước khi kho giả trả lời), thứ tự nhãn trên DOM khác thứ tự vừa gửi thì ném 'tcc sap lai: dom <json>'. Ca lỗi cùng fixture: fields.reorder giả ném TRPCClientError BAD_REQUEST message tiếng Anh 'That order names a field which is not on this record type.'; kéo như trên; sau khi chờ, thứ tự nhãn DOM khác dãy trước khi kéo thì ném 'tcc sap lai: loi khong ve <json>'; toast.error (mock sonner) không được gọi đúng một lần với câu crmMessages('vi') 'Chưa lưu được thứ tự.' thì ném 'tcc sap lai: khong bao loi'; nội dung toast chứa 'That order' thì ném 'tcc sap lai: in cau may chu'. Chiều đỏ trong lịch sử: trên onehub trường chuẩn không có hàng trong danh sách sắp được, ném 'tcc sap lai: doi chung thieu tay keo' (hoặc gửi {entity, ids:[...]} hình dạng cũ)."
