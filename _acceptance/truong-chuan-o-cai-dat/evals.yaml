      - "Đọc dòng cuối: mã 0 kèm 'tcc man: dat' = đạt; mã 2 = không đo được (nêu lý do); mã 1 = lỗi bước có lời 'tcc man: …'."
      - "Mở tám ảnh tcc-cai-dat-{thoa-thuan,cong-ty}-{1280,375}.png và tcc-phieu-{thoa-thuan,cong-ty}-{1280,375}.png, đối chiếu bằng mắt với Expected."
    inputs: [_acceptance/truong-chuan-o-cai-dat/evidence/]
    expected: |
      Dữ liệu dựng qua API thật trong phiên đo (phiên quản trị): một thoả thuận và một công ty đủ giá trị; trường tự tạo DEAL 'Hạng đối tác'. Hai thao tác làm bằng CHUỘT trên màn thật (Playwright page.mouse, không gọi API): kéo tay kéo của 'Hạng đối tác' thả lên trên 'Ngày chốt' ở thẻ Thoả thuận; bấm công tắc của 'Thành phố' ở thẻ Công ty. Sau đó do-man.mjs đọc fields.layout qua API: 'Hạng đối tác' không đứng ngay trên expectedCloseDate thì thoát 1 'tcc man: chuot khong luu thu tu'; city không hidden thì thoát 1 'tcc man: chuot khong luu an'.
      0. tcc-cai-dat-*-1280 (ST-cai-dat-danh-sach): một danh sách duy nhất; hàng trường chuẩn và hàng trường tự tạo cùng khuôn — tay kéo, nhãn, huy hiệu kiểu, dòng phụ, công tắc; không tiêu đề nhóm, không khối gập «Trường chuẩn». do-man.mjs đọc DOM: số phần tử danh sách sắp được (SortableList) khác 1 thì thoát 1 'tcc man: so danh sach <n>'; có phần tử [data-state] của Collapsible bọc hàng trường chuẩn thì thoát 1 'tcc man: khoi gap'; hàng 'Thành phố' của Công ty có công tắc aria-checked khác 'false' thì thoát 1 'tcc man: an khong luu'.
      1. tcc-cai-dat-*-375: cùng màn ở 375; document.documentElement.scrollWidth > 375 thì thoát 1 'tcc man: 375 cuon ngang <the>'.
      2. tcc-phieu-{thoa-thuan,cong-ty}-375: scrollWidth > 375 thì thoát 1 'tcc man: 375 cuon ngang phieu <loai>'.
      3. tcc-phieu-thoa-thuan-1280 (ST-phieu-theo-bo-tri): 'Hạng đối tác' ngay trên 'Ngày chốt'; do-man.mjs đọc nhãn mục Chi tiết, chỉ số lệch thì thoát 1 'tcc man: thu tu <json>'. tcc-phieu-cong-ty-1280: không có hàng 'Thành phố'; còn thì thoát 1 'tcc man: phieu con thanh pho'.
