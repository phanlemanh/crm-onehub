schema_version: 1
feature_slug: truong-tu-tao-o-cai-dat

# DIEU KHOAN CHUNG — ap cho MOI chieu do trong tep nay, E1 den E16, khong tru
# chieu nao. Ban dau chi rang buoc cac chieu chay tren may chu; gap-probe
# 2026-09-18 bat dung lo do: chinh cac chieu doc TEP moi la cho cap hai chieu de
# thanh gia, vi neu script giai duong dan theo goc kho co dinh thi luot dot bien
# sua BAN SAO con script doc CHECKOUT CHINH chua dot bien — khong thay chuoi can
# thay, thoat 0, va ho so ghi "cap hai chieu da chay".
#
# 1. GOC CAY: moi chieu do phai suy goc cay tu vi tri script cua chinh no, va
#    phai nhan goc cay cua luot do qua bien moi truong GOC_CAY khi bien do co.
#    TUYET DOI khong hardcode duong dan tuyet doi cua kho, khong dua vao cwd.
# 2. TU KHAI CHO DUNG: chieu do phai IN ra duong dan tuyet doi cua tung module no
#    vua nap (bo goi y, va voi E3 va E15 la ca LISTING cua bo cao). Hai duong
#    phai cung mot goc cay; khac goc thi thoat ma 2 va noi ro hai goc khac nhau.
#    Mot chieu do tron hai cay la chieu do vo nghia, khong phai gan dung.
# 3. NAP MODULE THAT, khong doc file thanh chuoi roi grep: doc chuoi thi chieu
#    xanh do man dung con chieu do do file, hai thuoc khac lop va cap hai chieu
#    thanh gia. Ngoai le duy nhat la E4, vi vat no do CHINH LA mot tai lieu.
# 4. CHIEU DO TREN MAY CHU (E5..E12, E14, E15) them hai dieu: dung ban sao o
#    CONG_SAO voi APP_URL/API_URL tro vao dung cong do — khong tro ve checkout
#    chinh; va chay chotMayChu() cua scripts/lan-do/tien-de.mjs TREN BAN SAO
#    truoc khi khang dinh, sai cay thi thoat ma 2.
# 5. CAP HAI CHIEU phai khang dinh DUOC THAY thu can thay: no do VA thong diep
#    goi ten dung vat vua bi pha. Do ma khong goi ten la that bai cua thuoc,
#    khong phai mot lan dat.
# 6. TRUONG DO THUOC TAO tren co so du lieu that phai mang nhan bat dau dung
#    tien to "ZZ thu " va phai duoc xoa qua API o cuoi luot, du thuoc do hay
#    xanh. Tien to nay la dau de phep dem nguong bon tuan loai duoc truong rac
#    cua thuoc — bang fieldDefinition khong co cot ghi ai tao.
# Thieu mot dieu nao o tren thi chieu do khong tinh la da chay.
chieu_do_dung_ban_sao: true

evals:

  - id: E1
    criterion: AC-6
    executor: script
    cmd: config:executors.script.trg_bo_goi_y
    expected: >-
      exit 0. Nap bo goi y bang cach IMPORT module that, in duong dan tuyet doi
      cua module da nap, roi khang dinh ba ve cho nhom Cong ty: khong nhan nao
      va khong lua chon nao chua mot trong CHIN chuoi cua bo cu — "AMER",
      "EMEA", "APAC", "Enterprise", "Mid-Market", "SMB", "Lead", "MQL", "SQL";
      VA moi nhan mang it nhat mot ky tu co dau tieng Viet; VA so goi y Cong ty
      do duoc phai BANG SAU. Dem roi vut la lop loi bi cam: con so phai duoc
      khang dinh, khong chi in ra.
      Cap hai chieu tren CUNG fixture: chay lai tren ban sao module da bi chen
      LAI mot goi y "Territory" voi lua chon "AMER" — chieu do phai do VA thong
      diep phai chua dong thoi chuoi "AMER" va nhan "Territory". Khang dinh cua
      chieu do la THAY hai chuoi do, khong phai chi thay ma thoat khac 0.
    paths:
      - "packages/validation/src/field-templates.ts"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-7
    executor: script
    cmd: config:executors.script.trg_bo_goi_y_ba_thuc_the
    expected: >-
      exit 0. Nap module that, in duong dan da nap, roi voi TUNG nhom trong ba
      nhom COMPANY, CONTACT, DEAL khang dinh: so goi y >= 4; moi goi y co nhan
      khong rong; moi nhan mang dau tieng Viet; goi y kieu SELECT co it nhat hai
      lua chon; kieu chi thuoc ba gia tri SELECT, USER, NUMBER. So nhom do duoc
      phai BANG ba.
      Day la chieu SAN, co y de rong. Chieu ghim tung dong la E16 — E2 mot minh
      KHONG chung duoc bo goi y dung noi dung, va khong duoc doc nhu vay.
      Cap hai chieu tren CUNG fixture, hai lan: ban sao da XOA sach nhom DEAL —
      phai do VA thong diep chua chuoi "DEAL"; ban sao da doi mot nhan Ca nhan
      thanh "Segment" — phai do VA thong diep chua chuoi "Segment".
    paths:
      - "packages/validation/src/field-templates.ts"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

