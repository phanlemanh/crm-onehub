        4 luu tru A (archivedAt) roi create "+84901234567" -> thanh cong
      Fixture them: A3 ghi thang phone tho "+84 0907 111 222"; create "0907 111 222" -> Conflict (SQL bo so 0 trung ke).
      CHIEU DO: ban sao caNhanTrungSo so bang chuoi tho thay vi so quoc noi -> dong 1 do voi thong diep ghim
      "trung-tao: so tho cu phai chan"; ban sao SQL khong bo so 0 trung ke -> dong A3 do.

