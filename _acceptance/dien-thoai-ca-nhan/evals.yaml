schema_version: 1
slug: dien-thoai-ca-nhan

evals:
  - id: E1
    criterion: AC-1
    executor: ui-check
    layer: ui-observed
    cmd: config:executors.script.dt_do_man
    steps:
      - "Chay O TIEN CANH, Bash timeout 600000, voi BANG_CHUNG=_acceptance/dien-thoai-ca-nhan/evidence dat tuong minh: lenh cua dt_do_man (mot-luot.sh tu lay cong, tien-de.mjs dung kho do rieng cua cay, do-man.mjs tu chan cay, chup, don)"
      - "Doc dong KET LUAN cuoi: ma 0 = moi dong DUNG; ma 2 = khong do duoc; ma 1 = co dong SAI"
      - "Mo tung anh va doi chieu bang mat voi Expected"
    inputs:
      - _acceptance/dien-thoai-ca-nhan/evidence/
    paths:
      - "apps/app/components/crm/record-sheet/quick-add.tsx"
      - "apps/app/app/(app)/[[]slug]/contacts/**"
      - "apps/app/lib/messages/contacts.ts"
      - "apps/app/lib/messages/record-sheet.ts"
      - "apps/api/src/contacts/**"
      - "packages/validation/src/so-dien-thoai.ts"
      - "packages/db/src/so-dien-thoai.ts"
      - "_acceptance/dien-thoai-ca-nhan/rang/do-man.mjs"
    expected: |
      Lan do man chay ma tran viet truoc 7 o (do-man.mjs MA_TRAN), moi o mot dong "DUNG|SAI <o>: <so lieu tho>" va
      mot anh evidence/<o>.png; dong dem "7/7 o". E1 doc hai o cua AC-1:
        them-tab-1440: tab Ca nhan cua mot cong ty, bam «Them ca nhan»; thu tu nhan cac o trong form (doc theo DOM)
          la Ten, Ho, Dien thoai, Email, Chuc danh; o Dien thoai co type="tel"; go Ten «Lan DT <ma luot>», Dien thoai
          «0901 234 567» (so rieng cua luot), bam them -> doc CSDL do: dung mot ca nhan ten do, companyId = cong ty
          vua mo, phone = "+84901234567", source = "MANUAL" (in phone va source tho)
        them-tab-375: nhu tren o kho 375 (luoi mot cot, thu tu giu nguyen); anh cho thay o Dien thoai trong khung
      Nam o con lai thuoc E16 (AC-2), E17 (AC-9), E18 (AC-10), E19 (AC-4), E20 (AC-8).
      CHIEU DO (pha-thu o S3 tren ban sao quick-add.tsx): bo o Dien thoai -> them-tab-1440 SAI voi thong diep ghim
      "thieu o Dien thoai" va them-tab-375 SAI.

  - id: E2
    criterion: AC-1
    executor: test
    layer: backend-effect
    cmd: config:executors.test.dt_api_tao
    paths:
      - "apps/api/src/contacts/**"
      - "packages/validation/src/so-dien-thoai.ts"
      - "apps/api/test/dien-thoai-ca-nhan.spec.ts"
    expected: |
      dien-thoai-ca-nhan.spec.ts, describe "tao-chuan-hoa": ContactsService.create tren CSDL thu rieng cua luot.
      Ma tran viet truoc 4 dong, moi dong doc lai bang db.contact.findUnique:
        1 phone "0901 234 567", companyId cong ty thu -> phone "+84901234567", companyId giu
        2 phone "+84 28 3812 3456" -> "+842838123456"
        3 phone "+65 6123 4567" -> "+6561234567"
        4 khong truyen phone -> phone null (AC-5)
      CHIEU DO: ban sao create bo buoc chuan hoa (luu nguyen chuoi) -> dong 1 do voi thong diep ghim
      "tao-chuan-hoa: 0901 234 567 phai luu +84901234567".

  - id: E3
    criterion: AC-2
    executor: test
    cmd: config:executors.test.dt_man_form
    paths:
      - "apps/app/app/(app)/[slug]/contacts/create-contact-sheet.tsx"
      - "apps/app/components/crm/record-sheet/quick-add.tsx"
      - "apps/app/lib/messages/contacts.ts"
      - "apps/app/lib/messages/record-sheet.ts"
      - "apps/app/test/dien-thoai-ca-nhan.dom.tsx"
    expected: |
      dien-thoai-ca-nhan.dom.tsx, describe "gui-so" (jsdom, trpc gia ghi lai doi so mutate). Ma tran 4 dong:
        1 QuickAddContact: thu tu nhan Ten, Ho, Dien thoai, Email, Chuc danh; go Ten + Dien thoai "0901 234 567",
          gui -> contacts.create nhan dung mot lan voi phone "0901 234 567" (may chu chuan hoa — E2)
        2 CreateContactSheet: o Dien thoai ngay sau Ho; go "+84 28 3812 3456", gui -> mutate nhan phone do
        3 QuickAddContact chi go Ten -> mutate nhan phone undefined (AC-5)
        4 CreateContactSheet chi go Ten -> mutate nhan phone undefined
      expect chi so gia tri nguyen thuy (luat 35). CHIEU DO: ban sao CreateContactSheet khong truyen phone ->
      dong 2 do voi thong diep ghim "tao-sheet: thieu phone trong contacts.create".

  - id: E4
    criterion: AC-3
    executor: test
    cmd: config:executors.test.dt_doc_so
    paths:
      - "packages/validation/src/so-dien-thoai.ts"
      - "packages/validation/test/so-dien-thoai.spec.ts"
    expected: |
      so-dien-thoai.spec.ts: ma tran viet truoc, so assert = so phan tu.
      describe "doc-so" 18 dong: "0901 234 567", "0901.234.567", "(+84) 901-234-567", "84901234567",
        "+84901234567", "+84 0901 234 567", "+84 (0) 901 234 567", "840901234567" -> ok "+84901234567";
        "028 3812 3456" -> ok "+842838123456"; "+65 6123 4567" -> ok "+6561234567"; "" va "   " -> rong; "abc",
        "12345", "0901 234 56", "+84 12", "1234567890123456", "00901234567" -> sai.
      describe "so-quoc-noi": "+840901234567" (so tho cu co so 0 trung ke) -> "901234567", bang "+84901234567".
      describe "hien-so" 5 dong: "+84901234567" -> "0901 234 567"; "0901.234.567" (tho cu) -> "0901 234 567";
        "+842838123456" -> "028 3812 3456"; "+6561234567" -> "+6561234567"; "may le 123" (khong doc duoc) -> nguyen van.
      describe "manh-tim" 5 dong: "0901234567" -> "901234567"; "+84 901 234 567" -> "901234567"; "234 567" ->
        "234567"; "12" -> null (duoi nguong SO_DIEN_THOAI.timToiThieu); "Lan 0901" -> null (co chu).
      CHIEU DO: ban sao docSoDienThoai bo nhanh "84 khong dau cong" -> dong "84901234567" do voi thong diep ghim
      "doc-so: 84901234567".

