        2 update(A, phone "+84 901 234 567") -> thanh cong, A.phone "+84901234567"
        3 update(A, phone "") -> A.phone null
      Fixture thu hai (ghi thang CSDL): A2 va C2 cung dang hoat dong, cung phone tho "0907.654.321". Them 2 dong:
        4 update(A2, { title: "Truong phong" }) (khong gui phone) -> thanh cong
        5 update(A2, { phone: "0907 654 321" }) (cung so quoc noi voi so hien co cua A2) -> thanh cong, khong Conflict
      CHIEU DO: ban sao update khong bo qua chinh minh (boQua) -> dong 2 do voi thong diep ghim
      "trung-sua: sua ve chinh so cua minh phai duoc"; ban sao luon kiem trung -> dong 5 do voi thong diep ghim
