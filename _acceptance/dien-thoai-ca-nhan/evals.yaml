      {"abc", "12345"}: bam gui -> mutate KHONG duoc goi (dem 0), co phan tu data-slot="field-error" voi
      textContent dung bang chuoi loi rut tu messages vi, document.activeElement la o Dien thoai.
      Doi chung duong cung fixture: go "0901 234 567" -> mutate goi 1 lan, khong co field-error.
      CHIEU DO: ban sao bo kiem truoc khi gui -> dong "abc" do voi thong diep ghim "so-sai: mutate da bi goi".

  - id: E6
    criterion: AC-4
