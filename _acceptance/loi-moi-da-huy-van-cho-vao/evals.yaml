    paths: [packages/auth/src/allow-list.ts, packages/auth/src/invitation-status.ts, packages/auth/test/loi-moi-ket-thuc.spec.ts]

  - id: E7
    criterion: AC-6
    executor: test
    cmd: config:executors.test.lm_trang_thai_that
    expected: "exit 0; bài gieo bốn dòng lời mời vào cơ sở dữ liệu rồi gọi THỦ TỤC DANH SÁCH THẬT của dịch vụ workspace, ghim giá trị RA BẰNG giá trị ĐÃ LƯU: pending ra pending, accepted ra accepted, canceled ra canceled, rejected ra rejected. Bốn ô viết trước, số assert là hằng bốn. Ô thứ hai gieo một chuỗi rác và đòi thủ tục trả unknown, KHÔNG được hoá pending. Bài KHÔNG gọi hàm trợ giúp nào — hàm toStatus cũ đã bị gỡ vì thành mã chết sau khi lộ trình thật thôi gọi nó. Chiều đỏ: cho lộ trình trả pending khi giá trị không đọc được thì bài đỏ, thông điệp in cặp lưu-ra của ô hỏng"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [apps/api/src/workspace/workspace.service.ts, apps/api/test/workspace-thanh-vien.spec.ts]

  - id: E8
    criterion: AC-3
    executor: test
    cmd: config:executors.test.lm_ma_tran_trang_thai
    expected: "exit 0; MA TRẬN TOÀN PHẦN của trục B, SÁU Ô viết trước và SÁU assert, số assert là hằng sáu cấm suy từ runtime: pending CHO VÀO, accepted CHO VÀO, canceled từ chối, rejected từ chối, cancelled của dữ liệu cũ từ chối, chuỗi rác từ chối. Ma trận gọi THẲNG decideSignIn — hàm mà hợp đồng hứa — chứ không gọi hàm trợ giúp conHieuLuc, vì đột biến vào hàm quyết định mới là thứ phép đo phải thấy. Đây là ô mang chiều DƯƠNG của cả hồ sơ — không có nó thì một bản sửa từ chối tất cả mọi người vẫn làm mọi eval khác xanh. Chiều đỏ hai lần, cả hai đột biến vào decideSignIn: đổi điều kiện sang danh sách cấm thì đỏ ở ô rejected; cho điều kiện thành false để từ chối tất cả thì đỏ ở ô pending — vế thứ hai là thứ phân biệt «chặn đúng» với «hỏng hết»"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [packages/auth/src/allow-list.ts, packages/auth/src/invitation-status.ts, packages/auth/test/loi-moi-ket-thuc.spec.ts]

