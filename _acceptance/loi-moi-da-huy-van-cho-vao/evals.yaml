  - id: E5
    criterion: AC-5
    executor: script
    cmd: config:executors.script.lm_tu_vung_goi
    expected: "exit 0; thước giải gói better-auth bằng createRequire NEO VÀO packages/auth/package.json — không neo vào vị trí script, không neo vào gốc kho — rồi đọc kiểu InvitationStatus từ bản vừa giải và so BẰNG NHAU với tập trạng thái kho khai. Tập của kho lấy bằng cách NẠP module qua bun và in giá trị thật ra JSON — không rút bằng regex trên văn bản nguồn, vì regex nuốt im các giá trị có gạch nối, chữ số hay chữ hoa. Thước IN RA đường dẫn thật đã giải, số hiệu bản, và cả hai tập. Cây này có hai bản better-auth: 1.6.25 là bản packages/auth nạp, 1.4.22 chỉ là phụ thuộc bắc cầu của @better-auth/cli. Chiều đỏ ba lần: thêm một giá trị giả vào tập của kho thì mã 1 và in đúng giá trị thừa; trỏ thước sang bản 1.4.22 thì mã 2 TỪ CHỐI ĐO chứ không phải mã 0; gói không giải được cũng mã 2"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [packages/auth/src/invitation-status.ts, packages/auth/package.json, _acceptance/loi-moi-da-huy-van-cho-vao/rang/tu-vung-goi.mjs]

  - id: E6
    criterion: AC-4
    executor: test
    cmd: config:executors.test.lm_ranh_gioi_doc
    expected: "exit 0; bài «ranh giới đọc phân tích chứ không ép kiểu» pass: một dòng mang trạng thái không phân tích được trả về trạng thái unknown CÓ TÊN và một lỗi nêu tên trường, không phải một mặc định im lặng, và lượt đăng nhập không sập. Chiều đỏ: trả lại câu ép kiểu as thì dòng lạ đi thẳng vào quyết định và bài đỏ, thông điệp ghim tên trường không phân tích được"
