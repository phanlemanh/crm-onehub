      <text x="76" y="894" fill="#575757" font-size="9">gọi</text>
      <line x1="140" y1="890" x2="168" y2="890" stroke="#575757" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="176" y="894" fill="#575757" font-size="9">trả về</text>
