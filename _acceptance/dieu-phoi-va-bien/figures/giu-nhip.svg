      <text x="288" y="894" fill="#575757" font-size="9">khoá được gia hạn</text>
      <rect x="412" y="884" width="8" height="12" fill="rgba(23,23,23,0.06)" stroke="#575757" stroke-width="0.8"/>
      <text x="428" y="894" fill="#575757" font-size="9">đang chạy</text>
      <rect x="520" y="884" width="28" height="12" rx="2" fill="rgba(23,23,23,0.02)" stroke="rgba(23,23,23,0.22)" stroke-width="1"/>
      <text x="556" y="894" fill="#575757" font-size="9">khung lặp</text>
      <rect x="640" y="884" width="28" height="12" rx="2" fill="none" stroke="rgba(23,23,23,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="676" y="894" fill="#575757" font-size="9">giả định chưa đo</text>
