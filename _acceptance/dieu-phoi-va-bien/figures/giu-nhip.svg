      <text x="700" y="74" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">giu-nhip.mjs -- &lt;lệnh&gt;</text>

      <rect x="860" y="32" width="200" height="56" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="960" y="56" fill="#171717" font-size="12" font-weight="600" text-anchor="middle">Bộ phát lịch</text>
      <text x="960" y="74" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">phat-lich.mjs · mỗi nhịp</text>

      <rect x="40" y="760" width="640" height="72" rx="6" fill="rgba(23,23,23,0.02)" stroke="rgba(23,23,23,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="52" y="772" width="72" height="16" rx="2" fill="none" stroke="rgba(23,23,23,0.40)" stroke-width="0.8"/>
      <text x="88" y="784" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GIẢ ĐỊNH</text>
      <text x="136" y="785" fill="#171717" font-size="11">Workflow S4 không đi qua lệnh bọc. Khoá <tspan font-family="'Geist Mono', monospace">s4</tspan> giữ nhịp nhờ hook <tspan font-family="'Geist Mono', monospace">PostToolUse</tspan></text>
      <text x="136" y="803" fill="#171717" font-size="11">chạy cho lời gọi công cụ của agent con, trong worktree của phiên.</text>
      <text x="136" y="821" fill="#575757" font-size="11">Vòng này không đo; nếu sai, khoá có thể bị thu giữa một lượt S4 dài hơn 90′.</text>

      <text x="720" y="784" fill="#171717" font-size="13" font-style="italic" font-family="'Lora', serif">Cùng lệnh, không qua lệnh bọc:</text>
      <text x="720" y="804" fill="#171717" font-size="13" font-style="italic" font-family="'Lora', serif">nhịp cũ 20′ → khoá bị thu hồi</text>
      <text x="720" y="822" fill="#575757" font-size="9" font-family="'Geist Mono', monospace">sự kiện thu-hoi · chiều đỏ của AC-9</text>

      <line x1="40" y1="856" x2="1160" y2="856" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>
      <text x="40" y="874" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>
