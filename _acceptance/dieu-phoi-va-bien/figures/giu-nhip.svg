      <text x="752" y="496" fill="#575757" font-size="9" font-family="'Geist Mono', monospace">mỗi 1′ · NHIP.giuNhipMs</text>

      <path d="M 964 532 L 992 532 Q 1000 532 1000 540 L 1000 548 Q 1000 556 992 556 L 968 556" fill="none" stroke="#006B4F" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="1012" y="538" fill="#171717" font-size="10" font-weight="600">hết hạn + nhip mới</text>
      <text x="1012" y="554" fill="#006B4F" font-size="10" font-weight="600">→ gia hạn, không thu hồi</text>
      <text x="1012" y="570" fill="#575757" font-size="9" font-family="'Geist Mono', monospace">sự kiện gia-han</text>

      <path d="M 704 636 L 732 636 Q 740 636 740 644 L 740 652 Q 740 660 732 660 L 708 660" fill="none" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="752" y="652" fill="#171717" font-size="10">lệnh con thoát (mã N)</text>

      <line x1="696" y1="700" x2="144" y2="700" stroke="#575757" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="500" y="678" width="120" height="16" rx="2" fill="#fafafa"/>
      <text x="560" y="690" fill="#171717" font-size="10" text-anchor="middle">trả đúng mã thoát N</text>
      <rect x="186" y="706" width="184" height="16" rx="2" fill="#fafafa"/>
      <text x="278" y="718" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">0 → 0 · 3 → 3 · chuyển SIGTERM</text>

      <rect x="40" y="32" width="200" height="56" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="140" y="56" fill="#171717" font-size="12" font-weight="600" text-anchor="middle">Phiên thợ</text>
      <text x="140" y="74" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">đang giữ khoá s4</text>

      <rect x="320" y="32" width="200" height="56" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="420" y="56" fill="#171717" font-size="12" font-weight="600" text-anchor="middle">Hook chặn S4</text>
      <text x="420" y="74" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">hook-chan-s4.mjs</text>

      <rect x="600" y="32" width="200" height="56" rx="6" fill="#fafafa"/>
      <rect x="600" y="32" width="200" height="56" rx="6" fill="rgba(0,107,79,0.08)" stroke="#006B4F" stroke-width="1.4"/>
