<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1400 648" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <style>
          @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap');
          .pp    { fill: #fafafa; }
          .pw    { fill: #ffffff; }
          .ptint { fill: rgba(0,107,79,0.08); }
          .pi3   { fill: rgba(23,23,23,0.03); }
          .pm10  { fill: rgba(87,87,87,0.10); }
          .ti    { fill: #171717; }
          .tm    { fill: #575757; }
          .ta    { fill: #006B4F; }
          .fm    { fill: #575757; }
          .fa    { fill: #006B4F; }
          .si    { stroke: #171717; }
          .sm    { stroke: #575757; }
          .ss    { stroke: #666666; }
          .sa    { stroke: #006B4F; }
          .si30  { stroke: rgba(23,23,23,0.30); }
          .sa50  { stroke: rgba(0,107,79,0.50); }
          .si40  { stroke: rgba(23,23,23,0.40); }
          .sr    { stroke: rgba(23,23,23,0.12); }
          @media (prefers-color-scheme: dark) {
            .pp    { fill: #171717; }
            .pw    { fill: #212121; }
            .ptint { fill: rgba(47,155,122,0.14); }
            .pi3   { fill: rgba(250,250,250,0.04); }
            .pm10  { fill: rgba(180,180,180,0.12); }
            .ti    { fill: #fafafa; }
            .tm    { fill: #b4b4b4; }
            .ta    { fill: #2f9b7a; }
            .fm    { fill: #b4b4b4; }
            .fa    { fill: #2f9b7a; }
            .si    { stroke: #fafafa; }
            .sm    { stroke: #b4b4b4; }
            .ss    { stroke: #9a9a9a; }
            .sa    { stroke: #2f9b7a; }
            .si30  { stroke: rgba(250,250,250,0.34); }
            .sa50  { stroke: rgba(47,155,122,0.55); }
            .si40  { stroke: rgba(250,250,250,0.44); }
            .sr    { stroke: rgba(250,250,250,0.12); }
          }
        </style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="fm" points="0 0, 8 3, 0 6" fill="#575757"/></marker>
      </defs>

      <rect width="100%" height="100%" class="pp" fill="#fafafa"/>

      <!-- ============ MŨI TÊN (vẽ trước, nằm dưới nút) ============ -->

      <!-- Chuỗi: hook ném → turn.failed → crm.ts → latestTurnFailure -->
      <line x1="360"  y1="176" x2="398"  y2="176" class="sm" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="680"  y1="176" x2="718"  y2="176" class="sm" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="1000" y1="176" x2="1038" y2="176" class="sm" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Bus phân loại: latestTurnFailure toả xuống bốn nhánh -->
      <path d="M 1180 212 L 1180 292 Q 1180 300 1172 300 L 260 300 Q 252 300 252 308 L 252 352"
            fill="none" class="sm" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="548"  y1="300" x2="548"  y2="352" class="sm" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="844"  y1="300" x2="844"  y2="352" class="sm" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="1140" y1="300" x2="1140" y2="352" class="sm" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <circle cx="548"  cy="300" r="3" class="fm" fill="#575757"/>
      <circle cx="844"  cy="300" r="3" class="fm" fill="#575757"/>
      <circle cx="1140" cy="300" r="3" class="fm" fill="#575757"/>

      <!-- Chỗ eval dừng: ngay sau nút hook ném -->
      <line x1="380" y1="96"  x2="380" y2="164" class="sa" stroke="#006B4F" stroke-width="1.4" stroke-dasharray="5,4"/>
      <line x1="380" y1="188" x2="380" y2="252" class="sa" stroke="#006B4F" stroke-width="1.4" stroke-dasharray="5,4"/>

      <!-- Leader của nhãn dưới cùng -->
      <path d="M 1180 476 Q 1160 450 1146 424" fill="none" class="si40" stroke="rgba(23,23,23,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="1146" cy="422" r="2.5" class="ti" fill="#171717"/>

      <!-- ============ NÚT ============ -->

      <!-- hook ném -->
      <rect x="80" y="140" width="280" height="72" rx="6" class="pp" fill="#fafafa"/>
      <rect x="80" y="140" width="280" height="72" rx="6" class="pm10 ss" fill="rgba(87,87,87,0.10)" stroke="#666666" stroke-width="1"/>
      <text x="220" y="182" class="ti" fill="#171717" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">hook ném</text>

      <!-- turn.failed -->
      <rect x="400" y="140" width="280" height="72" rx="6" class="pp" fill="#fafafa"/>
      <rect x="400" y="140" width="280" height="72" rx="6" class="pw si" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="540" y="182" class="ti" fill="#171717" font-size="14" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle">turn.failed</text>

      <!-- crm.ts đọc eveTurnFailure.parse(data).message -->
      <rect x="720" y="140" width="280" height="72" rx="6" class="pp" fill="#fafafa"/>
      <rect x="720" y="140" width="280" height="72" rx="6" class="pw si" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="860" y="166" class="ti" fill="#171717" font-size="13" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle">crm.ts</text>
      <text x="860" y="184" class="tm" fill="#575757" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">đọc</text>
      <text x="860" y="200" class="tm" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">eveTurnFailure.parse(data).message</text>

      <!-- latestTurnFailure ở apps/app -->
      <rect x="1040" y="140" width="280" height="72" rx="6" class="pp" fill="#fafafa"/>
      <rect x="1040" y="140" width="280" height="72" rx="6" class="pw si" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="1180" y="172" class="ti" fill="#171717" font-size="13" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle">latestTurnFailure</text>
      <text x="1180" y="192" class="tm" fill="#575757" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">ở <tspan font-family="'Geist Mono', monospace">apps/app</tspan></text>

      <!-- Bốn nhánh phân loại -->
      <rect x="120" y="356" width="264" height="64" rx="6" class="pp" fill="#fafafa"/>
      <rect x="120" y="356" width="264" height="64" rx="6" class="pi3 si30" fill="rgba(23,23,23,0.03)" stroke="rgba(23,23,23,0.30)" stroke-width="1"/>
      <text x="252" y="393" class="ti" fill="#171717" font-size="13" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle">restricted</text>

      <rect x="416" y="356" width="264" height="64" rx="6" class="pp" fill="#fafafa"/>
      <rect x="416" y="356" width="264" height="64" rx="6" class="pi3 si30" fill="rgba(23,23,23,0.03)" stroke="rgba(23,23,23,0.30)" stroke-width="1"/>
      <text x="548" y="393" class="ti" fill="#171717" font-size="13" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle">rate-limit</text>

      <rect x="712" y="356" width="264" height="64" rx="6" class="pp" fill="#fafafa"/>
      <rect x="712" y="356" width="264" height="64" rx="6" class="pi3 si30" fill="rgba(23,23,23,0.03)" stroke="rgba(23,23,23,0.30)" stroke-width="1"/>
      <text x="844" y="393" class="ti" fill="#171717" font-size="13" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle">credits</text>

      <rect x="1008" y="356" width="264" height="64" rx="6" class="pp" fill="#fafafa"/>
      <rect x="1008" y="356" width="264" height="64" rx="6" class="ptint sa" fill="rgba(0,107,79,0.08)" stroke="#006B4F" stroke-width="1.4"/>
      <text x="1140" y="386" class="ti" fill="#171717" font-size="13" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle">unknown</text>
      <text x="1140" y="404" class="tm" fill="#575757" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">câu trần rơi vào đây</text>

      <!-- Móc ngoặc: ba nhánh đầu không khớp câu trần -->
      <path d="M 120 436 L 120 444 L 976 444 L 976 436" fill="none" class="si30" stroke="rgba(23,23,23,0.30)" stroke-width="1"/>

      <!-- ============ NHÃN BẰNG CHỮ (vẽ sau cùng) ============ -->

      <text x="1356" y="502" class="ti" fill="#171717" font-size="14" font-style="italic" font-family="'Lora', Georgia, serif" text-anchor="end">Grep <tspan font-style="normal" font-family="'Geist Mono', monospace" font-size="12">apps/app</tspan> + <tspan font-style="normal" font-family="'Geist Mono', monospace" font-size="12">apps/api</tspan> + <tspan font-style="normal" font-family="'Geist Mono', monospace" font-size="12">packages</tspan> cho 0 chỗ khớp theo câu trần:</text>
      <text x="1356" y="524" class="ti" fill="#171717" font-size="14" font-style="italic" font-family="'Lora', Georgia, serif" text-anchor="end">câu trần rơi vào <tspan font-style="normal" font-family="'Geist Mono', monospace" font-size="12">unknown</tspan> cả trước lẫn sau vòng.</text>

      <!-- Nhãn chỗ eval dừng -->
      <rect x="328" y="44" width="104" height="44" rx="2" class="pp" fill="#fafafa"/>
      <text x="380" y="62" class="ta" fill="#006B4F" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">EVAL DỪNG</text>
      <text x="380" y="78" class="ta" fill="#006B4F" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">PHẠM VI AC-8</text>

      <!-- Nhãn của móc ngoặc -->
      <rect x="488" y="450" width="120" height="18" rx="2" class="pp" fill="#fafafa"/>
      <text x="548" y="464" class="tm" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">KHÔNG KHỚP</text>

      <!-- ============ CHÚ GIẢI ============ -->
      <line x1="44" y1="560" x2="1356" y2="560" class="sr" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>
      <text x="44" y="582" class="tm" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>

      <rect x="44" y="600" width="24" height="12" rx="4" class="ptint sa" fill="rgba(0,107,79,0.08)" stroke="#006B4F" stroke-width="1.4"/>
      <text x="76" y="610" class="tm" fill="#575757" font-size="10" font-family="'Geist', sans-serif">nhánh câu trần rơi vào — <tspan font-family="'Geist Mono', monospace">unknown</tspan></text>

      <line x1="532" y1="600" x2="532" y2="612" class="sa" stroke="#006B4F" stroke-width="1.4" stroke-dasharray="5,4"/>
      <text x="552" y="610" class="tm" fill="#575757" font-size="10" font-family="'Geist', sans-serif">chỗ eval dừng — phạm vi AC-8</text>

      <line x1="996" y1="606" x2="1020" y2="606" class="sm" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="1028" y="610" class="tm" fill="#575757" font-size="10" font-family="'Geist', sans-serif">bus phân loại của <tspan font-family="'Geist Mono', monospace">latestTurnFailure</tspan></text>
    </svg>
