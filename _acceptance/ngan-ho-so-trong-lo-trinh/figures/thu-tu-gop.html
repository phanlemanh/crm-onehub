<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thứ tự gộp · Dòng thời gian</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #fafafa;
      --color-ink:     #171717;
      --color-muted:   #575757;
      --color-accent:  #006B4F;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 640px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; max-width: 640px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Dòng thời gian · AC-7, AC-8</p>
    <h1>Thứ tự gộp: chờ crm nhận kit 2.27</h1>

    <svg viewBox="0 0 640 424" xmlns="http://www.w3.org/2000/svg">
      <rect width="100%" height="100%" fill="#fafafa"/>

      <line x1="112" y1="24" x2="112" y2="360" stroke="rgba(87,87,87,0.45)" stroke-width="1"/>

      <line x1="104" y1="160" x2="600" y2="160" stroke="rgba(23,23,23,0.45)" stroke-width="1" stroke-dasharray="6,4"/>
      <text x="88" y="164" fill="#171717" font-size="12" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="end">14/10</text>
      <rect x="128" y="148" width="376" height="24" rx="2" fill="#fafafa"/>
      <text x="136" y="164" fill="#171717" font-size="12" font-weight="500" font-family="'Geist', sans-serif">hạn crm: mọi phòng ban dùng thật — LT1 đã lên, ngăn hồ sơ chưa</text>

      <circle cx="112" cy="40" r="4" fill="#171717"/>
      <text x="88" y="44" fill="#171717" font-size="12" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="end">12/10</text>
      <text x="136" y="44" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Vòng làm trên tệp mẫu kit nhánh chính</text>
      <text x="136" y="60" fill="#575757" font-size="10" font-family="'Geist', sans-serif">E7 trả mã đã khai 2, phép đo bản chép của LT1 đỏ</text>

      <circle cx="112" cy="104" r="4" fill="#171717"/>
      <text x="136" y="108" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif">PR mở, CI đỏ ở phép đo LT1</text>
      <text x="136" y="124" fill="#575757" font-size="10" font-family="'Geist', sans-serif">đúng điều kiện</text>

      <circle cx="112" cy="216" r="6" fill="#006B4F"/>
      <text x="88" y="220" fill="#006B4F" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">15/10</text>
      <text x="136" y="220" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif">crm nhận kit 2.27</text>
      <text x="136" y="236" fill="#575757" font-size="10" font-family="'Geist', sans-serif">khối bản 2 ở gốc</text>

      <circle cx="112" cy="280" r="4" fill="#171717"/>
      <text x="136" y="284" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Gộp onehub vào nhánh, ghim lại LT1 và LT1b một làn</text>
      <text x="136" y="300" fill="#575757" font-size="10" font-family="'Geist', sans-serif">E7 trả 0, đọc tệp gốc</text>

      <circle cx="112" cy="344" r="6" fill="#171717"/>
      <text x="136" y="348" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Chủ kho bấm gộp = lên production</text>

      <line x1="40" y1="384" x2="600" y2="384" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>
      <text x="40" y="404" fill="#575757" font-size="10" font-style="italic" font-family="'Lora', serif">Khoảng cách theo thứ tự, không theo số ngày.</text>
    </svg>
  </div>
</body>
</html>
