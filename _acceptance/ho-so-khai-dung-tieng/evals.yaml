    evidence_required: [run_id, exit_code, verifier, verified_at, output, screenshot]

  - id: E10
    criterion: AC-1
    executor: script
    cmd: config:executors.script.hskt_pha_thu
    expected: >-
      exit 0. Chan KHAI SINH cua ca bo thuoc vong nay. Voi TUNG chan E1..E9 va
      E12: dung mot ban sao cay lam viec, pha dung vat that ma chan do khai minh
      do, chay lai chan do do, va khang dinh no DO voi thong diep GHIM dung chuoi
      da khai trong `expected` cua chan do.
      Danh sach dot bien BAT BUOC, khong duoc bo chan nao:
      E1 go ForeignText o company-sheet · E2 go o contact-sheet ·
      E3 doi part nganh ve part khong khai lang · E4 tra headline ve template literal ·
      E5 boc ForeignText quanh part dia danh · E8 ve ForeignText khong dieu kien ·
      E9 boc quanh ca DetailSheetSection · E12 bo thuoc tinh lang khoi ForeignText.
      E6 chay HAI dot bien: (i) doi mot cho goi ve <p lang="en"> viet tay,
      (ii) them mot cho khai tieng o file NGOAI ban kiem ke ghim — ca hai deu
      phai DO va GOI TEN dung file.
      E7 chay BA dot bien, mot cho moi chieu (a)(b)(c) theo dung `expected` cua E7.
      Cong mot dot bien MOI TRUONG, ap cho ca bay chan ui-check: tro APP_URL sang
      mot cong khong co may chu nao → moi chan phai DO ma 2 va GOI TEN CAY, khong
      chan nao duoc in ra mot con so. Day la canh cay, va no da tung hong that o
      kho nay.
      In ra bang: ten chan | da pha gi | ma thoat | thong diep co ghim khong.
      Mot chan xanh ma khong do duoc o day la mot thuoc CHUA TUNG DO — khong phan
      biet duoc "vat lanh" voi "chan do khong di toi cho can do". Day dung la lop
      loi da giet AC-7 cua vong truoc.
      Bat ky chan nao khong do, hoac do ma thong diep khong ghim → exit 1 va GOI
      TEN chan do.
      Chieu do cua CHINH chan nay: chay no tren cay CHUA pha gi ca → moi chan xanh
      → chan nay phai DO voi thong diep "khong chan nao do khi da pha".
    paths:
      - "_acceptance/ho-so-khai-dung-tieng/rang/**"
      - "apps/app/components/crm/record-sheet/**"
      - "apps/app/components/crm/timeline/**"
      - "packages/ui/src/components/foreign-text.tsx"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E11
    criterion: AC-10
    executor: judgment
    question: >-
      Doc vung-khai.json — vat do chinh E1..E5 ket xuat tu DOM that. Moi gia tri
      tieng Anh co nam trong DUNG MOT vung khai lien khong, hay bi boc lam nhieu
      manh? Va co chuoi tieng Viet nao lot vao ben trong pham vi lang=en khong?
    inputs:
      - "_acceptance/ho-so-khai-dung-tieng/evidence/vung-khai.json"
    expected: >-
      Hoi dong doc vung-khai.json — vat do CHINH E1..E5 ket xuat tu DOM that, mot
      muc cho moi gia tri, moi muc co: so phan tu khai lang ben trong gia tri,
      duong dan the cua tung phan tu, va danh sach chuoi tieng Viet lot trong
      pham vi lang=en.
      Cau hoi: co gia tri nao BI CHIA SAI khong — mot doan tieng Anh bi boc lam
      NHIEU manh thay vi mot vung lien, hoac mot cau tieng Viet bi cat lam doi vi
      mot manh tieng Anh giua cau?
      PASS khi: moi gia tri nam trong DUNG MOT vung khai lien, va danh sach chuoi
      tieng Viet lot vao trong la RONG o moi muc.
      Vi sao cau hoi nay may khong tra loi duoc: "co thuoc tinh lang" va "nghe ra
      chu" la hai viec khac nhau. Mot ban cai dat boc TUNG TU deu qua het E1..E9,
      va anh chup giong het ban lanh vi thuoc tinh lang khong ve ra pixel nao.
      Chi con so phan tu tren tung gia tri moi phan biet duoc.
      Hoi dong KHONG duoc doc design doc hay hop dong de cham — cham DAU RA, khong
      cham LOI HUA. Tep vung-khai.json vang hoac rong → UNCERTAIN goi ten tep,
      KHONG suy doan.
    evidence_required: [run_id, verifier, verified_at, output]

