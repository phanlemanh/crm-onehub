    cmd: config:executors.script.hskt_khong_khai_thua
    steps:
      - "Goi canhCay() truoc man dau tien"
      - "Tren cung tam ho so cua E1 va E2, lay ten cong ty, dia danh, chuc danh lien he tu may chu"
      - "Khang dinh TUNG gia tri do KHONG nam trong phan tu khai lang=en"
      - "Chup evidence/khong-khai-thua.png va ket xuat vao evidence/vung-khai.json"
