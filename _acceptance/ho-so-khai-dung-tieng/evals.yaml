  - id: E6
    criterion: AC-6
    executor: script
    cmd: config:executors.script.hskt_mot_duong
    expected: >-
      exit 0. MA TRAN TOAN PHAN, viet truoc: hang so CHIN nam trong chinh tep
      thuoc, chep tu muc "Chin cho" cua hop dong, KHONG nap tu module bi do.
      So khang dinh = 9, khong phai "dem duoc bao nhieu khang dinh bay nhieu".
      Chan do doc cay ma apps/app va khang dinh:
      (a) tim thay DUNG chin cho khai tieng, goi ten tung cho theo file:dong, va
          doi chieu tung duong dan voi ban kiem ke ghim — thieu mot cho thi GOI
          TEN cho thieu, thua mot cho thi GOI TEN cho thua;
      (b) ca chin deu di qua ForeignText nhap tu @crm/ui;
      (c) 0 cho nao trong apps/app con mang thuoc tinh lang viet tay tren the JSX
          o cho goi — xet MOI ten the (span, p, div, li, td, …) va MOI dang gia
          tri (chuoi hang lan bieu thuc lang={...}). Khong duoc chi quet <span
          lang="en"> nguyen van: mot cho sot o hinh dang khac la dung ca ma chan
          nay ton tai de bat.
      Day la chan do CAU TRUC MA, kiem mot bat bien ve hinh dang ma. No KHONG
      thay chan do tren man: E1..E5 moi noi duoc dieu gi hien ra.
      Cap hai chieu (E10 thi hanh, khong chi khai bang chu):
      doi mot cho goi ve <p lang="en"> viet tay → DO, goi ten file:dong; va them
      mot cho khai tieng o file NGOAI danh sach ghim → DO, goi ten file do.
    paths:
      - "apps/app/**"
      - "packages/ui/src/components/foreign-text.tsx"
      - "_acceptance/ho-so-khai-dung-tieng/contract.md"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-7
    executor: test
    cmd: config:executors.test.hskt_component
    expected: >-
      exit 0. Bai kiem VE RA DOM THAT (setup-dom.ts da co san trong packages/ui).
      BA CHIEU, moi chieu duoi mot cong kieu that su soi no — (a) o
      packages/ui/test, (b)(c) o apps/app/test (hop dong tu chinh lan hai):
      (a) ForeignText lang="en" sinh phan tu co lang="en"; ForeignText lang="vi"
          sinh lang="vi" — thuoc tinh theo tham so, khong dong cung mot gia tri;
      (b) MetaLine nhan mot part KHONG khai lang sinh <span> KHONG mang thuoc
          tinh lang, va part co khai {text, lang} sinh <span lang> dung gia tri;
      (c) MetaLine nhan [{text:"X"}, {text:"X", lang:"en"}] sinh ra DUNG MOT
          phan tu mang chu X — khu trung lap chay tren text, khong tren phan tu tho.
      Chieu (b) giu cho ho so lien he khong bi khai sai: cho goi o do truyen
      [contact.title, contact.company?.name] va KHONG phai sua mot chu nao.
      Chieu (c) giu loi hua "khong doi mot pixel nao" cua dac ta UX: khu trung lap
      chay sai thi dong meta ve hai lan cung mot chu khi dia danh trung chu voi
      nganh — mot loi thi giac that ma ca (a) lan (b) deu khong thay.
      Cap hai chieu cho TUNG chieu, thong diep ghim ten chieu:
      bo thuoc tinh lang khoi ForeignText → (a) do;
      khai lang cho moi part cua MetaLine → (b) do;
      khu trung lap tren phan tu tho → (c) do, ghim so phan tu dem duoc.
    paths:
      - "packages/ui/src/components/foreign-text.tsx"
      - "packages/ui/test/khai-tieng.spec.tsx"
      - "apps/app/test/khai-tieng-metaline.spec.tsx"
      - "apps/app/components/crm/record-sheet/record-parts.tsx"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

