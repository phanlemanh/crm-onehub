schema_version: 1
feature_slug: ho-so-khai-dung-tieng

# CANH CAY — dieu kien tien quyet CHUNG cho moi chan ui-check duoi day.
# CLAUDE.md: mot ban dev cua checkout chinh giu cong 3000 thi dev_server.start
# thay cong da co nguoi nghe nen khong dung gi, va chan do se mo man cua CAY
# KHAC roi bao xanh. Loi nay DA xay ra o kho nay. Moi chan ui-check goi
# canhCay() cua _acceptance/man-cai-dat-noi-tieng-viet/rang/canh-cay.mjs TRUOC
# man dau tien, in ten cay da xac nhan, va thoat ma 2 GOI TEN CAY neu dau moc
# khong ve — khong doc mot con so nao.

evals:
  - id: E1
    criterion: AC-1
    executor: ui-check
    layer: ui-observed
    cmd: config:executors.script.hskt_gioi_thieu
    steps:
      - "Goi canhCay() — dat dau moc vao apps/app/public, xin lai qua APP_URL, in ten cay"
      - "Dung may chu theo dev_server.start cua config"
      - "Doc companies.list tu may chu, chon mot cong ty CO truong description"
      - "Mo {APP_URL}/<slug>/companies/<id> voi cookie lang=vi → chup evidence/ho-so-gioi-thieu.png"
      - "Doc DOM, tim doan gioi thieu bang chinh gia tri description lay tu may chu"
      - "Khang dinh phan tu chua doan do co closest('[lang=\"en\"]') khac null"
      - "Ket xuat vung khai cua gia tri nay vao evidence/vung-khai.json"
    expected: >-
      exit 0. CANH CAY truoc tien: dau moc khong ve → ma 2 goi ten cay dang xet,
      khong doc con so nao.
      Gia tri gioi thieu doc TU MAY CHU trong chinh luot chay nay, khong go san
      trong chan do. Mo TAM HO SO that (khong phai man danh sach) roi tim gia tri
      do tren man; phan tu chua no phai co to tien khai lang=en.
      KET XUAT BAT BUOC vao evidence/vung-khai.json, mot muc cho gia tri nay:
      so phan tu khai lang ben trong gia tri, duong dan the cua tung phan tu, va
      danh sach chuoi tieng Viet (neu co) lot trong pham vi lang=en. Day la vat
      DUY NHAT cho E11 doc — thieu tep nay thi E11 khong co dau ra de cham.
      Chan do IN RA ten man da mo va 60 ky tu dau cua gia tri da tim.
      Tap rong (khong cong ty nao co description) la KHONG DO DUOC, ma 2.
      Cap hai chieu tren CUNG fixture: ban sao go ForeignText khoi cho goi
      company-sheet → chan nay phai DO, thong diep ghim chua chuoi "gioi-thieu"
      va 60 ky tu dau cua gia tri chua boc.
    paths:
      - "apps/app/components/crm/record-sheet/company-sheet.tsx"
      - "apps/app/components/detail-sheet.tsx"
      - "packages/ui/src/components/foreign-text.tsx"
    evidence_required: [run_id, exit_code, verifier, verified_at, output, screenshot]

