      font-weight: 400;
      letter-spacing: -0.01em;
      line-height: 1.2;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }

      font-size: 0.875rem;
      line-height: 1.5;
      color: var(--color-muted);
