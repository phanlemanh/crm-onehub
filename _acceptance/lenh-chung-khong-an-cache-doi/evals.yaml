schema_version: 1
slug: lenh-chung-khong-an-cache-doi

evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.kc_suite_cuong_buc
    paths:
      - "_acceptance/config.yaml"
      - "package.json"
      - "_acceptance/lenh-chung-khong-an-cache-doi/rang/**"
    expected: |
      Xanh: khong o cam nao trong suite_keys di qua `turbo run` ma thieu --force, sau
      khi da GIAI ten script qua package.json; VA o cam test cua cong giu ca hai ve —
      `db:test` lan `--force`. Chan in SO LENH DA SOI, phai bang so phan tu suite_keys.
      Chieu do da chay: tren cay TRUOC khi sua, chan tra ma 1 va neu dung
      `executors.test.api` — "bun run db:test && bun run test" giai ra "turbo run test
      --concurrency=1", khong --force. Chieu do THU HAI, tai lap duoc sau khi vong dong:
      ban sao config rut ve `db:test` khoi o cam test -> ma 1, goi ten ve thieu.
      Bao dong gia da bat va da sua: doan theo TEN thi `bun run lint:slop` bi ket oan;
      giai ra la `oxlint` chay thang, khong qua turbo.
      Config khong khai suite_keys -> ma 2.

  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.kc_dan_so_tu_config
    paths:
      - "_acceptance/config.yaml"
      - "_acceptance/lenh-chung-khong-an-cache-doi/rang/**"
    expected: |
      CAP HAI CHIEU goi CHINH chan cua E1 qua tham so `--config <duong dan>`:
      chieu xanh — config that: chan ma 0, va so lenh da soi bang so phan tu suite_keys.
      chieu do — ban sao config them mot o cam an cache vao suite_keys: chan phai ma 1
      va ten o cam vua cay CO trong dau ra.
      Vi sao goi chinh chan cua E1: chieu do cua E1 la mot luot chay LICH SU tren cay
      truoc khi sua, khong tai lap duoc; dung mot chan khac thi ca hai cung xanh trong
      khi nang luc bat loi da mat.
      Chan tu don ban sao ke ca khi hong.



  - id: E5
    criterion: AC-5
    executor: script
    cmd: config:executors.script.kc_lenh_hang_ngay
    paths:
      - "package.json"
      - "_acceptance/lenh-chung-khong-an-cache-doi/rang/**"
    expected: |
      Xanh: `scripts.test` cua package.json goc KHONG chua --force.
      Chieu do: them --force vao ban sao -> ma 1, neu dung ten script.
      Day la chan chong-qua-tay: vong nay de dang "sua cho chac" bang cach ep ca lenh
      hang ngay, va do la thu O Never cam.

  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.api_khong_cache_tron_bo
    paths:
      - "packages/**"
      - "apps/**"
    expected: |
      Xanh: bo test chay CUONG BUC va NOI TIEP, 0 cache, tat ca ma 0.
      Day cung la o cam moi ma AC-1 doi hoi — no vua la lenh chung vua la vat duoc do.

  - id: E7
    criterion: AC-7
    executor: script
    cmd: config:executors.script.kc_mot_bo_thuoc
    paths:
      - "_acceptance/**/rang/**"
    expected: |
      Xanh: khong khoi 12 dong nao cua lat nay trung voi mot chan da co o sau ho so
      truoc.
      Chieu do da chay: chep mot khoi dac 12 dong tu mot chan cu -> ma 1, neu ten ca
      hai file va so dong.
      Tap so sanh rong -> ma 2.

  - id: E8
    criterion: AC-8
    executor: judgment
    cmd: judgment
    inputs:
      - _acceptance/lenh-chung-khong-an-cache-doi/evidence/gia-cuong-buc.md
    expected: |
      Nguoi doc con so thoi gian do duoc cua mot luot cuong buc, roi quyet cai gia ay
      co dang doi lay mot mau xanh co nghia khong. May KHONG cham muc nay.
