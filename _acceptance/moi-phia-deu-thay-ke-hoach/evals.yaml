  - id: E17
    criterion: AC-13
    executor: ui-check
    layer: ui-observed
    cmd: config:executors.design.ui_check
    paths:
      - "apps/app/components/crm/record-sheet/**"
      - "apps/app/app/(app)/[slug]/dashboard-summary.tsx"
      - "apps/app/app/(app)/[slug]/settings/members/**"
      - "packages/ui/**"
    steps:
      - "Dat truoc MOI buoc: APP_URL=http://127.0.0.1:3300 va API_URL=http://127.0.0.1:3301 — dung 127.0.0.1, tranh Invalid origin va cookie ro theo host"
      - "Dung ca hai may chu cua CAY DANG XET: api 3301, app 3300. Kiem cong 3300 va 3301 truoc khi dung — tai nguyen chung; dung ma PID de tat, khong pkill"
      - "CHAN CAY, hai phia: dat mot dau moc vao apps/app/public roi xin lai qua APP_URL; VA doc mot ban ghi moc qua API_URL. Khong nhan lai duoc mot trong hai -> thoat ma 2 va goi ten cay dang xet, KHONG doc anh nao"
      - "KHONG nang quyen bat ky thanh vien nao trong DB, KHONG tao phien cho tai khoan nguoi khac. Viec can quyen quan tri: dung mot tai khoan da la quan tri san trong DB dev; khong co -> thoat ma 2 va noi ro"
      - "Gieo QUA CHINH API o 3301: cong ty One Mount voi mot ke hoach dang chay, mot buoc qua han giao cho nguoi dang nhap va mot buoc han hom nay; mot thanh vien khac cam trich mot ke hoach"
      - "Doc LAI ban ghi vua gieo qua API_URL truoc khi mo man; khong doc lai duoc -> thoat ma 2"
      - "Mo /onehub/companies?record=company:<id> o kho 1440, mo tab «30 ngày đầu», chup evidence/E17-cong-ty-1440.png"
      - "Mo /onehub o kho 1440, chup the Tasks, evidence/E17-tong-quan-1440.png"
      - "Mo /onehub/settings/members bang tai khoan quan tri, mo «Chuyển việc 30 ngày…» cua thanh vien cam trich, chup evidence/E17-chuyen-viec-1440.png"
      - "Lap lai sheet cong ty va tong quan o kho 375, chup evidence/E17-cong-ty-375.png va evidence/E17-tong-quan-375.png"
