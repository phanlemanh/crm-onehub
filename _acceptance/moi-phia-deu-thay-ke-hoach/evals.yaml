      DOT BIEN CHUNG MINH: hien muc ca khi rong -> doi chung am do voi thong diep
      ghim ten muc.

  - id: E13
    criterion: AC-10
    executor: test
    layer: backend-effect
    cmd: config:executors.test.kh2_loc_nguoi_giao
    paths:
      - "apps/api/src/onboarding/**"
      - "apps/api/test/moi-phia-ke-hoach.spec.ts"
    expected: |
      Gieo bon ke hoach dung nhu AC-10. Goi that onboarding.manDanhMuc.
      Ma tran viet truoc:
        1 nguoiGiao [A] -> tap id bang dung {P1, P2}
        2 nguoiGiao [B] -> tap id bang dung {P2}
        3 nguoiGiao [] -> ca bon
        4 dem bo loc nguoiGiao: A 2, B 1
      Doi chung: P3 co buoc DA XONG cua A ma KHONG vao ket qua cua [A] — day la
      quan he «chua xong», khong phai «co mat».
      DOT BIEN CHUNG MINH: tinh nguoiGiao tu moi buoc thay vi buoc chua xong ->
      dong 1 do voi thong diep ghim P3.

  - id: E14
    criterion: AC-10
    executor: test
    layer: ui
    cmd: config:executors.test.kh2_loc_nguoi_giao_man
    paths:
      - "apps/app/app/(app)/[slug]/onboarding/**"
      - "apps/app/test/moi-phia-ke-hoach.dom.tsx"
    expected: |
      Dung that thanh cong cu danh muc trong jsdom voi ban gia tRPC ghi input.
      Mo o loc «Người được giao», chon A. Khang dinh: loi goi danh muc ke tiep mang
      nguoiGiao [A] va boPhan, nguoiCam giu nguyen []; tham so duong dan mang A.
      Doi chung: bo chon A -> loi goi ke tiep mang nguoiGiao [].
      DOT BIEN CHUNG MINH: noi o loc vao khoa nguoiCam -> assert do voi thong diep
      "Expected nguoiGiao [A]".

  - id: E15
    criterion: AC-11
    executor: test
    layer: backend-effect
    cmd: config:executors.test.kh2_cot_nguoi_giao
    paths:
      - "apps/api/src/onboarding/**"
      - "apps/api/test/moi-phia-ke-hoach.spec.ts"
