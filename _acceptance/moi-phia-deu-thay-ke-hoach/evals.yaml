        cot A {P1, P2} · cot B {P2} · cot Chua giao {P3} · cot Xong {P4}
      va tong so the 5 tren 4 ke hoach.
      Doi chung: giao buoc chua xong cua P3 cho B -> P3 roi cot Chua giao, vao cot B.
