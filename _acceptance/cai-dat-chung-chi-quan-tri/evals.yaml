schema_version: 1
slug: cai-dat-chung-chi-quan-tri

evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.ccq_ham_quyen
    paths:
      - "packages/auth/src/**"
      - "packages/auth/test/quyen-cai-dat.spec.ts"
    expected: |
      Ma tran viet truoc bon ca [owner true, admin true, member false, null false]; mot test
      khang dinh tap vai trong ma tran (bo null) bang dung WORKSPACE_ROLES. Dem ca = 4 + 1.
      CHIEU DO: canManageWorkspaceSettings tra true cho member -> do voi thong diep ghim
      "member: true".

  - id: E2
    criterion: AC-2
    executor: test
    layer: backend-effect
    cmd: config:executors.test.ccq_member_bi_chan
    paths:
      - "apps/api/src/settings/**"
      - "packages/auth/src/**"
      - "apps/api/test/cai-dat-chung-chi-quan-tri.spec.ts"
    expected: |
      Qua HTTP that: app dung bang createApp() (co /api/trpc va cau REST /rest), supertest.
      ResearchKeyService.verify, ModelCatalogService.models, BackfillService.run bi spyOn tren
      the hien trong app de dem loi goi. Ma tran viet truoc BON loi x BA thao tac = 12 ca: loi
      (a) phien member qua tRPC, (b) khoa API cua member qua tRPC (header x-api-key, khoa tao
      cho dung user do), (c) phien cua nguoi khong co hang member qua tRPC, (d) phien member qua
      REST (PATCH /rest/settings/research-key|agent-model|archive-retention). Ba thao tac:
      setResearchKey, setAgentModel, setArchiveRetention; moi ca dat gia tri truoc bang ham ghi
      cua @crm/db/settings roi goi voi gia tri KHAC. Moi ca: HTTP 403, thong diep chua cau
      khong-du-quyen cua settings-config (loi member) hoac NOT_A_MEMBER (loi nonMember — lop
      chan san co cua AuthMiddleware); doc thang DB: khoa / model / so ngay van la gia tri
      truoc; bo dem verify, catalog.models, backfill.run deu = 0 sau ca. Dem ca = 12.
      CHIEU DO: bo requireManager o mot thao tac (vd setArchiveRetention) -> do voi thong diep
      ghim loi va ten thao tac; dat requireManager SAU researchKeys.verify -> ca setResearchKey
      do voi thong diep ghim "verify goi 1 lan"; requireManager bo qua role null -> loi (c) do
      voi thong diep ghim "nonMember <thao tac>".

  - id: E3
    criterion: AC-3
    executor: test
    layer: backend-effect
    cmd: config:executors.test.ccq_quan_tri_lam_duoc
    paths:
      - "apps/api/src/settings/**"
      - "packages/auth/src/**"
      - "apps/api/test/cai-dat-chung-chi-quan-tri.spec.ts"
    expected: |
      Cung ma tran ba thao tac cua E2, chay cho BON loi: phien admin, phien owner, khoa API cua
      admin qua tRPC, va phien admin qua REST (12 ca): moi ca HTTP 200, tra loi co canManage true, doc DB thay gia tri moi;
      setResearchKey goi verify dung 1 lan va backfill.run("companies") dung 1 lan;
      setAgentModel goi catalog.models va ghi model ban dem tra. Dem ca = 12. Doi chung duong
      cua E2 tren cung dang fixture.
      CHIEU DO: requireManager dung vi tu sai huong (chi owner) hoac chan het -> admin do voi
      thong diep ghim "admin <thao tac>".

  - id: E4
    criterion: AC-4
    executor: test
    layer: backend-effect
    cmd: config:executors.test.ccq_member_doc_duoc
    paths:
      - "apps/api/src/settings/**"
      - "apps/api/test/cai-dat-chung-chi-quan-tri.spec.ts"
    expected: |
      Phien member goi researchKey, agentModel, archiveRetention, modelCatalog: bon ca HTTP 200;
      researchKey.hint bang maskKey cua khoa da dat va KHAC khoa tho; archiveRetention.days bang
      gia tri da dat. Dem ca = 4.
      CHIEU DO: gan requireManager vao archiveRetention -> do voi thong diep ghim
      "member archiveRetention".

  - id: E5
    criterion: AC-5
    executor: test
    layer: backend-effect
    cmd: config:executors.test.ccq_co_quyen
    paths:
      - "apps/api/src/settings/**"
      - "packages/auth/src/**"
      - "apps/api/test/cai-dat-chung-chi-quan-tri.spec.ts"
    expected: |
      Ma tran viet truoc BON phien x BA query = 12 ca: owner true, admin true, member false
      (HTTP 200, data.canManage dung gia tri); nguoi co phien nhung khong co hang member ->
      HTTP 403 NOT_A_MEMBER, khong co data (khong 500). Dem ca = 12.
      CHIEU DO: agentModel tra canManage true co dinh -> member do voi thong diep ghim
      "member agentModel canManage".

  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.ccq_cong_nghien_cuu
    paths:
      - "apps/app/lib/onboarding.ts"
      - "apps/app/proxy.ts"
      - "packages/validation/src/cong-nghien-cuu.ts"
      - "apps/app/test/onboarding-gate.spec.ts"
    expected: |
      Trong describe "ccq-cong-nghien-cuu": readResearchGate voi {configured:false,canManage:false}
      -> settled; {configured:false,canManage:true} -> required; {configured:false} thieu
      canManage -> settled; {configured:true,canManage:false} -> settled. proxy voi workspace da
      dat ten, chua co khoa, canManage false: mo /<slug>/companies -> khong chuyen huong toi
      /onboarding/research; mo /onboarding/research -> chuyen ve /<slug>; canManage true ->
      /<slug>/companies chuyen toi /onboarding/research. Moi khang dinh ghim ten ca.
      CHIEU DO: readResearchGate bo qua canManage (hanh vi cu) -> ca member do voi thong diep
      ghim "member khong bi day".

  - id: E7
    criterion: AC-7
    executor: test
    cmd: config:executors.test.ccq_man_khoa
    paths:
      - "apps/app/app/(app)/[slug]/settings/research-key.tsx"
      - "apps/app/app/(app)/[slug]/settings/agent-model.tsx"
      - "apps/app/app/(app)/[slug]/settings/archive-retention.tsx"
      - "apps/app/lib/messages/settings.ts"
      - "apps/app/test/cai-dat-chung-khoa.dom.tsx"
    expected: |
      jsdom, tRPC gia. Ma tran viet truoc BA card x HAI vai. canManage false: moi card hien gia
      tri hien tai (chi bao da cam + hint; so ngay trong o; ten model tren nut); nam control
      (o khoa, nut luu khoa, o so ngay, nut luu so ngay, nut chon model) co thuoc tinh disabled;
      moi control co aria-describedby tro toi mot phan tu co that nam TRONG cung card va mang
      cau khongDuQuyen cua card do. canManage true: khong co cau khongDuQuyen nao trong ba card;
      o khoa, o so ngay, nut chon model khong disabled. Moi khang dinh ghim ten card va ten
      control. Dem ca = 3 x 2.
      CHIEU DO: bo disabled o nut chon model -> do voi thong diep ghim "model: nut chon
      disabled"; aria-describedby tro id khong ton tai -> do voi thong diep ghim "mo ta ton tai".

  - id: E8
    criterion: AC-8
    executor: test
    cmd: config:executors.test.ccq_cong_hoi_quy
    paths:
      - "apps/app/lib/onboarding.ts"
      - "apps/app/proxy.ts"
      - "apps/app/test/onboarding-gate.spec.ts"
    expected: |
      Chay toan bo apps/app/test/onboarding-gate.spec.ts sau khi bo dung researchKey gia mang
      canManage (mac dinh true — hinh that cua tra loi); roi git diff -U0 tu merge-base voi
      origin/onehub cua chinh tep do khong co dong bi xoa nao chua "expect(" hay "it(" — khang
      dinh cu khong bi viet lai de vua luat moi.
      CHIEU DO: sua ky vong mot ca cu (vd "sends an onboarded rep with no key") -> lenh do vi
      grep bat dong "-" chua expect.

  - id: E9
    criterion: AC-9
    executor: ui-check
    layer: ui-observed
    cmd: config:executors.design.ui_check
    steps:
      - "Dung api va app cua CAY DANG XET; cong lay tu APP_URL va API_URL; khong sua tep nao trong cay"
      - "CHAN CAY: dat dau moc .svg vao apps/app/public roi xin lai qua APP_URL; xin settings.researchKey qua API_URL va kiem tra tra loi co truong canManage — thieu dau moc hoac thieu truong -> thoat ma 2"
      - "Dang nhap bang `cd apps/api && bun run dev:session <email>` cho mot quan tri va mot thanh vien, dat cookie vao trinh duyet chup"
      - "TIEN DE: settings.researchKey cua quan tri tra configured true (neu khong, quan tri bi day sang /onboarding/research) — sai thi thoat ma 2, KHONG tu ghi khoa vao DB dung chung"
      - "Truoc moi anh: pathname cuoi cua trang phai la /<slug>/settings — lech thi thoat ma 2"
      - "Chup Cai dat › Chung cho thanh vien va cho quan tri o 1440 va 768: evidence/E9-<vai>-<kho>.png"
    inputs:
      - _acceptance/cai-dat-chung-chi-quan-tri/evidence/
    paths:
      - "apps/app/app/(app)/[slug]/settings/research-key.tsx"
      - "apps/app/app/(app)/[slug]/settings/agent-model.tsx"
      - "apps/app/app/(app)/[slug]/settings/archive-retention.tsx"
      - "apps/app/lib/messages/settings.ts"
    expected: |
      Nhin thay tren anh: ban thanh vien co dong ly do o ca ba card Khoa nghien cuu, Luu tru,
      Model va control mo; ban quan tri khong co dong do o ba card va control sang. Kho 768
      khong co gi tran ngang. Thieu anh nao -> khong dat.

  - id: E10
    criterion: AC-6
    executor: test
    layer: backend-effect
    cmd: config:executors.test.ccq_cong_that
    paths:
      - "apps/api/src/settings/**"
      - "packages/validation/src/cong-nghien-cuu.ts"
      - "apps/app/lib/onboarding.ts"
      - "apps/api/test/cai-dat-chung-chi-quan-tri.spec.ts"
    expected: |
      Round-trip writer -> reader: xoa khoa (writeContextDevKey(db, "")), GET that
      /api/trpc/settings.researchKey bang phien member va phien admin, dua body.result.data qua
      congNghienCuu cua @crm/validation/cong-nghien-cuu: member -> settled, admin -> required;
      dat lai khoa -> admin -> settled. apps/app/lib/onboarding.ts phai goi chinh ham nay
      (grep import "@crm/validation/cong-nghien-cuu" trong onboarding.ts co mat). Dem ca = 3.
      CHIEU DO: doi ten truong canManage trong researchKeyOutput -> ca admin do voi thong diep
      ghim "admin bi day".
