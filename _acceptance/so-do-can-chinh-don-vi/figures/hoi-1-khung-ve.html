<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hỏi-1 — khung vẽ cho Sơ đồ</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #fafafa;
      --color-ink:    #171717;
      --color-muted:  #575757;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Lora', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.3;
      color: var(--color-ink); margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Cổng Phạm vi · so-do-can-chinh-don-vi</p>
    <h1>Hỏi-1 — khung vẽ cho Sơ đồ</h1>

    <svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#575757"/></marker>

      </defs>

      <rect width="100%" height="100%" fill="#fafafa"/>

      <text x="40" y="36" fill="#575757" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">HỎI-1 · KHUNG VẼ</text>

      <!-- Nhánh (vẽ trước hộp) -->
      <path d="M380,88 H268 Q260,88 260,96 V176" fill="none" stroke="#006B4F" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <path d="M620,88 H732 Q740,88 740,96 V176" fill="none" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Nhãn nhánh -->
      <rect x="292" y="64" width="56" height="18" rx="2" fill="#fafafa"/>
      <text x="320" y="77" fill="#006B4F" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KHUYÊN</text>
      <rect x="640" y="64" width="72" height="18" rx="2" fill="#fafafa"/>
      <text x="676" y="77" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LỐI KHÁC</text>

      <!-- Điểm quyết -->
      <polygon points="500,40 620,88 500,136 380,88" fill="#fafafa"/>
      <polygon points="500,40 620,88 500,136 380,88" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="500" y="88" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Khung vẽ nào?</text>
      <text x="500" y="104" fill="#575757" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">cho cách xem Sơ đồ</text>

      <rect x="60" y="176" width="400" height="248" rx="6" fill="#fafafa"/>

      <text x="136" y="272" fill="#171717" font-size="12" font-family="'Geist', sans-serif">+~61 KB · ~17 KB gzip</text>

      <rect x="80" y="290" width="44" height="18" rx="2" fill="#ffffff" stroke="rgba(23,23,23,0.50)" stroke-width="0.8"/>
      <text x="102" y="303" fill="#171717" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ĐƯỢC</text>
      <text x="136" y="304" fill="#171717" font-size="12" font-family="'Geist', sans-serif">Nạp lười — chỉ ở cách xem Sơ đồ</text>

      <rect x="80" y="322" width="44" height="18" rx="2" fill="#ffffff" stroke="rgba(23,23,23,0.50)" stroke-width="0.8"/>
      <text x="102" y="335" fill="#171717" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ĐƯỢC</text>
      <text x="136" y="336" fill="#171717" font-size="12" font-family="'Geist', sans-serif">Giấy phép MIT</text>

      <rect x="80" y="354" width="44" height="18" rx="2" fill="none" stroke="rgba(23,23,23,0.40)" stroke-width="0.8" stroke-dasharray="3,2"/>
      <text x="102" y="367" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KÈM</text>
      <text x="136" y="368" fill="#171717" font-size="12" font-family="'Geist', sans-serif">Luật «Block có phần máy» lên cùng PR</text>

      <rect x="80" y="386" width="44" height="18" rx="2" fill="#ffffff" stroke="rgba(23,23,23,0.50)" stroke-width="0.8"/>
      <text x="102" y="399" fill="#171717" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ĐƯỢC</text>
      <text x="136" y="400" fill="#171717" font-size="12" font-family="'Geist', sans-serif">DH5 dùng lại</text>

      <!-- Cột phải: SVG tự vẽ -->
      <rect x="540" y="176" width="400" height="248" rx="6" fill="#fafafa"/>
      <rect x="540" y="176" width="400" height="248" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="560" y="206" fill="#171717" font-size="16" font-weight="600" font-family="'Geist', sans-serif">SVG tự vẽ</text>
      <text x="560" y="226" fill="#575757" font-size="9" font-family="'Geist', sans-serif">tự dựng phần máy</text>

      <text x="582" y="271" fill="#171717" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ĐƯỢC</text>
      <text x="616" y="272" fill="#171717" font-size="12" font-family="'Geist', sans-serif">0 KB thư viện ngoài</text>

      <rect x="560" y="290" width="44" height="18" rx="2" fill="#ffffff" stroke="rgba(23,23,23,0.50)" stroke-width="0.8"/>

      <text x="616" y="304" fill="#171717" font-size="12" font-family="'Geist', sans-serif">Bỏ commit luật «Block có phần máy»</text>

      <rect x="560" y="322" width="44" height="18" rx="2" fill="rgba(23,23,23,0.08)" stroke="rgba(23,23,23,0.30)" stroke-width="0.8"/>
      <text x="582" y="335" fill="#171717" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GIÁ</text>
      <text x="616" y="336" fill="#171717" font-size="12" font-family="'Geist', sans-serif">+~4–6 giờ máy</text>
      <text x="616" y="352" fill="#575757" font-size="9" font-family="'Geist', sans-serif">xếp vị trí · đường uốn · lia/phóng · phím</text>

      <rect x="560" y="370" width="44" height="18" rx="2" fill="rgba(23,23,23,0.08)" stroke="rgba(23,23,23,0.30)" stroke-width="0.8"/>
      <text x="582" y="383" fill="#171717" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GIÁ</text>
      <text x="616" y="384" fill="#171717" font-size="12" font-family="'Geist', sans-serif">DH5 có thể phải thêm thư viện sau</text>

      <!-- Chú giải -->
      <line x1="40" y1="452" x2="960" y2="452" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>
      <text x="40" y="484" fill="#575757" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>

      <rect x="116" y="472" width="24" height="16" rx="3" fill="rgba(0,107,79,0.08)" stroke="#006B4F" stroke-width="1.2"/>
      <text x="148" y="484" fill="#575757" font-size="9" font-family="'Geist', sans-serif">Khuyên</text>
      <rect x="200" y="472" width="24" height="16" rx="3" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="232" y="484" fill="#575757" font-size="9" font-family="'Geist', sans-serif">Lối khác</text>

      <rect x="300" y="471" width="44" height="18" rx="2" fill="#ffffff" stroke="rgba(23,23,23,0.50)" stroke-width="0.8"/>
      <text x="322" y="484" fill="#171717" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ĐƯỢC</text>
      <text x="352" y="484" fill="#575757" font-size="9" font-family="'Geist', sans-serif">điều được</text>
      <rect x="420" y="471" width="44" height="18" rx="2" fill="rgba(23,23,23,0.08)" stroke="rgba(23,23,23,0.30)" stroke-width="0.8"/>
      <text x="442" y="484" fill="#171717" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GIÁ</text>
      <text x="472" y="484" fill="#575757" font-size="9" font-family="'Geist', sans-serif">điều phải trả</text>

      <text x="582" y="484" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KÈM</text>
      <text x="612" y="484" fill="#575757" font-size="9" font-family="'Geist', sans-serif">đi kèm</text>

      <text x="960" y="484" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">AC liên quan · AC-4 · AC-11 · AC-15</text>
    </svg>
  </div>
</body>
</html>
