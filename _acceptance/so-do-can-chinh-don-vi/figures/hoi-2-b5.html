<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hỏi-2 — B5 trong vòng này</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #fafafa;
      --color-ink:    #171717;
      --color-muted:  #575757;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Lora', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.3;
      color: var(--color-ink); margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Cổng Phạm vi · so-do-can-chinh-don-vi</p>
    <h1>Hỏi-2 — B5 làm trong vòng hay hoãn</h1>

      </defs>

      <rect width="100%" height="100%" fill="#fafafa"/>

      <text x="40" y="36" fill="#575757" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">HỎI-2 · B5</text>

      <!-- Nhánh -->
      <path d="M380,88 H268 Q260,88 260,96 V176" fill="none" stroke="#006B4F" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <rect x="292" y="64" width="56" height="18" rx="2" fill="#fafafa"/>
      <text x="320" y="77" fill="#006B4F" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KHUYÊN</text>
      <rect x="640" y="64" width="72" height="18" rx="2" fill="#fafafa"/>

      <text x="500" y="104" fill="#575757" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">trong vòng hay hoãn</text>

      <rect x="60" y="176" width="400" height="224" rx="6" fill="#fafafa"/>

      <rect x="80" y="258" width="44" height="18" rx="2" fill="none" stroke="rgba(23,23,23,0.50)" stroke-width="0.8" stroke-dasharray="3,2"/>
      <text x="102" y="271" fill="#171717" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ĐỔI</text>
      <text x="136" y="272" fill="#171717" font-size="12" font-family="'Geist', sans-serif">Trang đơn vị bỏ cách xem Cây</text>
      <rect x="80" y="290" width="44" height="18" rx="2" fill="none" stroke="rgba(23,23,23,0.50)" stroke-width="0.8" stroke-dasharray="3,2"/>
      <text x="102" y="303" fill="#171717" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ĐỔI</text>
      <text x="136" y="304" fill="#171717" font-size="12" font-family="'Geist', sans-serif">Đường cũ <tspan font-family="'Geist Mono', monospace" font-size="12">?xemOkr=cay</tspan> → Toàn cảnh › Sơ đồ</text>
      <text x="136" y="320" fill="#575757" font-size="9" font-family="'Geist', sans-serif">mở sẵn thẻ của đơn vị đang chọn</text>
      <rect x="80" y="338" width="44" height="18" rx="2" fill="rgba(23,23,23,0.08)" stroke="rgba(23,23,23,0.30)" stroke-width="0.8"/>
      <text x="102" y="351" fill="#171717" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GIÁ</text>
      <text x="136" y="352" fill="#171717" font-size="12" font-family="'Geist', sans-serif">~1 giờ máy ghim lại hoặc nghỉ eval đo cây</text>
      <text x="136" y="368" fill="#575757" font-size="9" font-family="'Geist', sans-serif">2 hồ sơ đã ký · bài theo-don-vi-cay</text>

      <!-- Cột phải: Hoãn B5 -->
      <rect x="540" y="176" width="400" height="224" rx="6" fill="#fafafa"/>
      <rect x="540" y="176" width="400" height="224" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="560" y="206" fill="#171717" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Hoãn B5</text>
      <text x="560" y="226" fill="#575757" font-size="9" font-family="'Geist', sans-serif">tới sau phiên nghiệm thu</text>
      <line x1="540" y1="240" x2="940" y2="240" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>
      <rect x="560" y="258" width="44" height="18" rx="2" fill="rgba(23,23,23,0.08)" stroke="rgba(23,23,23,0.30)" stroke-width="0.8"/>
      <text x="582" y="271" fill="#171717" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GIÁ</text>
      <text x="616" y="272" fill="#171717" font-size="12" font-family="'Geist', sans-serif">Cây hiện toàn công ty dù chọn đơn vị</text>
      <rect x="560" y="290" width="44" height="18" rx="2" fill="rgba(23,23,23,0.08)" stroke="rgba(23,23,23,0.30)" stroke-width="0.8"/>
      <text x="582" y="303" fill="#171717" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GIÁ</text>
      <text x="616" y="304" fill="#171717" font-size="12" font-family="'Geist', sans-serif">Kéo dài tới chậm nhất 04/11</text>

      <!-- Chú giải -->
      <line x1="40" y1="428" x2="960" y2="428" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>
      <text x="40" y="460" fill="#575757" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>
      <rect x="116" y="448" width="24" height="16" rx="3" fill="rgba(0,107,79,0.08)" stroke="#006B4F" stroke-width="1.2"/>
      <text x="148" y="460" fill="#575757" font-size="9" font-family="'Geist', sans-serif">Khuyên</text>
      <rect x="200" y="448" width="24" height="16" rx="3" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="232" y="460" fill="#575757" font-size="9" font-family="'Geist', sans-serif">Lối khác</text>
      <rect x="300" y="446" width="44" height="18" rx="2" fill="none" stroke="rgba(23,23,23,0.50)" stroke-width="0.8" stroke-dasharray="3,2"/>
      <text x="322" y="459" fill="#171717" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ĐỔI</text>
      <text x="352" y="460" fill="#575757" font-size="9" font-family="'Geist', sans-serif">thay đổi</text>
      <rect x="420" y="446" width="44" height="18" rx="2" fill="rgba(23,23,23,0.08)" stroke="rgba(23,23,23,0.30)" stroke-width="0.8"/>
      <text x="442" y="459" fill="#171717" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GIÁ</text>
      <text x="472" y="460" fill="#575757" font-size="9" font-family="'Geist', sans-serif">điều phải trả</text>

      <text x="960" y="460" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">AC liên quan · AC-13 · AC-14</text>
    </svg>
  </div>
</body>
</html>
