<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đường nối trên Sơ đồ</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #fafafa;
      --color-ink:    #171717;
      --color-muted:  #575757;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Lora', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.3;
      color: var(--color-ink); margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Cổng Phạm vi · so-do-can-chinh-don-vi</p>
    <h1>Đường nối trên Sơ đồ — thế nào là «chưa nối lên»</h1>

    <svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg">
      <rect width="100%" height="100%" fill="#fafafa"/>

      <text x="40" y="36" fill="#575757" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">ĐƯỜNG NỐI · SO-DO-DUONG-NOI</text>

      <!-- Đường nối (vẽ trước thẻ) -->
      <path d="M460,104 V132 Q460,140 452,140 H268 Q260,140 260,148 V176" stroke="#575757" stroke-width="1.2" fill="none"/>
      <path d="M500,104 V176" stroke="#575757" stroke-width="1.2" fill="none"/>
      <path d="M540,104 V132 Q540,140 548,140 H772 Q780,140 780,148 V176" stroke="#575757" stroke-width="1.2" fill="none"/>
      <path d="M220,232 V260 Q220,268 212,268 H184 Q176,268 176,276 V304" stroke="#575757" stroke-width="1.2" fill="none"/>
      <path d="M452,232 V260 Q452,268 444,268 H352 Q344,268 344,276 V304" stroke="#575757" stroke-width="1.2" fill="none" stroke-dasharray="5,4"/>

      <!-- Nhãn đường -->
      <rect x="366" y="244" width="64" height="18" rx="2" fill="#fafafa"/>
      <text x="398" y="257" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GÓP CHÉO</text>

      <!-- Thẻ -->
      <rect x="420" y="48" width="160" height="56" rx="6" fill="#fafafa"/>
      <rect x="420" y="48" width="160" height="56" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="500" y="72" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Công ty</text>
      <text x="500" y="88" fill="#575757" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">gốc</text>
      <rect x="180" y="176" width="160" height="56" rx="6" fill="#fafafa"/>
      <rect x="180" y="176" width="160" height="56" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="260" y="200" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bộ phận A</text>
      <text x="260" y="216" fill="#575757" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">bộ phận</text>
      <rect x="420" y="176" width="160" height="56" rx="6" fill="#fafafa"/>
      <rect x="420" y="176" width="160" height="56" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="500" y="200" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bộ phận B</text>
      <text x="500" y="216" fill="#575757" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">bộ phận</text>
      <rect x="708" y="176" width="144" height="56" rx="6" fill="#fafafa"/>
      <rect x="708" y="176" width="144" height="56" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="780" y="200" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">X</text>
      <text x="780" y="216" fill="#575757" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">chưa xếp · cha là Công ty</text>
      <rect x="104" y="304" width="144" height="56" rx="6" fill="#fafafa"/>
      <rect x="104" y="304" width="144" height="56" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="176" y="328" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">A1</text>
      <text x="176" y="344" fill="#575757" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">góp vào A</text>
      <rect x="272" y="304" width="144" height="56" rx="6" fill="#fafafa"/>
      <rect x="272" y="304" width="144" height="56" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="344" y="328" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">A2</text>
      <text x="344" y="344" fill="#575757" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">góp chéo sang B</text>

      <rect x="428" y="304" width="144" height="80" rx="6" fill="#fafafa"/>
      <rect x="428" y="304" width="144" height="80" rx="6" fill="rgba(0,107,79,0.08)" stroke="#006B4F" stroke-width="1.4"/>
      <text x="500" y="328" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">B2</text>
      <text x="500" y="344" fill="#575757" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">chỉ góp nội bộ</text>
      <rect x="452" y="354" width="96" height="20" rx="4" fill="#ffffff" stroke="#006B4F" stroke-width="1"/>
      <text x="500" y="368" fill="#006B4F" font-size="9" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chưa nối lên</text>

      <!-- Chú thích -->
      <text x="512" y="292" fill="#575757" font-size="12" font-style="italic" font-family="'Lora', serif">không dây đi lên</text>

      <!-- Chú giải ba dòng -->
      <line x1="40" y1="408" x2="960" y2="408" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>
      <text x="40" y="432" fill="#575757" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>

      <line x1="140" y1="428" x2="236" y2="428" stroke="#575757" stroke-width="1.2"/>
      <text x="252" y="432" fill="#171717" font-size="12" font-family="'Geist', sans-serif">Nét liền — đơn vị góp vào mục tiêu hay KR của đơn vị cha</text>

      <line x1="140" y1="456" x2="236" y2="456" stroke="#575757" stroke-width="1.2" stroke-dasharray="5,4"/>
      <text x="252" y="460" fill="#171717" font-size="12" font-family="'Geist', sans-serif">Nét đứt — góp vào đơn vị khác không phải cha (bỏ cấp hay chéo nhánh)</text>

      <rect x="140" y="474" width="96" height="20" rx="4" fill="#ffffff" stroke="#006B4F" stroke-width="1"/>
      <text x="188" y="488" fill="#006B4F" font-size="9" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chưa nối lên</text>
      <text x="252" y="488" fill="#171717" font-size="12" font-family="'Geist', sans-serif">Chưa nối lên — có mục tiêu mà không mục tiêu nào góp ra ngoài; góp nội bộ không vẽ dây</text>

      <text x="960" y="432" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">AC liên quan · AC-1 · AC-5</text>
    </svg>
  </div>
</body>
</html>
