schema_version: 1
feature_slug: re-mo-hinh-mac-dinh
evals:
  - id: E1
    criterion: AC-1
    executor: test
    layer: backend-effect
    cmd: config:executors.test.rmh_mac_dinh
    paths: [packages/db/src/settings.ts, apps/agent/agent/lib/model.ts, apps/agent/agent/lib/model-danh-muc.ts, apps/agent/test/rmh-mac-dinh.integration.spec.ts, _acceptance/re-mo-hinh-mac-dinh/evidence/gateway-gemini-3-8-flash-2026-10-15.json]
    expected: "exit 0; Postgres _test thật, danh mục Gateway giả nạp từ tests/fixtures/gateway-models-2026-10-05.json qua datNguonDanhMuc (đường thật). Bảng ba ca VIẾT TRƯỚC trên cùng fixture: (a) xoá hàng appSetting → readAgentModel trả {id: google/gemini-3.8-flash, contextWindowTokens: 1000000, isDefault: true} và hàm chọn model của lượt (model.ts, đường agent_runner dùng) trả id đó; (b) writeAgentModel(<một mã CÓ trong danh mục, khác Gemini>) → lượt dùng đúng mã đó, isDefault false; (c) writeAgentModel(<mã KHÔNG có trong danh mục>) → lượt lùi về google/gemini-3.8-flash. 3 ca = 3 dòng bảng. Id mong đợi của (a) và (c) đọc từ ảnh chụp danh mục của hồ sơ, không chép tay. Chiều đỏ: ca (b) là đối chứng của (a) — mặc định đè lựa chọn thì (b) đỏ ghim tên ca."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E1b
    criterion: AC-2
    executor: test
    layer: backend-effect
    cmd: config:executors.test.rmh_mac_dinh
    paths: [packages/db/src/settings.ts, apps/agent/agent/lib/model.ts, apps/agent/test/rmh-mac-dinh.integration.spec.ts]
    expected: "exit 0; cùng tệp với E1, ca (b): workspace đã chọn một mã có trong danh mục thì lượt dùng đúng mã đó, isDefault false; đối chứng là ca (a) cùng fixture."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-3
    executor: test
    layer: backend-effect
    cmd: config:executors.test.rmh_tai_lieu
    paths: [apps/agent/agent/lib/tai-lieu-config.ts, apps/agent/agent/lib/tai-lieu-model.ts, apps/agent/agent/subagents/tro_ly_kho/agent.ts, apps/agent/agent/subagents/may_soan/agent.ts, apps/agent/test/rmh-tai-lieu.spec.ts]
    expected: "exit 0; ma trận VIẾT TRƯỚC hai đường thật {may_soan, tro_ly_kho}: lấy model của lượt từ CHÍNH định nghĩa subagent (agent.ts, hàm model động như phiên thật gọi), không gọi modelTaiLieu trực tiếp; khẳng định mã model của lượt toEqual google/gemini-3.8-flash, và chạy transformParams của model trả về trên tham số rỗng → providerOptions.gateway.zeroDataRetention === true. 2 đường × 2 khẳng định = 4. Chiều đỏ: cùng đường, bọc model của lượt KHÔNG qua middleware ZDR (bản sao trong bài) → zeroDataRetention vắng, bài ghim tên đường."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-4
    executor: test
    cmd: config:executors.test.rmh_tai_lieu
    paths: [apps/agent/agent/lib/tai-lieu-config.ts, apps/agent/agent/lib/tai-lieu-nop.ts, apps/agent/test/rmh-tai-lieu.spec.ts, _acceptance/re-mo-hinh-mac-dinh/evidence/gateway-gemini-3-8-flash-2026-10-15.json, _acceptance/re-mo-hinh-mac-dinh/opportunity.md]
    expected: "exit 0; ba nguồn phải khớp: (1) giá chủ kho duyệt rút từ dòng «vào 0,75, ra 3,75» của opportunity.md, (2) ảnh chụp danh mục Gateway do rang/chup-danh-muc.ts ghi (pricing.input, pricing.output nhân một triệu, có fetched_at và sha256 thân phản hồi), (3) TAI_LIEU_AGENT.bangGia — so số thực dung sai 1e-9. chiPhiUsd(google/gemini-3.8-flash, 1000000, 2000000) ≈ 8.25; chiPhiUsd(zai/glm-5.2-fast, 1000000, 1000000) ≈ 11.6 (giá GLM giữ); chiPhiUsd(model-la/khong-co, …) === null. Chiều đỏ: bảng giá đảo vào/ra cho Gemini (bản sao trong bài) → lệch với cả hai nguồn, bài ghim tên model."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-5
    executor: test
    cmd: config:executors.test.rmh_judge
    paths: [apps/agent/agent/lib/okr/config.ts, apps/agent-okr/agent/lib/config.ts, apps/agent/test/rmh-judge.spec.ts]
    expected: "exit 0; nhập hai cấu hình trợ lý OKR thật (apps/agent okr/config.ts và apps/agent-okr lib/config.ts): model chấm của mỗi nơi toEqual zai/glm-5.2-fast, và khác DEFAULT_AGENT_MODEL.id (đối chứng: chứng phép so phân biệt được hai model)."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-6
    executor: script
    cmd: config:executors.script.rmh_so_nguong
    paths: [_acceptance/re-mo-hinh-mac-dinh/rang/**, _acceptance/bo-cau-hoi-mau/rang/do-bo-mau.ts, _acceptance/tro-ly-doc-kho/rang/quyet-do.ts, _acceptance/re-mo-hinh-mac-dinh/evidence/do-bo-mau.md, _acceptance/re-mo-hinh-mac-dinh/evidence/cham-tung-cau.jsonl, _acceptance/re-mo-hinh-mac-dinh/evidence/tro-ly-tep.txt, _acceptance/bo-cau-hoi-mau/evidence/cham-tung-cau.jsonl, apps/agent/agent/subagents/tro_ly_kho/**, apps/agent/agent/lib/tai-lieu-*.ts, packages/db/src/settings.ts]
    expected: "exit 0; so-nguong.ts không cờ, không gọi model: đọc evidence/do-bo-mau.md + cham-tung-cau.jsonl của hồ sơ (sinh ở S3 bằng do-bo-mau.ts --do với BCM_EVIDENCE trỏ thư mục hồ sơ), kiểm bằng kiemBangChung của bo-cau-hoi-mau (import), chấm bằng chamTungCau + CHAM_BO_DO.nguong của tro-ly-doc-kho (import) → in bốn chỉ số cạnh ngưỡng; câu lỗi model lượt một không nhiều hơn lượt đã ký của bo-cau-hoi-mau; băm từng tệp mã trợ lý ghi trong evidence khớp cây đang xét, danh sách đó có apps/agent/agent/lib/tai-lieu-config.ts, và TAI_LIEU_AGENT.hoi.maModel của cây (import) là google/gemini-3.8-flash. Exit 0 khi mọi chỉ số đạt theo kết luận bộ chấm và hai điều trên. CHIỀU ĐỎ trên bản sao trong thư mục tạm: đổi đủ câu đạt thành sai để đúng trang tụt dưới 80% → exit 1 ghim «dungTrang»; ba câu đạt thành lỗi model → exit 1 ghim ba mã; sửa một byte một tệp trợ lý trong bản sao cây → exit 1 ghim tên tệp; bản sao evidence thiếu dòng tai-lieu-config.ts trong danh sách tệp → exit 1 ghim tên tệp đó."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
