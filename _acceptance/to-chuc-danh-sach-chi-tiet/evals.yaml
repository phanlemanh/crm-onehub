  - id: E20
    criterion: AC-13
    executor: script
    layer: backend-effect
    cmd: config:executors.script.tcds_khong_hoi_quy
    paths:
      - "apps/api/src/to-chuc/**"
      - "apps/api/src/onboarding/**"
      - "apps/app/app/(app)/[slug]/settings/**"
      - "apps/app/test/**"
