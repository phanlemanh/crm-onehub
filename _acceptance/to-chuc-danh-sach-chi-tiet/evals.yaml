      - "apps/api/test/to-chuc-chi-tiet.spec.ts"
    expected: |
      API that org.addPeople vao phong ban P voi 4 nguoi: a chua co phong ban, b o phong ban Q, c co
      P lam phong ban phu, d co quan ly chon tay. Sau ghi: ca 4 co primaryDepartmentId = P (4); c
      khong con P trong secondaryDepartmentIds (1); d giu managerOverrideId (1); b roi Q (1). Lo co
      nguoi da roi -> 400 cau ghim, OrgPlacement cua ca 4 nguoi truoc = sau. Lo co id khong phai
      thanh vien -> 400.
      CHIEU DO: ban sao ghi tung nguoi ngoai giao dich -> do "lo co nguoi da roi van ghi <n> nguoi".

  - id: E7
