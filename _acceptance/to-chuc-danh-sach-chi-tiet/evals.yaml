schema_version: 1
slug: to-chuc-danh-sach-chi-tiet

evals:
  - id: E1
    criterion: AC-1
    executor: test
    layer: ui
    cmd: config:executors.test.tcds_chon_nut
    paths:
      - "apps/app/app/(app)/[slug]/settings/organization/**"
      - "apps/app/test/to-chuc-chi-tiet.dom.tsx"
    expected: |
      DOM test tren ToChuc voi cay mau 2 bo phan, 3 phong ban, 1 phong ban chua xep, 2 nguoi chua co
      phong ban. Ma tran viet truoc 4 loai nut x [khung chi tiet data-chi-tiet dung loai, nut cay
      aria-current=page dung mot nut, don trong URL dung gia tri] = 12 khang dinh; cong 3 gia tri
      ?don= khong giai duoc (bp:khong-co, pb:<id da luu tru>, "rac") -> khung goc, 0 loi = 3; cong
      4 lan dung MOI tu dia chi trang (khong bam): 4 loai nut x [khung chi tiet dung nut,
      aria-current dung nut] = 8; cong 1 lan dung tu ?loc=chua-truong -> cay con dung K phong ban = 1.
      Tong 24 khang dinh.
      CHIEU DO: (1) ban sao bo nhanh roi-ve-goc -> do "?don=rac: khung chi tiet khong phai goc";
      (2) ban sao giu nut dang chon trong useState -> do "?don=bp:<id> mo ra goc".

  - id: E2
    criterion: AC-2
    executor: test
    layer: ui
    cmd: config:executors.test.tcds_truong_tai_cho
    paths:
      - "apps/app/app/(app)/[slug]/settings/organization/**"
      - "apps/app/test/to-chuc-chi-tiet.dom.tsx"
    expected: |
      DOM: chon phong ban 2 nguoi -> o "Truong phong ban" liet ke dung 2 nguoi do (so sanh tap ten
      voi du lieu cay, khong so dem); chon mot nguoi -> goi org.setHead {kind:department,id,userId}
      dung mot lan. Chon phong ban 0 nguoi -> o truong disabled, FieldDescription dung cau ghim
      "Them nguoi vao phong ban truoc, roi chon truong trong so ho.", Empty co nut "Them nguoi".
      CHIEU DO: ban sao liet ke moi thanh vien trong o truong phong ban -> do "o truong co nguoi
      ngoai phong ban: <ten>".

  - id: E3
