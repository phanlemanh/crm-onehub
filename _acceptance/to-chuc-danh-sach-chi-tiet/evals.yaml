    expected: |
      exit 0. Ma tran viet truoc 10 o x [khong tran, bo cuc dung kho, translate=no tren ten nguoi
      va ten don vi] = 30, cong 2 khang dinh ban phim, cong 4 viec ghi that x [dung sau tai lai] = 4:
      tong 36 (hang KY_MONG trong tep thuoc; lech -> ma 2). Moi o khong co loi hydrate.

  - id: E18
