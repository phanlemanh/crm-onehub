      CHIEU DO: (1) ban sao an dong phu -> do "khong thay 'Dang o'"; (2) ban sao loc theo moi phong
      ban cua nguoi -> do "nguoi phu vang mat trong hop".

  - id: E8
    criterion: AC-5
