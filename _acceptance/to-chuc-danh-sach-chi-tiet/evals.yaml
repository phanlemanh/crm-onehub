      - "apps/api/test/to-chuc-chi-tiet.spec.ts"
    expected: |
      API that: org.setHead tren phong ban roi org.tree -> head.id dung nguoi; nguoi ngoai phong ban
      -> 400 voi cau ghim cua TO_CHUC, cay khong doi. Doi chung duong cua luot 1 van xanh.
      CHIEU DO: goi setHead voi userId khong thuoc phong ban phai do "400".

  - id: E4
    criterion: AC-3
    executor: test
    layer: backend-effect
    cmd: config:executors.test.tcds_gan_phong_ban
    paths:
      - "apps/api/src/to-chuc/**"
      - "apps/api/test/to-chuc-chi-tiet.spec.ts"
    expected: |
      API that org.attachDepartments tren bo phan B co 1 phong ban. Lo [pb chua xep, pb dang o bo
      phan A, pb da o B] -> ca ba thuoc B; thu tu trong B = [pb cu cua B, pb chua xep, pb tu A] dung
      thu tu da gui (3 khang dinh vi tri); A mat pb do. Ba lo tu choi: co pb da luu tru, co id khong
      ton tai, B da luu tru -> moi lo 400 voi cau ghim rieng va anh chup org.tree (toan bo, khong loc
      theo id) truoc = sau (3 x 2). Goi lai cung lo lan hai -> khong doi thu tu.
      CHIEU DO: ban sao ghi tung phong ban ngoai giao dich -> lo co pb da luu tru do "cay doi sau
      lo bi tu choi".

  - id: E5
