      bo phan". Cong: run-log.jsonl cua ba ho so co dong kind=repin moi voi sha la commit cua vong
      nay va evals_exit du eval may.
      CHIEU DO: (1) doi ten mot bai cua noi-bon-nut trong ban guong -> do "mat bai kiem da ky:
      <ten>"; (2) xoa mot expect trong bai da doi -> do "bai <ten> mat khang dinh".

  - id: E21
    criterion: AC-14
    executor: script
    layer: ui
    cmd: config:executors.script.tcds_san_thiet_ke
    paths:
      - "apps/app/app/(app)/[slug]/settings/organization/**"
      - "apps/app/app/(app)/[slug]/settings/onboarding/**"
      - "packages/ui/src/components/**"
      - "_acceptance/to-chuc-danh-sach-chi-tiet/rang/san-thiet-ke.mjs"
    expected: |
      Danh sach tep giao dien RUT TU git diff voi base_commit (*.tsx duoi apps/app), khong viet tay;
      moi tep chay design-gate --mode static exit 0. Quet cac tep duoi settings/organization: khong
      thuoc tinh className tren BAT KY phan tu JSX nao co ten viet hoa (thanh phan) — the HTML trần
      viet thuong chi duoc className bo cuc (flex, grid, gap, p-, m-, w-, min-w-, truncate).
      git diff duoi packages/ui chi cham tep da khai trong ke hoach (rut dong khai tu plan).
      CHIEU DO: tep tam trong ban guong co <Button className="justify-start"> duoi settings/
      organization -> exit 1 voi "className tren Button".
