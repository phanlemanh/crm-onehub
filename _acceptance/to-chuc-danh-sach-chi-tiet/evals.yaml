    expected: |
      Chay lan may (repin-lane.mjs khong --write) cho ba ho so cau-truc-to-chuc,
      sua-luu-tru-dieu-phoi, noi-bon-nut-dieu-phoi tai HEAD: exit 0, moi eval may cua ca ba xanh.
      Voi TUNG bai kiem co ten trong ba ho so (rut tu cmd cua evals.yaml ba ho so, tep + -t): ten
      bai con o HEAD; so loi goi expect trong than bai tai HEAD >= tai base_commit; tap chuoi nguyen
