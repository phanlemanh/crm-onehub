      vien (tap ten = tap thanh vien mau). Chua tich gi -> nut xac nhan disabled.
      CHIEU DO: ban sao goi moveDepartment tung phong ban -> do "attachDepartments goi 0 lan".

  - id: E6
    criterion: AC-4
