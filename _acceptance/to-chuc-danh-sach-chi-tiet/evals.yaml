    expected: |
      API that gieo 6 thanh vien (2 chua co phong ban, 1 da roi), 4 phong ban (2 khong truong, 1
      trong do chua xep). Phep dem doc lap bang Prisma: M, X, K. So voi org.tree.coverage va voi
