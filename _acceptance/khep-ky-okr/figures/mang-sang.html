<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mang sang kỳ kế</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #fafafa;
      --color-ink:    #171717;
      --color-muted:  #575757;
      --color-rule:   rgba(23,23,23,0.12);
      --color-accent: #006B4F;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Lora', Georgia, serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 880px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.01em;
      line-height: 1.2;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 720px; display: block; }
    footer {
      margin-top: 1.5rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--color-rule);
      font-family: var(--font-mono);
      font-size: 0.64rem;
      letter-spacing: 0.08em;
      color: var(--color-muted);
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Hình · Flowchart · khep-ky-okr</p>
    <h1>Mang sang: KR nào đi, KR nào ở lại</h1>

    <svg viewBox="0 0 880 920" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#575757"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#006B4F"/>
        </marker>
      </defs>
      <rect width="100%" height="100%" fill="#fafafa"/>

      <text x="40" y="40" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">MANG SANG · AC-8</text>

      <line x1="360" y1="120" x2="360" y2="152" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="500" y1="208" x2="600" y2="208" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="360" y1="264" x2="360" y2="304" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="360" y1="368" x2="360" y2="424" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="480" y1="480" x2="600" y2="480" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="360" y1="536" x2="360" y2="576" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="500" y1="632" x2="600" y2="632" stroke="#575757" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="360" y1="688" x2="360" y2="728" stroke="#006B4F" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <rect x="200" y="72" width="320" height="48" rx="20" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="360" y="100" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mục tiêu đã công bố ở kỳ chấm/đã đóng</text>

      <polygon points="360,152 500,208 360,264 220,208" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="360" y="204" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Có chu kỳ kế cùng loại,</text>

      <rect x="160" y="304" width="400" height="64" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="360" y="332" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tạo mục tiêu nháp ở kỳ kế:</text>
      <text x="360" y="350" fill="#171717" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">cùng đơn vị, loại, người phụ trách, tên</text>

      <polygon points="360,424 480,480 360,536 240,480" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="360" y="484" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Điểm = 1?</text>

      <rect x="600" y="456" width="240" height="48" rx="20" fill="#ffffff" stroke="#575757" stroke-width="0.8"/>
      <text x="720" y="484" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Không chép</text>

      <polygon points="360,576 500,632 360,688 220,632" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="360" y="628" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Khởi điểm mới = số chốt</text>
      <text x="360" y="644" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">hợp luật kiểu?</text>

      <rect x="600" y="608" width="240" height="48" rx="20" fill="#ffffff" stroke="#575757" stroke-width="0.8"/>
      <text x="720" y="636" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Không chép, liệt tên</text>

      <rect x="160" y="728" width="400" height="64" rx="6" fill="rgba(0,107,79,0.08)" stroke="#006B4F" stroke-width="1.2"/>
      <text x="360" y="764" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chép KR: khởi điểm = số chốt, đích giữ, nguồn tay</text>

      <rect x="532" y="186" width="36" height="14" rx="2" fill="#fafafa"/>
      <text x="550" y="197" fill="#575757" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">không</text>

      <rect x="332" y="276" width="20" height="16" rx="2" fill="#fafafa"/>
      <text x="350" y="288" fill="#575757" font-size="10" font-family="'Geist', sans-serif" text-anchor="end">có</text>

      <rect x="368" y="388" width="60" height="16" rx="2" fill="#fafafa"/>
      <text x="370" y="400" fill="#575757" font-size="10" font-family="'Geist', sans-serif">với mỗi KR</text>

      <rect x="528" y="458" width="24" height="14" rx="2" fill="#fafafa"/>
      <text x="540" y="469" fill="#575757" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">có</text>

      <rect x="316" y="548" width="36" height="16" rx="2" fill="#fafafa"/>
      <text x="350" y="560" fill="#575757" font-size="10" font-family="'Geist', sans-serif" text-anchor="end">không</text>

      <rect x="532" y="610" width="36" height="14" rx="2" fill="#fafafa"/>
      <text x="550" y="621" fill="#575757" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">không</text>

      <rect x="332" y="700" width="20" height="16" rx="2" fill="#fafafa"/>
      <text x="350" y="712" fill="#006B4F" font-size="10" font-family="'Geist', sans-serif" text-anchor="end">có</text>

      <text x="160" y="836" fill="#171717" font-size="12" font-style="italic" font-family="'Lora', Georgia, serif">Mục tiêu gốc, KR và điểm không đổi; căn chỉnh không chép; hai phía nối nhau</text>

      <line x1="40" y1="864" x2="840" y2="864" stroke="rgba(23,23,23,0.12)" stroke-width="0.8"/>
      <text x="40" y="892" fill="#575757" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CHÚ GIẢI</text>
      <rect x="148" y="880" width="32" height="16" rx="8" fill="#ffffff" stroke="#575757" stroke-width="0.8"/>
      <text x="192" y="892" fill="#575757" font-size="9" font-family="'Geist', sans-serif">đầu / cuối</text>
      <polygon points="296,880 312,888 296,896 280,888" fill="#ffffff" stroke="#575757" stroke-width="0.8"/>
      <text x="324" y="892" fill="#575757" font-size="9" font-family="'Geist', sans-serif">câu hỏi</text>
      <rect x="400" y="880" width="32" height="16" rx="3" fill="#ffffff" stroke="#575757" stroke-width="0.8"/>
      <text x="444" y="892" fill="#575757" font-size="9" font-family="'Geist', sans-serif">bước</text>
      <text x="508" y="892" fill="#171717" font-size="11" font-style="italic" font-family="'Lora', Georgia, serif">Aa</text>
      <text x="532" y="892" fill="#575757" font-size="9" font-family="'Geist', sans-serif">ghi chú</text>
    </svg>

    <footer>khep-ky-okr · mang-sang · spec mục 7 · 2026-09-27</footer>
  </div>
</body>
</html>
