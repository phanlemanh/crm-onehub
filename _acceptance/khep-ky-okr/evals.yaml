schema_version: 1
feature_slug: khep-ky-okr
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.kko_luat
    paths: [packages/validation/src/okr-kiem.ts, packages/validation/src/okr-khep.ts, packages/validation/test/okr-kiem.spec.ts]
    expected: "exit 0; BẢNG CA VIẾT TRƯỚC ≥ 24 ca (mỗi luật ≥ 3 bắt, ≥ 3 không bắt), mỗi ca so toEqual cả mảng đầu ra {ma, truong, krIndex} — không đếm phần tử: kr-la-viec bắt «Gọi điện chào mừng…», «goi 50 cuoc» (không dấu), «Launch the new portal» (tiếng Anh), không bắt «Tỷ lệ đối tác gọi lại…», không bắt KR mốc «Hoàn thành chuyển kho»; thieu-khoi-diem bắt tăng tới / phần trăm / giữ trên khởi điểm 0, không bắt mốc khởi điểm 0; dich-bang-khoi-diem bắt giữ trên / giữ dưới / phần trăm đích = khởi điểm, không bắt tăng tới (lượt 3 đã chặn — ca ghi rõ); thieu-doi-trong bắt mục tiêu ba KR tăng tới, không bắt khi có một KR giữ dưới, không bắt khi chỉ một KR. Một ca gộp: mục tiêu hai KR vừa kr-la-viec vừa thieu-khoi-diem → mảng đúng thứ tự khai. Danh sách mã so toEqual với MA_LUAT_OKR theo thứ tự. Bài đọc mã nguồn okr-kiem.ts bằng AST: không import @crm/db, prisma, fetch. CHIỀU ĐỎ: bản sao kiemOkr bỏ bước bỏ dấu → ca «goi 50 cuoc» đỏ, bài in tên ca và đầu ra nhận."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-1
    executor: test
    cmd: config:executors.test.kko_chu
    paths: [apps/app/lib/messages/okr-khep.ts, apps/app/test/messages-guard.spec.ts, apps/app/test/okr-khep-chu.spec.ts]
    expected: "exit 0; okr-khep-chu.spec rút danh sách mã từ MA_LUAT_OKR (không chép tay) và khẳng định mỗi mã có câu hỏi vi và en, vi khác en, vi có dấu; cùng bài cho câu đọc theo loại (bốn câu) và câu «không phải đánh giá nhân sự»; messages-guard xanh với tệp chữ mới. CHIỀU ĐỎ: bản sao tệp chữ thiếu câu en của thieu-doi-trong → bài đỏ in mã thiếu."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-2
    executor: ui-check
    layer: ui-observed
    cmd: config:executors.script.kko_man_chrome
    steps:
      - "Cảnh cây (canh-cay.mjs) trước màn đầu tiên; lệch cây → mã 2"
      - "Gieo qua API thật: chu kỳ quý đang chạy, mục tiêu nháp của phòng ban P1 do trưởng T phụ trách, mục tiêu đã công bố có ba KR tăng tới; đăng nhập dev:session T; dọn theo id ở cuối kể cả khi đỏ"
      - "Mở sheet mục tiêu nháp ở 1440/vi → «Thêm KR», gõ tên «Gọi điện chào mừng mọi đối tác mới», khởi điểm 0, đích 40 → đọc DOM: [data-hoi-chat-luong] dưới ô tên (dòng ghi chú mang biến thể câu hỏi của packages/ui) chứa câu kr-la-viec, dưới ô khởi điểm chứa câu thieu-khoi-diem; nút Lưu không disabled → ảnh buoc-hoi"
      - "Bấm Lưu → hộp thoại đóng, bảng KR có dòng mới"
      - "Mở sheet mục tiêu ba KR tăng tới → cảnh báo thiếu đối trọng hiện trên bảng KR → ảnh buoc-doi-trong; đăng nhập thành viên chỉ đọc, mở cùng sheet → không có cảnh báo"
      - "Ảnh ở 390 cho buoc-hoi; scrollWidth <= innerWidth"
    expected: "Mọi bước đạt; ảnh lưu ở evidence/; câu trên màn bằng câu của tệp chữ cho đúng mã. CHIỀU ĐỎ: --chieu-do chạy với bản sao hộp thoại khoá Lưu khi có câu hỏi → bước Lưu đỏ, script in «câu hỏi chặn lưu»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths:
      - "apps/app/app/(app)/[slug]/okr/**"
      - "apps/app/components/crm/record-sheet/**"
      - "apps/app/lib/messages/okr-khep.ts"
      - "apps/app/lib/messages/okr.ts"
      - "packages/validation/src/okr-kiem.ts"
      - "packages/validation/src/okr-kr.ts"
      - "packages/ui/src/components/field.tsx"
      - "apps/api/src/okr/**"
      - "_acceptance/khep-ky-okr/rang/man-khep-ky.mjs"

  - id: E4
    criterion: AC-2
    executor: script
    layer: backend-effect
    cmd: config:executors.script.kko_man_chrome
    paths: ["apps/app/app/(app)/[slug]/okr/**", packages/validation/src/okr-kiem.ts, apps/api/src/okr/**, _acceptance/khep-ky-okr/rang/man-khep-ky.mjs]
    expected: "Cùng lần chạy với E3: sau Lưu đọc DB có đúng một okrKeyResult mới với tên, khởi điểm 0, đích 40 như gõ; publishObjective của mục tiêu ba KR tăng tới trả thành công và DB đọc status cong-bo — luật không chặn máy chủ. CHIỀU ĐỎ: bản sao createKeyResult gọi kiemOkr và ném khi có mã → bước Lưu đỏ, script in thông điệp máy chủ."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-3
    executor: test
    layer: backend-effect
    cmd: config:executors.test.kko_ra
    paths: [apps/api/src/okr/**, packages/validation/src/okr-khep.ts, packages/validation/src/okr-vet.ts, apps/api/test/okr-khep.spec.ts, apps/api/test/okr-khep-san.ts]
    expected: "exit 0; now đóng băng 2026-11-18 VN, chu kỳ quý 2026-10-01 → 2026-12-31 pha dang-chay: moRa(16/11, 22/11) → đọc DB một dòng okrCuaSoRa đúng hai ngày, người mở; okr.cycles trả cuaSoRa {tuNgay, denNgay}; dongRa → dòng có dongLuc, okr.cycles trả cuaSoRa null; đúng 2 dòng vết mo-ra, dong-ra. Biên giờ VN: now 2026-11-22 23:59 VN còn trong rà, 2026-11-23 00:00 VN ngoài rà. Ma trận từ chối viết trước 7 ca, mỗi ca ghim thông điệp và khẳng định số dòng okrCuaSoRa và okrTrail không đổi: ngày trước startsOn; ngày sau endsOn; tuNgay > denNgay; chồng cửa sổ còn hiệu lực; pha lap-ke-hoach; thành viên thường; vai okr. Đối chứng dương: cùng đầu vào, quản trị, pha dang-chay, không chồng → ghi được. CHIỀU ĐỎ: bản sao moRa bỏ kiểm chồng ngày → ca chồng đỏ, bài in hai cửa sổ."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-4
    executor: test
    layer: backend-effect
    cmd: config:executors.test.kko_doi_dich
    paths: [apps/api/src/okr/**, packages/validation/src/okr-khep.ts, apps/api/test/okr-khep.spec.ts, apps/api/test/okr-khep-san.ts]
    expected: "exit 0; bốn ca viết trước trên KR K của mục tiêu đã công bố, pha dang-chay: (a) trong rà, updateKeyResult(targetValue 80 → 85) không lý do → ghi được, okrDoiDich một dòng {truoc 80, sau 85, ngoaiRa false, cuaSoRaId}; (b) ngoài rà không lý do → 400 câu ghim «Đổi đích ngoài rà giữa kỳ cần lý do», targetValue đọc lại 85, số dòng okrDoiDich không đổi; (c) ngoài rà lý do 9 ký tự → 400; lý do 12 ký tự → ghi được, dòng {truoc 85, sau 80, ngoaiRa true, lyDo, tacGiaUserId}; (d) KR của mục tiêu nháp đổi đích → không dòng okrDoiDich, vết sua-kr như cũ. updateKeyResult chỉ đổi tên hay đơn vị ngoài rà → không đòi lý do, không dòng okrDoiDich. CHIỀU ĐỎ: bản sao lấy ranh giới rà theo UTC → ca now 23:59 ngày cuối rà đỏ, bài in ngày đọc được."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-4
    executor: ui-check
    layer: ui-observed
    cmd: config:executors.script.kko_man_chrome
    steps:
      - "Cùng phiên đo E3; KR của mục tiêu đã công bố, ngoài cửa sổ rà (cửa sổ rà đã đóng)"
      - "Mở «Sửa KR», đổi đích → ô «Lý do đổi đích» hiện, nút Lưu disabled → ảnh buoc-ly-do-dich"
      - "Gõ lý do 12 ký tự → Lưu bật; Lưu → hộp thoại đóng"
      - "Mở lại hộp thoại trong rà (phiên đo mở cửa sổ qua API) → đổi đích không hiện ô lý do; dải «Đang rà giữa kỳ tới <ngày>» hiện ở đầu khu OKR → ảnh buoc-dai-ra"
    expected: "Mọi bước đạt; sau Lưu ngoài rà, DB có một dòng okrDoiDich ngoaiRa true mang đúng lý do đã gõ (script đọc DB). CHIỀU ĐỎ: bản sao hộp thoại luôn ẩn ô lý do → bước đầu đỏ, script in «thiếu ô lý do»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths:
      - "apps/app/app/(app)/[slug]/okr/**"
      - "apps/app/components/crm/record-sheet/**"
      - "apps/app/lib/messages/okr-khep.ts"
      - "apps/app/lib/messages/okr.ts"
      - "packages/validation/src/okr-khep.ts"
      - "packages/validation/src/okr-kr.ts"
      - "apps/api/src/okr/**"
      - "_acceptance/khep-ky-okr/rang/man-khep-ky.mjs"

  - id: E8
    criterion: AC-5
    executor: test
    layer: backend-effect
    cmd: config:executors.test.kko_sang_cham
    paths: [apps/api/src/okr/**, packages/validation/src/okr-khep.ts, packages/validation/src/okr-kr.ts, apps/api/test/okr-khep.spec.ts, apps/api/test/okr-khep-san.ts]
    expected: "exit 0; sàn gieo chu kỳ quý kết thúc 2026-12-31 có mục tiêu cam kết và tham vọng công bố với 20 KR (bảng 20 ô dưới), một mục tiêu nháp có KR, một mục tiêu đã bỏ có KR, cửa sổ rà đang mở. now 2026-12-31 23:00 VN → setCyclePhase cham-diem 400 câu ghim «Sang chấm điểm từ ngày sau ngày cuối của chu kỳ», pha đọc lại dang-chay, 0 dòng okrDiemKr. now 2027-01-01 00:02 VN, một KR nguồn crm chưa có okrSoChup ngày 2026-12-31 → 400 câu ghim «Còn 1 KR nguồn CRM chưa có số ngày cuối», 0 dòng okrDiemKr; KR nguồn api không có bản chụp không gác (đối chứng). Chạy chupSoOkr thật với now 00:05 rồi now 2027-01-01 00:10 VN → ghi được: pha cham-diem, okrCuaSoRa.dongLuc có, okrDiemKr đúng 20 dòng (tập keyResultId bằng tập viết trước, không KR nháp / đã bỏ), mỗi dòng soChot bằng currentValue đọc trước khi chuyển, diem null, thang và phienBanChuongTrinh bằng cấu hình đang áp; MA TRẬN VIẾT TRƯỚC 20 ô diemGoiY so toBe, đủ trong expected này: tăng tới 60→80 chốt 70 → 0.5, chốt 80 → 1, chốt 90 → 1; tăng tới 0→100 chốt 84 → 0.8, chốt 85 → 0.9, chốt 86 → 0.9; giảm xuống 8→2 chốt 5 → 0.5, chốt 2 → 1, chốt 1 → 1; giữ trên đích 90 chốt 85 → 0, chốt 90 → 1, chốt 95 → 1; giữ dưới đích 5 chốt 6 → 0, chốt 5 → 1, chốt 4 → 1; mốc chốt 0 → 0, chốt 1 → 1; phần trăm 20→80 chốt 50 → 0.5, chốt 80 → 0.8, chốt 100 → 1. Lặp cả bộ với chương trình thang 0-100: cùng diemGoiY chuẩn 0–1, thang '0-100'. Ma trận nhảy pha: lap-ke-hoach → cham-diem, dang-chay → da-dong, lap-ke-hoach → da-dong đều 400 câu ghim «Pha đi từng bước». CHIỀU ĐỎ: bản sao sinh dòng cho mọi mục tiêu không lọc status → tập keyResultId đỏ in hai KR thừa; bản sao làm tròn xuống → ô chốt 86 đỏ (0.8); bản sao làm tròn lên → ô chốt 84 đỏ (0.9); bản sao tính phần trăm theo khởi điểm–đích → ô phần trăm chốt 80 đỏ (1); bản sao bỏ điều kiện bản chụp ngày cuối → ca 00:02 đỏ in số dòng okrDiemKr."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E9
    criterion: AC-6
    executor: test
    layer: backend-effect
    cmd: config:executors.test.kko_cham
    paths: [apps/api/src/okr/**, packages/validation/src/okr-khep.ts, apps/api/test/okr-khep.spec.ts, apps/api/test/okr-khep-san.ts]
    expected: "exit 0; chu kỳ pha cham-diem; ba người gọi chamKr hợp lệ (người phụ trách K1 bằng gợi ý; trưởng đơn vị K2 khác gợi ý có lý do 15 ký tự; quản trị K3 bằng gợi ý) → đọc DB okrDiemKr {diem, lyDo, chamBoiUserId, chamLuc} đúng từng lần, đúng 3 dòng vết cham-kr; chấm lại K1 → dòng cập nhật, vết thứ tư. Ma trận từ chối viết trước 7 ca, mỗi ca ghim thông điệp và dòng okrDiemKr không đổi: khác gợi ý không lý do; diem 0.75 ngoài lưới; diem 1.1; thành viên không sửa được KR; vai okr không phụ trách KR; pha dang-chay; pha da-dong. ghiDieuHocDuoc: chữ 40 ký tự → okrNhinLai đọc lại đúng; rỗng → đọc lại rỗng; 2001 ký tự → 400; pha da-dong → 400; người không sửa được mục tiêu → 403; mỗi lần hợp lệ một vết nhin-lai. bangCham: điểm mục tiêu và câu đọc so bảng viết trước 6 ca (tham vọng 0.7 → tot; tham vọng 0.65 → duoi-muc-tot; cam kết 1 → dat; cam kết 0.9 → chua-tron; chưa chấm hết → null; trọng số bật với trọng số 3/1 → trung bình có trọng số); KR có hai dòng okrDoiDich (một trong rà, một ngoài rà) → danh sách đổi đích ngoài rà có đúng một dòng. Lặp ma trận chấm trên chương trình thang 0–100 (sang pha chấm với cấu hình 0-100): chamKr gửi 80 → diem đọc lại 0.8 chuẩn, bangCham trả 80; gửi 85 → 400 ngoài lưới; gửi 0.8 → 400 ngoài lưới. CHIỀU ĐỎ: bản sao chamKr không so với diemGoiY → ca không lý do đỏ, bài in dòng đã ghi; bản sao lưu điểm thang 0–100 không chia → ca gửi 80 đỏ in diem 80."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E10
    criterion: AC-7
    executor: test
    layer: backend-effect
    cmd: config:executors.test.kko_dong
    paths: [apps/api/src/okr/**, apps/agent/agent/lib/okr-chup.ts, packages/validation/src/okr-khep.ts, apps/api/test/okr-khep.spec.ts, apps/api/test/okr-khep-san.ts]
    expected: "exit 0; chu kỳ pha cham-diem, P1 còn 2 KR chưa chấm, P2 còn 1 → setCyclePhase da-dong 400 câu ghim «Còn 3 KR chưa chấm»; bangCham trả chuaCham [{P1, 2}, {P2, 1}]; pha đọc lại cham-diem. Chấm hết → da-dong ghi được. Ở da-dong: MA TRẬN VIẾT TRƯỚC mười bảy thủ tục ghi (mười một của lượt 3, guiCapNhat, ghiSoKr, chamKr, ghiDieuHocDuoc, moRa, dongRa; mangSang không khoá vì ghi sang chu kỳ kế — E11), mỗi thủ tục 400 câu ghim khoá pha và bản ghi đích đọc lại không đổi; chupSoOkr chạy với now sau ngày cuối → 0 dòng okrSoChup mới cho KR của chu kỳ. moLaiKy: không lý do → 400; lý do 9 ký tự → 400; thành viên thường → 403; quản trị lý do 20 ký tự → pha cham-diem, một vết mo-lai-ky với note bằng lý do, mọi okrDiemKr.soChot và diemGoiY đọc lại không đổi; moLaiKy khi pha cham-diem → 400. Đóng lại → da-dong. CHIỀU ĐỎ: bản sao setCyclePhase không đếm diem null → lần đóng đầu đỏ, bài in pha đọc được."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E11
    criterion: AC-8
    executor: test
    layer: backend-effect
    cmd: config:executors.test.kko_mang_sang
    paths: [apps/api/src/okr/**, packages/validation/src/okr-khep.ts, apps/api/test/okr-khep.spec.ts, apps/api/test/okr-khep-san.ts]
    expected: "exit 0; mục tiêu M (công bố, cam kết, hai người tham gia, một căn chỉnh) ở quý 4 pha cham-diem với bốn KR: A điểm 1; B tăng tới 60→80 chốt 78 điểm 0.9; C mốc chưa xong điểm 0; D tăng tới 10→20 chốt 25 người chấm 0.8; quý 1 cùng loại pha lap-ke-hoach. mangSang(M) → quý 1 có đúng một mục tiêu nháp: cấp, đơn vị, kind, ownerUserId, tập người tham gia, title, whyNow bằng M; 0 okrAlignment; KR đúng tập {B, C} viết trước với startValue = soChot, targetValue giữ, currentValue = startValue, source tay, dueOn null; đầu ra khongChep = [{D, 'dich-phai-lon-hon-khoi-diem'}]; okrMangSang một dòng nối M → M'; bangCham(M) và objective(M') trả liên kết; M, bốn KR và bốn okrDiemKr đọc lại byte-cho-byte như trước; một vết mang-sang. Lần hai → 400 câu ghim, số mục tiêu quý 1 không đổi. Ma trận từ chối 4 ca: không có chu kỳ kế; chu kỳ kế da-dong; trần chan đã đầy ở đơn vị đích; người không sửa được M — mỗi ca 0 dòng mới ở okrObjective, okrKeyResult, okrMangSang. Mang sang từ quý 4 pha da-dong → ghi được (đối chứng). CHIỀU ĐỎ: bản sao chép cả KR điểm 1 → tập KR đỏ in A thừa."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E12
    criterion: AC-9
    executor: test
    layer: backend-effect
