      - "packages/db/src/tai-lieu-quyen.ts"
      - "apps/api/test/tai-lieu-xac-minh.spec.ts"
    expected: |
      Caller tRPC that, Postgres that. Ma tran 5 nguoi x 2 trang x 2 thao tac (dat, go) = 20 o, ky
      vong tung o viet truoc trong bang: chu trang/owner/admin tren trang thay duoc -> ok, cot
      xacMinhDen doi dung gia tri, mot TaiLieuSuKien loai XAC_MINH moi lan; thanh vien khac va vai
