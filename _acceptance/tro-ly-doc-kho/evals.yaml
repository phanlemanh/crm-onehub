      TAI_LIEU_HOI.tuChoi; (3) cau thoa thuan -> khong co hang TaiLieuHoi moi, tin la chu agent goc
      (doi chung duong). Dem zaloHoi tinh tran: dung 3, khong hang TaiLieuHoi kenh CRM nao. Them:
      goi execute cua read_page tu phien goc purpose zalo (khong phai phien con) -> nem; agent goc
      goi tro_ly_kho hai lan trong cung cau Zalo -> van dung mot hang. Dem 10 khang dinh. CHIEU DO: ban sao de message.completed gui chu agent goc -> do ghim
      "tlk-zalo: GOC-VIET-ABC lot ra"; ban sao bo kiem phien con trong read_page -> do ghim
      "tlk-zalo: read_page chay ngoai tro_ly_kho".

  - id: E9
