      trang -> taiLieu.sucKhoe tra trang do trong quaHanXacMinh (doi chung duong). Dem 20 o + 1.
      CHIEU DO: ban sao bo kiem quyen -> do ghim "tlk-xac-minh: member-khac dat duoc"; ban sao
