  - id: E7
    criterion: AC-7
    executor: test
    layer: backend-effect
    cmd: config:executors.test.tlk_hoi_api
    paths:
      - "apps/api/src/tai-lieu/**"
      - "packages/db/src/tai-lieu-hoi.ts"
      - "packages/validation/src/tai-lieu-hoi.ts"
      - "apps/api/test/tai-lieu-hoi.spec.ts"
    expected: |
      Caller tRPC that, Postgres that. (1) member goi taiLieu.hoi({cauHoi}) -> mot hang TaiLieuHoi
      DANG_HOI kenh CRM VA mot AgentTask loai "hoi-kho" tro hang do, trong cung giao dich (lam hong
      lan ghi AgentTask -> khong con hang TaiLieuHoi nao); (2) hoiKetQua cua hang DANG_HOI ->
      {trangThai:"DANG_HOI"}; ghi ket qua TRA_LOI hop le qua ham ghi cua agent -> hoiKetQua tra
      cau va trich parse bang khuon chung; (3) nguoi khac goi hoiKetQua cua hang do -> NOT_FOUND;
