    expected: |
      TZ=Asia/Ho_Chi_Minh. Postgres that, Zalo gia ghi lai tin gui di, model gia tat dinh cho agent
      goc va tro_ly_kho. Ba tin viet truoc tu mot nguoi da noi: (1) cau quy dinh -> agent goc goi
