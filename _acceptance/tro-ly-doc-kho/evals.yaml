      - "Buoc 1 (1440): Kho -> tab 'Hỏi' -> trang thai trong -> anh tlk-hoi-trong-1440.png"
      - "Buoc 2 (1440): go 'quy dinh hoa hong tang 2', Enter -> 'Trợ lý AI đang đọc kho…' roi cau tra loi co trich -> anh tlk-hoi-tra-loi-1440.png; bam ten trang trong trich -> URL la /<ws>/tai-lieu/quy-dinh-hoa-hong-doi-tac"
      - "Buoc 3 (1440): hoi cau ma model gia nop khong-biet -> cau tu choi + Trang gan nhat -> anh tlk-hoi-tu-choi-1440.png"
      - "Buoc 4 (1440): hoi cau trich trang qua han -> Alert qua han -> anh tlk-hoi-qua-han-1440.png"
      - "Buoc 5 (390): cau tra loi buoc 2 -> khong cuon ngang -> anh tlk-hoi-tra-loi-390.png"
      - "Buoc 6 (1440): bam 'Báo sai', ghi chu, gui -> nut thanh 'Đã báo sai' -> anh tlk-bao-sai-1440.png"
    paths:
      - "apps/app/app/(app)/[slug]/tai-lieu/**"
      - "packages/ui/src/components/**"
      - "_acceptance/tro-ly-doc-kho/rang/man-hoi.mjs"
