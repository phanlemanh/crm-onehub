name: Tín hiệu kéo về

on:
  schedule:
    - cron: "0 21 * * *"
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: tin-hieu-keo-ve
  cancel-in-progress: false

jobs:
  keo:
    name: Kéo tín hiệu về nhánh hàng chờ
    if: github.repository == 'phanlemanh/crm-onehub'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: onehub
          fetch-depth: 0
          token: ${{ secrets.TIN_HIEU_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # @crm/db chạy prisma generate lúc cài, và prisma.config đòi DATABASE_URL có mặt
      # (không kết nối). Lịch kéo chỉ gọi API của CRM, nên một địa chỉ giả là đủ.
      - run: bun install --frozen-lockfile
        env:
          DATABASE_URL: postgresql://khong-dung@localhost:5432/khong-dung

      - name: Kéo tín hiệu, đẩy nhánh hàng chờ, giữ một PR mở
        env:
          CRM_API_URL: ${{ secrets.CRM_API_URL }}
          CRM_KHOA_KEO_TIN_HIEU: ${{ secrets.CRM_KHOA_KEO_TIN_HIEU }}
          GH_TOKEN: ${{ secrets.TIN_HIEU_TOKEN }}
        run: bun scripts/tin-hieu/lich.ts
