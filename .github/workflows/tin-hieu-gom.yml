name: Tín hiệu gom

on:
  push:
    branches: [onehub]
    paths:
      - "tin-hieu/crm/**"
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: tin-hieu-gom
  cancel-in-progress: false

jobs:
  gom:
    name: Gom tín hiệu thành PR đề xuất
    if: github.repository == 'phanlemanh/crm-onehub'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: onehub
          fetch-depth: 0
          token: ${{ secrets.TIN_HIEU_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile
        env:
          DATABASE_URL: postgresql://khong-dung@localhost:5432/khong-dung

      - name: Cài Claude Code và gói acceptance-gate
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.TIN_HIEU_TOKEN }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.304
          claude plugin marketplace add phanlemanh/acceptance-gate-kit
          claude plugin install acceptance-gate@acceptance-gate-kit

      - name: Gom tín hiệu chưa có chỗ, mở hay dựng lại PR đề xuất
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TIN_HIEU_TOKEN: ${{ secrets.TIN_HIEU_TOKEN }}
        run: bun scripts/tin-hieu/gom-lich.ts
