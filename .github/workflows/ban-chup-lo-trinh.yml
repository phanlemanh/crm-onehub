name: Bản chụp lộ trình

on:
  push:
    branches: [onehub]
    paths: [LO-TRINH.html]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ban-chup-lo-trinh
  cancel-in-progress: false

jobs:
  day:
    name: Đẩy bản chụp lộ trình sang CRM
    if: github.repository == 'phanlemanh/crm-onehub'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # @crm/db chạy prisma generate lúc cài, và prisma.config đòi DATABASE_URL có mặt
      # (không kết nối). Kịch bản đẩy chỉ gọi API của CRM, nên một địa chỉ giả là đủ.
      - run: bun install --frozen-lockfile
        env:
          DATABASE_URL: postgresql://khong-dung@localhost:5432/khong-dung

      - name: Đẩy bản chụp
        env:
          CRM_API_URL: ${{ secrets.CRM_API_URL }}
          CRM_KHOA_DAY_LO_TRINH: ${{ secrets.CRM_KHOA_DAY_LO_TRINH }}
        run: bun scripts/ban-chup-lo-trinh/day.ts
