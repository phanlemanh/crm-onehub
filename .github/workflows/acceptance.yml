name: Acceptance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [onehub, release]

permissions:
  contents: read

jobs:
  acceptance:
    name: acceptance gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Product map
        run: node scripts/product-map.mjs --root . --check

      - name: Pre-merge check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bash scripts/pre-merge-check.sh . --base "origin/${{ github.base_ref }}"
          else
            bash scripts/pre-merge-check.sh . --base "HEAD^" --no-t1-escape
          fi

  dieu-phoi:
    name: bộ điều phối
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun run test:dieu-phoi

  build:
    name: lệnh dựng
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crm_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crm_test?schema=public
      ALLOWED_SIGN_IN: example.com
      BETTER_AUTH_SECRET: ci-only-secret-regenerate-for-any-real-deployment
      API_URL: http://localhost:3001
      APP_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-only-google-client-id
      GOOGLE_CLIENT_SECRET: ci-only-google-client-secret

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - run: bun run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  agent-okr-node24:
    name: tác nhân OKR trên Node 24
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crm_test"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20

    env:
      TURBO_TELEMETRY_DISABLED: 1
      DO_NOT_TRACK: 1
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crm_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crm_test?schema=public
      ALLOWED_SIGN_IN: example.com
      BETTER_AUTH_SECRET: ci-only-secret-regenerate-for-any-real-deployment
      API_URL: http://localhost:3001
      APP_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-only-google-client-id
      GOOGLE_CLIENT_SECRET: ci-only-google-client-secret
      CRM_EVE_BAT_BUOC: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Apply migrations
        run: bun run db:deploy

      - run: bun run test -- --filter=agent-okr
