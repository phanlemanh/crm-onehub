name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, release]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  phan-loai:
    name: phân loại PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      nang: ${{ steps.pl.outputs.nang }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - run: node --test .github/scripts/test/phan-loai.test.mjs

      - id: pl
        run: node .github/scripts/phan-loai.mjs
        env:
          SU_KIEN: ${{ github.event_name }}
          NHAP: ${{ github.event.pull_request.draft }}

  check:
    name: check-types, lint
    needs: phan-loai
    if: ${{ !cancelled() && needs.phan-loai.outputs.nang != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crm_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crm_test?schema=public
      ALLOWED_SIGN_IN: example.com
      BETTER_AUTH_SECRET: ci-only-secret-regenerate-for-any-real-deployment
      API_URL: http://localhost:3001
      APP_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-only-google-client-id
      GOOGLE_CLIENT_SECRET: ci-only-google-client-secret

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - run: bun run check-types
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - run: bun run lint

      - run: bun run lint:slop

  test:
    name: test (${{ matrix.o.ten }})
    needs: phan-loai
    if: ${{ !cancelled() && needs.phan-loai.outputs.nang != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        o:
          - ten: api
            loc: --filter=api
          - ten: app-ui
            loc: --filter=app --filter=@crm/ui
          - ten: con-lai
            loc: --filter=!api --filter=!app --filter=!@crm/ui

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crm_test"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crm_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crm_test?schema=public
      ALLOWED_SIGN_IN: example.com
      BETTER_AUTH_SECRET: ci-only-secret-regenerate-for-any-real-deployment
      API_URL: http://localhost:3001
      APP_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-only-google-client-id
      GOOGLE_CLIENT_SECRET: ci-only-google-client-secret

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Apply migrations
        run: bun run db:deploy

      - run: bun run test -- ${{ matrix.o.loc }}

  ci-ok:
    name: ci-ok
    if: always()
    needs: [phan-loai, check, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: |
          pl="${{ needs.phan-loai.result }}"
          nang="${{ needs.phan-loai.outputs.nang }}"
          check="${{ needs.check.result }}"
          kiem="${{ needs.test.result }}"
          echo "phân loại: $pl · nang: $nang · check: $check · test: $kiem"
          case "$pl" in success|skipped) ;; *) exit 1 ;; esac
          if [ "$check" = success ] && [ "$kiem" = success ]; then exit 0; fi
          if [ "$pl" = success ] && [ "$nang" = false ] && [ "$check" = skipped ] && [ "$kiem" = skipped ]; then exit 0; fi
          exit 1
