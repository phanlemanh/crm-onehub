[project]
name = "listing-crawl"
version = "0.1.0"
description = "Bộ cào môi giới từ sàn nhatot cho chiến dịch tuyển đối tác"
requires-python = ">=3.12"
dependencies = [
  "crawl4ai==0.9.2",
  "lxml",
  "cssselect",
  "jsonschema",
  "transformers<5",
  "sentence-transformers<6",
  "huggingface-hub<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["listing_crawl"]
